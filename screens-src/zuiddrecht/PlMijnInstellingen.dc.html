<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>planninq: mijn instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="PlDashboard" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Planninq" version="0.2.23" active="Meldingen" height="740" sections="{{ sections }}" hint-size="900px,740px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Planninq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen in the navigation,
    // over a dimmed copy of the dashboard. Replaces the Planninq section in Nextcloud's personal settings
    // (decision 11 Oct 2026: apps ship no /settings/user page). Content: src/views/settings/UserSettings.vue.
    const sections = [
      { name: 'Meldingen', desc: 'In Nextcloud, onder de bel in de bovenbalk.', rows: [
        { switch: 'Een taak is aan mij toegewezen', on: true },
        { switch: 'Herinner me een dag voor de vervaldatum', hint: 'Hoe ver vooruit stelt de beheerder in. Nu is dat 24 uur.', on: true },
        { switch: 'Nieuwe reacties op mijn taken', on: true },
        { switch: 'Stuur deze meldingen ook per e-mail', hint: 'Naar p.jansen@zuiddrecht.nl, het adres in je Nextcloud-account.', on: false }
      ] },
      { name: 'Nextcloud Taken', desc: 'Je taken uit Planninq in Nextcloud Taken en Agenda.', rows: [
        { switch: 'Toon mijn taken in Nextcloud Taken', hint: 'Taken die aan jou zijn toegewezen staan in de lijst Planninq. Een wijziging in Planninq overschrijft een wijziging daar.', on: true },
        { text: 'CalDAV-adres', value: 'https://cloud.zuiddrecht.nl/remote.php/dav/calendars/pjansen/planninq/', action: 'Kopiëren', hint: 'Voor Thunderbird, Outlook of de agenda-app op je telefoon.' }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
