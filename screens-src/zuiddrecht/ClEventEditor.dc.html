<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: full event editor, details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2083px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The full editor on its Details tab, type, title, when, location, description and status open, colour, categories and availability folded under More, Save and Cancel pinned at the bottom of the panel. The info buttons carry the field explanations as tooltips</figcaption>
    <div style="position: relative; height: 1293px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" folded="true" hint-size="64px,1805px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">November <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 45</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CET</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
              <span style="flex: none; color: #3d4047">{{ b.number }}</span>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </main>
    <aside aria-label="Full editor" style="flex: 0 0 440px; width: 440px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid #e4e6ea">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Edit event</span>
        <div style="display: flex; gap: 2px"><button type="button" aria-label="Open the event in a window" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d='M15 3h6v6M14 10l7-7M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6'></path></svg></button><a href="ClEvent.dc.html" aria-label="Close the editor" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a></div>
      </div>
      <div role="tablist" aria-label="Parts of the event" style="flex: none; display: flex; gap: 4px; padding: 12px 16px 0; border-bottom: 1px solid #828a95"><button type="button" role="tab" aria-selected="true" style="flex: none; min-height: 34px; padding: 8px 12px; border: 1px solid #828a95; border-bottom: 1px solid #ffffff; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: #ffffff; color: #1b1c1d; font: 700 14px 'Fira Sans', sans-serif; white-space: nowrap">Details</button><button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 34px; padding: 8px 12px; border: 1px solid #828a95; border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: #eef0f3; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap">People</button><button type="button" role="tab" aria-selected="false" style="flex: none; min-height: 34px; padding: 8px 12px; border: 1px solid #828a95; border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: #eef0f3; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap">Reminders, files and video call</button></div>
      <form style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding: 16px 16px 0; overflow: hidden">
<section style="display: flex; flex-direction: column; gap: 10px; padding: 0 0 16px; border-top: 0"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Type</h3><button type="button" aria-label="About this field" title="Focus time blocks your availability, out of office answers invitations for you. Birthday is set from your contacts, not chosen here." style="flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg></button></div><div role="radiogroup" aria-label="Change the type of this event" style="display: flex; gap: 6px"><button type="button" role="radio" aria-checked="true" style="flex: 1 1 0; height: 34px; padding: 0 8px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Event</button><button type="button" role="radio" aria-checked="false" style="flex: 1 1 0; height: 34px; padding: 0 8px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 14px 'Fira Sans', sans-serif; white-space: nowrap">Focus time</button><button type="button" role="radio" aria-checked="false" style="flex: 1 1 0; height: 34px; padding: 0 8px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 14px 'Fira Sans', sans-serif; white-space: nowrap">Out of office</button><button type="button" role="radio" aria-checked="false" style="flex: 1 1 0; height: 34px; padding: 0 8px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 14px 'Fira Sans', sans-serif; white-space: nowrap; color: #5e6168; background: #f5f6f8" aria-disabled="true">Birthday</button></div></section><section style="display: flex; flex-direction: column; gap: 10px; padding: 14px 0 16px; border-top: 1px solid #e4e6ea"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Title</h3><button type="button" aria-label="About this field" title="Customers calendar, linked to MILESTONE #58500 Go-live Lyon phase 2" style="flex: none; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 10px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 16v-4M12 8h.01"></path></svg></button></div><input id="cl-ed-title" type="text" value="Go-live Lyon phase 2, on site" aria-label="Title" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0; font-weight: 600"></section><section style="display: flex; flex-direction: column; gap: 10px; padding: 14px 0 16px; border-top: 1px solid #e4e6ea"><h3 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">When</h3><div style="display: flex; flex-direction: column; gap: 10px"><div style="display: flex; gap: 8px; align-items: flex-end"><label style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 0; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Start</span><input id="cl-ed-start" type="text" value="Mon 2 Nov 2026" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label><label style="display: flex; flex-direction: column; gap: 6px; flex: 0 0 64px; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Time</span><input id="cl-ed-start-t" type="text" value="08:00" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label><div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 0; min-width: 0"><label for="cl-ed-start-tz" style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Time zone</label><button id="cl-ed-start-tz" type="button" aria-haspopup="listbox" aria-label="Time zone of the start" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span style="overflow: hidden; text-overflow: ellipsis">Europe/Paris</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168; flex: none"><path d="m6 9 6 6 6-6"></path></svg></button></div></div><div style="display: flex; gap: 8px; align-items: flex-end"><label style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 0; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">End</span><input id="cl-ed-end" type="text" value="Tue 3 Nov 2026" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label><label style="display: flex; flex-direction: column; gap: 6px; flex: 0 0 64px; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Time</span><input id="cl-ed-end-t" type="text" value="16:00" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label><div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 0; min-width: 0"><label for="cl-ed-end-tz" style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Time zone</label><button id="cl-ed-end-tz" type="button" aria-haspopup="listbox" aria-label="Time zone of the end" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span style="overflow: hidden; text-overflow: ellipsis">Europe/London</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168; flex: none"><path d="m6 9 6 6 6-6"></path></svg></button></div></div><span style="font-size: 13px; color: #5e6168; line-height: 18px; margin-top: -4px">17:00 in your <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2070}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 72; // one hour in px, 08:00 to 18:00
    const OFF = 14; // top offset so the 08:00 label is not clipped
    const NOW = 9; // not this week: the editor shows week 45, 2 to 8 November
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'] };
    const CAL = { personal: '#3669a5', team: '#538b28', customers: '#ff9d2e', red: '#ab0000' };
    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';
    const dark = (c) => 'color-mix(in srgb, ' + c + ' 60%, #1b1c1d)';
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (t) => pad(Math.floor(t)) + ':' + pad(Math.round((t % 1) * 60));
    const hours = [];
    for (let i = 0; i <= 16; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(7 + i),
        lineStyle: 'position: absolute; left: 84px; right: 0; top: ' + top + 'px; border-top: 1px solid #eef0f3',
        localStyle: 'position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right',
        utcStyle: 'position: absolute; left: 42px; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; opacity: 0.6; text-align: right'
      });
    }
    const nowTop = (NOW - 8) * H + OFF;
    const nowLabelTop = nowTop - 8;
    // meeting block: [title, start, duration in hours, options {cal, chip:[type, number, status], video, flag, selected, past, pending}]
    const ev = (title, start, dur, o = {}) => {
      const c = CAL[o.cal ?? 'personal'];
      const short = dur <= 0.5;
      const end = start + dur;
      const pending = !!o.pending;
      return {
        title, href: o.chip && o.chip[1] === '#58412' ? 'ClEvent.dc.html' : '#',
        aria: title + ', ' + fmt(start) + ' to ' + fmt(end) + (pending ? ', not answered yet' : '') + (o.past ? ', over' : ''), current: o.selected ? 'true' : 'false',
        titleStyle: 'flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; ' + (short ? 'white-space: nowrap; text-overflow: ellipsis;' : 'display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;'),
        time: short ? fmt(start) : fmt(start) + ' to ' + fmt(end), inlineTime: short, blockTime: !short,
        flag: !!o.flag, video: !!o.video,
        hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '',
        style: 'position: absolute; left: 2px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; justify-content: ' + (short ? 'center' : 'flex-start') + '; padding: ' + (short ? '0 6px' : '4px 7px') + '; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; text-decoration: none; z-index: 1; color: ' + dark(c) + '; ' +
          (pending ? 'background: #ffffff; border: 1px solid color-mix(in srgb, ' + c + ' 40%, #ffffff); border-left: 3px solid ' + c + '; opacity: 0.6;' : 'background: ' + pale(c) + '; border-left: 3px solid ' + c + ';') +
          (o.past ? ' opacity: 0.55;' : '') + (o.selected ? ' box-shadow: 0 0 0 2px #3669a5;' : '')
      };
    };
    const standup = (past) => ev('Stand-up', 10, 0.25, { cal: 'personal', past });
    // week 45: the event being edited spans Monday 08:00 to Tuesday 17:00 CET, drawn in its own colour (red) and outlined
    const perDay = [
      [ev('Go-live Lyon phase 2, on site', 8, 16, { cal: 'red', chip: ['MILESTONE', '', 'new'], selected: true })],
      [ev('Go-live Lyon phase 2, on site', 8, 9, { cal: 'red', chip: ['MILESTONE', '', 'new'], selected: true })],
      [standup(false)],
      [standup(false), ev('Rollout review Lyon, phase 2', 14, 1, { cal: 'customers', chip: ['FEATURE', '#58412', 'in development'], video: true })],
      [standup(false)],
      [], []
    ];
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = false;
      const weekend = i >= 5;
      return {
        name, n: 2 + i, today, events: perDay[i],
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : 'color: #1b1c1d; font-weight: 500',
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    // all-day bars: [type, number, subject, lane, startCol, endCol (inclusive), leftOpen, rightOpen, handles]
    const bars = [
      ['MILESTONE', '', 'Go-live Lyon phase 2, 3 Nov', 0, 1, 1, false, false, false],
      ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout, 5 to 30 Nov', 1, 3, 6, false, true, false]
    ].map(([type, number, subject, lane, s, e, leftOpen, rightOpen, handles]) => {
      const c = TYPE[type];
      const left = leftOpen ? '0px' : 'calc(100% * ' + s + ' / 7 + 2px)';
      const width = 'calc(100% * ' + (e - s + 1) + ' / 7' + (leftOpen ? '' : ' - 2px') + (rightOpen ? '' : ' - 4px') + ')';
      return {
        type, number, subject, color: c, leftOpen, rightOpen, handles,
        aria: type + ' ' + number + ', ' + subject,
        style: 'position: absolute; top: ' + (6 + lane * 24) + 'px; left: ' + left + '; width: ' + width + '; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-left: 3px solid ' + c + '; border-radius: 4px; background: ' + pale(c) + '; font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden'
      };
    });
    const dot = (st) => 'flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: ' + st[0] + '; border: 1.5px solid ' + st[1];
    const adot = (st) => 'flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: ' + st[0] + '; border: 1.5px solid ' + st[1];
    const attendees = [
      ['Tom Achterberg', 'TA', 'organiser', ['#d3f9d8', '#8ff09c']],
      ['Marc Dubois', 'MD', 'accepted', ['#d3f9d8', '#8ff09c']],
      ['Priya Raman', 'PR', 'maybe', ['#ffc078', '#ff9d2e']],
      ['Olivia Brandt (you)', 'OB', 'no answer yet', ['#dee2e6', '#adb5bd']]
    ].map(([name, initials, answer, st]) => ({ name, initials, answer, dot: adot(st) }));
    return { hours, days, bars, nowTop, nowLabelTop, attendees };
  }
