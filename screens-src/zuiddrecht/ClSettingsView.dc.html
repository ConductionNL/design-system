; text-decoration: none">Change in your workspace settings<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M14 10l7-7M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a></div></div>

le="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-view-monthlimit" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">Events per day in month view</span><span style="font-size: 13px; color: #5e6168; line-height: 19px">After this number a day shows a link such as "3 more".</span></label><button id="cl-view-monthlimit" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 160px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>3 events</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div><fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0; float: left; width: 100%; font-weight: 600">Time slot size</legend><p style="margin: 0 0 4px; font-size: 13px; color: #5e6168; line-height: 19px">How fine the time grid is. You can also zoom the grid with Ctrl and scroll.</p><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-view-slot" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">15 minutes</label><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-view-slot" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">30 minutes</label><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-view-slot" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">60 minutes</label></fieldset><fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0; float: left; width: 100%; font-weight: 600">A click on an event opens</legend><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-view-editor" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">The quick popover, with the fields you use most</label><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-view-editor" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">The full editor, with every field</label></fieldset><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-view-maps" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">Open locations in</span><span style="font-size: 13px; color: #5e6168; line-height: 19px">A location on an event becomes a link to this maps app.</span></label><button id="cl-view-maps" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 200px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>OpenStreetMap</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div></div></div>
        </div>
      </section>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5264}}'>
class Component extends DCLogic {
  renderVals() {
    const switchOn = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff';
    const switchOff = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid #c4c7cb; border-radius: 12px; background: #ffffff; box-sizing: border-box; cursor: pointer';
    const knobOff = 'position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #5e6168';
    // dimmed week behind the dialog, simplified from ClWeek
    const H = 72, OFF = 14;
    const CAL = { personal: '#3669a5', team: '#538b28', customers: '#ff9d2e' };
    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';
    const dark = (c) => 'color-mix(in srgb, ' + c + ' 60%, #1b1c1d)';
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (t) => pad(Math.floor(t)) + ':' + pad(Math.round((t % 1) * 60));
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(6 + i),
        lineStyle: 'position: absolute; left: 84px; right: 0; top: ' + top + 'px; border-top: 1px solid #eef0f3',
        localStyle: 'position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right',
        utcStyle: 'position: absolute; left: 42px; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; opacity: 0.6; text-align: right'
      });
    }
    const ev = (title, start, dur, cal) => {
      const c = CAL[cal];
      return { title, time: fmt(start) + ' to ' + fmt(start + dur), style: 'position: absolute; left: 2px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; padding: 4px 7px; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; color: ' + dark(c) + '; background: ' + pale(c) + '; border-left: 3px solid ' + c };
    };
    const standup = ev('Stand-up', 10, 0.5, 'personal');
    const perDay = [
      [ev('Week planning', 8, 0.75, 'personal'), standup],
      [standup, ev('Demo preparation Malmo Energi', 11, 1, 'customers')],
      [standup, ev('Release 16.5 scope review', 9.5, 1.5, 'team')],
      [standup, ev('Rollout review Lyon, phase 2', 14, 1, 'customers')],
      [standup, ev('Submit October hours', 17, 0.5, 'personal')],
      [], []
    ];
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = i === 0, weekend = i >= 5;
      return {
        name, n: 12 + i, events: perDay[i],
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : 'color: #1b1c1d; font-weight: 500',
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    const favouriteZones = [
      ['Europe/Amsterdam, CEST', 'Your time zone', '09:00'],
      ['Europe/Stockholm, CEST', 'Malmo Energi', '09:00'],
      ['America/New_York, EDT', 'OpenProject core, Tom', '03:00']
    ].map(([name, why, now]) => ({ name, why, now }));
    return { switchOn, knobOn, switchOff, knobOff, hours, days, favouriteZones };
  }
}
</script>
