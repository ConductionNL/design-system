<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Flow: stappaneel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<aside data-or-flow="stap" aria-label="Instellingen van de stap" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 12px; box-shadow: 0 4px 16px rgba(27,28,29,0.12); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: flex-start; gap: 10px">
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 13px; color: #5e6168">{{ kind }}</span>
      <h2 style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25">{{ title }}</h2>
    </div>
    <button type="button" aria-label="Zijpaneel sluiten" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px; background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"></path></svg></button>
  </div>
  <sc-if value="{{ hasAdmin }}" hint-placeholder-val="{{ false }}"><div role="note" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #fff4de; color: #7a4f00"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z"></path></svg><span style="font-size: 13px; line-height: 1.45">{{ admin }}</span></div></sc-if>
  <div style="display: flex; flex-direction: column; gap: 5px">
    <label for="orfl-stap-naam" style="font-size: 13px; font-weight: 600">Naam van de stap</label>
    <input id="orfl-stap-naam" type="text" value="{{ title }}" style="height: 38px; box-sizing: border-box; padding: 0 10px; border: 1px solid #828a95; border-radius: 8px; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d">
  </div>
  <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 5px">
      <label for="{{ f.id }}" style="font-size: 13px; font-weight: 600">{{ f.label }}</label>
      <sc-if value="{{ f.isSelect }}" hint-placeholder-val="{{ false }}"><select id="{{ f.id }}" style="height: 38px; box-sizing: border-box; padding: 0 8px; border: 1px solid #828a95; border-radius: 8px; background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d"><option>{{ f.value }}</option></select></sc-if>
      <sc-if value="{{ f.isArea }}" hint-placeholder-val="{{ false }}"><textarea id="{{ f.id }}" rows="3" style="box-sizing: border-box; padding: 8px 10px; border: 1px solid #828a95; border-radius: 8px; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d; resize: vertical">{{ f.value }}</textarea></sc-if>
      <sc-if value="{{ f.isText }}" hint-placeholder-val="{{ true }}"><input id="{{ f.id }}" type="text" value="{{ f.value }}" style="height: 38px; box-sizing: border-box; padding: 0 10px; border: 1px solid #828a95; border-radius: 8px; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d"></sc-if>
      <sc-if value="{{ f.isCode }}" hint-placeholder-val="{{ false }}"><pre id="{{ f.id }}" style="margin: 0; padding: 10px 12px; border: 1px solid #e4e6ea; border-radius: 8px; background: #f5f6f8; font: 400 12.5px/1.5 ui-monospace, 'Fira Mono', monospace; color: #1b1c1d; white-space: pre-wrap; overflow-wrap: anywhere">{{ f.value }}</pre></sc-if>
      <sc-if value="{{ f.hasHelp }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5e6168; line-height: 1.4">{{ f.help }}</span></sc-if>
    </div>
  </sc-for>
  <sc-if value="{{ hasContinue }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #f5f6f8">
    <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 3px">
      <span id="orfl-stap-doorgaan" style="font-size: 14px; font-weight: 600">Doorgaan bij fout</span>
      <span style="font-size: 12px; color: #5e6168; line-height: 1.4">{{ continueText }}</span>
    </div>
    <button type="button" role="switch" aria-checked="{{ continueOn }}" aria-labelledby="orfl-stap-doorgaan" style="{{ continueTrack }}"><span style="{{ continueKnob }}"></span></button>
  </div>
  </sc-if>
  <sc-if value="{{ hasRecent }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #eef0f3">
    <h3 style="margin: 0; font-size: 14px; font-weight: 700">Recente logregels van deze stap</h3>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ recent }}" as="l" hint-placeholder-count="3">
        <li style="display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; font-size: 13px"><span style="{{ l.pill }}">{{ l.level }}</span><span style="color: #5e6168; font-variant-numeric: tabular-nums">{{ l.when }}</span><span style="grid-column: 1 / -1; line-height: 1.4">{{ l.msg }}</span></li>
      </sc-for>
    </ul>
    <a href="{{ runHref }}" style="font-size: 13px; font-weight: 600">Laatste uitvoering op het canvas openen</a>
  </div>
  </sc-if>
  <div style="margin-top: auto; display: flex; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid #eef0f3">
    <button type="button" style="height: 36px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font: 600 14px 'Fira Sans', sans-serif; color: #a30000">Stap verwijderen</button>
    <button type="button" style="height: 36px; padding: 0 16px; border: 0; border-radius: 8px; background: #3669a5; color: #ffffff; font: 600 14px 'Fira Sans', sans-serif">Klaar</button>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"text","default":"Bericht · E-mail sturen"},"title":{"editor":"text","default":"Melder bevestigen"},"fields":{"editor":null,"default":[["Versturen naar","Het e-mailadres uit het record","select"],["Sjabloon","Ontvangstbevestiging","select","Bevat het kenmerk en de datum waarop we verwachten te antwoorden."],["Onderwerp","We hebben uw melding ontvangen"]]},"continue":{"editor":null,"default":true},"continueText":{"editor":"text","default":"Mislukt het versturen, leg dan een waarschuwing vast en ga door naar de volgende stap."},"recent":{"editor":null,"default":[["Geslaagd","vandaag 10:12","Ontvangstbevestiging voor MOR-2026-04812 verstuurd."],["Geslaagd","vandaag 10:07","Ontvangstbevestiging voor MOR-2026-04811 verstuurd."],["Info","gisteren 17:20","Geen e-mailadres op MOR-2026-04790, niets verstuurd."]]},"runHref":{"editor":"text","default":"OrFlowRun.dc.html"},"admin":{"editor":"text","default":""},"$preview":{"width":352,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const J = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return d; } } return v; };
    const B = (v) => v === true || v === 'true';
    const pill = (lv) => { const c = { Geslaagd: ['#e7f3ea', '#1e6b2a'], Waarschuwing: ['#fff4de', '#7a4f00'], Info: ['#eaf0f7', '#234a78'], Mislukt: ['#fcedec', '#a30000'], Wacht: ['#e3f1f3', '#1d5e66'] }[lv] || ['#f0f1f3', '#3d4047']; return 'display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; background: ' + c[0] + '; color: ' + c[1]; };
    const fields = J(p.fields, []).map((f, i) => { const [label, value, widget, help] = Array.isArray(f) ? f : [f.label, f.value, f.widget, f.help]; const w = widget || 'text'; return { id: 'orfl-stap-veld-' + i, label, value: value == null ? '' : value, isSelect: w === 'select', isArea: w === 'textarea', isCode: w === 'code', isText: w === 'text', hasHelp: !!help, help: help || '' }; });
    const on = B(p.continue);
    const recent = J(p.recent, []).map((l) => ({ level: l[0], when: l[1], msg: l[2], pill: pill(l[0]) }));
    return {
      kind: p.kind, title: p.title, fields,
      hasAdmin: !!p.admin, admin: p.admin,
      hasContinue: p.continue !== 'none', continueOn: on ? 'true' : 'false', continueText: p.continueText,
      continueTrack: 'flex: none; position: relative; width: 40px; height: 22px; border: 7px solid transparent; background-clip: padding-box; box-sizing: content-box; margin: -7px; padding: 0; border-radius: 18px; background-color: ' + (on ? '#3669a5' : '#828a95'),
      continueKnob: 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 16px; height: 16px; border-radius: 8px; background: #ffffff',
      hasRecent: recent.length > 0, recent, runHref: p.runHref || '#',
    };
  }
}
</script>
</body>
</html>
