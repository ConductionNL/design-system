<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>pipelinq: persoonlijke instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="PqDashboard" hint-size="100%,1251px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Pipelinq" version="0.5.7" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Pipelinq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen in the navigation.
    // Replaces the Pipelinq section drawn inside Nextcloud's personal settings (decision 11 Oct 2026). Same sections
    // as PqSynchronisatie, which shows this dialog scrolled to E-mail en agenda.
    const sections = [
      { name: 'Meldingen', desc: 'Wat je bereikt, en waar. Een termijnwaarschuwing op een ticket krijg je altijd.', rows: [
        { matrix: 'Melding', cols: ['In de stroom', 'Per e-mail'], lines: [
          ['Een lead, ticket of taak is aan jou gegeven', [true, false]],
          ['Iets van jou gaat naar een andere fase, of is gewonnen of verloren', [true, true]],
          ['Iemand noemt je of zet een notitie bij je werk', [true, false]]
        ] }
      ] },
      { name: 'Contacten', desc: 'Je records in Pipelinq en je Nextcloud-adresboek.', rows: [
        { facts: [['Status', 'Gesynchroniseerd'], ['Gekoppeld', '412 inwoners, bedrijven en contacten'], ['Laatste keer', '7 okt 2026, 09:12, 3 kaarten bijgewerkt'], ['Adresboek', 'Pipelinq CRM']] },
        { note: 'Nieuwe kaarten komen hier. Andere adresboeken worden alleen gelezen.', tone: 'plain' },
        { switch: 'Wijzigingen terugschrijven naar Nextcloud Contacten', hint: 'Sla je een inwoner, bedrijf of contact op, dan krijgt de kaart de wijziging ook.', on: true },
        { note: 'Kon niet worden geschreven: Bakkerij De Graaf', tone: 'warn' },
        { buttons: [['Nu synchroniseren', ''], ['Importeren uit Nextcloud Contacten', '']] }
      ] },
      { name: 'E-mail en agenda', desc: 'Mail en afspraken gekoppeld aan je klanten. De mail zelf blijft in Nextcloud Mail.', rows: [
        { switch: 'E-mailsynchronisatie aanzetten', hint: 'Mail uit het gekozen account komt bij het contact met hetzelfde e-mailadres.', on: true },
        { radios: 'Account', options: [['p.jansen@zuiddrecht.nl', 'Persoonlijke mailbox', true], ['klantcontact@zuiddrecht.nl', 'Gedeelde mailbox van klantcontact', false]] },
        { text: 'Overslaan, kommagescheiden', value: 'noreply@zuiddrecht.nl, nieuwsbrief@zuiddrecht.nl', hint: 'Mail van of naar deze adressen wordt niet gekoppeld.' },
        { facts: [['Laatste keer', 'vandaag om 09.40'], ['Gekoppeld', '14 van 52 mails bij de laatste keer'], ['Laatste fout', 'geen']] },
        { note: 'Pipelinq bewaart onderwerp, afzender en datum. De inhoud lees je in Nextcloud Mail.', tone: 'plain' },
        { buttons: [['Nu synchroniseren', '']] }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['KvK API, persoonlijke sleutel', 'Prospectverkenning · toegevoegd 12 september', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] },
      { name: 'Rondleiding', desc: 'Aan de slag: 13 stappen, van een klant tot een gefactureerd contract. Je rondde hem af op 3 september.', rows: [
        { buttons: [['Rondleiding opnieuw starten', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
