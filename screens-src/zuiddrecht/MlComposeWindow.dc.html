<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: new message in a compose window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2900px; padding: 0 0 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; min-width: 0">
    <div style="position: relative; height: 1160px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="264px,1115px"></dc-import></div>
        <div style="flex: 1 1 0; min-width: 0; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="" wide="true" hint-size="1195px,805px"></dc-import></div>
      </div>
      <section aria-label="Minimised compose window: Re: Gantt export cuts off the last week" style="position: absolute; right: 724px; bottom: 0; width: 300px; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 16px; background: #234a78; color: #ffffff; border-radius: var(--sc-radius-lg, 10px) var(--sc-radius-lg, 10px) 0 0; box-shadow: 0 -4px 16px rgba(27,28,29,0.16); z-index: 5">
        <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Re: Gantt export cuts off the last week</span>
        <button type="button" aria-label="Reopen this message" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
        <button type="button" aria-label="Close Re: Gantt export cuts off the last week" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </section>
      <section aria-label="Compose window: New message" style="position: absolute; right: 24px; bottom: 0; width: 680px; height: 810px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-bottom: 0; border-radius: var(--sc-radius-lg, 10px) var(--sc-radius-lg, 10px) 0 0; box-shadow: 0 -4px 16px rgba(27,28,29,0.16); z-index: 6">
        <div style="flex: none; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 16px; background: #234a78; color: #ffffff; border-radius: var(--sc-radius-lg, 10px) var(--sc-radius-lg, 10px) 0 0">
          <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">New message</span>
          <span style="font-size: 12px; color: #ffffff; opacity: 0.8; white-space: nowrap; margin-right: 6px">2 messages open</span>
          <sc-for list="{{ heads }}" as="h" hint-placeholder-count="4"><button type="button" aria-label="{{ h.label }}" title="{{ h.label }}" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ h.icon }}"></path></svg></button></sc-for>
        </div>
        <div style="display: flex; flex-direction: column; font-size: 14px">
          <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-bottom: 1px solid #e4e6ea"><span style="flex: none; width: 56px; color: #5e6168">From</span><button type="button" aria-haspopup="menu" aria-label="Send from olivia@northwind-projects.test, change the account or alias" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px 0 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap">Olivia Brandt, olivia@northwind-projects.test<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
          <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-bottom: 1px solid #e4e6ea">
            <label for="cw-to" style="flex: none; width: 56px; color: #5e6168">To</label>
            <span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 3px 0 3px; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #1b1c1d; font-size: 12px; white-space: nowrap"><span style="width: 18px; height: 18px; border-radius: 9px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">MD</span><button type="button" aria-expanded="false" aria-label="Contact details for Marc Dubois" style="border: 0; background: transparent; padding: 0; font: 400 12px 'Fira Sans', sans-serif; color: #1b1c1d; text-decoration: underline; text-decoration-color: #c4c7cb; text-underline-offset: 2px">Marc Dubois</button><button type="button" aria-label="Remove Marc Dubois" style="width: 18px; height: 18px; border: 0; border-radius: 9px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
            <span aria-label="Group Lyon project team, 4 members, every member receives this message" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 3px 0 3px; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #1b1c1d; font-size: 12px; white-space: nowrap"><span style="width: 18px; height: 18px; border-radius: 9px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Lyon project team<span style="font-size: 11px; color: #5e6168">4</span><button type="button" aria-label="Remove Lyon project team" style="width: 18px; height: 18px; border: 0; border-radius: 9px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
            <input id="cw-to" type="text" aria-label="Add a recipient" aria-expanded="false" aria-autocomplete="list" style="flex: 1 1 auto; min-width: 0; height: 24px; border: 0; background: transparent; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d">
            <span style="flex: none; display: inline-flex; gap: 2px"><button type="button" aria-pressed="true" aria-label="Hide the Cc row" style="height: 28px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Cc</button><button type="button" aria-pressed="true" aria-label="Hide the Bcc row" style="height: 28px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Bcc</button></span>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-bottom: 1px solid #e4e6ea"><label for="cw-cc" style="flex: none; width: 56px; color: #5e6168">Cc</label><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 3px 0 3px; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #1b1c1d; font-size: 12px; white-space: nowrap"><span style="width: 18px; height: 18px; border-radius: 9px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">TA</span>Tom Achterberg<button type="button" aria-label="Remove Tom Achterberg" style="width: 18px; height: 18px; border: 0; border-radius: 9px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span><input id="cw-cc" type="text" aria-label="Add a copy recipient" style="flex: 1 1 auto; min-width: 0; height: 24px; border: 0; background: transparent; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d"></div>
          <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-bottom: 1px solid #e4e6ea"><label for="cw-bcc" style="flex: none; width: 56px; color: #5e6168">Bcc</label><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 3px 0 3px; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #1b1c1d; font-size: 12px; white-space: nowrap"><span style="width: 18px; height: 18px; border-radius: 9px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">PR</span>Priya Raman<button type="button" aria-label="Remove Priya Raman" style="width: 18px; height: 18px; border: 0; border-radius: 9px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span><input id="cw-bcc" type="text" aria-label="Add a blind copy recipient" style="flex: 1 1 auto; min-width: 0; height: 24px; border: 0; background: transparent; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d"></div>
          <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-bottom: 1px solid #e4e6ea"><label for="cw-subject" style="flex: none; width: 56px; color: #5e6168">Subject</label><input id="cw-subject" type="text" value="Kick-off Lyon phase 2 moves to the afternoon" style="flex: 1 1 auto; min-width: 0; height: 24px; border: 0; background: transparent; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d"></div>
        </div>
        <div aria-label="Message body" role="textbox" aria-multiline="true" contenteditable="true" style="flex: 1 1 auto; min-height: 120px; overflow: hidden; padding: 12px 16px; font-size: 14px; line-height: 21px; color: #1b1c1d; outline: 0">
          <p style="margin: 0 0 10px">Hi Marc,</p>
          <p style="margin: 0 0 10px">Confirmed: the kick-off on Monday 2 November moves to 14:00 to 16:00 at your office. The agenda and the updated rollout plan are attached, the OIDC settings come from Tom.</p>
          <p style="margin: 0">Best regards,<br>Olivia</p>
        </div>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 8px 14px 10px; border-top: 1px solid #e4e6ea">
          <div style="display: flex; align-items: center; gap: 6px; height: 36px">
            <span style="flex: 1 1 auto; font-size: 12px; font-weight: 600; color: #5e6168">4 attachments, 2.3 MB</span>
            <span style="position: relative; display: inline-flex"><button type="button" aria-haspopup="menu" aria-expanded="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>Attach<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
              <div role="menu" aria-label="Attach" style="position: absolute; right: 0; bottom: 38px; width: 300px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 2px">
                <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg><span style="flex: 1 1 auto">From this computer</span></button>
                <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span style="flex: 1 1 auto">From Files</span><span style="font-size: 12px; color: #5e6168">your file storage</span></button>
              </div></span>
          </div>
          <sc-for list="{{ files }}" as="f" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px">
              <span style="{{ f.badge }}">{{ f.ext }}</span>
              <span style="flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ f.name }}</span>
              <sc-if value="{{ f.progress }}" hint-placeholder-val="{{ true }}"><span role="progressbar" aria-label="Uploading, 64%" aria-valuenow="64" aria-valuemin="0" aria-valuemax="100" style="flex: 0 0 120px; width: 120px; height: 6px; border-radius: 3px; background: #eef0f3; overflow: hidden"><span style="display: block; width: 64%; height: 100%; background: var(--sc-action, #3669a5)"></span></span></sc-if>
              <span style="flex: 1 1 auto; min-width: 0; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; {{ f.metaStyle }}">{{ f.meta }}</span>
              <sc-if value="{{ f.hasAction }}" hint-placeholder-val="{{ false }}"><button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">{{ f.action }}</button></sc-if>
              <sc-if value="{{ f.failed }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Retry the upload of kickoff-agenda.docx" style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>Retry</button></sc-if>
              <button type="button" aria-label="{{ f.remove }}" title="{{ f.remove }}" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
          </sc-for>
          <div style="margin-top: 4px; height: 44px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 12px; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>Drop files here, or paste them into the message</div>
        </div>
        <div role="toolbar" aria-label="Formatting" style="display: flex; align-items: center; gap: 2px; padding: 4px 10px; border-top: 1px solid #e4e6ea">
          <sc-for list="{{ fmt }}" as="f" hint-placeholder-count="6"><button type="button" aria-label="{{ f.label }}" title="{{ f.label }}" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ f.icon }}"></path></svg></button></sc-for>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid #e4e6ea">
          <span style="display: inline-flex">
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px) 0 0 var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"></path></svg>Send</button>
            <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More ways to send" style="width: 34px; height: 40px; border: 1px solid var(--sc-action-deep, #234a78); border-left: 0; border-radius: 0 var(--sc-radius, 8px) var(--sc-radius, 8px) 0; background: var(--sc-action, #3669a5); color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
          </span>
          <span style="flex: 1 1 auto"></span>
          <span style="font-size: 12px; color: #5e6168">Draft saved 09:41</span>
          <button type="button" aria-label="Discard this draft" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Discard</button>
        </div>
      </section>
    </div>
    <figcaption style="padding: 8px 24px 0; font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;A new message in a docked window, 680 px, over the inbox at the browse level. A second message is minimised beside it. The Attach menu is open above the attachments; each file row carries its own Send as a link or Attach instead.</figcaption>
  </figure>
  <div style="display: grid; grid-template-columns: 680px 680px; gap: 24px; padding: 0 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The recipient suggestions open while typing: from the address book first, then earlier correspondents</figcaption>
