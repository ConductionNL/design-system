<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: one person with addresses, limits, folders and sign-in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2990px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The page of one person, Addresses tab open: one table of addresses, with the danger block below the card</figcaption>
    <div style="position: relative; height: 1150px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Administration" placeholder="Search domains, mailboxes or settings" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Mailboxes" hint-size="264px,1080px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">
          <nav aria-label="Breadcrumb" style="font-size: 13px; color: #5e6168; display: flex; align-items: center; gap: 6px"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">Domains</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">northwind-projects.test</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">Mailboxes</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><span aria-current="page">Olivia Brandt</span></nav>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
            <div style="display: flex; align-items: center; gap: 14px; min-width: 0">
              <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 22px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font: 700 15px 'Fira Sans', sans-serif">OB</span>
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Olivia Brandt</h1>
                <p style="margin: 0; color: #3d4047">olivia@northwind-projects.test, personal mailbox, delivery lead. 3.4 GB of 10 GB in use, signed in today at 07:02.</p>
              </div>
            </div>
            <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; font-size: 13px; color: #3d4047"><span style="{{ D.ok }}"></span>Active, 3 live sessions</span>
          </div>

          <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); display: flex; flex-direction: column">
            <div role="tablist" aria-label="Person sections" style="flex: none; display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid #c4c7cb">
              <sc-for list="{{ tabsA }}" as="t" hint-placeholder-count="6"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
            </div>
            <div role="tabpanel" aria-label="Addresses" style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
                <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Main address</span><span style="font-size: 15px">olivia@northwind-projects.test</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">Rename moves all mail, folders and settings to the new name. The old address can stay as an extra address so nothing bounces.</span></div>
                <button type="button" style="{{ compact }}">Rename</button>
              </div>

              <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #e4e6ea">
                <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
                  <div style="display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Addresses</h3><p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Mail to an extra address lands in this mailbox. Olivia may send only from the addresses marked May send, with the sender name shown; a message from any other address is refused. She sees the same list under Signatures and sender names in her own settings.</p></div>
                  <div style="display: flex; gap: 8px">
                    <button type="button" style="{{ compact }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add extra address</button>
                    <button type="button" style="{{ compact }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add sender name to an address</button>
                  </div>
                </div>
                <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px">
                  <thead><tr style="background: #fafbfc"><th scope="col" style="{{ th }}">Address</th><th scope="col" style="{{ th }}">Kind</th><th scope="col" style="{{ th }}">Sender name</th><th scope="col" style="{{ th }}">May send</th><th scope="col" style="{{ th }}">Added</th><th scope="col" style="width: 230px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
                  <tbody>
                    <sc-for list="{{ addresses }}" as="e" hint-placeholder-count="5">
                      <tr style="border-top: 1px solid #eef0f3">
                        <td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600; white-space: nowrap">{{ e.address }}</td>
                        <td style="padding: 14px 16px; line-height: 20px; color: #3d4047; white-space: nowrap">{{ e.kind }}</td>
                        <td style="padding: 14px 16px; line-height: 20px; color: #3d4047">{{ e.sender }}</td>
                        <td style="padding: 14px 16px; line-height: 20px; color: #3d4047; white-space: nowrap">{{ e.may }}</td>
                        <td style="padding: 14px 16px; line-height: 20px; color: #5e6168">{{ e.added }}</td>
                        <td style="padding: 7px 16px; line-height: 20px; text-align: right; white-space: nowrap"><sc-if value="{{ e.own }}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Edit sender name of {{ e.address }}" style="{{ btnSmall }}">Edit name</button> <button type="button" aria-label="Remove extra address {{ e.address }}" style="{{ btnSmall }}">Remove</button></sc-if><sc-if value="{{ e.elsewhere }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5e6168">{{ e.where }}</span></sc-if></td>
                      </tr>
                    </sc-for>
                  </tbody>
                </table></div>
              </div>
            </div>
          </div>

          <section aria-labelledby="ml-per-danger" style="background: #ffffff; border: 1px solid #e4e6ea; border-left: 3px solid #cc0000; border-radius: var(--sc-radius, 8px); padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">
            <h2 id="ml-per-danger" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Danger zone</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px">
              <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
                <span style="font-weight: 500">Remove this mailbox</span>
                <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Olivia can no longer sign in to mail and her address stops receiving. Her mail stays recoverable for 30 days under Queues and recovery, tab Recovery.</p>
                <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Remove mailbox</button>
              </div>
              <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-left: 24px; border-left: 1px solid #eef0f3">
                <span style="font-weight: 500">Delete everything the server holds about Olivia Brandt</span>
                <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">All mail, folders, filters, identities and sign-in data, and the mailbox itself, at once. Shared mailboxes she has access to stay. This cannot be undone and asks you to type her address first.</p>
                <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Delete all data of this person</button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </figure>

  <div style="display: grid; grid-template-columns: 1fr 1.4fr; gap: 24px; min-width: 0">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Limits tab: the storage chain (server default, domain, this person), number of messages and space for filter scripts</figcaption>
      <div style="background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 700px; box-sizing: border-box">
        <div role="tablist" aria-label="Person sections" style="flex: none; display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid #c4c7cb">
          <sc-for list="{{ tabsB }}" as="t" hint-placeholder-count="6"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
        </div>
        <div role="tabpanel" aria-label="Limits" style="flex: 1 1 auto; min-height: 0; padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px">
            <label for="ml-per-quota" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Storage quota for this person</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">3.4 GB in use. Comes from the domain northwind-projects.test, 10 GB per mailbox, which takes the server default. A value here replaces it for Olivia only.</span></label>
            <span style="flex: none; display: inline-flex; align-items: center; gap: 8px"><input id="ml-per-quota" type="number" value="10" style="{{ num }}"><span style="font-size: 13px; color: #3d4047; width: 24px">GB</span></span>
          </div>
          <div aria-hidden="true" style="height: 6px; border-radius: 3px; background: #eef0f3; overflow: hidden"><div style="width: 34%; height: 100%; background: #3669a5"></div></div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <label for="ml-per-count" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Limit on the number of messages</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">12,418 messages now. When the limit is reached, new mail is held and the sender is told to try later.</span></label>
            <span style="flex: none; display: inline-flex; align-items: center; gap: 8px"><input id="ml-per-count" type="number" value="100000" style="{{ numWide }}"><span style="font-size: 13px; color: #3d4047; width: 24px"></span></span>
          </div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <label for="ml-per-scripts" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Space for filter scripts</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">All her filter scripts together. Two scripts, 9 kB, in use now.</span></label>
            <span style="flex: none; display: inline-flex; align-items: center; gap: 8px"><input id="ml-per-scripts" type="number" value="64" style="{{ num }}"><span style="font-size: 13px; color: #3d4047; width: 24px">kB</span></span>
          </div>
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #3669a5"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span>Olivia sees her storage in her own settings. She is warned at 90 percent.</span></div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <button type="button" style="{{ primary }}">Save changes</button>
            <button type="button" style="{{ secondary }}">Discard</button>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ secondary }}">Use domain defaults</button>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Folders tab: every folder with its counts, Empty on each and Delete folder only where it is allowed</figcaption>
      <div style="background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 700px; box-sizing: border-box">
        <div role="tablist" aria-label="Person sections" style="flex: none; display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid #c4c7cb">
          <sc-for list="{{ tabsC }}" as="t" hint-placeholder-count="6"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
        </div>
        <div role="tabpanel" aria-label="Folders" style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 8px">
            <p style="margin: 0; flex: 1 1 auto; font-size: 12px; color: #5e6168; line-height: 18px">Message and unread counts refresh every 15 minutes.</p>
            <button type="button" style="{{ compact }}">Show all folders</button>
            <button type="button" style="{{ compact }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New folder</button>
          </div>
          <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px">
            <thead><tr style="background: #fafbfc"><th scope="col" style="{{ th }}">Folder</th><th scope="col" style="{{ thRight }}">Messages</th><th scope="col" style="{{ thRight }}">Unread</th><th scope="col" style="{{ th }}">Shown in the folder list</th><th scope="col" style="width: 240px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
            <tbody>
              <sc-for list="{{ folders }}" as="f" hint-placeholder-count="9">
                <tr style="border-top: 1px solid #eef0f3">
                  <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 8px; padding-left: {{ f.indent }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>{{ f.name }}</span></td>
                  <td style="padding: 14px 16px; line-height: 20px; text-align: right; white-space: nowrap">{{ f.messages }}</td>
                  <td style="padding: 14px 16px; line-height: 20px; text-align: right; white-space: nowrap; font-weight: {{ f.unreadWeight }}">{{ f.unread }}</td>
                  <td style="padding: 14px 16px; line-height: 20px; color: #5e6168; white-space: nowrap">{{ f.subscribed }}</td>
                  <td style="padding: 7px 16px; line-height: 20px; text-align: right; white-space: nowrap"><button type="button" aria-label="Empty folder {{ f.name }}" style="{{ btnSmall }}">Empty</button><sc-if value="{{ f.deletable }}" hint-placeholder-val="{{ false }}"> <button type="button" aria-label="Delete folder {{ f.name }}" style="{{ btnSmall }}; color: #cc0000; border-color: #cc0000">Delete folder</button></sc-if></td>
                </tr>
              </sc-for>
            </tbody>
          </table></div>
          <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Empty removes the messages and keeps the folder. Delete folder removes both, so Inbox, Drafts, Sent, Spam and Trash do not offer it. Shown in the folder list is what Olivia sees in her folder list; a folder that is not shown still keeps its mail.</p>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;Rules tab: the automatic reply as a status with a link and an override, and the filter script</figcaption>
      <div style="background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 500px; box-sizing: border-box">
        <div role="tablist" aria-label="Person sections" style="flex: none; display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid #c4c7cb">
          <sc-for list="{{ tabsD }}" as="t" hint-placeholder-count="6"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
        </div>
        <div role="tabpanel" aria-label="Rules" style="padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px">
            <h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Automatic reply</h3>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3d4047"><span style="{{ D.ok }}"></span>On from Monday 19 October to Friday 23 October, set by Olivia on 9 October. <a href="MlSettingsAutoReply.dc.html" style="color: var(--sc-link, #3669a5)">Open it in her settings</a></div>
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
              <label for="ml-per-away" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Set the automatic reply for her</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">For when Olivia cannot do it herself. Switching this on opens the same form she sees in her settings, section Automatic reply, with the same Starts, Ends and Reply fields. Your change is written to the administration log.</span></label>
              <button id="ml-per-away" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button>
            </div>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
              <div style="display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Filter script</h3><p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Her rules as a script (Sieve, the standard mail servers run for sorting). Put one in place from a file when a person moves in from another server, or to fix a broken one.</p></div>
              <button type="button" style="{{ compact }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Put a script in place</button>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3d4047"><span style="{{ D.ok }}"></span>Active script: customers.sieve, 6 kB of 64 kB, changed on 9 October by Olivia</div>
            <pre style="margin: 0; padding: 10px 12px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font: 400 12px/18px ui-monospace, monospace; color: #1b1c1d; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere">require ["fileinto"];
if address :domain "from" "ville-lyon.test" { fileinto "Customers/Lyon"; }
if address :domain "from" "stadtwerke-kassel.test" { fileinto "Customers/Kassel"; }</pre>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;Sign-in tab: two-factor, live sessions and connection logging</figcaption>
      <div style="background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 500px; box-sizing: border-box">
        <div role="tablist" aria-label="Person sections" style="flex: none; display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid #c4c7cb">
