<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>filinq: persoonlijke instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="FqMijnDocumenten" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Filinq" version="0.2.6" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Filinq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen under Instellingen.
    // Filinq fills no #user-settings slot today: CnAppRoot's Meldingen (LegalHoldNotifier) and Inloggegevens.
    // Documenten holds the two per-user values Filinq already keeps in config:user: the language of generated
    // documents (TemplateLanguageService) and the anonymiser warning (AnonymiserWarningController).
    const sections = [
      { name: 'Meldingen', desc: 'Kies welke meldingen van Filinq je krijgt.', rows: [
        { switch: 'Een document van mij valt onder een juridische blokkade', hint: 'Het mag dan niet worden vernietigd tot de blokkade is opgeheven.', on: true }
      ] },
      { name: 'Documenten', desc: 'Hoe Filinq documenten voor jou maakt.', rows: [
        { select: 'Taal van documenten uit sjablonen', value: 'Nederlands', hint: 'Een sjabloon zonder vertaling blijft in zijn eigen taal.' },
        { switch: 'Waarschuwing tonen als anonimiseren zonder eigen server draait', on: true }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['ValidSign, eigen account', 'Gekwalificeerd ondertekenen · toegevoegd 22 september', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
