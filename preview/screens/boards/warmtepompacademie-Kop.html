<!doctype html>
<html lang="nl">
<head>

<title>Onderdeel: kop en hoofdmenu</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Semi+Condensed:wght@600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div class="sc-board" data-board="Kop">

<header style="font-family: 'Barlow', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; width: 100%">
  <a href="#inhoud" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Direct naar de inhoud</a>
  <div style="max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
    <a href="warmtepompacademie-Home.html" style="display: flex; align-items: center" aria-label="Warmtepompacademie, naar de homepage">
      <img src="../assets/warmtepompacademie/logo.svg" alt="Warmtepompacademie" style="height: 52px; width: auto; display: block">
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <form role="search" style="position: relative; display: flex">
        <label for="kop-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoek een cursus</label>
        <input id="kop-zoek" type="search" placeholder="Zoek een cursus" style="width: 250px; height: 46px; box-sizing: border-box; padding: 0 48px 0 14px; border: 1px solid #5c6470; border-radius: 3px; background: #ffffff; font: 400 16px 'Barlow', sans-serif; color: #1a1a1a">
        <button type="submit" aria-label="Zoeken" style="position: absolute; right: 0; top: 0; width: 46px; height: 46px; border: 0; background: transparent; color: #0b6e7a; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </button>
      </form>
      
      
        <a href="warmtepompacademie-Inloggen.html" style="display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 3px; background: #0b6e7a; color: #ffffff; font-weight: 600; font-size: 16px; text-decoration: none">
          <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
          Mijn academie
        </a>
      
    </div>
  </div>
  <nav aria-label="Hoofdmenu" style="border-top: 1px solid #e6e9ee">
    <ul style="max-width: 1280px; margin: 0 auto; padding: 0 10px; list-style: none; display: flex; flex-wrap: wrap">
      
        <li><a href="warmtepompacademie-Home.html" aria-current="page" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 700; box-shadow: inset 0 -4px 0 #d9480f;">Home</a></li>
      
        <li><a href="warmtepompacademie-Zoeken.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Cursusaanbod</a></li>
      
        <li><a href="warmtepompacademie-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Certificaten</a></li>
      
        <li><a href="warmtepompacademie-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Voor werkgevers</a></li>
      
        <li><a href="warmtepompacademie-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Incompany</a></li>
      
        <li><a href="warmtepompacademie-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Praktijkhal</a></li>
      
        <li><a href="warmtepompacademie-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Contact</a></li>
      
    </ul>
  </nav>
  <div aria-hidden="true" style="display: flex; height: 5px">
    <span style="flex: 8; background: #0b6e7a"></span><span style="flex: 3; background: #5fa3a8"></span><span style="flex: 2; background: #e4e6ea"></span><span style="flex: 3; background: #efa06f"></span><span style="flex: 8; background: #d9480f"></span>
  </div>
