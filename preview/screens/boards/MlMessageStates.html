            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: var(--sc-work-ink, #1b1c1d); white-space: nowrap">Sovereign Tech Weekly</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">newsletter@sovereigntech.test</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: var(--sc-work-ink, #1b1c1d)">Yesterday 08:00</span></div>
              <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Open source in the public sector, issue 41</div>
            </div>
          </div>
          <div style="position: relative; margin: 10px 14px 0 56px; max-height: 150px; overflow: hidden; display: flex; flex-direction: column; gap: 10px; color: var(--sc-work-text, #3d4047); font-size: 13px; line-height: 19px">
            <p style="margin: 0">In this issue: the Dutch sovereign workplace, procurement rules for open source, and a look at the Lyon rollout. We spoke with four municipalities about what changed once the mail archive stayed on their own servers.</p>
            <p style="margin: 0">The sovereign workplace. Three years after the first pilot, the Dutch programme now runs mail, calendar, files and video for 14 public bodies. The lesson the programme office repeats most: start with mail, because everybody already knows what good mail looks like, and every other tool is measured against it.</p>
            <p style="margin: 0">Procurement. The new European guidance treats a public code base as a deliverable in its own right. Tenders may now ask for the source, the build and the test suite, and score them. We summarise the eleven criteria that matter and the two that are usually forgotten.</p>
            <p style="margin: 0">Lyon. The planning department moved 220 people to a shared platform in nine weeks. The project lead, Marc Dubois, talks about the folder structure fight, the week the export cut off and why the data protection officer ended up as the project's best ally.</p>
