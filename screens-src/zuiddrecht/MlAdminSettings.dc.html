<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: settings, people and sign-in, account templates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2940px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Settings, tab General: defaults for new users, language and look, product features and custom fields. Sizes, storage and sign-in have their own pages</figcaption>
    <div style="height: 1060px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
      <dc-import name="MlHeader" app="Administration" placeholder="Search settings, domains or people" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Settings" hint-size="264px,990px"></dc-import></div>
        <main style="{{ main }}">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Settings</h1>
            <p style="margin: 0; color: #3d4047">What has no page of its own: defaults for new people, language and look, product features, custom fields and connected services. Message size is under Protection, storage under Domains, sign-in under People and sign-in.</p>
          </div>
          <div role="tablist" aria-label="Settings" style="{{ tablist }}">
            <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">General</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Connected services</button>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px 24px; align-items: start">
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Defaults for new users</h3>
                <p style="{{ hint }}">What a person gets until they choose otherwise in their own settings.</p>
                <div style="{{ switchRow }}">
                  <label for="ml-set-own" style="{{ switchLabel }}"><span style="font-weight: 500">People may add their own mail accounts</span><span style="{{ hint }}">Off means only accounts from a template or made by an administrator.</span></label>
                  <button id="ml-set-own" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
                <div style="{{ switchRow }}">
                  <label for="ml-set-imp" style="{{ switchLabel }}"><span style="font-weight: 500">Priority inbox for new users</span><span style="{{ hint }}">Important mail comes first in the inbox, as the person sees it under Appearance.</span></label>
                  <button id="ml-set-imp" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
                <fieldset style="{{ fieldset }}">
                  <legend style="{{ legend }}">Default conversation view</legend>
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-conv" checked style="{{ radio }}"><span>Group messages into conversations</span></label>
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-conv" style="{{ radio }}"><span>Show every message on its own</span></label>
                </fieldset>
              </section>
              <section style="{{ card }}">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="{{ h3 }}">Custom fields</h3><button type="button" style="{{ btnSmall }}">Add field</button></div>
                <p style="{{ hint }}">Extra fields on every person and domain, shown on their pages and in exports.</p>
                <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px">
                  <thead><tr style="background: #fafbfc"><th scope="col" style="{{ thSmall }}">Field</th><th scope="col" style="{{ thSmall }}">On</th><th scope="col" style="{{ thSmall }}">Kind</th></tr></thead>
                  <tbody>
                    <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
                      <tr style="border-top: 1px solid #eef0f3"><td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600">{{ f.name }}</td><td style="padding: 14px 16px; line-height: 20px; color: #3d4047">{{ f.on }}</td><td style="padding: 14px 16px; line-height: 20px; color: #3d4047">{{ f.kind }}</td></tr>
                    </sc-for>
                  </tbody>
                </table></div>
              </section>
            </div>
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Language and look</h3>
                <p style="{{ hint }}">The language people start in, and the colours and logo of the operator.</p>
                <div style="{{ fieldRow }}"><label for="ml-lang" style="font-size: 14px; font-weight: 600">Default language</label><button id="ml-lang" type="button" aria-haspopup="listbox" style="{{ chooser }}"><span>English</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
                <div style="{{ switchRow }}">
                  <label for="ml-lang-force" style="{{ switchLabel }}"><span style="font-weight: 500">Force this language for everyone</span><span style="{{ hint }}">People cannot pick another language in their own settings. Off lets each person choose.</span></label>
                  <button id="ml-lang-force" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
                <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid #e4e6ea">
                  <span style="{{ label }}">Colours and logo of the operator</span>
                  <span style="{{ hint }}">Shown in the top bar, on the sign-in page and in mail the server sends itself.</span>
                  <div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: var(--sc-radius, 8px); background: #3669a5; border: 1px solid #234a78"></span><label for="ml-col-main" style="font-size: 14px; font-weight: 600">Main colour</label><input id="ml-col-main" type="text" value="#3669a5" style="{{ inputTiny }}"></div>
                  <div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="width: 24px; height: 24px; border-radius: var(--sc-radius, 8px); background: #234a78; border: 1px solid #1b1c1d"></span><label for="ml-col-deep" style="font-size: 14px; font-weight: 600">Dark colour</label><input id="ml-col-deep" type="text" value="#234a78" style="{{ inputTiny }}"></div>
                  <div style="display: flex; align-items: center; gap: 10px; margin-top: 4px; flex-wrap: wrap">
                    <span style="display: inline-flex; align-items: center; justify-content: center; width: 110px; height: 40px; border-radius: var(--sc-radius, 8px); background: #3669a5; color: #ffffff; font-weight: 600; font-size: 13px">Northwind</span>
                    <span style="font-size: 12px; color: #3d4047">northwind-logo.svg, 18 KB</span>
                    <button type="button" style="{{ btnSmall }}">Upload logo</button>
                    <button type="button" style="{{ btnSmall }}">Remove</button>
                  </div>
                </div>
              </section>
            </div>
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Product features</h3>
                <p style="{{ hint }}">Switch features on or off for this installation.</p>
                <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px">
                  <tbody>
                    <sc-for list="{{ features }}" as="f" hint-placeholder-count="5">
                      <tr style="border-top: 1px solid #eef0f3"><td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600">{{ f.name }}</td><td style="padding: 14px 16px; line-height: 20px; color: #5e6168; font-size: 13px">{{ f.hint }}</td><td style="padding: 12px 16px; line-height: 0; text-align: right"><button type="button" role="switch" aria-checked="{{ f.checked }}" aria-label="{{ f.name }}" style="{{ f.switch }}"><span style="{{ f.knob }}"></span></button></td></tr>
                    </sc-for>
                  </tbody>
                </table></div>
              </section>
            </div>
          </div>
          <div style="{{ saveRow }}">
            <button type="button" style="{{ btnPrimary }}">Save changes</button>
            <button type="button" style="{{ btnSecondary }}">Discard</button>
            <span style="{{ hint }}">Switches in the product features table are saved at once.</span>
          </div>
        </main>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Page People and sign-in, its own entry in the navigation: sign-in, Google and Microsoft, where people come from, admitted groups and every administrator with their scope</figcaption>
      <div style="height: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <main style="{{ main }}">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">People and sign-in</h1>
            <p style="margin: 0; color: #3d4047">Who may use this mail server, where they come from, how they sign in, and who administers what.</p>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px 24px; align-items: start">
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Sign-in</h3>
                <p style="{{ hint }}">How the server knows who someone is. These settings hold for the web app and for mail programs on a phone or laptop. With single sign-on a mailbox has no password of its own: it is reset in the workspace.</p>
                <div style="{{ switchRow }}">
                  <label for="ml-srv-sso" style="{{ switchLabel }}"><span style="font-weight: 500">Sign in to mail protocols through a single sign-on provider</span><span style="{{ hint }}">People sign in with the same account as for the rest of the workspace, also from a mail program. Passwords are never stored on the mail server.</span></label>
                  <button id="ml-srv-sso" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
                <div style="{{ fieldRow }}"><label for="ml-srv-provider" style="font-size: 14px; font-weight: 600">Sign-on provider</label><button id="ml-srv-provider" type="button" aria-haspopup="listbox" style="{{ chooser }}; min-width: 250px"><span>Northwind workspace (OpenID Connect)</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
                <p style="{{ hint }}">OpenID Connect is the standard the workspace sign-in speaks. The mail server asks it whether a sign-in is good, the same way the workspace does.</p>
                <div style="{{ switchRow }}; padding-top: 10px; border-top: 1px solid #e4e6ea">
                  <label for="ml-srv-proxy" style="{{ switchLabel }}"><span style="font-weight: 500">Let a trusted front proxy name the signed-in person</span><span style="{{ hint }}">The proxy in front of the mail server has already checked who the person is and passes the name along in a request header. Only requests from the trusted address are believed.</span></label>
                  <button id="ml-srv-proxy" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px">
                  <div style="{{ group }}"><label for="ml-srv-header" style="{{ label }}">Request header with the name</label><input id="ml-srv-header" type="text" value="X-Forwarded-User" style="{{ input }}; font-family: ui-monospace, monospace"></div>
                  <div style="{{ group }}"><label for="ml-srv-proxyaddr" style="{{ label }}">Trusted proxy address</label><input id="ml-srv-proxyaddr" type="text" value="10.0.4.12" style="{{ input }}; font-family: ui-monospace, monospace"></div>
                </div>
                <div style="{{ switchRow }}; padding-top: 10px; border-top: 1px solid #e4e6ea">
                  <label for="ml-srv-fulladdr" style="{{ switchLabel }}"><span style="font-weight: 500">Use the full mail address as the sign-in name on every protocol</span><span style="{{ hint }}">People sign in as olivia@northwind-projects.test, not as olivia. Needed when more than one domain has a person with the same name.</span></label>
                  <button id="ml-srv-fulladdr" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
              </section>
            </div>
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Sign in with Google</h3>
                <p style="{{ hint }}">One client for all users, so a person can add a Google mailbox without a client of their own.</p>
                <div style="{{ fieldRow }}"><label for="ml-set-gid" style="font-size: 14px; font-weight: 600">Google client id</label><input id="ml-set-gid" type="text" value="483920117-nwp.apps.googleusercontent.com" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-gsec" style="font-size: 14px; font-weight: 600">Client secret</label><input id="ml-set-gsec" type="password" value="xxxxxxxxxxxxxxxxxxxxxxxx" style="{{ inputWide }}"></div>
              </section>
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Sign in with Microsoft</h3>
                <div style="{{ fieldRow }}"><label for="ml-set-mid" style="font-size: 14px; font-weight: 600">Microsoft client id</label><input id="ml-set-mid" type="text" value="6f1c2a8e-4b7d-4c3a-9e21-northwind" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-msec" style="font-size: 14px; font-weight: 600">Client secret</label><input id="ml-set-msec" type="password" value="xxxxxxxxxxxxxxxxxxxxxxxx" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-tenant" style="font-size: 14px; font-weight: 600">Microsoft tenant</label><input id="ml-set-tenant" type="text" value="northwindprojects.onmicrosoft.com" style="{{ inputWide }}"></div>
              </section>
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Admitted groups</h3>
                <p style="{{ hint }}">Only members of these directory groups may sign in to mail. Everyone else in the directory is refused.</p>
                <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
                  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3"><span style="{{ chip }}">{{ g.name }}<span style="font-weight: 400; color: #5e6168">{{ g.count }}</span></span></sc-for>
                  <button type="button" style="{{ btnSmall }}">Add group</button>
                </div>
              </section>
            </div>
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Where people come from</h3>
                <fieldset style="{{ fieldsetPlain }}">
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-src" style="{{ radio }}"><span>A local list of people, kept here</span></label>
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-src" checked style="{{ radio }}"><span>The company directory (LDAP, the standard directory lookup)</span></label>
                </fieldset>
                <div style="{{ fieldRow }}"><label for="ml-set-ldap" style="font-size: 14px; font-weight: 600">Directory address</label><input id="ml-set-ldap" type="text" value="ldaps://directory.northwind-projects.test" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-base" style="font-size: 14px; font-weight: 600">Start looking at</label><input id="ml-set-base" type="text" value="ou=people,dc=northwind,dc=test" style="{{ inputWide }}"></div>
                <div style="display: flex; align-items: center; gap: 10px"><button type="button" style="{{ btnSecondary }}">Test lookup</button><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3d4047"><span style="{{ dotOk }}"></span>Found 61 people and 3 groups, today 07:00</span></div>
              </section>
              <section style="{{ card }}">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><div style="display: flex; flex-direction: column; gap: 2px"><h3 style="{{ h3 }}">Administrators of this server</h3><p style="{{ hint }}">Everyone who administers something, with their scope. A domain administrator is also listed on the page of that domain.</p></div><button type="button" style="{{ btnSmall }}">Add administrator</button></div>
                <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px">
                  <thead><tr style="background: #fafbfc"><th scope="col" style="{{ thSmall }}">Person</th><th scope="col" style="{{ thSmall }}">Administers</th><th scope="col" style="width: 96px"></th></tr></thead>
                  <tbody>
                    <sc-for list="{{ admins }}" as="a" hint-placeholder-count="3">
                      <tr style="border-top: 1px solid #eef0f3"><td style="padding: 8px 12px; line-height: 16px"><span style="display: block; font-size: 15px; font-weight: 600; white-space: nowrap">{{ a.name }}</span><span style="display: block; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px">{{ a.mail }}</span></td><td style="padding: 14px 12px; line-height: 20px; color: #3d4047">{{ a.scope }}</td><td style="padding: 7px 12px 7px 0; line-height: 0; text-align: right"><button type="button" aria-label="Remove {{ a.name }} as administrator" style="{{ btnSmall }}">Remove</button></td></tr>
                    </sc-for>
                  </tbody>
                </table></div>
              </section>
            </div>
          </div>
          <div style="{{ saveRow }}">
            <button type="button" style="{{ btnPrimary }}">Save changes</button>
            <button type="button" style="{{ btnSecondary }}">Discard</button>
            <span style="{{ hint }}">Adding or removing an administrator or a group is saved at once.</span>
          </div>
        </main>
      </div>
    </figure>

  <div style="display: flex; gap: 24px; align-items: flex-start">
    <figure style="margin: 0; flex: 0 0 360px; width: 360px; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Settings, tab Connected services: calendar, file storage and document chat</figcaption>
      <div style="height: 740px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <main style="{{ main }}">
          <div role="tablist" aria-label="Settings" style="{{ tablist }}">
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">General</button>
            <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">Connected services</button>
          </div>
          <div style="{{ col }}">
            <section style="{{ card }}">
              <h3 style="{{ h3 }}">Calendar</h3>
              <div style="{{ switchRow }}">
                <label for="ml-set-cal" style="{{ switchLabel }}"><span style="font-weight: 500">Connect a CalDAV calendar to each mailbox</span><span style="{{ hint }}">CalDAV is the standard that calendars share appointments with. Invitations in mail land in the person's calendar.</span></label>
                <button id="ml-set-cal" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
              <div style="{{ fieldRow }}"><label for="ml-set-caldav" style="font-size: 14px; font-weight: 600">Calendar address</label><input id="ml-set-caldav" type="text" value="https://calendar.northwind-projects.test/caldav" style="{{ inputWide }}"></div>
            </section>
            <section style="{{ card }}">
              <h3 style="{{ h3 }}">File storage</h3>
              <div style="{{ switchRow }}">
                <label for="ml-set-files" style="{{ switchLabel }}"><span style="font-weight: 500">Use the suite file storage for attachments</span><span style="{{ hint }}">Attachments can be saved to and picked from the shared files of the workspace.</span></label>
                <button id="ml-set-files" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
            </section>
            <section style="{{ card }}">
              <h3 style="{{ h3 }}">Document chat</h3>
              <div style="{{ switchRow }}">
                <label for="ml-set-chat" style="{{ switchLabel }}"><span style="font-weight: 500">Make mail available to the document chat assistant</span><span style="{{ hint }}">A person can then ask the assistant about their own mail. Nobody else's mail is read.</span></label>
                <button id="ml-set-chat" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
            </section>
          </div>
          <div style="{{ saveRow }}">
            <button type="button" style="{{ btnPrimary }}">Save changes</button>
            <button type="button" style="{{ btnSecondary }}">Discard</button>
            <span style="{{ hint }}"></span>
          </div>
        </main>
      </div>
    </figure>
    <figure style="margin: 0; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;Page Account templates, its own entry in the navigation: one template per domain, the template of northwind-projects.test open on the right</figcaption>
    <div style="height: 740px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <main style="{{ main }}">
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Account templates</h1>
        </div>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
          <p style="margin: 0; color: #3d4047">One template per domain creates a mail account for every person of that domain, from the directory. People who join later get theirs at the next run.</p>
          <button type="button" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add template</button>
        </div>
        <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
          <table style="width: 100%; border-collapse: collapse; font-size: 14px">
            <thead><tr style="background: #fafbfc">
              <th scope="col" style="{{ th }}">Domain</th>
              <th scope="col" style="{{ th }}">Accounts</th>
              <th scope="col" style="{{ th }}">Last run</th>
              <th scope="col" style="{{ th }}">State</th>
              <th scope="col" style="width: 44px"><span style="{{ srOnly }}">Actions</span></th>
            </tr></thead>
            <tbody>
              <sc-for list="{{ templates }}" as="t" hint-placeholder-count="3">
                <tr aria-selected="{{ t.selected }}" style="{{ t.style }}">
                  <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">{{ t.domain }}</a></td>
                  <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap">{{ t.accounts }}</td>
                  <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap; color: #3d4047">{{ t.last }}</td>
                  <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><span style="display: flex; align-items: center; gap: 6px; line-height: 20px"><span style="{{ t.dot }}"></span>{{ t.state }}</span></td>
