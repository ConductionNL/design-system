<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onderdeel: kop en hoofdmenu</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800&amp;family=Red+Hat+Text:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1f4fd8}a:hover{color:#14338f}
</style>
</head>
<body>
<div class="sc-board" data-board="Kop">

<header style="font-family: 'Red Hat Text', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; width: 100%">
  <a href="#inhoud" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Direct naar de inhoud</a>
  <div style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
    <a href="vaartveld-Home.html" style="display: flex; align-items: center" aria-label="Vaartveld College, naar de homepage">
      <img src="../assets/vaartveld/logo.svg" alt="Vaartveld College" style="height: 52px; width: auto; display: block">
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <form role="search" style="position: relative; display: flex">
        <label for="kop-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken op de website</label>
        <input id="kop-zoek" type="search" placeholder="Zoeken" style="width: 240px; height: 46px; box-sizing: border-box; padding: 0 48px 0 14px; border: 2px solid #5c6470; border-radius: 6px; background: #ffffff; font: 400 16px 'Red Hat Text', sans-serif; color: #1a1a1a">
        <button type="submit" aria-label="Zoeken" style="position: absolute; right: 0; top: 0; width: 46px; height: 46px; border: 0; background: transparent; color: #1f4fd8; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </button>
      </form>
      
      
        <a href="vaartveld-Inloggen.html" style="display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 6px; background: #1f4fd8; color: #ffffff; font-weight: 600; font-size: 16px; text-decoration: none">
          <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
          Mijn Vaartveld
        </a>
      
    </div>
  </div>
  <nav aria-label="Hoofdmenu" style="border-top: 1px solid #e6e9ee">
    <ul style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 0 10px; list-style: none; display: flex; flex-wrap: wrap">
      
        <li><a href="vaartveld-Home.html" aria-current="page" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 700; box-shadow: inset 0 -4px 0 #1fb5a8;">Home</a></li>
      
        <li><a href="vaartveld-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Onze school</a></li>
      
        <li><a href="vaartveld-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Onderwijs</a></li>
      
        <li><a href="vaartveld-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Praktisch</a></li>
      
        <li><a href="vaartveld-Zoeken.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Nieuws</a></li>
      
        <li><a href="vaartveld-Zoeken.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Agenda</a></li>
      
        <li><a href="vaartveld-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Aanmelden</a></li>
      
    </ul>
  </nav>
  <div aria-hidden="true" style="display: flex; flex-direction: column">
    <span style="height: 4px; background: #1f4fd8"></span>
    <span style="height: 3px; background: #ffffff"></span>
    <span style="height: 2px; background: #1fb5a8"></span>
  </div>
  
</header>
</div>
</body>
</html>
