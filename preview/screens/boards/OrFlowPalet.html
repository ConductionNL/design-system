<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow: stappenpalet</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:288px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="OrFlowPalet">

<aside data-or-flow="palet" aria-label="Stappen" style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: 12px; box-shadow: 0 2px 8px rgba(27,28,29,0.08)">
  <div style="display: flex; align-items: center; gap: 8px"><h2 style="flex: 1; margin: 0; font-size: 15px; font-weight: 700">Stappen</h2><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">16 stappen</span></div>
  <div style="display: flex; flex-direction: column; gap: 4px"><label for="orfl-palet-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoek een stap</label><input id="orfl-palet-q" type="search" placeholder="Zoek een stap" style="height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--sc-work-field, #828a95); border-radius: 8px; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)"></div>
  
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Triggers</h3>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#1e6b2a" aria-hidden="true" style="flex: none"><path d="M11 15H6L13 1V9H18L11 23V15Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Record aangemaakt</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">bij een nieuw record in een schema</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#1e6b2a" aria-hidden="true" style="flex: none"><path d="M11 15H6L13 1V9H18L11 23V15Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Record gewijzigd</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">bij een wijziging of statusovergang</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#1e6b2a" aria-hidden="true" style="flex: none"><path d="M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Op schema</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">elke nacht, elk uur, cron</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#1e6b2a" aria-hidden="true" style="flex: none"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Handmatig</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">iemand drukt op Uitvoeren</span></span></button></li>
        
      </ul>
    </div>
  
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Logica</h3>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#4a3f8f" aria-hidden="true" style="flex: none"><path d="M14,4L16.29,6.29L13.41,9.17L14.83,10.59L17.71,7.71L20,10V4M10,4H4V10L6.29,7.71L11,12.41V20H13V11.59L7.71,6.29"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Voorwaarde</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">routes op een veld of regel</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#4a3f8f" aria-hidden="true" style="flex: none"><path d="M14,4L16.29,6.29L13.41,9.17L14.83,10.59L17.71,7.71L20,10V4M10,4H4V10L6.29,7.71L11,12.41V20H13V11.59L7.71,6.29"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Beslistabel</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">uitkomst uit regels</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#1d5e66" aria-hidden="true" style="flex: none"><path d="M6,2V8H6V8L10,12L6,16V16H6V22H18V16H18V16L14,12L18,8V8H18V2H6M16,16.5V20H8V16.5L12,12.5L16,16.5M12,11.5L8,7.5V4H16V7.5L12,11.5Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Wachten</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">tot een datum of signaal</span></span></button></li>
        
      </ul>
    </div>
  
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Mensen</h3>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#7a4f00" aria-hidden="true" style="flex: none"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Menselijke taak</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">met een formulier</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#7a4f00" aria-hidden="true" style="flex: none"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Goedkeuring</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">in een of meer stappen</span></span></button></li>
        
      </ul>
    </div>
  
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Berichten</h3>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#3669a5" aria-hidden="true" style="flex: none;fill:var(--sc-primary, #3669a5)"><path d="M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6M20 6L12 11L4 6H20M20 18H4V8L12 13L20 8V18Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">E-mail sturen</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">ook naar externe adressen</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#3669a5" aria-hidden="true" style="flex: none;fill:var(--sc-primary, #3669a5)"><path d="M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6M20 6L12 11L4 6H20M20 18H4V8L12 13L20 8V18Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">SMS of WhatsApp</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">via de provider</span></span></button></li>
        
      </ul>
    </div>
  
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Objecten</h3>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#3669a5" aria-hidden="true" style="flex: none;fill:var(--sc-primary, #3669a5)"><path d="M12,3C7.58,3 4,4.79 4,7C4,9.21 7.58,11 12,11C16.42,11 20,9.21 20,7C20,4.79 16.42,3 12,3M4,9V12C4,14.21 7.58,16 12,16C16.42,16 20,14.21 20,12V9C20,11.21 16.42,13 12,13C7.58,13 4,11.21 4,9M4,14V17C4,19.21 7.58,21 12,21C16.42,21 20,19.21 20,17V14C20,16.21 16.42,18 12,18C7.58,18 4,16.21 4,14Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Object schrijven</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">enkel of bulk</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#3669a5" aria-hidden="true" style="flex: none;fill:var(--sc-primary, #3669a5)"><path d="M12,3C7.58,3 4,4.79 4,7C4,9.21 7.58,11 12,11C16.42,11 20,9.21 20,7C20,4.79 16.42,3 12,3M4,9V12C4,14.21 7.58,16 12,16C16.42,16 20,14.21 20,12V9C20,11.21 16.42,13 12,13C7.58,13 4,11.21 4,9M4,14V17C4,19.21 7.58,21 12,21C16.42,21 20,19.21 20,17V14C20,16.21 16.42,18 12,18C7.58,18 4,16.21 4,14Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Object lezen</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">uit een register</span></span></button></li>
        
      </ul>
    </div>
  
    <div style="display: flex; flex-direction: column; gap: 2px">
      <h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Overig</h3>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#6b2a8f" aria-hidden="true" style="flex: none"><path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Agent-actie</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">naar een andere app</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#1d5e66" aria-hidden="true" style="flex: none"><path d="M3,3H9V7H3V3M15,10H21V14H15V10M15,17H21V21H15V17M13,13H11V18H13V20H9V12H13V13Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Subflow</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">een andere flow aanroepen</span></span></button></li>
        
          <li><button type="button" draggable="true" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; width: 100%; box-sizing: border-box; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 8px; background: transparent; text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); cursor: grab"><svg width="16" height="16" viewbox="0 0 24 24" fill="#cc0000" aria-hidden="true" style="flex: none;fill:var(--sc-accent, #cc0000)"><path d="M14.4,6H20V16H13L12.6,14H7V21H5V4H14L14.4,6Z"></path></svg><span style="flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-weight: 600">Einde</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">sluit de run af</span></span></button></li>
        
      </ul>
    </div>
  
  
  <p style="margin: 0; padding: 8px 10px 2px; border-top: 1px solid var(--sc-work-soft, #eef0f3); font-size: 12px; line-height: 1.45; color: var(--sc-work-muted, #5e6168)">Sleep een stap op het canvas of kies hem met Enter. Een app levert alleen stappen die hij zelf kan uitvoeren; de groep staat er zodra de app is geïnstalleerd.</p>
</aside>
</div>
</body>
</html>
