<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Flow: stappenlijst</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div data-or-flow="stappenlijst" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
  <section aria-labelledby="orfl-wanneer" style="display: flex; flex-direction: column; gap: 8px">
    <h2 id="orfl-wanneer" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ triggerTitle }}</h2>
    <sc-for list="{{ triggers }}" as="t" hint-placeholder-count="1">
      <div style="{{ t.row }}">
        <span aria-hidden="true" style="{{ t.num }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="{{ t.icon }}"></path></svg></span>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px">
          <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><strong style="font-size: 15px">{{ t.title }}</strong><span style="{{ t.pill }}">{{ t.kindWord }}</span><sc-if value="{{ t.hasApp }}" hint-placeholder-val="{{ false }}"><span style="{{ t.appPill }}">{{ t.app }}</span></sc-if></span>
          <span style="font-size: 13px; color: #5e6168">{{ t.sub }}</span>
        </div>
        <sc-if value="{{ t.hasState }}" hint-placeholder-val="{{ false }}"><span style="{{ t.stateStyle }}">{{ t.state }}</span></sc-if>
        <button type="button" aria-label="{{ t.editLabel }}" title="{{ t.editLabel }}" style="flex: none; width: 34px; height: 34px; border: 1px solid #828a95; border-radius: 8px; background: #ffffff; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"></path></svg></button>
      </div>
    </sc-for>
  </section>
  <section aria-labelledby="orfl-dan" style="display: flex; flex-direction: column; gap: 8px">
    <h2 id="orfl-dan" style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ stepsTitle }}</h2>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ steps }}" as="s" hint-placeholder-count="6">
        <li style="{{ s.row }}">
          <span aria-hidden="true" style="{{ s.num }}">{{ s.n }}</span>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <sc-if value="{{ s.hasWhen }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; align-self: flex-start; padding: 2px 10px 2px 8px; border-radius: 10px; border: 1px dashed #4a3f8f; color: #4a3f8f; font-size: 12px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14,4L16.29,6.29L13.41,9.17L14.83,10.59L17.71,7.71L20,10V4M10,4H4V10L6.29,7.71L11,12.41V20H13V11.59L7.71,6.29"></path></svg>{{ s.when }}</span></sc-if>
            <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ s.colour }}" aria-hidden="true" style="flex: none"><path d="{{ s.icon }}"></path></svg><strong style="font-size: 15px">{{ s.title }}</strong><span style="{{ s.pill }}">{{ s.kindWord }}</span><sc-if value="{{ s.hasApp }}" hint-placeholder-val="{{ false }}"><span style="{{ s.appPill }}">{{ s.app }}</span></sc-if></span>
            <span style="font-size: 13px; color: #5e6168">{{ s.sub }}</span>
            <sc-if value="{{ s.hasRoutes }}" hint-placeholder-val="{{ false }}"><span style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: #3d4047"><span>Routes:</span><sc-for list="{{ s.routes }}" as="r" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px; background: #f0f1f3; font-weight: 600">{{ r.label }}<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4,11V13H16L10.5,18.5L11.92,19.92L19.84,12L11.92,4.08L10.5,5.5L16,11H4Z"></path></svg>{{ r.to }}</span></sc-for></span></sc-if>
          </div>
          <sc-if value="{{ s.hasState }}" hint-placeholder-val="{{ false }}"><span style="{{ s.stateStyle }}">{{ s.state }}</span></sc-if>
          <sc-if value="{{ s.canEdit }}" hint-placeholder-val="{{ true }}">
          <span role="group" aria-label="{{ s.groupLabel }}" style="flex: none; display: inline-flex; gap: 4px">
            <button type="button" aria-label="Omhoog" title="Omhoog" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.41,15.41L12,10.83L16.59,15.41L18,14L12,8L6,14L7.41,15.41Z"></path></svg></button>
            <button type="button" aria-label="Omlaag" title="Omlaag" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"></path></svg></button>
            <button type="button" aria-label="Bewerken" title="Bewerken" aria-pressed="{{ s.pressed }}" style="{{ s.editStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z"></path></svg></button>
            <button type="button" aria-label="Verwijderen" title="Verwijderen" style="width: 34px; height: 34px; border: 0; border-radius: 8px; background: transparent; color: #a30000; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19,4H15.5L14.5,3H9.5L8.5,4H5V6H19M6,19A2,2 0 0,0 8,21H16A2,2 0 0,0 18,19V7H6V19Z"></path></svg></button>
          </span>
          </sc-if>
        </li>
      </sc-for>
    </ol>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding-top: 4px">
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border: 1px dashed #828a95; border-radius: 8px; background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"></path></svg>{{ addLabel }}</button>
      <span style="font-size: 13px; color: #5e6168">{{ addNote }}</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"flow":{"editor":null,"default":{"nodes":[{"id":"t","kind":"trigger","title":"Record aangemaakt","sub":"schema Melding","col":0,"row":1},{"id":"c","kind":"condition","title":"Prioriteit bepalen","sub":"beslistabel, 2 routes","col":1,"row":1},{"id":"h","kind":"human","title":"Beoordelen","sub":"team Openbare ruimte","col":2,"row":0},{"id":"m","kind":"message","title":"Melder bevestigen","sub":"sjabloon Ontvangstbevestiging","col":2,"row":2},{"id":"o","kind":"object","title":"Werkorder schrijven","sub":"bulk, overslaan als gelijk","col":3,"row":0},{"id":"e","kind":"end","title":"Einde","sub":"sluit de run af","col":4,"row":1}],"edges":[["t","c"],["c","h","hoog"],["c","m","normaal"],["h","o"],["o","e"],["m","e"]]}},"run":{"editor":null,"default":""},"selected":{"editor":"text","default":""},"triggerTitle":{"editor":"text","default":"Wanneer"},"stepsTitle":{"editor":"text","default":"Dan, in deze volgorde"},"addLabel":{"editor":"text","default":"Stap toevoegen"},"addNote":{"editor":"text","default":"Een nieuwe stap komt onderaan; zet hem met de pijlen op zijn plek."},"readonly":{"editor":null,"default":[]},"$preview":{"width":820,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const J = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return d; } } return v; };
    const flow = J(p.flow, { nodes: [], edges: [] });
    const run = J(p.run, null);
    const RUN = !!run && !!run.steps;
    const readonly = J(p.readonly, []);
    const selected = p.selected || '';
    const KIND = {
      trigger: ['#1e6b2a', 'Trigger', 'M11 15H6L13 1V9H18L11 23V15Z'],
      schedule: ['#1e6b2a', 'Op schema', 'M12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22C6.47,22 2,17.5 2,12A10,10 0 0,1 12,2M12.5,7V12.25L17,14.92L16.25,16.15L11,13V7H12.5Z'],
      manual: ['#1e6b2a', 'Handmatig', 'M8,5.14V19.14L19,12.14L8,5.14Z'],
      condition: ['#4a3f8f', 'Voorwaarde', 'M14,4L16.29,6.29L13.41,9.17L14.83,10.59L17.71,7.71L20,10V4M10,4H4V10L6.29,7.71L11,12.41V20H13V11.59L7.71,6.29'],
      action: ['#3669a5', 'Actie', 'M8,5.14V19.14L19,12.14L8,5.14Z'],
      message: ['#3669a5', 'Bericht', 'M22 6C22 4.9 21.1 4 20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6M20 6L12 11L4 6H20M20 18H4V8L12 13L20 8V18Z'],
      object: ['#3669a5', 'Object', 'M12,3C7.58,3 4,4.79 4,7C4,9.21 7.58,11 12,11C16.42,11 20,9.21 20,7C20,4.79 16.42,3 12,3M4,9V12C4,14.21 7.58,16 12,16C16.42,16 20,14.21 20,12V9C20,11.21 16.42,13 12,13C7.58,13 4,11.21 4,9M4,14V17C4,19.21 7.58,21 12,21C16.42,21 20,19.21 20,17V14C20,16.21 16.42,18 12,18C7.58,18 4,16.21 4,14Z'],
      document: ['#3669a5', 'Document', 'M6,2A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2H6M6,4H13V9H18V20H6V4M8,12V14H16V12H8M8,16V18H13V16H8Z'],
      human: ['#7a4f00', 'Taak', 'M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z'],
      approval: ['#7a4f00', 'Goedkeuring', 'M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z'],
      wait: ['#1d5e66', 'Wachten', 'M6,2V8H6V8L10,12L6,16V16H6V22H18V16H18V16L14,12L18,8V8H18V2H6M16,16.5V20H8V16.5L12,12.5L16,16.5M12,11.5L8,7.5V4H16V7.5L12,11.5Z'],
      ai: ['#6b2a8f', 'Agent', 'M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z'],
      subflow: ['#1d5e66', 'Subflow', 'M3,3H9V7H3V3M15,10H21V14H15V10M15,17H21V21H15V17M13,13H11V18H13V20H9V12H13V13Z'],
      code: ['#3d4047', 'Code', 'M14.6,16.6L19.2,12L14.6,7.4L16,6L22,12L16,18L14.6,16.6M9.4,16.6L4.8,12L9.4,7.4L8,6L2,12L8,18L9.4,16.6Z'],
      integration: ['#1d5e66', 'Koppeling', 'M16,7V3H14V7H10V3H8V7C7,7 6,8 6,9V14.5L9.5,18V21H14.5V18L18,14.5V9C18,8 17,7 16,7Z'],
      error: ['#a30000', 'Foutpad', 'M13,13H11V7H13M13,17H11V15H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z'],
      status: ['#234a78', 'Status', 'M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z'],
      end: ['#cc0000', 'Einde', 'M14.4,6H20V16H13L12.6,14H7V21H5V4H14L14.4,6Z'],
    };
    const OUT = { success: ['Geslaagd', '#e7f3ea', '#1e6b2a'], warning: ['Waarschuwing', '#fff4de', '#7a4f00'], info: ['Info', '#eaf0f7', '#234a78'], alert: ['Mislukt', '#fcedec', '#a30000'], waiting: ['Wacht', '#e3f1f3', '#1d5e66'], running: ['Bezig', '#eaf0f7', '#234a78'] };
    const edges = (flow.edges || []).map((e) => Array.isArray(e) ? { from: e[0], to: e[1], label: e[2] || '' } : e);
    const isStart = (n) => n.kind === 'trigger' || n.kind === 'schedule' || n.kind === 'manual';
    const ordered = flow.nodes.slice().sort((a, b) => (a.col - b.col) || (a.row - b.row));
    const triggersSrc = ordered.filter(isStart);
    const stepsSrc = ordered.filter((n) => !isStart(n));
    const numOf = {};
    stepsSrc.forEach((n, i) => { numOf[n.id] = i + 1; });
    const pill = (c) => 'padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; background: #ffffff; border: 1px solid ' + c + '; color: ' + c;
    const appPill = 'padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: #f0f1f3; color: #3d4047';
    const rowStyle = (sel, kind) => 'display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 10px; background: #ffffff; border: 1px solid ' + (sel ? '#3669a5' : '#e4e6ea') + (sel ? '; box-shadow: 0 0 0 2px #3669a5' : '') + (kind === 'end' ? '; background: #f5f6f8' : '');
    const stateOf = (n) => { if (!RUN) return null; const s = run.steps[n.id]; if (!s) return ['Niet uitgevoerd', '#f0f1f3', '#5e6168']; return OUT[s.level] || OUT.info; };
    const stateStyle = (st) => 'flex: none; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: ' + st[1] + '; color: ' + st[2];
    const triggers = triggersSrc.map((n) => { const k = KIND[n.kind] || KIND.trigger; const st = stateOf(n); return {
      title: n.title, sub: n.sub || '', kindWord: k[1], icon: k[2], pill: pill(k[0]), hasApp: !!n.app, app: n.app || '', appPill,
      row: rowStyle(n.id === selected, n.kind), editLabel: 'Trigger wijzigen',
      num: 'flex: none; width: 34px; height: 34px; border-radius: 17px; background: ' + k[0] + '; color: #ffffff; display: inline-flex; align-items: center; justify-content: center',
      hasState: !!st, state: st ? st[0] : '', stateStyle: st ? stateStyle(st) : '',
    }; });
    const steps = stepsSrc.map((n) => {
      const k = KIND[n.kind] || KIND.action;
      const into = edges.filter((e) => e.to === n.id && e.label);
      const outs = edges.filter((e) => e.from === n.id);
      const routes = outs.length > 1 ? outs.map((e) => ({ label: e.label || 'anders', to: numOf[e.to] ? 'stap ' + numOf[e.to] : (flow.nodes.find((x) => x.id === e.to) || {}).title })) : [];
      const st = stateOf(n);
      const sel = n.id === selected;
      const ro = readonly.indexOf(n.id) >= 0;
      return {
        n: numOf[n.id], title: n.title, sub: n.sub || '', kindWord: k[1], icon: k[2], colour: k[0], pill: pill(k[0]), hasApp: !!n.app, app: n.app || '', appPill,
        hasWhen: into.length > 0, when: 'alleen als ' + into.map((e) => e.label).join(' of '),
        hasRoutes: routes.length > 0, routes,
        row: rowStyle(sel, n.kind), pressed: sel ? 'true' : 'false',
        num: 'flex: none; width: 34px; height: 34px; border-radius: 17px; background: ' + (n.kind === 'end' ? '#f0f1f3' : '#eaf0f7') + '; color: ' + (n.kind === 'end' ? '#5e6168' : '#234a78') + '; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center',
        editStyle: 'width: 34px; height: 34px; border: 0; border-radius: 8px; background: ' + (sel ? '#eaf0f7' : 'transparent') + '; color: ' + (sel ? '#234a78' : '#3d4047') + '; display: inline-flex; align-items: center; justify-content: center',
        canEdit: !ro && !RUN, groupLabel: 'Acties voor stap ' + numOf[n.id],
        hasState: !!st || ro, state: st ? st[0] : 'Alleen beheerders', stateStyle: st ? stateStyle(st) : stateStyle(['', '#fff4de', '#7a4f00']),
      };
    });
    return { triggers, steps, triggerTitle: p.triggerTitle, stepsTitle: p.stepsTitle, addLabel: p.addLabel, addNote: p.addNote };
  }
}
</script>
</body>
</html>
