<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: conversation list, row states, filter and sort</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2260px; padding: 28px 24px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; gap: 24px; overflow: hidden">
  <sc-for list="{{ lists }}" as="f" hint-placeholder-count="4">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; {{ f.place }}">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">{{ f.letter }}</span> &nbsp;{{ f.caption }}</figcaption>
      <div style="height: {{ f.height }}; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
        <section aria-label="{{ f.title }}" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
            <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap">{{ f.title }}</h2><span style="font-size: 13px; color: #5e6168; white-space: nowrap">{{ f.countLine }}</span></div>
            <div style="display: flex; gap: 2px; flex: none">
              <button type="button" aria-label="Fold the conversation list" aria-expanded="true" title="Fold the conversation list" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16M15 4v16"></path></svg></button>
              <button type="button" aria-label="More for this list" title="More" aria-haspopup="menu" aria-expanded="{{ f.moreOpen }}" style="{{ f.moreStyle }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle></svg><sc-if value="{{ f.filterOpen }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 4px; right: 4px; min-width: 14px; height: 14px; border-radius: 7px; background: #3669a5; color: #ffffff; font-size: 10px; font-weight: 700; line-height: 14px; text-align: center">1</span></sc-if></button>
            </div>
          </div>
          <div role="group" aria-label="Filter" style="flex: none; display: flex; gap: 8px; padding: 0 16px 12px; border-bottom: 1px solid #e4e6ea">
            <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{ c.on }}" title="{{ c.title }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
          </div>
          <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <sc-for list="{{ f.rows }}" as="r" hint-placeholder-count="10">
              <sc-if value="{{ r.heading }}" hint-placeholder-val="{{ false }}">
                <li aria-hidden="true" style="display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 16px; box-sizing: border-box; background: #f5f6f8; border-bottom: 1px solid #e4e6ea; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168"><sc-if value="{{ r.hasIcon }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.icon }}"></path></svg></sc-if>{{ r.label }}<span style="font-weight: 400; letter-spacing: 0; text-transform: none">{{ r.count }}</span></li>
              </sc-if>
              <sc-if value="{{ r.row }}" hint-placeholder-val="{{ true }}">
                <li style="position: relative; {{ r.style }}">
                  <a href="MlThread.dc.html" aria-current="{{ r.current }}" title="{{ r.rowTitle }}" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
                    <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
                    <sc-if value="{{ r.avatarInitials }}" hint-placeholder-val="{{ true }}"><span style="{{ r.avatar }}">{{ r.initials }}</span></sc-if>
                    <sc-if value="{{ r.avatarPhoto }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Photo of {{ r.from }} from the address book" style="flex: none; width: 32px; height: 32px; margin-top: 2px; border-radius: 16px; background: radial-gradient(circle at 50% 38%, #e8c9b0 0 30%, #4a3a30 31% 100%); box-shadow: inset 0 -9px 0 #3669a5"></span></sc-if>
                    <sc-if value="{{ r.avatarSite }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Website icon of {{ r.site }}" style="flex: none; width: 32px; height: 32px; margin-top: 2px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">{{ r.initials }}</span></sc-if>
                    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0">
                      <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                        <span style="{{ r.sender }}">{{ r.from }}</span>
                        <sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if>
                        <span style="flex: 1 1 auto"></span>
                        <span style="{{ r.dateStyle }}">{{ r.date }}</span>
                      </span>
                      <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                        <span style="{{ r.subjectStyle }}">{{ r.subject }}</span>
                        <sc-if value="{{ r.mention }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="You were mentioned" style="flex: none; width: 18px; height: 18px; border-radius: 9px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg></span></sc-if>
                        <sc-if value="{{ r.encrypted }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Encrypted message" style="flex: none; color: #5e6168"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg></sc-if>
                        <sc-if value="{{ r.hasAttach }}" hint-placeholder-val="{{ true }}"><span role="img" aria-label="Has attachments" style="flex: none; display: inline-flex; align-items: center; gap: 2px; color: #5e6168; font-size: 12px{{ r.hideOnHover }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.attachIcon }}"></path></svg>{{ r.attachCount }}</span></sc-if>
                        <sc-if value="{{ r.starred }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ff9d2e" stroke="#ff9d2e" stroke-width="1.75" stroke-linejoin="round" aria-label="Starred" role="img" style="flex: none"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></sc-if>
                      </span>
                      <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                        <sc-if value="{{ r.draft }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; font-weight: 600; line-height: 1; color: #3d4047; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Draft</span></sc-if>
                        <sc-if value="{{ r.failed }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; font-weight: 600; line-height: 1; color: #cc0000; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg>Delivery failed</span></sc-if>
                        <sc-if value="{{ r.sending }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; font-weight: 600; line-height: 1; color: #5e6168; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>Sending</span></sc-if>
                        <sc-if value="{{ r.hasChip }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; line-height: 1; white-space: nowrap"><span style="{{ r.chipType }}">{{ r.wpType }}</span><span style="color: #3d4047">{{ r.wpNumber }}</span><span style="{{ r.chipDot }}"></span><span style="color: #3d4047">{{ r.wpStatus }}</span></span></sc-if>
                        <sc-for list="{{ r.labels }}" as="l" hint-placeholder-count="1"><span style="flex: none; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f0f1f3; font-size: 11px; line-height: 1; color: #3d4047; white-space: nowrap"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{ l.colour }}"></span>{{ l.name }}</span></sc-for>
                        <sc-if value="{{ r.hasAssignee }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Assigned to {{ r.assignee }}" title="Assigned to {{ r.assignee }}" style="flex: none; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px 0 2px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; line-height: 1; color: #3d4047; white-space: nowrap"><span style="width: 16px; height: 16px; border-radius: 8px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 8px; font-weight: 700">{{ r.assigneeInitials }}</span>{{ r.assignee }}</span></sc-if>
                        <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span>
                      </span>
                    </span>
                  </a>
                  <sc-if value="{{ r.hover }}" hint-placeholder-val="{{ false }}">
                    <div role="group" aria-label="Row actions" style="position: absolute; right: 10px; top: 6px; display: flex; gap: 2px; padding: 2px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); box-shadow: 0 2px 6px rgba(27,28,29,0.12)">
                      <button type="button" aria-label="Mark as read" title="Mark as read" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0l8 6zM22 10l-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10"></path></svg></button>
                      <button type="button" aria-label="Star" title="Star" aria-pressed="false" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
                      <button type="button" aria-label="Delete" title="Delete" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                    </div>
                  </sc-if>
                </li>
              </sc-if>
            </sc-for>
          </ol>
          <sc-if value="{{ f.footer }}" hint-placeholder-val="{{ false }}">
            <button type="button" style="flex: none; display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; margin: 0; padding: 0; border: 0; border-bottom: 1px solid #e4e6ea; background: #ffffff; color: var(--sc-link, #3669a5); font: 600 13px 'Fira Sans', sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>Load 50 more conversations</button>
            <div style="flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; height: 40px; font-size: 12px; color: #5e6168"><span>Checked for new mail at 07:12</span><button type="button" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>Check now</button></div>
          </sc-if>
        </section>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; background: #f5f6f8; text-align: center">
          <span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; border: 1px solid #e4e6ea; display: inline-flex; align-items: center; justify-content: center; color: #5e6168; margin-bottom: 8px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">Select a conversation</h3>
          <p style="margin: 0; max-width: 220px; font-size: 14px; color: #5e6168">Pick one from the list to read it here.</p>
        </main>

        <sc-if value="{{ f.moreOpen }}" hint-placeholder-val="{{ false }}">
          <div role="menu" aria-label="More for this list" style="position: absolute; left: 416px; top: 46px; margin-top: 4px; width: 262px; min-width: 262px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 2px">
            <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="{{ f.filterOpen }}" style="{{ f.groupStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg><span style="flex: 1 1 auto">Filter conversations</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ f.filterChev }}"></path></svg></button>
            <sc-if value="{{ f.filterOpen }}" hint-placeholder-val="{{ false }}">
            <div style="padding: 4px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Narrow this view</div>
            <sc-for list="{{ filterItems }}" as="m" hint-placeholder-count="6">
              <sc-if value="{{ m.group }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="height: 1px; margin: 4px 0; background: #e4e6ea"></span><div style="padding: 4px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ m.label }}</div></sc-if>
              <sc-if value="{{ m.item }}" hint-placeholder-val="{{ true }}"><button type="button" role="menuitemcheckbox" aria-checked="{{ m.on }}" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><span aria-hidden="true" style="{{ m.box }}"><sc-if value="{{ m.checked }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span><span style="flex: 1 1 auto">{{ m.label }}</span><span style="font-size: 12px; color: #5e6168">{{ m.count }}</span></button></sc-if>
            </sc-for>
            <span aria-hidden="true" style="height: 1px; margin: 4px 0; background: #e4e6ea"></span>
            <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M18 6 6 18M6 6l12 12"></path></svg><span style="flex: 1 1 auto">Clear filters</span><span style="font-size: 12px; font-weight: 400; color: #5e6168">1 on</span></button>
            <span aria-hidden="true" style="height: 1px; margin: 4px 0; background: #e4e6ea"></span>
            </sc-if>
            <button type="button" role="menuitem" style="{{ f.groupStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg><span style="flex: 1 1 auto">Select conversations</span></button>
            <button type="button" role="menuitem" aria-haspopup="true" aria-expanded="{{ f.sortOpen }}" style="{{ f.groupStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path></svg><span style="flex: 1 1 auto">Sort conversations</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ f.sortChev }}"></path></svg></button>
            <sc-if value="{{ f.sortOpen }}" hint-placeholder-val="{{ false }}">
            <div style="padding: 4px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Order</div>
            <sc-for list="{{ sortOrder }}" as="m" hint-placeholder-count="2">
              <button type="button" role="menuitemradio" aria-checked="{{ m.on }}" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><span aria-hidden="true" style="{{ m.dot }}"></span><span style="flex: 1 1 auto">{{ m.label }}</span></button>
            </sc-for>
            <span aria-hidden="true" style="height: 1px; margin: 4px 0; background: #e4e6ea"></span>
            <div style="padding: 4px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Sort by</div>
