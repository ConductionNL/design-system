<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: public booking page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1504px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The booking page of Olivia Brandt as a visitor without an account sees it: her three public schedules, the 30 minute introduction chosen, a date picked, the open slots in a chosen time zone, and the short form</figcaption>
    <div style="position: relative; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <header style="flex: none; display: flex; align-items: center; gap: 16px; height: 55px; padding: 0 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea; background: #ffffff">
        <span style="display: inline-flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600"><span aria-hidden="true" style="width: 26px; height: 26px; border-radius: 6px; background: #3669a5; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">NP</span>Northwind Projects</span>
        <span style="width: 1px; height: 22px; background: #e4e6ea"></span>
        <span style="font-size: 14px; color: #3d4047">Book an appointment</span>
        <span style="flex: 1 1 auto"></span>
        <span style="font-size: 12px; color: #5e6168">No account needed.</span>
      </header>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">

        <aside aria-label="Olivia Brandt" style="flex: 0 0 320px; width: 320px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; padding: 24px 20px; background: #f5f6f8; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="flex: none; width: 48px; height: 48px; border-radius: 24px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">OB</span>
            <span style="display: flex; flex-direction: column; line-height: 1.25"><strong style="font-size: 16px; font-weight: 600">Olivia Brandt</strong><span style="font-size: 12px; color: #5e6168">Delivery lead, Northwind Projects</span></span>
          </div>
          <p style="margin: 0; font-size: 13px; line-height: 19px; color: #3d4047">Pick the kind of appointment, then a date and a time. You get a confirmation link by mail.</p>
          <section aria-labelledby="bk-schedules" style="display: flex; flex-direction: column; gap: 4px">
            <h2 id="bk-schedules" style="margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">All public schedules of Olivia Brandt</h2>
            <sc-for list="{{ schedules }}" as="s" hint-placeholder-count="3">
              <a href="#" aria-current="{{ s.current }}" style="{{ s.style }}"><span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.25"><span style="font-weight: 600">{{ s.name }}</span><span style="font-size: 12px; color: #5e6168">{{ s.sub }}</span></span></a>
            </sc-for>
          </section>
          <div style="margin-top: auto; font-size: 12px; color: #5e6168; line-height: 18px">Only open slots are shown, in the time zone you choose at the right. Slots already taken are left out.</div>
        </aside>

        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px 28px; background: #ffffff; overflow: hidden">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">30 minute introduction</h1>
            <span style="font-size: 14px; color: #3d4047">A first call about your project and what OpenProject with Nextcloud can do for it. Video call, the link comes with the confirmation.</span>
          </div>
          <div style="display: flex; gap: 28px; align-items: flex-start">
            <div role="group" aria-label="Pick a date" style="flex: 0 0 340px; width: 340px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: center; justify-content: space-between; height: 30px">
                <span style="font-size: 15px; font-weight: 600">October <span style="font-weight: 400; color: #5e6168">2026</span></span>
                <span style="display: flex; gap: 2px">
                  <button type="button" aria-label="Previous month" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
                  <button type="button" aria-label="Next month" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
                </span>
              </div>
              <div style="display: grid; grid-template-columns: repeat(7, 1fr); font-size: 12px; color: #5e6168; text-align: center; line-height: 24px"><sc-for list="{{ dow }}" as="d" hint-placeholder-count="7"><span>{{ d }}</span></sc-for></div>
              <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px">
                <sc-for list="{{ cells }}" as="c" hint-placeholder-count="35"><button type="button" aria-label="{{ c.aria }}" aria-pressed="{{ c.pressed }}" aria-disabled="{{ c.disabled }}" style="{{ c.style }}">{{ c.n }}</button></sc-for>
              </div>
              <span style="font-size: 12px; color: #5e6168; line-height: 18px">Bold days have open slots. Olivia takes bookings up to 6 weeks ahead.</span>
            </div>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
                <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 34px">Wednesday 14 October</h2>
                <div style="display: flex; align-items: center; gap: 8px"><label for="bk-tz" style="font-size: 13px; color: #5e6168; white-space: nowrap">Times shown in</label><button id="bk-tz" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap"><span>Europe/Stockholm, CEST</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
              </div>
              <div role="radiogroup" aria-label="Open slots on Wednesday 14 October" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
                <sc-for list="{{ slots }}" as="s" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ s.on }}" style="{{ s.style }}">{{ s.time }}</button></sc-for>
              </div>
              <span style="font-size: 12px; color: #5e6168; line-height: 18px">6 open slots of 30 minutes. Detected from your browser; change the time zone if you are travelling.</span>
            </div>
          </div>

          <form style="display: flex; flex-direction: column; gap: 16px; margin-top: 6px; padding-top: 16px; border-top: 1px solid #e4e6ea">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 24px">Your details</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px">
              <div style="display: flex; flex-direction: column; gap: 6px"><label for="bk-name" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Name</label><input id="bk-name" type="text" value="Sven Lindqvist" autocomplete="name" style="{{ input }}"></div>
              <div style="display: flex; flex-direction: column; gap: 6px"><label for="bk-mail" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Email address</label><input id="bk-mail" type="email" value="sven.lindqvist@malmo-energi.se" autocomplete="email" style="{{ input }}"></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px"><label for="bk-note" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Note for Olivia, optional</label><textarea id="bk-note" rows="2" style="width: 100%; padding: 9px 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px/21px 'Fira Sans', sans-serif; color: #1b1c1d; resize: none">We are looking at OpenProject for about 1,200 users. I would like to hear how the mail and calendar link works.</textarea></div>
            <div style="display: flex; align-items: center; gap: 12px">
              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Book Wednesday 14 October, 11:30</button>
              <span style="font-size: 12px; color: #5e6168; line-height: 18px">Without an account. We mail you a link to confirm; the slot is held for 24 hours until you do.</span>
            </div>
          </form>
        </main>
      </div>
    </div>
  </figure>

  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The slot was taken meanwhile</figcaption>
      <div style="{{ small }}">
        <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #fbeaea; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #cc0000"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg><span><strong style="font-weight: 600">11:30 was taken a moment ago.</strong> Someone else booked it while you were typing. Choose another slot; your details are kept.</span></div>
        <h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 24px">Still open on Wednesday 14 October</h3>
        <div role="radiogroup" aria-label="Open slots" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px">
          <sc-for list="{{ slotsLeft }}" as="s" hint-placeholder-count="5"><button type="button" role="radio" aria-checked="{{ s.on }}" style="{{ s.style }}">{{ s.time }}</button></sc-for>
        </div>
        <div style="margin-top: auto; display: flex; flex-direction: column; align-items: flex-start; gap: 8px"><button type="button" style="{{ primary }}">Book Wednesday 14 October, 13:00</button><a href="#" style="font-size: 12px; color: var(--sc-link, #3669a5)">Another day</a></div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;After booking: confirm by mail within 24 hours</figcaption>
      <div style="{{ small }}">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
        <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Check your mail</h3>
        <p style="margin: 0; font-size: 13px; line-height: 19px; color: #3d4047">We sent a link to <strong style="font-weight: 600; color: #1b1c1d">sven.lindqvist@malmo-energi.se</strong>. Open it to confirm your 30 minute introduction with Olivia Brandt on Wednesday 14 October at 11:30 CEST.</p>
        <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 12px; line-height: 18px; color: #3d4047"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px; color: #3669a5"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2"></path></svg><span>The link is valid for 24 hours, until Tuesday 13 October 09:12. Until then the slot is held for you; after that it opens up again.</span></div>
        <div style="margin-top: auto; font-size: 12px; line-height: 18px; color: #5e6168">Nothing arrived? Look in the spam folder, or <a href="#" style="color: var(--sc-link, #3669a5)">send the link again</a>.</div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;The page behind the link in the confirmation: two choices</figcaption>
      <div style="{{ small }}">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Your appointment with Olivia Brandt</h3>
          <span style="font-size: 14px; color: #3d4047">30 minute introduction, Wednesday 14 October, 11:30 to 12:00 CEST. Confirmed.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
          <button type="button" style="{{ secondary }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Reschedule</button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Cancel the appointment</button>
        </div>
        <span style="margin-top: auto; font-size: 12px; color: #5e6168; line-height: 18px">Reschedule keeps this page and opens the slots again. Cancel asks you for a reason first.</span>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;After Cancel the appointment: the reason, then one red button</figcaption>
      <div style="{{ small }}">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Cancel the appointment</h3>
          <span style="font-size: 14px; color: #3d4047">30 minute introduction, Wednesday 14 October, 11:30 to 12:00 CEST.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="bk-reason" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Reason, so Olivia knows</label><textarea id="bk-reason" rows="3" style="width: 100%; padding: 9px 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px/21px 'Fira Sans', sans-serif; color: #1b1c1d; resize: none">Our board meeting moved to Wednesday. I will book a new slot for Thursday.</textarea></div>
        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-start">
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #cc0000; color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Cancel and send the reason</button>
          <button type="button" style="{{ quietBtn }}">Keep the appointment</button>
          <span style="font-size: 12px; color: #5e6168; line-height: 18px">Olivia gets your reason by mail. The slot opens again for others.</span>
        </div>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1504}}'>
class Component extends DCLogic {
  renderVals() {
    const primary = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const secondary = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const input = 'width: 100%; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px \'Fira Sans\', sans-serif; color: #1b1c1d';
    const quietBtn = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; margin-left: -10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const small = 'height: 460px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 20px 22px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden';
    const schedules = [
      ['30 minute introduction', '30 minutes, video call', true],
      ['Project check-in', '30 minutes, video call, for current customers', false],
      ['Customer intro', '45 minutes, video call, up to 6 people', false]
    ].map(([name, sub, on]) => ({ name, sub, current: on ? 'page' : 'false', style: 'display: flex; align-items: center; min-height: 48px; padding: 6px 12px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 13px; ' + (on ? 'background: #eaf0f7; color: #234a78; border: 1px solid #3669a5;' : 'background: #ffffff; color: #1b1c1d; border: 1px solid #e4e6ea;') }));
    const dow = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
    // October 2026 from Monday 28 September to Sunday 1 November; open days are weekdays from 13 October on
    const raw = [[28, 0], [29, 0], [30, 0], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1], [7, 1], [8, 1], [9, 1], [10, 1], [11, 1], [12, 1], [13, 1], [14, 1], [15, 1], [16, 1], [17, 1], [18, 1], [19, 1], [20, 1], [21, 1], [22, 1], [23, 1], [24, 1], [25, 1], [26, 1], [27, 1], [28, 1], [29, 1], [30, 1], [31, 1], [1, 2]];
    const cells = raw.map(([n, m], i) => {
      const weekend = i % 7 >= 5;
      const other = m !== 1;
      const open = m === 1 && n >= 13 && !weekend && n !== 22;
      const picked = m === 1 && n === 14;
      const today = m === 1 && n === 12;
      return {
        n, aria: (open ? 'Open, ' : 'No slots, ') + n + ' October', pressed: picked ? 'true' : 'false', disabled: open ? 'false' : 'true',
        style: 'height: 36px; padding: 0; border: 0; border-radius: var(--sc-radius, 8px); font: ' + (open ? '600' : '400') + ' 13px \'Fira Sans\', sans-serif; cursor: ' + (open ? 'pointer' : 'default') + '; ' +
          (picked ? 'background: var(--sc-action, #3669a5); color: #ffffff;' : open ? 'background: #eaf0f7; color: #234a78;' : today ? 'background: transparent; color: #1b1c1d; box-shadow: inset 0 0 0 1px #c4c7cb;' : 'background: transparent; color: #5e6168;' + (other ? ' opacity: 0.45;' : ''))
      };
    });
    const slot = (time, on) => ({ time, on: on ? 'true' : 'false', style: 'height: 40px; border: 1px solid ' + (on ? '#3669a5' : '#c4c7cb') + '; border-radius: var(--sc-radius, 8px); background: ' + (on ? '#eaf0f7' : '#ffffff') + '; color: ' + (on ? '#234a78' : '#1b1c1d') + '; font: ' + (on ? '600' : '500') + ' 14px \'Fira Sans\', sans-serif' });
    const slots = ['09:00', '09:30', '11:30', '13:00', '15:00', '15:30'].map((t) => slot(t, t === '11:30'));
    const slotsLeft = ['09:00', '09:30', '13:00', '15:00', '15:30'].map((t) => slot(t, t === '13:00'));
    return { quietBtn, primary, secondary, input, small, schedules, dow, cells, slots, slotsLeft };
  }
}
</script>
</body>
</html>
