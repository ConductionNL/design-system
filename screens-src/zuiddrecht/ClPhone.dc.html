<x-dc>
<helmet>

<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 3530px; padding: 26px 0; display: flex; flex-direction: column; align-items: center; gap: 24px; overflow: hidden">

        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Change the time zone, now CEST" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 12px; border: 1px solid #ffffff; border-radius: var(--sc-radius, 8px); background: rgba(255,255,255,0.18); color: #ffffff; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap">CEST<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>

    <div style="position: relative; width: 390px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: 24px; overflow: hidden">
      <header style="flex: none; height: 55px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 2px; background: #3669a5; color: #ffffff">

        });

    const HH = 50, DOFF = 12;
