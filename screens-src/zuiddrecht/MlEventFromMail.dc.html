              <button type="button" aria-expanded="false" aria-label="Show the whole message from {{ m.from }}, {{ m.date }}" style="{{ m.style }}">

                <span style="{{ m.avatar }}">{{ m.initials }}</span>
                <span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span>
                <span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ m.snippet }}</span>
                <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.date }}</span>
              </button>
            </sc-for>
            <article aria-label="Message from Marc Dubois, today 06:00" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
                <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">MD</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                  <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Marc Dubois</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">marc.dubois@mairie-lyon.fr</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 06:00</span></div>
                  <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
                </div>
                <button type="button" aria-label="More actions for this message" aria-haspopup="menu" aria-expanded="true" style="flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
              </div>

                <p style="margin: 0">Hi Olivia,</p>
                <p style="margin: 0">Good. Then we are go for 2 November. One more request from the department head: can the kick-off move to the afternoon?</p>
                <p style="margin: 0">Best regards,<br>Marc</p>
              </div>
            </article>
          </div>
          <div role="menu" aria-label="More actions for this message" style="position: absolute; right: 24px; top: 384px; margin-top: 4px; width: 340px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column">
              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap; background: transparent; color: #1b1c1d;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M9 17l-5-5 5-5M20 18v-2a4 4 0 0 0-4-4H4"></path></svg><span style="flex: 1 1 auto">Reply</span></button>
              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap; background: transparent; color: #1b1c1d;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M7 17l-5-5 5-5M12 17l-5-5 5-5M22 18v-2a4 4 0 0 0-4-4H7"></path></svg><span style="flex: 1 1 auto">Reply all</span></button>
              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap; background: transparent; color: #1b1c1d;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M15 17l5-5-5-5M4 18v-2a4 4 0 0 1 4-4h12"></path></svg><span style="flex: 1 1 auto">Forward</span></button>

              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap; background: transparent; color: #1b1c1d;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg><span style="flex: 1 1 auto">New task from this mail</span></button>
              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap; background: transparent; color: #1b1c1d;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg><span style="flex: 1 1 auto">Link this message to a work package</span></button>
              <div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div>
              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap; background: transparent; color: #1b1c1d;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M16 13H8M16 17H8M10 9H8"></path></svg><span style="flex: 1 1 auto">Show original</span></button>
              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap; background: transparent; color: #1b1c1d;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"></path></svg><span style="flex: 1 1 auto">Print</span></button>
            </div>
        </main>
        <aside aria-label="New event from this mail" style="flex: 0 0 440px; width: 440px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
          <div style="display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 8px 0 16px; border-bottom: 1px solid #e4e6ea">

              <button type="button" role="radio" aria-checked="false" style="height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; background: #ffffff; color: #3d4047; font: 600 14px 'Fira Sans', sans-serif">Task</button>
            </div>
            <button type="button" aria-label="Close the panel" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 16px; overflow: hidden">
            <p style="margin: 0; font-size: 13px; color: #5e6168; line-height: 18px">An event has a time and invited people. A task gets a due date and no people.</p>

            <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; line-height: 18px; color: #3d4047">

              <span style="flex: 1 1 auto; min-width: 0">Title and description drafted by the assistant from this conversation. Check them before you send.</span>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px">
