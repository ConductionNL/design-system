<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: sections in the user settings dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 3660px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <sc-for list="{{ frames }}" as="fr" hint-placeholder-count="4">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">{{ fr.letter }}</span> &nbsp;{{ fr.caption }}</figcaption>
      <div style="{{ fr.frameStyle }}">
        <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,68px"></dc-import>
        <div style="display: flex; flex: 1 1 auto; min-height: 0">
          <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" hint-size="264px,665px"></dc-import></div>
          <main aria-hidden="true" style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
            <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">9 open work packages</span></div>
              <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
                <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
                <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
                <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>
              </div>
              <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Status. Choose assignee or version" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Status<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <div style="flex: 1 1 auto"></div>
              <button type="button" aria-pressed="false" aria-haspopup="dialog" aria-keyshortcuts="F" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter</button>
              <div role="group" aria-label="Members" style="flex: none; display: flex; align-items: center">
                <span title="Olivia Brandt" aria-label="Olivia Brandt" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #eaf0f7; color: #234a78">OB</span>
                <span title="Tom Achterberg" aria-label="Tom Achterberg" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">TA</span>
                <span title="Priya Raman" aria-label="Priya Raman" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">PR</span>
                <span title="2 more members" aria-label="2 more members" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eef0f3; color: #3d4047">+2</span>
              </div>
              <button type="button" aria-pressed="false" aria-haspopup="dialog" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg>Project details</button>
            </div>
            <div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; padding: 12px; overflow: hidden">
              <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
                <section style="flex: 0 0 226px; width: 226px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; align-self: flex-start; max-height: 100%">
                  <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px">
                    <span style="{{ col.dot }}"></span>
                    <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.name }}</h2>
                    <span style="{{ col.countStyle }}">{{ col.count }}</span>
                  </div>
                  <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
                    <div style="{{ c.style }}">
                      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="{{ c.typeStyle }}">{{ c.type }}</span><span style="color: #3d4047">{{ c.number }}</span></span>
                      <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">{{ c.subject }}</span>
                      <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
                        <sc-if value="{{ c.hasAssignee }}" hint-placeholder-val="{{ true }}"><span style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ c.initials }}</span></sc-if>
                        <sc-if value="{{ c.hasDue }}" hint-placeholder-val="{{ true }}"><span style="{{ c.dueStyle }}">{{ c.due }}</span></sc-if>
                      </span>
                    </div>
                  </sc-for>
                </section>
              </sc-for>
            </div>
          </main>
        </div>

        <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 20px">
          <div role="dialog" aria-modal="true" aria-labelledby="tb-settings-title" style="width: 960px; min-height: 720px; box-sizing: border-box; display: flex; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); overflow: hidden">
            <div style="flex: 0 0 236px; width: 236px; display: flex; align-items: stretch; overflow: hidden">
              <sc-if value="{{ fr.isGeneral }}" hint-placeholder-val="{{ true }}"><dc-import name="TbSettingsNav" active="General" hint-size="236px,720px"></dc-import></sc-if>
              <sc-if value="{{ fr.isNotify }}" hint-placeholder-val="{{ false }}"><dc-import name="TbSettingsNav" active="Notifications" hint-size="236px,720px"></dc-import></sc-if>
              <sc-if value="{{ fr.isOp }}" hint-placeholder-val="{{ false }}"><dc-import name="TbSettingsNav" active="OpenProject" hint-size="236px,720px"></dc-import></sc-if>
              <sc-if value="{{ fr.isKeys }}" hint-placeholder-val="{{ false }}"><dc-import name="TbSettingsNav" active="Shortcuts" hint-size="236px,720px"></dc-import></sc-if>
            </div>
            <section aria-label="{{ fr.title }}" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
              <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 16px 20px 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
                <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">{{ fr.title }}</h3>
                <span style="flex: 1 1 auto; font-size: 13px; color: #5e6168">{{ fr.saved }}</span>
                <button type="button" aria-label="Close settings" style="flex: none; width: 40px; height: 40px; margin: -8px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
              </div>
              <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 24px 24px">

                <sc-if value="{{ fr.isGeneral }}" hint-placeholder-val="{{ true }}">
                  <div style="display: flex; flex-direction: column; gap: 8px">
                    <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="{{ h4 }}">New work packages</h4><p style="{{ hint }}">A work package made from a mail, a meeting or the New button starts in this column of the board.</p></div>
                    <div style="display: flex; align-items: center; gap: 12px">
                      <label for="tb-set-default" style="font-weight: 600; white-space: nowrap">Default column for new work packages</label>
                      <button id="tb-set-default" type="button" aria-haspopup="listbox" style="{{ chooser }}"><span style="display: inline-flex; align-items: center; gap: 8px"><span style="{{ dotNew }}"></span>new</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
                    </div>
                  </div>
                  <div style="{{ switchRow }}">
                    <label for="tb-set-reopen" style="{{ switchLabel }}"><span style="font-weight: 600">Open the app where you left it</span><span style="{{ hint }}">Reopens the board, list or filter you looked at last. Off opens My day every time.</span></label>
                    <button id="tb-set-reopen" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                  </div>
                  <div style="{{ switchRow }}">
                    <label for="tb-set-badge" style="{{ switchLabel }}"><span style="font-weight: 600">Show the number on every card</span><span style="{{ hint }}">The work package number, like #58412, sits before the subject so you can say it aloud or search for it.</span></label>
                    <button id="tb-set-badge" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
                    <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="{{ h4 }}">Navigation filters</h4><p style="{{ hint }}">Which filters show under Filters in the navigation, and when.</p></div>
                    <div style="{{ tableWrap }}"><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px">
                      <thead><tr style="background: #fafbfc"><th scope="col" style="{{ th }}">Filter</th><th scope="col" style="{{ th }}">Shown</th></tr></thead>
                      <tbody>
                        <sc-for list="{{ filters }}" as="f" hint-placeholder-count="5">
                          <tr style="border-top: 1px solid #eef0f3">
                            <td style="padding: 14px 16px"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; line-height: 20px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ f.icon }}"></path></svg>{{ f.name }}<span style="font-size: 12px; color: #5e6168">{{ f.count }}</span></span></td>
                            <td style="padding: 7px 16px; line-height: 0"><div role="radiogroup" aria-label="Show {{ f.name }}" style="{{ seg }}"><sc-for list="{{ f.options }}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ o.on }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></td>
                          </tr>
                        </sc-for>
                      </tbody>
                    </table></div>
                  </div>
                  <div style="display: flex; align-items: center; gap: 12px; padding-top: 16px; border-top: 1px solid #e4e6ea; font-size: 14px; color: #5e6168">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                    <span>The language follows your account: English. The app is available in 38 languages. <a href="#" style="color: var(--sc-link, #3669a5)">Change it in your account settings</a></span>
                  </div>
                </sc-if>

                <sc-if value="{{ fr.isNotify }}" hint-placeholder-val="{{ false }}">
                  <div style="display: flex; flex-direction: column; gap: 8px">
                    <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="{{ h4 }}">Project activity</h4><p style="{{ hint }}">Which kinds of activity reach the bell in the header, and your mail at olivia@northwind-projects.test.</p></div>
                    <div style="{{ tableWrap }}"><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px">
                      <thead><tr style="background: #fafbfc"><th scope="col" style="{{ th }}">Kind of activity</th><th scope="col" style="{{ th }} text-align: center; width: 120px">In the bell</th><th scope="col" style="{{ th }} text-align: center; width: 120px">By mail</th></tr></thead>
                      <tbody>
                        <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="6">
                          <tr style="border-top: 1px solid #eef0f3">
                            <td style="padding: 14px 16px"><span style="display: block; font-size: 15px; font-weight: 600; line-height: 20px">{{ k.name }}<span style="font-size: 13px; font-weight: 400; color: #5e6168"> {{ k.hint }}</span></span></td>
                            <td style="padding: 12px 16px; text-align: center; line-height: 0"><button type="button" role="switch" aria-checked="{{ k.stream.checked }}" aria-label="{{ k.name }} in the bell" style="{{ k.stream.switch }}"><span style="{{ k.stream.knob }}"></span></button></td>
                            <td style="padding: 12px 16px; text-align: center; line-height: 0"><button type="button" role="switch" aria-checked="{{ k.mail.checked }}" aria-label="{{ k.name }} by mail" style="{{ k.mail.switch }}"><span style="{{ k.mail.knob }}"></span></button></td>
                          </tr>
                        </sc-for>
                      </tbody>
                    </table></div>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
                    <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="{{ h4 }}">Due reminders</h4><p style="{{ hint }}">The day before a work package is due, at 08:00. Choose per project which work packages remind you.</p></div>
                    <div style="{{ tableWrap }}"><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px">
                      <thead><tr style="background: #fafbfc"><th scope="col" style="{{ th }}">Project</th><th scope="col" style="{{ th }}">Reminders for</th></tr></thead>
                      <tbody>
                        <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
                          <tr style="border-top: 1px solid #eef0f3">
                            <td style="padding: 14px 16px"><span style="display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; line-height: 20px"><span style="{{ p.swatch }}"></span>{{ p.name }}<span style="font-size: 12px; color: #5e6168">{{ p.count }}</span></span></td>
                            <td style="padding: 7px 16px; line-height: 0"><div role="radiogroup" aria-label="Due reminders for {{ p.name }}" style="{{ seg }}"><sc-for list="{{ p.options }}" as="o" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ o.on }}" style="{{ o.style }}">{{ o.label }}</button></sc-for></div></td>
                          </tr>
                        </sc-for>
                      </tbody>
                    </table></div>
                    <div style="{{ switchRow }}; padding-top: 4px">
                      <label for="tb-set-due-mail" style="{{ switchLabel }}"><span style="font-weight: 600">Also send due reminders by mail</span><span style="{{ hint }}">Off keeps them in the bell only.</span></label>
                      <button id="tb-set-due-mail" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                    </div>
                    <p style="{{ hint }}">Reminders you set on a work package itself always arrive.</p>
                  </div>
                </sc-if>

                <sc-if value="{{ fr.isOp }}" hint-placeholder-val="{{ false }}">
                  <p style="margin: 0; font-size: 14px; color: #3d4047; line-height: 21px">These settings apply to every project. The connection of this workspace to OpenProject is set up by an administrator.</p>
                  <div style="display: flex; flex-direction: column; gap: 8px">
                    <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="{{ h4 }}">Your OpenProject account</h4><p style="{{ hint }}">Work packages, projects and members you see here are the ones this account may see in OpenProject.</p></div>
                    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #f5f6f8">
                      <span style="{{ dotOk }}"></span>
                      <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><span style="font-weight: 600">Signed in as olivia.brandt on openproject.northwind-projects.test</span><span style="font-size: 13px; color: #5e6168">Since 14 March 2026. Synced 2 minutes ago.</span></span>
                      <button type="button" style="{{ btnSmall }}">Sign out of OpenProject</button>
                    </div>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 12px; padding-top: 16px; border-top: 1px solid #e4e6ea">
                    <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="{{ h4 }}">Working with OpenProject</h4></div>
                    <div style="{{ switchRow }}">
                      <label for="tb-set-op-open" style="{{ switchLabel }}"><span style="font-weight: 600">Open a work package here, not in OpenProject</span><span style="{{ hint }}">Off opens every work package in OpenProject in a new tab; this app then only shows the board.</span></label>
                      <button id="tb-set-op-open" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                    </div>
                    <div style="{{ switchRow }}">
                      <label for="tb-set-op-comment" style="{{ switchLabel }}"><span style="font-weight: 600">Post a comment in the work package when you link a mail or a meeting</span><span style="{{ hint }}">The comment names the mail or meeting and who linked it, so members in OpenProject see it too.</span></label>
                      <span style="display: inline-flex; align-items: center; gap: 10px"><span style="font-size: 13px; color: #538b28; font-weight: 600">Saved</span><button id="tb-set-op-comment" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button></span>
                    </div>
                    <div style="{{ switchRow }}">
                      <label for="tb-set-op-time" style="{{ switchLabel }}"><span style="font-weight: 600">Offer to log time after a linked meeting</span><span style="{{ hint }}">After a meeting linked to a work package, the app offers to log its length as spent time.</span></label>
                      <button id="tb-set-op-time" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 12px">
                      <label for="tb-set-op-project" style="font-weight: 600; white-space: nowrap">Project for work packages made from a mail</label>
                      <button id="tb-set-op-project" type="button" aria-haspopup="listbox" style="{{ chooser }}"><span style="display: inline-flex; align-items: center; gap: 8px"><span style="{{ swatchLyon }}"></span>Northwind rollout Lyon</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
                    </div>
                    <p style="{{ hint }}">A folder rule in Mail can pick another project per sender.</p>
                  </div>
                </sc-if>

                <sc-if value="{{ fr.isKeys }}" hint-placeholder-val="{{ false }}">
