      [[...EPIC, 0, 0, 6, false, true]],
      [[...EPIC, 0, 0, 6, true, true], [...FEAT, 1, 0, 6, false, true]],
      [[...EPIC, 0, 0, 6, true, true], [...FEAT, 1, 0, 6, true, true], [...BUG, 2, 2, 2, false, false]],
      [[...EPIC, 0, 0, 4, true, false], [...FEAT, 1, 0, 6, true, true]],
      [[...FEAT, 0, 0, 4, true, false]],
      []
    ];
    const lanes = rowBars.map((b) => b.reduce((m, x) => Math.max(m, x[3] + 1), 0));
    // meetings: key "month-day" -> [time, title, calendar]
    const specific = {
      '1-13': [['11:00', 'Demo preparation Malmo Energi', 'customers']],
      '1-14': [['09:30', 'Release 16.5 scope review', 'team']],
      '1-15': [['14:00', 'Rollout review Lyon, phase 2', 'customers']],
      '1-16': [['17:00', 'Submit October hours', 'personal']]
    };
    const hidden = { '1-14': 2 };
    const entryBase = 'display: flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px; border-radius: 4px; font-size: 11px; line-height: 18px; text-decoration: none; white-space: nowrap; overflow: hidden; ';
    const weeks = (menu) => rows.map((days, ri) => {
      const top = 26 + lanes[ri] * 20 + 2;
      const room = Math.floor((ROW - top - 4) / 19);
      return {
        days: days.map(([n, m], ci) => {
          const key = m + '-' + n;
          const today = m === 1 && n === 12;
          const hover = m === 1 && n === 28;
          const weekend = ci >= 5;
          const other = m !== 1;
          const past = m === 0 || (m === 1 && n < 12);
          let list = [];
          const standup = !weekend;
          list = list.concat(specific[key] ?? []).sort((a, b) => a[0].localeCompare(b[0]));
          if (key === '2-2') list.unshift(['', 'Go-live Lyon phase 2', 'milestone']);
          const extra = hidden[key] ?? 0;
          const cap = extra ? room - 1 : room;
          const shown = list.slice(0, cap);
          const more = extra + (list.length - shown.length);
          return {
            n, today, hover: hover && menu, standup,
            dotStyle: 'flex: none; width: 7px; height: 7px; border-radius: 4px; background: #3669a5;' + (past ? ' opacity: 0.55;' : ''),
            style: 'flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; border-left: 1px solid #eef0f3; ' + (ci === 0 ? 'border-left: 0; ' : '') + (hover && menu ? 'background: #eef0f3;' : weekend ? 'background: #f5f6f8;' : ''),
            numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-size: 13px; font-weight: 600' : 'font-size: 13px; ' + (other ? 'color: #5e6168; opacity: 0.55;' : 'color: #1b1c1d;'),
            listStyle: 'display: flex; flex-direction: column; gap: 1px; margin-top: ' + (top - 26) + 'px; padding: 0 3px',
            entries: shown.map(([time, title, cal]) => {
              const ms = cal === 'milestone';
              const c = ms ? '#35c53f' : CAL[cal];
              return {
                time, title, href: title === 'Rollout review Lyon, phase 2' ? 'ClEvent.dc.html' : '#',
                milestone: ms, hasTime: !ms,
                style: entryBase + (ms ? 'color: #1b1c1d; background: ' + pale(c) + ';' : 'color: ' + dark(c) + '; background: ' + pale(c) + '; border-left: 3px solid ' + c + ';') + (past ? ' opacity: 0.55;' : '')
              };
            }),
            hasMore: more > 0, more
          };
        }),
        bars: rowBars[ri].map(([type, number, subject, lane, s, e, leftOpen, rightOpen]) => {
          const c = TYPE[type];
          const left = leftOpen ? '0px' : 'calc(100% * ' + s + ' / 7 + 3px)';
          const width = 'calc(100% * ' + (e - s + 1) + ' / 7' + (leftOpen ? '' : ' - 3px') + (rightOpen ? '' : ' - 4px') + ')';
          return {
            type, number, subject, color: c, leftOpen, rightOpen, aria: type + ' ' + number + ', ' + subject,
            style: 'position: absolute; top: ' + (26 + lane * 20) + 'px; left: ' + left + '; width: ' + width + '; height: 18px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-left: 3px solid ' + c + '; border-radius: 4px; background: ' + pale(c) + '; font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden; z-index: 1'
          };
        })
      };
    });
    return { dow, weeksRest: weeks(false), weeksMenu: weeks(true) };
  }
}
</script>
