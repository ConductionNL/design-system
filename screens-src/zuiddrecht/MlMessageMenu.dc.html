<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: more actions menu of one message</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1760px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;More actions of one message, opened from the three dots in its header; the conversation toolbar with labelled Delete and Archive, one tooltip and its Conversation menu</figcaption>
    <div style="height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" folded="true" hint-size="64px,943px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="2" hint-size="410px,943px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; align-items: flex-start; gap: 6px">
              <button type="button" aria-label="Star this conversation" aria-pressed="false" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
              <h1 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 18px; font-weight: 600; line-height: 28px">Rollout plan phase 2, Lyon</h1>
              <button type="button" aria-label="Close conversation" title="Close conversation" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <div role="toolbar" aria-label="Conversation actions" style="display: flex; gap: 2px">
                <sc-for list="{{ tools }}" as="t" hint-placeholder-count="6"><span style="position: relative; display: inline-flex"><button type="button" aria-label="{{ t.label }}" title="{{ t.label }}" style="{{ t.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><sc-if value="{{ t.hasLabel }}" hint-placeholder-val="{{ false }}">{{ t.label }}</sc-if></button><sc-if value="{{ t.tip }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 0; bottom: 32px; padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 5">{{ t.label }}</span></sc-if></span></sc-for>
                <button type="button" aria-haspopup="menu" aria-label="Conversation actions" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; margin-left: 4px; padding: 0 6px 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Conversation<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              </div>
              <div style="flex: none; display: flex; align-items: center; gap: 6px">
                <button type="button" aria-label="Expand all messages" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg>Expand all</button>
                <div role="group" aria-label="Layout" style="flex: none; display: flex; gap: 2px; padding: 2px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff"><button type="button" aria-pressed="true" style="height: 24px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap">Message layout</button><button type="button" aria-pressed="false" style="height: 24px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap">Chat layout</button></div>
                <button type="button" aria-haspopup="menu" title="Link another work package to this conversation" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Link another</button>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
              <span style="white-space: nowrap">1 work package</span>
              <button type="button" aria-expanded="false" aria-label="Open work package FEATURE #58412, in development" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 12px 'Fira Sans', sans-serif; line-height: 1; white-space: nowrap; color: #3d4047; cursor: pointer"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
              <span style="white-space: nowrap">6 messages · Customers / Lyon</span>
            </div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px">
            <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="5">
              <button type="button" aria-expanded="false" aria-label="Show the whole message from {{ m.from }}, {{ m.date }}" title="Show the whole message" style="{{ m.style }}">
                <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
                <span style="{{ m.avatar }}">{{ m.initials }}</span>
                <span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span>
                <span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ m.snippet }}</span>
                <sc-if value="{{ m.attach }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Has attachment" role="img" style="flex: none; color: #5e6168"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></sc-if>
                <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.date }}</span>
              </button>
            </sc-for>
            <article aria-label="Message from Marc Dubois, today 06:00" style="position: relative; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
                <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">MD</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                  <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Marc Dubois</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">marc.dubois@mairie-lyon.fr</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 06:00</span></div>
                  <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
                  <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">Copy</span><span style="color: #1b1c1d">Tom Achterberg</span></div>
                </div>
                <button type="button" aria-label="More actions for this message" aria-haspopup="menu" aria-expanded="true" style="flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
              </div>
              <div role="menu" aria-label="More actions for this message" style="position: absolute; top: 38px; right: 8px; margin-top: 4px; min-width: 340px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column">
                <div style="padding: 4px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">This message, Marc Dubois, today 06:00</div>
                <sc-for list="{{ menu }}" as="i" hint-placeholder-count="10">
                  <sc-if value="{{ i.sep }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div></sc-if>
                  <button type="button" role="menuitem" style="{{ i.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ i.iconColor }}"><path d="{{ i.icon }}"></path></svg><span style="flex: 1 1 auto">{{ i.label }}</span><sc-if value="{{ i.hint }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ i.hintText }}</span></sc-if></button>
                </sc-for>
              </div>
              <div style="padding: 12px 14px 0 88px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
                <p style="margin: 0">Hi Olivia,</p>
                <p style="margin: 0">Good. Then we are go for 2 November. One more request from the department head: can the kick-off move to the afternoon?</p>
                <p style="margin: 0">Best regards,<br>Marc</p>
                <button type="button" aria-expanded="false" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 24px; margin-left: -6px; padding: 0 8px 0 6px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>Show quoted text</button>
              </div>
              <div style="margin: 12px 14px 0 88px; padding-top: 10px; border-top: 1px solid #e4e6ea; display: flex; flex-direction: column; gap: 4px">
                <span style="font-size: 12px; font-weight: 600; color: #5e6168">2 attachments in this conversation</span>
                <sc-for list="{{ files }}" as="f" hint-placeholder-count="2">
                  <div style="display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px">
                    <span style="{{ f.badge }}">{{ f.ext }}</span>
                    <a href="#" style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sc-link, #3669a5); text-decoration: none">{{ f.name }}</a>
                    <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ f.meta }}</span>
                    <button type="button" aria-label="Download {{ f.name }}" style="flex: none; width: 26px; height: 26px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg></button>
                  </div>
                </sc-for>
              </div>
              <div style="display: flex; gap: 8px; padding: 12px 14px 14px; flex-wrap: wrap">
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17l-5-5 5-5M12 17l-5-5 5-5M22 18v-2a4 4 0 0 0-4-4H7"></path></svg>Reply all</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17l-5-5 5-5M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>Reply</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 17l5-5-5-5M4 18v-2a4 4 0 0 1 4-4h12"></path></svg>Forward</button>
              </div>
            </article>
          </div>
        </main>
      </div>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Show the original message: the raw message in a dialog over the dimmed conversation, with the same download action as the menu</figcaption>
    <div style="position: relative; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; align-items: center; gap: 6px"><span style="width: 28px; height: 28px"></span><h2 style="flex: 1 1 auto; margin: 0; font-size: 18px; font-weight: 600; line-height: 28px">Rollout plan phase 2, Lyon</h2></div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5e6168"><span>1 work package</span><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span></span><span>6 messages · Customers / Lyon</span></div>
      </div>
      <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px">
        <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="5">
          <div style="{{ m.style }}"><span style="{{ m.avatar }}">{{ m.initials }}</span><span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span><span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.snippet }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ m.date }}</span></div>
        </sc-for>
        <div style="height: 240px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff"></div>
      </div>
      <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.4); display: flex; align-items: center; justify-content: center">
        <div role="dialog" aria-modal="true" aria-labelledby="src-title" style="width: 860px; max-height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); overflow: hidden">
          <div style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 12px 20px; border-bottom: 1px solid #e4e6ea">
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <h2 id="src-title" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 28px">The original message (technical)</h2>
              <span style="font-size: 13px; color: #5e6168; line-height: 19px">Marc Dubois, today 06:00. Headers and text as the server stored them, 14 KB.</span>
            </div>
            <button type="button" aria-label="Close" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <pre tabindex="0" aria-label="Raw source" style="flex: 1 1 auto; min-height: 0; margin: 0; padding: 14px 20px; overflow: hidden; background: #f5f6f8; font: 12px/18px ui-monospace, 'Fira Mono', monospace; color: #3d4047; white-space: pre">{{ source }}</pre>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px 14px 20px; border-top: 1px solid #e4e6ea">
            <span style="font-size: 12px; color: #5e6168">Useful when your administrator or a sender asks for it.</span>
