<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: the connections panel, state by state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; min-height: 1740px; padding: 32px 36px 40px">
  <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 34px">The connections panel, state by state</h1>
  <p style="margin: 6px 0 0; max-width: 820px; color: #3d4047">The same 400 px panel sits next to an open mail. It searches OpenRegister as you, so you only see cases you may see there. These are its six states.</p>
  <div style="display: grid; grid-template-columns: repeat(3, 440px); gap: 24px 24px; margin-top: 24px; align-items: start">
    <sc-for list="{{ panels }}" as="p" hint-placeholder-count="6">
      <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 8px; min-height: 36px; padding: 0 2px; font-size: 13px; line-height: 18px; color: #5e6168"><span style="flex: none; font-weight: 600; color: #1b1c1d">{{ p.n }}</span><span>{{ p.caption }}</span></div>
        <div style="width: 440px; box-sizing: border-box; padding: 20px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <dc-import name="MlConnectionsPanel" state="{{ p.state }}" edge="none" hint-size="400px,700px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1740}}'>
class Component extends DCLogic {
  renderVals() {
    const panels = [
      ['empty', 'The mail is not connected to anything. Both search fields are empty, the found list is folded.'],
      ['typing', 'You type words in the case field. Matches appear under it, the first one tinted, your word marked.'],
      ['none', 'Nothing matches. The panel says so under the field, and the new case row stays.'],
      ['connecting', 'You picked a row. It shows a spinner until OpenRegister has written the connection.'],
      ['connected', 'The case is a card under Connected to. A status line says so, with Undo.'],
      ['drop', 'An attachment is dragged over the case card. The card tints and says where to drop.']
    ].map(([state, caption], i) => ({ state, caption, n: String(i + 1) }));
    return { panels };
  }
}
</script>
</body>
</html>
