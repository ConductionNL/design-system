<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onderdeel: kop en hoofdmenu</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div class="sc-board" data-board="Kop">

<header style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; width: 100%">
  <a href="#inhoud" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Direct naar de inhoud</a>
  <div style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
    <a href="esdoornveen-Home.html" style="display: flex; align-items: center" aria-label="Esdoornveen, mbo college, naar de homepage">
      <img src="../assets/esdoornveen/logo.svg" alt="Esdoornveen, mbo college" style="height: 52px; width: auto; display: block">
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <form role="search" style="position: relative; display: flex">
        <label for="kop-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken op de website</label>
        <input id="kop-zoek" type="search" placeholder="Zoeken" style="width: 280px; max-width: 100%; height: 44px; box-sizing: border-box; padding: 0 48px 0 14px; border: 1px solid #5c6470; border-radius: 4px; background: #ffffff; font: 400 16px 'IBM Plex Sans', sans-serif; color: #1a1a1a">
        <button type="submit" aria-label="Zoeken" style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: transparent; color: #5b2e91; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </button>
      </form>
      
      
        <a href="esdoornveen-Inloggen.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 4px; background: #5b2e91; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none">
          <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
          Mijn Esdoornveen
        </a>
      
    </div>
  </div>
  <nav aria-label="Hoofdmenu" style="border-top: 1px solid #e6e9ee">
    <ul style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 0 10px; list-style: none; display: flex; flex-wrap: wrap">
      
        <li><a href="esdoornveen-Home.html" aria-current="page" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 700; box-shadow: inset 0 -4px 0 #c2255c;">Home</a></li>
      
        <li><a href="esdoornveen-Zoeken.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Opleidingen</a></li>
      
        <li><a href="esdoornveen-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Aanmelden</a></li>
      
        <li><a href="esdoornveen-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Voor studenten</a></li>
      
        <li><a href="esdoornveen-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Voor bedrijven</a></li>
      
        <li><a href="esdoornveen-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Nieuws</a></li>
      
        <li><a href="esdoornveen-Contentpagina.html" aria-current="false" style="display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; font-weight: 500;">Over Esdoornveen</a></li>
      
    </ul>
  </nav>
  <div aria-hidden="true" style="height: 6px; background: #5b2e91; overflow: hidden">
    <div style="max-width: 1280px; height: 6px; box-sizing: border-box; margin: 0 auto; padding: 0 24px; display: flex">
      <span style="flex: none; width: 168px; height: 6px; background: #c2255c; transform: skewX(-32deg)"></span>
    </div>
  </div>
  
</header>
</div>
</body>
</html>
