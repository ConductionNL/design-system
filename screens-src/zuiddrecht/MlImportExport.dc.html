    const btnSec = "display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap";
    const btnPri = "display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap";
    const btnRow = "display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap;";
    const btnDanger = "display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap;";
    const input = "height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; background: #ffffff; width: 100%;";
    const chooser = "display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 180px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap";
    const chipOk = 'flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #538b28; font-size: 12px; font-weight: 600; white-space: nowrap';
    const switchOn = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff';
    const sources = [
      ['An MBOX archive', 'The export format of most mail programs. Folders inside the archive are kept.'],
      ['An Outlook PST archive', 'A .pst file from Outlook. Contacts and calendar items in it are skipped.'],
      ['One message file into a folder you choose', 'A single .eml file, for example a message someone sent you as an attachment.']
    ].map(([label, hint]) => ({ label, hint }));
    const dot = (bg, border) => 'flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: ' + bg + '; border: 1.5px solid ' + border;
    const imports = [
      ['olivia.brandt@oldprovider.example', 'IMAP account, started today 06:50', '1,240 of 2,000', '3 failed', 'Checks for new mail after the import', dot('#66d9e8', '#21c8de'), true, false, false, false],
      ['archive@northwind-projects.test', 'IMAP account, finished 2 October', 'Done, 8,410', '0 failed', 'Checks every 15 minutes, last check 07:05', dot('#538b28', '#3f6a1e'), false, true, true, false],
      ['tom.old@oldprovider.example', 'IMAP account, finished 14 September', 'Done, 3,120', '12 failed', 'Checking paused since 9 October', dot('#538b28', '#3f6a1e'), false, true, false, true],
      ['lyon-2025.mbox', 'MBOX archive, finished 28 September', 'Done, 612', '2 failed', 'An archive is not checked again', dot('#538b28', '#3f6a1e'), false, true, false, false]
    ].map(([source, kind, progress, failed, poll, dot, running, done, canPause, canResume]) => ({
      source, kind, progress, failed, poll, dot, running, done, canPause, canResume,
      failedLink: !failed.startsWith('0'), failedNone: failed.startsWith('0'),
      failedStyle: failed.startsWith('0') ? 'color: #5e6168' : 'color: #ab0000; font-weight: 600; text-decoration: underline; text-underline-offset: 2px'
    }));
    return { th, thRight, btnSec, btnPri, btnRow, btnDanger, input, chooser, chipOk, switchOn, knobOn, sources, imports };
  }
