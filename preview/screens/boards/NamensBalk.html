<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onderdeel: balk voor wie u zaken regelt</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:900px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="NamensBalk">

<div role="status" style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding: 14px 20px; border-radius: 6px; background: var(--sc-primary-deep, #234a78); color: #ffffff; font-size: 17px">
  <svg width="24" height="24" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"></path></svg>
  <span style="flex: 1 1 320px; font-weight: 600">U regelt nu zaken voor Bakkerij Lindelaan B.V. (KVK 87654321).</span>
  <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; max-width: 100%">
    <label for="namens" style="font-weight: 600">Wissel naar</label>
    <select id="namens" style="box-sizing: border-box; height: 44px; flex: 1 1 200px; min-width: 0; max-width: 100%; padding: 0 12px; border: 2px solid #ffffff; border-radius: 4px; font: 400 17px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-site-ink, #1a1a1a); background: #ffffff">
      
        <option>Uzelf, Sanne de Vries</option>
      
        <option selected>Bakkerij Lindelaan B.V. (KVK 87654321)</option>
      
        <option>Henk de Vries</option>
      
        <option>Iedereen voor wie u zaken regelt</option>
      
    </select>
    <a href="Machtigingen.html" style="color: #ffffff; font-weight: 600">Toegang tot zaken regelen</a>
  </span>
</div>
</div>
</body>
</html>
