      dueStyle: 'flex: none; font-size: 12px; white-space: nowrap; ' + (done ? 'color: #5e6168; text-decoration: line-through' : week ? 'color: #1b1c1d; font-weight: 600' : 'color: #5e6168')
    }));
    const avatar = (op) => 'flex: none; width: 32px; height: 32px; border-radius: ' + (op ? 'var(--sc-radius, 8px)' : '16px') + '; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; ' + (op ? 'background: #1b1c1d; color: #ffffff' : 'background: #eaf0f7; color: #234a78');
    const mails = [
      ['Sven Lindqvist', 'SL', 'Request for a demo, 1,200 users', '07:00'],
      ['Jana Köhler', 'JK', 'Gantt export cuts off the last week', '04:00'],
      ['OpenProject notifications', 'OP', '[Northwind - Bug #58231] Gantt PDF export drops trailing columns', '01:00'],
      ['Sovereign Tech Weekly', 'ST', 'Open source in the public sector, issue 41', 'Yesterday']
    ].map(([from, initials, subject, date]) => ({ from, initials, subject, date, avatar: avatar(initials === 'OP') }));
    const box = (c) => 'flex: none; width: 32px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; background: #eaf0f7; color: ' + c;
    const I = {
      share: 'M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13',
      user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
      at: 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94',
      overdue: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01',
      bell: 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0'
    };
    const noteList = [
      { kind: 'Project shared with you', icon: I.share, color: '#234a78', when: '2 min ago', text: 'Tom Achterberg shared the project OpenProject core with you, as a member.', actions: ['Open project'], more: 'Remind me tomorrow' },
      { kind: 'Invitation from another server', icon: I.share, color: '#234a78', when: '25 min ago', remote: true, text: 'Jana Köhler shared the project Netzausbau Nord with you. Accepting adds it to your projects.', actions: ['Accept', 'Decline'] },
      { kind: 'Assigned to you', icon: I.user, color: '#234a78', when: '08:05', text: 'Tom Achterberg assigned TASK #58440 Send OIDC client settings to Lyon to you.' },
      { kind: 'Mentioned in a comment', icon: I.at, color: '#234a78', when: 'Yesterday 15:12', text: 'Tom Achterberg mentioned you on FEATURE #58412 Link Nextcloud project folders on rollout.', quote: '@Olivia Brandt two things before we link the folders on the Lyon realm' },
      { kind: 'Overdue', icon: I.overdue, color: '#ab0000', when: 'Since 9 Oct', text: 'BUG #58102 Folder link breaks on rename is overdue. Its due date was Friday 9 October.' },
      { kind: 'Reminder you set', icon: I.bell, color: '#234a78', when: '08:00', text: 'Reminder: TASK #58455 Prepare demo for Malmo Energi is due tomorrow. You asked for this one day before the due date.' }
    ];
    const noteRow = (n) => ({ kind: n.kind, icon: n.icon, iconBox: box(n.color), when: n.when, text: n.text, remote: !!n.remote, invite: !!n.invite, hasQuote: !!n.quote, quote: n.quote ?? '', hasActions: !!n.actions, primary: n.actions ? n.actions[0] : '', hasSecondary: !!(n.actions && n.actions[1]), secondary: n.actions ? (n.actions[1] ?? '') : '', hasMore: !!n.more, more: n.more ?? '' });
    const notes = noteList.map(noteRow);
    const notesD = [
      { kind: 'Added to a work package', icon: I.user, color: '#234a78', when: '1 min ago', invite: true, text: 'Tom Achterberg added you to FEATURE #58390 Single sign-on through Keycloak.', quote: 'Could you take the Lyon realm export?', actions: ['Accept', 'Decline'], more: 'Tentative, with a comment' },
      ...noteList.slice(0, 4)
    ].map(noteRow);
    const rowBase = 'display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 16px; border-bottom: 1px solid #e4e6ea; ';
    const tasksC = tasks.map((t) => ({ ...t, rowStyle: rowBase + (t.number === '#58455' ? 'background: #eaf0f7; box-shadow: inset 3px 0 0 #3669a5' : '') }));
    const popupFields = [
      { label: 'Assignee', value: 'Olivia Brandt', hasAvatar: true, avatar: 'OB', valueStyle: '' },
      { label: 'Priority', value: 'Normal', valueStyle: '' },
      { label: 'Version', value: '16.5', valueStyle: 'color: var(--sc-link, #3669a5)' },
      { label: 'Start date', value: '12 Oct 2026', valueStyle: '' },
      { label: 'Due date', value: 'Tomorrow, 13 Oct 2026', valueStyle: 'font-weight: 600' },
      { label: 'Project', value: 'Northwind rollout Lyon', valueStyle: 'color: var(--sc-link, #3669a5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis' }
    ].map((f) => ({ hasAvatar: false, avatar: '', ...f }));
    const tabBase = 'display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 8px 12px; box-sizing: border-box; margin-bottom: -1px; border: 1px solid #c4c7cb; border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; font: 500 14px \'Fira Sans\', sans-serif; white-space: nowrap; ';
    const popupTabs = [['Mails', 1, true], ['Meetings', '', false], ['Activity', '', false]].map(([label, count, on]) => ({
      label, count, hasCount: count !== '', selected: on ? 'true' : 'false',
      style: tabBase + (on ? 'background: #ffffff; color: #1b1c1d; font-weight: 700; border-bottom: 1px solid #ffffff' : 'background: #eef0f3; color: #3d4047'),
      countStyle: 'display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 9px; background: #eaf0f7; color: #234a78; font-size: 11px; font-weight: 700'
    }));
    return { tasks, tasksC, mails, notes, notesD, popupFields, popupTabs };
  }
}
