<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: connect a mail account on first use</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1180px; padding: 28px 24px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;First use: no mailbox yet, the manual part unfolded</figcaption>
    <div style="height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <main style="flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; justify-content: center; padding: 36px 24px; overflow: hidden">
        <form aria-labelledby="ml-setup-title" style="width: 600px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 28px 32px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px)">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1 id="ml-setup-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 28px">Connect a mail account to get started</h1>
            <p style="margin: 0; font-size: 13px; line-height: 19px; color: #5e6168">Name, address and password are enough for most providers. The server settings are found for you.</p>
          </div>
          <div style="display: flex; gap: 8px">
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #3d4047; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; line-height: 1">G</span>Sign in with Google</button>
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#3d4047"></rect><rect x="9" y="1" width="6" height="6" fill="#3d4047"></rect><rect x="1" y="9" width="6" height="6" fill="#3d4047"></rect><rect x="9" y="9" width="6" height="6" fill="#3d4047"></rect></svg>Sign in with Microsoft</button>
          </div>
          <div aria-hidden="true" style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5e6168"><span style="flex: 1 1 auto; height: 1px; background: #e4e6ea"></span>or with your address<span style="flex: 1 1 auto; height: 1px; background: #e4e6ea"></span></div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047; grid-column: 1 / -1">Name<input type="text" value="Olivia Brandt" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047">Mail address<input type="email" value="olivia@northwind-projects.test" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047">Password<input type="password" value="northwind2026" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
          </div>
          <button type="button" aria-expanded="true" aria-controls="ml-setup-manual" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>Enter the server details by hand</button>
          <div id="ml-setup-manual" style="display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; background: #f5f6f8; border-radius: var(--sc-radius, 8px)">
            <sc-for list="{{ servers }}" as="s" hint-placeholder-count="2">
              <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
                <legend style="padding: 0; margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ s.title }}</legend>
                <div style="display: grid; grid-template-columns: 1fr 96px; gap: 8px">
                  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047; min-width: 0">Server<input type="text" value="{{ s.host }}" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; min-width: 0"></label>
                  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047">Port<input type="text" value="{{ s.port }}" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; width: 100%"></label>
                </div>
                <div role="radiogroup" aria-label="{{ s.secLabel }}" style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px 20px">
                  <span style="font-size: 14px; font-weight: 600; color: #3d4047">Connection security</span>
                  <sc-for list="{{ s.options }}" as="o" hint-placeholder-count="3">
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: #1b1c1d"><span aria-hidden="true" style="{{ o.dot }}"></span><input type="radio" name="{{ s.name }}" checked="{{ o.on }}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>{{ o.label }}</span><span style="font-size: 12px; color: #5e6168">{{ o.hint }}</span></label>
                  </sc-for>
                </div>
              </fieldset>
            </sc-for>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px">
            <span style="font-size: 12px; line-height: 18px; color: #5e6168">Your password is stored encrypted on this server and never shown again.</span>
            <button type="submit" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Connect</button>
          </div>
        </form>
      </main>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Your sign-in has no mailbox yet: the same card with the notice on top, the server details folded</figcaption>
    <div style="height: 1080px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <main style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 36px 24px; overflow: hidden">
        <section role="status" aria-labelledby="ml-nomailbox-title" style="width: 600px; box-sizing: border-box; display: flex; gap: 14px; padding: 16px 20px; background: #eaf0f7; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px)">
          <span style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: #ffffff; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <h2 id="ml-nomailbox-title" style="margin: 0; font-size: 15px; font-weight: 600; line-height: 22px">No mailbox found for your sign-in</h2>
            <p style="margin: 0; font-size: 13px; line-height: 19px; color: #3d4047">Your sign-in <strong style="font-weight: 600">olivia.brandt</strong> has no mailbox on mail.northwind-projects.test. Connect the mailbox your mail arrives on, below. Not sure which address? Your administrator can see which mailbox belongs to you.</p>
          </div>
        </section>
        <form aria-labelledby="ml-setup-title-b" style="width: 600px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 28px 32px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px)">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1 id="ml-setup-title-b" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 28px">Connect the mailbox your mail arrives on</h1>
            <p style="margin: 0; font-size: 13px; line-height: 19px; color: #5e6168">Name, address and password are enough for most providers. The server settings are found for you.</p>
          </div>
          <div style="display: flex; gap: 8px">
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #3d4047; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; line-height: 1">G</span>Sign in with Google</button>
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#3d4047"></rect><rect x="9" y="1" width="6" height="6" fill="#3d4047"></rect><rect x="1" y="9" width="6" height="6" fill="#3d4047"></rect><rect x="9" y="9" width="6" height="6" fill="#3d4047"></rect></svg>Sign in with Microsoft</button>
          </div>
          <div aria-hidden="true" style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5e6168"><span style="flex: 1 1 auto; height: 1px; background: #e4e6ea"></span>or with your address<span style="flex: 1 1 auto; height: 1px; background: #e4e6ea"></span></div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047; grid-column: 1 / -1">Name<input type="text" value="Olivia Brandt" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047">Mail address<input type="email" value="" placeholder="name@company.test" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047">Password<input type="password" value="" placeholder="Password of that mailbox" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
          </div>
          <button type="button" aria-expanded="false" aria-controls="ml-setup-manual-b" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>Enter the server details by hand</button>
          <div id="ml-setup-manual-b" hidden style="display: none"></div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px">
            <span style="font-size: 12px; line-height: 18px; color: #5e6168">Your password is stored encrypted on this server and never shown again.</span>
            <button type="submit" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Connect this mailbox</button>
          </div>
        </form>
      </main>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    const dotOn = 'flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 5px solid #3669a5; background: #ffffff';
    const dotOff = 'flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid #c4c7cb; background: #ffffff';
    const options = (sel) => [['SSL/TLS', 'recommended'], ['STARTTLS', ''], ['None', 'not encrypted']].map(([label, hint]) => ({ label, hint, on: label === sel ? 'checked' : '', dot: label === sel ? dotOn : dotOff }));
    const servers = [
      { title: 'Incoming server', host: 'imap.northwind-projects.test', port: '993', name: 'sec-in', secLabel: 'Connection security of the incoming server', options: options('SSL/TLS') },
      { title: 'Outgoing server', host: 'smtp.northwind-projects.test', port: '587', name: 'sec-out', secLabel: 'Connection security of the outgoing server', options: options('STARTTLS') }
    ];
    return { servers };
  }
}
</script>
</body>
</html>
