<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Telefoon: uw zaak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="width: 390px; min-height: 1700px; box-sizing: border-box; font-family: 'Fira Sans', system-ui, sans-serif; color: #1a1a1a; background: #ffffff">
  <header>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px">
      <img src="/_blob/fd901beaf169b6dc7e7c38a8ff489d4b" alt="Gemeente Zuiddrecht" style="height: 36px; width: auto">
      <a href="Home.dc.html" style="height: 44px; display: flex; align-items: center; font-weight: 600">Uitloggen</a>
    </div>
    <button type="button" aria-expanded="false" style="width: 100%; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-top: 1px solid #e6e9ee; background: #ffffff; color: #1a1a1a; box-shadow: inset 0 -4px 0 #cc0000; font: 600 18px 'Fira Sans', sans-serif">
      <span style="display: flex; align-items: center; gap: 10px"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"></path></svg>Mijn Zuiddrecht</span>
      <span style="padding: 2px 9px; border-radius: 12px; background: #cc0000; color: #ffffff; font-size: 14px; font-weight: 700">3 nieuw</span>
    </button>
  </header>
  <main style="padding: 24px 16px 40px; display: flex; flex-direction: column; gap: 24px">
    <a href="MijnZaken.dc.html" style="display: inline-flex; align-items: center; gap: 2px; font-size: 17px; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="M15.41,16.58L10.83,12L15.41,7.41L14,6L8,12L14,18L15.41,16.58Z"></path></svg>Mijn zaken</a>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; color: #4a4a4a">Uw zaak · 2026-0082</span>
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.15">Verlichting fietspad Lindelaan</h1>
    </div>
    <div style="display: flex; gap: 10px; padding: 14px 16px; border-radius: 4px; background: #e7f3ea; border: 1px solid #a9d1b3; font-size: 17px">U hoeft nu niets te doen.</div>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <h2 style="margin: 0; font-size: 24px; font-weight: 700">Waar staat uw aanvraag?</h2>
      <ol style="margin: 0; padding: 0; list-style: none">
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="5">
          <li style="display: grid; grid-template-columns: 32px 1fr; column-gap: 12px">
            <span style="display: flex; flex-direction: column; align-items: center"><span style="{{ s.dot }}"><sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"></path></svg></sc-if><sc-if value="{{ s.notDone }}" hint-placeholder-val="{{ true }}">{{ s.mark }}</sc-if></span><sc-if value="{{ s.notLast }}" hint-placeholder-val="{{ true }}"><span style="{{ s.line }}"></span></sc-if></span>
            <span style="display: flex; flex-direction: column; gap: 2px; padding: 4px 0 18px"><span style="{{ s.titleStyle }}">{{ s.title }}</span><span style="font-size: 15px; color: #4a4a4a">{{ s.text }}</span></span>
          </li>
        </sc-for>
      </ol>
    </section>
    <section style="display: flex; flex-direction: column; gap: 0; border-top: 1px solid #d3d8df">
      <div style="padding: 12px 0; border-bottom: 1px solid #d3d8df; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; color: #4a4a4a">Gestart op</span><strong style="font-size: 17px">3 oktober 2026</strong></div>
      <div style="padding: 12px 0; border-bottom: 1px solid #d3d8df; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; color: #4a4a4a">Uiterlijk klaar op</span><strong style="font-size: 17px">1 november 2026</strong></div>
    </section>
    <a href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 4px; border: 2px solid #3669a5; font-weight: 600; text-decoration: none">Document toevoegen</a>
    <div role="group" aria-label="Meer acties voor deze zaak" style="display: flex; flex-direction: column; gap: 12px">
      <a href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 4px; border: 2px solid #3669a5; font-weight: 600; text-decoration: none">Bezwaar maken</a>
      <a href="#" style="display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 4px; border: 2px solid #3669a5; font-weight: 600; text-decoration: none">Klacht indienen</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [['Ontvangen', 'Uw verzoek is binnen.', 'done'], ['In behandeling', 'Wij kijken of uw verzoek compleet is.', 'current'], ['Besluit', 'Wij nemen een besluit.', 'todo'], ['Besluit genomen', 'Het besluit wordt gepubliceerd.', 'todo'], ['Afgehandeld', 'Uw verzoek is afgehandeld.', 'todo']];
    const steps = raw.map(([title, text, state], i) => {
      const done = state === 'done', cur = state === 'current';
      return {
        title, text, notLast: i < raw.length - 1, mark: String(i + 1), done, notDone: !done,
        dot: 'width: 30px; height: 30px; border-radius: 15px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; box-sizing: border-box; ' + (done ? 'background: #3669a5; color: #ffffff;' : cur ? 'background: #ffffff; color: #cc0000; border: 3px solid #cc0000;' : 'background: #ffffff; color: #4a4a4a; border: 2px solid #8a929e;'),
        line: 'flex: 1; width: 3px; min-height: 18px; background: ' + (done ? '#3669a5' : '#d3d8df'),
        titleStyle: 'font-size: 17px; ' + (cur ? 'font-weight: 700;' : done ? 'font-weight: 600;' : 'font-weight: 500; color: #4a4a4a;')
      };
    });
    return { steps };
  }
}
</script>
</body>
</html>
