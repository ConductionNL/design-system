<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: command menu with the shortcut overview and the legend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1968px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The command menu opened with Ctrl K over the week: actions, go to and settings, each with its key, while the grid shows a free, a tentative and a cancelled event, your own unanswered, maybe and declined invitations, bells for reminders, a ticked task and a task card on its due date; the side panel is the one of every screen</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 100%; overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="264px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; position: relative">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.done }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Completed" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: {{ b.color }}"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></sc-if>
              <sc-if value="{{ b.open }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Open task" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: none; color: {{ b.color }}"><circle cx="12" cy="12" r="9"></circle></svg></sc-if>
              <sc-if value="{{ b.card }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Board card" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: {{ b.color }}"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9h10M7 13h6"></path></svg></sc-if>
              <sc-if value="{{ b.hasType }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span><span style="flex: none; color: #3d4047">{{ b.number }}</span></sc-if>
              <span style="{{ b.subjectStyle }}">{{ b.subject }}</span>
              <sc-if value="{{ b.hasTail }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-weight: 600; color: {{ b.tailColor }}">{{ b.tail }}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <sc-if value="{{ e.bell }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Reminder set" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasLabel }}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5e6168; white-space: nowrap">{{ e.label }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(27,28,29,0.28); z-index: 20"></div>
      <div role="dialog" aria-modal="true" aria-label="Command menu" style="position: absolute; top: 10px; right: 16px; width: 520px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.22); z-index: 21; display: flex; flex-direction: column; overflow: hidden">
        <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea; color: #5e6168; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find an action or a setting</span><input type="search" placeholder="Find any action or setting" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none"><kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">Esc</kbd></label>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px">
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
            <div role="group" aria-label="{{ g.label }}" style="display: flex; flex-direction: column">
              <div style="padding: 6px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.label }}</div>
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
                <button type="button" aria-current="{{ it.current }}" style="{{ it.style }}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ it.icon }}"></path></svg>
                  <span style="flex: none; font-weight: 500">{{ it.label }}</span>
                  <span style="flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 400; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ it.hint }}</span>
                  <sc-if value="{{ it.hasSwitch }}" hint-placeholder-val="{{ false }}"><span role="switch" aria-checked="{{ it.on }}" aria-label="{{ it.label }}" style="{{ it.switch }}"><span style="{{ it.knob }}"></span></span></sc-if>
                  <sc-if value="{{ it.hasKey }}" hint-placeholder-val="{{ true }}"><kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">{{ it.key }}</kbd></sc-if>
                </button>
              </sc-for>
            </div>
          </sc-for>
        </div>
        <div style="display: flex; align-items: center; gap: 14px; height: 36px; padding: 0 16px; box-sizing: border-box; border-top: 1px solid #e4e6ea; background: #f5f6f8; font-size: 12px; color: #5e6168">
          <span style="display: inline-flex; align-items: center; gap: 6px"><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 4px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 10px 'Fira Sans', sans-serif; color: #1b1c1d">Up</kbd><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 4px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 10px 'Fira Sans', sans-serif; color: #1b1c1d">Down</kbd>move</span>
          <span style="display: inline-flex; align-items: center; gap: 6px"><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 18px; padding: 0 4px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 10px 'Fira Sans', sans-serif; color: #1b1c1d">Enter</kbd>runs or switches</span>
          <span style="flex: 1 1 auto"></span>
          <span>Opened with Ctrl K or Cmd K</span>
        </div>
      </div>
    </main>
    <aside aria-label="Context" style="flex: 0 0 300px; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px; padding: 16px; background: #f5f6f8; overflow: hidden">
      <label style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #5e6168; font-size: 15px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search this week</span><input type="search" placeholder="Search this week" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: 13px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none"></label>
      <section aria-labelledby="ctx-next" style="display: flex; flex-direction: column; gap: 8px">
        <h2 id="ctx-next" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Next meeting</h2>
        <div style="font-size: 14px; font-weight: 600; line-height: 20px">Stand-up</div>
        <div style="font-size: 12px; color: #5e6168; line-height: 16px">10:00 to 10:15, in 1 h</div>
        <a href="#" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg>Join</a>
      </section>
      <section aria-labelledby="ctx-due" style="display: flex; flex-direction: column; gap: 2px">
        <h2 id="ctx-due" style="margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Work packages due this week</h2>
        <sc-for list="{{ due }}" as="w" hint-placeholder-count="3">
          <a href="#" style="display: flex; align-items: center; gap: 8px; height: 34px; margin: 0 -6px; padding: 0 6px; border-radius: var(--sc-radius, 8px); font-size: 13px; color: #1b1c1d; text-decoration: none">
            <span style="flex: none; display: inline-flex; align-items: center; gap: 5px; font-size: 11px; line-height: 1"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ w.color }}">{{ w.type }}</span><span style="color: #3d4047">{{ w.number }}</span><span style="{{ w.dot }}"></span></span>
            <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ w.subject }}</span>
            <span style="flex: none; font-size: 12px; color: #5e6168">{{ w.due }}</span>
          </a>
        </sc-for>
      </section>
      <section aria-labelledby="ctx-keys" style="display: flex; flex-direction: column; gap: 2px">
        <h2 id="ctx-keys" style="margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Shortcuts</h2>
        <sc-for list="{{ keys }}" as="k" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 10px; height: 28px; font-size: 13px; color: #3d4047"><kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">{{ k.key }}</kbd>{{ k.label }}</div>
        </sc-for>
      </section>
    </aside>
  </div>
</div>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The shortcut overview, opened with the key ?: every shortcut in groups at the left and the legend of event styles at the right</figcaption>
    <div style="position: relative; height: 840px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: #ffffff">
      <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div></sc-for>
    </div>
    <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 24px">
      <div role="dialog" aria-modal="true" aria-labelledby="cl-keys-title" style="width: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
        <div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 12px 12px 24px; border-bottom: 1px solid #e4e6ea">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <h3 id="cl-keys-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">All keyboard shortcuts</h3>
            <span style="font-size: 12px; color: #5e6168; line-height: 18px; display: inline-flex; align-items: center; gap: 6px">Opened with <kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">?</kbd> from anywhere in the calendar. Esc closes it.</span>
          </div>
          <button type="button" aria-label="Close" style="flex: none; width: 40px; height: 40px; margin: -8px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; padding: 16px 24px 20px">
          <section aria-label="Shortcuts" style="display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{ keyGroups }}" as="kg" hint-placeholder-count="4">
              <div style="margin-top: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ kg.label }}</div>
              <sc-for list="{{ kg.keys }}" as="k" hint-placeholder-count="3">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1968}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 72; // one hour in px, 08:00 to 18:00
    const OFF = 14; // top offset so the 08:00 label is not clipped
    const NOW = 9; // Monday 12 October, 09:00
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const CAL = { personal: '#3669a5', team: '#538b28', customers: '#ff9d2e' };
    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';

    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (t) => pad(Math.floor(t)) + ':' + pad(Math.round((t % 1) * 60));
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(6 + i),

        localStyle: 'position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right',
        utcStyle: 'position: absolute; left: 42px; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; opacity: 0.6; text-align: right'

    const nowTop = (NOW - 8) * H + OFF;
    const nowLabelTop = nowTop - 8;
    // meeting block: [title, start, duration, options {cal, chip, video, flag, bell, past, status: free|tentative|cancelled, invite: pending|tentative|declined}]
    const ev = (title, start, dur, o = {}) => {
      const c = CAL[o.cal ?? 'personal'];
      const short = dur <= 0.5;
      const end = start + dur;
      const struck = o.status === 'cancelled' || o.invite === 'declined';
      const dashed = o.status === 'tentative' || o.invite === 'tentative';
      const labels = { cancelled: 'Cancelled', free: 'Free', tentative: 'Tentative' };

      else if (o.invite === 'declined') fill = 'background: #ffffff; border-left: 3px solid #c4c7cb; color: #5e6168; opacity: 0.6;';

      };
    };
    const standup = (past, bell) => ev('Stand-up', 10, 0.25, { cal: 'personal', past, bell });
    const perDay = [
      [ev('Week planning', 8, 0.75, { cal: 'personal', past: true }), standup(false, true), ev('Release notes 16.5', 13, 1.5, { cal: 'personal', status: 'free' })],
      [standup(false), ev('Demo preparation Malmo Energi', 11, 1, { cal: 'customers', status: 'tentative' }), ev('Lunch with Priya', 12.5, 1, { cal: 'personal', status: 'cancelled' }), ev('Keycloak realm walkthrough', 15, 1, { cal: 'team', invite: 'tentative' })],
      [standup(false), ev('Release 16.5 scope review', 9.5, 1.5, { cal: 'team', chip: ['EPIC', '#57990', 'in review'], bell: true })],
      [standup(false), ev('Rollout review Lyon, phase 2', 14, 1, { cal: 'customers', chip: ['FEATURE', '#58412', 'in development'], video: true, invite: 'pending' })],
      [standup(false), ev('Team drinks', 16, 1, { cal: 'team', invite: 'declined' }), ev('Submit October hours', 17, 0.5, { cal: 'personal', flag: true, bell: true })],
      [], []
    ];
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = i === 0;
      const weekend = i >= 5;
      return {
        name, n: 12 + i, today, events: perDay[i],
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : 'color: #1b1c1d; font-weight: 500',
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    // all-day strip: tasks and a board card. [kind, type, number, subject, lane, startCol, endCol, tail]
    const barBase = (c, s, e, lane) => 'position: absolute; top: ' + (6 + lane * 24) + 'px; left: calc(100% * ' + s + ' / 7 + 2px); width: calc(100% * ' + (e - s + 1) + ' / 7 - 6px); height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-left: 3px solid ' + c + '; border-radius: 4px; background: ' + pale(c) + '; font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden';
    const bars = [
      { kind: 'done', type: 'TASK', number: '#58440', subject: 'Send OIDC client settings to Lyon', lane: 0, s: 0, e: 1, tail: '100%', color: TYPE.TASK, aria: 'Completed task, Send OIDC client settings to Lyon, 100% done' },
      { kind: 'open', type: 'TASK', number: '#58455', subject: 'Prepare demo for Malmo Energi', lane: 1, s: 0, e: 1, tail: '40%', color: TYPE.TASK, aria: 'Task, Prepare demo for Malmo Energi, 40% done' },
      { kind: 'card', type: 'TASK', number: '#58441', subject: 'Move kick-off to the afternoon', lane: 2, s: 0, e: 1, tail: 'Due Fri 16', color: TYPE.TASK, aria: 'Board card, TASK #58441 Move kick-off to the afternoon, due Friday 16 October' }
    ].map((b) => ({
      ...b, done: b.kind === 'done', open: b.kind === 'open', card: b.kind === 'card', hasType: true, hasTail: true,
      tailColor: b.kind === 'done' ? dark(TYPE.TASK) : '#5e6168',

      style: barBase(b.color, b.s, b.e, b.lane) + (b.kind === 'card' ? '; border: 1px solid #e4e6ea; border-left: 3px solid ' + b.color + '; background: #ffffff' : '') + (b.kind === 'done' ? '; opacity: 0.7' : '')
    }));
    // command menu
    const itemBase = 'display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px \'Fira Sans\', sans-serif; color: #1b1c1d; text-align: left; ';
    const swOn = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';

    const knobOff = 'position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #5e6168';
    const ICON = {
      plus: 'M12 5v14M5 12h14', wp: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', link: 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71',
      today: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', clock: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 6v6l4 2', grid: 'M3 3h7v7H3zM14 3h7v7h-7zM14 14h7v7h-7zM3 14h7v7H3z',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01', weekend: 'M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16', allday: 'M4 6h16M4 12h16M4 18h16', zone: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'
    };
    const mkItem = (label, hint, key, icon, o = {}) => ({
      label, hint, key, icon: ICON[icon], current: o.current ? 'true' : 'false', hasKey: key !== '', hasSwitch: !!o.sw, on: o.on ? 'true' : 'false',
      switch: o.on ? swOn : swOff, knob: o.on ? knobOn : knobOff,
      style: itemBase + (o.current ? 'background: #eaf0f7; color: #234a78;' : 'background: transparent;')
    });
    const groups = [
      { label: 'Actions', items: [
        mkItem('New event', 'In the next free slot', 'C', 'plus', { current: true }),
        mkItem('New work package', 'In Northwind rollout Lyon', 'N', 'wp'),
        mkItem('Link to work package', 'Link the selected event', 'L', 'link'),
        mkItem('Find a time', 'Free slots for the invited people', 'F', 'clock')
      ] },
      { label: 'Go to', items: [
        mkItem('Today', 'Monday 12 October', 'T', 'today'),
        mkItem('Month view', 'Weeks as rows', 'M', 'grid'),
        mkItem('Agenda', 'Events as a list', 'A', 'list')

      { label: 'Settings', items: [
        mkItem('Show weekends', 'Saturday and Sunday columns', 'E', 'weekend', { sw: true, on: true }),

    const keyGroups = [
      { label: 'Move through time', keys: [[['Left'], 'Previous week'], [['Right'], 'Next week'], [['T'], 'Jump to today'], [['E'], 'Show or hide weekends']] },
      { label: 'Views', keys: [[['D'], 'Day'], [['W'], 'Week'], [['M'], 'Month'], [['Y'], 'Year'], [['A'], 'Agenda'], [['Shift', 'A'], 'Collapse the all day section'], [['Z'], 'Show another time zone for now']] },

      { label: 'Your invitation, not answered: faded', swatch: sw + 'background: #ffffff; border: 1px solid color-mix(in srgb, ' + p + ' 40%, #ffffff); border-left: 3px solid ' + p + '; opacity: 0.6' },
      { label: 'Your invitation, maybe: dashed, like tentative', swatch: sw + 'background: #ffffff; border-left: 3px solid ' + p + '; outline: 1px dashed ' + p + '; outline-offset: -1px' },
      { label: 'Your invitation, declined: struck and faded', swatch: sw + 'background: #ffffff; border-left: 3px solid #c4c7cb; color: #5e6168; opacity: 0.6; text-decoration: line-through', hasText: true, text: 'Title', textStyle: '' },
      { label: 'Bell: a reminder is set', swatch: sw + 'background: ' + pale(p) + '; border-left: 3px solid ' + p + '; color: ' + dark(p), hasIcon: true, icon: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0' },
      { label: 'Completed task, ticked, 100% in the title', swatch: sw + 'background: ' + pale(TYPE.TASK) + '; border-left: 3px solid ' + TYPE.TASK + '; color: ' + dark(TYPE.TASK), hasIcon: true, icon: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zm-4-9 3 3 5-6' },

    const due = [

    const keys = [['T', 'Go to today'], ['W', 'Week view'], ['M', 'Month view'], ['C', 'New event']].map(([key, label]) => ({ key, label }));

}
