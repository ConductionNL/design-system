<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: repeat rule and the question which events a change applies to</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2863px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The repeat dialog for the daily stand-up, opened from Repeat in the event panel, which closes first: every week on five weekdays, the end never, the rule as a sentence</figcaption>
    <div style="position: relative; height: 1013px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" folded="true" hint-size="64px,945px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
          <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
            <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
            <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
            <span style="flex: 1 1 auto"></span>
            <div style="display: flex; align-items: center; gap: 4px; align-self: center">
              <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
              <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
              <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
            </div>
          </div>
          <div style="flex: none; display: flex; height: 34px">
            <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
            <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
              <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
            </sc-for>
          </div>
          <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
            <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
            <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
              <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
                <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
                  <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
                  <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
                  <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
                  <span style="flex: none; color: #3d4047">{{ b.number }}</span>
                  <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
                  <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
                  <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
                </a>
              </sc-for>
            </div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
            <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
              <div style="{{ h.lineStyle }}"></div>
              <div style="{{ h.localStyle }}">{{ h.local }}</div>
              <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
            </sc-for>
            <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
              <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
                <div style="{{ d.colStyle }}">
                  <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                    <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                      <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                        <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                        <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                        <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                        <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                      </span>
                      <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                      <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                    </a>
                  </sc-for>
                  <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
                </div>
              </sc-for>
            </div>
            <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
          </div>
        </main>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.4); display: flex; align-items: center; justify-content: center">
        <div role="dialog" aria-modal="true" aria-labelledby="rep-title" style="width: 640px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); overflow: hidden">
          <div style="display: flex; align-items: flex-start; gap: 12px; padding: 20px 16px 16px 24px; border-bottom: 1px solid #e4e6ea">
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <h2 id="rep-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 28px">Repeat</h2>
              <span style="font-size: 14px; color: #5e6168; line-height: 20px">Stand-up, 10:00 to 10:15, calendar Personal. The rule starts on Monday 12 October.</span>
            </div>
            <button type="button" aria-label="Close" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 24px 24px">
            <div style="display: flex; align-items: center; gap: 10px">
              <label for="rep-every" style="font-weight: 500; white-space: nowrap">Repeat every</label>
              <input id="rep-every" type="text" value="1" inputmode="numeric" style="{{ num }}">
              <button type="button" aria-haspopup="listbox" aria-label="Unit: weeks" style="{{ chooser }}">weeks<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px">
              <span id="rep-wd" style="font-weight: 500">On these weekdays</span>
              <div role="group" aria-labelledby="rep-wd" style="display: flex; gap: 6px">
                <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7"><button type="button" aria-pressed="{{ w.on }}" style="{{ w.style }}">{{ w.label }}</button></sc-for>
              </div>
            </div>
            <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
              <legend style="padding: 0; margin-bottom: 8px; font-weight: 500">End of the repetition</legend>
              <label style="display: flex; align-items: center; gap: 10px; height: 40px"><input type="radio" name="rep-end" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Never</label>
              <label style="display: flex; align-items: center; gap: 10px; height: 40px"><input type="radio" name="rep-end" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"><span style="width: 76px">On a date</span><button type="button" aria-haspopup="dialog" aria-label="End date" style="{{ chooser }}">31 December 2026<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></button></label>
              <label style="display: flex; align-items: center; gap: 10px; height: 40px"><input type="radio" name="rep-end" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"><span style="width: 76px">After</span><input type="text" value="20" inputmode="numeric" aria-label="Number of times" style="{{ num }}"><span>times</span></label>
            </fieldset>
            <div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; color: #3d4047; line-height: 19px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168; margin-top: 1px"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
              <span>Every week on Monday to Friday at 10:00, 15 minutes, never ends.</span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 16px 24px; border-top: 1px solid #e4e6ea">
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Save</button>
            <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Cancel</button>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Remove the repetition</button>
          </div>
        </div>
      </div>
    </div>
  </figure>
  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Monthly: on days of the month, or on a weekday such as the last Friday</figcaption>
      <div style="height: 700px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px 24px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700; line-height: 22px">Invoice run</span><span style="font-size: 12px; color: #5e6168">Calendar Northwind team, from Thursday 1 October</span></div>
        <div style="display: flex; align-items: center; gap: 10px">
          <label for="rep-m-every" style="font-weight: 500; white-space: nowrap">Repeat every</label>
          <input id="rep-m-every" type="text" value="1" inputmode="numeric" style="{{ num }}">
          <button type="button" aria-haspopup="listbox" aria-label="Unit: months" style="{{ chooser }}">months<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        </div>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
          <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Monthly on</legend>
          <label style="display: flex; align-items: center; gap: 10px; height: 32px"><input type="radio" name="rep-m-on" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">On days of the month</label>
          <div role="group" aria-label="Days of the month" style="display: grid; grid-template-columns: repeat(7, 30px); gap: 4px; margin-left: 28px">
            <sc-for list="{{ monthDays }}" as="m" hint-placeholder-count="31"><button type="button" aria-pressed="{{ m.on }}" style="{{ m.style }}">{{ m.label }}</button></sc-for>
          </div>
          <label style="display: flex; align-items: center; gap: 10px; height: 40px; margin-top: 4px"><input type="radio" name="rep-m-on" aria-label="On the nth weekday of the month" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"><span>On the</span><button type="button" aria-haspopup="listbox" aria-label="Which one: last" style="{{ chooserSm }}">last<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><button type="button" aria-haspopup="listbox" aria-label="Weekday: Friday" style="{{ chooserSm }}">Friday<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><span>of the month</span></label>
        </fieldset>
        <div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; color: #3d4047; line-height: 19px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168; margin-top: 1px"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
          <span>Every month on the 1st and the 15th, never ends.</span>
        </div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Yearly: a birthday is read only and comes from the contact card; under it a yearly rule you set yourself, on a day or on a weekday of chosen months</figcaption>
      <div style="height: 700px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 20px 24px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; font-weight: 700; line-height: 22px">Birthday of Priya Raman</span><span style="font-size: 12px; color: #5e6168">Calendar Contacts, 14 March</span></div>
        <div style="display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: var(--sc-radius, 8px); background: #eaf0f7; font-size: 12px; color: #234a78; line-height: 18px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M20 12v10H4V12M2 7h20v5H2zM12 22V7M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7zM12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
          <span>Repeats every year, set from the contact card. Change the date there.</span>
        </div>
        <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg>Open contact card</button>
        <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 16px; border-top: 1px solid #e4e6ea"><span style="font-size: 16px; font-weight: 700; line-height: 22px">Annual review</span><span style="font-size: 12px; color: #5e6168">Calendar Northwind team, from Saturday 14 March. A yearly rule you set yourself.</span></div>
        <div style="display: flex; align-items: center; gap: 10px">
          <label for="rep-y-every" style="font-weight: 500; white-space: nowrap">Repeat every</label>
          <input id="rep-y-every" type="text" value="1" inputmode="numeric" style="{{ num }}">
          <button type="button" aria-haspopup="listbox" aria-label="Unit: years" style="{{ chooser }}">years<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <span id="rep-mo" style="font-weight: 500">In these months</span>
          <div role="group" aria-labelledby="rep-mo" style="display: flex; flex-wrap: wrap; gap: 4px">

        title, href: '#',
        aria: title + ', ' + fmt(start) + ' to ' + fmt(end) + (pending ? ', not answered yet' : '') + (o.past ? ', over' : ''), current: o.selected ? 'true' : 'false',
        titleStyle: 'flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; ' + (short ? 'white-space: nowrap; text-overflow: ellipsis;' : 'display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;'),
        time: short ? fmt(start) : fmt(start) + ' to ' + fmt(end), inlineTime: short, blockTime: !short,
        flag: !!o.flag, video: !!o.video,
        hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '',
        style: 'position: absolute; left: 2px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; justify-content: ' + (short ? 'center' : 'flex-start') + '; padding: ' + (short ? '0 6px' : '4px 7px') + '; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; text-decoration: none; z-index: 1; color: ' + dark(c) + '; ' +
          (pending ? 'background: #ffffff; border: 1px solid color-mix(in srgb, ' + c + ' 40%, #ffffff); border-left: 3px solid ' + c + '; opacity: 0.6;' : 'background: ' + pale(c) + '; border-left: 3px solid ' + c + ';') +
          (o.past ? ' opacity: 0.55;' : '') + (o.selected ? ' box-shadow: 0 0 0 2px #3669a5;' : '')
      };
    };
    const standup = (o) => ev('Stand-up', 10, 0.25, Object.assign({ cal: 'personal' }, o));
    const perDay = [
      [ev('Week planning', 8, 0.75, { cal: 'personal', past: true }), standup({ selected: true })],
      [standup(), ev('Demo preparation Malmo Energi', 11, 1, { cal: 'customers' })],
      [standup(), ev('Release 16.5 scope review', 9.5, 1.5, { cal: 'team', chip: ['EPIC', '#57990', 'in review'] })],
      [standup(), ev('Rollout review Lyon, phase 2', 14, 1, { cal: 'customers', chip: ['FEATURE', '#58412', 'in development'], video: true, pending: true })],
      [standup(), ev('Submit October hours', 17, 0.5, { cal: 'personal', flag: true })],
      [], []
    ];
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = i === 0;
      const weekend = i >= 5;
      return {
        name, n: 12 + i, today, events: perDay[i],
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : 'color: #1b1c1d; font-weight: 500',
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    const bars = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns', 0, 0, 2, false, false, true],
      ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout, 5 to 30 Oct', 1, 0, 6, true, true, false],
      ['EPIC', '#57990', 'Release 16.5 scope, 28 Sep to 23 Oct', 2, 0, 6, true, true, false]
    ].map(([type, number, subject, lane, s, e, leftOpen, rightOpen, handles]) => {
      const c = TYPE[type];
      const left = leftOpen ? '0px' : 'calc(100% * ' + s + ' / 7 + 2px)';
      const width = 'calc(100% * ' + (e - s + 1) + ' / 7' + (leftOpen ? '' : ' - 2px') + (rightOpen ? '' : ' - 4px') + ')';
      return {
        type, number, subject, color: c, leftOpen, rightOpen, handles,
        aria: type + ' ' + number + ', ' + subject,
        style: 'position: absolute; top: ' + (6 + lane * 24) + 'px; left: ' + left + '; width: ' + width + '; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-left: 3px solid ' + c + '; border-radius: 4px; background: ' + pale(c) + '; font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden'
      };
    });
    const adot = (st) => 'flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: ' + st[0] + '; border: 2px solid ' + st[1];
    const attendees = [
      ['Olivia Brandt (you)', 'OB', 'organiser', ['#d3f9d8', '#8ff09c']],
      ['Tom Achterberg', 'TA', 'accepted', ['#d3f9d8', '#8ff09c']],
      ['Priya Raman', 'PR', 'accepted', ['#d3f9d8', '#8ff09c']]
    ].map(([name, initials, answer, st]) => ({ name, initials, answer, dot: adot(st) }));
    // form controls
    const num = 'width: 64px; height: 40px; padding: 0 10px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px \'Fira Sans\', sans-serif; color: #1b1c1d; text-align: center';
    const chooser = 'display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 120px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px \'Fira Sans\', sans-serif; white-space: nowrap';
    const chooserSm = chooser.replace('min-width: 120px', 'min-width: 92px');
    const chipBase = 'height: 34px; min-width: 44px; padding: 0 10px; box-sizing: border-box; border-radius: var(--sc-radius, 8px); font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap; ';
    const chipOn = chipBase + 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;';
    const chipOff = chipBase + 'border: 1px solid #c4c7cb; background: #ffffff; color: #3d4047;';
    const chipsOf = (labels, on) => labels.map((label, i) => ({ label, on: on(i) ? 'true' : 'false', style: on(i) ? chipOn : chipOff }));
    const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const weekdays = chipsOf(WD, (i) => i < 5);
    const weekdaysTue = chipsOf(WD, (i) => i === 1);
    const weekdaysThu = chipsOf(WD, (i) => i === 3);
    const dayBase = 'width: 30px; height: 28px; padding: 0; box-sizing: border-box; border-radius: 4px; font: 500 12px \'Fira Sans\', sans-serif; ';
    const monthDays = Array.from({ length: 31 }, (_, i) => {
      const on = i === 0 || i === 14;
      return { label: String(i + 1), on: on ? 'true' : 'false', style: dayBase + (on ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #e4e6ea; background: #ffffff; color: #3d4047;') };
    });
    const months = chipsOf(['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], (i) => i === 2);
    const choice = 'display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 14px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; text-align: left; white-space: nowrap';
    const choiceDanger = choice.replace('color: #1b1c1d', 'color: #cc0000');
    const ghostCols = WD.map((_, i) => ({ bg: i >= 5 ? 'background: #f5f6f8;' : '' }));
    return { hours, days, bars, nowTop, nowLabelTop, attendees, num, chooser, chooserSm, weekdays, weekdaysTue, weekdaysThu, monthDays, months, choice, choiceDanger, ghostCols };
  }
}
</script>
