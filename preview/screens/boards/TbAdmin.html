<body>
<div class="sc-board" data-board="TbAdmin">

<div style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 14px; line-height: 21px; background: var(--sc-work-ground, #f5f6f8); box-sizing: border-box; width: 1440px; height: 2090px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">a</span> &nbsp;The administration page of Tasks at rest: who may create projects, sharing with other servers, and how long deleted items are kept. The mark Nextcloud only means: kept in Nextcloud, OpenProject does not have this</figcaption>
    <div style="position: relative; height: 1040px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  

<header style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: #ffffff; width: 100%; box-sizing: border-box; height: 55px; padding: 0 16px 0 16px; display: flex; align-items: center; gap: 16px; position: relative; background: var(--sc-primary, #3669a5)">
  <a href="MlInbox.html" style="flex: 0 0 229px; width: 229px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 55px; color: #ffffff; text-decoration: none; min-width: 0">
    <span style="flex: none; width: 30px; height: 30px; overflow: hidden; display: inline-flex; align-items: center"><img src="../assets/zuiddrecht/logo-wit.svg" alt="" style="height: 30px; width: auto; max-width: none" data-sc-logo="logo-wit"></span>
    <span style="display: flex; flex-direction: column; line-height: 1.15; min-width: 0"><span style="font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">OpenProject</span><strong style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Administration</strong></span>
  </a>
  <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); flex: none; margin-left: -16px"></span>
  <button type="button" aria-label="All apps" aria-haspopup="menu" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: rgba(255,255,255,0.14); color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16,20H20V16H16M16,14H20V10H16M10,8H14V4H10M16,8H20V4H16M10,14H14V10H10M4,14H8V10H4M4,20H8V16H4M10,20H14V16H10M4,8H8V4H4V8Z"></path></svg>
  </button>
  <form role="search" style="position: absolute; left: 50%; top: 9px; transform: translateX(-50%); width: min(640px, 44vw); min-width: 240px; display: flex; align-items: center">
    <label for="ml-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
    <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 10px; color: #ffffff"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
    <input id="ml-search" type="search" placeholder="Search projects or settings" style="width: 100%; height: 36px; box-sizing: border-box; padding: 0 44px 0 36px; border: 1px solid #ffffff; border-radius: var(--sc-radius-lg, 10px); background: rgba(255,255,255,0.12); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">
    <button type="button" aria-label="Search filters" aria-haspopup="menu" style="position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
    </button>
  </form>
  <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: max-content">
    <button type="button" aria-label="Notifications, 2 new" aria-haspopup="dialog" aria-expanded="false" style="position: relative; width: 36px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: #cf222e; color: #ffffff; font: 700 10px/16px var(--sc-font, 'Fira Sans'), sans-serif; text-align: center">2</span>
    </button>
    <button type="button" aria-label="Help" style="width: 36px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
    </button>
    <button type="button" aria-label="Settings" style="width: 36px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path></svg>
    </button>
    <button type="button" aria-label="Account menu of Ines Okafor" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; margin-left: 6px; padding: 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff">
      <span style="width: 30px; height: 30px; border-radius: 15px; background: #ffffff; color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center; font: 700 12px var(--sc-font, 'Fira Sans'), sans-serif">IO</span>
      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</header>

  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden">

<nav aria-label="Administration" style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 15px; line-height: 21px; width: 245px; box-sizing: border-box; min-height: 100%; padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; background: #ffffff; border-right: 1px solid var(--sc-work-line, #e4e6ea)">
  <h2 style="margin: 0; padding: 0 10px; font-size: 16px; font-weight: 600; line-height: 1.3">Administration</h2>
  <div style="margin: 2px 0 10px; padding: 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Tasks</div>
  
    <a href="TbAdmin.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 15px; line-height: 21px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); font-weight: 600;"><svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Settings</span></a>
  
  <a href="TbBoard.html" style="margin-top: auto; display: inline-flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); font-size: 15px; font-weight: 500; color: var(--sc-link, var(--sc-primary, #3669a5)); text-decoration: none"><svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M19 12H5M12 19l-7-7 7-7"></path></svg>Back to Tasks</a>
</nav>
</div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Tasks</h1>
        <p style="margin: 0; color: var(--sc-work-text, #3d4047)">What holds for the Tasks app of everyone on this workspace: who may create a project, whether projects can be shared with other servers, and how long deleted items are kept.</p>
        <p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Projects, work packages and members come from OpenProject. These settings are kept in this app. The first one also limits who creates projects in OpenProject from here.</p>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; align-items: start">
        <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
          <section aria-labelledby="tb-adm-create" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius-lg, 10px); min-width: 0">
            <h3 id="tb-adm-create" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 24px">Who may create projects</h3>
            <p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">A project is created here and in OpenProject at the same time. Limit that to the people who run projects.</p>
            <fieldset style="margin: 0; min-width: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 6px">
              <legend style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Who may create projects</legend>
              <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px; min-height: 32px"><input type="radio" name="tb-adm-who" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span>Everyone signed in</span></label>
              <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px; min-height: 32px"><input type="radio" name="tb-adm-who" checked style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span>Only members of these groups</span></label>
            </fieldset>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding-left: 28px">
              <span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: var(--sc-radius, 8px); background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); font-size: 12px; font-weight: 600; white-space: nowrap">Project leads<span style="font-weight: 400; color: var(--sc-work-muted, #5e6168)">4</span><button type="button" aria-label="Remove the group Project leads" style="width: 20px; height: 20px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span><span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 4px 0 10px; border-radius: var(--sc-radius, 8px); background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); font-size: 12px; font-weight: 600; white-space: nowrap">Delivery team<span style="font-weight: 400; color: var(--sc-work-muted, #5e6168)">6</span><button type="button" aria-label="Remove the group Delivery team" style="width: 20px; height: 20px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add group</button>
            </div>
            <p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Everyone else still sees the projects they are a member of and works in them as usual. 10 people may create a project today.</p>
          </section>
          <section aria-labelledby="tb-adm-fed" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius-lg, 10px); min-width: 0">
            <h3 id="tb-adm-fed" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 24px">Sharing with other servers</h3>
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
              <label for="tb-adm-fed-switch" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="display: flex; align-items: center; gap: 8px; font-weight: 600">Share projects with people on other servers<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-muted, #5e6168); font: 600 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span><span style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">A person on another server is added by name and server and gets the project under Shared with you there, marked Other server. Off stops new shares and pauses the existing ones.</span></label>
              <button id="tb-adm-fed-switch" type="button" role="switch" aria-checked="true" style="flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: 12px; background: var(--sc-action, var(--sc-primary, #3669a5)); box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button>
            </div>
            <div style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sc-work-text, #3d4047)"><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #d3f9d8; border: 1.5px solid #8ff09c"></span>2 projects are shared with 1 other server today: ville-de-lyon.test</div>
          </section>
        </div>
        <div style="display: flex; flex-direction: column; gap: 16px; min-width: 0">
          <section aria-labelledby="tb-adm-trash" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius-lg, 10px); min-width: 0">
            <h3 id="tb-adm-trash" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 24px">Deleted items</h3>
            <p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Deleting a work package hides it on the board and keeps it for 30 days under Deleted items of its project, where a member can restore it. OpenProject still has it until then. A column is never deleted, only removed from the board.</p>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px">
              <label for="tb-adm-days" style="display: flex; flex-direction: column; gap: 2px"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">Keep deleted items for<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-muted, #5e6168); font: 600 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span><span style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">After that they are deleted for good, every night at 03:00.</span></label>
              <span style="display: inline-flex; align-items: center; gap: 8px"><input id="tb-adm-days" type="text" inputmode="numeric" value="30" style="width: 80px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); text-align: right"><span style="font-size: 13px; color: var(--sc-work-text, #3d4047)">days</span></span>
            </div>
            <p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Delete for good, or the end of these days, deletes it in OpenProject. 0 keeps deleted items until a member deletes them for good.</p>
          </section>
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid var(--sc-primary, #3669a5); border-radius: var(--sc-radius, 8px); background: var(--sc-primary-light, #eaf0f7); font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--sc-primary, #3669a5)"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span>Signed in to openproject.northwind-projects.test as the app account since 14 March 2026. The connection itself is set up under OpenProject in the workspace settings.</span></div>
        </div>
