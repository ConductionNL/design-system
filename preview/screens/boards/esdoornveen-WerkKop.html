<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onderdeel: werkplek bovenbalk</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1176px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</head>
<body>
<div class="sc-board" data-board="WerkKop">

<header style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; box-sizing: border-box; min-height: 68px; padding: 10px 28px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
  <button type="button" aria-label="Alle apps" style="width: 40px; height: 40px; border: 0; border-radius: 8px; background: #f5f6f8; color: #1b1c1d; display: flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewbox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"></circle><circle cx="12" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle></svg>
  </button>
  <form role="search" style="flex: 1 1 280px; max-width: 560px; position: relative">
    <label for="wk-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken</label>
    <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="#5e6168" stroke-width="2.2" stroke-linecap="round" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    <input id="wk-zoek" type="search" placeholder="Zoek een student, klas of leerbedrijf" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border: 1px solid #c4c7cb; border-radius: 22px; background: #f5f6f8; font: 400 15px 'IBM Plex Sans', sans-serif; color: #1b1c1d">
  </form>
  <div style="margin-left: auto; display: flex; align-items: center; gap: 12px">
    <button type="button" aria-label="Meldingen, 2 nieuw" style="position: relative; width: 40px; height: 40px; border: 0; border-radius: 20px; background: transparent; color: #1b1c1d; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20a2 2 0 0 0 4 0"></path></svg>
      <span style="position: absolute; top: 7px; right: 8px; width: 9px; height: 9px; border-radius: 5px; background: #c2255c; border: 2px solid #ffffff"></span>
    </button>
    <span style="width: 1px; height: 28px; background: #e4e6ea"></span>
    <button type="button" aria-label="Menu van Ruud Hermans" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 4px; border: 0; border-radius: 24px; background: transparent; font: 400 15px 'IBM Plex Sans', sans-serif; color: #1b1c1d; text-align: left">
      <span style="width: 38px; height: 38px; border-radius: 19px; background: #f0eaf7; color: #43206e; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">RH</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><strong style="font-size: 15px">Ruud Hermans</strong><span style="font-size: 13px; color: #5e6168">Docent mechatronica</span></span>
      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>
</header>
</div>
</body>
</html>
