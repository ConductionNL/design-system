              <td style="padding: 0 12px 0 16px; text-align: right; white-space: nowrap"><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #828a95); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--sc-work-ink, #1b1c1d)"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg>Show in the navigation</button></td>

          </tbody>
        </table>
      </div>
    </figure>
  </div>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; align-self: flex-start">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">j</span> &nbsp;Import a backup file opens this dialog over the dimmed screen: a backup file of this app or a calendar file (.ics), into a chosen project. Each event becomes a work package with its dates. Skipping what already exists is kept in Nextcloud, OpenProject does not have it</figcaption>
    <div style="width: 800px; box-sizing: border-box; padding: 40px; background: rgba(27,28,29,0.45); border-radius: var(--sc-radius-lg, 10px)">
      <div role="dialog" aria-labelledby="tb-imp-title" style="width: 640px; margin: 0 auto; box-sizing: border-box; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); display: flex; flex-direction: column">
        <div style="padding: 20px 24px 12px"><h2 id="tb-imp-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 26px">Import into a project</h2></div>
        <div style="padding: 0 24px 8px; display: flex; flex-direction: column; gap: 16px">
          <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px">
            <legend style="padding: 0; margin: 0 0 4px; font-size: 14px; font-weight: 600; line-height: 20px">What to import</legend>
            <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="radio" name="tb-imp-kind" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5); margin-top: 1px"><span style="display: flex; flex-direction: column"><span>Backup file (JSON)</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">An export of this app: work packages with their fields, tags, comments and attachments.</span></span></label>
            <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="radio" name="tb-imp-kind" checked style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5); margin-top: 1px"><span style="display: flex; flex-direction: column"><span>Calendar file (.ics)</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Each event or to-do becomes a work package with its title, dates and description.</span></span></label>
          </fieldset>
          <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600">File</span><div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #828a95); border-radius: var(--sc-radius-lg, 10px); background: #ffffff"><span style="display: inline-flex; align-items: center; height: 22px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); font-size: 11px; font-weight: 700">ICS</span><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px">milestones-lyon-2026.ics</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">14 events</span><button type="button" style="display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, var(--sc-primary, #3669a5)); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Choose another file</button></div></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="tb-imp-project" style="font-size: 14px; font-weight: 600">Into the project</label><button id="tb-imp-project" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; width: 100%; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #828a95); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 10px"><span aria-hidden="true" style="flex: none; width: 12px; height: 12px; border-radius: 3px; background: var(--sc-primary, #3669a5)"></span>Northwind rollout Lyon</span><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">The work packages are created in OpenProject in this project, with you as their author.</span></div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 4px; border-top: 1px solid var(--sc-work-soft, #eef0f3)">
            <label for="tb-imp-skip" style="display: flex; flex-direction: column; gap: 2px; min-width: 0; padding-top: 10px"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600">Skip work packages that already exist<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #828a95); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-muted, #5e6168); font: 600 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Same title and same dates in this project: left as it is instead of imported twice. Off imports every entry of the file.</span></label>
            <button id="tb-imp-skip" type="button" role="switch" aria-checked="true" style="flex: none; position: relative; width: 42px; height: 24px; border: 6px solid transparent; background-clip: padding-box; box-sizing: content-box; margin: -6px; padding: 0; border-radius: 18px; background: var(--sc-action, var(--sc-primary, #3669a5)); box-sizing: border-box; cursor: pointer; margin-top: 10px"><span style="position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid var(--sc-work-soft, #eef0f3)">
          <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid var(--sc-work-field, #828a95); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif">Cancel</button>
          <button type="button" style="height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif">Import 14 work packages</button>
        </div>
      </div>
    </div>
  </figure>
</div>
</div>
