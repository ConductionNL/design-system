<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>dossiq: persoonlijke instellingen, weergaven in mijn menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="DqDashboard" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Dossiq" version="0.4.47" active="Weergaven in mijn menu" height="760" sections="{{ sections }}" nc-links="{{ ncLinks }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Dossiq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen in the navigation and
    // from the pencil next to Mijn weergaven (DqZijbalk). Replaces the Dossiq section of Nextcloud's personal settings
    // (/settings/user/dossiq, decision 11 Oct 2026). The five Vue apps of src/personalSettings.js become sections here,
    // next to what CnAppRoot adds by default: Meldingen, Inloggegevens and Rondleiding.
    const sections = [
      { name: 'Weergaven in mijn menu', desc: 'Deze opgeslagen weergaven staan onderaan je menu onder Mijn weergaven, in deze volgorde. Sleep een regel of gebruik de pijltjestoetsen. Een weergave zet je in het menu met Toevoegen aan menu in het zijpaneel van een lijst.', rows: [
        { ordered: true, items: [
          ['Woo-verzoeken', 'Zaaktype Woo-verzoek, status lopend · 11 zaken', 'Uit menu halen'],
          ['Termijn deze week', 'Mijn zaken, status lopend, termijn binnen 7 dagen · 2 zaken', 'Uit menu halen']
        ] },
        { select: 'Weergave toevoegen', value: 'Kies een opgeslagen weergave', hint: 'Je ziet je eigen weergaven, de weergaven die met je zijn gedeeld en de standaardweergaven. Een nieuwe weergave komt onderaan.' }
      ] },
      { name: 'Meldingen', desc: 'Kies per soort melding waar je hem krijgt. Je organisatie bepaalt welke verplicht zijn.', rows: [
        { select: 'Meldingsdomein', value: 'Al mijn werk' },
        { matrix: 'Gebeurtenis', cols: ['In Nextcloud', 'Per e-mail'], lines: [
          ['Zaak', null],
          ['Een zaak wordt aan mij toegewezen', [true, false]],
          ['Een zaak wordt opgeschaald naar calamiteit', [true, false]],
          ['Een zaak komt via een overdracht bij ons binnen', [true, false]],
          ['Een zaak die ik volg verandert van status', [true, false]],
          ['Vervanging', null],
          ['Ik word als waarnemer voor iemand geregistreerd', [true, false]],
          ['Werkoverzicht', null],
          ['Mijn dagelijkse werkoverzicht', [true, false]]
        ] },
        { disclosure: 'Bundeling en testbericht' }
      ] },
      { name: 'Dagoverzicht', desc: 'Elke werkdag een mail met je openstaande zaken en taken.', rows: [
        { switch: 'Stuur me elke dag een overzicht van mijn openstaande werk', on: true },
        { select: 'Uur van de dag', value: '08.00 uur' }
      ] },
      { name: 'Waarneming', desc: 'Wie je zaken oppakt als je er niet bent.', rows: [
        { items: [['Anouk Bakker', '21 tot en met 25 oktober · alle zaken · vakantie', 'Intrekken', 'Gepland']] },
        { buttons: [['Waarneming registreren', '']] }
      ] },
      { name: 'Mail aan zaken koppelen', desc: 'Mail die over je zaken gaat, komt vanzelf bij de zaak.', rows: [
        { select: 'Mailaccount', value: 'Pieter Jansen (pieter.jansen@zuiddrecht.example)' },
        { switch: 'Mail van dit account aan mijn zaken koppelen', hint: 'Op zaaknummer in het onderwerp. De mail blijft in Nextcloud Mail.', on: true }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['Mijn Kadaster-account', 'BRK-bevraging · toegevoegd 2 september', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] },
      { name: 'Rondleiding', desc: 'Je bent bij stap 4 van 9: een zaak afsluiten.', rows: [
        { buttons: [['Verder met de rondleiding', 'primary'], ['Opnieuw beginnen', '']] }
      ] },
      // CnAppRoot's integrations section: the manifest's links into other apps.
      { name: 'Koppelingen', desc: 'Deze openen in een andere app.', rows: [
        { links: ['Verwerkingsactiviteiten (AVG)', 'AI-toezicht', 'Datamodel'] }
      ] }
    ];
    // Nextcloud's own personal settings, linked above Dossiq's entry (dossiq App.vue userSettingsNextcloudLinks).
    const ncLinks = ['Persoonlijke info', 'Beveiliging', 'Notificaties', 'Mobiel en desktop', 'Delen', 'Uiterlijk en toegankelijkheid', 'Beschikbaarheid', 'Privacy'];
    return { sections, ncLinks };
  }
}
</script>
</body>
</html>
