<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: search box with typed operators and the full filter form</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
mark{background:#eaf0f7;color:inherit;border-radius:2px;padding:0 1px}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1920px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Search box in focus: typed operators, one-click chips and the account choice</figcaption>
    <div style="position: relative; height: 520px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" placeholder="Search mail, people and work packages" hint-size="100%,68px"></dc-import>
      <div style="position: absolute; left: 221px; top: 9px; width: 640px; height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 0; padding: 0 44px 0 36px; border: 2px solid #ffffff; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; box-shadow: 0 0 0 3px rgba(255,255,255,0.35)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 11px; top: 8px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
        <span role="textbox" aria-label="Search, typed: from:jana is:unread has:attachment gantt" style="display: inline-flex; align-items: center; gap: 4px; white-space: nowrap">
          <sc-for list="{{ typed }}" as="t" hint-placeholder-count="4"><span style="{{ t.style }}">{{ t.text }}</span></sc-for>
          <span aria-hidden="true" style="display: inline-block; width: 1px; height: 18px; background: #1b1c1d"></span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 10px; top: 8px; color: #5e6168"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
      </div>
      <div role="dialog" aria-label="Search suggestions" style="position: absolute; left: 221px; top: 50px; width: 640px; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 6px; border-bottom: 1px solid #e4e6ea">
          <span style="font-size: 12px; font-weight: 600; color: #3d4047; white-space: nowrap">Search in</span>
          <button type="button" aria-haspopup="listbox" aria-label="Search in: All accounts" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 30px; min-width: 200px; padding: 0 8px 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 13px 'Fira Sans', sans-serif; white-space: nowrap"><span>All accounts, 2 mailboxes</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
          <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Olivia Brandt and the shared Support mailbox</span>
        </div>
        <div role="group" aria-label="One-click filters" style="display: flex; align-items: center; gap: 6px; padding: 2px 10px 4px">
          <sc-for list="{{ quick }}" as="q" hint-placeholder-count="4"><button type="button" aria-pressed="{{ q.on }}" style="{{ q.style }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ q.icon }}"></path></svg>{{ q.label }}</button></sc-for>
        </div>
        <div style="padding: 4px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Operators you can type</div>
        <ul role="listbox" aria-label="Operator suggestions" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{ ops }}" as="o" hint-placeholder-count="6">
            <li role="option" aria-selected="{{ o.on }}" style="{{ o.style }}">
              <code style="flex: none; width: 150px; font: 500 13px ui-monospace, 'Fira Mono', monospace; color: #1b1c1d">{{ o.op }}</code>
              <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #3d4047; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ o.what }}</span>
              <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ o.alt }}</span>
            </li>
          </sc-for>
        </ul>
        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 10px 4px; border-top: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 18px">
          <span style="flex: 1 1 auto">The same operators work in French and Dutch: type de:, à:, est: or van:, aan:, is: and they are read as from:, to: and is:.</span>
          <button type="button" style="flex: none; height: 30px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Open all filters</button>
        </div>
      </div>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="" folded="true" hint-size="64px,465px"></dc-import></div>
        <section aria-label="Search results" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
            <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Results</h2><span style="font-size: 13px; color: #5e6168; white-space: nowrap">2 conversations, all accounts</span></div>
          </div>
          <div style="flex: none; box-sizing: border-box; padding: 0 16px 10px; border-bottom: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 18px">Searched both mailboxes, all folders except Spam and Trash.</div>
          <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <sc-for list="{{ rowsA }}" as="r" hint-placeholder-count="2">
              <li style="{{ r.style }}">
                <a href="MlThread.dc.html" aria-current="{{ r.current }}" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
                  <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
                  <span style="{{ r.avatar }}">{{ r.initials }}</span>
                  <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                    <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.sender }}">{{ r.from }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span><span style="flex: none; height: 18px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #5e6168; font-size: 11px; line-height: 18px; white-space: nowrap">{{ r.folder }}</span><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                    <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.subjectStyle }}">{{ r.subject }}</span></span>
                    <span style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span></span>
                  </span>
                </a>
              </li>
            </sc-for>
          </ol>
        </section>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; background: #f5f6f8; text-align: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c4c7cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
          <span style="font-size: 13px; color: #5e6168; line-height: 19px">Press Enter to search, or pick a conversation on the left.</span>
        </main>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;All filters opened to their full length, with the and, or and not switch at the top</figcaption>
    <div style="position: relative; height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" placeholder="from:jana subject:gantt" hint-size="100%,68px"></dc-import>
      <div role="dialog" aria-label="Search filters, all of them" style="position: absolute; left: 221px; top: 50px; width: 720px; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px 8px; border-bottom: 1px solid #e4e6ea">
          <span style="font-size: 12px; font-weight: 600; color: #3d4047; white-space: nowrap">Combine the conditions</span>
          <div role="radiogroup" aria-label="Combine the conditions: and, or, not" style="display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); overflow: hidden">
            <button type="button" role="radio" aria-checked="true" style="height: 28px; padding: 0 12px; border: 0; background: #eaf0f7; color: #234a78; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">All of them (and)</button>
            <button type="button" role="radio" aria-checked="false" style="height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; background: #ffffff; color: #3d4047; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Any of them (or)</button>
            <button type="button" role="radio" aria-checked="false" style="height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; background: #ffffff; color: #3d4047; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">None of them (not)</button>
          </div>
          <span style="flex: 1 1 auto"></span>
          <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Searching all accounts</span>
        </div>
        <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
          <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 8px">
            <h3 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ s.title }}</h3>
            <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px">
              <sc-for list="{{ s.fields }}" as="f" hint-placeholder-count="4">
                <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: #3d4047; min-width: 0; {{ f.span }}">
                  <span style="white-space: nowrap">{{ f.label }}</span>
                  <span style="display: flex; align-items: center; gap: 5px; height: 32px; padding: 0 8px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font-size: 13px; font-weight: 400; color: {{ f.color }}; min-width: 0">
                    <sc-if value="{{ f.hasType }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #ab0000">BUG</span></sc-if>
                    <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ f.value }}</span>
                    <sc-if value="{{ f.hasClear }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Clear {{ f.label }}" style="flex: none; width: 22px; height: 22px; margin-right: -4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
                    <sc-if value="{{ f.hasCaret }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></sc-if>
                  </span>
                </label>
              </sc-for>
            </div>
          </div>
        </sc-for>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 8px">
          <h3 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">State</h3>
          <div style="display: flex; align-items: center; gap: 20px; flex-wrap: wrap">
            <div role="radiogroup" aria-label="Unread or read" style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px"><span style="font-weight: 600; color: #3d4047; font-size: 12px">Unread or read</span><label style="display: flex; align-items: center; gap: 6px"><input type="radio" name="ml-sa-read" style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Both</label><label style="display: flex; align-items: center; gap: 6px"><input type="radio" name="ml-sa-read" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Unread only</label><label style="display: flex; align-items: center; gap: 6px"><input type="radio" name="ml-sa-read" style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Read only</label></div>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Starred or important only</label>
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; white-space: nowrap"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Has attachment</label>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 8px 4px; border-top: 1px solid #e4e6ea; margin-top: 2px">
          <span style="font-size: 12px; font-weight: 600; color: #3d4047">Work package link</span>
          <div role="group" aria-label="Linked to a work package" style="display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); overflow: hidden">
            <button type="button" aria-pressed="true" style="height: 28px; padding: 0 12px; border: 0; background: #eaf0f7; color: #234a78; font: 600 13px 'Fira Sans', sans-serif">All</button>
            <button type="button" aria-pressed="false" style="height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; background: #ffffff; color: #3d4047; font: 600 13px 'Fira Sans', sans-serif">Linked</button>
            <button type="button" aria-pressed="false" style="height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; background: #ffffff; color: #3d4047; font: 600 13px 'Fira Sans', sans-serif">Not linked</button>
          </div>
          <span style="flex: 1 1 auto"></span>
          <button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Clear filters</button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Search</button>
        </div>
      </div>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="" folded="true" hint-size="64px,705px"></dc-import></div>
        <section aria-label="Search results" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
            <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Results</h2><span style="font-size: 13px; color: #5e6168; white-space: nowrap">1 conversation, all accounts</span></div>
          </div>
          <div style="flex: none; box-sizing: border-box; padding: 0 16px 10px; border-bottom: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 18px">Spam, Trash and Newsletters are left out.</div>
          <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <sc-for list="{{ rowsB }}" as="r" hint-placeholder-count="1">
              <li style="{{ r.style }}">
                <a href="MlThread.dc.html" aria-current="{{ r.current }}" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
                  <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
                  <span style="{{ r.avatar }}">{{ r.initials }}</span>
                  <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                    <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.sender }}">{{ r.from }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span><span style="flex: none; height: 18px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #5e6168; font-size: 11px; line-height: 18px; white-space: nowrap">{{ r.folder }}</span><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                    <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.subjectStyle }}">{{ r.subject }}</span></span>
                    <span style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span></span>
                  </span>
                </a>
              </li>
            </sc-for>
          </ol>
        </section>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; background: #f5f6f8; text-align: center">
          <span style="font-size: 13px; color: #5e6168; line-height: 19px">Select a conversation to read it here.</span>
        </main>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The search of the whole platform, narrowed to mail by date and person</figcaption>
    <div style="position: relative; height: 480px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(27,28,29,0.45)"></div>
      <div role="dialog" aria-modal="true" aria-label="Search everywhere, narrowed by date and person" style="position: relative; z-index: 2; width: 760px; margin-top: 28px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 12px 0 16px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
