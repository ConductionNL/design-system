<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":914}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (bg, fg) => 'display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; background: ' + bg + '; color: ' + fg;
    const S = { urgent: pill('#fcedec', '#a30000'), wait: pill('#fff4de', '#7a4f00'), care: pill('#e8e6f6', '#4a3f8f'), info: pill('#e8eefc', '#14338f') };
    const data = [
      ['YA', 'Yusuf Aydin', 'Economie en maatschappij', 'Afwezig zonder melding', 'urgent', '91%', '4 lesuren zonder melding', true, '6,1', 'Nog niet gekozen', false],
      ['LD', 'Lisa van Dijk', 'Natuur en gezondheid', '3 vakken onvoldoende', 'wait', '97%', '1 dag ziek', false, '5,4', 'di 13 okt, 16.10 uur', true],
      ['NB', 'Noor Bakker', 'Economie en maatschappij', 'Wiskunde A onvoldoende', 'wait', '98%', '1 dag ziek, 2 keer te laat', false, '6,7', 'di 13 okt, 16.30 uur', true],
      ['DV', 'Daan Visser', 'Cultuur en maatschappij', 'Vaak ziek', 'info', '89%', '6 dagen ziek, ook vandaag', false, '6,9', 'Nog niet gekozen', false],
      ['ES', 'Emma Smits', 'Natuur en gezondheid', 'Notitie van zorg', 'care', '99%', '', false, '7,4', 'do 15 okt, 18.50 uur', true],
      ['FA', 'Fatima El Amrani', 'Natuur en techniek', '', '', '99%', '', false, '7,9', 'Nog niet gekozen', false],
      ['SJ', 'Sem Jansen', 'Economie en maatschappij', '', '', '100%', '', false, '7,1', 'do 15 okt, 18.30 uur', true],
      ['JW', 'Jesse de Wit', 'Cultuur en maatschappij', '', '', '96%', '2 dagen ziek', false, '6,5', 'di 13 okt, 17.10 uur', true]
    ];
    const rows = data.map(([initials, name, profile, signal, kind, present, presentNote, bad, avg, talk, planned]) => ({
      initials, name, profile, signal, hasSignal: !!signal, noSignal: !signal, signalStyle: S[kind] || '', present, presentNote,
      presentNoteStyle: 'font-size: 13px; ' + (bad ? 'font-weight: 600; color: #a30000' : 'color: #5e6168'),
      avg, talk, talkStyle: planned ? 'color: #1b1c1d' : 'font-weight: 600; color: #7a4f00', selectLabel: 'Selecteer ' + name }));
    const view = (on) => 'display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; font: 600 14px \'Red Hat Text\', sans-serif; ' + (on ? 'border: 1px solid #1b1c1d; background: #1b1c1d; color: #ffffff;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d;');
    const cnt = (on) => 'padding: 1px 7px; border-radius: 10px; font-size: 12px; ' + (on ? 'background: #3d4047; color: #ffffff;' : 'background: #f0f1f3; color: #3d4047;');
    const views = [['Mentorklas H4b', 27, true], ['Al mijn klassen', 102, false], ['Met een signaal', 5, false], ['Afwezig vandaag', 3, false], ['Nog geen gesprek', 11, false]].map(([label, count, on]) => ({ label, count, pressed: on ? 'true' : 'false', style: view(on), countStyle: cnt(on) }));
    return { rows, views };
  }
}
</script>
