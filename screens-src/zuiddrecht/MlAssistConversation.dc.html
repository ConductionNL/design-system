<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: summary, suggested replies, translation and follow-up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1560px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The assistant in a conversation: generated summary and suggested replies, the Written with AI badge with its tooltip, the follow-up reminder in the list. The Mark as spam tooltip is drawn as hovered</figcaption>
    <div style="height: 1100px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" folded="true" hint-size="64px,1045px"></dc-import></div>

    <section aria-label="Inbox" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
        <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Inbox</h2><span style="font-size: 13px; color: #5e6168; white-space: nowrap">12 conversations</span></div>
        <div style="display: flex; gap: 2px; flex: none">
          <button type="button" aria-label="Fold conversation list" aria-expanded="true" title="Fold conversation list" style="width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
          <button type="button" aria-label="Select conversations" style="width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg></button>
          <button type="button" aria-label="Sort and view" aria-haspopup="menu" style="width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path></svg></button>
        </div>
      </div>
      <div role="group" aria-label="Filter" style="flex: none; display: flex; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid #e4e6ea">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{ c.on }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
      </div>
      <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <li style="height: 28px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e4e6ea; background: #f5f6f8; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Needs a follow-up</li>
        <li style="border-bottom: 1px solid #e4e6ea; background: #ffffff">
          <a href="#" aria-current="false" style="display: flex; align-items: flex-start; gap: 8px; height: 98px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
            <span style="flex: none; width: 8px; height: 80px; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: transparent"></span></span>
            <span style="flex: none; width: 32px; height: 32px; margin-top: 2px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: #234a78; color: #ffffff">OB</span>
            <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0">
              <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 400">To Marc Dubois</span><span style="flex: 1 1 auto"></span><span style="flex: none; font-size: 12px; color: #5e6168">7 Oct</span></span>
              <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 400; color: #1b1c1d">Keycloak realm: two open questions</span></span>
              <span style="display: flex; align-items: center; gap: 8px; height: 20px">
                <span style="display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #3d4047; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #ff9d2e"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2"></path></svg>No answer after 5 days</span>
              </span>
              <span style="display: flex; align-items: center; gap: 8px; height: 20px">
                <span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">Open to write a reminder</span>
                <span style="flex: 1 1 auto"></span>
                <button type="button" aria-label="Stop reminding me about this conversation" style="flex: none; height: 22px; padding: 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap">Stop reminding me</button>
              </span>
            </span>
          </a>
        </li>
        <li style="height: 28px; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #e4e6ea; background: #f5f6f8; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Today and earlier</li>
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
          <li style="{{ r.style }}">
            <a href="#" aria-current="{{ r.current }}" aria-label="{{ r.aria }}" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
              <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
              <span style="{{ r.avatar }}">{{ r.initials }}</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0">
                <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.sender }}">{{ r.from }}</span><sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.subjectStyle }}">{{ r.subject }}</span><sc-if value="{{ r.hasChip }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; line-height: 1; white-space: nowrap"><span style="{{ r.chipType }}">{{ r.wpType }}</span><span style="color: #3d4047">{{ r.wpNumber }}</span></span></sc-if></span>
                <span style="display: flex; align-items: center; gap: 6px; height: 20px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Generated summary" role="img" style="flex: none; color: #5e6168"><path d="{{ sparkle }}"></path></svg><span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.summary }}</span></span>
              </span>
            </a>
          </li>
        </sc-for>
      </ol>
    </section>

    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; align-items: flex-start; gap: 6px">
          <button type="button" aria-label="Star this conversation" aria-pressed="false" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
          <h1 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 18px; font-weight: 600; line-height: 28px">Angebot Schulung Projektleiter, 12 Personen</h1>
          <button type="button" aria-label="Close conversation" title="Close conversation" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <div role="toolbar" aria-label="Conversation actions" style="display: flex; gap: 2px">
            <sc-for list="{{ tools }}" as="t" hint-placeholder-count="7"><span style="position: relative; display: inline-flex"><button type="button" aria-label="{{ t.label }}" title="{{ t.label }}" style="{{ t.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><sc-if value="{{ t.hasText }}" hint-placeholder-val="{{ false }}"><span>{{ t.label }}</span></sc-if></button><sc-if value="{{ t.tip }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 50%; top: 32px; transform: translateX(-50%); padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 11">{{ t.label }}</span></sc-if></span></sc-for>
          </div>
          <div style="flex: none; display: flex; align-items: center; gap: 6px">
            <button type="button" aria-label="Expand all messages" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg>Expand all</button>
            <button type="button" aria-haspopup="menu" aria-keyshortcuts="L" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Link to work package</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
          <span style="white-space: nowrap">3 messages · Inbox</span>
        </div>
      </div>

      <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px">
        <section aria-label="Summary of this conversation, generated" style="display: flex; flex-direction: column; gap: 8px; padding: 10px 14px 12px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff">
          <div style="display: flex; align-items: center; gap: 8px">
            <span style="{{ genChip }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ sparkle }}"></path></svg>Generated</span>
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Summary of this conversation, generated</span>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ quiet }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>Regenerate</button>
            <button type="button" aria-label="Dismiss the summary" style="{{ quiet }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>Dismiss</button>
          </div>
          <p style="margin: 0; font-size: 13px; line-height: 19px; color: #3d4047">Jana Köhler asks for an offer for a two-day OpenProject training for 12 project leads in Kassel in November, on Gantt, resource planning and the Nextcloud link. You proposed 17 and 18 November on 5 October. She now asks for daily rates and travel costs; the board decides on 20 November.</p>
          <span style="font-size: 12px; color: #5e6168; line-height: 16px">Made from the 3 messages below, in English. It can be wrong; the messages stay as they are.</span>
        </section>

        <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="2">
          <button type="button" aria-expanded="false" aria-label="Show the whole message from {{ m.from }}, {{ m.date }}" title="Show the whole message" style="{{ m.style }}">
            <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
            <span style="{{ m.avatar }}">{{ m.initials }}</span>
            <span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span>
            <span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ m.snippet }}</span>
            <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.date }}</span>
          </button>
        </sc-for>

        <article aria-label="Message from Jana Köhler, 10 October" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
            <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">JK</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Jana Köhler</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">jana.koehler@stadtwerke-kassel.de</span><span style="position: relative; display: inline-flex"><span style="{{ genChip }}" tabindex="0" aria-describedby="ml-ai-badge-tip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ sparkle }}"></path></svg>Written with AI</span><span id="ml-ai-badge-tip" role="tooltip" style="position: absolute; left: 0; top: 26px; padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 11">The sender marked this message as written with AI</span></span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">10 Oct 09:12</span></div>
              <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
            </div>
            <button type="button" aria-label="More actions for this message" aria-haspopup="menu" style="flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
          </div>
          <div role="status" style="display: flex; align-items: center; gap: 10px; margin: 12px 14px 0 88px; padding: 6px 8px 6px 12px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; line-height: 19px; color: #1b1c1d">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
            <span style="flex: 1 1 auto">This message is in German.</span>
            <label for="ml-ai-lang" style="font-size: 12px; color: #5e6168; white-space: nowrap">Translate into</label>
            <button id="ml-ai-lang" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 30px; min-width: 110px; padding: 0 8px 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 13px 'Fira Sans', sans-serif; white-space: nowrap"><span>English</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Translate</button>
            <button type="button" aria-label="Do not offer a translation for this message" style="flex: none; width: 26px; height: 26px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div lang="de" style="padding: 12px 14px 0 88px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
            <p style="margin: 0">Guten Tag Frau Brandt,</p>
            <p style="margin: 0">vielen Dank für Ihren Terminvorschlag. Der 17. und 18. November passen uns gut, vor Ort in Kassel. Könnten Sie uns jetzt ein Angebot mit Tagessätzen und Reisekosten schicken? Der Vorstand entscheidet am 20. November über das Budget, deshalb bräuchten wir das Angebot bis Freitag.</p>
            <p style="margin: 0">Schwerpunkte bleiben Gantt, Ressourcenplanung und die Anbindung an Nextcloud. Zwei Kolleginnen aus dem Netzausbau kommen dazu, es sind also 12 Personen.</p>
            <p style="margin: 0">Mit freundlichen Grüßen<br>Jana Köhler</p>
