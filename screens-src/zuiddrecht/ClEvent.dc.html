<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: event with mail origin and linked work package</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 5916px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The event opened from the week: the navigation folded to its rail, the grid, and the event panel as the one panel on the right, with the linked work package as a chip</figcaption>
    <div style="position: relative; height: 1013px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 100%; overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" folded="true" hint-size="64px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
              <span style="flex: none; color: #3d4047">{{ b.number }}</span>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: flex-start; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
      </div>
    </main>
    <aside aria-label="Event" style="flex: 0 0 400px; width: 400px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 16px">
        <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5e6168"><span style="flex: none; width: 10px; height: 10px; border-radius: 3px; background: #ff9d2e"></span>Customers</span>
        <div style="display: flex; gap: 2px">
          <button type="button" aria-label="Edit this event" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></button>
          <a href="ClWeek.dc.html" aria-label="Close the event" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 16px 16px">
        <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Rollout review Lyon, phase 2</h2>
        <div style="display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 20px">
          <span>Thursday 15 October 2026</span>
          <span style="color: #5e6168">14:00 to 15:00, 1 h</span>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><a href="#" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg>Join</a><span style="color: #5e6168">Video call</span></div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">People</span>
          <sc-for list="{{ attendees }}" as="a" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 10px; height: 36px; font-size: 14px; line-height: 20px"><span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">{{ a.initials }}</span><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ a.name }}</span><span style="{{ a.dot }}"></span><span style="flex: none; font-size: 13px; color: #5e6168">{{ a.answer }}</span></span></sc-for>
        </div>
        <a href="MlThread.dc.html" style="display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--sc-link, #3669a5); text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>From the mail of Tom Achterberg, 9 Oct</a>
        <div style="display: flex; gap: 8px; flex-wrap: wrap">
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Accept</button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Maybe</button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Decline</button>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; margin: 0 16px; padding: 14px 0 16px; border-top: 1px solid #e4e6ea">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Linked work package</span>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
          <span style="white-space: nowrap">1 work package</span>
          <button type="button" aria-expanded="false" aria-label="Open work package FEATURE #58412, in development" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 8px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 12px 'Fira Sans', sans-serif; line-height: 1; white-space: nowrap; color: #3d4047; cursor: pointer"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
        </div>
        <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; margin-left: -8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2"></path></svg>Log time on this work package, 1 h</button>
      </div>
    </aside>
  </div>
</div>
    </div>
  </figure>

    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The chip clicked: the work package panel takes the place of the event panel, Back to the event at its top; the grid keeps its width</figcaption>

          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>

    return { hours, days, bars, nowTop, nowLabelTop, attendees, tools, variants, todayRows, todayRowsPlain, mailRows, taskRows, rowMenu };
