<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Open Register: persoonlijke instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="OrDashboard" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Open Register" version="2.1.35" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Open Register's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen under Geavanceerd.
    // Replaces OrPersonal in /settings/user/notifications (PersonalRoot.vue: browser notifications, credentials,
    // connected accounts) and the Open Register section drawn on OrMijnAccount (decision 11 Oct 2026). Profile and
    // password are Nextcloud's own account settings, so they are not in here.
    const sections = [
      { name: 'Meldingen', desc: 'Kies per gebeurtenis waar je hem krijgt.', rows: [
        { matrix: 'Gebeurtenis', cols: ['In Nextcloud', 'Per e-mail'], lines: [
          ['Een record dat ik volg is gewijzigd', [true, false]],
          ['Iemand noemt mij in een notitie', [true, true]],
          ['Een record van mij heeft een nieuwe eigenaar', [true, false]],
          ['Records wachten op mijn archiveringsbesluit', [true, true]]
        ] },
        { switch: 'Browsermeldingen', hint: 'Ook een melding als Nextcloud in een ander tabblad openstaat.', on: true },
        { select: 'Taal van e-mails', value: 'Nederlands' }
      ] },
      { name: 'Persoonlijke API-tokens', desc: 'Voor scripts en koppelingen die namens jou werken. Een token zie je één keer.', rows: [
        { items: [['Excel-koppeling', 'Mag Meldingen lezen · verloopt 31 december 2026', 'Intrekken'], ['Script import', 'Mag Meldingen schrijven · verloopt 15 oktober 2026', 'Intrekken']] },
        { buttons: [['Nieuw token', '']] }
      ] },
      { name: 'Gekoppelde accounts', desc: 'Accounts bij andere diensten waarmee Open Register namens jou werkt.', rows: [
        { items: [['Microsoft 365', 's.visser@zuiddrecht.nl · gekoppeld 3 oktober', 'Ontkoppelen', 'Verbonden']] },
        { pair: [{ label: 'Dienst', value: 'Kies een dienst', select: true }, { label: 'Serveradres', value: 'https://' }] },
        { buttons: [['Account koppelen', '']] }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen wachtwoorden en sleutels voor bronnen. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['GitHub, persoonlijk token', 'Registers uit GitHub importeren · toegevoegd 18 september', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] },
      { name: 'Mijn gegevens', desc: 'Download alles wat Open Register over jou bewaart, als JSON-bestand.', rows: [
        { buttons: [['Gegevens exporteren', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
