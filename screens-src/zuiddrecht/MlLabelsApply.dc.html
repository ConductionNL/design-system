<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: label menu, drag onto a label or folder, and undo</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1880px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Add a label: the menu stays open while you tick labels on and off; a toast confirms each one with Undo. The toolbar shows the Mark as spam tooltip as hovered</figcaption>
    <div style="position: relative; height: 740px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" folded="true" hint-size="64px,685px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="2" hint-size="410px,685px"></dc-import></div>
        <main style="position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; align-items: flex-start; gap: 6px">
              <button type="button" aria-label="Star this conversation" aria-pressed="false" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true" style="width: 20px; height: 20px"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
              <h2 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 20px; font-weight: 700; line-height: 34px">Rollout plan phase 2, Lyon</h2>
              <button type="button" aria-label="Close conversation" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <div role="toolbar" aria-label="Conversation actions" style="display: flex; gap: 2px">
                <sc-for list="{{ tools }}" as="t" hint-placeholder-count="7"><span style="position: relative; display: inline-flex"><button type="button" aria-label="{{ t.label }}" title="{{ t.label }}" aria-expanded="{{ t.expanded }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><sc-if value="{{ t.hasText }}" hint-placeholder-val="{{ false }}"><span>{{ t.label }}</span></sc-if></button><sc-if value="{{ t.tip }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 50%; top: 38px; transform: translateX(-50%); padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 11">{{ t.label }}</span></sc-if></span></sc-for>
              </div>
              <div style="flex: none; display: flex; align-items: center; gap: 6px">
                <button type="button" aria-label="Expand all messages" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg>Expand all</button>
                <button type="button" aria-haspopup="menu" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Link another</button>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
              <span style="white-space: nowrap">1 work package</span>
              <button type="button" aria-expanded="false" aria-label="Open work package FEATURE #58412, in development" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 12px 'Fira Sans', sans-serif; line-height: 1; white-space: nowrap; color: #3d4047; cursor: pointer"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
              <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047; white-space: nowrap"><span style="width: 10px; height: 10px; border-radius: 5px; background: #ff9d2e"></span>Waiting for customer</span>
              <span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047; white-space: nowrap"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5e6168"></span>Internal</span>
              <span style="white-space: nowrap">6 messages · Customers / Lyon</span>
            </div>
          </div>
          <div role="menu" aria-label="Add a label" style="position: absolute; left: 272px; top: 94px; margin-top: 4px; width: 340px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column">
            <div style="position: relative; display: flex; align-items: center; margin: 2px 2px 8px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
              <input type="text" value="" placeholder="Find or create a label" aria-label="Find or create a label" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #3669a5; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: 0; box-shadow: 0 0 0 2px #eaf0f7">
            </div>
            <div style="padding: 2px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Labels</div>
            <sc-for list="{{ labels }}" as="l" hint-placeholder-count="5">
              <button type="button" role="menuitemcheckbox" aria-checked="{{ l.checked }}" style="{{ l.style }}">
                <span aria-hidden="true" style="{{ l.box }}"><sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
                <span style="{{ l.swatch }}"></span>
                <span style="flex: 1 1 auto; text-align: left"><sc-if value="{{ l.hasParent }}" hint-placeholder-val="{{ false }}"><span style="color: #5e6168">{{ l.parent }} / </span></sc-if>{{ l.label }}</span>
                <span style="flex: none; font-size: 12px; color: #5e6168">{{ l.hint }}</span>
              </button>
            </sc-for>
            <div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div>
            <div style="padding: 2px 10px 2px; font-size: 13px; color: #5e6168; line-height: 18px">Tick a label to put it on this conversation, untick to take it off. Type a name to find one or create it.</div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px">
            <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="4">
              <button type="button" aria-expanded="false" aria-label="Show the whole message from {{ m.from }}, {{ m.date }}" style="{{ m.style }}">
                <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
                <span style="{{ m.avatar }}">{{ m.initials }}</span>
                <span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span>
                <span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ m.snippet }}</span>
                <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.date }}</span>
              </button>
            </sc-for>
            <article aria-label="Message from Marc Dubois, today 06:00" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
                <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">MD</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                  <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Marc Dubois</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">marc.dubois@mairie-lyon.fr</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 06:00</span></div>
                  <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
                </div>
              </div>
              <div style="padding: 12px 14px 14px 88px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
                <p style="margin: 0">Hi Olivia,</p>
                <p style="margin: 0">Good. Then we are go for 2 November. One more request from the department head: can the kick-off move to the afternoon?</p>
                <p style="margin: 0">Best regards,<br>Marc</p>
              </div>
            </article>
          </div>
          <div role="status" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 12; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 14px; box-sizing: border-box; background: #1b1c1d; color: #ffffff; border-radius: var(--sc-radius, 8px); box-shadow: 0 4px 12px rgba(27,28,29,0.24); font-size: 13px; white-space: nowrap">
            <span style="display: inline-flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #5e6168"></span>Internal added to this conversation</span>
            <button type="button" aria-label="Undo: take Internal off again" style="height: 32px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: rgba(255,255,255,0.12); color: #ffffff; font: 600 13px 'Fira Sans', sans-serif">Undo</button>
            <button type="button" aria-label="Dismiss" style="width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
        </main>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Two selected conversations dragged over the folder column: labels, Inbox, Archive, Spam and Trash light up as drop targets; the toast of an earlier drop (the Hetzner invoice) still offers Undo</figcaption>
    <div style="position: relative; height: 640px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0; position: relative">
        <nav aria-label="Mailboxes, drop targets lit" style="flex: 0 0 264px; width: 264px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 6px">
            <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>New message</button>
            <button type="button" aria-label="Fold folders" aria-expanded="true" style="flex: none; width: 42px; height: 42px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
          </div>
          <sc-for list="{{ navGroups }}" as="g" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 6px 10px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span></div>
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="6">
                <div aria-label="{{ it.aria }}" style="{{ it.style }}">
                  <sc-if value="{{ it.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg></sc-if>
                  <sc-if value="{{ it.hasSwatch }}" hint-placeholder-val="{{ false }}"><span style="{{ it.swatch }}"></span></sc-if>
                  <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.label }}</span>
                  <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ it.countStyle }}">{{ it.count }}</span></sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </nav>
        <section aria-label="Inbox, 2 selected" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
            <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Inbox</h2><span style="font-size: 13px; color: #5e6168; white-space: nowrap">2 of 12 selected</span></div>
            <button type="button" style="height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Clear selection</button>
          </div>
          <div style="flex: none; box-sizing: border-box; padding: 0 16px 10px; border-bottom: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 18px">Drag the selection onto a folder or a label on the left.</div>
          <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
              <li style="{{ r.style }}">
                <div style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d">
                  <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
                  <span style="{{ r.avatar }}"><sc-if value="{{ r.on }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if><sc-if value="{{ r.off }}" hint-placeholder-val="{{ true }}">{{ r.initials }}</sc-if></span>
                  <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                    <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.sender }}">{{ r.from }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                    <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.subjectStyle }}">{{ r.subject }}</span></span>
                    <span style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span></span>
                  </span>
                </div>
              </li>
            </sc-for>
          </ol>
        </section>
        <main style="position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; background: #f5f6f8; text-align: center">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#c4c7cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>
          <span style="font-size: 13px; color: #5e6168; line-height: 19px">2 conversations selected. Drop them on a folder to move them, on a label to label them.</span>
        <div role="status" style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 12; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 14px; box-sizing: border-box; background: #1b1c1d; color: #ffffff; border-radius: var(--sc-radius, 8px); box-shadow: 0 4px 12px rgba(27,28,29,0.24); font-size: 13px; white-space: nowrap">
          <span>Invoice 2026-10-0193 moved to Archive</span>
          <button type="button" aria-label="Undo: bring Invoice 2026-10-0193 back from Archive" style="height: 32px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: rgba(255,255,255,0.12); color: #ffffff; font: 600 13px 'Fira Sans', sans-serif">Undo</button>
