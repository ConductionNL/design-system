<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: week with meetings and work package dates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 1000px; overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="245px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
        <button type="button" style="flex: none; height: 30px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
        <div style="display: flex; gap: 2px; flex: none">
          <button type="button" aria-label="Previous week" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
        <h1 style="margin: 0 0 0 6px; font-size: 20px; font-weight: 600; line-height: 1.2; white-space: nowrap">12 to 18 October 2026</h1>
        <span style="font-size: 13px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div role="group" aria-label="View" style="display: flex; gap: 6px; flex: none">
          <sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><a href="{{ v.href }}" aria-current="{{ v.current }}" style="{{ v.style }}">{{ v.label }}</a></sc-for>
        </div>
        <button type="button" aria-haspopup="menu" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; margin-left: 8px; padding: 0 8px 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>All projects<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
      <div style="flex: none; display: flex; height: 44px; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 56px"></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span style="font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5e6168">{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-bottom: 1px solid #e4e6ea; background: #ffffff">
        <div style="flex: none; width: 56px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 11px; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 78px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
              <span style="flex: none; color: #3d4047">{{ b.number }}</span>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
            </a>
          </sc-for>
          <div style="position: absolute; top: 6px; left: calc(100% * 3 / 7 + 10px); height: 20px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5e6168; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M3 12h18"></path></svg>Drag an end to change the dates in OpenProject</div>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.labelStyle }}">{{ h.label }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 56px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #234a78"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #234a78"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 18px; margin-top: 2px; padding: 0 6px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span><span style="{{ e.chipDot }}"></span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: 83px; height: 2px; background: #3669a5; z-index: 2"><span style="position: absolute; left: -4px; top: -3px; width: 8px; height: 8px; border-radius: 4px; background: #3669a5"></span></div></sc-if>
            </div>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 74; // one hour in px, 08:00 to 18:00
    const OFF = 10; // top offset so the 08:00 label is not clipped
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'] };
    const viewBase = 'display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; ';
    const views = [['Day', '#'], ['Week', 'ClWeek.dc.html'], ['Month', 'ClMonth.dc.html']].map(([label, href]) => ({
      label, href, current: label === 'Week' ? 'page' : 'false',
      style: viewBase + (label === 'Week' ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #3d4047;')
    }));
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      hours.push({
        label: String(8 + i).padStart(2, '0') + ':00',
        lineStyle: 'position: absolute; left: 56px; right: 0; top: ' + (i * H + OFF) + 'px; border-top: 1px solid #e4e6ea',
        labelStyle: 'position: absolute; left: 0; width: 48px; top: ' + (i * H + OFF - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right'
      });
    }
    // meeting block: [title, start, duration in hours, options {chip:[type, number, status], video, flag, selected}]
    const ev = (title, start, dur, o = {}) => {
      const short = dur <= 0.5;
      const st = o.chip ? STATUS[o.chip[2]] : null;
      const end = start + dur;
      const fmt = (t) => String(Math.floor(t)).padStart(2, '0') + ':' + String(Math.round((t % 1) * 60)).padStart(2, '0');
      return {
        title, href: o.selected ? 'ClEvent.dc.html' : (o.chip && o.chip[1] === '#58412' ? 'ClEvent.dc.html' : '#'),
        aria: title + ', ' + fmt(start) + ' to ' + fmt(end), current: o.selected ? 'true' : 'false',
        titleStyle: 'flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; ' + (short ? 'white-space: nowrap; text-overflow: ellipsis;' : 'display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;'),
        time: short ? fmt(start) : fmt(start) + ' to ' + fmt(end), inlineTime: short, blockTime: !short,
        flag: !!o.flag, video: !!o.video,
        hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '',
        chipDot: 'flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; ' + (st ? 'background: ' + st[0] + '; border: 1.5px solid ' + st[1] : ''),
        style: 'position: absolute; left: 3px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; justify-content: ' + (short ? 'center' : 'flex-start') + '; padding: ' + (short ? '0 6px' : '4px 8px') + '; border-radius: var(--sc-radius, 8px); background: #eaf0f7; border-left: 3px solid #3669a5; overflow: hidden; font-size: 12px; line-height: 16px; color: #1b1c1d; text-decoration: none; z-index: 1; ' + (o.selected ? 'box-shadow: 0 0 0 2px #3669a5;' : '')
      };
    };
    const standup = ev('Stand-up', 10, 0.25);
    const perDay = [
      [standup],
      [standup, ev('Demo preparation Malmo Energi', 11, 1)],
      [standup, ev('Release 16.5 scope review', 9.5, 1.5, { chip: ['EPIC', '#57990', 'in review'] })],
      [standup, ev('Rollout review Lyon, phase 2', 14, 1, { chip: ['FEATURE', '#58412', 'in development'], video: true, selected: false })],
      [standup, ev('Submit October hours', 17, 0.5, { flag: true })],
      [], []
    ];
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = i === 0;
      const weekend = i >= 5;
      return {
        name, n: 12 + i, today, events: perDay[i],
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 6px; border-left: 1px solid #e4e6ea; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: 'display: inline-flex; align-items: center; justify-content: center; min-width: 26px; height: 26px; padding: 0 4px; box-sizing: border-box; border-radius: 13px; font-size: 15px; font-weight: 600; ' + (today ? 'background: #3669a5; color: #ffffff;' : 'color: #1b1c1d;'),
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #e4e6ea; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    // all-day bars: [type, number, subject, lane, startCol, endCol (inclusive), leftOpen, rightOpen, handles]
    const bars = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns', 0, 0, 2, false, false, true],
      ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout, 5 to 30 Oct', 1, 0, 6, true, true, false],
      ['EPIC', '#57990', 'Release 16.5 scope, 28 Sep to 23 Oct', 2, 0, 6, true, true, false]
    ].map(([type, number, subject, lane, s, e, leftOpen, rightOpen, handles]) => {
      const c = TYPE[type];
      const left = leftOpen ? '-8px' : 'calc(100% * ' + s + ' / 7 + 3px)';
      const width = 'calc(100% * ' + (e - s + 1) + ' / 7' + (leftOpen ? ' + 8px' : ' - 3px') + (rightOpen ? ' + 8px' : ' - 4px') + ')';
      return {
        type, number, subject, color: c, leftOpen, rightOpen, handles,
        aria: type + ' ' + number + ', ' + subject,
        style: 'position: absolute; top: ' + (6 + lane * 24) + 'px; left: ' + left + '; width: ' + width + '; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border: 1px solid ' + c + '; border-radius: var(--sc-radius, 8px); background: color-mix(in srgb, ' + c + ' 14%, #ffffff); font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden'
      };
    });
    return { views, hours, days, bars };
  }
}
</script>
</body>
</html>
