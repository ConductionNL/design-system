<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: several conversations selected with the bulk bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1960px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Five conversations selected, a range among them, the selection being dragged onto the folder Lyon; the bulk bar with its labelled actions, More, and the Keyboard shortcuts link</figcaption>
    <div style="height: 880px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <div style="position: relative; display: flex; flex: 1 1 auto; min-height: 0">
        <nav aria-label="Mailboxes" style="flex: 0 0 264px; width: 264px; box-sizing: border-box; min-height: 100%; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; background: #ffffff; border-right: 1px solid #e4e6ea">
          <div style="display: flex; align-items: center; gap: 6px">
            <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>New message</button>
            <button type="button" aria-label="Fold folders" aria-expanded="true" title="Fold folders" style="flex: none; width: 42px; height: 42px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
          </div>
          <button type="button" aria-haspopup="menu" aria-label="Account: Olivia Brandt, olivia@northwind-projects.test" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; color: #1b1c1d; text-align: left; font-family: 'Fira Sans', system-ui, sans-serif">
            <span style="width: 28px; height: 28px; border-radius: var(--sc-radius, 8px); background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">OB</span>
            <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Olivia Brandt</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">olivia@northwind-projects.test</span></span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 6px 10px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span></div>
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
                <a href="#" aria-current="{{ it.current }}" style="{{ it.style }}">
                  <sc-if value="{{ it.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg></sc-if>
                  <sc-if value="{{ it.hasSwatch }}" hint-placeholder-val="{{ false }}"><span style="{{ it.swatch }}"></span></sc-if>
                  <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.label }}</span>
                  <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ it.countStyle }}">{{ it.count }}</span></sc-if>
                  <sc-if value="{{ it.hasChevron }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></sc-if>
                </a>
              </sc-for>
            </div>
          </sc-for>
          <div style="margin-top: auto; padding: 0 10px; font-size: 12px; color: #5e6168; line-height: 1.4">2.1 GB of 10 GB used</div>
        </nav>

        <section aria-label="Inbox, 5 conversations selected" style="flex: 1 1 0; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
          <div role="toolbar" aria-label="Actions for the selected conversations" style="flex: none; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 12px 0 22px; box-sizing: border-box; background: #eaf0f7; border-bottom: 1px solid #e4e6ea">
            <button type="button" role="checkbox" aria-checked="mixed" aria-label="Select all conversations" title="Select all conversations" style="flex: none; width: 18px; height: 18px; margin-right: 8px; padding: 0; box-sizing: border-box; border: 1px solid #3669a5; border-radius: 3px; background: #3669a5; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <strong style="flex: none; font-size: 14px; font-weight: 600; margin-right: 10px; white-space: nowrap">5 selected</strong>
            <sc-for list="{{ bulkText }}" as="b" hint-placeholder-count="6"><button type="button" aria-label="{{ b.aria }}" aria-haspopup="{{ b.popup }}" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ b.icon }}"></path></svg>{{ b.label }}<sc-if value="{{ b.hasChevron }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></sc-if></button></sc-for>
            <span style="position: relative; display: inline-flex"><button type="button" aria-haspopup="menu" aria-expanded="false" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></span>
            <span style="flex: 1 1 auto"></span>
            <span style="position: relative; display: inline-flex"><button type="button" aria-haspopup="dialog" aria-expanded="false" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap; text-decoration: underline">Keyboard shortcuts</button></span>
            <span style="position: relative; display: inline-flex"><button type="button" aria-label="Clear the selection" title="Clear the selection" style="flex: none; width: 32px; height: 32px; margin-left: 4px; border: 0; border-radius: var(--sc-radius, 8px); background: #d9dee8; color: #1b1c1d; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button><span role="tooltip" style="position: absolute; right: 0; top: 36px; padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 5">Clear the selection</span></span>
          </div>
          <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
              <li style="{{ r.style }}">
                <div style="display: flex; align-items: center; gap: 12px; height: 48px; box-sizing: border-box; padding: 0 24px 0 22px; color: #1b1c1d">
                  <span role="checkbox" aria-checked="{{ r.checked }}" aria-label="Select {{ r.from }}: {{ r.subject }}" style="{{ r.box }}"><sc-if value="{{ r.on }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
                  <span style="flex: none; width: 8px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
                  <span style="{{ r.avatar }}">{{ r.initials }}</span>
                  <span style="flex: 0 0 220px; min-width: 0; display: flex; align-items: center; gap: 6px">
                    <span style="{{ r.sender }}">{{ r.from }}</span>
                    <sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if>
                  </span>
                  <span style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 10px">
                    <span style="{{ r.subjectWide }}">{{ r.subject }}</span>
                    <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span>
                  </span>
                  <span style="flex: none; width: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; color: #5e6168; font-size: 12px"><sc-if value="{{ r.hasAttach }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Has attachments"><path d="{{ r.attachIcon }}"></path></svg>{{ r.attachCount }}</sc-if></span>
                  <span style="flex: none; width: 16px; display: inline-flex; align-items: center; justify-content: center"><sc-if value="{{ r.starred }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ff9d2e" stroke="#ff9d2e" stroke-width="1.75" stroke-linejoin="round" aria-label="Starred" role="img" style="flex: none"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></sc-if></span>
                  <span style="flex: none; width: 214px; display: flex; justify-content: flex-end">
                    <sc-if value="{{ r.hasWp }}" hint-placeholder-val="{{ true }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; line-height: 1; white-space: nowrap"><span style="{{ r.chipType }}">{{ r.wpType }}</span><span style="color: #3d4047">{{ r.wpNumber }}</span><span style="{{ r.chipDot }}"></span><span style="color: #3d4047">{{ r.wpStatus }}</span></span></sc-if>
                  </span>
                  <span style="flex: none; width: 72px; text-align: right; {{ r.dateStyle }}">{{ r.date }}</span>
                </div>
              </li>
            </sc-for>
          </ol>
        </section>

        <div aria-hidden="true" style="position: absolute; left: 132px; top: 572px; width: 300px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; background: #ffffff; border: 1px solid #3669a5; border-radius: var(--sc-radius, 8px); box-shadow: 0 8px 20px rgba(27,28,29,0.22); transform: rotate(-2deg); z-index: 12">
          <span style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">JK</span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 16px"><strong style="font-size: 13px; font-weight: 600">5 conversations</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gantt export cuts off the last week, and 4 more</span></span>
        </div>
        <div role="status" style="position: absolute; left: 142px; top: 624px; display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; background: #1b1c1d; color: #ffffff; border-radius: var(--sc-radius, 8px); font-size: 12px; font-weight: 600; white-space: nowrap; z-index: 12"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 10 5 5-5 5M4 4v7a4 4 0 0 0 4 4h12"></path></svg>Drop to move 5 conversations to Lyon</div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; width: 620px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The drafts folder with two drafts selected</figcaption>
    <div style="height: 320px; box-sizing: border-box; display: flex; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <section aria-label="Drafts, 2 selected" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; border-right: 1px solid #e4e6ea; overflow: hidden">
        <div role="toolbar" aria-label="Actions for the selected drafts" style="flex: none; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; min-height: 52px; padding: 10px 8px 8px 14px; box-sizing: border-box; background: #eaf0f7; border-bottom: 1px solid #e4e6ea">
          <button type="button" role="checkbox" aria-checked="mixed" aria-label="Select all drafts" style="flex: none; width: 18px; height: 18px; margin-right: 8px; padding: 0; box-sizing: border-box; border: 1px solid #3669a5; border-radius: 3px; background: #3669a5; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <strong style="flex: none; font-size: 14px; font-weight: 600; white-space: nowrap">2 selected</strong>
          <span style="flex: 1 1 auto"></span>
          <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Delete 2 drafts</button>
          <button type="button" aria-label="Clear the selection" title="Clear the selection" style="flex: none; width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          <span style="flex: 0 0 100%; text-align: right; padding-right: 40px; box-sizing: border-box; font-size: 12px; line-height: 16px; color: #5e6168">Deleting a draft cannot be undone.</span>
        </div>
        <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{ drafts }}" as="d" hint-placeholder-count="3">
            <li style="{{ d.style }}">
              <div style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 14px; color: #1b1c1d">
                <span role="checkbox" aria-checked="{{ d.checked }}" aria-label="Select draft: {{ d.subject }}" style="margin-top: 7px; {{ d.box }}"><sc-if value="{{ d.on }}" hint-placeholder-val="{{ true }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
                <span style="flex: none; width: 32px; height: 32px; margin-top: 2px; border-radius: 16px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">OB</span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px">To {{ d.to }}</span><span style="flex: 1 1 auto"></span><span style="flex: none; font-size: 12px; color: #5e6168">{{ d.date }}</span></span>
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: #1b1c1d">{{ d.subject }}</span></span>
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; font-weight: 600; line-height: 1; color: #3d4047; white-space: nowrap">Draft</span><span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ d.snippet }}</span></span>
                </span>
              </div>
            </li>
          </sc-for>
        </ol>
      </section>
      <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #f5f6f8; text-align: center">
        <span style="font-size: 13px; color: #5e6168; line-height: 19px">Select a draft to open it here.</span>
      </main>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The More menu of the bulk bar open: star, important, unread, spam and not spam for the 5 selected</figcaption>
    <div style="height: 300px; box-sizing: border-box; display: flex; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <section aria-label="Inbox, 5 conversations selected" style="flex: 1 1 0; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; position: relative">
          <div role="toolbar" aria-label="Actions for the selected conversations" style="flex: none; display: flex; align-items: center; gap: 4px; height: 52px; padding: 0 12px 0 22px; box-sizing: border-box; background: #eaf0f7; border-bottom: 1px solid #e4e6ea">
            <button type="button" role="checkbox" aria-checked="mixed" aria-label="Select all conversations" title="Select all conversations" style="flex: none; width: 18px; height: 18px; margin-right: 8px; padding: 0; box-sizing: border-box; border: 1px solid #3669a5; border-radius: 3px; background: #3669a5; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>

    const boxOff = 'flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 3px; border: 1px solid #c4c7cb; background: #ffffff; display: inline-flex';
    const rows = data.map(([from, initials, subject, count, date, snippet, o], i) => {
      const n = i + 1;
      const on = selected.includes(n);
      const unread = !!o.unread;
      const st = o.wp ? STATUS[o.wp[2]] : null;
      const focus = n === 6;
      return {
        from, initials, subject, date, snippet, count: count > 1 ? count : '', hasCount: count > 1,
        on, checked: on ? 'true' : 'false', box: on ? boxOn : boxOff,
        style: 'border-bottom: 1px solid #e4e6ea; ' + (on ? 'background: #eaf0f7; box-shadow: inset 3px 0 0 #3669a5' + (focus ? ', inset 0 0 0 2px #3669a5' : '') + ';' : 'background: #ffffff;'),
        dot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + (unread ? '#3669a5' : 'transparent'),
        avatar: 'flex: none; width: 32px; height: 32px; border-radius: ' + (o.op ? 'var(--sc-radius, 8px)' : '16px') + '; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; ' + (o.op ? 'background: #1b1c1d; color: #ffffff' : 'background: #eaf0f7; color: #234a78'),
        sender: 'min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; ' + (unread ? 'font-weight: 700' : 'font-weight: 400'),
        dateStyle: 'flex: none; font-size: 12px; ' + (unread ? 'color: #1b1c1d; font-weight: 600' : 'color: #5e6168'),
        subjectWide: 'flex: 0 0 auto; min-width: 0; max-width: 50%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: #1b1c1d; ' + (unread ? 'font-weight: 600' : 'font-weight: 400'),
        hasAttach: !!o.attach, attachIcon: o.attach ? ICON[o.attach[0]] : '', attachCount: o.attach ? o.attach[1] : '',
        starred: !!o.starred, hasWp: !!o.wp,
        wpType: o.wp ? o.wp[0] : '', wpNumber: o.wp ? o.wp[1] : '', wpStatus: o.wp ? o.wp[2] : '',
        chipType: 'font-weight: 700; letter-spacing: 0.04em; color: ' + (o.wp ? TYPE[o.wp[0]] : '#3d4047'),
        chipDot: 'flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; ' + (st ? 'background: ' + st[0] + '; border: 1.5px solid ' + st[1] : '')
      };
    });
    const kbd = 'display: inline-flex; align-items: center; height: 20px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px \'Fira Sans\', sans-serif; color: #3d4047';
    const drafts = [
      ['Marc Dubois', 'Re: Rollout plan phase 2, Lyon', 'Today 07:10', 'The afternoon works for us. I will send a new invitation for the kick-off.', true],
      ['Sven Lindqvist', 'Re: Request for a demo, 1,200 users', 'Today 06:52', 'Thank you for your interest. We can show the Nextcloud link in a 45 minute session next week.', true],
      ['Jana Köhler', 'Re: Angebot Schulung Projektleiter', '10 Oct', 'Sehr geehrte Frau Köhler, gerne schicke ich Ihnen', false]
    ].map(([to, subject, date, snippet, on]) => ({ to, subject, date, snippet, on, checked: on ? 'true' : 'false', box: on ? boxOn : boxOff, style: 'border-bottom: 1px solid #e4e6ea; ' + (on ? 'background: #eaf0f7; box-shadow: inset 3px 0 0 #3669a5;' : 'background: #ffffff;') }));
    const rowsShort = rows.slice(0, 5);
    return { groups, bulkText, moreItems, rows, rowsShort, kbd, drafts };
  }
}
