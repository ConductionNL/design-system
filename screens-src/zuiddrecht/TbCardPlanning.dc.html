<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: dates, repetition and reminders of a work package</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#tb-filter::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1660px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The dialog opened from the due date of FEATURE #58412: start and due with a time of day, a repetition every 2 weeks on Monday, and three reminders</figcaption>
    <div style="position: relative; height: 1100px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" folded="true" hint-size="64px,945px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; gap: 16px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="flex: 0 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 8px"><h1 style="margin: 0; min-width: 0; font-size: 20px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1></div>
            <div role="group" aria-label="Group by" style="flex: none; display: flex; align-items: center; gap: 6px">
              <sc-for list="{{ groupBy }}" as="c" hint-placeholder-count="3"><button type="button" aria-pressed="{{ c.on }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
            </div>
            <div style="flex: 1 1 auto"></div>
            <div style="flex: none; position: relative; display: flex; align-items: center; width: 150px">
              <label for="tb-filter" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter cards</label>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 10px; top: 9px; color: #5e6168"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>
              <input id="tb-filter" type="search" placeholder="Filter" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 10px 0 32px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d">
            </div>
            <div role="group" aria-label="Team" style="display: flex; align-items: center">
              <sc-for list="{{ team }}" as="t" hint-placeholder-count="4"><span title="{{ t.name }}" aria-label="{{ t.name }}" role="img" style="{{ t.style }}">{{ t.initials }}</span></sc-for>
            </div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; gap: 10px; padding: 12px; overflow: hidden">
            <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
              <section aria-label="{{ col.name }}" style="flex: 0 0 226px; width: 226px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; align-self: flex-start; max-height: 100%">
                <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px">
                  <span style="{{ col.dot }}"></span>
                  <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.name }}</h2>
                  <span aria-label="{{ col.countLabel }}" style="{{ col.countStyle }}">{{ col.count }}</span>
                </div>
                <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
                  <a href="{{ c.href }}" aria-label="{{ c.aria }}" aria-current="{{ c.current }}" style="{{ c.style }}">
                    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="{{ c.typeStyle }}">{{ c.type }}</span><span style="color: #3d4047">{{ c.number }}</span></span>
                    <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">{{ c.subject }}</span>
                    <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
                      <sc-if value="{{ c.hasAssignee }}" hint-placeholder-val="{{ true }}"><span title="{{ c.assignee }}" role="img" aria-label="Assignee {{ c.assignee }}" style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ c.initials }}</span></sc-if>
                      <sc-if value="{{ c.hasDue }}" hint-placeholder-val="{{ true }}"><span style="{{ c.dueStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{ c.due }}</span></sc-if>
                    </span>
                  </a>
                </sc-for>
              </section>
            </sc-for>
          </div>
        </main>
        <aside aria-label="Work package FEATURE #58412" style="flex: 0 0 480px; width: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 16px; border-bottom: 1px solid #e4e6ea">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Work package</span>
            <div style="display: flex; gap: 2px">
              <button type="button" aria-label="Open in full width" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></button>
              <button type="button" aria-label="Close the work package panel" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 14px">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-weight: 600">#58412</a><span style="flex: 1 1 auto"></span><span style="font-size: 12px; color: #5e6168">Northwind rollout Lyon</span></div>
            <h2 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 22px">Link Nextcloud project folders on rollout</h2>
            <div style="display: flex; align-items: center; gap: 8px">
              <button type="button" aria-label="Status: in development, change" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 8px; border: 1px solid #21c8de; border-radius: var(--sc-radius, 8px); background: #66d9e8; color: #1b1c1d; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap">in development<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <span style="font-size: 12px; color: #5e6168">Updated by Tom Achterberg, 9 Oct 15:12</span>
            </div>
            <dl style="margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; font-size: 13px; border-top: 1px solid #e4e6ea; padding-top: 12px">
              <sc-for list="{{ fields }}" as="f" hint-placeholder-count="6">
                <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                  <dt style="font-size: 12px; color: #5e6168; line-height: 16px">{{ f.label }}</dt>
                  <dd style="margin: 0; display: flex; align-items: center; gap: 6px; line-height: 24px; color: #1b1c1d; min-width: 0"><span style="{{ f.valueStyle }}">{{ f.value }}</span></dd>
                </div>
              </sc-for>
            </dl>
          </div>
        </aside>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.4); display: flex; align-items: center; justify-content: center">
        <div role="dialog" aria-modal="true" aria-labelledby="pl-title" style="width: 960px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); overflow: hidden">
          <div style="display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 12px 20px; border-bottom: 1px solid #e4e6ea">
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <h2 id="pl-title" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 28px">Dates, repetition and reminders</h2>
              <span style="font-size: 13px; color: #5e6168; line-height: 19px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span> #58412 Link Nextcloud project folders on rollout, Northwind rollout Lyon. What you set here changes the work package in OpenProject.</span>
            </div>
            <button type="button" aria-label="Close" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>

          <section aria-labelledby="pl-dates" style="display: flex; gap: 24px; padding: 16px 20px 18px; border-bottom: 1px solid #e4e6ea">
            <div style="flex: none; width: 238px; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: center; justify-content: space-between; height: 28px">
                <button type="button" aria-label="Previous month" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
                <span style="font-size: 13px; font-weight: 600">October <span style="font-weight: 400; color: #5e6168">2026</span></span>
                <button type="button" aria-label="Next month" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
              </div>
              <div role="grid" aria-label="October 2026, start 5 October, due 30 October" style="display: grid; grid-template-columns: repeat(7, 34px); gap: 0">
                <sc-for list="{{ dow }}" as="d" hint-placeholder-count="7"><span style="height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #5e6168">{{ d }}</span></sc-for>
                <sc-for list="{{ calCells }}" as="c" hint-placeholder-count="35"><button type="button" aria-label="{{ c.aria }}" aria-pressed="{{ c.on }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
              </div>
              <span style="font-size: 12px; color: #5e6168; line-height: 18px">The tinted days are the run of the work package. Today is outlined.</span>
            </div>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><h3 id="pl-dates" style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Dates</h3><span style="font-size: 12px; color: #5e6168">Start and due change the bar in the calendar too.</span></div>
              <div style="display: grid; grid-template-columns: 92px 1fr; gap: 8px 12px; align-items: center">
                <span id="pl-start" style="font-weight: 500">Start date</span>
                <div style="display: flex; align-items: center; gap: 8px">
                  <button type="button" aria-haspopup="dialog" aria-label="Start date: Monday 5 October 2026" style="{{ chooser }}">Mon 5 Oct 2026<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></button>
                  <button type="button" aria-haspopup="listbox" aria-label="Start time: 09:00" style="{{ chooserTime }}">09:00<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                  <button type="button" aria-label="Remove the start date" style="{{ quiet }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>Remove</button>
                </div>
                <span id="pl-due" style="font-weight: 500">Due date</span>
                <div style="display: flex; align-items: center; gap: 8px">
                  <button type="button" aria-haspopup="dialog" aria-label="Due date: Friday 30 October 2026" style="{{ chooser }}">Fri 30 Oct 2026<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></button>
                  <button type="button" aria-haspopup="listbox" aria-label="Due time: 17:00" style="{{ chooserTime }}">17:00<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                  <button type="button" aria-label="Remove the due date" style="{{ quiet }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>Remove</button>
                </div>
                <span style="font-weight: 500">All day</span>
                <div style="display: flex; align-items: center; gap: 10px">
                  <button id="pl-allday" type="button" role="switch" aria-checked="false" aria-label="All day" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button>
                  <label for="pl-allday" style="font-size: 12px; color: #5e6168; line-height: 18px">Off: start and due have a time of day. On: whole days, the times go.</label>
                </div>
                <span style="font-weight: 500">Due shortcuts</span>
                <div role="group" aria-label="Set the due date to" style="display: flex; flex-wrap: wrap; gap: 6px">
                  <sc-for list="{{ shortcuts }}" as="s" hint-placeholder-count="5"><button type="button" style="{{ s.style }}">{{ s.label }}</button></sc-for>
                </div>
              </div>
              <a href="ClWeek.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 13px; color: var(--sc-link, #3669a5); text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Open Friday 30 October in the calendar</a>
            </div>
          </section>

          <section aria-labelledby="pl-rep" style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 18px; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><h3 id="pl-rep" style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Repetition</h3><button type="button" style="height: 30px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Remove the repetition</button></div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px 32px">
              <div style="display: flex; flex-direction: column; gap: 14px">
                <div style="display: flex; align-items: center; gap: 10px">
                  <label for="pl-every" style="font-weight: 500; white-space: nowrap">Repeat every</label>
                  <input id="pl-every" type="text" value="2" inputmode="numeric" style="{{ num }}">
                  <button type="button" aria-haspopup="listbox" aria-label="Unit: weeks" style="{{ chooser }}">weeks<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                  <span style="font-size: 12px; color: #5e6168">days, weeks, months or years</span>
                </div>
                <div style="display: flex; flex-direction: column; gap: 8px">
                  <span id="pl-wd" style="font-weight: 500">On these weekdays</span>
                  <div role="group" aria-labelledby="pl-wd" style="display: flex; gap: 6px">
                    <sc-for list="{{ weekdays }}" as="w" hint-placeholder-count="7"><button type="button" aria-pressed="{{ w.on }}" style="{{ w.style }}">{{ w.label }}</button></sc-for>
                  </div>
                </div>
              </div>
              <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
                <legend style="padding: 0; margin-bottom: 6px; font-weight: 500">End of the repetition</legend>
                <label style="display: flex; align-items: center; gap: 10px; height: 30px"><input type="radio" name="pl-end" style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Never</label>
                <label style="display: flex; align-items: center; gap: 10px; height: 32px"><input type="radio" name="pl-end" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5"><span style="width: 76px">On a date</span><button type="button" aria-haspopup="dialog" aria-label="End date" style="{{ chooser }}">2 November 2026<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></button></label>
                <label style="display: flex; align-items: center; gap: 10px; height: 32px"><input type="radio" name="pl-end" style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5"><span style="width: 76px">After</span><input type="text" value="6" inputmode="numeric" aria-label="Number of times" style="{{ num }}"><span>times</span></label>
              </fieldset>
            </div>
            <div style="display: flex; align-items: flex-start; gap: 8px; padding: 10px 12px; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; color: #3d4047; line-height: 19px">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168; margin-top: 1px"><path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"></path></svg>
              <span>Every 2 weeks on Monday from 5 October, ends on 2 November 2026. Closing this work package moves it to the next occurrence, Monday 19 October.</span>
            </div>
          </section>

          <section aria-labelledby="pl-rem" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px 18px">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px"><h3 id="pl-rem" style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Reminders</h3><span style="font-size: 12px; color: #5e6168">Relative to a date, or at a fixed moment. You get them in Nextcloud and by mail.</span></div>
            <ul aria-label="Reminders" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-top: 1px solid #e4e6ea">
              <sc-for list="{{ reminders }}" as="r" hint-placeholder-count="3">
                <li style="display: flex; align-items: center; gap: 8px; height: 44px; border-bottom: 1px solid #e4e6ea">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                  <sc-if value="{{ r.relative }}" hint-placeholder-val="{{ true }}">

    const dayBase = 'width: 30px; height: 28px; padding: 0; box-sizing: border-box; border-radius: 4px; font: 500 12px \'Fira Sans\', sans-serif; ';
    const monthDays = Array.from({ length: 31 }, (_, i) => {
      const on = i === 4 || i === 18;
      return { label: String(i + 1), on: on ? 'true' : 'false', style: dayBase + (on ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #e4e6ea; background: #ffffff; color: #3d4047;') };
    });
    // mini month: October 2026 starts on a Thursday; start 5, due 30, today 12
    const dow = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
    const cellBase = 'width: 34px; height: 30px; padding: 0; box-sizing: border-box; border: 0; border-radius: 0; font: 400 12px \'Fira Sans\', sans-serif; ';
    const calCells = [];
    for (let i = 0; i < 3; i++) calCells.push({ label: '', aria: 'Not in October', on: 'false', style: cellBase + 'background: transparent; color: transparent' });
    for (let d = 1; d <= 31; d++) {
      const edge = d === 5 || d === 30;
      const inRun = d > 5 && d < 30;
      const today = d === 12;
      let s = cellBase;
      if (edge) s += 'background: #3669a5; color: #ffffff; font-weight: 600; border-radius: ' + (d === 5 ? '4px 0 0 4px' : '0 4px 4px 0');
      else if (inRun) s += 'background: #eaf0f7; color: #234a78' + (today ? '; box-shadow: inset 0 0 0 1.5px #3669a5; border-radius: 4px; font-weight: 600' : '');
      else s += 'background: #ffffff; color: #3d4047';
      calCells.push({ label: String(d), aria: d + ' October' + (d === 5 ? ', start date' : d === 30 ? ', due date' : today ? ', today' : ''), on: edge ? 'true' : 'false', style: s });
    }
    while (calCells.length < 35) calCells.push({ label: '', aria: 'Not in October', on: 'false', style: cellBase + 'background: transparent; color: transparent' });
    const reminders = [
      { relative: true, absolute: false, amount: '1 day before', anchor: 'the due date', fires: 'Thursday 29 October, 17:00', name: '1 day before the due date', date: '', time: '' },
      { relative: true, absolute: false, amount: '1 hour before', anchor: 'the start date', fires: 'Sent on Monday 5 October, 08:00', name: '1 hour before the start date', date: '', time: '' },
      { relative: false, absolute: true, amount: '', anchor: '', fires: 'Before the rollout review with Lyon', name: 'on 15 October 13:30', date: 'Thu 15 Oct 2026', time: '13:30' }
    ];
    const choice = 'display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 14px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px \'Fira Sans\', sans-serif; text-align: left; white-space: nowrap';
    return { groupBy, team, columns, fields, num, chooser, chooserSm, chooserTime, quiet, addBtn, switchOff, knobOff, shortcuts, weekdays, months, monthDays, dow, calCells, reminders, choice };
  }
