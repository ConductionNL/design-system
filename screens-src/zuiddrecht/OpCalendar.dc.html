<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenProject twin: calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 15px; line-height: 22px; background: #f5f6f8; display: flex; flex-direction: column; min-height: 1026px">
  <dc-import name="OpHeader" current="Project" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch"><dc-import name="OpNav" active="Calendar" style="display: block; width: 100%; min-height: 100%; flex: 1 1 auto" hint-size="264px,932px"></dc-import></div>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <main style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; max-width: 1240px; box-sizing: border-box; width: 100%">
        <section style="display: flex; flex-direction: column; gap: 6px; padding: 4px 0 8px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px">
            <div style="flex: 1 1 320px; min-width: 0; display: flex; align-items: center; gap: 12px">
              <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">October 2026</h1>
              <span style="display: inline-flex; gap: 4px">
                <button type="button" aria-label="Previous month" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--sc-radius, 8px); border: 1px solid #828a95; background: #ffffff; color: #1b1c1d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
                <button type="button" aria-label="Next month" style="display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: var(--sc-radius, 8px); border: 1px solid #828a95; background: #ffffff; color: #1b1c1d"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
              </span>
              <button type="button" style="display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border-radius: var(--sc-radius, 8px); font: 600 14px 'Fira Sans', sans-serif; border: 1px solid #828a95; background: #ffffff; color: #1b1c1d">Today</button>
            </div>
            <div style="flex: none; display: flex; flex-wrap: wrap; gap: 10px">
              <span style="position: relative; display: inline-flex; align-items: center"><select aria-label="View" style="appearance: none; height: 40px; box-sizing: border-box; padding: 0 36px 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d"><option>Month</option><option>Week</option><option>Day</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; color: #5e6168; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg></span>
              <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: var(--sc-radius, 8px); font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap; border: 1px solid var(--sc-action-deep, #234a78); background: var(--sc-action, #3669a5); color: #ffffff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create</button>
            </div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: #5e6168"><nav aria-label="Breadcrumb" style="font-size: 14px; color: #5e6168; display: flex; gap: 8px"><a href="OpHome.dc.html" style="color: #5e6168; text-decoration: none">Northwind rollout Lyon</a><span aria-hidden="true">/</span><span aria-current="page">Calendar</span></nav><span aria-hidden="true">·</span><span>Work package dates and meetings, Monday first</span></div>
        </section>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
          <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; border: 0; background: #1b1c1d; color: #ffffff">Work packages<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #3d4047; color: #ffffff">7</span></button>
          <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; border: 0; background: #1b1c1d; color: #ffffff">Meetings<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #3d4047; color: #ffffff">2</span></button>
          <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; border: 1px solid #828a95; background: #ffffff; color: #1b1c1d">Mine only</button>
          <span style="flex: 1"></span>
          <span style="display: inline-flex; gap: 16px; font-size: 13px; color: #5e6168">
            <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 3px; background: #eaf0f7; border-left: 3px solid #538b28; box-sizing: border-box; display: inline-block"></span>Work package, type colour</span>
            <span style="display: inline-flex; align-items: center; gap: 6px"><span style="width: 14px; height: 10px; border-radius: 3px; background: #234a78; display: inline-block"></span>Meeting</span>
          </span>
        </div>
        <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
          <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); background: #fafbfc; border-bottom: 1px solid #eef0f3; font-size: 13px; font-weight: 600; color: #5e6168; height: 36px; align-items: center">
            <sc-for list="{{ dow }}" as="d" hint-placeholder-count="7"><span style="padding: 0 12px">{{ d.label }}</span></sc-for>
          </div>
          <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="5">
            <div style="position: relative; height: 140px; border-top: 1px solid #eef0f3">
              <div style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr))">
                <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7">
                  <div style="padding: 8px 10px; border-left: 1px solid #eef0f3; background: {{ d.bg }}; box-sizing: border-box; min-width: 0">
                    <span style="display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; font-size: 13px; font-weight: 600; color: {{ d.ink }}; background: {{ d.pill }}">{{ d.label }}</span>
                  </div>
                </sc-for>
              </div>
              <sc-for list="{{ w.events }}" as="e" hint-placeholder-count="3">
                <a href="{{ e.href }}" style="position: absolute; top: {{ e.top }}; left: {{ e.left }}; width: {{ e.width }}; box-sizing: border-box; margin: 0 4px; height: 26px; padding: 0 8px; border-radius: 4px; background: {{ e.bg }}; color: {{ e.ink }}; border-left: 3px solid {{ e.line }}; font-size: 13px; line-height: 26px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{ e.typeColor }}; margin-right: 6px">{{ e.type }}</span>{{ e.label }}</a>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1026}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df' };
    const dow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((label) => ({ label }));
    // Week rows from Monday 28 September to Sunday 1 November 2026. Today is Monday 12 October.
    const starts = [[28, 'Sep'], [5, 'Oct'], [12, 'Oct'], [19, 'Oct'], [26, 'Oct']];
    const daysIn = { Sep: 30, Oct: 31 };
    const weeks = starts.map(([d0, m0], wi) => {
      const days = [];
      let d = d0, m = m0;
      for (let i = 0; i < 7; i++) {
        const outside = m !== 'Oct';
        const today = m === 'Oct' && d === 12;
        days.push({ label: (d === 1 || (i === 0 && outside)) ? d + ' ' + m : String(d), bg: i >= 5 ? '#fafbfc' : '#ffffff', ink: today ? '#ffffff' : (outside ? '#5e6168' : '#1b1c1d'), pill: today ? '#3669a5' : 'transparent' });
        d++;
        if (d > daysIn[m]) { d = 1; m = m === 'Sep' ? 'Oct' : 'Nov'; }
      }
      return { days, events: [] };
    });
    // [week, column (0 = Monday), span, lane, kind, type, label, id]
    const ev = [
      [1, 3, 4, 0, 'wp', 'BUG', 'Gantt PDF export drops trailing columns', 58231],
      [1, 0, 1, 0, 'wp', '', '#58412 starts', 58412],
      [2, 0, 3, 0, 'wp', 'BUG', 'Gantt PDF export, due 14 Oct', 58231],
      [2, 0, 5, 1, 'wp', 'TASK', 'Send OIDC client settings to Lyon', 58440],
      [2, 1, 1, 2, 'wp', 'TASK', 'Demo Malmo Energi', 58455],
      [2, 3, 1, 2, 'meeting', '', '14:00 Rollout review Lyon', 0],
      [2, 4, 1, 2, 'wp', 'TASK', 'Quote Kassel', 58301],
      [3, 0, 5, 0, 'wp', 'FEATURE', 'Single sign-on through Keycloak', 58390],
      [3, 4, 1, 1, 'wp', 'EPIC', 'Release 16.5', 57990],
      [3, 3, 1, 1, 'meeting', '', '14:00 Weekly review', 0],
      [4, 4, 1, 0, 'wp', 'FEATURE', 'Link project folders, due', 58412]
    ];
    ev.forEach(([w, c, span, lane, kind, type, label, id]) => {
      const meeting = kind === 'meeting';
      weeks[w].events.push({
        type, label, typeColor: meeting ? '#ffffff' : TYPE[type],
        href: id === 58412 ? 'OpWorkPackage.dc.html' : (meeting ? 'OpMeetings.dc.html' : '#'),
        top: (38 + lane * 30) + 'px', left: 'calc(' + (c * 100 / 7) + '% + 1px)', width: 'calc(' + (span * 100 / 7) + '% - 10px)',
        bg: meeting ? '#234a78' : '#eaf0f7', ink: meeting ? '#ffffff' : '#1b1c1d', line: meeting ? '#234a78' : TYPE[type]
      });
    });
    return { dow, weeks };
  }
}
</script>
</body>
</html>
