<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: add a calendar, subscribe or import</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1900px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Add calendar, opened from the bottom of the calendar list: the ways down the left, Import chosen, three files dropped with a target calendar per file, and the result of the first two</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="245px,945px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
          <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
            <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
            <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
          </div>
          <div style="flex: none; display: flex; height: 34px">
            <div style="flex: none; width: 84px"></div>
            <sc-for list="{{ days }}" as="d" hint-placeholder-count="7"><div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div></sc-for>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; border-top: 1px solid #e4e6ea">
            <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div></sc-for>
            <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
              <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
                <div style="{{ d.colStyle }}"><sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2"><span style="{{ e.style }}"><span style="font-weight: 600">{{ e.title }}</span><span style="font-size: 11px; color: #5e6168">{{ e.time }}</span></span></sc-for></div>
              </sc-for>
            </div>
          </div>
        </main>
      </div>

      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 100px">
        <div role="dialog" aria-modal="true" aria-labelledby="cl-add-title" style="width: 920px; min-height: 640px; box-sizing: border-box; display: flex; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
          <nav aria-label="Ways to add a calendar" style="flex: 0 0 250px; width: 250px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 16px 10px; background: #f5f6f8; border-right: 1px solid #e4e6ea">
            <h3 id="cl-add-title" style="margin: 0 0 8px; padding: 0 10px; font-size: 16px; font-weight: 600; line-height: 24px">Add calendar</h3>
            <sc-for list="{{ ways }}" as="w" hint-placeholder-count="8">
              <a href="#" aria-current="{{ w.current }}" style="{{ w.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="{{ w.icon }}"></path></svg><span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.25"><span>{{ w.label }}</span><span style="font-size: 11px; font-weight: 400; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ w.hint }}</span></span></a>
            </sc-for>
          </nav>
          <section aria-label="Import" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
            <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 12px 0 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
              <h3 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Import</h3>
              <button type="button" aria-label="Close" style="width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 16px 24px 0">
              <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Drop one or more files here, or choose them. iCalendar (.ics), jCal (.json) and xCal (.xml) files work. Each file goes to a calendar of your choice.</p>
              <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Drop more files here, or <button type="button" style="height: 28px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 13px 'Fira Sans', sans-serif">choose files</button></div>
              <table style="width: 100%; border-collapse: collapse; font-size: 13px">
                <thead><tr style="height: 32px; border-bottom: 1px solid #e4e6ea"><th scope="col" style="{{ th }}">File</th><th scope="col" style="{{ th }}">Into calendar</th><th scope="col" style="{{ th }}">Result</th></tr></thead>
                <tbody>
                  <sc-for list="{{ files }}" as="f" hint-placeholder-count="3">
                    <tr style="height: 48px; border-bottom: 1px solid #e4e6ea; vertical-align: middle">
                      <td style="padding: 0 8px; width: 40%"><span style="display: flex; flex-direction: column; line-height: 1.2"><span style="display: inline-flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2zM14 2v6h6"></path></svg>{{ f.name }}</span><span style="padding-left: 24px; font-size: 11px; color: #5e6168">{{ f.kind }}</span></span></td>
                      <td style="padding: 0 8px"><button type="button" aria-haspopup="listbox" aria-label="Calendar for {{ f.name }}: {{ f.target }}" style="{{ chooser }}"><span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="{{ f.box }}"></span>{{ f.target }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></td>
                      <td style="padding: 0 8px; font-size: 12px; line-height: 16px; color: {{ f.resultColor }}">{{ f.result }}</td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #3669a5"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span><strong style="font-weight: 600">2 of 3 files imported: 61 events came in, 3 failed.</strong> The 3 that failed have no end time; <a href="#" style="color: var(--sc-link, #3669a5)">show them</a> to fix the file and import it again. New calendar is created when the third file goes in.</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin: 16px 24px 0; padding: 12px 0 20px; border-top: 1px solid #e4e6ea">
              <span style="font-size: 12px; color: #5e6168">Events already in the calendar are not doubled.</span>
              <span style="flex: 1 1 auto"></span>
              <button type="button" style="{{ secondary }}">Close</button>
              <button type="button" style="{{ primary }}">Import the remaining file</button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The other seven ways, each as it appears on the right of the same dialog</figcaption>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px">

      <section aria-label="New calendar" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">New calendar</h3>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="cl-new-name" style="{{ fieldLabel }}">Name</label><input id="cl-new-name" type="text" value="Malmo Energi" style="{{ input }}"></div>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0 0 4px; float: left; width: 100%; font-size: 12px; font-weight: 600; color: #5e6168">Colour</legend><div style="display: flex; align-items: center; gap: 6px; height: 28px"><sc-for list="{{ swatches }}" as="s" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ s.on }}" aria-label="{{ s.name }}" style="{{ s.style }}"></button></sc-for></div></fieldset>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0 0 4px; float: left; width: 100%; font-size: 12px; font-weight: 600; color: #5e6168">What it holds</legend>
          <label style="display: flex; align-items: center; gap: 10px; height: 26px; font-size: 13px"><input type="radio" name="cl-new-kind" style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Events only</label>
          <label style="display: flex; align-items: center; gap: 10px; height: 26px; font-size: 13px"><input type="radio" name="cl-new-kind" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Events and a task list</label>
        </fieldset>
        <span style="{{ hint }}">The task list appears in the Tasks app under the same name.</span>
        <div style="{{ paneFoot }}"><button type="button" style="{{ primary }}">Create calendar</button></div>
      </section>

      <section aria-label="Holidays" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">Holidays</h3>
        <span style="{{ hint }}">Public holidays of a region, kept up to date for you. Read only, never counts as busy.</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="cl-hol-region" style="{{ fieldLabel }}">Region</label><button id="cl-hol-region" type="button" aria-haspopup="listbox" style="{{ chooserWide }}"><span>Netherlands</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="cl-hol-lang" style="{{ fieldLabel }}">Names in</label><button id="cl-hol-lang" type="button" aria-haspopup="listbox" style="{{ chooserWide }}"><span>English</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
        <span style="{{ hint }}">Next: King's Day, Monday 27 April 2027. 11 days a year.</span>
        <div style="{{ paneFoot }}"><button type="button" style="{{ primary }}">Add holidays of Netherlands</button></div>
      </section>

      <section aria-label="From a link" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">From a link</h3>
        <span style="{{ hint }}">An outside calendar you follow. It is read only here and fetched again every few hours.</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="cl-sub-url" style="{{ fieldLabel }}">Link to the calendar</label><input id="cl-sub-url" type="url" value="https://malmo-energi.se/events.ics" style="{{ input }}"></div>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="cl-sub-name" style="{{ fieldLabel }}">Name in your list</label><input id="cl-sub-name" type="text" value="Malmo Energi events" style="{{ input }}"></div>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5e6168"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg>Subscribed, read only</span>
        <div style="{{ paneFoot }}"><button type="button" style="{{ primary }}">Subscribe</button></div>
      </section>

      <section aria-label="Suggested by your administrator" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">Suggested by your administrator</h3>
        <span style="{{ hint }}">Public calendars of Northwind Projects. Subscribe to the ones you want.</span>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{ suggested }}" as="s" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 0; border-bottom: 1px solid #e4e6ea"><span aria-hidden="true" style="{{ s.box }}"></span><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 13px">{{ s.name }}</span><span style="font-size: 11px; color: #5e6168">{{ s.sub }}</span></span><sc-if value="{{ s.done }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 12px; color: #5e6168">Subscribed</span></sc-if><sc-if value="{{ s.todo }}" hint-placeholder-val="{{ true }}"><button type="button" style="{{ small }}">Subscribe</button></sc-if></div>
          </sc-for>
        </div>
      </section>

      <section aria-label="In your connected account" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">In your connected account</h3>
        <span style="{{ hint }}">Calendars you already subscribed to in olivia@northwind-projects.test on the mail server. Show them here too.</span>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{ seen }}" as="s" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 0; border-bottom: 1px solid #e4e6ea"><span aria-hidden="true" style="{{ s.box }}"></span><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 13px">{{ s.name }}</span><span style="font-size: 11px; color: #5e6168">{{ s.sub }}</span></span><button type="button" role="switch" aria-checked="{{ s.on }}" aria-label="Show {{ s.name }}" style="{{ s.switch }}"><span style="{{ s.knob }}"></span></button></div>
          </sc-for>
        </div>
      </section>

      <section aria-label="A colleague's calendar" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">A colleague's calendar</h3>
        <span style="{{ hint }}">Look at a colleague's calendar by their email address. You see free and busy, and what they let you see.</span>
        <div style="display: flex; flex-direction: column; gap: 4px"><label for="cl-mate" style="{{ fieldLabel }}">Email address</label><input id="cl-mate" type="email" value="tom@northwind-projects.test" style="{{ input }}"></div>
        <div style="display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--sc-radius, 8px); background: #f5f6f8"><span style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">TA</span><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 13px; font-weight: 600">Tom Achterberg</span><span style="font-size: 11px; color: #5e6168">Found. Busy until 11:00, then free.</span></span></div>
        <div style="{{ paneFoot }}"><button type="button" style="{{ secondary }}">Look once</button><button type="button" style="{{ primary }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"></path></svg>Pin to my calendar list</button></div>
      </section>

      <section aria-label="Delegated to you" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">Delegated to you</h3>
        <span style="{{ hint }}">Calendars other people let you manage for them, grouped per person. Tick the ones to show in your list.</span>
        <div style="display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{ delegated }}" as="p" hint-placeholder-count="2">
            <div style="display: flex; flex-direction: column">
              <div style="display: flex; align-items: center; gap: 8px; height: 30px"><span style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ p.initials }}</span><span style="font-size: 13px; font-weight: 600">{{ p.name }}</span><span style="font-size: 11px; color: #5e6168">{{ p.sub }}</span></div>
              <sc-for list="{{ p.cals }}" as="c" hint-placeholder-count="2">
                <label style="display: flex; align-items: center; gap: 10px; height: 28px; padding-left: 30px; font-size: 13px"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5"><span aria-hidden="true" style="{{ c.box }}"></span>{{ c.name }}</label>
              </sc-for>
            </div>
          </sc-for>
        </div>
        <div style="{{ paneFoot }}"><button type="button" style="{{ primary }}">Add 3 calendars</button></div>
      </section>

      <section aria-label="Import, before files are dropped" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">Import</h3>
        <span style="{{ hint }}">The same way before any file is dropped.</span>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 16px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #f5f6f8; text-align: center; font-size: 13px; color: #5e6168"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#c4c7cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg><span>Drop .ics, .json or .xml files here</span><button type="button" style="{{ secondary }}">Choose files</button></div>
      </section>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const switchOn = 'flex: none; position: relative; width: 36px; height: 20px; margin-top: 1px; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 10px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 17px; width: 14px; height: 14px; border-radius: 7px; background: #ffffff';
    const switchOff = 'flex: none; position: relative; width: 36px; height: 20px; margin-top: 1px; padding: 0; border: 1px solid #c4c7cb; border-radius: 10px; background: #ffffff; box-sizing: border-box; cursor: pointer';
    const knobOff = 'position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 7px; background: #5e6168';
    const primary = 'display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const secondary = 'display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px \'Fira Sans\', sans-serif; white-space: nowrap';
    const small = 'flex: none; display: inline-flex; align-items: center; height: 28px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 12px \'Fira Sans\', sans-serif; white-space: nowrap';
    const chooser = 'display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; min-width: 190px; padding: 0 8px 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 13px \'Fira Sans\', sans-serif; white-space: nowrap';
    const chooserWide = 'display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; width: 100%; padding: 0 8px 0 10px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 13px \'Fira Sans\', sans-serif; white-space: nowrap';
    const input = 'width: 100%; height: 32px; padding: 0 10px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 13px \'Fira Sans\', sans-serif; color: #1b1c1d';

    const swatches = [['Blue', '#3669a5'], ['Green', '#538b28'], ['Orange', '#ff9d2e'], ['Red', '#ab0000'], ['Teal', '#005b77'], ['Sky', '#08a5df']].map(([name, c]) => ({ name, on: c === '#08a5df' ? 'true' : 'false', style: swatch(c, c === '#08a5df') }));
    const wayBase = 'display: flex; align-items: flex-start; gap: 10px; min-height: 40px; padding: 5px 10px; border-radius: var(--sc-radius, 8px); font-size: 13px; text-decoration: none; ';
    const ways = [
      ['New calendar', 'Name, colour, with or without tasks', 'M12 5v14M5 12h14'],
      ['Holidays', 'Public holidays of a region', 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z'],

      ['Suggested by your administrator', '3 public calendars', 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'],
      ['In your connected account', '3 subscriptions on the mail server', 'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6'],

    ].map(([name, sub, c, on]) => ({ name, sub, box: box(c), on: on ? 'true' : 'false', switch: on ? switchOn : switchOff, knob: on ? knobOn : knobOff }));
    const delegated = [

      { initials: 'PR', name: 'Priya Raman', sub: 'since 9 October', cals: [{ name: 'Priya, support shifts', box: box('#7048e8') }] }

    // week grid behind the dialog
    const H = 72, OFF = 14;

      const top = i * H + OFF;

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => ({
      name, n: 12 + i, events: perDay[i],
      headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (i >= 5 ? 'background: #f5f6f8;' : ''),

      colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (i >= 5 ? 'background: #f5f6f8;' : '')
    }));
    return { primary, secondary, small, chooser, chooserWide, input, th, pane, paneTitle, paneFoot, fieldLabel, hint, swatches, ways, files, suggested, seen, delegated, hours, days };
  }
