              <span style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px); background: var(--sc-work-chip, #f0f1f3); font-size: 11px; font-weight: 600; color: var(--sc-work-text, #3d4047); white-space: nowrap"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg>Generated</span>
              <span style="font-size: 13px; font-weight: 600; color: var(--sc-work-muted, #5e6168)">Suggested replies, generated.</span>
              <span style="flex: 1 1 auto"></span>
              <button type="button" aria-label="Dismiss the suggested replies" style="display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-muted, #5e6168); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>Dismiss</button>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <button type="button" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Thanks Jana, the offer follows by Friday.</button><button type="button" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Can you confirm 12 people and the Kassel venue?</button><button type="button" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">We will include travel costs in the offer.</button>
            </div>
            <div style="display: flex; align-items: center; gap: 10px">
              <button id="ml-ai-label" type="button" role="switch" aria-checked="true" style="flex: none; position: relative; width: 42px; height: 24px; margin-top: 1px; padding: 0; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: 12px; background: var(--sc-action, var(--sc-primary, #3669a5)); box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button>
              <label for="ml-ai-label" style="font-size: 14px; color: var(--sc-work-text, #3d4047); line-height: 20px">Mark my reply as written with AI when it starts from a suggestion.</label>
            </div>
          </div>
          
          <div style="display: flex; gap: 8px; padding: 12px 14px 14px 88px; flex-wrap: wrap">
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17l-5-5 5-5M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>Reply</button>
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 17l5-5-5-5M4 18v-2a4 4 0 0 1 4-4h12"></path></svg>Forward</button>
          </div>
        </article>
      </div>
    </main>
  </div>
    </div>
  </figure>
  

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">e</span> &nbsp;The list's Sort and view menu: the generated one-line summaries are a view setting here, the rows keep only the small spark</figcaption>
    <div style="position: relative; height: 370px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px; height: 56px; width: 410px; padding: 0 8px 0 16px; box-sizing: border-box; background: #ffffff; border-right: 1px solid var(--sc-work-line, #e4e6ea); border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
        <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Inbox</h2><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">12 conversations</span></div>
        <span style="flex: 1 1 auto"></span>
        <button type="button" aria-label="Sort and view" aria-haspopup="menu" aria-expanded="true" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path></svg></button>
      </div>
      <div role="menu" aria-label="Sort and view" style="position: absolute; left: 150px; top: 52px; margin-top: 4px; width: 440px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column">
        <div style="padding: 2px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Sort</div>
        <button type="button" role="menuitemradio" aria-checked="true" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); background: var(--sc-primary-light, #eaf0f7);"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 5px solid var(--sc-primary, #3669a5); background: #ffffff"></span><span style="flex: 1 1 auto">Newest first</span></button><button type="button" role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); background: transparent;"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><span style="flex: 1 1 auto">Unread first</span></button>
        <div role="separator" style="height: 1px; margin: 6px 0; background: var(--sc-work-line, #e4e6ea)"></div>
        <div style="padding: 2px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Under the subject</div>
        <button type="button" role="menuitemradio" aria-checked="false" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); background: transparent;"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><span style="flex: 1 1 auto; display: flex; align-items: center; gap: 6px">The first line of the mail</span></button><button type="button" role="menuitemradio" aria-checked="true" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; box-sizing: border-box; width: 100%; border: 0; border-radius: var(--sc-radius, 8px); text-align: left; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); background: var(--sc-primary-light, #eaf0f7);"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 5px solid var(--sc-primary, #3669a5); background: #ffffff"></span><span style="flex: 1 1 auto; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--sc-work-muted, #5e6168)"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"></path></svg>Generated one-line summaries instead of the preview</span></button>
        <div style="padding: 4px 10px 2px; font-size: 13px; color: var(--sc-work-muted, #5e6168); line-height: 18px">A summary is marked Generated and can be wrong. The messages stay as they are.</div>
      </div>
    </div>
  </figure>

</div>
</div>
