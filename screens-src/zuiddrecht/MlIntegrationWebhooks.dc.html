<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: integrations, webhooks, website forms and API keys</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#ml-int-search::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1760px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Integrations: webhooks, website forms and API keys in one list, the OpenProject webhook open on the right</figcaption>
    <div style="height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
      <dc-import name="MlHeader" app="Administration" placeholder="Search integrations, domains or settings" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Integrations" hint-size="264px,944px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Integrations</h1>
              <p style="margin: 0; color: #3d4047">Other applications that receive mail from this server or send mail through it. A webhook forwards incoming messages to a web address, a website form delivers into a mailbox, and an API key lets another application send mail.</p>
              <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Integrations of Northwind Projects, across its three domains.</p>
            </div>
            <button type="button" aria-haspopup="menu" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add integration<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          </div>
          <div style="display: flex; align-items: center; gap: 12px">
            <form role="search" style="position: relative; display: flex; align-items: center; width: 320px">
              <label for="ml-int-search" style="{{ srOnly }}">Search integrations</label>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 8px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
              <input id="ml-int-search" type="search" placeholder="Search integrations" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d">
            </form>
            <span style="font-size: 13px; color: #5e6168; white-space: nowrap">5 integrations, 3 active</span>
          </div>
          <div role="group" aria-label="Kind" style="display: flex; gap: 8px; margin-top: -8px">
            <sc-for list="{{ kinds }}" as="k" hint-placeholder-count="4"><button type="button" aria-pressed="{{ k.on }}" style="{{ k.style }}">{{ k.label }}</button></sc-for>
          </div>
          <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
            <table style="width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px">
              <thead><tr style="background: #fafbfc">
                <th scope="col" style="{{ th }} width: 32%">Integration</th>
                <th scope="col" style="{{ th }} width: 15%">Kind</th>
                <th scope="col" style="{{ th }} width: 39%">Where</th>
                <th scope="col" style="{{ th }} width: 14%">State</th>
                <th scope="col" style="width: 44px"><span style="{{ srOnly }}">Actions</span></th>
              </tr></thead>
              <tbody>
                <sc-for list="{{ items }}" as="i" hint-placeholder-count="5">
                  <tr aria-selected="{{ i.selected }}" style="{{ i.style }}">
                    <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">{{ i.name }}</a></td>
                    <td style="padding: 14px 16px; line-height: 20px; color: #3d4047">{{ i.kind }}</td>
                    <td style="padding: 14px 16px; line-height: 20px; color: #3d4047; word-break: break-word">{{ i.where }}</td>
                    <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><span style="display: flex; align-items: center; gap: 6px; line-height: 20px"><span style="{{ i.dot }}"></span>{{ i.state }}</span></td>
                    <td style="padding: 10px 10px 10px 8px; text-align: right; line-height: 0"><button type="button" aria-haspopup="menu" aria-label="Actions for {{ i.name }}" style="{{ iconBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
          <div style="{{ notice }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #3669a5"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span>Pause or resume an integration from its panel. A paused integration keeps its settings and secret. Mail that arrives while it is paused is not delivered to it later.</span></div>
        </main>

        <aside aria-label="Webhook OpenProject" style="{{ aside }}">
          <div style="display: flex; align-items: flex-start; gap: 8px">
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">OpenProject, new mail on linked conversations</h2>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3d4047"><span style="{{ dotOk }}"></span>Webhook, active since 3 March 2026</span>
            </div>
            <button type="button" aria-label="Close integration" style="{{ closeBtn }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Forwards incoming messages to a web address as soon as they are delivered. Mailboxes of northwind-projects.test, conversations linked to a work package only.</p>

          <div style="{{ group }}">
            <label for="ml-wh-url" style="{{ label }}">Web address</label>
            <input id="ml-wh-url" type="url" value="https://openproject.northwind-projects.test/mail/incoming" style="{{ input }}">
          </div>

          <fieldset style="{{ fieldset }}">
            <legend style="{{ legend }}">When to send</legend>
            <label style="{{ radioRow }}"><input type="radio" name="ml-wh-trigger" style="{{ radio }}"><span>When the message arrives</span></label>
            <label style="{{ radioRow }}"><input type="radio" name="ml-wh-trigger" checked style="{{ radio }}"><span>After the processing rules have run</span></label>
            <label style="{{ radioRow }}"><input type="radio" name="ml-wh-trigger" style="{{ radio }}"><span>When the message is filed in a folder</span></label>
          </fieldset>

          <fieldset style="{{ fieldset }}">
            <legend style="{{ legend }}">Payload</legend>
            <label style="{{ radioRow }}"><input type="radio" name="ml-wh-payload" checked style="{{ radio }}"><span>Whole message, with attachments as links</span></label>
            <label style="{{ radioRow }}"><input type="radio" name="ml-wh-payload" style="{{ radio }}"><span>Headers only</span></label>
          </fieldset>

          <fieldset style="{{ fieldset }}">
            <legend style="{{ legend }}">Security</legend>
            <label style="{{ radioRow }}"><input type="radio" name="ml-wh-sec" checked style="{{ radio }}"><span>Sign each call with a shared secret</span></label>
            <label style="{{ radioRow }}"><input type="radio" name="ml-wh-sec" style="{{ radio }}"><span>Send a static key in a header</span></label>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
              <code style="flex: 1 1 auto; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #f5f6f8; font-family: ui-monospace, monospace; font-size: 12px; color: #3d4047; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">whsec_••••••••••••••••••••7f2a</code>
              <button type="button" style="{{ btnCompact }}">Regenerate secret</button>
            </div>
            <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Regenerating replaces the secret at once. Update OpenProject before the next message arrives.</p>
          </fieldset>

          <dl style="margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; line-height: 20px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <dt style="color: #5e6168">Last delivery</dt><dd style="margin: 0">Today 06:00, answered 200 in 0.4 s</dd>
            <dt style="color: #5e6168">Past 7 days</dt><dd style="margin: 0">212 calls, 0 failed</dd>
          </dl>

          <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
            <button type="button" style="{{ btnPrimary }}">Save</button>
            <button type="button" style="{{ btnSecondary }}">Pause</button>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ btnDanger }}">Remove</button>
          </div>
        </aside>
      </div>
    </div>
  </figure>

  <div style="display: flex; gap: 24px; align-items: flex-start">
    <figure style="margin: 0; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The right panel for a website form: subject line, labels on arrival and the code for the website</figcaption>
      <div style="height: 620px; box-sizing: border-box; display: flex; justify-content: flex-end; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; color: #5e6168; font-size: 13px; padding: 24px; text-align: center">The list stays as in a, with the row Website contact form selected.</div>
        <aside aria-label="Website form Website contact form" style="{{ aside }}">
          <div style="display: flex; align-items: flex-start; gap: 8px">
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Website contact form</h2>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3d4047"><span style="{{ dotOk }}"></span>Website form, active</span>
            </div>
            <button type="button" aria-label="Close integration" style="{{ closeBtn }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">A contact form on your website that delivers into a mailbox. Visitors of northwind-projects.test/contact write to support@support.northwind-projects.test.</p>
          <div style="{{ group }}">
            <label for="ml-form-subject" style="{{ label }}">Subject line of each message</label>
            <input id="ml-form-subject" type="text" value="Website: [topic] from [name]" style="{{ input }}">
            <span style="font-size: 12px; color: #5e6168; line-height: 18px">[name], [topic] and [company] are filled from the form.</span>
          </div>
          <div style="{{ group }}">
            <span style="{{ label }}">Labels applied on arrival</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
              <sc-for list="{{ labels }}" as="l" hint-placeholder-count="2"><span style="{{ labelChip }}">{{ l.name }}<button type="button" aria-label="Remove label {{ l.name }}" style="{{ chipX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span></sc-for>
              <button type="button" style="{{ btnSmall }}">Add label</button>
            </div>
          </div>
          <div style="{{ group }}">
            <span style="{{ label }}">Code for the website</span>
            <code style="display: block; padding: 8px 10px; box-sizing: border-box; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #f5f6f8; font-family: ui-monospace, monospace; font-size: 12px; line-height: 18px; color: #3d4047; white-space: pre-wrap; word-break: break-all">&lt;form action="https://mail.northwind-projects.test/forms/c7e1" method="post"&gt;</code>
            <button type="button" style="{{ btnCompact }} align-self: flex-start">Copy the form code</button>
          </div>
          <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
            <button type="button" style="{{ btnPrimary }}">Save</button>
            <button type="button" style="{{ btnSecondary }}">Pause</button>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ btnDanger }}">Remove</button>
          </div>
        </aside>
      </div>
    </figure>

    <figure style="margin: 0; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The right panel just after an API key was created: the key is shown once</figcaption>
      <div style="height: 620px; box-sizing: border-box; display: flex; justify-content: flex-end; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; color: #5e6168; font-size: 13px; padding: 24px; text-align: center">The list stays as in a, with the new row Invoicing application at the top.</div>
        <aside aria-label="API key Invoicing application" style="{{ aside }}">
          <div style="display: flex; align-items: flex-start; gap: 8px">
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Invoicing application</h2>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3d4047"><span style="{{ dotOk }}"></span>API key for another application, created just now</span>
            </div>
            <button type="button" aria-label="Close integration" style="{{ closeBtn }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Lets the invoicing application send mail as billing@northwind-projects.test, at most 500 messages a day.</p>
          <div style="{{ noticeWarn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #ff9d2e"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg><span>This key is shown once. Copy it now and store it in the invoicing application. After you close this panel only its last four characters stay visible.</span></div>
          <div style="{{ group }}">
            <span style="{{ label }}">API key</span>
            <div style="display: flex; align-items: center; gap: 8px">
              <code style="flex: 1 1 auto; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #f5f6f8; font-family: ui-monospace, monospace; font-size: 12px; color: #1b1c1d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">nwk_live_8Kq2vT9mPx4Lr7Hc3Nd1Bz6Yw0Ej5Fa</code>
              <button type="button" style="{{ btnCompact }}">Copy</button>
            </div>
          </div>
          <dl style="margin: 0; display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 13px; line-height: 20px">
            <dt style="color: #5e6168">Sends as</dt><dd style="margin: 0">billing@northwind-projects.test</dd>
            <dt style="color: #5e6168">May send</dt><dd style="margin: 0">To any address, 500 a day</dd>
            <dt style="color: #5e6168">Created</dt><dd style="margin: 0">Today 07:12 by Ines Okafor</dd>
          </dl>
          <div style="display: flex; align-items: center; gap: 8px">
            <button type="button" style="{{ btnCompact }}">Regenerate key</button>
            <span style="font-size: 12px; color: #5e6168; line-height: 18px">Replaces the key; the old one stops working at once.</span>
          </div>
          <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
            <button type="button" style="{{ btnPrimary }}">Done</button>
            <button type="button" style="{{ btnSecondary }}">Pause</button>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ btnDanger }}">Remove</button>
          </div>
        </aside>
      </div>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1760}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (bg, ring) => 'display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: ' + bg + '; box-shadow: 0 0 0 2px ' + ring;
    const D = { ok: dot('#d3f9d8', '#8ff09c'), warn: dot('#ffc078', '#ff9d2e'), busy: dot('#66d9e8', '#21c8de'), bad: dot('#fcc2d7', '#f977a6'), off: dot('#dee2e6', '#adb5bd') };

    const btnSecondary = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap;';
    const btnSmall = 'display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const btnCompact = 'flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const btnDanger = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap;';

    const aside = 'flex: 0 0 400px; width: 400px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden';
    const group = 'display: flex; flex-direction: column; gap: 6px';
    const label = 'font-size: 14px; font-weight: 600';
    const input = 'width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px \'Fira Sans\', sans-serif; color: #1b1c1d';

    const radio = 'width: 18px; height: 18px; margin: 0; accent-color: #3669a5';
