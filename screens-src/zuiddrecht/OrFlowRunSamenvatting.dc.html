<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Flow: samenvatting van een uitvoering</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<section data-or-flow="runsamenvatting" aria-label="Deze uitvoering" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 12px; box-shadow: 0 2px 8px rgba(27,28,29,0.08); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
    <span style="{{ statusStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ statusIcon }}"></path></svg>{{ status }}</span>
    <h2 style="margin: 0; font-size: 16px; font-weight: 700">{{ title }}</h2>
    <sc-if value="{{ hasWarn }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #7a4f00; font-weight: 600">{{ warn }}</span></sc-if>
  </div>
  <dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 16px">
    <sc-for list="{{ facts }}" as="f" hint-placeholder-count="4"><div style="display: flex; flex-direction: column; gap: 2px"><dt style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5e6168">{{ f.k }}</dt><dd style="margin: 0; font-size: 14px; font-weight: 600">{{ f.v }}</dd></div></sc-for>
  </dl>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 8px; border-top: 1px solid #eef0f3">
    <sc-if value="{{ hasSubject }}" hint-placeholder-val="{{ true }}"><a href="#" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid #828a95; border-radius: 8px; background: #ffffff; font-size: 14px; font-weight: 600; text-decoration: none; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M14,3V5H17.59L7.76,14.83L9.17,16.24L19,6.41V10H21V3M19,19H5V5H12V3H5C3.89,3 3,3.9 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V12H19V19Z"></path></svg>{{ subjectLabel }}</a></sc-if>
    <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border: 1px solid #828a95; border-radius: 8px; background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,6V9L16,5L12,1V4A8,8 0 0,0 4,12C4,13.57 4.46,15.03 5.24,16.26L6.7,14.8C6.25,13.97 6,13 6,12A6,6 0 0,1 12,6M18.76,7.74L17.3,9.2C17.74,10.04 18,11 18,12A6,6 0 0,1 12,18V15L8,19L12,23V20A8,8 0 0,0 20,12C20,10.43 19.54,8.97 18.76,7.74Z"></path></svg>Opnieuw uitvoeren</button>
    <a href="{{ backHref }}" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; color: #3669a5"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"></path></svg>Terug naar de flow</a>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"level":{"editor":"text","default":"success"},"title":{"editor":"text","default":"Run 88213"},"warn":{"editor":"text","default":"1 stap met een waarschuwing"},"facts":{"editor":null,"default":[["Gestart","vandaag 10:12:02"],["Duur","0,9 s"],["Gestart door","Record aangemaakt, MOR-2026-04812"],["Stappen","5 van 6 uitgevoerd"]]},"subjectLabel":{"editor":"text","default":"Melding openen"},"backHref":{"editor":"text","default":"OrFlow.dc.html"},"$preview":{"width":720,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const J = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return d; } } return v; };
    const OUT = { success: ['Afgerond', '#e7f3ea', '#1e6b2a', 'M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z'], warning: ['Afgerond met waarschuwing', '#fff4de', '#7a4f00', 'M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16'], alert: ['Mislukt', '#fcedec', '#a30000', 'M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z'], waiting: ['Wacht op een taak', '#e3f1f3', '#1d5e66', 'M6,2V8H6V8L10,12L6,16V16H6V22H18V16H18V16L14,12L18,8V8H18V2H6M16,16.5V20H8V16.5L12,12.5L16,16.5M12,11.5L8,7.5V4H16V7.5L12,11.5Z'], running: ['Bezig', '#eaf0f7', '#234a78', 'M8,5.14V19.14L19,12.14L8,5.14Z'], stopped: ['Voortijdig gestopt', '#f0f1f3', '#3d4047', 'M18,18H6V6H18V18Z'] };
    const o = OUT[p.level] || OUT.success;
    return {
      status: o[0], statusIcon: o[3],
      statusStyle: 'display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: 15px; font-size: 13px; font-weight: 700; background: ' + o[1] + '; color: ' + o[2],
      title: p.title, hasWarn: !!p.warn, warn: p.warn,
      facts: J(p.facts, []).map((f) => ({ k: f[0], v: f[1] })),
      hasSubject: !!p.subjectLabel, subjectLabel: p.subjectLabel, backHref: p.backHref || '#',
    };
  }
}
</script>
</body>
</html>
