<!doctype html>

<head>

<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<style>

</style>

<body>
<div class="sc-board" data-board="MlSetupAccount">

<div style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 14px; line-height: 21px; background: var(--sc-work-ground, #f5f6f8); box-sizing: border-box; width: 1440px; height: 1000px; padding: 28px 24px; display: grid; grid-template-columns: 1fr 480px; grid-template-rows: auto; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">a</span> &nbsp;First use: no mailbox yet, the manual part unfolded</figcaption>
    <div style="height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      


<div style="position: relative; width: 100%">
<header style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: #ffffff; width: 100%; box-sizing: border-box; height: 68px; padding: 0 20px 0 14px; display: flex; align-items: center; gap: 12px 16px; background: var(--sc-primary, #3669a5)">
  <div style="flex: 1 1 0; display: flex; align-items: center; gap: 12px; min-width: max-content">
    <a href="OpHome.html" style="flex: none; min-width: 237px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px 0 6px; color: #ffffff; text-decoration: none">
      <img src="../assets/zuiddrecht/logo-wit.svg" alt="" style="height: 26px; width: auto; max-width: 120px; flex: none" data-sc-logo="logo-wit">
      <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); flex: none"></span>
      <strong style="font-size: 18px; font-weight: 700; white-space: nowrap">Mail</strong>
    </a>
    <button type="button" aria-label="All apps" aria-haspopup="menu" aria-expanded="false" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h5v5H3zM9.5 3h5v5h-5zM16 3h5v5h-5zM3 9.5h5v5H3zM9.5 9.5h5v5h-5zM16 9.5h5v5h-5zM3 16h5v5H3zM9.5 16h5v5h-5zM16 16h5v5h-5z"></path></svg>
    </button>
  </div>
  <form role="search" style="flex: 0 1 560px; min-width: 240px; position: relative; display: flex; align-items: center">
    <label for="op-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
    <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px; color: #ffffff"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
    <input id="op-search" type="search" placeholder="Search mail" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border: 1px solid #ffffff; border-radius: var(--sc-radius-lg, 10px); background: rgba(255,255,255,0.12); font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">
  </form>
  <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: max-content">
    <button type="button" aria-label="Notifications, 2 new" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 5px; background: var(--sc-accent, #cc0000); border: 2px solid #ffffff"></span>
    </button>
    <button type="button" aria-label="Help" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
    </button>
    <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); margin: 0 6px"></span>
    <button type="button" aria-label="Account menu of Olivia Brandt" aria-haspopup="menu" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">
      <span style="width: 38px; height: 38px; border-radius: 19px; background: #ffffff; color: var(--sc-primary-deep, #234a78); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">OB</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><strong style="font-size: 15px">Olivia Brandt</strong><span style="font-size: 13px; opacity: 0.85">Delivery lead</span></span>
      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</header>

</div>


      <main style="flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-start; justify-content: center; padding: 36px 24px; overflow: hidden">
        <form aria-labelledby="ml-setup-title" style="width: 600px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 28px 32px; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px)">
          <div style="display: flex; flex-direction: column; gap: 4px">
            <h1 id="ml-setup-title" style="margin: 0; font-size: 20px; font-weight: 600; line-height: 28px">Connect a mail account to get started</h1>
            <p style="margin: 0; font-size: 13px; line-height: 19px; color: var(--sc-work-muted, #5e6168)">Name, address and password are enough for most providers. The server settings are found for you.</p>
          </div>
          <div style="display: flex; gap: 8px">
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid var(--sc-work-text, #3d4047); box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; line-height: 1">G</span>Sign in with Google</button>
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="16" height="16" viewbox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="6" height="6" fill="#3d4047" style="fill:var(--sc-work-text, #3d4047)"></rect><rect x="9" y="1" width="6" height="6" fill="#3d4047" style="fill:var(--sc-work-text, #3d4047)"></rect><rect x="1" y="9" width="6" height="6" fill="#3d4047" style="fill:var(--sc-work-text, #3d4047)"></rect><rect x="9" y="9" width="6" height="6" fill="#3d4047" style="fill:var(--sc-work-text, #3d4047)"></rect></svg>Sign in with Microsoft</button>
          </div>
          <div aria-hidden="true" style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><span style="flex: 1 1 auto; height: 1px; background: var(--sc-work-line, #e4e6ea)"></span>or with your address<span style="flex: 1 1 auto; height: 1px; background: var(--sc-work-line, #e4e6ea)"></span></div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px">
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); grid-column: 1 / -1">Name<input type="text" value="Olivia Brandt" style="height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)"></label>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047)">Mail address<input type="email" value="olivia@northwind-projects.test" style="height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)"></label>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047)">Password<input type="password" value="northwind2026" style="height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)"></label>
          </div>
          <button type="button" aria-expanded="true" aria-controls="ml-setup-manual" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, var(--sc-primary, #3669a5)); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>Enter the server details by hand</button>
          <div id="ml-setup-manual" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; background: var(--sc-work-ground, #f5f6f8); border-radius: var(--sc-radius, 8px)">
            
              <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
                <legend style="padding: 0; margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Incoming server</legend>
                <div style="display: grid; grid-template-columns: 1fr 72px; gap: 8px">
                  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); min-width: 0">Server<input type="text" value="imap.northwind-projects.test" style="height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); min-width: 0"></label>
                  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047)">Port<input type="text" value="993" style="height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); width: 100%"></label>
                </div>
                <div role="radiogroup" aria-label="Connection security of the incoming server" style="display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047)">Connection security</span>
                  
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 5px solid var(--sc-primary, #3669a5); background: #ffffff"></span><input type="radio" name="sec-in" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>SSL/TLS</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">recommended</span></label>
                  
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><input type="radio" name="sec-in" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>STARTTLS</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)"></span></label>
                  
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><input type="radio" name="sec-in" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>None</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">not encrypted</span></label>
                  
                </div>
              </fieldset>
            
              <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
                <legend style="padding: 0; margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Outgoing server</legend>
                <div style="display: grid; grid-template-columns: 1fr 72px; gap: 8px">
                  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); min-width: 0">Server<input type="text" value="smtp.northwind-projects.test" style="height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); min-width: 0"></label>
                  <label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047)">Port<input type="text" value="587" style="height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); width: 100%"></label>
                </div>
                <div role="radiogroup" aria-label="Connection security of the outgoing server" style="display: flex; flex-direction: column; gap: 6px">
                  <span style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047)">Connection security</span>
                  
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><input type="radio" name="sec-out" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>SSL/TLS</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">recommended</span></label>
                  
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 5px solid var(--sc-primary, #3669a5); background: #ffffff"></span><input type="radio" name="sec-out" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>STARTTLS</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)"></span></label>
                  
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 18px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 16px; height: 16px; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><input type="radio" name="sec-out" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>None</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">not encrypted</span></label>
                  
                </div>
              </fieldset>
            
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px">
            <span style="font-size: 12px; line-height: 18px; color: var(--sc-work-muted, #5e6168)">Your password is stored encrypted on this server and never shown again.</span>
            <button type="submit" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 16px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Connect</button>
          </div>
        </form>
      </main>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">b</span> &nbsp;The workspace account has no mailbox</figcaption>
    <div style="height: 900px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 91px 24px 0; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <section role="status" aria-labelledby="ml-nomailbox-title" style="width: 100%; max-width: 420px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 28px 28px; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px)">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
        <h2 id="ml-nomailbox-title" style="margin: 0; font-size: 20px; font-weight: 600; line-height: 28px">This workspace account has no mailbox</h2>
