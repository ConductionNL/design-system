<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: attachment preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 4200px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The built-in viewer over the open conversation and its work package panel: one PDF, with the message it came from and arrows through every attachment of the conversation</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="display: flex; flex-direction: column; height: 100%">
        <dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
        <div style="display: flex; flex: 1 1 auto; min-height: 0">
          <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" folded="true" hint-size="64px,945px"></dc-import></div>
          <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="2" hint-size="410px,945px"></dc-import></div>
          <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
              <div style="display: flex; align-items: center; gap: 6px"><span style="width: 28px; height: 28px"></span><h1 style="flex: 1 1 auto; margin: 0; font-size: 20px; font-weight: 700; line-height: 28px">Rollout plan phase 2, Lyon</h1></div>
              <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #5e6168"><span>1 work package</span><span style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span></span><span>6 messages · Customers / Lyon</span></div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px">
              <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="5">
                <div style="{{ m.style }}"><span style="{{ m.avatar }}">{{ m.initials }}</span><span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span><span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.snippet }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ m.date }}</span></div>
              </sc-for>
              <div style="height: 300px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff"></div>
            </div>
          </main>
          <div style="flex: 0 0 400px; width: 400px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="WpPanel" hint-size="400px,945px"></dc-import></div>
        </div>
      </div>
      <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.4); display: flex; align-items: center; justify-content: center">
        <div role="dialog" aria-modal="true" aria-labelledby="viewer-title" style="width: 1160px; height: 880px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); overflow: hidden">
          <div style="display: flex; align-items: center; gap: 12px; padding: 16px 16px 16px 24px; border-bottom: 1px solid #e4e6ea">
            <span style="flex: none; width: 34px; height: 22px; border-radius: var(--sc-radius, 8px); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #ffffff; background: #ab0000">PDF</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
              <h2 id="viewer-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Rollout-plan-phase-2.pdf</h2>
              <span style="font-size: 12px; line-height: 18px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">1.8 MB, 12 pages. From the message of Marc Dubois, 8 Oct 09:14. <a href="#" style="color: var(--sc-link, #3669a5)">Go to the message</a></span>
            </div>
            <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Download</button>
            <button type="button" title="Save to Files, your file storage" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Save to Files</button>
            <button type="button" aria-label="Close the viewer" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; background: #eef0f3; overflow: hidden">
            <button type="button" aria-label="Previous attachment" disabled style="position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 1px solid #e4e6ea; border-radius: 20px; background: #ffffff; color: #c4c7cb; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
            <div aria-label="Page 1 of Rollout-plan-phase-2.pdf" role="img" style="width: 540px; height: 700px; box-sizing: border-box; padding: 56px 52px; background: #ffffff; box-shadow: 0 4px 12px rgba(27,28,29,0.12); display: flex; flex-direction: column; gap: 14px">
              <span style="font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #5e6168">Ville de Lyon · Direction des systèmes d'information</span>
              <span style="font-size: 24px; font-weight: 600; line-height: 30px; color: #1b1c1d">Rollout plan phase 2</span>
              <span style="font-size: 13px; color: #3d4047">Nextcloud and OpenProject for the planning department, October 2026</span>
              <span style="height: 1px; background: #e4e6ea; margin: 6px 0"></span>
              <sc-for list="{{ lines }}" as="l" hint-placeholder-count="12"><span style="height: 8px; border-radius: 4px; background: #eef0f3; width: {{ l }}"></span></sc-for>
              <span style="margin-top: 10px; height: 110px; border: 1px solid #e4e6ea; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-around; padding: 10px 12px; box-sizing: border-box"><span style="height: 8px; width: 40%; border-radius: 4px; background: #3669a5"></span><span style="height: 8px; width: 62%; margin-left: 20%; border-radius: 4px; background: #538b28"></span><span style="height: 8px; width: 30%; margin-left: 58%; border-radius: 4px; background: #ff9d2e"></span></span>
            </div>
            <button type="button" aria-label="Next attachment: oidc-client-settings.xlsx" style="position: absolute; right: 16px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 1px solid #c4c7cb; border-radius: 20px; background: #ffffff; color: #1b1c1d; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; border-top: 1px solid #eef0f3; font-size: 13px; color: #5e6168">
            <span>Attachment 1 of 2 in this conversation. Next: oidc-client-settings.xlsx, Tom Achterberg, 9 Oct</span>
            <div style="display: flex; align-items: center; gap: 6px">
              <button type="button" aria-label="Previous page" disabled style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #c4c7cb; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
              <span style="color: #1b1c1d">Page 1 of 12</span>
              <button type="button" aria-label="Next page" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The attachment strip of a message: all as one zip, all to Files, and a mail that arrived as an attachment opened in place</figcaption>
    <div style="height: 470px; box-sizing: border-box; padding: 12px 16px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <article aria-label="Message from Tom Achterberg, 9 October" style="position: relative; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
          <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">TA</span>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
            <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Tom Achterberg</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">tom@northwind-projects.test</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">9 Oct 16:48</span></div>
            <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
          </div>
          <button type="button" aria-label="More actions for this message" aria-haspopup="menu" style="flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
        </div>
        <div style="padding: 10px 14px 0 88px; display: flex; flex-direction: column; gap: 8px; color: #3d4047">
          <p style="margin: 0">Here is the realm export from the Lyon Keycloak, forwarded as Julien sent it so you have his notes too. The client settings for our side are in the sheet from yesterday.</p>
        </div>
        <div style="margin: 12px 14px 0 88px; padding-top: 10px; border-top: 1px solid #e4e6ea; display: flex; flex-direction: column; gap: 4px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="font-size: 12px; font-weight: 600; color: #5e6168">2 attachments, 21 KB</span>
            <div style="display: flex; gap: 6px">
              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Download all as zip</button>
              <span style="position: relative; display: inline-flex"><button type="button" aria-haspopup="dialog" title="Save all to Files, your file storage" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>Save all to Files</button>
            </span>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px">
            <span style="flex: none; width: 34px; height: 22px; border-radius: var(--sc-radius, 8px); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #ffffff; background: #234a78">EML</span>
            <a href="#" style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sc-link, #3669a5); text-decoration: none">Keycloak realm export for Lyon.eml</a>
            <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">attached message, 9 KB</span>
            <button type="button" aria-pressed="true" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>Show message</button>
            <button type="button" aria-label="Download Keycloak realm export for Lyon.eml" title="Download" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg></button>
            <span style="position: relative; display: inline-flex"><button type="button" aria-label="Save Keycloak realm export for Lyon.eml to Files" title="Save to Files, your file storage" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></button></span>
          </div>
          <div style="position: relative; display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px">
            <span style="flex: none; width: 34px; height: 22px; border-radius: var(--sc-radius, 8px); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #ffffff; background: #5e6168">JSON</span>
            <a href="#" style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sc-link, #3669a5); text-decoration: none">realm-export-lyon.json</a>
            <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">12 KB</span>
            <button type="button" aria-label="Download realm-export-lyon.json" title="Download" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg></button>
            <span style="position: relative; display: inline-flex"><button type="button" aria-label="Save realm-export-lyon.json to Files" title="Save to Files, your file storage" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg></button></span>
          </div>
        </div>
        <section aria-label="Attached message from Julien Petit, 8 October" style="margin: 10px 14px 14px 88px; max-width: 880px; display: flex; flex-direction: column; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #f5f6f8; overflow: hidden">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; padding: 0 8px 0 12px; border-bottom: 1px solid #e4e6ea; background: #eef0f3">
            <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>Attached message</span>
            <div style="display: flex; gap: 2px">
              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"></path></svg>Open as its own conversation</button>
              <button type="button" aria-label="Close the attached message" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
          </div>
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
