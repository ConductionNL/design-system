<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail: notices and markers</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="MlNotificationStates">

<div style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 14px; line-height: 21px; background: var(--sc-work-ground, #f5f6f8); box-sizing: border-box; width: 1440px; height: 1260px; padding: 28px 24px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">a</span> &nbsp;Browser notification when new mail arrives, also while the tab is in the background</figcaption>
    <div style="height: 200px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: flex-end; padding: 16px; background: var(--sc-work-soft, #eef0f3); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div role="alert" aria-label="Browser notification" style="width: 380px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12)">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><span style="width: 16px; height: 16px; border-radius: 4px; background: var(--sc-primary, #3669a5); display: inline-flex; align-items: center; justify-content: center; color: #ffffff"><svg width="10" height="10" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span><span>Mail · mail.northwind-projects.test</span><span style="flex: 1 1 auto"></span><span>07:00</span><button type="button" aria-label="Dismiss this notification" style="width: 20px; height: 20px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-muted, #5e6168); display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
        <div style="display: flex; gap: 10px">
          <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">SL</span>
          <div style="display: flex; flex-direction: column; min-width: 0">
            <strong style="font-size: 14px; font-weight: 600; line-height: 20px">New mail from Sven Lindqvist</strong>
            <span style="font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)">Request for a demo, 1,200 users</span>
            <span style="font-size: 12px; line-height: 18px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">We are evaluating OpenProject for all of Malmö Energi, about 1,200 users.</span>
          </div>
        </div>
        <div style="display: flex; gap: 8px; padding-left: 42px"><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 12px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap;">Open</button></div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">b</span> &nbsp;Message sent: the toast at the foot of the reading pane, with ten seconds to take it back</figcaption>
    <div style="height: 200px; box-sizing: border-box; display: flex; align-items: flex-end; padding: 16px; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div role="status" aria-live="polite" style="display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px 0 14px; box-sizing: border-box; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12)">
        <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="#538b28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3"></path></svg>
        <span style="font-size: 13px"><strong style="font-weight: 600">Message sent</strong> to Marc Dubois, "Re: Rollout plan phase 2, Lyon"</span>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 12px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap;"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>Take back</button>
        <span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">8 s left</span>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">c</span> &nbsp;Mailbox nearly full: the storage line at the foot of the navigation turns into a warning</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <nav aria-label="Folders, lower part" style="flex: 0 0 264px; width: 264px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: 10px 14px 12px; background: #ffffff; border-right: 1px solid var(--sc-work-line, #e4e6ea)">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); color: var(--sc-work-ink, #1b1c1d); text-decoration: none; font-size: 15px; font-weight: 500"><svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--sc-work-muted, #5e6168)"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg><span style="flex: 1 1 auto">Spam</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)"></span></a><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); color: var(--sc-work-ink, #1b1c1d); text-decoration: none; font-size: 15px; font-weight: 500"><svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--sc-work-muted, #5e6168)"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span style="flex: 1 1 auto">Trash</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">214</span></a>
        <div role="status" style="margin: 8px 4px 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid #ff9d2e; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 12px; line-height: 18px; color: var(--sc-work-ink, #1b1c1d)">
          <div style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #c77a1f"><path d="m10.29 3.86-8.6 14.86A2 2 0 0 0 3.4 21.7h17.2a2 2 0 0 0 1.71-2.98L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg><strong style="font-weight: 600">Mailbox nearly full</strong></div>
          <div role="progressbar" aria-label="Storage used" aria-valuenow="94" aria-valuemin="0" aria-valuemax="100" style="height: 6px; border-radius: 3px; background: var(--sc-work-soft, #eef0f3); overflow: hidden"><span style="display: block; width: 94%; height: 100%; background: #ff9d2e"></span></div>
          <span style="color: var(--sc-work-text, #3d4047)">9.4 GB of 10 GB used. At 10 GB new mail is refused by the server. Empty Trash or delete large attachments.</span>
        </div>
      </nav>
      <div style="flex: 1 1 auto"></div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">d</span> &nbsp;Could not be delivered: the notice sits on the sent message itself, in Sent and in the conversation</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <article aria-label="Message from you, today 07:20, not delivered" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px)">
        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
          <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: var(--sc-primary-deep, #234a78); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">OB</span>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">
            <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: var(--sc-work-ink, #1b1c1d); white-space: nowrap">You</strong><span style="flex: 1 1 auto"></span><span style="flex: none; color: var(--sc-work-ink, #1b1c1d)">Today 07:20</span></div>
            <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: var(--sc-work-ink, #1b1c1d)">marc.dubois@ville-lyon.fr</span></div>
          </div>
        </div>
        <div style="padding: 10px 14px 14px 56px; display: flex; flex-direction: column; gap: 10px; color: var(--sc-work-text, #3d4047)">
          <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid var(--sc-accent, #cc0000); border-radius: var(--sc-radius, 8px); background: #fbeaea; font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--sc-accent, #cc0000)"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg><span><strong style="font-weight: 600">Could not be delivered</strong> to marc.dubois@ville-lyon.fr. The server at ville-lyon.fr answered at 07:21: mailbox is full. Nothing more will be tried; the message is still in Sent.</span></div>
          <p style="margin: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Hi Marc, the afternoon works for us. Shall we say 14:00 on 2 November, same room as the first kick-off?</p>
        </div>
      </article>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">e</span> &nbsp;Delegation: a notice when an account is handed to you and another when that ends</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      
        <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid var(--sc-primary, #3669a5); border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)">
          <span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">MV</span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span><strong style="font-weight: 600">Marieke de Vries delegated her account to you</strong></span><span style="color: var(--sc-work-text, #3d4047)">You can open marieke@northwind-projects.test beside your own mailbox until 30 October.</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">Today 06:30</span></span>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 12px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap;">Open beside my own</button>
        </div>
      
        <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)">
          <span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">NS</span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span><strong style="font-weight: 600">Your access to the account of Northwind support ended</strong></span><span style="color: var(--sc-work-text, #3d4047)">Tom Achterberg took away your access to support@northwind-projects.test. The folder is gone from your list; mail you sent from it stays in its Sent folder.</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">9 October 17:05</span></span>
          
        </div>
      
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">f</span> &nbsp;New version: one line above the conversation list, the app keeps working until you reload</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div role="status" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 16px; box-sizing: border-box; background: var(--sc-primary-light, #eaf0f7); border-bottom: 1px solid var(--sc-work-line, #e4e6ea); font-size: 13px; color: var(--sc-work-ink, #1b1c1d)">
        <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--sc-primary-deep, #234a78)"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>
        <span style="flex: 1 1 auto">A new version of Mail is available, 5.3.0. Reload to use it; your drafts are kept.</span>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 12px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap;">Reload</button>
        <button type="button" aria-label="Dismiss the new version notice" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-muted, #5e6168); display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
        <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Inbox</h2><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">12 conversations</span></div>
      </div>
      <div role="group" aria-label="Filter" style="flex: none; display: flex; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
        <button type="button" aria-pressed="true" style="height: 28px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-primary, #3669a5); background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78);">All</button><button type="button" aria-pressed="false" style="height: 28px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff; color: var(--sc-work-text, #3d4047);">Unread</button><button type="button" aria-pressed="false" style="height: 28px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff; color: var(--sc-work-text, #3d4047);">Linked</button><button type="button" aria-pressed="false" style="height: 28px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff; color: var(--sc-work-text, #3d4047);">Not linked</button>
      </div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        
          <li style="border-bottom: 1px solid var(--sc-work-line, #e4e6ea); background: #ffffff">
            <a href="#" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: var(--sc-work-ink, #1b1c1d); text-decoration: none">
              <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: var(--sc-primary, #3669a5)"></span></span>
              <span style="flex: none; width: 32px; height: 32px; margin-top: 2px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78)">SL</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
