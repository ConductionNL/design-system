<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenProject twin: sign in</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="OpSignIn">

<div style="position: relative; overflow: hidden; font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 15px; line-height: 22px; min-height: 1020px; background: var(--sc-work-ground, #f5f6f8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 16px; box-sizing: border-box">
  <img src="../assets/zuiddrecht/emblem-grijs.svg" alt="" style="position: absolute; right: -90px; bottom: -120px; height: 720px; width: auto; opacity: 0.07" data-sc-logo="emblem-grijs">
  <img src="../assets/zuiddrecht/logo.svg" alt="Gemeente Zuiddrecht" style="position: relative; height: 56px; width: auto" data-sc-logo="logo">
  <main style="position: relative; width: 100%; max-width: 420px; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: 12px; box-shadow: 0 2px 12px rgba(27,28,29,0.06); overflow: hidden">
    <div aria-hidden="true" style="display: flex; height: 5px"><span style="flex: 6; background: var(--sc-accent, #cc0000)"></span><span style="flex: 3; background: var(--sc-primary, #3669a5)"></span><span style="flex: 1; background: var(--sc-accent, #cc0000)"></span></div>
    <div style="padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.25">Sign in to the workplace</h1>
        <p style="margin: 0; font-size: 15px; color: var(--sc-work-muted, #5e6168)">For employees of Gemeente Zuiddrecht. One account for Nextcloud and OpenProject.</p>
      </div>
      <a href="OpHome.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none; box-sizing: border-box">Sign in with your municipal account</a>
      <div style="display: flex; align-items: center; gap: 12px; color: var(--sc-work-muted, #5e6168); font-size: 14px"><span style="flex: 1; height: 1px; background: var(--sc-work-line, #e4e6ea)"></span>or<span style="flex: 1; height: 1px; background: var(--sc-work-line, #e4e6ea)"></span></div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="op-u" style="font-size: 14px; font-weight: 600">User name or email</label>
        <input id="op-u" autocomplete="username" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="op-p" style="font-size: 14px; font-weight: 600">Password</label>
        <input id="op-p" type="password" autocomplete="current-password" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">
      </div>
      <button type="button" style="height: 48px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 15px var(--sc-font, 'Fira Sans'), sans-serif">Sign in</button>
      <a href="#" style="font-size: 14px; align-self: center">Forgot password?</a>
    </div>
  </main>
  <p style="position: relative; margin: 0; font-size: 13px; color: var(--sc-work-muted, #5e6168)">Gemeente Zuiddrecht · OpenProject on the workplace</p>
</div>
</div>
</body>
</html>
