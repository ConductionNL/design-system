<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ConNext film</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="ConNext by Conduction: an 18.75-second 16:9 film, one unbroken camera move through a honeycomb of Nextcloud apps.">
<style>
	:root { --ground: #0A172F; --bar: #102246; --ink: #FFFFFF; --muted: #B6C2DD; --line: #21468B; }
	html, body { margin: 0; background: var(--ground); color: var(--ink); font: 500 14px/1.4 system-ui, sans-serif; }
	#film { display: flex; justify-content: center; }
	#film svg { display: block; max-width: 100%; height: auto; }
	body.player { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 72px; box-sizing: border-box; }
	body.player #film svg { box-shadow: 0 2px 16px rgba(0, 0, 0, 0.4); }
	.player-bar {
		position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
		padding: 10px 16px; background: var(--bar); border-top: 1px solid var(--line); box-sizing: border-box;
	}
	.player-bar button {
		font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--muted); border-radius: 6px;
		padding: 6px 12px; cursor: pointer; min-width: 44px; min-height: 36px;
	}
	.player-bar button[aria-pressed="true"] { background: var(--ink); color: var(--bar); }
	.player-bar button:focus-visible, .player-bar input:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
	.player-bar input[type=range] { flex: 1; min-width: 80px; accent-color: #F36C21; }
	.player-bar output { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 150px; }
	@media (max-width: 560px) { .player-bar { flex-wrap: wrap; } .player-bar output { min-width: 0; } }
</style>
</head>
<body>
<div id="film"></div>
<script type="module" src="./film.js"></script>
</body>
</html>
