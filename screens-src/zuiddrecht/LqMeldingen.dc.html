<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>learniq: meldingsinstellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="LqDashboard" hint-size="100%,1416px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Learniq" version="0.3.9" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Learniq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen under Instellingen.
    // App.vue fills it with src/views/LearniqNotificationSettings.vue: one switch per notification type and quiet
    // hours. Replaces the Learniq section drawn inside Nextcloud's personal settings (decision 11 Oct 2026).
    const sections = [
      { name: 'Meldingen', desc: 'Kies welke meldingen van Learniq je krijgt. Dit geldt alleen voor je eigen account.', rows: [
        { switch: 'Inlevering binnen', hint: 'Een leerling levert een opdracht van jou in.', on: true },
        { switch: 'Verzuimmelding', hint: 'Ouders melden een leerling uit een van je groepen ziek.', on: true },
        { switch: 'Roosterwijziging', hint: 'Een les van jou vervalt, verschuift of krijgt een invaller.', on: true },
        { switch: 'Nieuw bestand in je lesmap', hint: 'Er staat een Word- of PowerPoint-bestand klaar om te importeren.', on: false },
        { switch: 'Herinnering cijfers', hint: 'Een rapportperiode sluit binnen een week en er missen cijfers.', on: true }
      ] },
      { name: 'Stille uren', desc: 'Stel meldingen van Learniq uit tijdens vaste uren. Herinneringen met een deadline komen op tijd binnen.', rows: [
        { switch: 'Stille uren aanzetten', on: true },
        { pair: [{ label: 'Begin', value: '20.00' }, { label: 'Einde', value: '07.30' }] },
        { note: 'Je Nextcloud dwingt stille uren nog niet af. Je keuze blijft bewaard en werkt zodra dat kan.', tone: 'info' }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
