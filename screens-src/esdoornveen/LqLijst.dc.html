<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":931}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [
      { title: '', items: [['Vandaag', 'home', 0, 'LqVandaag.dc.html'], ['Berichten', 'chat', 3, '#']] },
      { title: 'Onderwijs', items: [['Rooster', 'cal', 0, '#'], ['Aanwezigheid', 'queue', 1, '#'], ['Beoordelen', 'check', 3, '#']] },
      { title: 'Studenten', items: [['Studenten', 'people', 0, 'LqLijst.dc.html'], ['Voortgang', 'trend', 0, '#']] },
      { title: 'BPV', items: [['BPV-overzicht', 'pin', 0, 'LqRolB.dc.html'], ['BPV-plekken', 'board', 0, 'LqBord.dc.html'], ['Leerbedrijven', 'org', 0, '#']] }
    ];
    const pill = (bg, fg) => 'display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; white-space: nowrap; background: ' + bg + '; color: ' + fg;
    const S = { ok: pill('#e7f3ea', '#1e6b2a'), run: pill('#e8e6f6', '#4a3f8f'), wait: pill('#fff4de', '#7a4f00'), bad: pill('#fcedec', '#a30000') };
    const data = [
      ['Daan Smits', '2031502', '', 0, '89%', 'bad', 'Geen BPV-plek', 'Sinds 31 augustus zonder leerbedrijf'],
      ['Fleur de Wit', '2031377', 'Technisch Bureau Noord', 64, '81%', 'bad', 'Achter met uren', '32 uur minder dan gepland'],
      ['Lotte Vermeulen', '2031498', 'Havenkranen Zuiddrecht BV', 72, '93%', 'wait', 'Wacht op leerbedrijf', '48 uur wacht 12 dagen op goedkeuring'],
      ['Jesse Kok', '2031420', 'Van Dijk Machinebouw', 96, '95%', 'wait', 'Bezoek plannen', 'Nog geen datum voor de tussenbeoordeling'],
      ['Milan de Groot', '2031456', 'Bakker Techniek BV', 96, '96%', 'run', 'Tussenbeoordeling', 'Dinsdag 13 oktober, 10.00 uur'],
      ['Mohamed El Idrissi', '2031389', 'Kooiman Aandrijftechniek', 120, '97%', 'ok', 'Op schema', 'Tussenbeoordeling gedaan op 1 oktober'],
      ['Sanne Mulder', '2031467', 'Polderpomp BV', 120, '99%', 'ok', 'Op schema', 'Tussenbeoordeling gedaan op 29 september'],
      ['Yusuf Aksoy', '2031344', 'Van Dijk Machinebouw', 96, '98%', 'ok', 'Op schema', 'Tussenbeoordeling op 14 oktober']
    ];
    const rows = data.map(([name, number, company, hours, present, st, status, note]) => {
      const parts = name.split(' ');
      const low = parseInt(present, 10) < 85;
      return { name, number, hours, present, status, note,
        initials: (parts[0][0] + parts[parts.length - 1][0]).toUpperCase(),
        company: company || 'Nog geen leerbedrijf', companyStyle: company ? '' : 'color: #5e6168',
        bar: 'display: block; height: 6px; width: ' + Math.round(hours / 4.8) + '%; background: #5b2e91',
        presStyle: 'font-variant-numeric: tabular-nums; ' + (low ? 'font-weight: 700; color: #a30000' : ''),
        statusStyle: S[st], selectLabel: 'Selecteer ' + name };
    });
    const view = (on) => 'display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; font: 600 14px \'IBM Plex Sans\', sans-serif; ' + (on ? 'border: 0; background: #1b1c1d; color: #ffffff;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d;');
    const cnt = (on) => 'padding: 1px 7px; border-radius: 10px; font-size: 12px; ' + (on ? 'background: #3d4047; color: #ffffff;' : 'background: #f0f1f3; color: #3d4047;');
    const views = [['Aandacht eerst', 24, true], ['Geen BPV-plek', 1, false], ['Uren wachten', 3, false], ['Bezoek plannen', 1, false], ['Aanwezig onder 85%', 2, false]].map(([label, count, on]) => ({ label, count, pressed: on ? 'true' : 'false', style: view(on), countStyle: cnt(on) }));
    return { nav, rows, views };
  }
}
</script>
