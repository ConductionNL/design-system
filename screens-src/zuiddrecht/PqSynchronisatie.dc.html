<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>pipelinq: synchronisatie-instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="PqDashboard" hint-size="100%,1251px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Pipelinq" version="0.5.7" active="E-mail en agenda" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Pipelinq's settings dialog (see PqPersoonlijk), scrolled to E-mail en agenda: which mail accounts are read,
    // which addresses are skipped, and the agenda link. Replaces the sync page drawn inside Nextcloud's personal
    // settings (decision 11 Oct 2026).
    const sections = [
      { name: 'Meldingen', rows: [] },
      { name: 'Contacten', rows: [] },
      { name: 'E-mail en agenda', desc: 'Mail en afspraken gekoppeld aan je klanten. De mail zelf blijft in Nextcloud Mail.', rows: [
        { switch: 'E-mailsynchronisatie aanzetten', hint: 'Mail uit de gekozen accounts komt bij het contact met hetzelfde e-mailadres.', on: true },
        { check: 'p.jansen@zuiddrecht.nl', hint: 'Persoonlijke mailbox', on: true },
        { check: 'klantcontact@zuiddrecht.nl', hint: 'Gedeelde mailbox van klantcontact', on: false },
        { text: 'Overslaan, kommagescheiden', value: 'noreply@zuiddrecht.nl, nieuwsbrief@zuiddrecht.nl', hint: 'Mail van of naar deze adressen wordt niet gekoppeld.' },
        { facts: [['Laatste keer', 'vandaag om 09.40'], ['Gekoppeld', '1.284 mails, 14 sinds vanochtend'], ['Laatste fout', 'geen']] },
        { note: 'Pipelinq bewaart onderwerp, afzender en datum. De inhoud lees je in Nextcloud Mail, en die is standaard alleen voor jou.', tone: 'plain' },
        { buttons: [['Nu synchroniseren', '']] },
        { switch: 'Agendasynchronisatie aanzetten', hint: 'Vervolgacties en afspraken komen in de agenda Pipelinq. Een afspraak met een bekend contact komt bij dat contact.', on: true }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['KvK API, persoonlijke sleutel', 'Prospectverkenning · toegevoegd 12 september', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] },
      { name: 'Rondleiding', rows: [] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
