<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenProject twin: notifications</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; min-height: 1000px">
  <dc-import name="OpHeader" unread="4" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
    <nav aria-label="Notification filters" style="flex: 0 0 264px; width: 264px; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e4e6ea; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; font-size: 15px">
      <button type="button" style="flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 15px 'Fira Sans', sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Mark all as read</button>
      <sc-for list="{{ menu }}" as="g" hint-placeholder-count="2">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span>
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
            <a href="#" aria-current="{{ it.current }}" style="{{ it.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg><span style="flex: 1">{{ it.label }}</span><sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ it.countStyle }}">{{ it.count }}</span></sc-if></a>
          </sc-for>
        </div>
      </sc-for>
      <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; color: #1b1c1d; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg><span style="flex: 1">Notification settings</span></a>
      </div>
    </nav>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <main style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; max-width: 1240px; box-sizing: border-box; width: 100%">
        <section style="display: flex; flex-direction: column; gap: 6px; padding: 4px 0 8px">
          <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Notifications</h1>
          <span style="color: #5e6168">One list for OpenProject and Nextcloud. 4 unread, newest first.</span>
        </section>

        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
          <button type="button" aria-pressed="true" style="{{ chipOn }}">All<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #3d4047; color: #ffffff">7</span></button>
          <button type="button" aria-pressed="false" style="{{ chipOff }}">OpenProject<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #e4e6ea; color: #3d4047">4</span></button>
          <button type="button" aria-pressed="false" style="{{ chipOff }}">Nextcloud<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #e4e6ea; color: #3d4047">3</span></button>
          <span style="flex: 1"></span>
          <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #5e6168">Group by<span style="position: relative; display: inline-flex; align-items: center"><select aria-label="Group by" style="appearance: none; height: 36px; box-sizing: border-box; padding: 0 36px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d"><option>Day</option><option>Work package</option><option>Product</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; color: #5e6168; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
        </div>

        <sc-for list="{{ days }}" as="d" hint-placeholder-count="2">
          <section aria-label="{{ d.title }}" style="display: flex; flex-direction: column; gap: 8px">
            <h2 style="margin: 0; padding: 0 4px; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ d.title }}</h2>
            <ul style="list-style: none; margin: 0; padding: 0; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
              <sc-for list="{{ d.items }}" as="n" hint-placeholder-count="4">
                <li style="{{ n.rowStyle }}">
                  <span aria-hidden="true" style="flex: none; width: 10px; display: flex; justify-content: center; padding-top: 10px"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{ n.dot }}"></span></span>
                  <span style="flex: none; width: 36px; height: 36px; border-radius: 18px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">{{ n.initials }}</span>
                  <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                    <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; line-height: 20px"><span style="font-size: 15px; font-weight: {{ n.weight }}">{{ n.title }}</span><span style="{{ n.productStyle }}">{{ n.product }}</span></span>
                    <span style="color: #3d4047">{{ n.text }}</span>
                    <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; color: #5e6168"><sc-if value="{{ n.hasWp }}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #1b1c1d; font-weight: 600"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{ n.typeColor }}">{{ n.type }}</span><span style="color: var(--sc-link, #3669a5)">#{{ n.wp }}</span><span style="font-weight: 400; color: #5e6168">· {{ n.status }}</span></span></sc-if><span>{{ n.where }}</span></span>
                  </span>
                  <span style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 8px">
                    <span style="font-size: 13px; color: #5e6168; white-space: nowrap">{{ n.time }}</span>
                    <span style="display: flex; gap: 6px"><button type="button" style="{{ btnCompact }}">{{ n.action }}</button><button type="button" aria-label="Mark as read: {{ n.title }}" style="width: 34px; height: 34px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></button></span>
                  </span>
                </li>
              </sc-for>
            </ul>
          </section>
        </sc-for>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const btn = "display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: var(--sc-radius, 8px); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d";
    const chip = "display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; ";
    const chipOn = chip + 'border: 0; background: #1b1c1d; color: #ffffff';
    const chipOff = chip + 'border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d';
    const I = {
      inbox: 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11',
      mention: 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94',
      assigned: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
      watched: 'M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6',
      dates: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM12 14v3M12 20h.01',
      files: 'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z',
      calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
      talk: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'
    };
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 15px; ';
    const active = 'Inbox';
    const pill = (alert) => 'min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; ' + (alert ? 'background: #cc0000; color: #ffffff;' : 'background: #eaf0f7; color: #234a78;');
    const item = ([label, icon, count, alert]) => ({ label, icon: I[icon], count: count ?? '', hasCount: !!count, countStyle: pill(!!alert), current: label === active ? 'page' : 'false', style: base + (label === active ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;') });
    const menu = [
      { title: 'OpenProject', items: [['Inbox', 'inbox', 4], ['Mentioned', 'mention', 2], ['Assigned to me', 'assigned'], ['Watching', 'watched'], ['Date alerts', 'dates', 1, true]] },
      { title: 'Nextcloud', items: [['Files', 'files', 1], ['Calendar', 'calendar', 1], ['Talk', 'talk']] }
    ].map((g) => ({ title: g.title, items: g.items.map(item) }));
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df' };
    const prod = (p) => 'padding: 1px 8px; border-radius: var(--sc-radius, 8px); font-size: 12px; font-weight: 600; ' + (p === 'OpenProject' ? 'background: #eaf0f7; color: #234a78;' : 'background: #f0f1f3; color: #3d4047;');
    const row = (unread) => 'display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px 14px 12px; border-top: 1px solid #eef0f3; ' + (unread ? 'background: #ffffff;' : 'background: #ffffff; opacity: 0.85;');
    const mk = (o) => ({ ...o, initials: o.by.split(' ').map((w) => w[0]).join('').toUpperCase(), productStyle: prod(o.product), rowStyle: row(o.unread), dot: o.unread ? '#3669a5' : 'transparent', weight: o.unread ? 700 : 600, hasWp: !!o.wp, typeColor: TYPE[o.type] || '' });
    const days = [
      { title: 'Today, Monday 12 October', items: [
        mk({ unread: true, by: 'Tom Achterberg', title: 'Tom Achterberg mentioned you', product: 'OpenProject', text: '"@Olivia the folder link now survives a rename of the project. Can you check it against the Lyon plan before Thursday?"', type: 'FEATURE', wp: 58412, status: 'in development', where: 'Northwind rollout Lyon · activity', time: '09:12', action: 'Reply' }),
        mk({ unread: true, by: 'Marc Dubois', title: 'Marc Dubois shared a file with you', product: 'Nextcloud', text: 'Rollout-plan-phase-2-signed.pdf in OpenProject / Northwind rollout Lyon / Contracts', type: '', wp: '', status: '', where: 'Files', time: '08:40', action: 'Open file' }),
        mk({ unread: true, by: 'Priya Raman', title: 'Priya Raman changed the status to in review', product: 'OpenProject', text: 'Gantt PDF export drops trailing columns: fix verified against the Kassel export of 14 weeks.', type: 'BUG', wp: 58231, status: 'in review', where: 'Northwind rollout Lyon · status', time: '08:05', action: 'Open' }),
        mk({ unread: true, by: 'Date alert', title: 'Due in two days', product: 'OpenProject', text: 'Gantt PDF export drops trailing columns is due on Wednesday 14 October.', type: 'BUG', wp: 58231, status: 'in review', where: 'Date alert', time: '07:00', action: 'Open' })
      ] },
      { title: 'Friday 9 October', items: [
        mk({ unread: false, by: 'Tom Achterberg', title: 'Tom Achterberg invited you to a meeting', product: 'Nextcloud', text: 'Rollout review Lyon, phase 2 · Thursday 15 October, 14:00 to 15:00 · video call', type: 'FEATURE', wp: 58412, status: 'in development', where: 'Calendar', time: '16:20', action: 'Accept' }),
        mk({ unread: false, by: 'Tom Achterberg', title: 'Tom Achterberg mentioned you', product: 'OpenProject', text: '"@Olivia I have attached the Keycloak realm export, the Lyon client is in there."', type: 'FEATURE', wp: 58390, status: 'in review', where: 'Northwind rollout Lyon · activity', time: '11:48', action: 'Reply' }),
        mk({ unread: false, by: 'Tom Achterberg', title: 'Tom Achterberg replied in Scope for release 16.5', product: 'Nextcloud', text: '"Fine by me, let us lock the scope on the 23rd."', type: 'EPIC', wp: 57990, status: 'in review', where: 'Talk', time: '10:02', action: 'Open' })
      ] }
    ];
    return { chipOn, chipOff, btnCompact: btn, menu, days };
  }
}
</script>
</body>
</html>
