                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><input type="radio" name="sec-in" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>None</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">not encrypted</span></label>
                  
                </div>
              </fieldset>
            
              <fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
                <legend style="padding: 0; margin: 0 0 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168)">Outgoing server</legend>
                <div style="display: grid; grid-template-columns: 1fr 96px; gap: 8px">
                  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--sc-work-text, #3d4047); min-width: 0">Server<input type="text" value="smtp.northwind-projects.test" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); min-width: 0"></label>
                  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: var(--sc-work-text, #3d4047)">Port<input type="text" value="587" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); width: 100%"></label>
                </div>
                <div role="radiogroup" aria-label="Connection security of the outgoing server" style="display: flex; align-items: center; flex-wrap: wrap; gap: 6px 20px">

                    <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 20px; color: var(--sc-work-ink, #1b1c1d)"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: 1px solid var(--sc-work-field, #c4c7cb); background: #ffffff"></span><input type="radio" name="sec-out" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span>SSL/TLS</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">recommended</span></label>
