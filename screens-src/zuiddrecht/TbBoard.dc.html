    const mkColumns = (phase) => {
      // phase: 'rest' (the card in new), 'drag' (empty slot in new, drop zone in in development), 'dropped' (the card in in development, highlighted)
      const all = phase === 'rest' ? [moving, ...data] : phase === 'dropped' ? [[...moving.slice(0, 3), 'in development', ...moving.slice(4, 6), { attach: 1, landed: true }], ...data] : data;
      const cards = all.map(card);
      const cols = [['new', phase === 'rest' ? 3 : 2, ''], ['in development', phase === 'dropped' ? 3 : 2, 'of 4'], ['in review', 2, ''], ['on hold', 1, ''], ['closed', 1, '']];
      return cols.map(([name, count, limit]) => {
        const st = STATUS[name];
        return {
          name, count: limit ? count + '/' + limit.slice(3) : String(count),
          countLabel: limit ? count + ' work packages, limit ' + limit.slice(3) + ' at a time in this status' : count + ' work packages',
          countStyle: 'flex: none; font-size: 12px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: var(--sc-radius, 8px); white-space: nowrap; ' + (limit ? 'background: #ffffff; color: #234a78; border: 1px solid #3669a5' : 'background: #ffffff; color: #5e6168; border: 1px solid #e4e6ea'),
          dot: 'flex: none; width: 12px; height: 12px; box-sizing: border-box; border-radius: 6px; background: ' + st[0] + '; border: 1.5px solid ' + st[1],
          hasDrop: phase === 'drag' && name === 'in development', hasGhost: phase === 'drag' && name === 'new',
          cards: cards.filter((c) => c.status === name)
        };
      });
    };
    const columnsA = mkColumns('rest'), columnsB = mkColumns('drag'), columnsC = mkColumns('dropped');
    const dragged = card(moving);
    const drag = { ...dragged, aria: 'Moving ' + dragged.aria, style: cardBase + 'position: absolute; left: 132px; top: 50px; width: 214px; transform: rotate(1.5deg); box-shadow: 0 10px 24px rgba(27,28,29,0.22); border-color: #3669a5; cursor: grabbing; z-index: 5' };
    const chipBase = 'height: 28px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font: 600 13px \'Fira Sans\', sans-serif; white-space: nowrap; ';
    const groupBy = ['Status', 'Assignee', 'Version'].map((label, i) => ({ label, on: i === 0 ? 'true' : 'false',
      style: chipBase + (i === 0 ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #3d4047;') }));
    const av = 'width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; ';
    const team = [['Olivia Brandt', 'OB'], ['Tom Achterberg', 'TA'], ['Priya Raman', 'PR'], ['2 more team members', '+2']].map(([name, initials], i) => ({
      name, initials, style: av + (i ? 'margin-left: -8px; ' : '') + (initials.startsWith('+') ? 'background: #eef0f3; color: #3d4047' : 'background: #eaf0f7; color: #234a78')
    }));
    return { groupBy, team, columnsA, columnsB, columnsC, drag };
  }
}
</script>
