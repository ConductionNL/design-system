        <button type="button" aria-haspopup="menu" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap align-self: flex-start"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add action</button>
      </div>

      <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
        <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap;">Save rule</button>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap;">Cancel</button>
        <span style="flex: 1 1 auto"></span>
        <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-accent, #cc0000); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-accent, #cc0000); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap;">Delete rule</button>
      </div>
    </aside>

  </figure>

  <figure style="margin: 0; width: 440px; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">b</span> &nbsp;The Add action menu of the editor, drawn open on its own so it covers nothing</figcaption>
    <div style="height: 520px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
      <h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Then</h3>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        
          <li style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font-size: 13px; line-height: 18px">
            <span><span style="color: var(--sc-work-muted, #5e6168)">Hold the message</span> and tell the sender why it was stopped</span>

          </li>
        
          <li style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font-size: 13px; line-height: 18px">
            <span><span style="color: var(--sc-work-muted, #5e6168)">Add the header</span> X-Northwind-Held: data-leak</span>
            <button type="button" aria-label="Remove action 2" style="flex: none; width: 24px; height: 24px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-muted, #5e6168); display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </li>
        
      </ol>
        <button type="button" aria-expanded="true" aria-controls="ml-rule-actions" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap align-self: flex-start"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add action</button>
        <div id="ml-rule-actions" role="menu" aria-label="Add action" style="position: relative; margin-top: 2px; width: 100%; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10">
          <span style="display: block; padding: 4px 10px 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--sc-work-muted, #5e6168)">What should happen</span>
          
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap; cursor: pointer"><span>Add a footer</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">to every outgoing message</span></button>
          
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap; cursor: pointer"><span>Prefix the subject</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">with a short tag</span></button>
          
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap; cursor: pointer"><span>Add or remove a header</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)"></span></button>
          
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap; cursor: pointer"><span>Redirect or forward</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">to other addresses</span></button>
          
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap; cursor: pointer"><span>Rewrite the recipient with a pattern</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)"></span></button>
          
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap; cursor: pointer"><span>Hold the message</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">and tell the sender</span></button>
          
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap; cursor: pointer"><span>Change the bounce message sent back</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">when delivery fails</span></button>
          
        </div>
    </div>
  </figure>
</div>
