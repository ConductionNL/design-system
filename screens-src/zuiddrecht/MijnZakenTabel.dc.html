<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mijn Zuiddrecht: mijn zaken als tabel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; min-height: 1734px">
  <dc-import name="Kop" active="" signed-in="{{ true }}" crumbs="{{ crumbs }}" hint-size="100%,232px"></dc-import>
  <div style="max-width: 1280px; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <div style="flex: 1 1 260px; max-width: 300px">
      <dc-import name="MijnMenu" active="Mijn zaken" hint-size="100%,760px"></dc-import>
    </div>
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-size: 44px; font-weight: 700">Mijn zaken</h1>
        <p style="margin: 0; font-size: 19px; color: #4a4a4a">23 zaken</p>
      </div>
      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 18px; border-radius: 6px; background: #f4f6f9">
        <label for="namens" style="font-size: 17px; font-weight: 600">Zaken van</label>
        <select id="namens" style="box-sizing: border-box; height: 44px; min-width: 260px; padding: 0 12px; border: 2px solid #5c6470; border-radius: 4px; font: 400 17px 'Fira Sans', sans-serif; background: #ffffff"><option>Iedereen voor wie ik werk</option><option>Mijzelf, Sanne de Vries</option><option>Bakkerij Lindelaan B.V.</option><option>Henk de Vries</option></select>
        <a href="Machtigingen.dc.html" style="font-size: 17px">Toegang tot zaken regelen</a>
      </div>
      <form role="search" aria-label="Zaken zoeken en filteren" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
        <div style="flex: 3 1 300px; display: flex; flex-direction: column; gap: 6px">
          <label for="zoek" style="font-size: 17px; font-weight: 600">Zoek op zaaknummer of onderwerp</label>
          <div style="display: flex">
            <input id="zoek" type="search" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; height: 48px; padding: 0 14px; border: 2px solid #5c6470; border-right: 0; border-radius: 4px 0 0 4px; font: 400 17px 'Fira Sans', sans-serif">
            <button type="submit" style="display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 18px; border: 0; border-radius: 0 4px 4px 0; background: #3669a5; color: #ffffff; font: 600 17px 'Fira Sans', sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"></path></svg>Zoeken</button>
          </div>
        </div>
        <div style="flex: 1 1 170px; display: flex; flex-direction: column; gap: 6px">
          <label for="status" style="font-size: 17px; font-weight: 600">Status</label>
          <select id="status" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 2px solid #5c6470; border-radius: 4px; font: 400 17px 'Fira Sans', sans-serif; background: #ffffff"><option>Alle statussen</option><option>Lopend</option><option>Wacht op u</option><option>Afgerond</option></select>
        </div>
        <div style="flex: 1 1 130px; display: flex; flex-direction: column; gap: 6px">
          <label for="jaar" style="font-size: 17px; font-weight: 600">Jaar</label>
          <select id="jaar" style="box-sizing: border-box; height: 48px; padding: 0 12px; border: 2px solid #5c6470; border-radius: 4px; font: 400 17px 'Fira Sans', sans-serif; background: #ffffff"><option>Alle jaren</option><option>2026</option><option>2025</option><option>2024</option></select>
        </div>
      </form>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 17px">
          <caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Mijn zaken, 1 tot en met 10 van 23</caption>
          <thead>
            <tr style="border-bottom: 2px solid #1a1a1a; text-align: left">
              <th scope="col" style="padding: 12px 16px 12px 0; font-weight: 700; white-space: nowrap">Zaaknummer</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 700">Onderwerp</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 700">Via</th>
              <th scope="col" style="padding: 12px 16px; font-weight: 700">Status</th>
              <th scope="col" style="padding: 12px 0 12px 16px; font-weight: 700; white-space: nowrap">Uiterlijk klaar</th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{ cases }}" as="c" hint-placeholder-count="10">
              <tr style="border-bottom: 1px solid #d3d8df">
                <td style="padding: 14px 16px 14px 0; color: #4a4a4a; white-space: nowrap">{{ c.number }}</td>
                <td style="padding: 14px 16px"><a href="{{ c.href }}" style="font-weight: 600">{{ c.title }}</a></td>
                <td style="padding: 14px 16px; color: #4a4a4a">{{ c.via }}</td>
                <td style="padding: 14px 16px; white-space: nowrap"><span style="{{ c.tag }}">{{ c.status }}</span></td>
                <td style="padding: 14px 0 14px 16px; white-space: nowrap; color: #4a4a4a">{{ c.deadline }}</td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px">
        <span style="font-size: 17px; color: #4a4a4a">1 tot en met 10 van 23 zaken</span>
        <nav aria-label="Paginanummers">
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; gap: 6px">
            <li><a href="#" aria-current="page" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 700; text-decoration: none">1</a></li>
            <li><a href="#" aria-label="Pagina 2" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #d3d8df; border-radius: 4px; font-weight: 600">2</a></li>
            <li><a href="#" aria-label="Pagina 3" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #d3d8df; border-radius: 4px; font-weight: 600">3</a></li>
            <li><a href="#" aria-label="Volgende pagina" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #d3d8df; border-radius: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path></svg></a></li>
          </ul>
        </nav>
      </div>
    </main>
  </div>
  <dc-import name="Voet" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1734}}'>
class Component extends DCLogic {
  renderVals() {
    const tag = (bg, fg) => 'padding: 4px 12px; border-radius: 14px; font-size: 15px; font-weight: 600; background: ' + bg + '; color: ' + fg;
    const tags = { 'Ontvangen': tag('#eaf0f7', '#234a78'), 'In behandeling': tag('#eaf0f7', '#234a78'), 'Wacht op u': tag('#fff4de', '#7a4f00'), 'Afgerond': tag('#f0f1f3', '#3d4047') };
    const rows = [
      ['2026-0082', 'Verlichting fietspad Lindelaan', 'Uzelf', 'Ontvangen', '1 november 2026', 'Zaak.dc.html'],
      ['2026-0061', 'Parkeervergunning binnenstad', 'Uzelf', 'Wacht op u', '25 oktober 2026', 'Zaak.dc.html'],
      ['2026-0074', 'Terrasvergunning Lindelaan 4', 'Bakkerij Lindelaan B.V.', 'In behandeling', '12 november 2026', 'Zaak.dc.html'],
      ['2026-0069', 'Kapvergunning esdoorn achtertuin', 'Henk de Vries', 'In behandeling', '30 oktober 2026', 'Zaak.dc.html'],
      ['2026-0057', 'Extra container voor groente-, fruit- en tuinafval', 'Uzelf', 'Afgerond', '2 oktober 2026', 'ZaakAfgerond.dc.html'],
      ['2026-0048', 'Melding losliggende stoeptegel', 'Uzelf', 'Afgerond', '20 september 2026', 'ZaakAfgerond.dc.html'],
      ['2026-0041', 'Evenementenvergunning straatfeest Lindelaan', 'Uzelf', 'Afgerond', '5 september 2026', 'ZaakAfgerond.dc.html'],
      ['2026-0033', 'Inzameling bedrijfsafval', 'Bakkerij Lindelaan B.V.', 'Afgerond', '28 augustus 2026', 'ZaakAfgerond.dc.html'],
      ['2026-0027', 'Woo-verzoek bomenkap Parkweg', 'Uzelf', 'Afgerond', '14 augustus 2026', 'ZaakAfgerond.dc.html'],
      ['2026-0019', 'Uittreksel basisregistratie personen', 'Henk de Vries', 'Afgerond', '3 juli 2026', 'ZaakAfgerond.dc.html']
    ];
    const cases = rows.map(([number, title, via, status, deadline, href]) => ({ number, title, via, status, deadline, href, tag: tags[status] }));
    return { cases, crumbs: [{ label: 'Home' }, { label: 'Mijn Zuiddrecht', href: 'MijnOverzicht.dc.html' }, { label: 'Mijn zaken' }] };
  }
}
</script>
</body>
</html>
