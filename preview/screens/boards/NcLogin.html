<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextcloud: inloggen</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="NcLogin">

<div style="position: relative; overflow: hidden; font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); min-height: 1020px; background: var(--sc-work-ground, #f5f6f8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 16px; box-sizing: border-box">
  <img src="../assets/zuiddrecht/emblem-grijs.svg" alt="" style="position: absolute; right: -90px; bottom: -120px; height: 720px; width: auto; opacity: 0.07" data-sc-logo="emblem-grijs">
  <img src="../assets/zuiddrecht/logo.svg" alt="Gemeente Zuiddrecht" style="position: relative; height: 56px; width: auto" data-sc-logo="logo">
  <main style="position: relative; width: 100%; max-width: 420px; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: 12px; box-shadow: 0 2px 12px rgba(27,28,29,0.06); overflow: hidden">
    <div aria-hidden="true" style="display: flex; height: 5px"><span style="flex: 6; background: var(--sc-accent, #cc0000)"></span><span style="flex: 3; background: var(--sc-primary, #3669a5)"></span><span style="flex: 1; background: var(--sc-accent, #cc0000)"></span></div>
    <div style="padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">Inloggen bij de werkplek</h1>
        <p style="margin: 0; font-size: 15px; color: var(--sc-work-muted, #5e6168)">Voor medewerkers van Gemeente Zuiddrecht.</p>
      </div>
      <a href="DqDashboard.html" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 8px; background: var(--sc-primary, #3669a5); color: #ffffff; font-weight: 600; text-decoration: none">Inloggen met uw gemeenteaccount</a>
      <div style="display: flex; align-items: center; gap: 12px; color: var(--sc-work-muted, #5e6168); font-size: 14px"><span style="flex: 1; height: 1px; background: var(--sc-work-line, #e4e6ea)"></span>of<span style="flex: 1; height: 1px; background: var(--sc-work-line, #e4e6ea)"></span></div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="nc-u" style="font-size: 14px; font-weight: 600">Gebruikersnaam of e-mail</label>
        <input id="nc-u" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a929e; border-radius: 8px; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="nc-p" style="font-size: 14px; font-weight: 600">Wachtwoord</label>
        <input id="nc-p" type="password" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #8a929e; border-radius: 8px; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif">
      </div>
      <button type="button" style="height: 46px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: 8px; background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 15px var(--sc-font, 'Fira Sans'), sans-serif">Inloggen</button>
      <a href="#" style="font-size: 14px; align-self: center">Wachtwoord vergeten?</a>
    </div>
  </main>
  <p style="position: relative; margin: 0; font-size: 13px; color: var(--sc-work-muted, #5e6168)">Gemeente Zuiddrecht · werkplek op Nextcloud</p>
</div>
</div>
</body>
</html>
