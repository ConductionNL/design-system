    ];
    const rows = data.map(([title, type, domain, end, ic]) => ({ title, type, typeStyle: K[type], domain, end, icon: I[ic], iconBg: ic === 'org' ? '#eaf0f7' : '#f0f1f3', iconFg: ic === 'org' ? '#234a78' : '#3d4047', selectLabel: 'Selecteer ' + title, checked: false, unchecked: true, trStyle: 'border-top: 1px solid #eef0f3' }));
