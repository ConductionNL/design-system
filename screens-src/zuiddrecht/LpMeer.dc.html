<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: het menu Meer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.lp-meer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
@media (max-width: 960px){
  .lp-meer{grid-template-columns:minmax(0,1fr)}
}
</style>
</helmet>
<div role="menu" aria-label="Meer" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; position: absolute; z-index: 6; top: 48px; right: 0; width: 600px; box-sizing: border-box; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 10px; box-shadow: 0 12px 32px rgba(27,28,29,0.18); padding: 10px 10px 0">
  <div class="lp-meer">
  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
    <span style="padding: 10px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ listTitle }}</span>
    <div style="position: relative">
    <sc-if value="{{ isAllBool }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; top: 2px; right: 0; width: 6px; height: 300px; border-radius: 3px; background: #eef0f3"><span style="position: absolute; top: 0; left: 0; width: 6px; height: 210px; border-radius: 3px; background: #c5c9d1"></span></span></sc-if>
    <div role="group" aria-label="{{ listTitle }}" style="{{ listStyle }}">
      <sc-for list="{{ dashboards }}" as="m" hint-placeholder-count="8">
        <div role="menuitemradio" aria-checked="{{ m.checked }}" aria-label="{{ m.label }}" style="{{ m.style }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="{{ m.icon }}"></path></svg><a href="#" style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: inherit; text-decoration: none">{{ m.label }}</a><sc-if value="{{ m.hasMeta }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ m.meta }}</span></sc-if><button type="button" aria-pressed="{{ m.fav }}" aria-label="{{ m.favLabel }}" title="{{ m.favTitle }}" style="{{ m.starStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ m.star }}"></path></svg></button></div>
      </sc-for>
    </div>
    </div>
    <a href="#" role="menuitem" aria-expanded="{{ isAll }}" style="{{ toggleStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="{{ toggleIcon }}"></path></svg><span style="flex: 1; min-width: 0">{{ toggleLabel }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ toggleMeta }}</span></a>
  </div>
  <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
    <span style="padding: 10px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Dit dashboard</span>
    <sc-for list="{{ actions }}" as="a" hint-placeholder-count="8">
      <a href="#" role="menuitem" style="{{ a.style }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="{{ a.icon }}"></path></svg><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ a.label }}</span></a>
    </sc-for>
    <a href="#" role="menuitem" aria-haspopup="true" aria-expanded="{{ expanded }}" style="{{ settingsStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="{{ cog }}"></path></svg><span style="flex: 1; min-width: 0">Instellingen</span><svg width="18" height="18" viewBox="0 0 24 24" fill="#5e6168" aria-hidden="true" style="flex: none"><path d="{{ chevron }}"></path></svg></a>
    <sc-if value="{{ isExpanded }}" hint-placeholder-val="{{ true }}">
      <div role="group" aria-label="Instellingen" style="display: flex; flex-direction: column; gap: 2px; margin: 0 0 4px 18px; padding-left: 8px; border-left: 2px solid #e4e6ea">
        <sc-for list="{{ settings }}" as="s" hint-placeholder-count="10">
          <a href="#" role="menuitem" style="{{ s.style }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none"><path d="{{ s.icon }}"></path></svg><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.label }}</span></a>
        </sc-for>
      </div>
    </sc-if>
  </div>
  </div>
  <div style="margin-top: 10px; padding: 10px 10px 12px; border-top: 1px solid #eef0f3; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 12px; color: #5e6168">
    <span>Powered by</span>
    <img src="../../../brand/assets/partners/sendent.png" alt="sendent" style="height: 15px; width: auto">
    <span aria-hidden="true" style="width: 1px; height: 14px; background: #e4e6ea"></span>
    <img src="../../../brand/assets/wordmark-conduction-gold.svg" alt="Conduction" style="height: 13px; width: auto">
  </div>
</div>
</x-dc>

</body>
</html>
