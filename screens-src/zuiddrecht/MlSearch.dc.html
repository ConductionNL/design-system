<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: search across folders with work package filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
mark{background:#eaf0f7;color:inherit;border-radius:2px;padding:0 1px}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1586px; padding: 24px 0; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <sc-for list="{{ frames }}" as="fr" hint-placeholder-count="2">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px">
    <figcaption style="padding: 0 16px; font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">{{ fr.letter }}</span> &nbsp;{{ fr.caption }}</figcaption>
    <div style="{{ fr.frame }}">
    <div style="position: relative; display: flex; flex-direction: column; height: 1000px; background: #f5f6f8; overflow: hidden">
  <dc-import name="MlHeader" placeholder="#58231 gantt" hint-size="100%,55px"></dc-import>
  <sc-if value="{{ fr.filters }}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="Search filters" style="position: absolute; left: 437px; top: 68px; width: 760px; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10">
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px 12px; padding: 4px 8px">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="7">
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: #1b1c1d; min-width: 0">
          <span style="white-space: nowrap">{{ f.label }}</span>
          <span style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font-size: 15px; font-weight: 400; color: {{ f.color }}; min-width: 0">
            <sc-if value="{{ f.hasType }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #ab0000">BUG</span></sc-if>
            <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ f.value }}</span>
            <sc-if value="{{ f.hasClear }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Clear {{ f.label }}" style="flex: none; width: 28px; height: 28px; margin-right: -6px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></sc-if>
            <sc-if value="{{ f.hasCaret }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></sc-if>
          </span>
        </label>
      </sc-for>
      <label style="display: flex; align-items: center; gap: 8px; align-self: end; height: 40px; font-size: 14px; color: #1b1c1d; white-space: nowrap"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Has attachment</label>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 8px 4px; border-top: 1px solid #e4e6ea; margin-top: 10px">
      <span style="font-size: 14px; font-weight: 600; color: #1b1c1d; white-space: nowrap">Work package link</span>
      <div role="group" aria-label="Linked to a work package" style="display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); overflow: hidden">
        <button type="button" aria-pressed="false" style="height: 34px; padding: 0 12px; border: 0; background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif">All</button>
        <button type="button" aria-pressed="true" style="height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; background: #eaf0f7; color: #234a78; font: 600 14px 'Fira Sans', sans-serif">Linked</button>
        <button type="button" aria-pressed="false" disabled title="Not possible while a work package is chosen" style="height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; background: #f5f6f8; color: #c4c7cb; font: 600 14px 'Fira Sans', sans-serif">Not linked</button>
      </div>
    </div>
    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 8px 8px 4px">
      <button type="button" style="height: 34px; padding: 0 12px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Clear filters</button>
      <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Search</button>
    </div>
  </div>
  </sc-if>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="" folded="true" hint-size="64px,945px"></dc-import></div>
    <section aria-label="Search results" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
        <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Results</h1><span title="Searched Inbox, Sent, Archive and Customers. Spam and Trash are left out; the Folder filter includes them." style="font-size: 13px; color: #5e6168; white-space: nowrap; text-decoration: underline dotted #c4c7cb; text-underline-offset: 3px">4 conversations</span></div>
        <div style="display: flex; gap: 2px; flex: none">
          <button type="button" aria-label="Search filters, 2 set: From Jana Köhler, Work package #58231" title="Search filters, 2 set" aria-haspopup="dialog" aria-expanded="{{ fr.filtersAria }}" style="{{ fr.filterBtn }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg><span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: #3669a5; color: #ffffff; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center">2</span></button>
          <button type="button" aria-label="Sort results" aria-haspopup="menu" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path></svg></button>
        </div>
      </div>
      <div style="flex: none; height: 1px; background: #e4e6ea"></div>
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
        <h2 style="margin: 0; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 16px; box-sizing: border-box; background: #f5f6f8; border-bottom: 1px solid #e4e6ea; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; white-space: nowrap"><span>{{ g.title }}</span><sc-if value="{{ g.hasWp }}" hint-placeholder-val="{{ true }}"><span style="color: #ab0000">BUG</span><span style="color: #3d4047; letter-spacing: 0">#58231</span></sc-if></h2>
        <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
            <li style="{{ r.style }}">
              <a href="{{ r.href }}" aria-current="{{ r.current }}" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
                <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
                <span style="{{ r.avatar }}">{{ r.initials }}</span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 0">
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                    <span style="{{ r.sender }}">{{ r.from }}</span>
                    <sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if>
                    <sc-if value="{{ r.hasFolder }}" hint-placeholder-val="{{ false }}"><span style="flex: none; height: 18px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #5e6168; font-size: 11px; line-height: 18px; white-space: nowrap">{{ r.folder }}</span></sc-if>
                    <span style="flex: 1 1 auto"></span>
                    <span style="{{ r.dateStyle }}">{{ r.date }}</span>
                  </span>
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                    <span style="{{ r.subjectStyle }}"><sc-for list="{{ r.subjectParts }}" as="p" hint-placeholder-count="2"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></span>
                    <sc-if value="{{ r.hasAttach }}" hint-placeholder-val="{{ true }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 2px; color: #5e6168; font-size: 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.attachIcon }}"></path></svg>{{ r.attachCount }}</span></sc-if>
                  </span>
                  <span style="display: flex; align-items: center; gap: 8px; height: 20px">
                    <sc-if value="{{ r.hasChip }}" hint-placeholder-val="{{ true }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; line-height: 1; white-space: nowrap"><span style="{{ r.chipType }}">{{ r.wpType }}</span><span style="color: #3d4047">{{ r.wpNumber }}</span><span style="{{ r.chipDot }}"></span><span style="color: #3d4047">{{ r.wpStatus }}</span></span></sc-if>
                    <sc-if value="{{ r.bundled }}" hint-placeholder-val="{{ false }}"><span style="{{ r.chipDot }}"></span></sc-if>
                    <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><sc-for list="{{ r.snippetParts }}" as="p" hint-placeholder-count="2"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></span>
                  </span>
                </span>
              </a>
            </li>
          </sc-for>
        </ol>
      </sc-for>
    </section>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="position: sticky; top: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; align-items: flex-start; gap: 6px">
          <button type="button" aria-label="Star this conversation" aria-pressed="false" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
          <h1 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 20px; font-weight: 700; line-height: 34px"><mark>Gantt</mark> export cuts off the last week</h1>
          <button type="button" aria-label="Close conversation" title="Close conversation" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
          <div role="toolbar" aria-label="Conversation actions" style="display: flex; gap: 2px">
            <sc-for list="{{ tools }}" as="t" hint-placeholder-count="4"><span style="position: relative; display: inline-flex"><button type="button" aria-label="{{ t.label }}" title="{{ t.label }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><sc-if value="{{ t.hasLabel }}" hint-placeholder-val="{{ false }}">{{ t.label }}</sc-if></button><sc-if value="{{ t.tip }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 56px; bottom: 38px; padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 5">{{ t.label }}</span></sc-if></span></sc-for>
                <button type="button" aria-haspopup="menu" aria-label="More actions for this conversation" style="display: inline-flex; align-items: center; gap: 4px; height: 34px; margin-left: 4px; padding: 0 8px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          </div>
          <div style="flex: none; display: flex; align-items: center; gap: 6px">
            <button type="button" aria-label="Expand all messages" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg>Expand all</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
          <span style="white-space: nowrap">1 work package</span>
          <button type="button" aria-expanded="true" aria-label="Open work package BUG #58231, in development" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 12px 'Fira Sans', sans-serif; line-height: 1; white-space: nowrap; color: #3d4047; cursor: pointer"><span style="font-weight: 700; letter-spacing: 0.04em; color: #ab0000">BUG</span><span>#58231</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
          <span style="white-space: nowrap">3 messages · Inbox</span>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px">
        <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="2">
          <button type="button" aria-expanded="false" aria-label="Show the whole message from {{ m.from }}, {{ m.date }}" title="Show the whole message" style="{{ m.style }}">
            <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
            <span style="{{ m.avatar }}">{{ m.initials }}</span>
            <span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span>
            <span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left"><sc-for list="{{ m.snippetParts }}" as="p" hint-placeholder-count="2"><span style="{{ p.style }}">{{ p.t }}</span></sc-for></span>
            <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.date }}</span>
          </button>
        </sc-for>
        <article aria-label="Message from Jana Köhler, today 04:00" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
            <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">JK</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Jana Köhler</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">jana.koehler@stadtwerke-kassel.example</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 04:00</span></div>
              <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
            </div>
            <button type="button" aria-label="More actions for this message" aria-haspopup="menu" style="flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
          </div>
          <div style="padding: 12px 14px 0 88px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
            <p style="margin: 0">Hello Olivia,</p>
            <p style="margin: 0">The last week of the plan is still missing on the PDF, see the two screenshots. The <mark>Gantt</mark> on screen is complete, only the export cuts it off. We need the export for the board on Thursday.</p>
            <p style="margin: 0">I saw that Priya picked up <mark>#58231</mark>. Is there a date for 16.5?</p>
            <p style="margin: 0">Kind regards,<br>Jana</p>
            <button type="button" aria-expanded="false" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; height: 28px; margin-left: -6px; padding: 0 8px 0 6px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>Show quoted text</button>
          </div>
          <div style="margin: 12px 14px 0 88px; padding-top: 10px; border-top: 1px solid #e4e6ea; display: flex; flex-direction: column; gap: 4px">
            <span style="font-size: 12px; font-weight: 600; color: #5e6168">2 attachments</span>
            <sc-for list="{{ files }}" as="f" hint-placeholder-count="2">
              <div style="display: flex; align-items: center; gap: 8px; height: 30px; font-size: 13px">
                <span style="{{ f.badge }}">{{ f.ext }}</span>
                <a href="#" style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sc-link, #3669a5); text-decoration: none">{{ f.name }}</a>
                <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ f.meta }}</span>
