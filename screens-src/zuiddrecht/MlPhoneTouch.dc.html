<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: app start, touch gestures and writing on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2280px; padding: 28px 24px; display: grid; grid-template-columns: repeat(4, 330px); grid-template-rows: auto auto auto; gap: 24px; justify-content: center; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 330px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Native app: sign in through the system browser (the app never sees your password; Help says so)</figcaption>
    <div style="{{ phone }} background: #ffffff; justify-content: center; align-items: center; padding: 0 28px; gap: 12px; text-align: center">
      <span style="width: 64px; height: 64px; border-radius: 16px; background: #3669a5; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
      <h2 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 28px">Mail</h2>
      <p style="margin: 0; font-size: 13px; line-height: 19px; color: #5e6168">The app for iPhone and Android. Your mail, your work packages, in your pocket.</p>
      <label style="width: 100%; display: flex; flex-direction: column; gap: 4px; margin-top: 12px; text-align: left; font-size: 12px; color: #5e6168">Server address<input type="url" value="mail.northwind-projects.test" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
      <button type="button" title="Your browser opens the sign-in page of Northwind Projects and hands you back to the app. The app never sees your password." style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"></path></svg>Sign in with your browser</button>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid #e4e6ea; background: #f5f6f8; font-size: 12px; line-height: 18px; color: #3d4047; text-align: left">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#3669a5" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
        <span>Opening <strong style="font-weight: 600">id.northwind-projects.test</strong> in your browser</span>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 330px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Web client in the browser: install it as an app</figcaption>
    <div style="{{ phone }} background: #ffffff">
      <div style="flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #eef0f3; border-bottom: 1px solid #e4e6ea; font-size: 13px; color: #3d4047">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg>
        <span style="flex: 1 1 auto; min-width: 0; height: 30px; box-sizing: border-box; padding: 0 10px; border-radius: 15px; background: #ffffff; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg>mail.northwind-projects.test</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>
      </div>
      <header style="flex: none; height: 48px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #3669a5; color: #ffffff">
        <button type="button" aria-label="Mailboxes" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
        <strong style="flex: 1 1 auto; font-size: 17px; font-weight: 600">Inbox</strong>
        <span style="width: 30px; height: 30px; border-radius: 15px; background: #ffffff; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font: 700 12px 'Fira Sans', sans-serif">OB</span>
      </header>
      <ol style="flex: 1 1 auto; min-height: 0; overflow: hidden; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
          <li style="border-bottom: 1px solid #e4e6ea; background: #ffffff">
            <div style="display: flex; align-items: flex-start; gap: 8px; height: 72px; box-sizing: border-box; padding: 8px 12px 8px 4px; color: #1b1c1d">
              <span style="flex: none; width: 8px; height: 56px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
              <span style="{{ r.avatar }}">{{ r.initials }}</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                <span style="display: flex; align-items: center; gap: 6px; height: 19px"><span style="{{ r.sender }}">{{ r.from }}</span><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                <span style="{{ r.subjectStyle }}">{{ r.subject }}</span>
                <span style="height: 18px; font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span>
              </span>
            </div>
          </li>
        </sc-for>
      </ol>
      <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.45); display: flex; flex-direction: column; justify-content: flex-end">
        <div role="dialog" aria-modal="true" aria-labelledby="ml-install-title" style="display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 16px; background: #ffffff; border-radius: var(--sc-radius-lg, 10px) var(--sc-radius-lg, 10px) 0 0; box-shadow: 0 -4px 12px rgba(27,28,29,0.12)">
          <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #c4c7cb"></span>
          <div style="display: flex; align-items: center; gap: 12px">
            <span style="flex: none; width: 48px; height: 48px; border-radius: 12px; background: #3669a5; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
            <div style="display: flex; flex-direction: column; min-width: 0"><h3 id="ml-install-title" style="margin: 0; font-size: 16px; font-weight: 600; line-height: 22px">Install Mail as an app</h3><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">mail.northwind-projects.test</span></div>
          </div>
          <p style="margin: 0; font-size: 13px; line-height: 19px; color: #3d4047">It gets its own icon on your home screen, opens full screen and keeps you signed in. Notifications work as in the native app.</p>
          <div style="display: flex; gap: 8px">
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; height: 44px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif">Not now</button>
            <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Install</button>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 330px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Lock screen. Tap the notification to open the conversation in the app, straight after unlocking</figcaption>
    <div style="{{ phone }} background: #1b1c1d; color: #ffffff; align-items: center; padding: 56px 16px 0; gap: 4px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #c4c7cb"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      <span style="font-size: 64px; font-weight: 500; line-height: 72px; letter-spacing: -0.02em">07:02</span>
      <span style="font-size: 15px; color: #c4c7cb">Monday 12 October</span>
      <div role="button" tabindex="0" aria-label="Tap to open the conversation Request for a demo, 1,200 users" style="width: 100%; margin-top: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,0.94); color: #1b1c1d">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5e6168">
          <span style="width: 20px; height: 20px; border-radius: 5px; background: #3669a5; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
          <span style="font-weight: 600; color: #3d4047">Mail</span><span style="flex: 1 1 auto"></span><span>now</span>
        </div>
        <strong style="font-size: 14px; font-weight: 600; line-height: 20px">Sven Lindqvist</strong>
        <span style="font-size: 14px; line-height: 20px">Request for a demo, 1,200 users</span>
        <span style="font-size: 13px; line-height: 19px; color: #5e6168">We are evaluating OpenProject for all of Malmö Energi, about 1,200 users. Could you show us the Nextcloud link?</span>
      </div>
      <span aria-hidden="true" style="position: absolute; bottom: 10px; width: 120px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.6)"></span>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 330px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;List: pulled down to refresh</figcaption>
    <div style="{{ phone }} background: #ffffff">
      <header style="flex: none; height: 55px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #3669a5; color: #ffffff">
        <button type="button" aria-label="Mailboxes" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
        <strong style="flex: 1 1 auto; font-size: 17px; font-weight: 600">Inbox</strong>
        <button type="button" aria-label="Search" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg></button>
        <span style="width: 30px; height: 30px; margin: 0 5px; border-radius: 15px; background: #ffffff; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font: 700 12px 'Fira Sans', sans-serif">OB</span>
      </header>
      <div role="status" style="flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; background: #eaf0f7; color: #234a78; font-size: 13px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>Release to refresh
      </div>
      <ol style="flex: 1 1 auto; min-height: 0; overflow: hidden; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
          <li style="border-bottom: 1px solid #e4e6ea; background: #ffffff">
            <div style="display: flex; align-items: flex-start; gap: 8px; height: 72px; box-sizing: border-box; padding: 8px 12px 8px 4px; color: #1b1c1d">
              <span style="flex: none; width: 8px; height: 56px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
              <span style="{{ r.avatar }}">{{ r.initials }}</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                <span style="display: flex; align-items: center; gap: 6px; height: 19px"><span style="{{ r.sender }}">{{ r.from }}</span><sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                <span style="{{ r.subjectStyle }}">{{ r.subject }}</span>
                <span style="height: 18px; font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span>
              </span>
            </div>
          </li>
        </sc-for>
      </ol>
      <nav aria-label="Apps" style="flex: none; height: 56px; display: flex; border-top: 1px solid #e4e6ea; background: #ffffff">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><a href="#" aria-current="{{ t.current }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><span>{{ t.label }}</span></a></sc-for>
      </nav>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 330px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;List: one row swiped half open</figcaption>
    <div style="{{ phone }} background: #ffffff">
      <header style="flex: none; height: 55px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #3669a5; color: #ffffff">
        <button type="button" aria-label="Mailboxes" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
        <strong style="flex: 1 1 auto; font-size: 17px; font-weight: 600">Inbox</strong>
        <button type="button" aria-label="Search" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg></button>
        <span style="width: 30px; height: 30px; margin: 0 5px; border-radius: 15px; background: #ffffff; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font: 700 12px 'Fira Sans', sans-serif">OB</span>
      </header>
      <ol style="flex: 1 1 auto; min-height: 0; overflow: hidden; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{ swipeRows }}" as="r" hint-placeholder-count="7">
          <li style="position: relative; border-bottom: 1px solid #e4e6ea; background: #ffffff; overflow: hidden">
            <sc-if value="{{ r.swiped }}" hint-placeholder-val="{{ false }}">
              <div role="group" aria-label="Swipe actions: Archive, Delete, Mark as read" style="position: absolute; inset: 0; display: flex; justify-content: flex-end">
                <button type="button" style="width: 60px; border: 0; background: #234a78; color: #ffffff; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 11px 'Fira Sans', sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"></path></svg>Archive</button>
                <button type="button" style="width: 60px; border: 0; background: #3669a5; color: #ffffff; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 11px 'Fira Sans', sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>Mark as read</button>
                <button type="button" style="width: 60px; border: 0; background: #cc0000; color: #ffffff; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 11px 'Fira Sans', sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Delete</button>
              </div>
            </sc-if>
            <div style="{{ r.rowStyle }}">
              <span style="flex: none; width: 8px; height: 56px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
              <span style="{{ r.avatar }}">{{ r.initials }}</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                <span style="display: flex; align-items: center; gap: 6px; height: 19px"><span style="{{ r.sender }}">{{ r.from }}</span><sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                <span style="{{ r.subjectStyle }}">{{ r.subject }}</span>
                <span style="height: 18px; font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span>
              </span>
            </div>
          </li>
        </sc-for>
      </ol>
      <nav aria-label="Apps" style="flex: none; height: 56px; display: flex; border-top: 1px solid #e4e6ea; background: #ffffff">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><a href="#" aria-current="{{ t.current }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><span>{{ t.label }}</span></a></sc-for>
      </nav>
    </div>
