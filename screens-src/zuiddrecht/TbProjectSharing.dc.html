<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: project details with the members tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#tb-filter::placeholder,#tb-prj-add::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1600px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The project details open beside the board, on the Members tab</figcaption>
    <div style="position: relative; height: 1040px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" folded="true" hint-size="64px,985px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">9 open work packages</span></div>
        <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
          <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>
        </div>
        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Status. Choose assignee or version" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Status<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <div style="flex: 1 1 auto"></div>
        <button type="button" aria-pressed="false" aria-haspopup="dialog" aria-keyshortcuts="F" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter</button>
        <button type="button" aria-pressed="true" aria-haspopup="dialog" aria-label="Project details" title="Project details" style="flex: none; width: 34px; height: 30px; border: 1px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg></button>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; gap: 10px; padding: 12px; overflow: hidden">
        <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
          <section aria-label="{{ col.name }}" style="flex: 0 0 226px; width: 226px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; align-self: flex-start; max-height: 100%">
            <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px">
              <span style="{{ col.dot }}"></span>
              <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.name }}</h2>
              <span aria-label="{{ col.countLabel }}" style="{{ col.countStyle }}">{{ col.count }}</span>
              <button type="button" aria-label="New work package with status {{ col.name }}" style="flex: none; width: 22px; height: 26px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
            </div>
            <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
              <a href="{{ c.href }}" aria-label="{{ c.aria }}" style="{{ c.style }}">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="{{ c.typeStyle }}">{{ c.type }}</span><span style="color: #3d4047">{{ c.number }}</span><span style="flex: 1 1 auto"></span><sc-if value="{{ c.high }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff9d2e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Priority high"><path d="m6 13 6-6 6 6M6 19l6-6 6 6"></path></svg></sc-if><sc-if value="{{ c.normal }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c4c7cb" stroke-width="2.25" stroke-linecap="round" role="img" aria-label="Priority normal"><path d="M6 10h12M6 14h12"></path></svg></sc-if></span>
                <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">{{ c.subject }}</span>
                <sc-if value="{{ c.hasMail }}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">From mail: {{ c.mailFrom }}</span></span></sc-if>
                <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
                  <sc-if value="{{ c.hasAssignee }}" hint-placeholder-val="{{ true }}"><span title="{{ c.assignee }}" role="img" aria-label="Assignee {{ c.assignee }}" style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ c.initials }}</span></sc-if>
                  <sc-if value="{{ c.hasDue }}" hint-placeholder-val="{{ true }}"><span style="{{ c.dueStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{ c.due }}</span></sc-if>
                </span>
              </a>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </main>
    <aside aria-label="Project details" style="flex: 0 0 480px; width: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 16px; border-bottom: 1px solid #e4e6ea">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Project details</span>
        <button type="button" aria-label="Close the project details" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 12px">
        <div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 4px; background: #3669a5"></span><h2 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 22px">Northwind rollout Lyon</h2></div>
        <span style="font-size: 12px; color: #5e6168; line-height: 18px">6 members, owner Olivia Brandt. Project in OpenProject since 14 March.</span>
      </div>
      <div role="tablist" aria-label="Project details" style="flex: none; display: flex; gap: 12px; padding: 0 16px; border-bottom: 1px solid #e4e6ea">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4"><button type="button" role="tab" aria-selected="{{ t.selected }}" style="{{ t.style }}">{{ t.label }}<sc-if value="{{ t.hasCount }}" hint-placeholder-val="{{ true }}"><span style="{{ t.countStyle }}">{{ t.count }}</span></sc-if></button></sc-for>
      </div>
      <div role="tabpanel" aria-label="Members" style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 16px; overflow: hidden">
        <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 12px; line-height: 18px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #3669a5"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg><span>Members and their rights come from OpenProject, except the rows marked Nextcloud only. A change here is saved there, and a change there shows here within a minute.</span></div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <label for="tb-prj-add" style="font-size: 12px; font-weight: 600; color: #5e6168">Add a member</label>
          <div style="position: relative; display: flex; align-items: center">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 10px; color: #5e6168"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.35-4.35"></path></svg>
            <input id="tb-prj-add" type="text" placeholder="Name, group, team, e-mail address, or a person on another server" style="width: 100%; height: 34px; padding: 0 10px 0 34px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 13px 'Fira Sans', sans-serif; color: #1b1c1d">
          </div>
          <span style="font-size: 12px; color: #5e6168; line-height: 18px">People, groups and teams of this workspace, a person by e-mail address, or a person on another server. New members start with Edit.</span>
        </div>
        <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Edit means changing work packages; all three off is read only. Share lets a member add others. Manage also renames, archives and deletes the project.</p>
        <table style="width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px">
          <colgroup><col style="width: 262px"><col style="width: 50px"><col style="width: 50px"><col style="width: 58px"><col style="width: 28px"></colgroup>
          <thead><tr style="height: 30px; border-bottom: 1px solid #e4e6ea"><th scope="col" style="{{ th }}">Member</th><th scope="col" style="{{ th }} text-align: center">Edit</th><th scope="col" style="{{ th }} text-align: center">Share</th><th scope="col" style="{{ th }} text-align: center">Manage</th><th scope="col"><span style="{{ srOnly }}">Remove</span></th></tr></thead>
          <tbody>
            <sc-for list="{{ members }}" as="m" hint-placeholder-count="6">
              <tr style="height: 48px; border-bottom: 1px solid #e4e6ea">
                <td style="padding: 4px 6px 4px 4px; overflow: visible"><span style="display: flex; align-items: center; gap: 8px; min-width: 0"><span style="{{ m.avatarStyle }}"><sc-if value="{{ m.isIcon }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ m.icon }}"></path></svg></sc-if><sc-if value="{{ m.isText }}" hint-placeholder-val="{{ true }}">{{ m.initials }}</sc-if></span><span style="display: flex; flex-direction: column; gap: 2px; line-height: 1.2; min-width: 0"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.name }}</span><sc-if value="{{ m.hasBadges }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; white-space: nowrap"><sc-if value="{{ m.hasTag }}" hint-placeholder-val="{{ false }}"><span style="{{ m.tagStyle }}">{{ m.tag }}</span></sc-if><sc-if value="{{ m.hasServer }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #5e6168">{{ m.server }}</span></sc-if><sc-if value="{{ m.isOwner }}" hint-placeholder-val="{{ false }}"><button type="button" style="{{ btnSmall }}">Transfer ownership</button></sc-if><sc-if value="{{ m.nco }}" hint-placeholder-val="{{ false }}"><span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></sc-if></span></sc-if><span style="font-size: 11px; color: #5e6168; line-height: 14px">{{ m.sub }}</span></span></span></td>
                <sc-if value="{{ m.isOwner }}" hint-placeholder-val="{{ false }}">
                  <td colspan="3" style="padding: 0 6px; text-align: right; font-size: 12px; color: #5e6168; white-space: nowrap">All rights</td>
                  <td></td>
                </sc-if>
                <sc-if value="{{ m.isMember }}" hint-placeholder-val="{{ true }}">
                  <td style="padding: 0 6px; text-align: center"><button type="button" role="switch" aria-checked="{{ m.edit.checked }}" aria-label="{{ m.name }} may edit" style="{{ m.edit.switch }}"><span style="{{ m.edit.knob }}"></span></button></td>
                  <td style="padding: 0 6px; text-align: center"><button type="button" role="switch" aria-checked="{{ m.share.checked }}" aria-label="{{ m.name }} may share" style="{{ m.share.switch }}"><span style="{{ m.share.knob }}"></span></button></td>
                  <td style="padding: 0 6px; text-align: center"><button type="button" role="switch" aria-checked="{{ m.manage.checked }}" aria-label="{{ m.name }} may manage" style="{{ m.manage.switch }}"><span style="{{ m.manage.knob }}"></span></button></td>
                  <td style="padding: 0; text-align: right"><button type="button" aria-label="Remove {{ m.name }} from this project" title="Remove {{ m.name }} from this project" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></td>
                </sc-if>
              </tr>
            </sc-for>
          </tbody>
        </table>
                <div style="display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #5e6168; line-height: 18px; margin-top: auto"><span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span><span>Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud.</span></div>
      </div>
    </aside>
  </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; align-self: flex-start">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The Files and chats tab of the same panel: the folders and chats linked to this project</figcaption>
    <aside aria-label="Project details" style="width: 480px; height: 420px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 8px 0 16px; border-bottom: 1px solid #e4e6ea">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Project details</span>
        <button type="button" aria-label="Close the project details" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 12px">
        <div style="display: flex; align-items: center; gap: 10px"><span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 4px; background: #3669a5"></span><h2 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 22px">Northwind rollout Lyon</h2></div>
        <span style="font-size: 12px; color: #5e6168; line-height: 18px">6 members, owner Olivia Brandt. Project in OpenProject since 14 March.</span>
      </div>
      <div role="tablist" aria-label="Project details" style="flex: none; display: flex; gap: 12px; padding: 0 16px; border-bottom: 1px solid #e4e6ea">
        <sc-for list="{{ tabsB }}" as="t" hint-placeholder-count="5"><button type="button" role="tab" aria-selected="{{ t.selected }}" style="{{ t.style }}">{{ t.label }}<sc-if value="{{ t.hasCount }}" hint-placeholder-val="{{ true }}"><span style="{{ t.countStyle }}">{{ t.count }}</span></sc-if></button></sc-for>
