<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Flow: kop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<section data-or-flow="kop" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
  <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px">
    <div style="flex: 1 1 320px; min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 12px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">{{ title }}</h1>
      <span style="{{ stateStyle }}"><span aria-hidden="true" style="{{ dotStyle }}"></span>{{ stateWord }}</span>
    </div>
    <div style="flex: none; display: flex; flex-wrap: wrap; gap: 10px">
      <sc-if value="{{ hasSwitch }}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 8px; height: 40px"><button type="button" role="switch" aria-checked="{{ switchOn }}" aria-label="{{ switchLabel }}" style="{{ trackStyle }}"><span style="{{ knobStyle }}"></span></button><span style="font-size: 15px; font-weight: 600">{{ switchLabel }}</span></span></sc-if>
      <sc-for list="{{ buttons }}" as="b" hint-placeholder-count="4">
        <button type="button" aria-haspopup="{{ b.menu }}" style="{{ b.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ b.icon }}"></path></svg>{{ b.label }}<sc-if value="{{ b.hasChevron }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"></path></svg></sc-if></button>
      </sc-for>
      <sc-if value="{{ hasBuildiq }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Bewerken in buildiq" title="Bewerken in buildiq" style="display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: 8px; background: #c64e0b; color: #ffffff"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,16L19.36,10.27L21,9L12,2L3,9L4.63,10.27M12,18.54L4.62,12.81L3,14.07L12,21.07L21,14.07L19.37,12.8L12,18.54Z"></path></svg></button></sc-if>
      <sc-if value="{{ hasPrimary }}" hint-placeholder-val="{{ true }}"><button type="button" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #3669a5; color: #ffffff; font: 600 14px 'Fira Sans', sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ primaryIcon }}"></path></svg>{{ primary }}</button></sc-if>
    </div>
  </div>
  <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0">
    <sc-if value="{{ hasPill }}" hint-placeholder-val="{{ true }}"><span style="padding: 3px 10px; border-radius: 12px; background: #f0f1f3; color: #3d4047; font-size: 13px; font-weight: 600">{{ pill }}</span></sc-if>
    <nav aria-label="Kruimelpad" style="font-size: 14px; color: #5e6168; display: flex; gap: 8px"><sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="2"><a href="{{ c.href }}">{{ c.label }}</a><span aria-hidden="true">/</span></sc-for><span aria-current="page">{{ current }}</span></nav>
    <sc-if value="{{ hasMeta }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="color: #5e6168">·</span><span style="font-size: 14px; color: #5e6168">{{ meta }}</span></sc-if>
  </div>
  <sc-if value="{{ hasModes }}" hint-placeholder-val="{{ true }}">
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <div role="group" aria-label="Weergave van de flow" style="display: inline-flex; padding: 3px; border-radius: 10px; background: #eef0f3">
        <sc-for list="{{ modes }}" as="m" hint-placeholder-count="2">
          <a href="{{ m.href }}" aria-current="{{ m.current }}" style="{{ m.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ m.icon }}"></path></svg>{{ m.label }}</a>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #5e6168">{{ modesNote }}</span>
    </div>
  </sc-if>
  <sc-if value="{{ hasNotice }}" hint-placeholder-val="{{ false }}">
    <div role="note" style="{{ noticeStyle }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="{{ noticeIcon }}"></path></svg><span style="font-size: 14px; line-height: 1.45">{{ notice }}</span></div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Melding afhandelen"},"state":{"editor":"text","default":"actief"},"mode":{"editor":"text","default":"canvas"},"crumbs":{"editor":null,"default":[["Flows","OrFlows.dc.html"]]},"current":{"editor":"text","default":""},"meta":{"editor":"text","default":"trigger Record aangemaakt · 8 stappen · versie 5 (concept), live versie 4 draait door tot u publiceert"},"pill":{"editor":"text","default":"Laatste uitvoering vandaag 10:12 klaar"},"actions":{"editor":null,"default":["check","test","run","more"]},"primary":{"editor":"text","default":"Opslaan"},"buildiq":{"editor":null,"default":false},"notice":{"editor":"text","default":""},"noticeLevel":{"editor":"text","default":"info"},"canvasHref":{"editor":"text","default":"OrFlow.dc.html"},"listHref":{"editor":"text","default":"OrFlowLijst.dc.html"},"switch":{"editor":null,"default":true},"$preview":{"width":1100,"height":180}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const J = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return d; } } return v; };
    const B = (v) => v === true || v === 'true';
    const STATES = {
      concept: ['Concept', '#eaf0f7', '#234a78', '#3669a5'],
      actief: ['Actief', '#e7f3ea', '#1e6b2a', '#1e6b2a'],
      gepauzeerd: ['Gepauzeerd', '#fff4de', '#7a4f00', '#b27300'],
      uit: ['Uit', '#f0f1f3', '#3d4047', '#828a95'],
      afgevoerd: ['Afgevoerd', '#f0f1f3', '#5e6168', '#828a95'],
      mislukt: ['Laatste run mislukt', '#fcedec', '#a30000', '#cc0000'],
      bezig: ['Bezig', '#eaf0f7', '#234a78', '#3669a5'],
    };
    const st = STATES[p.state] || STATES.actief;
    const ICON = {
      check: 'M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z',
      test: 'M12,6V9L16,5L12,1V4A8,8 0 0,0 4,12C4,13.57 4.46,15.03 5.24,16.26L6.7,14.8C6.25,13.97 6,13 6,12A6,6 0 0,1 12,6M18.76,7.74L17.3,9.2C17.74,10.04 18,11 18,12A6,6 0 0,1 12,18V15L8,19L12,23V20A8,8 0 0,0 20,12C20,10.43 19.54,8.97 18.76,7.74Z',
      run: 'M8,5.14V19.14L19,12.14L8,5.14Z',
      edit: 'M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z',
      versions: 'M13.5,8H12V13L16.28,15.54L17,14.33L13.5,12.25V8M13,3A9,9 0 0,0 4,12H1L4.96,16.03L9,12H6A7,7 0 0,1 13,5A7,7 0 0,1 20,12A7,7 0 0,1 13,19C11.07,19 9.32,18.21 8.06,16.94L6.64,18.36C8.27,20 10.5,21 13,21A9,9 0 0,0 22,12A9,9 0 0,0 13,3',
      runs: 'M3,13H15V11H3M3,6V8H21V6M3,18H9V16H3V18Z',
      overview: 'M3,3H11V11H3V3M13,3H21V11H13V3M3,13H11V21H3V13M13,13H21V21H13V13Z',
      more: '',
      draft: 'M19,3H14.82C14.4,1.84 13.3,1 12,1C10.7,1 9.6,1.84 9.18,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M12,3A1,1 0 0,1 13,4A1,1 0 0,1 12,5A1,1 0 0,1 11,4A1,1 0 0,1 12,3M7,7H17V5H19V19H5V5H7V7M7,9V11H17V9H7M7,13V15H14V13H7Z',
    };
    const LABEL = { check: 'Controleren', test: 'Testen', run: 'Uitvoeren', edit: 'Bewerken', versions: 'Versies', runs: 'Runs', overview: 'Overzicht', more: 'Meer', draft: 'Conceptversie maken' };
    const base = "display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid #828a95; border-radius: 8px; background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d";
    const buttons = J(p.actions, []).map((a) => {
      const [kind, label] = Array.isArray(a) ? a : [a, LABEL[a] || a];
      return { label, icon: ICON[kind] || '', style: base + (kind === 'more' ? '; gap: 6px' : ''), menu: kind === 'more' ? 'menu' : 'false', hasChevron: kind === 'more' };
    });
    const PRIMARY_ICON = { Opslaan: 'M17 3H5C3.89 3 3 3.9 3 5V19C3 20.1 3.89 21 5 21H19C20.1 21 21 20.1 21 19V7L17 3M19 19H5V5H16.17L19 7.83V19M12 12C10.34 12 9 13.34 9 15S10.34 18 12 18 15 16.66 15 15 13.66 12 12 12M6 6H15V10H6V6Z', Publiceren: 'M5,20H19V18H5M19,9H15V3H9V9H5L12,16L19,9Z' };
    const mode = p.mode || 'canvas';
    const modeStyle = (on) => 'display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600; ' + (on ? 'background: #ffffff; color: #1b1c1d; box-shadow: 0 1px 2px rgba(27,28,29,0.12)' : 'background: transparent; color: #3d4047');
    const modes = [
      { label: 'Canvas', href: p.canvasHref || '#', current: mode === 'canvas' ? 'page' : 'false', style: modeStyle(mode === 'canvas'), icon: 'M2,4V20H22V4H2M4,6H20V18H4V6M6,8V16H8V8H6M10,11V16H12V11H10M14,9V16H16V9H14' },
      { label: 'Lijst', href: p.listHref || '#', current: mode === 'lijst' ? 'page' : 'false', style: modeStyle(mode === 'lijst'), icon: 'M7,5H21V7H7V5M7,13V11H21V13H7M4,4.5A1.5,1.5 0 0,1 5.5,6A1.5,1.5 0 0,1 4,7.5A1.5,1.5 0 0,1 2.5,6A1.5,1.5 0 0,1 4,4.5M4,10.5A1.5,1.5 0 0,1 5.5,12A1.5,1.5 0 0,1 4,13.5A1.5,1.5 0 0,1 2.5,12A1.5,1.5 0 0,1 4,10.5M7,19V17H21V19H7M4,16.5A1.5,1.5 0 0,1 5.5,18A1.5,1.5 0 0,1 4,19.5A1.5,1.5 0 0,1 2.5,18A1.5,1.5 0 0,1 4,16.5Z' },
    ];
    const NOTICE = {
      info: ['#eaf0f7', '#234a78', 'M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z'],
      warning: ['#fff4de', '#7a4f00', 'M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16'],
      error: ['#fcedec', '#a30000', 'M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z'],
    };
    const nt = NOTICE[p.noticeLevel] || NOTICE.info;
    const on = p.state === 'actief' || p.state === 'bezig' || p.state === 'mislukt';
    return {
      title: p.title, stateWord: st[0],
      stateStyle: 'display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 13px; font-weight: 700; background: ' + st[1] + '; color: ' + st[2],
      dotStyle: 'width: 9px; height: 9px; border-radius: 5px; background: ' + st[3],
      hasSwitch: B(p.switch) && p.state !== 'concept' && p.state !== 'afgevoerd',
      switchOn: on ? 'true' : 'false', switchLabel: on ? 'Aan' : 'Uit',
      trackStyle: 'flex: none; position: relative; width: 42px; height: 24px; border: 6px solid transparent; background-clip: padding-box; box-sizing: content-box; margin: -6px; padding: 0; border-radius: 18px; background-color: ' + (on ? '#3669a5' : '#828a95'),
      knobStyle: 'position: absolute; top: 2px; left: ' + (on ? 20 : 2) + 'px; width: 20px; height: 20px; border-radius: 10px; background: #ffffff',
      buttons, hasBuildiq: B(p.buildiq),
      hasPrimary: !!p.primary, primary: p.primary, primaryIcon: PRIMARY_ICON[p.primary] || PRIMARY_ICON.Opslaan,
      hasPill: !!p.pill, pill: p.pill,
      crumbs: J(p.crumbs, []).map((c) => ({ label: c[0], href: c[1] || '#' })),
      current: p.current || p.title,
      hasMeta: !!p.meta, meta: p.meta,
      hasModes: mode === 'canvas' || mode === 'lijst', modes,
      modesNote: mode === 'lijst' ? 'Dezelfde flow en dezelfde stappen als op het canvas; wat u hier wijzigt, staat daar ook.' : 'Dezelfde flow als lijst: de trigger en de stappen op volgorde, voor wie geen canvas wil.',
      hasNotice: !!p.notice, notice: p.notice, noticeIcon: nt[2],
      noticeStyle: 'display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border-radius: 10px; background: ' + nt[0] + '; color: ' + nt[1],
    };
  }
}
</script>
</body>
</html>
