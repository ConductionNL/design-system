<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: edit and share one calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 5166px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Details of the calendar Northwind team, opened from its row in the list, over the clean week; Move up and Move down order your list; Delete this calendar sits at the bottom left</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="245px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
            <button type="button" aria-label="Open the overview" aria-expanded="false" title="Open the overview" style="width: 34px; height: 34px; margin-left: 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
      </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
              <span style="flex: none; color: #3d4047">{{ b.number }}</span>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
      </div>
    </main>
      </div>

      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 32px">
        <div role="dialog" aria-modal="true" aria-labelledby="cl-cal-title" style="width: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); overflow: hidden">
          <div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 16px 0 24px">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <h3 id="cl-cal-title" style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; line-height: 24px"><span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 3px; background: #538b28"></span>Northwind team</h3>
              <span style="font-size: 13px; color: #5e6168; line-height: 19px">Your calendar, 46 events. Shared with 3 people and 1 group; what you change here, they see too.</span>
            </div>
            <button type="button" aria-label="Close" style="flex: none; width: 40px; height: 40px; margin: -8px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div role="tablist" aria-label="Parts of the calendar settings" style="flex: none; display: flex; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid #c4c7cb">
            <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">Details</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Sharing</button>
          </div>
          <div role="tabpanel" aria-label="Details" style="display: flex; flex-direction: column; gap: 16px; padding: 16px 24px 8px">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="cl-cal-name" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Name of the calendar</label>
                <input id="cl-cal-name" type="text" value="Northwind team" style="width: 100%; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
              </div>
              <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
                <legend style="padding: 0; margin: 0 0 4px; float: left; width: 100%; font-size: 12px; font-weight: 600; color: #5e6168">Colour of the calendar</legend>
                <div style="display: flex; align-items: center; gap: 6px; height: 40px">
                  <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="8"><button type="button" role="radio" aria-checked="{{ s.on }}" aria-label="{{ s.name }}" style="{{ s.style }}"></button></sc-for>
                  <input type="text" value="#538b28" aria-label="Own colour" style="width: 96px; height: 40px; margin-left: 4px; padding: 0 10px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
                </div>
              </fieldset>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 24px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px"><span title="Events show in the grid. Tasks also appear as a list under the same name in the Tasks app." style="font-weight: 600">This calendar holds</span></div>
              <div style="flex: none; display: flex; gap: 18px; padding-top: 2px">
                <label style="display: inline-flex; align-items: center; gap: 8px; height: 32px; font-size: 14px; white-space: nowrap"><input type="radio" name="cl-cal-kind" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Events only</label>
                <label style="display: inline-flex; align-items: center; gap: 8px; height: 32px; font-size: 14px; white-space: nowrap"><input type="radio" name="cl-cal-kind" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Events and a task list</label>
              </div>
            </div>

            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <label for="cl-cal-busy" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span title="When someone looks for a free time with you, events here do not block you. Use it for deadlines and public holidays." style="font-weight: 600">Never counts as busy</span></label>
              <button id="cl-cal-busy" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button>
            </div>

            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
                <label for="cl-cal-block" style="font-weight: 600">Also keep busy in</label>
                <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5e6168; line-height: 19px; flex-wrap: wrap">Every event here also keeps you busy in <button type="button" aria-haspopup="listbox" aria-label="Also keep busy in: Personal" style="{{ chooser }}"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; background: #3669a5"></span>Personal</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>, as a block without the details.</div>
              </div>
              <button id="cl-cal-block" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; flex-direction: column; gap: 2px"><h4 title="New events in this calendar start with these." style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Default reminders</h4></div>
                <div style="border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px">
                  <tbody>
                    <sc-for list="{{ reminders }}" as="r" hint-placeholder-count="2">
                      <tr style="border-top: 1px solid #eef0f3"><td style="padding: 12px 12px; line-height: 24px">{{ r.when }}</td><td style="padding: 12px 8px; line-height: 24px; color: #5e6168">{{ r.how }}</td><td style="padding: 10px 8px; text-align: right"><button type="button" aria-label="Remove the reminder {{ r.when }}" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></td></tr>
                    </sc-for>
                  </tbody>
                </table></div>
                <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; margin-left: -8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add reminder</button>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; flex-direction: column; gap: 2px"><label for="cl-cal-conf" title="Added to an event in this calendar as soon as it has invited people. Also Google Meet, Microsoft Teams, Zoom, Northwind Jitsi or none." style="font-weight: 500">Default video call</label></div>
                <button id="cl-cal-conf" type="button" aria-haspopup="listbox" style="{{ chooserWide }}"><span>Talk, the video call of this workspace</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
              </div>
            </div>

            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span title="Second of three under your account. The order is yours alone; the people you share with keep theirs." style="font-weight: 600">In your list</span></div>
              <div style="flex: none; display: flex; gap: 8px"><button type="button" style="{{ secondary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg>Move up</button><button type="button" style="{{ secondary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>Move down</button></div>
            </div>

            <div style="display: flex; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <button type="button" title="One .ics file with all 46 events, for a backup or another calendar." style="{{ secondary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Export as a file</button>
            </div>

          </div>
          <div style="display: flex; align-items: center; gap: 8px; margin: 16px 0 0; padding: 16px 24px; border-top: 1px solid #eef0f3">
            <button type="button" style="{{ danger }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Delete this calendar</button>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ secondary }}">Cancel</button>
            <button type="button" style="{{ primary }}">Save</button>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;After Delete this calendar: the footer makes way for the countdown with one action, Cancel the deletion; when it runs out the dialog closes</figcaption>
    <div style="position: relative; height: 330px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div></sc-for>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 32px">
        <div role="dialog" aria-modal="true" aria-labelledby="cl-cal-del-title" style="width: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); overflow: hidden">
