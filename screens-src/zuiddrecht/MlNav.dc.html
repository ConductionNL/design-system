<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<sc-if value="{{ isFolded }}" hint-placeholder-val="{{ false }}">
<nav aria-label="Mailboxes, folded" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; width: 64px; box-sizing: border-box; min-height: 100%; padding: 8px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #ffffff; border-right: 1px solid #e4e6ea">
  <button type="button" aria-label="Open folders" aria-expanded="false" title="Open folders" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
  <button type="button" aria-label="New message" title="New message" style="flex: none; width: 42px; height: 42px; margin: 6px 0 8px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></button>
  <sc-for list="{{ rail }}" as="it" hint-placeholder-count="8">
    <sc-if value="{{ it.gap }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 1px; margin: 6px 0; background: #e4e6ea"></span></sc-if>
    <a href="{{ it.href }}" aria-label="{{ it.aria }}" title="{{ it.aria }}" aria-current="{{ it.current }}" style="{{ it.style }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.icon }}"></path></svg>
      <span style="font-size: 10px; line-height: 12px; white-space: nowrap">{{ it.label }}</span>
      <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ it.badge }}">{{ it.count }}</span></sc-if>
    </a>
  </sc-for>
  <button type="button" aria-haspopup="menu" aria-label="Account: Olivia Brandt, olivia@northwind-projects.test" title="Olivia Brandt" style="flex: none; margin-top: auto; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; display: inline-flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: var(--sc-radius, 8px); background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: 'Fira Sans', system-ui, sans-serif">OB</span></button>
</nav>
</sc-if>
<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Mailboxes" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 15px; line-height: 21px; width: 264px; box-sizing: border-box; min-height: 100%; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; background: #ffffff; border-right: 1px solid #e4e6ea">
  <div style="display: flex; align-items: center; gap: 6px">
    <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>New message
    </button>
    <button type="button" aria-label="Fold folders" aria-expanded="true" title="Fold folders" style="flex: none; width: 42px; height: 42px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
  </div>
  <button type="button" aria-haspopup="menu" aria-label="Account: Olivia Brandt, olivia@northwind-projects.test" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; color: #1b1c1d; text-align: left; font-family: 'Fira Sans', system-ui, sans-serif">
    <span style="width: 28px; height: 28px; border-radius: var(--sc-radius, 8px); background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">OB</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Olivia Brandt</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">olivia@northwind-projects.test</span></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 6px 10px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span><sc-if value="{{ g.hasAdd }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="{{ g.addLabel }}" title="{{ g.addLabel }}" style="flex: none; width: 26px; height: 26px; margin: -5px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></sc-if></div></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
          <sc-if value="{{ it.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg></sc-if>
          <sc-if value="{{ it.hasSwatch }}" hint-placeholder-val="{{ false }}"><span style="{{ it.swatch }}"></span></sc-if>
          <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.label }}</span>
          <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ it.countStyle }}">{{ it.count }}</span></sc-if>
          <sc-if value="{{ it.hasChevron }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; padding: 0 10px; font-size: 12px; color: #5e6168; line-height: 1.4">2.1 GB of 10 GB used</div>
</nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Inbox"},"folded":{"editor":"text","default":""},"$preview":{"width":264,"height":945}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Inbox';
    const isFolded = String(this.props.folded ?? '') === 'true';
    const isOpen = !isFolded;
    const I = {
      inbox: 'M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z',
      draft: 'M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2zM14 2v6h6',
      sent: 'm22 2-7 20-4-9-9-4ZM22 2 11 13',
      archive: 'M21 8v13H3V8M1 3h22v5H1zM10 12h4',
      spam: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM12 8v4M12 16h.01',
      trash: 'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
      folder: 'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z',
      link: 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71',
      unlink: 'M18.84 12.25l1.72-1.71a5 5 0 0 0-7.07-7.07l-1.72 1.71M5.17 11.75l-1.71 1.71a5 5 0 0 0 7.07 7.07l1.71-1.71M8 2v3M2 8h3M16 22v-3M19 16h3',
      bell: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0'
    };
    I.star = 'm12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z';
    I.at = 'M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94';
    I.user = 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z';
    // [label, href, icon or null, count, options]
    // The reference navigation: views, folders, work packages, labels. The same on every mail board.
    const raw = [
      { title: 'Views', items: [
        ['Starred', '#', I.star, 3],
        ['Mentioned', '#', I.at, 1],
        ['Assigned to me', '#', I.user, 2]
      ] },
      { title: 'Folders', add: 'New folder', items: [
        ['Inbox', 'MlInbox.dc.html', I.inbox, 5, { strong: true }],
        ['Drafts', '#', I.draft, 1],
        ['Sent', '#', I.sent],
        ['Archive', '#', I.archive],
        ['Spam', '#', I.spam],
        ['Trash', '#', I.trash],
        ['Customers', '#', I.folder, '', { chevron: true }],
        ['Lyon', '#', I.folder, '', { child: true }],
        ['Kassel', '#', I.folder, '', { child: true }]
      ] },
      { title: 'Work packages', items: [
        ['Notifications', 'MlNotifications.dc.html', I.bell, 2, { strong: true }]
      ] },
      { title: 'Labels', add: 'New label', items: [
        ['Waiting for customer', '#', null, '', { swatch: '#ff9d2e' }],
        ['Offer', '#', null, '', { swatch: '#08a5df' }],
        ['Internal', '#', null, '', { swatch: '#5e6168' }]
      ] }
    ];
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 15px; line-height: 21px; ';
    const groups = raw.map((g) => ({
      title: g.title, hasTitle: !!g.title, hasAdd: !!g.add, addLabel: g.add ?? '',
      items: g.items.map(([label, href, icon, count, o]) => {
        o = o ?? {};
        const on = label === active;
        return {
          label, href, icon: icon ?? '', hasIcon: !!icon,
          hasSwatch: !!o.swatch, swatch: 'flex: none; width: 10px; height: 10px; margin: 0 5px; border-radius: 5px; background: ' + (o.swatch ?? '#5e6168'),
          hasCount: count !== undefined && count !== '', count: count ?? '',
          countStyle: 'flex: none; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; background: #eaf0f7; color: #234a78',
          hasChevron: !!o.chevron,
          current: on ? 'page' : 'false',
          style: base + (o.child ? 'padding-left: 42px; ' : '') + (on ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;')
        };
      })
    }));
    // Folded rail: the folders and the notifications, each with a short label; badges only where a count matters.
    const railBase = 'position: relative; flex: none; width: 56px; height: 48px; box-sizing: border-box; border-radius: var(--sc-radius, 8px); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; ';
    const railItems = [
      ['Starred', '#', I.star, 3, 'Starred'], ['Mentioned', '#', I.at, 1, 'Mentioned'], ['Assigned to me', '#', I.user, 2, 'Assigned'],
      ['Inbox', 'MlInbox.dc.html', I.inbox, 5, 'Inbox'], ['Drafts', '#', I.draft, 1, 'Drafts'], ['Sent', '#', I.sent, '', 'Sent'], ['Archive', '#', I.archive, '', 'Archive'],
      ['Spam', '#', I.spam, '', 'Spam'], ['Trash', '#', I.trash, '', 'Trash'], ['Customers', '#', I.folder, '', 'Folders'], ['Notifications', 'MlNotifications.dc.html', I.bell, 2, 'Notifications']
    ];
    const rail = railItems.map(([name, href, icon, count, label], i) => {
      const on = name === active;
      const hasCount = count !== '';
      return {
        href, icon, label: label, gap: i === 3 || i === 10,
        aria: hasCount ? name + ', ' + count : name,
        current: on ? 'page' : 'false',
        hasCount, count,
        badge: 'position: absolute; top: 2px; right: 4px; min-width: 16px; height: 16px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; font-family: \'Fira Sans\', system-ui, sans-serif; background: #3669a5; color: #ffffff',
        style: railBase + (on ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #3d4047;')
      };
    });
    return { groups, rail, isFolded, isOpen };
  }
}
</script>
</body>
</html>
