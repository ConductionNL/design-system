<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: mailboxes of a domain</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#ml-mbx-search::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2293px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Mailboxes of northwind-projects.test, Personal tab open, the filter "Close to storage limit" on, the row menu of Tom Achterberg, the last row, open so it covers nothing</figcaption>
    <div style="position: relative; height: 873px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Administration" placeholder="Search domains, mailboxes or settings" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Mailboxes" hint-size="264px,790px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">
          <nav aria-label="Breadcrumb" style="font-size: 13px; color: #5e6168; display: flex; align-items: center; gap: 6px"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">Domains</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">northwind-projects.test</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><span aria-current="page">Mailboxes</span></nav>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Mailboxes of northwind-projects.test</h1>
              <p style="margin: 0; color: #3d4047">46 mailboxes: 43 personal, 3 shared, and 4 group addresses. 61.4 GB of 500 GB in use, 10 GB per mailbox unless set otherwise.</p>
            </div>
            <div style="flex: none; display: flex; align-items: center; gap: 8px">
              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"></path></svg>Send a message to all 46 mailboxes</button>
              <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New mailbox</button>
            </div>
          </div>

          <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); display: flex; flex-direction: column">
            <div role="tablist" aria-label="Kinds of mailbox" style="flex: none; display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid #828a95">
              <sc-for list="{{ tabsA }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; font-weight: 600; background: #e4e6ea; color: #3d4047">{{ t.count }}</span></button></sc-for>
            </div>
            <div style="display: flex; align-items: center; gap: 12px; padding: 16px 20px 12px">
              <form role="search" style="position: relative; display: flex; align-items: center; width: 320px">
                <label for="ml-mbx-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search mailboxes</label>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 8px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
                <input id="ml-mbx-search" type="search" placeholder="Search by name or address" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d">
              </form>
              <span style="font-size: 13px; color: #5e6168; white-space: nowrap">43 personal mailboxes, 3 shown</span>
              <span style="flex: 1 1 auto"></span>
              <button type="button" aria-haspopup="dialog" style="{{ compact }}">Reserved address prefixes</button>
            </div>
            <div role="group" aria-label="Show only" style="display: flex; align-items: center; gap: 8px; padding: 0 20px 12px">
              <span style="font-size: 13px; color: #5e6168">Show</span>
              <button type="button" aria-pressed="true" style="{{ chipOn }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Close to storage limit<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #3d4047; color: #ffffff">3</span></button>
              <button type="button" aria-pressed="false" style="{{ chipOff }}">Not signed in for 30 days</button>
            </div>
            <div style="position: relative">
              <table style="width: 100%; border-collapse: collapse; font-size: 14px">
                <thead><tr style="border-top: 1px solid #e4e6ea; background: #fafbfc">
                  <th scope="col" style="text-align: left; padding: 12px 20px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Name</th>
                  <th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Address</th>
                  <th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Storage used</th>
                  <th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Last sign-in</th>
                  <th scope="col" style="width: 52px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th>
                </tr></thead>
                <tbody>
                  <sc-for list="{{ people }}" as="p" hint-placeholder-count="3">
                    <tr style="{{ p.style }}">
                      <td style="padding: 14px 20px; line-height: 20px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">{{ p.name }}</a></td>
                      <td style="padding: 14px 16px; line-height: 20px; color: #3d4047; white-space: nowrap">{{ p.address }}</td>
                      <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><span style="display: flex; align-items: center; gap: 6px; line-height: 20px"><span style="{{ p.dot }}"></span>{{ p.storage }}</span></td>
                      <td style="padding: 14px 16px; line-height: 20px; color: #5e6168; white-space: nowrap">{{ p.signin }}</td>
                      <td style="padding: 10px 14px 10px 8px; text-align: right; line-height: 0"><button type="button" aria-haspopup="menu" aria-expanded="{{ p.menu }}" aria-label="Actions for {{ p.name }}" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <div role="menu" aria-label="Actions for Tom Achterberg" style="position: absolute; top: 182px; right: 14px; margin-top: 4px; min-width: 260px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column">
                <sc-for list="{{ menu }}" as="i" hint-placeholder-count="5">
                  <button type="button" role="menuitem" style="{{ i.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ i.iconColor }}"><path d="{{ i.icon }}"></path></svg><span style="flex: 1 1 auto">{{ i.label }}</span></button>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; font-size: 13px; color: #5e6168">
              <span>Showing 3 of 43 personal mailboxes, those close to their storage limit, sorted by name.</span>
              <a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">Clear filter</a>
            </div>
          </div>
        </main>
      </div>
    </div>
  </figure>

  <div style="display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 24px; min-width: 0">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;New mailbox: personal or shared, over the dimmed page</figcaption>
      <div style="position: relative; height: 560px; box-sizing: border-box; background: #f5f6f8; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 20px">
          <form role="dialog" aria-modal="true" aria-labelledby="ml-mbx-new-title" style="{{ dialog }}">
            <div style="{{ dialogHead }}"><strong id="ml-mbx-new-title" style="{{ dialogTitle }}">New mailbox</strong></div>
            <div style="{{ dialogBody }}">
            <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
              <legend style="padding: 0; margin: 0 0 6px; float: left; width: 100%; font-size: 14px; font-weight: 600">Kind</legend>
              <label style="display: flex; align-items: flex-start; gap: 10px; line-height: 20px"><input type="radio" name="ml-mbx-kind" checked style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #3669a5"><span>Personal mailbox, for one person<br><span style="font-size: 12px; color: #5e6168">The person signs in with the workspace account.</span></span></label>
              <label style="display: flex; align-items: flex-start; gap: 10px; line-height: 20px"><input type="radio" name="ml-mbx-kind" style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: #3669a5"><span>Shared mailbox, several people read and send from it<br><span style="font-size: 12px; color: #5e6168">You pick the members after it is created.</span></span></label>
            </fieldset>
            <div style="{{ group }}"><label for="ml-mbx-person" style="font-size: 14px; font-weight: 600">Person</label>
            <button id="ml-mbx-person" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; width: 100%; padding: 0 10px 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>Nadia Verhoef</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
            <div style="{{ group }}"><label for="ml-mbx-addr" style="font-size: 14px; font-weight: 600">Address</label>
            <input id="ml-mbx-addr" type="text" value="nadia@northwind-projects.test" style="{{ input }}"></div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
              <label for="ml-mbx-quota" style="font-size: 14px; font-weight: 600">Storage</label>
              <span style="display: inline-flex; align-items: center; gap: 8px"><input id="ml-mbx-quota" type="number" value="10" style="{{ num }}"><span style="font-size: 13px; color: #3d4047">GB, the domain default</span></span>
            </div>
            </div>
            <div style="{{ dialogFoot }}">
              <button type="button" style="{{ secondary }}">Cancel</button>
              <button type="submit" style="{{ primary }}">Create mailbox</button>
            </div>
          </form>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Mailbox created, only when the server keeps its own passwords. This server uses single sign-on (see People and sign-in), so here the dialog ends after the first line</figcaption>
      <div style="position: relative; height: 560px; box-sizing: border-box; background: #f5f6f8; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 20px">
          <div role="dialog" aria-modal="true" aria-labelledby="ml-mbx-done-title" style="{{ dialog }}">
            <div style="{{ dialogHead }}"><span style="display: inline-flex; align-items: center; gap: 8px; {{ dialogTitle }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #2b8a3e"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3"></path></svg><strong id="ml-mbx-done-title" style="font-weight: 700">Mailbox created</strong></span></div>
            <div style="{{ dialogBody }}">
            <p style="margin: 0; font-size: 14px; color: #3d4047; line-height: 21px">nadia@northwind-projects.test is ready, with 10 GB of storage. With single sign-on Nadia Verhoef signs in with her workspace account and nothing more is needed. When the server keeps its own passwords, hand her the password below; she chooses her own at first sign-in.</p>
            <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8">
              <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Temporary password, shown once</span>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
                <code style="font-family: ui-monospace, monospace; font-size: 18px; letter-spacing: 0.04em; color: #1b1c1d">kq7v-emt2-9lrw</code>
                <button type="button" style="{{ compact }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 9h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy password</button>
              </div>
            </div>
            <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #ff9d2e; border-radius: var(--sc-radius, 8px); background: #fff4e6; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #ff9d2e"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg><span>After you close this, the password cannot be shown again. You can only reset it, which gives a new one. With single sign-on the password is reset in the workspace, not here.</span></div>
            </div>
            <div style="{{ dialogFoot }}">
              <button type="button" style="{{ secondary }}">Open mailbox page</button>
              <button type="button" style="{{ primary }}">Done</button>
            </div>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;Manage access to the shared mailbox support@</figcaption>
      <div style="position: relative; height: 560px; box-sizing: border-box; background: #f5f6f8; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 20px">
          <div role="dialog" aria-modal="true" aria-labelledby="ml-mbx-access-title" style="{{ dialog }}; width: 540px">
            <div style="{{ dialogHead }}"><strong id="ml-mbx-access-title" style="{{ dialogTitle }}">Manage access to support@northwind-projects.test</strong></div>
            <div style="{{ dialogBody }}">
            <p style="margin: 0; font-size: 14px; color: #3d4047; line-height: 21px">Shared mailbox, 3 people. A Viewer reads, an Editor also replies and files, a Manager also grants access. Sending as the mailbox is a switch per person.</p>
            <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px">
              <thead><tr style="background: #fafbfc"><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Person</th><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Role</th><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">May send as this mailbox</th><th scope="col" style="width: 84px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
              <tbody>
                <sc-for list="{{ members }}" as="m" hint-placeholder-count="3">
                  <tr style="border-top: 1px solid #eef0f3">
                    <td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600; white-space: nowrap">{{ m.name }}</td>
                    <td style="padding: 7px 16px; line-height: 20px; white-space: nowrap"><button type="button" aria-haspopup="listbox" aria-label="Role of {{ m.name }}" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 34px; min-width: 120px; padding: 0 10px 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap"><span>{{ m.access }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></td>
                    <td style="padding: 12px 16px; line-height: 0"><button type="button" role="switch" aria-checked="{{ m.send }}" aria-label="{{ m.name }} may send as this mailbox" style="{{ m.switch }}"><span style="{{ m.knob }}"></span></button></td>
                    <td style="padding: 7px 16px; line-height: 20px; text-align: right"><button type="button" aria-label="Withdraw access of {{ m.name }}" style="{{ btnSmall }}">Withdraw</button></td>
                  </tr>
                </sc-for>
              </tbody>
            </table></div>
            <div><button type="button" style="{{ compact }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Grant access</button></div>
            </div>
            <div style="{{ dialogFoot }}">
              <button type="button" style="{{ secondary }}">Cancel</button>
              <button type="button" style="{{ primary }}">Save access</button>
            </div>
          </div>
        </div>
      </div>
    </figure>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-width: 0">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;Groups tab: group addresses with their members, one group opened</figcaption>
      <div style="background: #ffffff; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 680px; box-sizing: border-box">
        <div role="tablist" aria-label="Kinds of mailbox" style="flex: none; display: flex; gap: 4px; padding: 16px 20px 0; border-bottom: 1px solid #828a95">
