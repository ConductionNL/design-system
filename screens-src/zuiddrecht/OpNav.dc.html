<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenProject twin: project menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<nav aria-label="Project menu" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 15px; line-height: 21px; width: 100%; min-height: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e4e6ea; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
  <button type="button" style="flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 15px 'Fira Sans', sans-serif">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{ primary }}
  </button>
  <button type="button" aria-haspopup="listbox" aria-label="Project: {{ project }}" style="flex: none; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; color: #1b1c1d; text-align: left; font-family: 'Fira Sans', system-ui, sans-serif">
    <span style="flex: none; width: 28px; height: 28px; border-radius: var(--sc-radius, 8px); background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{ projectInitials }}</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><span style="font-size: 12px; color: #5e6168">Project</span><strong style="font-size: 14px; font-weight: 600">{{ project }}</strong></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}"><span style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span></sc-if>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
        <li>
          <sc-if value="{{ it.plain }}" hint-placeholder-val="{{ true }}">
          <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg>
            <span style="flex: 1">{{ it.label }}</span>
            <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ it.count }}</span></sc-if>
          </a>
          </sc-if>
          <sc-if value="{{ it.nest }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center">
            <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg>
              <span style="flex: 1">{{ it.label }}</span>
              <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ it.count }}</span></sc-if>
            </a>
            <button type="button" aria-expanded="{{ it.expanded }}" aria-controls="{{ it.listId }}" aria-label="{{ it.toggleLabel }}" style="flex: none; width: 32px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.chevron }}"></path></svg>
            </button>
          </div>
          <sc-if value="{{ it.open }}" hint-placeholder-val="{{ false }}">
          <ul id="{{ it.listId }}" style="list-style: none; margin: 2px 0 6px 20px; padding: 0 0 0 10px; border-left: 2px solid #e4e6ea; display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{ it.children }}" as="c" hint-placeholder-count="4">
              <li>
                <sc-if value="{{ c.isLabel }}" hint-placeholder-val="{{ false }}"><span style="display: block; padding: {{ c.pad }}; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ c.label }}</span></sc-if>
                <sc-if value="{{ c.isItem }}" hint-placeholder-val="{{ true }}"><a href="{{ c.href }}" aria-current="{{ c.current }}" style="{{ c.style }}">{{ c.label }}</a></sc-if>
                <sc-if value="{{ c.isMore }}" hint-placeholder-val="{{ false }}"><button type="button" aria-expanded="false" style="display: flex; align-items: center; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; text-align: left">{{ c.label }}</button></sc-if>
                <sc-if value="{{ c.isNew }}" hint-placeholder-val="{{ false }}"><button type="button" style="display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 500 14px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg>{{ c.label }}</button></sc-if>
              </li>
            </sc-for>
          </ul>
          </sc-if>
          </sc-if>
        </li>
      </sc-for>
      </ul>
    </div>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ bottom }}" as="it" hint-placeholder-count="2">
      <li>
        <sc-if value="{{ it.plain }}" hint-placeholder-val="{{ true }}">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg>
          <span style="flex: 1">{{ it.label }}</span>
        </a>
        </sc-if>
        <sc-if value="{{ it.nest }}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; align-items: center">
          <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg>
            <span style="flex: 1">{{ it.label }}</span>
          </a>
          <button type="button" aria-expanded="{{ it.expanded }}" aria-controls="{{ it.listId }}" aria-label="{{ it.toggleLabel }}" style="flex: none; width: 32px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.chevron }}"></path></svg>
          </button>
        </div>
        <sc-if value="{{ it.open }}" hint-placeholder-val="{{ false }}">
        <ul id="{{ it.listId }}" style="list-style: none; margin: 2px 0 6px 20px; padding: 0 0 0 10px; border-left: 2px solid #e4e6ea; display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{ it.children }}" as="c" hint-placeholder-count="4">
            <li>
              <sc-if value="{{ c.isLabel }}" hint-placeholder-val="{{ false }}"><span style="display: block; padding: {{ c.pad }}; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ c.label }}</span></sc-if>
              <sc-if value="{{ c.isItem }}" hint-placeholder-val="{{ true }}"><a href="{{ c.href }}" aria-current="{{ c.current }}" style="{{ c.style }}">{{ c.label }}</a></sc-if>
              <sc-if value="{{ c.isMore }}" hint-placeholder-val="{{ false }}"><button type="button" aria-expanded="false" style="display: flex; align-items: center; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; text-align: left">{{ c.label }}</button></sc-if>
              <sc-if value="{{ c.isNew }}" hint-placeholder-val="{{ false }}"><button type="button" style="display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 500 14px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg>{{ c.label }}</button></sc-if>
            </li>
          </sc-for>
        </ul>
        </sc-if>
        </sc-if>
      </li>
    </sc-for>
    </ul>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Work packages"},"project":{"editor":"text","default":"Northwind rollout Lyon"},"primary":{"editor":"text","default":"Create work package"},"open":{"editor":"text","default":""},"current":{"editor":"text","default":""},"items":{"editor":"text","default":""},"$preview":{"width":264,"height":932}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Work packages';
    const project = this.props.project ?? 'Northwind rollout Lyon';
    const projectInitials = project.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    // Nested state (two-layer menu). open names the module whose own list is shown under it;
    // current names the child that is the current page (when absent the module itself may be the current page).
    // items (optional) overrides the module's children: "A|B|C" (flat) or "Group: A|B; Other: C" (grouped).
    const open = (this.props.open ?? '').trim();
    const current = (this.props.current ?? '').trim();
    const itemsOverride = (this.props.items ?? '').trim();
    const I = {
      overview: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      wp: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      boards: 'M4 5h16v14H4zM9 5v14M15 5v14',
      gantt: 'M3 5h8M7 12h10M11 19h10M3 3v18',
      calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
      team: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      backlogs: 'M4 6h16M4 12h10M4 18h6M20 12l-3 3-2-2',
      meetings: 'M23 7l-7 5 7 5zM1 5h15v14H1z',
      wiki: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z',
      time: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2',
      members: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87',
      settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'
    };
    const HREF = { Overview: 'OpProjectOverview.dc.html', 'Work packages': 'OpWorkPackages.dc.html', Boards: 'OpBoards.dc.html', Gantt: 'OpGantt.dc.html', Calendar: 'OpCalendar.dc.html', 'Team planner': 'OpTeamPlanner.dc.html', Backlogs: 'OpBacklogs.dc.html', Meetings: 'OpMeetings.dc.html', Wiki: 'OpWiki.dc.html', 'Time and costs': 'OpTimeCosts.dc.html', Members: 'OpMembers.dc.html', 'Project settings': 'OpProjectSettings.dc.html' };
    // Modules with a list of their own (OpenProject's third navigation level). groups: [[label, [items]]], a label of '' means no group heading.
    const NESTED = {
      'Work packages': { groups: [['Default', ['All open', 'Latest activity', 'Recently created', 'Overdue']], ['Favourites', ['Milestones']], ['Public', ['Created by me', 'Assigned to me']], ['Private', ['Tasks']]], action: 'Save this view' },
      Boards: { groups: [['', ['Status board', 'Team board Lyon', 'Phase 2 rollout']]], action: 'New board' },
      Wiki: { groups: [['', ['Phase 2 rollout plan', 'Sites and dates', 'Meeting notes', 'How we work']]], action: 'New page' },
      'Project settings': { groups: [['', ['General', 'Modules', 'Work package types', 'Categories', 'Versions', 'Nextcloud project folder', 'Time and costs']]], action: '' }
    };
    const CHILD_HREF = { 'All open': 'OpWorkPackages.dc.html', 'Status board': 'OpBoards.dc.html', 'Phase 2 rollout plan': 'OpWiki.dc.html', General: 'OpProjectSettings.dc.html' };
    const SHOW = 8; // a nested list longer than this shows its first 6 and a "Show all N" row
    const FIRST = 6;
    const parseItems = (s) => s.includes(':')
      ? s.split(';').map((g) => { const [t, rest] = g.split(':'); return [t.trim(), (rest || '').split('|').map((x) => x.trim()).filter(Boolean)]; })
      : [['', s.split('|').map((x) => x.trim()).filter(Boolean)]];
    const childBase = 'display: flex; align-items: center; min-height: 36px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 14px; ';
    const children = (label) => {
      const def = NESTED[label] || { groups: [['', []]], action: '' };
      const groups = itemsOverride ? parseItems(itemsOverride) : def.groups;
      const total = groups.reduce((n, g) => n + g[1].length, 0);
      const truncate = total > SHOW;
      const rows = [];
      let seen = 0;
      for (const [title, items] of groups) {
        if (truncate && seen >= FIRST) break;
        if (title) rows.push({ isLabel: true, label: title, pad: rows.length ? '8px 10px 4px' : '4px 10px 4px' });
        for (const it of items) {
          if (truncate && seen >= FIRST) break;
          const on = it === current;
          rows.push({ isItem: true, label: it, href: CHILD_HREF[it] || '#', current: on ? 'page' : 'false',
            style: childBase + (on ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;') });
          seen += 1;
        }
      }
      if (truncate) rows.push({ isMore: true, label: 'Show all ' + total });
      if (def.action) rows.push({ isNew: true, label: def.action });
      return rows;
    };
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 15px; ';
    const item = ([label, icon, count]) => {
      const on = label === active;
      const nest = !!open && !!NESTED[label];
      const isOpen = nest && label === open;
      const kids = isOpen ? children(label) : [];
      const holdsCurrent = isOpen && kids.some((k) => k.isItem && k.current === 'page');
      const self = on && !holdsCurrent;
      const style = base + (nest ? 'flex: 1 1 auto; min-width: 0; padding-right: 4px; ' : '') +
        (self ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : holdsCurrent ? 'color: #234a78; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;');
      return { label, icon: I[icon], href: HREF[label] || '#', count: count ?? '', hasCount: !!count, current: self ? 'page' : 'false', style,
        plain: !nest, nest, open: isOpen, expanded: isOpen ? 'true' : 'false',
        listId: 'opnav-' + label.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
        toggleLabel: (isOpen ? 'Collapse ' : 'Expand ') + label.toLowerCase(),
        chevron: isOpen ? 'm6 9 6 6 6-6' : 'm9 18 6-6-6-6',
        children: kids };
    };
    const groups = [
      { title: 'Plan', items: [['Overview', 'overview'], ['Work packages', 'wp', 10], ['Boards', 'boards'], ['Gantt', 'gantt'], ['Calendar', 'calendar'], ['Team planner', 'team'], ['Backlogs', 'backlogs']] },
      { title: 'Work together', items: [['Meetings', 'meetings'], ['Wiki', 'wiki'], ['Time and costs', 'time']] }
    ].map((g) => ({ title: g.title, hasTitle: !!g.title, items: g.items.map(item) }));
    const bottom = [['Members', 'members'], ['Project settings', 'settings']].map(item);
    return { project, projectInitials, primary: this.props.primary ?? 'Create work package', groups, bottom };
  }
}
</script>
</body>
</html>
