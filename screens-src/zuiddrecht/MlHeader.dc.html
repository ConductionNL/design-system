<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<dc-import name="OpHeader" app="{{ app }}" placeholder="{{ placeholder }}" user="{{ user }}" initials="{{ initials }}" role="{{ role }}" current="{{ current }}" hint-size="100%,68px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":"text","default":"Mail"},"placeholder":{"editor":"text","default":"Search mail, people or #work package"},"user":{"editor":"text","default":"Olivia Brandt"},"initials":{"editor":"text","default":"OB"},"$preview":{"width":1440,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    // A thin wrapper: every app board imports MlHeader, and MlHeader draws the one shell top bar (OpHeader).
    // The app name is also the current entry of the app switcher; "Administration" is passed through as it is.
    const app = this.props.app ?? 'Mail';
    return { app, placeholder: this.props.placeholder ?? 'Search mail, people or #work package', user: this.props.user ?? 'Olivia Brandt', initials: this.props.initials ?? 'OB', role: 'Delivery lead', current: app };
  }
}
</script>
</body>
</html>
