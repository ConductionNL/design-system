<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: persoonlijke instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="LpIntranet" hint-size="100%,2200px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Launchpad" version="1.1.7" active="Samenvatting per e-mail" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Launchpad's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen in the start-page
    // menu (StartPageMenu.vue). Replaces the Launchpad section drawn inside Nextcloud's personal settings, and moves
    // the LaunchPad-profiel fields (LaunchPadPersonal in /settings/user/personal-info) in here (decision 11 Oct 2026).
    const sections = [
      { name: 'Samenvatting per e-mail', desc: 'Een mail met nieuwe aankondigingen en wat er op je dashboards veranderde.', rows: [
        { radios: 'Hoe vaak?', options: [['Uit', ''], ['Dagelijks', 'Om 07.30, alleen als er iets veranderde'], ['Wekelijks', 'Op maandag om 07.30', true]] }
      ] },
      { name: 'Gebruikscijfers', desc: 'Beheer ziet alleen tellingen per dashboard, nooit je naam.', rows: [
        { switch: 'Mijn bezoeken meetellen', hint: 'Uit: je telt niet mee.', on: false }
      ] },
      { name: 'Verborgen widgets', desc: 'Je hebt 2 widgets verborgen op gedeelde dashboards.', rows: [
        { items: [['Verjaardagen', 'Intranet Zuiddrecht', 'Weer tonen'], ['Kantinemenu', 'Intranet Zuiddrecht', 'Weer tonen']] },
        { buttons: [['Alles weer tonen', '']] }
      ] },
      { name: 'Mijn profiel', desc: 'Velden die je organisatie aan je profiel toevoegt. Collega\'s zien ze in profielwidgets.', rows: [
        { pair: [{ label: 'Afdeling', value: 'Publiekszaken' }, { label: 'Kamer', value: 'B2.14' }] },
        { note: 'Afdeling komt uit de personeelsadministratie. Wijzigen gaat via je leidinggevende.', tone: 'plain' },
        { select: 'Bereikbaar via', value: 'Talk en telefoon' },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['Power BI, eigen account', 'Widget Klanttevredenheid · toegevoegd 30 september', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
