<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>hermiq: persoonlijke instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="HmDashboard" hint-size="100%,1420px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Hermiq" version="0.2.17" active="Afleveren in Talk" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Hermiq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen under Geavanceerd.
    // App.vue fills it with Over Hermiq, Talk-aflevering, Installatie (admins only) and Inloggegevens
    // (CnCredentials personal; its Dutch string reads "Diploma's" today, a mistranslation). The own model key and
    // the agent preferences from the earlier board stay, as Inloggegevens and Voorkeuren (decision 11 Oct 2026).
    const sections = [
      { name: 'Over Hermiq', rows: [] },
      { name: 'Afleveren in Talk', desc: 'Waar je agents resultaten afleveren als een agent zelf geen kamer heeft.', rows: [
        { select: 'Standaardkamer', value: 'Hermiq-resultaten, 3 deelnemers' },
        { text: 'Nieuwe kamer maken', placeholder: 'Naam van de kamer', action: 'Nieuwe kamer' }
      ] },
      { name: 'Installatie', desc: 'Alleen voor beheerders.', rows: [
        { buttons: [['Installatiewizard starten', '']] }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen sleutels en abonnementen. Ze staan versleuteld in de kluis; een agent krijgt ze alleen tijdens een run.', rows: [
        { items: [
          ['Anthropic, Claude-abonnement', 'Aangemeld als p.jansen@zuiddrecht.nl · voor al mijn runs met een Anthropic-model', 'Afmelden', 'Verbonden'],
          ['GitHub, persoonlijk token', 'Agent Release-notities · toegevoegd 2 oktober', 'Verwijderen'],
          ['Mijn Google Agenda', 'Agent Ochtendplanning · toegevoegd 18 september', 'Verwijderen']
        ] },
        { buttons: [['Sleutel toevoegen', ''], ['Aanmelden met een abonnement', '']] },
        { note: 'Zonder eigen sleutel gebruikt Hermiq die van de organisatie.', tone: 'plain' }
      ] },
      { name: 'Voorkeuren', desc: 'Hoe agents voor jou werken.', rows: [
        { pair: [{ label: 'Taal van antwoorden', value: 'Nederlands, B1', select: true }, { label: 'Standaardagent in de chat', value: 'Hulp bij Woo-besluit', select: true }] },
        { switch: 'Vragen voordat een agent namens mij mailt of iets verstuurt', on: true },
        { switch: 'Melding als een run klaar is', on: true }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
