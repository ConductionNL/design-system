<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: notices and markers</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1260px; padding: 28px 24px; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto auto; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Browser notification when new mail arrives, also while the tab is in the background</figcaption>
    <div style="height: 200px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: flex-end; padding: 16px; background: #eef0f3; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div role="alert" aria-label="Browser notification" style="width: 380px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12)">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #5e6168"><span style="width: 16px; height: 16px; border-radius: 4px; background: #3669a5; display: inline-flex; align-items: center; justify-content: center; color: #ffffff"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span><span>Mail · mail.northwind-projects.test</span><span style="flex: 1 1 auto"></span><span>07:00</span><button type="button" aria-label="Dismiss this notification" style="width: 20px; height: 20px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
        <div style="display: flex; gap: 10px">
          <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">SL</span>
          <div style="display: flex; flex-direction: column; min-width: 0">
            <strong style="font-size: 14px; font-weight: 600; line-height: 20px">New mail from Sven Lindqvist</strong>
            <span style="font-size: 13px; line-height: 19px; color: #1b1c1d">Request for a demo, 1,200 users</span>
            <span style="font-size: 12px; line-height: 18px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">We are evaluating OpenProject for all of Malmö Energi, about 1,200 users.</span>
          </div>
        </div>
        <div style="display: flex; gap: 8px; padding-left: 42px"><button type="button" style="{{ btnRow }}">Open</button></div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Message sent: the toast at the foot of the reading pane, with ten seconds to take it back</figcaption>
    <div style="height: 200px; box-sizing: border-box; display: flex; align-items: flex-end; padding: 16px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div role="status" aria-live="polite" style="display: inline-flex; align-items: center; gap: 12px; height: 48px; padding: 0 8px 0 14px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#538b28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14M22 4 12 14.01l-3-3"></path></svg>
        <span style="font-size: 13px"><strong style="font-weight: 600">Message sent</strong> to Marc Dubois, "Re: Rollout plan phase 2, Lyon"</span>
        <button type="button" style="{{ btnRow }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg>Take back</button>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">8 s left</span>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Mailbox nearly full: the storage line at the foot of the navigation turns into a warning</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <nav aria-label="Folders, lower part" style="flex: 0 0 264px; width: 264px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: 10px 14px 12px; background: #ffffff; border-right: 1px solid #e4e6ea">
        <sc-for list="{{ folders }}" as="f" hint-placeholder-count="2"><a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); color: #1b1c1d; text-decoration: none; font-size: 15px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="{{ f.icon }}"></path></svg><span style="flex: 1 1 auto">{{ f.name }}</span><span style="font-size: 12px; color: #5e6168">{{ f.count }}</span></a></sc-for>
        <div role="status" style="margin: 8px 4px 0; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #ff9d2e; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 12px; line-height: 18px; color: #1b1c1d">
          <div style="display: flex; align-items: center; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #c77a1f"><path d="m10.29 3.86-8.6 14.86A2 2 0 0 0 3.4 21.7h17.2a2 2 0 0 0 1.71-2.98L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg><strong style="font-weight: 600">Mailbox nearly full</strong></div>
          <div role="progressbar" aria-label="Storage used" aria-valuenow="94" aria-valuemin="0" aria-valuemax="100" style="height: 6px; border-radius: 3px; background: #eef0f3; overflow: hidden"><span style="display: block; width: 94%; height: 100%; background: #ff9d2e"></span></div>
          <span style="color: #3d4047">9.4 GB of 10 GB used. At 10 GB new mail is refused by the server. Empty Trash or delete large attachments.</span>
        </div>
      </nav>
      <div style="flex: 1 1 auto"></div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;Could not be delivered: the notice sits on the sent message itself, in Sent and in the conversation</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <article aria-label="Message from you, today 07:20, not delivered" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
        <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
          <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">OB</span>
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
            <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">You</strong><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 07:20</span></div>
            <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">marc.dubois@ville-lyon.fr</span></div>
          </div>
        </div>
        <div style="padding: 10px 14px 14px 56px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
          <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #fbeaea; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #cc0000"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg><span><strong style="font-weight: 600">Could not be delivered</strong> to marc.dubois@ville-lyon.fr. The server at ville-lyon.fr answered at 07:21: mailbox is full. Nothing more will be tried; the message is still in Sent.</span></div>
          <p style="margin: 0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Hi Marc, the afternoon works for us. Shall we say 14:00 on 2 November, same room as the first kick-off?</p>
        </div>
      </article>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;Delegation: a notice when an account is handed to you and another when that ends</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <sc-for list="{{ delegations }}" as="n" hint-placeholder-count="2">
        <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid {{ n.bar }}; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 13px; line-height: 19px; color: #1b1c1d">
          <span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ n.initials }}</span>
          <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column"><span><strong style="font-weight: 600">{{ n.title }}</strong></span><span style="color: #3d4047">{{ n.body }}</span><span style="font-size: 12px; color: #5e6168">{{ n.when }}</span></span>
          <sc-if value="{{ n.hasAction }}" hint-placeholder-val="{{ true }}"><button type="button" style="{{ btnRow }}">{{ n.action }}</button></sc-if>
        </div>
      </sc-for>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">f</span> &nbsp;New version: one line above the conversation list, the app keeps working until you reload</figcaption>
    <div style="height: 240px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div role="status" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px 0 16px; box-sizing: border-box; background: #eaf0f7; border-bottom: 1px solid #e4e6ea; font-size: 13px; color: #1b1c1d">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #234a78"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>
        <span style="flex: 1 1 auto">A new version of Mail is available, 5.3.0. Reload to use it; your drafts are kept.</span>
        <button type="button" style="{{ btnRow }}">Reload</button>
        <button type="button" aria-label="Dismiss the new version notice" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">
        <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Inbox</h2><span style="font-size: 13px; color: #5e6168; white-space: nowrap">12 conversations</span></div>
      </div>
      <div role="group" aria-label="Filter" style="flex: none; display: flex; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid #e4e6ea">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{ c.on }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
      </div>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{ rowsTop }}" as="r" hint-placeholder-count="1">
          <li style="border-bottom: 1px solid #e4e6ea; background: #ffffff">
            <a href="#" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
              <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
              <span style="{{ r.avatar }}">{{ r.initials }}</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.sender }}">{{ r.from }}</span><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span></span>
                <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.subjectStyle }}">{{ r.subject }}</span></span>
                <span style="display: flex; align-items: center; gap: 8px; height: 20px"><span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span></span>
              </span>
            </a>
          </li>
        </sc-for>
      </ol>
    </div>
  </figure>

  <figure style="margin: 0; grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">g</span> &nbsp;Markers in the list: an unread mention, an answered message and a forwarded one</figcaption>
    <div style="height: 300px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <section aria-label="Inbox" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
        <div style="flex: none; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea"><h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Inbox</h2></div>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
            <li style="border-bottom: 1px solid #e4e6ea; background: #ffffff">
              <a href="#" aria-label="{{ r.aria }}" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 6px; color: #1b1c1d; text-decoration: none">
                <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
                <span style="{{ r.avatar }}">{{ r.initials }}</span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                    <sc-if value="{{ r.answered }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Answered" style="flex: none; color: #5e6168"><title>Answered</title><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg></sc-if>
                    <sc-if value="{{ r.forwarded }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Forwarded" style="flex: none; color: #5e6168"><title>Forwarded</title><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg></sc-if>
                    <span style="{{ r.sender }}">{{ r.from }}</span><sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if><span style="flex: 1 1 auto"></span><span style="{{ r.dateStyle }}">{{ r.date }}</span>
                  </span>
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="{{ r.subjectStyle }}">{{ r.subject }}</span><sc-if value="{{ r.hasAttach }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 2px; color: #5e6168; font-size: 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>1</span></sc-if></span>
                  <span style="display: flex; align-items: center; gap: 8px; height: 20px">
                    <sc-if value="{{ r.mention }}" hint-placeholder-val="{{ true }}"><span style="{{ chipMention }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>Mentioned you</span></sc-if>
                    <sc-if value="{{ r.hasChip }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; line-height: 1; white-space: nowrap"><span style="font-weight: 700; letter-spacing: 0.04em; color: #cc0000">BUG</span><span style="color: #3d4047">#58231</span><span style="flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span style="color: #3d4047">in development</span></span></sc-if>
                    <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span>
                  </span>
                </span>
              </a>
            </li>
          </sc-for>
        </ol>
      </section>
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 16px 24px; font-size: 13px; line-height: 19px; color: #3d4047">
        <div style="display: flex; align-items: center; gap: 10px"><span style="{{ chipMention }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>Mentioned you</span><span>Unread mention: someone wrote @Olivia in the work package. The marker goes when you open the conversation.</span></div>
        <div style="display: flex; align-items: center; gap: 10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"></path></svg><span>Answered: you replied to the newest message. Set by the server, so another mail program shows it too.</span></div>
        <div style="display: flex; align-items: center; gap: 10px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m15 14 5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"></path></svg><span>Forwarded: you passed the message on to someone else.</span></div>
      </div>
    </div>
  </figure>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1260}}'>
class Component extends DCLogic {
  renderVals() {
