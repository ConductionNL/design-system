<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, sjablonen doorvoeren</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Sjablonen" title="Launchpad-beheer: sjablonen" scope="dashboards die u uitrolt naar groepen" sections="{{ sections }}" hint-size="100%,1500px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Sjablonen: the templates rolled out to groups, the section that pushes a new
    // version to the dashboards already handed out, and the ready-made reports.
    const sections = [
      { name: 'Sjablonen', help: true, desc: '4 sjablonen, uitgerold naar groepen. Een nieuw sjabloon is een dashboard dat u hier aanwijst.', rows: [
        { table: ['Sjabloon', 'Uitgerold naar', 'Versie', 'In gebruik', ''], lines: [
          [{ strong: 'Intranet medewerkers' }, 'Alle medewerkers', 'versie 14', '212 dashboards', { buttons: [['Doorvoeren', ''], ['Bewerken', '']] }],
          [{ strong: 'KCC-wachtrij' }, 'KCC', 'versie 6', '18 dashboards', { buttons: [['Bewerken', '']] }],
          [{ strong: 'Nieuwe medewerker' }, 'Nieuw in dienst', { pill: 'versie 3 · update beschikbaar', tone: 'warning' }, '11 dashboards', { buttons: [['Bijwerken', ''], ['Bewerken', '']] }],
          [{ strong: 'Projectdashboard' }, 'Projectleiders', 'versie 2', '26 dashboards', { buttons: [['Bewerken', '']] }]
        ] },
        { buttons: [['Nieuw sjabloon', '']] }
      ] },
      { name: 'Wijzigingen doorvoeren: Intranet medewerkers, versie 14', desc: 'Sinds versie 13 kwamen de widgets Leesbevestiging en Verjaardagen erbij en verdween Oud nieuws. Kies hoe de 212 dashboards die al zijn uitgedeeld worden bijgewerkt.', rows: [
        { radios: 'Hoe bijwerken?', options: [['Alleen nieuwe widgets toevoegen', 'Niets verdwijnt; persoonlijke indeling blijft'], ['Persoonlijke aanpassingen behouden', 'Sjabloon wint, behalve wat iemand zelf heeft verplaatst of toegevoegd', true], ['Alles vervangen door het sjabloon', 'Persoonlijke aanpassingen gaan verloren']] },
        { note: '38 mensen hebben hun dashboard aangepast. Hun eigen widgets blijven staan.' },
        { buttons: [['Doorvoeren naar 212 dashboards', 'primary'], ['Annuleren', '']] }
      ] },
      { name: 'Kant-en-klare rapporten', desc: 'Rapporten die launchpad meelevert. Opslaan als dashboard maakt er een eigen dashboard van, dat u daarna aanpast en deelt.', rows: [
        { table: ['Rapport', 'Bron', 'Widgets', ''], lines: [
          [{ strong: 'Vergunningen per maand' }, 'dossiq · register Zaken', '4: doorlooptijd, openstaand, per zaaktype, trend', { buttons: [['Opslaan als dashboard', '']] }],
          [{ strong: 'Woo-verzoeken en termijnen' }, 'dossiq · registers Zaken en Publicaties', '3: binnen termijn, verlopen, gepubliceerd', { buttons: [['Opslaan als dashboard', '']] }],
          [{ strong: 'Ziekteverzuim per afdeling' }, 'humaniq · register Verzuim', { pill: 'Niet beschikbaar: register Verzuim ontbreekt', tone: 'warning' }, 'Installeer humaniq of koppel het register'],
          [{ strong: 'Bezoek van de website' }, 'portaliq · verkeer', '5: bezoekers, pagina\'s, zoektermen, bronnen, doelen', { buttons: [['Opslaan als dashboard', '']] }]
        ] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
