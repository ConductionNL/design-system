<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":5880}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 72; // one hour in px, 08:00 to 18:00
    const OFF = 14; // top offset so the 08:00 label is not clipped
    const NOW = 9; // Monday 12 October, 09:00
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'] };
    const CAL = { personal: '#3669a5', team: '#538b28', customers: '#ff9d2e' };
    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';
    const dark = (c) => 'color-mix(in srgb, ' + c + ' 60%, #1b1c1d)';
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (t) => pad(Math.floor(t)) + ':' + pad(Math.round((t % 1) * 60));
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(6 + i),
        lineStyle: 'position: absolute; left: 84px; right: 0; top: ' + top + 'px; border-top: 1px solid #eef0f3',
        localStyle: 'position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right',
        utcStyle: 'position: absolute; left: 42px; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; opacity: 0.6; text-align: right'
      });
    }
    const nowTop = (NOW - 8) * H + OFF;
    const nowLabelTop = nowTop - 8;
    // meeting block: [title, start, duration in hours, options {cal, chip:[type, number, status], video, flag, selected, past, pending}]
    const ev = (title, start, dur, o = {}) => {
      const c = CAL[o.cal ?? 'personal'];
      const short = dur <= 0.5;
      const tiny = dur <= 0.25;
      const end = start + dur;
      const pending = !!o.pending;
      return {
        title, href: o.chip && o.chip[1] === '#58412' ? 'ClEvent.dc.html' : '#',
        aria: title + ', ' + fmt(start) + ' to ' + fmt(end) + (pending ? ', not answered yet' : '') + (o.past ? ', over' : ''), current: o.selected ? 'true' : 'false',
        titleStyle: 'flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; ' + (tiny ? 'white-space: nowrap; text-overflow: ellipsis;' : 'display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;'),
        time: short ? fmt(start) : fmt(start) + ' to ' + fmt(end), inlineTime: tiny, blockTime: !short,
        flag: !!o.flag, video: !!o.video,
        hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '',
        style: 'position: absolute; ' + (o.half === 'left' ? 'left: 2px; right: calc(50% + 1px); ' : o.half === 'right' ? 'left: calc(50% + 1px); right: 4px; ' : 'left: 2px; right: 4px; ') + 'top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; justify-content: ' + (short ? 'center' : 'flex-start') + '; padding: ' + (short ? '0 6px' : '4px 7px') + '; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; text-decoration: none; z-index: 1; color: ' + dark(c) + '; ' +
          (pending ? 'background: #ffffff; border: 1px solid color-mix(in srgb, ' + c + ' 40%, #ffffff); border-left: 3px solid ' + c + '; opacity: 0.6;' : 'background: ' + pale(c) + '; border-left: 3px solid ' + c + ';') +
          (o.past ? ' opacity: 0.55;' : '') + (o.selected ? ' box-shadow: 0 0 0 2px #3669a5;' : '')
      };
    };
    const standup = (past) => ev('Stand-up', 10, 0.25, { cal: 'personal', past });
    const perDay = [
      [ev('Week planning', 8, 0.75, { cal: 'personal', past: true }), standup(false)],
      [standup(false), ev('Demo preparation Malmo Energi', 11, 1, { cal: 'customers' })],
      [standup(false), ev('Release 16.5 scope review', 9.5, 1.5, { cal: 'team', chip: ['EPIC', '#57990', 'in review'] })],
      [standup(false), ev('Rollout review Lyon, phase 2', 14, 1, { cal: 'customers', chip: ['FEATURE', '#58412', 'in development'], video: true, pending: true })],
      [standup(false), ev('Submit October hours', 17, 0.5, { cal: 'personal', flag: true })],
      [], []
    ];
    const mkDays = (per, extra = {}) => ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = i === 0;
      const weekend = i >= 5;
      return {
        name, n: 12 + i, today, events: per[i],
        hasEarlier: !!(extra.earlier && extra.earlier[i]), earlierText: extra.earlier && extra.earlier[i] ? extra.earlier[i][0] : '', earlierAria: extra.earlier && extra.earlier[i] ? extra.earlier[i][1] : '',
        hasLater: !!(extra.later && extra.later[i]), laterText: extra.later && extra.later[i] ? extra.later[i][0] : '', laterAria: extra.later && extra.later[i] ? extra.later[i][1] : '',
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : 'color: #1b1c1d; font-weight: 500',
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    const days = mkDays(perDay);
    // frame c: the same week with the events that sit above or below 08:00 to 18:00 announced by a pill
    const daysC = mkDays(perDay, { earlier: { 1: ['1 earlier', '1 event earlier, Early call Malmo Energi at 07:30. Scroll up'] }, later: { 3: ['1 later', '1 event later, Dinner with the Lyon team at 18:30. Scroll down'] } });
    // frame e: 09:45, two meetings at 10:00 side by side
    const NOW_E = 9.75;
    const nowTopE = (NOW_E - 8) * H + OFF;
    const nowLabelTopE = nowTopE - 8;
    const perDayE = perDay.slice();
    perDayE[0] = [ev('Week planning', 8, 0.75, { cal: 'personal', past: true }), ev('Stand-up', 10, 0.25, { cal: 'personal', half: 'left' }), ev('Supplier call Kassel', 10, 1, { cal: 'customers', half: 'right', video: true })];
    const daysE = mkDays(perDayE);
    // all-day bars: [type, number, subject, lane, startCol, endCol (inclusive), leftOpen, rightOpen, handles]
    const bars = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns', 0, 0, 2, false, false, true],
      ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout, 5 to 30 Oct', 1, 0, 6, true, true, false],
      ['EPIC', '#57990', 'Release 16.5 scope, 28 Sep to 23 Oct', 2, 0, 6, true, true, false]
    ].map(([type, number, subject, lane, s, e, leftOpen, rightOpen, handles]) => {
      const c = TYPE[type];
      const left = leftOpen ? '0px' : 'calc(100% * ' + s + ' / 7 + 2px)';
      const width = 'calc(100% * ' + (e - s + 1) + ' / 7' + (leftOpen ? '' : ' - 2px') + (rightOpen ? '' : ' - 4px') + ')';
      return {
        type, number, subject, color: c, leftOpen, rightOpen, handles,
        aria: type + ' ' + number + ', ' + subject,
        style: 'position: absolute; top: ' + (6 + lane * 24) + 'px; left: ' + left + '; width: ' + width + '; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-left: 3px solid ' + c + '; border-radius: 4px; background: ' + pale(c) + '; font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden'
      };
    });
    const dot = (st) => 'flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: ' + st[0] + '; border: 1.5px solid ' + st[1];
    const due = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns', 'in development', 'Wed 14'],
      ['TASK', '#58455', 'Prepare demo for Malmo Energi', 'new', 'Thu 15'],
      ['TASK', '#58441', 'Move kick-off to the afternoon', 'new', 'Fri 16']
    ].map(([type, number, subject, status, d]) => ({ type, number, subject, due: d, color: TYPE[type], dot: dot(STATUS[status]) }));
    return { hours, days, daysC, daysE, nowTopE, nowLabelTopE, bars, nowTop, nowLabelTop, due };
  }
}
