<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextcloud: inloggen</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#5b2e91}a:hover{color:#43206e}
</style>
</head>
<body>
<div class="sc-board" data-board="NcLogin">

<div style="position: relative; overflow: hidden; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1b1c1d; min-height: 900px; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 16px; box-sizing: border-box">
  <img src="../assets/esdoornveen/emblem.svg" alt="" style="position: absolute; right: -110px; bottom: -150px; height: 720px; width: auto; opacity: 0.06">
  <img src="../assets/esdoornveen/logo.svg" alt="Esdoornveen, mbo college" style="position: relative; height: 56px; width: auto">
  <main style="position: relative; width: 100%; max-width: 420px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 12px; box-shadow: 0 1px 2px rgba(27,28,29,0.04); overflow: hidden">
    <div aria-hidden="true" style="height: 6px; background: #5b2e91; overflow: hidden; display: flex; padding-left: 32px"><span style="flex: none; width: 96px; height: 6px; background: #c2255c; transform: skewX(-32deg)"></span></div>
    <div style="padding: 32px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 700">Inloggen bij de werkplek</h1>
        <p style="margin: 0; font-size: 15px; color: #5e6168">Voor medewerkers van Esdoornveen.</p>
      </div>
      <a href="esdoornveen-LpStart.html" style="display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 8px; background: #5b2e91; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none">Inloggen met uw schoolaccount</a>
      <div style="display: flex; align-items: center; gap: 12px; color: #5e6168; font-size: 14px"><span style="flex: 1; height: 1px; background: #e4e6ea"></span>of<span style="flex: 1; height: 1px; background: #e4e6ea"></span></div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="nc-u" style="font-size: 14px; font-weight: 600">Gebruikersnaam of e-mail</label>
        <input id="nc-u" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: 8px; font: 400 15px 'IBM Plex Sans', sans-serif">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="nc-p" style="font-size: 14px; font-weight: 600">Wachtwoord</label>
        <input id="nc-p" type="password" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: 8px; font: 400 15px 'IBM Plex Sans', sans-serif">
      </div>
      <button type="button" style="height: 44px; border: 1px solid #c4c7cb; border-radius: 8px; background: #ffffff; color: #1b1c1d; font: 600 15px 'IBM Plex Sans', sans-serif">Inloggen</button>
      <a href="#" style="font-size: 14px; align-self: center; display: inline-flex; align-items: center; min-height: 40px">Wachtwoord vergeten?</a>
    </div>
  </main>
  <p style="position: relative; margin: 0; font-size: 14px; color: #3d4047; text-align: center">Student of leerbedrijf? Ga naar <a href="esdoornveen-Inloggen.html">Mijn Esdoornveen</a>.</p>
  <p style="position: relative; margin: 0; font-size: 13px; color: #5e6168">Esdoornveen, mbo college · werkplek op Nextcloud</p>
</div>
</div>
</body>
</html>
