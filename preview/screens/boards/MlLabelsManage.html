                <span style="font-weight: 400; color: var(--sc-work-muted, #5e6168); line-height: 18px">The assistant reads this to suggest the label on new mail, marked Generated until you confirm it. Write it the way you would explain it to a colleague. Suggestions are on, <a href="MlSettingsAccount.html" style="color: var(--sc-link, var(--sc-primary, #3669a5)); font-weight: 600; text-decoration: none">change</a></span>
              </label>
              <div style="display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; opacity: 0.45" disabled>Save label</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; opacity: 0.45" disabled>Cancel</button>
                <span style="flex: 1 1 auto"></span>
                <button type="button" aria-expanded="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-accent, #cc0000); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-accent, #cc0000); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Delete label</button>
              </div>
              <div role="alertdialog" aria-label="Confirm deleting the label" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid var(--sc-accent, #cc0000); border-radius: var(--sc-radius, 8px); background: #fbeaea; font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)">
                <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--sc-accent, #cc0000)"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg>
                <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 8px">
                  <span>Delete Waiting for customer? It is taken off all 14 conversations that carry it. The conversations themselves stay where they are.</span>
                  <div style="display: flex; gap: 8px">
                    <button type="button" style="display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border: 1px solid var(--sc-accent, #cc0000); border-radius: var(--sc-radius, 8px); background: var(--sc-accent, #cc0000); color: #ffffff; font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Delete from all 14 conversations</button>
                    <button type="button" style="display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Keep the label</button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">c</span> &nbsp;No labels yet: the tree offers a ready-made starter set</figcaption>
    <div style="position: relative; height: 480px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(27,28,29,0.45)"></div>
      <div role="dialog" aria-modal="true" aria-label="Manage labels, none yet" style="position: relative; z-index: 2; width: 900px; height: 420px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
        <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 12px 0 24px; box-sizing: border-box; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
          <h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2">Manage labels</h2>
          <button type="button" aria-label="Close manage labels" style="width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-text, #3d4047); display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div style="flex: 1 1 auto; min-height: 0; display: flex">
          <section aria-label="Label tree, empty" style="flex: 0 0 340px; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; border-right: 1px solid var(--sc-work-line, #e4e6ea)">
            <div style="flex: none; display: flex; align-items: center; gap: 6px; padding: 12px 12px 8px">
              <button type="button" style="flex: 1 1 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New label</button>
              <button type="button" aria-label="Expand all" disabled style="flex: none; width: 34px; height: 34px; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-field, #c4c7cb); display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg></button>
              <button type="button" aria-label="Collapse all" disabled style="flex: none; width: 34px; height: 34px; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-field, #c4c7cb); display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 11-5-5-5 5M17 18l-5-5-5 5"></path></svg></button>
            </div>
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px 32px; text-align: center">
              <svg width="40" height="40" viewbox="0 0 24 24" fill="none" stroke="#c4c7cb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:var(--sc-work-field, #c4c7cb)"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01"></path></svg>
              <strong style="font-size: 16px; font-weight: 600; line-height: 22px">No labels yet</strong>
              <span style="font-size: 13px; color: var(--sc-work-muted, #5e6168); line-height: 19px">Make your own with New label, or start from the set on the right.</span>
            </div>
          </section>
          <section aria-label="Starter set" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px 24px 20px">
            <div style="display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 22px">Start from a ready-made set</h3><p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Five labels most project teams use. Untick the ones you do not want; you can rename or recolour them afterwards.</p></div>
            <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
              
                <li style="display: flex; align-items: center; gap: 12px; height: 40px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
                  <input type="checkbox" checked aria-label="Add Waiting for customer" style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
                  <span style="flex: none; width: 10px; height: 10px; margin: 0 3px; border-radius: 5px; background: #ff9d2e"></span>
                  <span style="flex: none; width: 170px; font-size: 14px">Waiting for customer</span>
                  <span style="flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">The customer still owes us an answer or a decision</span>
                </li>
              
                <li style="display: flex; align-items: center; gap: 12px; height: 40px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
                  <input type="checkbox" checked aria-label="Add Offer" style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
                  <span style="flex: none; width: 10px; height: 10px; margin: 0 3px; border-radius: 5px; background: #08a5df"></span>
                  <span style="flex: none; width: 170px; font-size: 14px">Offer</span>
                  <span style="flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Quotes and proposals, sent or received</span>
                </li>
              
                <li style="display: flex; align-items: center; gap: 12px; height: 40px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
                  <input type="checkbox" checked aria-label="Add Internal" style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
                  <span style="flex: none; width: 10px; height: 10px; margin: 0 3px; border-radius: 5px; background: var(--sc-work-muted, #5e6168)"></span>
                  <span style="flex: none; width: 170px; font-size: 14px">Internal</span>
                  <span style="flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mail between colleagues, no customer involved</span>
                </li>
              
                <li style="display: flex; align-items: center; gap: 12px; height: 40px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
                  <input type="checkbox" checked aria-label="Add Invoice" style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
                  <span style="flex: none; width: 10px; height: 10px; margin: 0 3px; border-radius: 5px; background: #538b28"></span>
                  <span style="flex: none; width: 170px; font-size: 14px">Invoice</span>
                  <span style="flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Bills to pay or to send, with a PDF attached</span>
                </li>
              
                <li style="display: flex; align-items: center; gap: 12px; height: 40px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
                  <input type="checkbox" checked aria-label="Add Newsletter" style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
                  <span style="flex: none; width: 10px; height: 10px; margin: 0 3px; border-radius: 5px; background: #005b77"></span>
                  <span style="flex: none; width: 170px; font-size: 14px">Newsletter</span>
                  <span style="flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mailing lists and digests you read when there is time</span>
                </li>
              
            </ul>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Add these 5 labels</button>
              <span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">Each one comes with a description the assistant can use.</span>
            </div>
          </section>
        </div>
      </div>
    </div>
  </figure>

</div>
</div>
</body>
</html>
