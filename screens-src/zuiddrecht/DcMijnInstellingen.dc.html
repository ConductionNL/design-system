<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>decidiq: mijn instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="DcDashboard" hint-size="100%,2260px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Decidiq" version="1.2.6" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Decidiq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen in the navigation.
    // Replaces both /settings/user/decidiq (PersonalRoot.vue) and the in-app page /user-settings (Voorkeuren):
    // the five sections of src/components/userSettings/ live here now (decision 11 Oct 2026).
    const sections = [
      { name: 'Meldingen', desc: 'Waarover en hoe Decidiq je laat weten dat er iets is. Je organisatie bepaalt welke verplicht zijn.', rows: [
        { matrix: 'Over', cols: ['In Nextcloud', 'Per e-mail'], lines: [
          ['Een stemming opent voor jou', [true, true]],
          ['Agenda gepubliceerd of gewijzigd', [true, false]],
          ['Stukken sluiten over 2 dagen', [true, true]],
          ['Een actiepunt is aan jou toegewezen', [true, false]],
          ['Een besluit is genomen in je orgaan', [false, false]]
        ] },
        { select: 'Herinnering voor een vergadering', value: '24 uur en 1 uur vooraf' }
      ] },
      { name: 'Afwezigheid', desc: 'Wie je stappen in besluitroutes zet terwijl je weg bent.', rows: [
        { pair: [{ label: 'Afwezig van', value: '19 oktober 2026' }, { label: 'Tot en met', value: '30 oktober 2026' }] },
        { select: 'Vervanger', value: 'Anouk Bakker' },
        { buttons: [['Vervanging opslaan', 'primary'], ['Vervanging wissen', '']] }
      ] },
      { name: 'Weergave', desc: 'Hoe lijsten en data er voor jou uitzien.', rows: [
        { pair: [{ label: 'Startpagina', value: 'Dashboard', select: true }, { label: 'Rijen per pagina', value: '20', select: true }, { label: 'Datumnotatie', value: '7 oktober 2026', select: true }] }
      ] },
      { name: 'Contact', desc: 'Hoe de griffie je bereikt over bestuurlijke zaken.', rows: [
        { pair: [{ label: 'E-mail voor bestuurszaken', value: 'p.jansen@zuiddrecht.nl' }, { label: 'Telefoon voor spoed', value: '06 12 34 56 78' }] },
        { select: 'Taal van berichten', value: 'Nederlands' }
      ] },
      { name: 'Abonnementen', desc: 'Volg organen, ook als je er geen lid van bent.', rows: [
        { items: [
          ['Gemeenteraad', 'Agenda, stukken, besluiten · direct', 'Verwijderen'],
          ['Commissie Ruimte', 'Agenda en besluiten · dagelijks overzicht', 'Verwijderen'],
          ['College van B en W', 'Besluitenlijsten · wekelijks overzicht', 'Verwijderen']
        ] },
        { buttons: [['Abonnement toevoegen', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
