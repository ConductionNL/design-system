    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(6 + i),
        lineStyle: 'position: absolute; left: 84px; right: 0; top: ' + top + 'px; border-top: 1px solid #eef0f3',

    const ev = (title, start, dur, cal) => {

      return { title, time: fmt(start) + ' to ' + fmt(start + dur), style: 'position: absolute; left: 2px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; padding: 4px 7px; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; color: ' + dark(c) + '; background: ' + pale(c) + '; border-left: 3px solid ' + c };
    };
    const standup = ev('Stand-up', 10, 0.5, 'personal');
    const perDay = [

      [standup, ev('Demo preparation Malmo Energi', 11, 1, 'customers')],

      [standup, ev('Submit October hours', 17, 0.5, 'personal')],
      [], []

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {

      ['Thursday', ['09:00 to 17:30']], ['Friday', ['09:00 to 16:00']], ['Saturday', []], ['Sunday', []]
    ].map(([name, ranges]) => { const on = ranges.length > 0; return { name, on, ranges: on ? ranges : ['Not working'], checked: on ? 'true' : 'false', aria: name + ' is a working day', addAria: 'Add a range on ' + name, color: on ? '#1b1c1d' : '#5e6168', switch: on ? switchOn : switchOff, knob: on ? knobOn : knobOff }; });
    const services = [
      ['Talk', 'A new conversation per event', 'Always', false, '#5e6168'],
      ['Google Meet', 'Through the connected Google account', 'Connected', false, '#5e6168'],
      ['Microsoft Teams', 'Through the connected Microsoft 365 account', 'Connected', false, '#5e6168'],
      ['Zoom', 'Not connected', 'Hidden until connected', false, '#5e6168', true],
      ['Northwind Jitsi', 'https://meet.northwind-projects.test/olivia', 'Fixed link', true, '#3d4047']
    ].map(([name, link, how, removable, linkColor, connect]) => ({ name, link, how, removable, connect: !!connect, linkStyle: removable ? 'font-family: ui-monospace, monospace; font-size: 12px; color: ' + linkColor : 'font-size: 13px; color: ' + linkColor }));
    const timeField = 'width: 72px; height: 32px; padding: 0 8px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 14px \'Fira Sans\', sans-serif; color: #1b1c1d; text-align: center';
    const wizardDays = [
      ['Monday', '09:00', '17:30'], ['Tuesday', '09:00', '17:30'], ['Wednesday', '09:00', '17:30'],
      ['Thursday', '09:00', '17:30'], ['Friday', '09:00', '17:30'], ['Saturday', '', ''], ['Sunday', '', '']
    ].map(([name, from, to], i) => { const on = from !== ''; return { name, from, to, on, off: !on, checked: on ? 'true' : 'false', aria: name + ' is a working day', fromAria: 'Start on ' + name, toAria: 'End on ' + name, color: on ? '#1b1c1d' : '#5e6168', switch: on ? switchOn : switchOff, knob: on ? knobOn : knobOff, rowStyle: i === 0 ? '' : 'border-top: 1px solid #eef0f3' }; });
    return { switchOn, knobOn, switchOff, knobOff, hours, days, weekdays, services, timeField, wizardDays };
  }
