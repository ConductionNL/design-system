<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: add a calendar, subscribe or import</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2030px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Add calendar, opened from the plus beside Calendars in the list, over the clean week: the ways down the left, Import chosen, three files dropped with a target calendar per file, and the result of the first two</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="245px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
            <button type="button" aria-label="Open the overview" aria-expanded="false" title="Open the overview" style="width: 34px; height: 34px; margin-left: 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
      </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
              <span style="flex: none; color: #3d4047">{{ b.number }}</span>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
            </a>
          </sc-for>
          <div style="position: absolute; top: 6px; left: calc(100% * 3 / 7 + 24px); height: 20px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5e6168; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M3 12h18"></path></svg>Drag an end to change the dates in OpenProject</div>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
      </div>
    </main>
      </div>

      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 72px">
        <div role="dialog" aria-modal="true" aria-labelledby="cl-add-title" style="width: 920px; min-height: 640px; box-sizing: border-box; display: flex; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); overflow: hidden">
          <nav aria-label="Ways to add a calendar" style="flex: 0 0 250px; width: 250px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; padding: 16px 10px; background: #f5f6f8; border-right: 1px solid #e4e6ea">
            <h3 id="cl-add-title" style="margin: 0 0 8px; padding: 0 10px; font-size: 20px; font-weight: 700; line-height: 24px">Add calendar</h3>
            <sc-for list="{{ ways }}" as="w" hint-placeholder-count="8">
              <a href="#" aria-current="{{ w.current }}" style="{{ w.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="{{ w.icon }}"></path></svg><span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.25"><span>{{ w.label }}</span><span style="font-size: 11px; font-weight: 400; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ w.hint }}</span></span></a>
            </sc-for>
          </nav>
          <section aria-label="Import" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
            <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 16px 20px 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
              <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Import</h3>
              <button type="button" aria-label="Close" style="flex: none; width: 40px; height: 40px; margin: -8px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 16px 24px 8px">
              <p style="margin: 0; font-size: 13px; color: #5e6168; line-height: 19px">Drop one or more files here, or choose them. Calendar files (.ics, .json, .xml) are accepted. Each file goes to a calendar of your choice.</p>
              <div style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 56px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Drop more files here, or <button type="button" style="height: 34px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif">choose files</button></div>
              <div style="border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px">
                <thead><tr style="background: #fafbfc"><th scope="col" style="{{ th }}">File</th><th scope="col" style="{{ th }}">Into calendar</th><th scope="col" style="{{ th }}">Result</th></tr></thead>
                <tbody>
                  <sc-for list="{{ files }}" as="f" hint-placeholder-count="3">
                    <tr style="border-top: 1px solid #eef0f3; vertical-align: middle">
                      <td style="padding: 10px 16px; width: 40%"><span style="display: flex; flex-direction: column; line-height: 18px"><span style="display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2zM14 2v6h6"></path></svg>{{ f.name }}</span><span style="padding-left: 24px; font-size: 12px; color: #5e6168; line-height: 16px">{{ f.kind }}</span></span></td>
                      <td style="padding: 7px 16px"><button type="button" aria-haspopup="listbox" aria-label="Calendar for {{ f.name }}: {{ f.target }}" style="{{ chooser }}"><span style="display: inline-flex; align-items: center; gap: 8px"><span aria-hidden="true" style="{{ f.box }}"></span>{{ f.target }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></td>
                      <td style="padding: 12px 16px; font-size: 13px; line-height: 18px; color: {{ f.resultColor }}"><span style="display: block; line-height: 20px; white-space: nowrap">{{ f.result }}</span><sc-if value="{{ f.hasReason }}" hint-placeholder-val="{{ false }}"><span style="display: block; font-size: 12px; line-height: 16px">{{ f.reason }}</span></sc-if></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table></div>
              <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #3669a5"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span><strong style="font-weight: 600">2 of 3 files imported: 61 events came in, 3 failed.</strong> The 3 that failed have no end time; <a href="#" style="color: var(--sc-link, #3669a5)">show them</a> to fix the file and import it again. New calendar is created when the third file goes in.</span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; margin: 16px 0 0; padding: 16px 24px; border-top: 1px solid #eef0f3">
              <span style="font-size: 13px; color: #5e6168">Events already in the calendar are not doubled.</span>
              <span style="flex: 1 1 auto"></span>
              <button type="button" style="{{ secondary }}">Close</button>
              <button type="button" style="{{ primary }}">Import the remaining file</button>
            </div>
          </section>
        </div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The other seven ways, each as it appears on the right of the same dialog, and Import as it looks before any file is dropped</figcaption>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px">

      <section aria-label="New calendar" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">New calendar</h3>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="cl-new-name" style="{{ fieldLabel }}">Name</label><input id="cl-new-name" type="text" value="Malmo Energi" style="{{ input }}"></div>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0 0 4px; float: left; width: 100%; font-size: 12px; font-weight: 600; color: #5e6168">Colour</legend><div style="display: flex; align-items: center; gap: 6px; height: 32px"><sc-for list="{{ swatches }}" as="s" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ s.on }}" aria-label="{{ s.name }}" style="{{ s.style }}"></button></sc-for></div></fieldset>
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0 0 4px; float: left; width: 100%; font-size: 12px; font-weight: 600; color: #5e6168">What it holds</legend>
          <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="radio" name="cl-new-kind" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Events only</label>
          <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="radio" name="cl-new-kind" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Events and a task list</label>
        </fieldset>
        <span style="{{ hint }}">The task list appears in the Tasks app under the same name.</span>
        <div style="{{ paneFoot }}"><button type="button" style="{{ primary }}">Create calendar</button></div>
      </section>

      <section aria-label="Holidays" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">Holidays</h3>
        <span style="{{ hint }}">Public holidays of a region, kept up to date for you. Read only, never counts as busy.</span>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="cl-hol-region" style="{{ fieldLabel }}">Region</label><button id="cl-hol-region" type="button" aria-haspopup="listbox" style="{{ chooserWide }}"><span>Netherlands</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="cl-hol-lang" style="{{ fieldLabel }}">Names in</label><button id="cl-hol-lang" type="button" aria-haspopup="listbox" style="{{ chooserWide }}"><span>English</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
        <span style="{{ hint }}">Next: King's Day, Monday 27 April 2027. 11 days a year.</span>
        <div style="{{ paneFoot }}"><button type="button" style="{{ primary }}">Add holidays of Netherlands</button></div>
      </section>

      <section aria-label="From a link" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">From a link</h3>
        <span style="{{ hint }}">An outside calendar you follow. It is read only here and fetched again every few hours.</span>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="cl-sub-url" style="{{ fieldLabel }}">Link to the calendar</label><input id="cl-sub-url" type="url" value="https://malmo-energi.se/events.ics" style="{{ input }}"></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="cl-sub-name" style="{{ fieldLabel }}">Name in your list</label><input id="cl-sub-name" type="text" value="Malmo Energi events" style="{{ input }}"></div>
        <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5e6168"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg>Subscribed, read only</span>
        <div style="{{ paneFoot }}"><button type="button" style="{{ primary }}">Subscribe</button></div>
      </section>

      <section aria-label="Suggested by your administrator" style="{{ pane }}">
        <h3 style="{{ paneTitle }}">Suggested by your administrator</h3>
        <span style="{{ hint }}">Public calendars of Northwind Projects. Subscribe to the ones you want.</span>
        <div style="display: flex; flex-direction: column">
          <sc-for list="{{ suggested }}" as="s" hint-placeholder-count="3">
