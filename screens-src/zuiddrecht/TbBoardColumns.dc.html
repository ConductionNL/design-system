<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: board on a touch screen with a column menu open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1000px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 1194px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Tablet, 1194 px wide: touch targets 44 px, the navigation folded to its rail, a column lifted by a long press and the menu of the column new open</figcaption>
    <div style="position: relative; height: 920px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" folded="true" hint-size="64px,865px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; gap: 14px; height: 64px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.2; white-space: nowrap">Northwind rollout Lyon</h1><span style="font-size: 13px; color: #5e6168; white-space: nowrap">9 open</span></div>
            <div style="flex: 1 1 auto"></div>
            <sc-for list="{{ switches }}" as="s" hint-placeholder-count="2">
              <button type="button" role="switch" aria-checked="{{ s.on }}" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 500 13px 'Fira Sans', sans-serif; white-space: nowrap"><span aria-hidden="true" style="{{ s.track }}"><span style="{{ s.knob }}"></span></span><span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; line-height: 16px">{{ s.label }}<sc-if value="{{ s.nco }}" hint-placeholder-val="{{ false }}"><span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></sc-if></span></button>
            </sc-for>
            <div role="group" aria-label="Who has this board open" title="Tom Achterberg and Priya Raman have this board open" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff">
              <span style="display: flex; align-items: center">
                <sc-for list="{{ present }}" as="p" hint-placeholder-count="2"><span role="img" aria-label="{{ p.name }}, has this board open" style="{{ p.style }}">{{ p.initials }}<span aria-hidden="true" style="position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #538b28; border: 2px solid #ffffff"></span></span></sc-for>
              </span>
              <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px"><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap">Tom Achterberg and Priya Raman have this board open</span><span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span>
            </div>
          </div>
          <div role="status" aria-live="polite" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; box-sizing: border-box; background: #eaf0f7; border-bottom: 1px solid #e4e6ea; font-size: 13px; color: #234a78">
            <span aria-hidden="true" style="flex: none; width: 8px; height: 8px; border-radius: 4px; background: #538b28"></span>
            <span style="flex: none; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px">Live</span>
            <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tom Achterberg moved BUG #58231 to in review just now. The board updated without a reload.</span>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; gap: 10px; padding: 12px; overflow: hidden">
            <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
              <sc-if value="{{ col.isGhost }}" hint-placeholder-val="{{ false }}">
                <div aria-hidden="true" style="flex: 0 0 176px; width: 176px; height: 150px; align-self: flex-start; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding: 12px; border: 2px dashed #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 600; text-align: center; line-height: 18px">Drop the column here</div>
              </sc-if>
              <sc-if value="{{ col.isColumn }}" hint-placeholder-val="{{ true }}">
                <section aria-label="{{ col.name }}" style="{{ col.sectionStyle }}">
                  <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 0 0 6px">
                    <span style="{{ col.dot }}"></span>
                    <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.name }}</h2>
                    <sc-if value="{{ col.isDone }}" hint-placeholder-val="{{ false }}"><span title="Closed column: cards dropped here are closed" style="flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; line-height: 20px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #234a78; border: 1px solid #3669a5; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Closed column</span></sc-if>
                    <sc-if value="{{ col.hasCount }}" hint-placeholder-val="{{ true }}"><span aria-label="{{ col.countLabel }}" style="{{ col.countStyle }}">{{ col.count }}</span></sc-if>
                    <button type="button" aria-label="Column menu for {{ col.name }}" aria-haspopup="menu" aria-expanded="{{ col.menuOpen }}" style="{{ col.menuStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
                  </div>
                  <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
                    <a href="TbCard.dc.html" aria-label="{{ c.aria }}" style="{{ c.style }}">
                      <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">{{ c.subject }}</span>
                      <sc-if value="{{ c.hasNote }}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 14px; color: #234a78; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg>{{ c.note }}</span></sc-if>
                    </a>
                  </sc-for>
                  <sc-if value="{{ col.hasMenu }}" hint-placeholder-val="{{ false }}">
                    <div role="menu" aria-label="Column new" style="position: absolute; left: 136px; top: 48px; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10">
                      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
                        <sc-if value="{{ m.isRule }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div></sc-if>
                        <sc-if value="{{ m.isItem }}" hint-placeholder-val="{{ true }}">
                          <button type="button" role="menuitem" style="{{ m.style }}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ m.icon }}"></path></svg>
                            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; text-align: left; line-height: 17px"><span style="font-size: 14px">{{ m.label }}</span><sc-if value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.sub }}</span></sc-if><sc-if value="{{ m.nco }}" hint-placeholder-val="{{ false }}"><span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></sc-if></span>
                          </button>
                        </sc-if>
                      </sc-for>
                    </div>
                  </sc-if>
                </section>
              </sc-if>
            </sc-for>
            <button type="button" style="flex: 0 0 116px; width: 116px; height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a column</button>

            <section aria-label="on hold, lifted to move it" style="position: absolute; left: 578px; top: 22px; width: 176px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; border: 1px solid #3669a5; box-shadow: 0 10px 24px rgba(27,28,29,0.22); transform: rotate(1.5deg); z-index: 5; cursor: grabbing">
              <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 0 0 6px">
                <span style="{{ lifted.dot }}"></span>
                <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap">on hold</h2>
                <span style="{{ lifted.countStyle }}">1</span>
                <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></span>
              </div>
              <span style="{{ lifted.cardStyle }}"><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">Folder link breaks on rename</span></span>
            </section>
            <div style="position: absolute; left: 578px; top: 174px; width: 176px; display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 16px; color: #234a78; z-index: 6"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M3 12h18"></path></svg><span>Lifted by a long press. Drop it between two columns to change the order.</span></div>

            <div role="status" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 6px 0 14px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 13px; white-space: nowrap; box-shadow: 0 4px 12px rgba(27,28,29,0.12)"><span>Column needs clarification deleted. Its 1 card moved to new.</span><button type="button" style="height: 32px; padding: 0 12px; border: 1px solid rgba(255,255,255,0.4); border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; font: 600 13px 'Fira Sans', sans-serif">Undo</button></div>
          </div>
          <div style="flex: none; padding: 0 16px 10px"><div style="display: flex; align-items: flex-start; gap: 8px; font-size: 12px; color: #5e6168; line-height: 18px; "><span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span><span>Kept in Nextcloud. OpenProject does not have this, so it is not stored in the work package.</span></div></div>
        </main>
      </div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'], 'closed': ['#dee2e6', '#adb5bd'] };
    const dot = (name) => 'flex: none; width: 12px; height: 12px; box-sizing: border-box; border-radius: 6px; background: ' + STATUS[name][0] + '; border: 1.5px solid ' + STATUS[name][1];
    const countStyle = 'flex: none; font-size: 12px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: var(--sc-radius, 8px); white-space: nowrap; background: #ffffff; color: #5e6168; border: 1px solid #e4e6ea';
    // compact card: title only, 44 px tall, the type as a 3 px edge
    const cardBase = (type) => 'display: flex; flex-direction: column; justify-content: center; gap: 2px; min-height: 44px; padding: 4px 10px 4px 9px; box-sizing: border-box; border: 1px solid #e4e6ea; border-left: 3px solid ' + TYPE[type] + '; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; text-decoration: none; ';
    const card = (type, number, subject, status, note) => ({ subject, aria: type + ' ' + number + ', ' + subject + ', ' + status, style: cardBase(type), hasNote: !!note, note: note ?? '' });
    const cols = [
      { name: 'new', cards: [card('TASK', '#58441', 'Move kick-off to the afternoon', 'new'), card('TASK', '#58455', 'Prepare demo for Malmo Energi', 'new'), card('TASK', '#58301', 'Quote for project lead training Kassel', 'new')], menuOpen: true },
      { name: 'in development', cards: [card('FEATURE', '#58412', 'Link Nextcloud project folders on rollout', 'in development')], limit: 'of 4' },
      { name: 'in review', cards: [card('BUG', '#58231', 'Gantt PDF export drops trailing columns', 'in review'), card('FEATURE', '#58390', 'Single sign-on through Keycloak', 'in review'), card('EPIC', '#57990', 'Release 16.5 scope', 'in review')] },
      { ghost: true },
      { name: 'closed', done: true, cards: [card('TASK', '#58440', 'Send OIDC client settings to Lyon', 'closed', 'Closed just now, moved here from new'), card('FEATURE', '#58215', 'Export work package list to Excel', 'closed')] }
    ];
    const columns = cols.map((c) => c.ghost ? { isGhost: true, isColumn: false } : ({
      isGhost: false, isColumn: true, sectionStyle: 'position: relative; flex: 0 0 ' + (c.done ? 230 : 176) + 'px; width: ' + (c.done ? 230 : 176) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; align-self: flex-start; max-height: 100%', name: c.name, cards: c.cards, isDone: !!c.done, hasMenu: !!c.menuOpen,
      hasCount: !c.done, count: c.limit ? c.cards.length + ' ' + c.limit : String(c.cards.length),
      countLabel: c.limit ? c.cards.length + ' of 4 work packages, work in progress limit' : c.cards.length + ' work packages',
      countStyle: countStyle + (c.limit ? '; color: #234a78; border-color: #3669a5' : ''),
      dot: dot(c.name), menuOpen: c.menuOpen ? 'true' : 'false',
      menuStyle: 'flex: none; width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); display: inline-flex; align-items: center; justify-content: center; ' + (c.menuOpen ? 'background: #ffffff; color: #234a78; box-shadow: inset 0 0 0 1px #3669a5' : 'background: transparent; color: #5e6168')
    }));
    const item = 'display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 4px 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font-family: \'Fira Sans\', system-ui, sans-serif; ';
    const menu = [
      ['Rename column', 'M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z', ''],
      ['Mark as the closed column', 'M20 6 9 17l-5-5', 'Cards dropped here are closed. Closed cards move here.'],
      ['Archive all cards in this column', 'M21 8v13H3V8M1 3h22v5H1zM10 12h4', '', true],
      ['Unarchive all cards in this column', 'M21 8v13H3V8M1 3h22v5H1zM12 17v-5M9 14l3-3 3 3', '', true],
      null,
      ['Delete column', 'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2', 'Its cards move to the first column. You can undo this for a short while.']
    ].map((m) => m ? ({ isRule: false, isItem: true, nco: !!m[3], label: m[0], icon: m[1], hasSub: !!m[2], sub: m[2], style: item + (m[0] === 'Delete column' ? 'color: #ab0000' : '') }) : ({ isRule: true, isItem: false, nco: false, label: '', icon: '', hasSub: false, sub: '', style: '' }));
    const lifted = { dot: dot('on hold'), countStyle, cardStyle: cardBase('BUG') };
    const track = (on) => 'position: relative; display: inline-block; width: 36px; height: 20px; box-sizing: border-box; border-radius: 10px; ' + (on ? 'background: var(--sc-action, #3669a5); border: 1px solid var(--sc-action-deep, #234a78)' : 'background: #ffffff; border: 1px solid #c4c7cb');
    const knob = (on) => 'position: absolute; top: 2px; width: 14px; height: 14px; border-radius: 7px; ' + (on ? 'left: 18px; background: #ffffff' : 'left: 2px; background: #5e6168');
    const switches = [['Compact cards', true, false], ['Archived cards only', false, true]].map(([label, on, nco]) => ({ label, nco: !!nco, on: on ? 'true' : 'false', track: track(on), knob: knob(on) }));
    const av = 'position: relative; width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #eaf0f7; color: #234a78; ';
    const present = [['Tom Achterberg', 'TA'], ['Priya Raman', 'PR']].map(([name, initials], i) => ({ name, initials, style: av + (i ? 'margin-left: -8px;' : '') }));
    return { columns, menu, lifted, switches, present };
  }
}
</script>
</body>
</html>
