<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: project details with the members tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#tb-prj-add::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2456px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The More menu of the project header, open over the board: Project details lives here, with the same project actions as in the projects table; the view settings of the board (compact cards, archived cards only) sit in their own View menu next to Group by, saved at once, for you, on this board</figcaption>
    <div style="position: relative; height: 813px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" hint-size="264px,745px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">9 open work packages</span></div>
        <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
          <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>
        </div>
        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Status. Choose assignee or version" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Status<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="tb-view-menu" aria-label="View settings of this board" title="View settings of this board: compact cards, archived cards only" style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">View<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <div id="tb-view-menu" role="menu" aria-label="View settings of this board" title="Saved at once, for you, on this board." style="display: none; flex-direction: column; width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px)">
        <sc-for list="{{ switches }}" as="s" hint-placeholder-count="2">
          <button type="button" role="menuitemcheckbox" aria-checked="{{ s.on }}" style="display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 4px 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font-family: 'Fira Sans', system-ui, sans-serif; text-align: left"><span aria-hidden="true" style="{{ s.track }}"><span style="{{ s.knob }}"></span></span><span style="display: flex; flex-direction: column; gap: 2px; line-height: 16px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px">{{ s.label }}<sc-if value="{{ s.nco }}" hint-placeholder-val="{{ false }}"><span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></sc-if></span><span style="font-size: 12px; color: #5e6168">{{ s.sub }}</span></span></button>
        </sc-for>
        </div>
        <div style="flex: 1 1 auto"></div>
        <button type="button" aria-pressed="false" aria-haspopup="dialog" aria-keyshortcuts="F" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter</button>
        <div role="group" aria-label="Members" style="flex: none; display: flex; align-items: center">
          <sc-for list="{{ team }}" as="t" hint-placeholder-count="4"><span title="{{ t.name }}" aria-label="{{ t.name }}" role="img" style="{{ t.style }}">{{ t.initials }}</span></sc-for>
        </div>
        <button type="button" aria-haspopup="menu" aria-expanded="true" aria-controls="tb-prj-menu" aria-label="More actions for this project" style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px 0 12px; border: 1px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; padding: 12px; overflow: hidden">
        <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
          <section aria-label="{{ col.name }}" style="flex: 0 0 226px; width: 226px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; align-self: flex-start; max-height: 100%">
            <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px">
              <span style="{{ col.dot }}"></span>
              <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.name }}</h2>
              <span aria-label="{{ col.countLabel }}" style="{{ col.countStyle }}">{{ col.count }}</span>
              <button type="button" aria-label="New work package with status {{ col.name }}" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
            </div>
            <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
              <a href="{{ c.href }}" aria-label="{{ c.aria }}" style="{{ c.style }}">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="{{ c.typeStyle }}">{{ c.type }}</span><span style="color: #3d4047">{{ c.number }}</span><span style="flex: 1 1 auto"></span><sc-if value="{{ c.high }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff9d2e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Priority high"><path d="m6 13 6-6 6 6M6 19l6-6 6 6"></path></svg></sc-if></span>
                <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">{{ c.subject }}</span>
                <sc-if value="{{ c.hasMail }}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">From mail: {{ c.mailFrom }}</span></span></sc-if>
                <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
                  <sc-if value="{{ c.hasAssignee }}" hint-placeholder-val="{{ true }}"><span title="{{ c.assignee }}" role="img" aria-label="Assignee {{ c.assignee }}" style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ c.initials }}</span></sc-if>
                  <sc-if value="{{ c.hasDue }}" hint-placeholder-val="{{ true }}"><span style="{{ c.dueStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{ c.due }}</span></sc-if>
                </span>
              </a>
            </sc-for>
          </section>
        </sc-for>
      </div>
      <div id="tb-prj-menu" role="menu" aria-label="More actions for this project" style="position: absolute; right: 0; top: 60px; margin-top: 4px; width: 380px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column">
        <button type="button" role="menuitem" aria-haspopup="dialog" title="Members, tags, files and chats, deleted items, activity" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span style="flex: 1 1 auto; text-align: left; font-weight: 600">Project details</span></button>
        <a href="#" role="menuitem" style="{{ item }}; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"></path></svg>Open in OpenProject</a>
        <div role="separator" style="{{ sep }}"></div>
        <button type="button" role="menuitem" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Rename and colour</button>
        <button type="button" role="menuitemcheckbox" aria-checked="true" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg><span style="flex: 1 1 auto; text-align: left">Open on start</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #234a78"><path d="M20 6 9 17l-5-5"></path></svg></button>
        <button type="button" role="menuitem" aria-haspopup="dialog" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M20 9h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span style="flex: 1 1 auto; text-align: left">Copy project...</span></button>
        <button type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg><span style="flex: 1 1 auto; text-align: left">Export or subscribe...</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m9 18 6-6-6-6"></path></svg></button>
        <div role="separator" style="{{ sep }}"></div>
        <button type="button" role="menuitem" title="Hidden from the list, kept in OpenProject." style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"></path></svg><span style="flex: 1 1 auto; text-align: left">Archive</span></button>
        <button type="button" role="menuitem" title="The others keep it." style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg><span style="flex: 1 1 auto; display: inline-flex; align-items: center; gap: 6px; text-align: left">Leave this project<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span></button>
        <button type="button" role="menuitem" title="Deleting hides it here and keeps it for 30 days under Deleted items. OpenProject still has it until then." style="{{ itemDanger }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span style="flex: 1 1 auto; text-align: left">Delete</span></button>
      </div>
    </main>
  </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Project details open beside the board, on the Members tab; the navigation folds to its rail and the board scrolls sideways under the panel. Members and their rights come from OpenProject, except the rows marked Nextcloud only (kept in Nextcloud, OpenProject does not have this); a change here is saved there, and a change there shows here within a minute</figcaption>
    <div style="position: relative; height: 1013px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" folded="true" hint-size="64px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="flex: 1 0 100%; display: flex; align-items: baseline; gap: 10px; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">9 open work packages</span></div>
        <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">

      type, number, subject, status, assignee, due, typeStyle: 'font-weight: 700; letter-spacing: 0.04em; color: ' + TYPE[type],
      href: 'TbCard.dc.html', aria: type + ' ' + number + ', ' + subject + ', ' + status + (o.high ? ', priority high' : ''), style: cardBase,
      high: !!o.high, hasMail: !!o.from, mailFrom: o.from ?? '',

    const columns = cols.map(([name, count, limit]) => {
      const st = STATUS[name];
      return {
        name, count: limit ? count + ', limit ' + limit.slice(3) : String(count),

        cards: cards.filter((c) => c.status === name)

    const av = 'width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; ';

    const srOnly = 'position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)';

    const knobOn = 'position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff';
    const switchOff = 'flex: none; position: relative; width: 42px; height: 24px; padding: 0; border: 1px solid #c4c7cb; border-radius: 12px; background: #ffffff; box-sizing: border-box; cursor: pointer; vertical-align: middle';
    const knobOff = 'position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #5e6168';
    const sw = (on) => ({ checked: on ? 'true' : 'false', switch: on ? switchOn : switchOff, knob: on ? knobOn : knobOff });
    const I = {
      users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      team: 'M3 21h18M5 21V7l8-4v18M19 21V11l-6-4M9 9h.01M9 12h.01M9 15h.01M9 18h.01'
    };
    const avatarText = 'flex: none; width: 26px; height: 26px; border-radius: 13px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700';
    const avatarIcon = 'flex: none; width: 26px; height: 26px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #3d4047; display: inline-flex; align-items: center; justify-content: center';
    const tagStyle = 'display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #3d4047; font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase';
    // [name, initials or icon, sub line, tag, edit, share, manage, owner, nco]
    const members = [
      ['Olivia Brandt (you)', 'OB', 'Owner, person of this workspace', '', true, true, true, true, true],
      ['Tom Achterberg', 'TA', 'Person of this workspace', '', true, true, false, false],
      ['Northwind delivery', I.users, 'Group from OpenProject, 6 people', '', true, false, false, false],
      ['Rollout squad', I.team, 'Team from Nextcloud, 4 people', '', true, false, false, false, true],
      ['Jana Köhler', 'JK', 'Found by e-mail address, jana.koehler@stadtwerke-kassel.test', 'Read only', false, false, false, false],
      ['Marc Dubois', 'MD', 'ville-de-lyon.test. Edits work packages and columns from there', 'Other server', true, false, false, false, true]
    ].map(([name, who, sub, tag, edit, share, manage, owner, nco]) => {
      const isIcon = who.length > 2;
      return {
        name, sub, tag, hasTag: !!tag, tagStyle, nco: !!nco, hasBadges: !!tag || !!nco || !!owner,
        isIcon, isText: !isIcon, icon: isIcon ? who : '', initials: isIcon ? '' : who,
        avatarStyle: isIcon ? avatarIcon : avatarText,
        isOwner: owner, isMember: !owner,
        edit: sw(edit), share: sw(share), manage: sw(manage)
      };
    });
    const track = (on) => 'flex: none; position: relative; display: inline-block; width: 42px; height: 24px; box-sizing: border-box; border-radius: 12px; ' + (on ? 'background: var(--sc-action, #3669a5); border: 1px solid var(--sc-action-deep, #234a78)' : 'background: #ffffff; border: 1px solid #c4c7cb');
    const knob = (on) => 'position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 9px; ' + (on ? 'left: 20px; background: #ffffff' : 'left: 2px; background: #5e6168');
    const switches = [['Compact cards', true, false, 'Title only, 44 px rows'], ['Archived cards only', false, true, 'Shows the archived cards instead of the open ones']].map(([label, on, nco, sub]) => ({ label, sub, nco: !!nco, on: on ? 'true' : 'false', track: track(on), knob: knob(on) }));
    return { team, columns, item, itemDanger, sep, tabs, tabsB, srOnly, th, btnSmall, members, switches };
  }
}
