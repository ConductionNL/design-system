<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenProject twin: project menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<nav aria-label="Project menu" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 15px; line-height: 21px; width: 100%; min-height: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e4e6ea; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
  <button type="button" style="flex: none; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 15px 'Fira Sans', sans-serif">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{{ primary }}
  </button>
  <button type="button" aria-haspopup="listbox" aria-label="Project: {{ project }}" style="flex: none; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; color: #1b1c1d; text-align: left; font-family: 'Fira Sans', system-ui, sans-serif">
    <span style="flex: none; width: 28px; height: 28px; border-radius: var(--sc-radius, 8px); background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{ projectInitials }}</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><span style="font-size: 12px; color: #5e6168">Project</span><strong style="font-size: 14px; font-weight: 600">{{ project }}</strong></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}"><span style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="5">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg>
          <span style="flex: 1">{{ it.label }}</span>
          <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ it.count }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
    <sc-for list="{{ bottom }}" as="it" hint-placeholder-count="2">
      <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg>
        <span style="flex: 1">{{ it.label }}</span>
      </a>
    </sc-for>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Work packages"},"project":{"editor":"text","default":"Northwind rollout Lyon"},"primary":{"editor":"text","default":"Create work package"},"$preview":{"width":264,"height":932}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Work packages';
    const project = this.props.project ?? 'Northwind rollout Lyon';
    const projectInitials = project.split(/\s+/).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
    const I = {
      overview: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      wp: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      boards: 'M4 5h16v14H4zM9 5v14M15 5v14',
      gantt: 'M3 5h8M7 12h10M11 19h10M3 3v18',
      calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
      team: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      backlogs: 'M4 6h16M4 12h10M4 18h6M20 12l-3 3-2-2',
      meetings: 'M23 7l-7 5 7 5zM1 5h15v14H1z',
      wiki: 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z',
      time: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2',
      members: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87',
      settings: 'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z'
    };
    const HREF = { Overview: 'OpProjectOverview.dc.html', 'Work packages': 'OpWorkPackages.dc.html', Boards: 'OpBoards.dc.html', Gantt: 'OpGantt.dc.html', Calendar: 'OpCalendar.dc.html', 'Team planner': 'OpTeamPlanner.dc.html', Backlogs: 'OpBacklogs.dc.html', Meetings: 'OpMeetings.dc.html', Wiki: 'OpWiki.dc.html', 'Time and costs': 'OpTimeCosts.dc.html', Members: 'OpMembers.dc.html', 'Project settings': 'OpProjectSettings.dc.html' };
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 15px; ';
    const item = ([label, icon, count]) => {
      const on = label === active;
      return { label, icon: I[icon], href: HREF[label] || '#', count: count ?? '', hasCount: !!count, current: on ? 'page' : 'false',
        style: base + (on ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;') };
    };
    const groups = [
      { title: 'Plan', items: [['Overview', 'overview'], ['Work packages', 'wp', 10], ['Boards', 'boards'], ['Gantt', 'gantt'], ['Calendar', 'calendar'], ['Team planner', 'team'], ['Backlogs', 'backlogs']] },
      { title: 'Work together', items: [['Meetings', 'meetings'], ['Wiki', 'wiki'], ['Time and costs', 'time']] }
    ].map((g) => ({ title: g.title, hasTitle: !!g.title, items: g.items.map(item) }));
    const bottom = [['Members', 'members'], ['Project settings', 'settings']].map(item);
    return { project, projectInitials, primary: this.props.primary ?? 'Create work package', groups, bottom };
  }
}
</script>
</body>
</html>
