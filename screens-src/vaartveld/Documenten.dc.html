<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mijn Vaartveld: rapporten en documenten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@600;700;800&amp;family=Red+Hat+Text:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1f4fd8}a:hover{color:#14338f}
</style>
</helmet>
<div style="font-family: 'Red Hat Text', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; display: flex; flex-direction: column">
  <dc-import name="Kop" active="" signed-in="{{ true }}" crumbs="{{ crumbs }}" hint-size="100%,194px"></dc-import>
  <div style="flex: 1 0 auto">
  <div style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <div style="flex: 1 1 260px; max-width: 300px">
      <dc-import name="MijnMenu" active="Documenten" hint-size="100%,700px"></dc-import>
    </div>
    <main id="inhoud" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h1 style="margin: 0; font-family: 'Red Hat Display', system-ui, sans-serif; font-size: 48px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em">Rapporten en documenten</h1>
        <p style="margin: 0; font-size: 18px; line-height: 1.5; color: #4a4a4a">Alles wat de school voor je bewaart. Je ouders zien dezelfde documenten.</p>
      </div>
      <div role="status" style="display: flex; gap: 12px; padding: 14px 18px; border-radius: 6px; background: #e8eefc; border: 1px solid #bccbf5">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#14338f" stroke-width="2.2" stroke-linecap="round" style="flex: none; margin-top: 2px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.500v.500"></path></svg>
        <span style="font-size: 17px; line-height: 1.5">Je eerste rapport van dit schooljaar komt op vrijdag 11 december. Je cijfers van nu staan bij <a href="MijnLijst.dc.html" style="font-weight: 600; color: #14338f">Cijfers</a>.</span>
      </div>
      <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
        <section style="display: flex; flex-direction: column; gap: 12px">
          <h2 style="margin: 0; font-family: 'Red Hat Display', system-ui, sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.01em">{{ g.title }}</h2>
          <ul style="margin: 0; padding: 0; list-style: none; border: 1px solid #d3d8df; border-radius: 10px; overflow: hidden">
            <sc-for list="{{ g.docs }}" as="d" hint-placeholder-count="3">
              <li style="{{ d.row }}">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#0b6259" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h6M9 17h4"></path></svg>
                <span style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <span style="display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center"><strong style="font-size: 18px; font-weight: 600">{{ d.name }}</strong><sc-if value="{{ d.isNew }}" hint-placeholder-val="{{ false }}"><span style="padding: 1px 9px; border-radius: 12px; background: #1fb5a8; color: #1a1a1a; font-size: 13px; font-weight: 700">Nieuw</span></sc-if></span>
                  <span style="font-size: 15px; color: #4a4a4a">{{ d.meta }}</span>
                </span>
                <sc-if value="{{ d.hasState }}" hint-placeholder-val="{{ false }}"><span style="{{ d.pill }}">{{ d.state }}</span></sc-if>
                <a href="#" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; box-sizing: border-box; padding: 0 16px; border: 2px solid #1f4fd8; border-radius: 6px; font-weight: 600; font-size: 16px; text-decoration: none">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>{{ d.action }}<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"> {{ d.name }}</span>
                </a>
              </li>
            </sc-for>
          </ul>
        </section>
      </sc-for>
    </main>
  </div>
  </div>
  <dc-import name="Voet" hint-size="100%,380px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1630}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (bg, fg) => 'flex: none; padding: 4px 12px; border-radius: 14px; font-size: 15px; font-weight: 600; background: ' + bg + '; color: ' + fg;
    const done = pill('#e7f3ea', '#1e6b2a');
    const doc = (name, meta, state, isNew) => ({ name, meta, state: state || '', hasState: !!state, pill: done, isNew: !!isNew, action: 'Downloaden' });
    const raw = [
      { title: 'Rapporten', docs: [
        doc('Overgangsrapport 3 havo', '10 juli 2026 · PDF, 96 kB', 'Over naar 4 havo'),
        doc('Rapport 2, 3 havo', '27 maart 2026 · PDF, 94 kB'),
        doc('Rapport 1, 3 havo', '12 december 2025 · PDF, 92 kB')
      ] },
      { title: 'Toetsen en examen', docs: [
        doc('Toetsrooster toetsweek 1', '9 tot en met 13 november · 30 september 2026 · PDF, 112 kB', '', true),
        doc('Programma van toetsing en afsluiting 4 havo', 'Schooljaar 2026-2027 · PDF, 640 kB'),
        doc('Examenreglement', 'Schooljaar 2026-2027 · PDF, 310 kB')
      ] },
      { title: 'Keuzes en verklaringen', docs: [
        doc('Je profielkeuze: economie en maatschappij', 'Met bedrijfseconomie en aardrijkskunde · 2 april 2026 · PDF, 58 kB', 'Vastgelegd'),
        doc('Bewijs van inschrijving', 'Schooljaar 2026-2027 · voor je bijbaan of ov-kaart · PDF, 44 kB')
      ] }
    ];
    const groups = raw.map((g) => ({ ...g, docs: g.docs.map((d, i) => ({ ...d,
      row: 'display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 20px;' + (i ? ' border-top: 1px solid #d3d8df;' : '') })) }));
    return { groups, crumbs: [{ label: 'Home' }, { label: 'Mijn Vaartveld', href: 'MijnOverzicht.dc.html' }, { label: 'Documenten' }] };
  }
}
</script>
</body>
</html>
