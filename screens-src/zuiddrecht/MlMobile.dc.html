<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: inbox, conversation and link sheet on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1280px; height: 900px; padding: 26px 0; display: flex; justify-content: center; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 390px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px">Inbox: the list keeps 72 px free under its last row for the new message button</figcaption>
    <div style="position: relative; width: 390px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: 24px; overflow: hidden">
      <header style="flex: none; height: 55px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 4px; background: #3669a5; color: #ffffff">
        <button type="button" aria-label="Mailboxes" style="width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"></path></svg></button>
        <strong style="flex: 1 1 auto; font-size: 17px; font-weight: 600">Inbox</strong>
        <button type="button" aria-label="Search" style="width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg></button>
        <button type="button" aria-label="Account menu of Olivia Brandt" style="width: 40px; height: 40px; border: 0; background: transparent; display: inline-flex; align-items: center; justify-content: center"><span style="width: 30px; height: 30px; border-radius: 15px; background: #ffffff; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font: 700 12px 'Fira Sans', sans-serif">OB</span></button>
      </header>
      <div role="group" aria-label="Filter" style="flex: none; display: flex; gap: 6px; padding: 10px 12px; overflow: hidden; border-bottom: 1px solid #e4e6ea">
        <sc-for list="{{ chips }}" as="c" hint-placeholder-count="4"><button type="button" aria-pressed="{{ c.on }}" style="{{ c.style }}">{{ c.label }}</button></sc-for>
      </div>
      <ol style="flex: 1 1 auto; min-height: 0; overflow: hidden; list-style: none; margin: 0; padding: 0 0 72px; box-sizing: border-box; display: flex; flex-direction: column">
        <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
          <li style="border-bottom: 1px solid #e4e6ea; background: #ffffff">
            <a href="#" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 12px 9px 4px; color: #1b1c1d; text-decoration: none">
              <span style="flex: none; width: 8px; height: 60px; display: flex; align-items: center; justify-content: center"><span style="{{ r.dot }}"></span></span>
              <span style="{{ r.avatar }}">{{ r.initials }}</span>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                  <span style="{{ r.sender }}">{{ r.from }}</span>
                  <sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ true }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ r.count }}</span></sc-if>
                  <span style="flex: 1 1 auto"></span>
                  <span style="{{ r.dateStyle }}">{{ r.date }}</span>
                </span>
                <span style="display: flex; align-items: center; gap: 6px; height: 20px">
                  <span style="{{ r.subjectStyle }}">{{ r.subject }}</span>
                  <sc-if value="{{ r.hasAttach }}" hint-placeholder-val="{{ true }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 2px; color: #5e6168; font-size: 12px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.attachIcon }}"></path></svg>{{ r.attachCount }}</span></sc-if>
                  <sc-if value="{{ r.starred }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="#ff9d2e" stroke="#ff9d2e" stroke-width="1.75" stroke-linejoin="round" aria-label="Starred" role="img" style="flex: none"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></sc-if>
                </span>
                <span style="display: flex; align-items: center; gap: 8px; height: 20px">
                  <sc-if value="{{ r.hasChip }}" hint-placeholder-val="{{ true }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 7px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; line-height: 1; white-space: nowrap"><span style="{{ r.chipType }}">{{ r.wpType }}</span><span style="color: #3d4047">{{ r.wpNumber }}</span><span style="{{ r.chipDot }}"></span><span style="color: #3d4047">{{ r.wpStatus }}</span></span></sc-if>
                  <sc-if value="{{ r.bundled }}" hint-placeholder-val="{{ false }}"><span style="{{ r.chipDot }}"></span></sc-if>
                  <span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.snippet }}</span>
                </span>
              </span>
            </a>
          </li>
        </sc-for>
      </ol>
      <button type="button" aria-label="New message" style="position: absolute; right: 16px; bottom: 72px; width: 52px; height: 52px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 26px; background: var(--sc-action, #3669a5); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(27,28,29,0.2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg></button>
      <nav aria-label="Apps" style="flex: none; height: 56px; display: flex; border-top: 1px solid #e4e6ea; background: #ffffff">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><a href="#" aria-current="{{ t.current }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><span>{{ t.label }}</span></a></sc-for>
      </nav>
    </div>
  </figure>
  <sc-for list="{{ phones }}" as="p" hint-placeholder-count="2">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 390px">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px">{{ p.caption }}</figcaption>
      <div style="position: relative; width: 390px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: 24px; overflow: hidden">
        <header style="flex: none; height: 55px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 2px; background: #3669a5; color: #ffffff">
          <a href="#" aria-label="Back to Inbox" style="width: 40px; height: 40px; border-radius: var(--sc-radius, 8px); color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
          <strong style="flex: 1 1 auto; font-size: 17px; font-weight: 600">Inbox</strong>
          <sc-for list="{{ tools }}" as="t" hint-placeholder-count="4"><button type="button" aria-label="{{ t.label }}" style="width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg></button></sc-for>
        </header>
        <div style="flex: none; display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
          <div style="display: flex; align-items: flex-start; gap: 6px">
            <h2 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 20px; font-weight: 700; line-height: 28px">Rollout plan phase 2, Lyon</h2>
            <button type="button" aria-label="Star this conversation" aria-pressed="false" style="flex: none; width: 34px; height: 34px; margin: -3px -8px 0 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
          </div>
          <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
            <a href="#" style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 12px; line-height: 1; white-space: nowrap; text-decoration: none; color: #3d4047"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span></a>
            <span style="white-space: nowrap">6 messages · Lyon</span>
            <button type="button" aria-label="Expand all messages" style="flex: none; margin-left: auto; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg>Expand all</button>
          </div>
        </div>
        <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 12px 0">
          <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="5">
            <button type="button" aria-expanded="false" aria-label="Show the whole message from {{ m.from }}, {{ m.date }}" title="Show the whole message" style="{{ m.style }}">
              <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
              <span style="{{ m.avatar }}">{{ m.initials }}</span>
              <span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span>
              <span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ m.snippet }}</span>
              <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.date }}</span>
            </button>
          </sc-for>
          <article aria-label="Message from Marc Dubois, today 06:00" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
            <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 12px 0 6px">
              <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">MD</span>
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Marc Dubois</strong><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 06:00</span></div>
                <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt, copy Tom Achterberg</span></div>
              </div>
            </div>
            <div style="padding: 12px 12px 12px 12px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
              <p style="margin: 0">Hi Olivia,</p>
              <p style="margin: 0">Good. Then we are go for 2 November. One more request from the department head: can the kick-off move to the afternoon?</p>
              <p style="margin: 0">Best regards,<br>Marc</p>
            </div>
            <div style="margin: 0 12px; padding: 10px 0 12px; border-top: 1px solid #e4e6ea; display: flex; align-items: center; gap: 8px; font-size: 13px">
              <span style="flex: none; width: 34px; height: 22px; border-radius: var(--sc-radius, 8px); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: #ffffff; background: #ab0000">PDF</span>
              <a href="#" style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--sc-link, #3669a5); text-decoration: none">Rollout-plan-phase-2.pdf</a>
              <span style="flex: none; font-size: 12px; color: #5e6168">1.8 MB</span>
            </div>
          </article>
        </div>
        <div role="toolbar" aria-label="Conversation actions" style="flex: none; height: 64px; box-sizing: border-box; display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #e4e6ea; background: #ffffff">
          <button type="button" style="flex: 1 1 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17l-5-5 5-5M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>Reply</button>
          <button type="button" aria-haspopup="menu" style="flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg>More</button>
        </div>
        <sc-if value="{{ p.sheet }}" hint-placeholder-val="{{ false }}">
          <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.45); display: flex; flex-direction: column; justify-content: flex-end">
            <div role="dialog" aria-modal="true" aria-labelledby="ml-sheet-title" style="display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 16px; background: #ffffff; border-radius: var(--sc-radius-lg, 10px) var(--sc-radius-lg, 10px) 0 0; box-shadow: 0 -4px 12px rgba(27,28,29,0.12)">
              <span aria-hidden="true" style="align-self: center; width: 36px; height: 4px; border-radius: 2px; background: #c4c7cb"></span>
              <div style="display: flex; align-items: center; justify-content: space-between"><h3 id="ml-sheet-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 26px">Link to work package</h3><button type="button" aria-label="Close" style="width: 34px; height: 34px; margin-right: -8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
              <label style="position: relative; display: flex; align-items: center"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search work packages</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg><input type="search" placeholder="Number or words" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
              <sc-for list="{{ suggestGroups }}" as="g" hint-placeholder-count="3">
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; line-height: 24px">{{ g.title }}</span>
                <sc-for list="{{ g.rows }}" as="s" hint-placeholder-count="1">
                  <button type="button" role="radio" aria-checked="{{ s.checked }}" style="{{ s.style }}">
                    <span style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; border: {{ s.ring }}; background: #ffffff; display: inline-flex; align-items: center; justify-content: center"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{ s.fill }}"></span></span>
                    <span style="flex: none; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: {{ s.typeColor }}">{{ s.type }}</span>
                    <span style="flex: none; font-size: 14px; color: #3d4047">{{ s.number }}</span>
                    <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ s.subject }}</span>
                    <span style="{{ s.dot }}"></span>
                  </button>
                </sc-for>
              </div>
              </sc-for>
              <div role="radiogroup" aria-label="Link" style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px; border-top: 1px solid #e4e6ea">
                <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; line-height: 24px">Link</span>
                <label style="display: flex; align-items: center; gap: 10px; height: 40px; font-size: 14px"><input type="radio" name="ml-scope" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Whole conversation <span style="color: #5e6168">6 messages</span></label>
                <label style="display: flex; align-items: center; gap: 10px; height: 40px; font-size: 14px"><input type="radio" name="ml-scope" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">This message only</label>
              </div>
              <div style="display: flex; flex-direction: column; gap: 2px; padding-top: 4px; border-top: 1px solid #e4e6ea">
                <label style="display: flex; align-items: center; gap: 10px; height: 40px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Add the attachments to the work package</label>
                <label style="display: flex; align-items: center; gap: 10px; height: 40px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Post a comment in the work package activity</label>
              </div>
              <button type="button" style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 40px; margin-top: 4px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Link</button>
            </div>
          </div>
        </sc-if>
      </div>
    </figure>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df' };
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'] };

    ];
    const rows = data.slice(0, 7).map(([from, initials, subject, count, date, snippet, o]) => {
      const unread = !!o.unread;
      const st = o.wp ? STATUS[o.wp[2]] : null;

        from, initials, subject, date, snippet, count: count > 1 ? count : '', hasCount: count > 1,
        dot: 'width: 8px; height: 8px; border-radius: 4px; background: ' + (unread ? '#3669a5' : 'transparent'),

    const mkRow = ([type, number, subject, status, checked]) => ({
