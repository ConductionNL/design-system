            <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="checkbox" style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5); margin-top: 2px"><span style="display: flex; flex-direction: column"><span style="display: inline-flex; align-items: center; gap: 6px">Restore archived work packages<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-muted, #5e6168); font: 600 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 16px">Archived work packages come along and are visible again in the copy.</span></span></label>

            <span style="font-size: 14px; font-weight: 600">What comes along</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px">
              <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5); margin-top: 2px"><span style="display: flex; flex-direction: column"><span>Members</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 16px">The same people, with the same rights.</span></span></label><label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5); margin-top: 2px"><span style="display: flex; flex-direction: column"><span>Tags</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 16px">The tags of this project, with their colours.</span></span></label><label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="checkbox" checked style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5); margin-top: 2px"><span style="display: flex; flex-direction: column"><span>Due dates</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 16px">Start and due dates stay as they are.</span></span></label><label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="checkbox" style="width: 16px; height: 16px; margin: 0; accent-color: var(--sc-primary, #3669a5); margin-top: 2px"><span style="display: flex; flex-direction: column"><span>Attachments</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 16px">Files on the work packages are copied too.</span></span></label>

        </div>

              <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-ink, #1b1c1d); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; text-align: left; width: 100%; box-sizing: border-box"><span style="flex: 1 1 auto; display: inline-flex; align-items: center; gap: 6px; text-align: left">Calendar link for another app<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-muted, #5e6168); font: 600 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">stays up to date</span></button>
