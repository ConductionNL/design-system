<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: domains</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#ml-adm-search::placeholder,#ml-adm-search-b::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2200px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Domains: the default storage that every domain and person inherits unless they set their own, then the list</figcaption>
    <div style="height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
      <dc-import name="MlHeader" app="Administration" placeholder="Search domains, mailboxes or settings" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Domains" hint-size="245px,790px"></dc-import></div>
        <main style="{{ main }}">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Domains</h1>
              <p style="margin: 0; color: #3d4047">The domains this mail server receives and sends mail for. Add one, check its DNS records and remove it when it is no longer used.</p>
            </div>
            <button type="button" aria-haspopup="dialog" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add domain</button>
          </div>
          <section aria-labelledby="ml-adm-default-title" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
            <div style="display: flex; flex-direction: column; gap: 2px"><h2 id="ml-adm-default-title" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Default for every mailbox</h2><span style="{{ hint }}">A server setting, not a filter. Every domain and person inherits it unless they set a limit of their own.</span></div>
            <div style="display: flex; align-items: flex-end; gap: 12px">
              <div style="{{ group }}"><label for="ml-adm-quota" style="font-size: 14px; font-weight: 600">Default storage per mailbox</label><span style="display: inline-flex; align-items: center; gap: 8px"><input id="ml-adm-quota" type="number" value="10" style="{{ num }}"><span style="font-size: 13px; color: #3d4047; width: 24px">GB</span></span></div>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #eef0f3">
              <button type="submit" style="{{ btnPrimary }}">Save changes</button>
              <button type="button" style="{{ btnSecondary }}">Discard</button>
              <span style="font-size: 12px; color: #5e6168">Only this default is saved here. Adding and removing a domain happens at once.</span>
            </div>
          </section>
          <div style="display: flex; align-items: center; gap: 12px">
            <form role="search" style="position: relative; display: flex; align-items: center; width: 320px">
              <label for="ml-adm-search" style="{{ srOnly }}">Search domains</label>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 8px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
              <input id="ml-adm-search" type="search" placeholder="Search domains" style="{{ search }}">
            </form>
            <span style="font-size: 13px; color: #5e6168">4 domains</span>
          </div>
          <div style="{{ tableWrap }}">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px">
              <thead><tr style="{{ thead }}">
                <th scope="col" style="{{ th }}">Domain</th>
                <th scope="col" style="{{ th }}">DNS records</th>
                <th scope="col" style="{{ th }} text-align: right">Mailboxes</th>
                <th scope="col" style="{{ th }}">Storage used</th>
                <th scope="col" style="{{ th }}">Storage per mailbox</th>
                <th scope="col" style="width: 44px"><span style="{{ srOnly }}">Actions</span></th>
              </tr></thead>
              <tbody>
                <sc-for list="{{ domainsA }}" as="d" hint-placeholder-count="4">
                  <tr aria-selected="{{ d.selected }}" style="{{ d.style }}">
                    <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">{{ d.name }}</a></td>
                    <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><span style="display: flex; align-items: center; gap: 6px; line-height: 20px"><span style="{{ d.dot }}"></span>{{ d.dns }}</span></td>
                    <td style="padding: 14px 16px; line-height: 20px; text-align: right; white-space: nowrap">{{ d.mailboxes }}</td>
                    <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap">{{ d.storage }}</td>
                    <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap; color: #3d4047">{{ d.quota }}</td>
                    <td style="padding: 10px 10px 10px 8px; text-align: right; line-height: 0"><button type="button" aria-haspopup="menu" aria-label="Actions for {{ d.name }}" style="{{ iconBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </main>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;One domain selected: a short summary in the panel, the full page behind "Open domain". The storage columns step aside while the panel is open; the panel shows them.</figcaption>
    <div style="height: 760px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
      <dc-import name="MlHeader" app="Administration" placeholder="Search domains, mailboxes or settings" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Domains" hint-size="245px,690px"></dc-import></div>
        <main style="{{ main }}">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Domains</h1>
              <p style="margin: 0; color: #3d4047">The domains this mail server receives and sends mail for. Add one, check its DNS records and remove it when it is no longer used.</p>
            </div>
            <button type="button" aria-haspopup="dialog" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add domain</button>
          </div>
          <div style="display: flex; align-items: center; gap: 12px">
            <form role="search" style="position: relative; display: flex; align-items: center; width: 320px">
              <label for="ml-adm-search-b" style="{{ srOnly }}">Search domains</label>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 8px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
              <input id="ml-adm-search-b" type="search" placeholder="Search domains" style="{{ search }}">
            </form>
            <span style="font-size: 13px; color: #5e6168">4 domains</span>
          </div>
          <div style="{{ tableWrap }}">
            <table style="width: 100%; border-collapse: collapse; font-size: 14px">
              <thead><tr style="{{ thead }}">
                <th scope="col" style="{{ th }}">Domain</th>
                <th scope="col" style="{{ th }}">DNS records</th>
                <th scope="col" style="{{ th }} text-align: right">Mailboxes</th>
                <th scope="col" style="width: 44px"><span style="{{ srOnly }}">Actions</span></th>
              </tr></thead>
              <tbody>
                <sc-for list="{{ domainsB }}" as="d" hint-placeholder-count="4">
                  <tr aria-selected="{{ d.selected }}" style="{{ d.style }}">
                    <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">{{ d.name }}</a></td>
                    <td style="padding: 14px 16px; line-height: 20px"><span style="display: flex; align-items: center; gap: 6px; line-height: 20px"><span style="{{ d.dot }}"></span>{{ d.dns }}</span></td>
                    <td style="padding: 14px 16px; line-height: 20px; text-align: right; white-space: nowrap">{{ d.mailboxes }}</td>
                    <td style="padding: 10px 10px 10px 8px; text-align: right; line-height: 0"><button type="button" aria-haspopup="menu" aria-label="Actions for {{ d.name }}" style="{{ iconBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </main>
        <aside aria-label="Domain northwind-consulting.test" style="flex: 0 0 400px; width: 400px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
          <div style="display: flex; align-items: flex-start; gap: 8px">
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">northwind-consulting.test</h2>
              <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3d4047"><span style="{{ dotWarn }}"></span>1 record missing</span>
            </div>
            <button type="button" aria-label="Close domain details" style="{{ closeBtn }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <dl style="margin: 0; display: grid; grid-template-columns: 120px 1fr; gap: 6px 12px; font-size: 13px; line-height: 20px">
            <dt style="color: #5e6168">Mailboxes</dt><dd style="margin: 0"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">12 mailboxes</a></dd>
            <dt style="color: #5e6168">Storage used</dt><dd style="margin: 0">8.9 GB of 100 GB</dd>
            <dt style="color: #5e6168">Storage per mailbox</dt><dd style="margin: 0">10 GB, the server default</dd>
            <dt style="color: #5e6168">DNS records</dt><dd style="margin: 0">MX, DKIM and DMARC found. SPF missing, so mail may land in spam.</dd>
            <dt style="color: #5e6168">Added</dt><dd style="margin: 0">14 March 2026 by Ines Okafor</dd>
          </dl>
          <p style="{{ hint }}">The records, the signatures and the administrators of this domain are on its page.</p>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 4px">
            <button type="button" style="{{ btnPrimary }}">Open domain</button>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ btnDanger }}">Remove domain</button>
          </div>
        </aside>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; width: 480px; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;New domain, as a dialog over the dimmed page</figcaption>
    <div style="position: relative; height: 420px; box-sizing: border-box; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 20px">
        <form role="dialog" aria-modal="true" aria-labelledby="ml-adm-add-title" style="{{ dialog }}">
          <div style="{{ dialogHead }}"><strong id="ml-adm-add-title" style="{{ dialogTitle }}">New domain</strong></div>
          <div style="{{ dialogBody }}">
            <div style="{{ group }}"><label for="ml-adm-domain" style="font-size: 14px; font-weight: 600">Domain name</label><input id="ml-adm-domain" type="text" value="kassel-training.test" style="{{ input }}"></div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
              <label for="ml-adm-domain-quota" style="font-size: 14px; font-weight: 600">Storage per mailbox</label>
              <span style="display: inline-flex; align-items: center; gap: 8px"><input id="ml-adm-domain-quota" type="number" value="10" style="{{ num }}"><span style="font-size: 13px; color: #3d4047">GB, the server default</span></span>
            </div>
            <p style="{{ hint }}">As soon as it is added we check the DNS records that route mail to this server and prove that mail comes from you (MX, SPF, DKIM and DMARC).</p>
          </div>
          <div style="{{ dialogFoot }}">
            <button type="button" style="{{ btnSecondary }}">Cancel</button>
            <button type="submit" style="{{ btnPrimary }}">Add domain</button>
          </div>
        </form>
      </div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2200}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (bg, ring) => 'display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: ' + bg + '; box-shadow: 0 0 0 2px ' + ring;
    const D = { ok: dot('#d3f9d8', '#8ff09c'), warn: dot('#ffc078', '#ff9d2e'), busy: dot('#66d9e8', '#21c8de'), bad: dot('#fcc2d7', '#f977a6'), off: dot('#dee2e6', '#adb5bd') };
    const cap = 'font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px';
    const srOnly = 'position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)';
    const main = 'flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden';
    const hint = 'margin: 0; font-size: 12px; color: #5e6168; line-height: 18px';
    const tableWrap = 'background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden';
    const thead = 'background: #fafbfc';
    const th = 'text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap;';
    const btnPrimary = 'display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap; flex: none';
    const btnSecondary = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const btnDanger = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const iconBtn = 'width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center';
    const closeBtn = 'flex: none; width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center';
    const search = 'width: 100%; height: 34px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px \'Fira Sans\', sans-serif; color: #1b1c1d';
    const input = 'width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px \'Fira Sans\', sans-serif; color: #1b1c1d';
    const num = 'width: 96px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px \'Fira Sans\', sans-serif; color: #1b1c1d; text-align: right';
    const saveRow = 'margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea';
    const dialog = 'width: 480px; box-sizing: border-box; padding: 0; display: flex; flex-direction: column; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28)';
    const dialogHead = 'padding: 20px 24px';
    const dialogTitle = 'font-size: 20px; font-weight: 700; line-height: 26px';
    const dialogBody = 'padding: 0 24px 8px; display: flex; flex-direction: column; gap: 16px';
    const dialogFoot = 'display: flex; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid #eef0f3';
    const group = 'display: flex; flex-direction: column; gap: 6px; min-width: 0';
    const row = 'border-top: 1px solid #eef0f3; ';
    const list = [
      ['northwind-projects.test', D.ok, 'All records found', '48', '61.4 GB of 500 GB', '10 GB, the server default'],
      ['northwind-consulting.test', D.warn, '1 record missing', '12', '8.9 GB of 100 GB', '10 GB, the server default'],
      ['lyon-rollout.test', D.busy, 'Checking, added today 07:10', '0', '0 GB of 50 GB', '25 GB, set on the domain'],
      ['old-northwind.test', D.bad, 'Not verified', '3', '1.2 GB of 50 GB', '10 GB, the server default']
    ];
    const mk = (sel) => list.map(([name, dot, dns, mailboxes, storage, quota], i) => ({ name, dot, dns, mailboxes, storage, quota, selected: sel === i ? 'true' : 'false', style: row + (sel === i ? 'background: #eaf0f7' : 'background: #ffffff') }));
    return { cap, srOnly, main, hint, tableWrap, thead, th, btnPrimary, btnSecondary, btnDanger, iconBtn, closeBtn, search, input, num, saveRow, dialog, dialogHead, dialogTitle, dialogBody, dialogFoot, group, dotWarn: D.warn, domainsA: mk(-1), domainsB: mk(1) };
  }
}
</script>
</body>
</html>
