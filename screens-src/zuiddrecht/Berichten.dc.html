<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mijn Zuiddrecht: berichten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; min-height: 1734px">
  <dc-import name="Kop" active="" signed-in="{{ true }}" crumbs="{{ crumbs }}" hint-size="100%,232px"></dc-import>
  <div style="max-width: 1280px; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <div style="flex: 1 1 260px; max-width: 300px">
      <dc-import name="MijnMenu" active="Berichten" hint-size="100%,760px"></dc-import>
    </div>
    <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
        <h1 style="margin: 0; font-size: 44px; font-weight: 700">Berichten</h1>
        <a href="#" style="font-size: 17px; font-weight: 600">Meldingen instellen</a>
      </div>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{ items }}" as="m" hint-placeholder-count="4">
          <li style="{{ m.box }}">
            <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center">
              <sc-if value="{{ m.unread }}" hint-placeholder-val="{{ true }}"><span style="padding: 2px 10px; border-radius: 12px; background: #cc0000; color: #ffffff; font-size: 14px; font-weight: 700">Nieuw</span></sc-if>
              <h2 style="margin: 0; font-size: 20px; font-weight: 700">{{ m.title }}</h2>
              <span style="font-size: 15px; color: #4a4a4a">{{ m.date }}</span>
            </div>
            <p style="margin: 0; font-size: 17px; line-height: 1.55">{{ m.text }} <sc-if value="{{ m.hasLink }}" hint-placeholder-val="{{ true }}"><a href="Publicatie.dc.html">{{ m.link }}</a></sc-if></p>
            <div style="display: flex; flex-wrap: wrap; gap: 12px">
              <a href="{{ m.open }}" style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border: 2px solid #3669a5; border-radius: 4px; font-weight: 600; text-decoration: none">Openen</a>
              <sc-if value="{{ m.unread }}" hint-placeholder-val="{{ true }}"><button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #3669a5; font: 600 17px 'Fira Sans', sans-serif; text-decoration: underline">Markeren als gelezen</button></sc-if>
            </div>
          </li>
        </sc-for>
      </ul>
    </main>
  </div>
  <dc-import name="Voet" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1734}}'>
class Component extends DCLogic {
  renderVals() {
    const box = (unread) => 'display: flex; flex-direction: column; gap: 10px; padding: 20px 24px; border-radius: 6px; border: 1px solid #d3d8df;' + (unread ? ' box-shadow: inset 4px 0 0 #cc0000;' : '');
    const items = [
      { unread: true, title: 'Het besluit op uw Woo-verzoek is gepubliceerd', date: '4 oktober 2026, 13:59', text: 'Wij hebben het besluit op uw Woo-verzoek "Verlichting fietspad Lindelaan" gepubliceerd.', hasLink: true, link: 'Bekijk de publicatie', open: 'Zaak.dc.html' },
      { unread: true, title: 'Uw vraag is beantwoord', date: '4 oktober 2026, 10:51', text: 'Er is een antwoord op uw vraag "Planning fietspad Lindelaan".', hasLink: false, link: '', open: 'MijnOverzicht.dc.html' },
      { unread: true, title: 'Nieuwe publicatie voor uw zoekopdracht "Fietspad Lindelaan"', date: '4 oktober 2026, 09:50', text: 'Er is een nieuwe publicatie die past bij uw zoekopdracht.', hasLink: true, link: 'Verlichting fietspad Lindelaan', open: 'Dossiers.dc.html' },
      { unread: false, title: 'Wij hebben uw aanvraag ontvangen', date: '3 oktober 2026, 11:56', text: 'Uw aanvraag heeft zaaknummer 2026-0082. U hoort uiterlijk 1 november van ons.', hasLink: false, link: '', open: 'Zaak.dc.html' }
    ].map((m) => ({ ...m, box: box(m.unread) }));
    return { items, crumbs: [{ label: 'Home' }, { label: 'Mijn Zuiddrecht', href: 'MijnOverzicht.dc.html' }, { label: 'Berichten' }] };
  }
}
</script>
</body>
</html>
