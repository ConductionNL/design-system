    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">

itch" aria-checked="true" style="flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: 12px; background: var(--sc-action, var(--sc-primary, #3669a5)); box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-reminder" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="For new timed events.">Default reminder</span></label><button id="cl-adm-reminder" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 200px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><span>10 minutes before</span><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--sc-work-muted, #5e6168)"><path d="m6 9 6 6 6-6"></path></svg></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-tz" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="Until the user sets one or the browser reports one.">Time zone</span></label><button id="cl-adm-tz" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 200px; paddi
