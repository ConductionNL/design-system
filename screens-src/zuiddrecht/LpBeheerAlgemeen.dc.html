<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, algemeen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Algemeen" title="Launchpad-beheer: algemeen" scope="geldt voor de hele organisatie" sections="{{ sections }}" hint-size="100%,1700px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Algemeen: the version card first (CnVersionInfoCard), then a section per
    // feature. The admin tour and the setup wizard start from here.
    const sections = [
      { name: 'Versie-informatie', desc: 'Over deze Launchpad-installatie.', rows: [
        { facts: [['Versie', '2.4.0'], ['Ingestelde versie', '2.4.0, bijgewerkt'], ['Nextcloud', '32.0.3'], ['Ondersteuning', 'support@conduction.nl, voor een SLA sales@conduction.nl']] },
        { buttons: [['Setup opnieuw starten', ''], ['Rondleiding door het beheer', ''], ['Documentatie', '']] },
        { note: 'Setup opnieuw starten loopt in vijf stappen van welkom tot klaar: groepen, voorbeelddashboards en rollen. Uw huidige dashboards blijven staan.', tone: 'plain' }
      ] },
      { name: 'Standaardinstellingen', help: true, desc: 'Gelden voor iedereen, tenzij een rol iets anders zegt.', rows: [
        { select: 'Standaard rechtenniveau voor nieuwe dashboards', value: 'Alleen toevoegen', hint: 'Ook: alleen bekijken of alles aanpassen' },
        { switch: 'Persoonlijke dashboards toestaan', on: true, hint: 'Uit: iedereen werkt vanuit de dashboards die beheer klaarzet.' },
        { switch: 'Meerdere persoonlijke dashboards toestaan', on: true },
        { pair: [{ label: 'Maximaal aantal dashboards per persoon', value: '10', hint: '0 is onbeperkt' }, { label: 'Maximaal aantal widgets per dashboard', value: '40', hint: '0 is onbeperkt' }] },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Launchpad als standaardapp', rows: [
        { switch: 'Launchpad openen na het aanmelden', on: true, hint: 'In plaats van het Nextcloud-dashboard. De startpagina is Vandaag, tenzij iemand een ander startdashboard koos.' },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Toegestane websites', help: true, desc: 'Widgets mogen alleen pagina\'s insluiten en gegevens ophalen van deze sites.', rows: [
        { items: [['www.zuiddrecht.nl', 'Insluiten en ophalen', 'Verwijderen'], ['app.powerbi.com', 'Insluiten', 'Verwijderen'], ['kcc-api.zuiddrecht.nl', 'Ophalen', 'Verwijderen'], ['www.youtube-nocookie.com', 'Insluiten', 'Verwijderen']] },
        { text: 'Website toevoegen', value: '', placeholder: 'bijvoorbeeld intranet.zuiddrecht.nl', action: 'Toevoegen' },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Eigen CSS', desc: 'Komt bovenop de huisstijl van thematiq. Controleer na het opslaan het contrast.', rows: [
        { area: 'CSS voor alle dashboards (niet verplicht)', rows: 6, value: '.launchpad-widget h2 {\n  letter-spacing: 0.01em;\n}\n.launchpad-tile--werkapps {\n  border-radius: 14px;\n}' },
        { buttons: [['Opslaan', 'primary']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
