<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, bediening</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Bediening" title="Launchpad-beheer: bediening" scope="gezondheid, verhuizen, opruimen" sections="{{ sections }}" hint-size="100%,2000px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Bediening: health, Prometheus metrics, export and import, bulk operations,
    // Confluence import, legacy Nextcloud widgets and clean-up with hand-over.
    const sections = [
      { name: 'Gezondheid', desc: 'Gecontroleerd vandaag om 10:40.', rows: [
        { figures: [['Database', 'in orde'], ['Achtergrondtaken', 'laatste run 10:40'], ['Nieuwsfeeds', '1 van 6 geeft geen antwoord'], ['Opslag widgetbestanden', '412 MB']] },
        { buttons: [['Opnieuw controleren', '']] }
      ] },
      { name: 'Prometheus-statistieken', rows: [
        { switch: 'Statistieken beschikbaar maken', on: true },
        { pair: [{ label: 'Adres om uit te lezen', value: 'https://werkplek.zuiddrecht.nl/apps/launchpad/metrics' }, { label: 'Token', value: '••••••••••••••••' }] },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Exporteren en importeren', help: true, desc: 'Verhuis dashboards naar een andere server of zet ze terug.', rows: [
        { select: 'Welke dashboards', value: '14 geselecteerd: Intranet, KCC-wachtrij en 12 meer' },
        { buttons: [['Downloaden als JSON', '']] },
        { empty: 'Sleep een exportbestand hierheen: een JSON-bestand van deze of een andere Launchpad, of een dashboard dat u zelf als tekst hebt beschreven.' },
        { buttons: [['Bestand kiezen', '']] }
      ] },
      { name: 'Bulkbewerkingen', desc: '14 dashboards geselecteerd in het overzicht.', rows: [
        { pair: [{ label: 'Verplaatsen naar', value: 'Bovenliggend: Intranet Zuiddrecht', select: true }, { label: 'Publicatiestatus', value: 'Gepubliceerd', select: true }] },
        { buttons: [['Toepassen op 14 dashboards', ''], ['14 dashboards verwijderen', 'danger']] }
      ] },
      { name: 'Importeren uit Confluence', rows: [
        { empty: 'Sleep de HTML-export van een Confluence-pagina hierheen. De pagina wordt een tekstwidget op een nieuw of bestaand dashboard.' },
        { select: 'Plaatsen op', value: 'Een nieuw dashboard' },
        { buttons: [['Bestand kiezen', '']] }
      ] },
      { name: 'Oude Nextcloud-widgets', rows: [
        { switch: 'Oude widgettypes van andere apps toestaan', on: true, hint: 'Widgets die nog de oude Nextcloud-API gebruiken. Ze tonen minder en verversen niet vanzelf.' },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Opruimen', help: true, desc: 'Gegevens van verwijderde mensen en groepen worden elke nacht opgeruimd. Laatste run: vandaag 03:00, 7 verlopen vergrendelingen en 3 losse afbeeldingen verwijderd.', rows: [
        { select: 'Dashboards van vertrokken medewerkers gaan naar', value: 'Hun leidinggevende, anders Femke de Wit' },
        { buttons: [['Nu controleren', '']] },
        { buttons: [['Opslaan', 'primary']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
