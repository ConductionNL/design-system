<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="OpHeader" app="{{ app }}" placeholder="{{ placeholder }}" user="{{ user }}" role="{{ role }}" initials="{{ initials }}" unread="{{ unread }}" hint-size="100%,68px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":"text","default":"Mail"},"placeholder":{"editor":"text","default":"Search mail, people or #work package"},"alerts":{"editor":"text","default":"2"},"user":{"editor":"text","default":"Olivia Brandt"},"initials":{"editor":"text","default":"OB"},"role":{"editor":"text","default":"Delivery lead"},"$preview":{"width":1440,"height":68}}'>
class Component extends DCLogic {
  renderVals() {
    // The mail, calendar and tasks bar is the Zuiddrecht workplace bar: OpHeader (the dossiq bar plus quick add), 68 px high.
    // app is the second line of the brand block, placeholder the search text; user, role and initials the account button.
    // alerts is passed on as OpHeader's unread (its bell shows a dot, not a count). env and alertsOpen are accepted from
    // older includes and not drawn: the first line of the brand block is always the municipality, and the bar has no
    // pressed state for the bell.
    const alerts = String(this.props.alerts ?? '2').trim();
    return {
      app: this.props.app ?? 'Mail',
      placeholder: this.props.placeholder ?? 'Search mail, people or #work package',
      user: this.props.user ?? 'Olivia Brandt',
      role: this.props.role ?? 'Delivery lead',
      initials: this.props.initials ?? 'OB',
      unread: alerts === '' ? '0' : alerts
    };
  }
}
</script>
</body>
</html>
