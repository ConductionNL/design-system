<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, gezien en bevestigd</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Aankondigingen" title="Launchpad-beheer: aankondigingen" scope="gezien en bevestigd per aankondiging" role="Communicatie, gedelegeerd beheer" user="Femke de Wit" initials="FW" sections="{{ sections }}" hint-size="100%,1300px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Aankondigingen, after Gezien en bevestigd on one announcement (review 27 Nov
    // 2026, items 15 and 19): who saw it and who confirmed reading it, with the check or the x, and the list as
    // a spreadsheet. A sub-view of the same settings tab, not a window.
    const nog = (name, dept) => [{ strong: name }, dept, { pill: 'Gezien, nog niet bevestigd', tone: 'warning' }, 'gezien 13 okt'];
    const sections = [
      { name: 'Gezien en bevestigd: Nieuwe werkwijze Woo-verzoeken vanaf 1 november', help: true, desc: 'Doelgroep 164 mensen · deadline vrijdag 30 oktober. Gezien telt zodra de aankondiging bij iemand in beeld was; bevestigd telt bij het vinkje of het kruisje op de aankondiging of in de melding bovenaan.', rows: [
        { link: 'Terug naar de aankondiging' },
        { figures: [['Bevestigd', '128 van 164'], ['Met het vinkje', '121'], ['Met het kruisje', '7'], ['Gezien', '151'], ['Nog niet bevestigd', '36'], ['Nog niet gezien', '13']] },
        { radios: 'Toon', options: [['Iedereen', ''], ['Bevestigd', ''], ['Gezien', ''], ['Nog niet bevestigd', '', true], ['Nog niet gezien', '']] },
        { table: ['Medewerker', 'Afdeling', 'Status', 'Wanneer'], lines: [
          nog('Sanne de Vries', 'KCC'), nog('Youssef Ouali', 'Publiekszaken'), nog('Lars de Koning', 'Informatievoorziening'), nog('Anouk Bakker', 'Team informatie'), nog('Tom Hendriks', 'Vergunningen'),
          [{ strong: 'Noor Nieuw' }, 'Medewerkers', { pill: 'Nog niet gezien' }, 'start maandag']
        ] },
        { para: '6 van 36 getoond. Downloaden geeft de hele lijst als spreadsheet, met de datum en tijd van elke bevestiging en of die met het vinkje of het kruisje was.' },
        { buttons: [['Downloaden', ''], ['Herinnering sturen aan 36 mensen', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
