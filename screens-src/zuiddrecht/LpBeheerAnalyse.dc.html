<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, versies en analyse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Versies en analyse" title="Launchpad-beheer: versies en analyse" scope="gebruikscijfers zonder namen" sections="{{ sections }}" hint-size="100%,1500px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Versies en analyse: views per dashboard, tile clicks, retention with opt-out and
    // every widget that carries visibility rules.
    const sections = [
      { name: 'Weergaven per dashboard', help: true, desc: 'Tellingen per dag, zonder namen. 23 mensen tellen niet mee omdat ze dat zo hebben ingesteld.', rows: [
        { radios: 'Periode', options: [['7 dagen', ''], ['30 dagen', '', true], ['90 dagen', '']] },
        { table: ['Dashboard', 'Weergaven'], lines: [[{ strong: 'Intranet Zuiddrecht' }, '4.812'], [{ strong: 'KCC-wachtrij' }, '2.977'], [{ strong: 'Mijn werkplek (alle)' }, '2.640'], [{ strong: 'Managementinformatie' }, '861'], [{ strong: 'Project Havenpark' }, '334']] },
        { buttons: [['Downloaden', '']] }
      ] },
      { name: 'Tegelklikken', rows: [
        { select: 'Dashboard', value: 'Intranet Zuiddrecht' },
        { table: ['Tegel', 'Klikken', 'Uniek'], lines: [['Zaaksysteem', '1.204', '188'], ['Mijn Verlof (AFAS)', '640', '301'], ['Werkinstructies', '212', '97'], ['Kantinemenu', '45', '40']] },
        { buttons: [['Downloaden', '']] }
      ] },
      { name: 'Bewaartermijn', rows: [
        { text: 'Weergavegegevens bewaren (dagen)', value: '90', hint: 'Oudere tellingen worden elke nacht verwijderd.' },
        { switch: 'Medewerkers mogen zich afmelden voor tellen', on: true },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Widgets met zichtbaarheidsregels', desc: '3 widgets op 2 dashboards.', rows: [
        { table: ['Widget', 'Dashboard', 'Regels', ''], lines: [
          ['Nieuws', 'Intranet Zuiddrecht', 'Groepen, tijden, periode, profielveld', { buttons: [['Bewerken', '']] }],
          ['Wachttijd KCC', 'KCC-wachtrij', 'Groep KCC', { buttons: [['Bewerken', '']] }],
          ['Campagne week dienstverlening', 'Intranet Zuiddrecht', 'Periode 12 t/m 16 oktober', { buttons: [['Bewerken', '']] }]
        ] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
