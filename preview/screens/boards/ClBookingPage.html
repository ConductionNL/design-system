<body>
<div class="sc-board" data-board="ClBookingPage">

<div style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 14px; line-height: 21px; background: var(--sc-work-ground, #f5f6f8); box-sizing: border-box; width: 1440px; height: 1360px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

        <span style="font-size: 14px; color: var(--sc-work-text, #3d4047)">Book an appointment</span>
        <span style="flex: 1 1 auto"></span>
        <span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">No account needed.</span>
      </header>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">

          </div>

      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">c</span> &nbsp;After booking: confirm by mail within 24 hours</figcaption>
      <div style="height: 400px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 20px 22px; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
        <h3 style="margin: 0; font-size: 18px; font-weight: 600; line-height: 24px">Check your mail</h3>
        <p style="margin: 0; font-size: 13px; line-height: 19px; color: var(--sc-work-text, #3d4047)">We sent a link to <strong style="font-weight: 600; color: var(--sc-work-ink, #1b1c1d)">sven.lindqvist@malmo-energi.se</strong>. Open it to confirm your 30 minute introduction with Olivia Brandt on Wednesday 14 October at 11:30 CEST.</p>
