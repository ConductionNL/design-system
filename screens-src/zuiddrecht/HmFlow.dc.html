<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>hermiq: flow hydra-triage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>

<!-- Gedeelde flow-delen (decision 379): OrFlowCanvas, OrFlowKop, OrFlowPalet, OrFlowRuns, OrFlowStap. -->
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: flex; flex-direction: column; min-height: 1700px; position: relative">
  <dc-import name="DqKop" app="Hermiq" placeholder="Zoek agents, chats of runs" role="Functioneel beheerder AI" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch"><dc-import name="AppZijbalk" style="display: block; width: 100%; min-height: 100%; flex: 1 1 auto" app="hermiq" primary="Nieuwe chat" active="Flows" groups="{{ nav }}" hint-size="264px,1112px"></dc-import></div>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <main style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; box-sizing: border-box; width: 100%">
<dc-import name="OrFlowKop" title="Hydra-triage" state="actief" mode="canvas" crumbs='[["Flows", "#"]]' meta="trigger: nieuwe bevinding in OpenRegister · 8 stappen · versie 3, gisteren opgeslagen door Lars de Koning" pill="Meegeleverd met Hermiq" actions='["check", "run", "more"]' primary="Opslaan" list-href="#"></dc-import><div style="display: flex; align-items: flex-start; gap: 12px"><div style="flex: 0 0 256px; width: 256px"><dc-import name="OrFlowPalet" groups="{{ palet }}" note="Sleep een stap naar het canvas. Een agent-stap kiest zijn model en skills in het stappaneel."></dc-import></div><div style="flex: 1 1 auto; min-width: 0"><dc-import name="OrFlowCanvas" flow="{{ flow }}" direction="down" height="auto" title="{{ title }}" selected="b" valid="1 waarschuwing" valid-level="warning" messages='[["warning", "de stap Label opschonen hangt los: niets verbindt ernaartoe, dus de flow bereikt hem nooit."]]'></dc-import></div><div style="flex: 0 0 336px; width: 336px"><dc-import name="OrFlowStap" kind="Actie · Build starten (hermiq)" title="Build starten" fields='[["Werkmap", "/hermiq/runs/[run]", "", "Een map per run; de bestanden blijven staan na de run."], ["Time-out", "2 uur"], ["Terugmelding", "Wacht op het signaal build.done", "select"]]' continue="false" continue-text="Mislukt de build, dan stopt de run en meldt de agent het in het kanaal." recent='[["Bezig", "vandaag 09:52", "Run 128: build gestart voor Lege foutmelding bij opslaan zaaktype."], ["Geslaagd", "gisteren 14:20", "Run 127: build klaar in 41 minuten."]]' run-href="#"></dc-import></div></div><dc-import name="OrFlowRuns" title="Runs van deze flow" stats='[]' filters='[]' subject-head="Bevinding" rows='[["128", "Lege foutmelding bij opslaan zaaktype", "voorstel agent: label bug, prioriteit hoog · beoordeeld door Lars de Koning 09:52", "running", "09:50", "", "5 van 8", true], ["127", "Datum verkeerd in export", "label verbetering", "success", "gisteren 13:39", "41 min", "8 van 8"], ["126", "Toegang voor gast klopt niet", "label beveiliging, niet akkoord", "success", "gisteren 10:12", "2 min", "6 van 8"]]' footer="Kies een run; het canvas toont het pad dat hij nam." run-href="#"></dc-import>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [
      { title: '', items: [['Dashboard', 'dashboard'], ['Chat', 'chat'], ['Goedkeuringen', 'check', 3]] },
      { title: 'Agents', items: [['Agents', 'people'], ['Runs', 'trend'], ['Geheugen', 'book'], ['Contexten', 'doc'], ['Skills', 'cert'], ['Evaluaties', 'chart'], ['Marktplaats', 'products']] },
      { title: 'Beheer', items: [['Flows', 'pipeline'], ['Instellingen', 'shield'], ['Tenantbeheer', 'org'], ['Koppelingen', 'key'], ['AI-toezicht', 'gavel'], ['Werken met AI', 'heart']] }
    ];
    const flow = {"nodes": [{"id": "t", "kind": "trigger", "title": "Nieuwe bevinding", "sub": "in OpenRegister, schema Bevinding", "col": 1, "row": 0}, {"id": "ai", "kind": "ai", "title": "Voorstel door agent", "sub": "label en prioriteit", "col": 1, "row": 1}, {"id": "lo", "kind": "action", "title": "Label opschonen", "sub": "hangt los", "col": 2, "row": 1}, {"id": "h", "kind": "human", "title": "Beoordelen", "sub": "door Lars de Koning", "col": 1, "row": 2}, {"id": "c", "kind": "condition", "title": "Akkoord?", "sub": "veld beoordeling, 2 routes", "col": 1, "row": 3}, {"id": "b", "kind": "action", "title": "Build starten", "sub": "werkmap per run", "col": 0, "row": 4}, {"id": "w", "kind": "wait", "title": "Wachten op terugmelding", "sub": "mag tot 2 uur duren", "col": 0, "row": 5}, {"id": "m", "kind": "message", "title": "Melder informeren", "sub": "bericht in Talk", "col": 2, "row": 4}, {"id": "e", "kind": "end", "title": "Einde", "sub": "sluit de run af", "col": 1, "row": 6}], "edges": [["t", "ai"], ["ai", "h"], ["h", "c"], ["c", "b", "ja"], ["c", "m", "nee"], ["b", "w"], ["w", "e"], ["m", "e"]]};
    const title = "Hydra-triage";
    const palet = [{"title": "Triggers", "items": [["trigger", "Nieuwe bevinding", ""], ["trigger", "Bericht in een kanaal", "Talk"], ["schedule", "Op schema", ""]]}, {"title": "Agents", "items": [["ai", "Agent-actie", ""], ["ai", "Beoordelen met een agent", ""], ["ai", "Samenvatten", ""]]}, {"title": "Mensen", "items": [["human", "Beoordeling vragen", ""], ["approval", "Goedkeuring", ""]]}, {"title": "Acties", "items": [["action", "Label zetten", ""], ["action", "Build starten", ""], ["message", "Bericht sturen", ""]]}, {"title": "Logica", "items": [["condition", "Voorwaarde", ""], ["wait", "Wachten", ""], ["end", "Einde", ""]]}];

    return { nav, flow, title, palet };
  }
}
</script>
</body>
