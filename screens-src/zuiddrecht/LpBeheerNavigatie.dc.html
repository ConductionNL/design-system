<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, organisatiemenu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Organisatiemenu" title="Launchpad-beheer: organisatiemenu" scope="het menu en de voettekst naast elk dashboard" sections="{{ sections }}" hint-size="100%,1400px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Organisatiemenu: the menu as a tree with groups per link, a preview per
    // person and the footer with contact, links and disclaimer.
    const sections = [
      { name: 'Organisatiemenu', help: true, desc: 'Staat naast elk dashboard. Tot drie niveaus; per link kiest u welke groepen hem zien.', rows: [
        { items: [
          ['Werken bij Zuiddrecht', 'Iedereen', 'Acties'],
          ['  Personeelsgids', 'intranet.zuiddrecht.nl/personeelsgids · Iedereen', 'Acties'],
          ['  Verlof en verzuim', 'Iedereen', 'Acties'],
          ['    Ziek melden', 'mijnverlof.zuiddrecht.nl/ziek · Iedereen', 'Acties'],
          ['Werkinstructies', 'Dienstverlening', 'Acties'],
          ['  Woo-verzoeken', 'docs.zuiddrecht.nl/woo · Team informatie', 'Acties'],
          ['ICT-servicedesk', 'topdesk.zuiddrecht.nl · Iedereen', 'Acties']
        ] },
        { buttons: [['Link toevoegen', '']] },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Voorbeeld voor Sanne de Vries (KCC)', desc: 'Wat één persoon van het menu ziet.', rows: [
        { select: 'Bekijk als', value: 'Sanne de Vries (KCC)' },
        { items: [['Werken bij Zuiddrecht', 'Personeelsgids · Verlof en verzuim'], ['Werkinstructies', ''], ['ICT-servicedesk', '']] }
      ] },
      { name: 'Voettekst', desc: 'Staat onder elk dashboard.', rows: [
        { pair: [{ label: 'Contact', value: 'Servicedesk 0180 123 456' }, { label: 'E-mail', value: 'servicedesk@zuiddrecht.nl' }] },
        { area: 'Links in de voettekst', rows: 3, value: 'Privacyverklaring | https://www.zuiddrecht.nl/privacy\nToegankelijkheid | https://www.zuiddrecht.nl/toegankelijkheid' },
        { text: 'Disclaimer (niet verplicht)', value: 'Intern gebruik. Deel geen persoonsgegevens buiten de organisatie.' },
        { note: 'Voorbeeld: Servicedesk 0180 123 456 · Privacyverklaring · Toegankelijkheid · Intern gebruik.', tone: 'plain' },
        { buttons: [['Opslaan', 'primary']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
