<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: mail processing rules</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#ml-rule-test::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2133px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Processing rules: the chain, one rule open in the editor, the address test under the table</figcaption>
    <div style="height: 1473px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
  <dc-import name="MlHeader" app="Administration" placeholder="Search rules, domains or settings" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Processing rules" hint-size="264px,1390px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">
      <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
          <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Processing rules</h1>
          <p style="margin: 0; color: #3d4047">Every message that arrives or leaves passes the rules below in this order, top to bottom. These run for everyone, before a person's own rules and before the filter script on their page. Each rule reads in plain words: when this, then that.</p>
          <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Rules of Northwind Projects. A rule that is switched off stays in the chain but does nothing.</p>
        </div>
        <button type="button" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add rule</button>
      </div>

      <div style="display: flex; align-items: center; gap: 12px">
        <span style="font-size: 13px; color: #5e6168">7 rules, 6 switched on</span>
        <span style="flex: 1 1 auto"></span>
        <span style="font-size: 13px; color: #5e6168">Drag a row to change the order</span>
      </div>
      <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <table style="width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px">
          <thead><tr style="background: #fafbfc">
            <th scope="col" style="{{ th }} width: 52px; text-align: right">#</th>
            <th scope="col" style="{{ th }} width: 21%">Rule</th>
            <th scope="col" style="{{ th }} width: 25%">When</th>
            <th scope="col" style="{{ th }} width: 29%">Then</th>
            <th scope="col" style="{{ th }}">State</th>
            <th scope="col" style="width: 48px"><span style="{{ srOnly }}">Actions</span></th>
          </tr></thead>
          <tbody>
            <sc-for list="{{ rules }}" as="r" hint-placeholder-count="7">
              <tr aria-selected="{{ r.selected }}" style="{{ r.style }}">
                <td style="padding: 14px 16px; line-height: 20px; text-align: right; color: #5e6168; white-space: nowrap">{{ r.n }}</td>
                <td style="padding: 14px 16px; line-height: 20px"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">{{ r.name }}</a></td>
                <td style="padding: 14px 16px; line-height: 20px; color: #3d4047">{{ r.when }}</td>
                <td style="padding: 14px 16px; line-height: 20px; color: #3d4047">{{ r.then }}</td>
                <td style="padding: 14px 16px; line-height: 20px; white-space: nowrap"><span style="display: flex; align-items: center; gap: 6px; line-height: 20px"><span style="{{ r.dot }}; flex: none"></span>{{ r.state }}</span></td>
                <td style="padding: 10px 10px 10px 8px; text-align: right; line-height: 0"><button type="button" aria-haspopup="menu" aria-label="Actions for {{ r.name }}" style="{{ iconBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>

      <section aria-labelledby="ml-rule-test-title" style="display: flex; flex-direction: column; gap: 10px; padding: 16px 20px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
        <div style="display: flex; flex-direction: column; gap: 2px"><h2 id="ml-rule-test-title" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Test an address</h2><span style="font-size: 12px; color: #5e6168; line-height: 18px">Changes nothing. Type an address to see which rewrite rules touch it, in which order, and where its mail ends up.</span></div>
        <div style="display: flex; align-items: center; gap: 12px">
          <label for="ml-rule-test" style="{{ srOnly }}">Address to test</label>
          <input id="ml-rule-test" type="text" value="sales@northwind-consulting.test" placeholder="Type an address" style="width: 360px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
          <button type="button" style="{{ btnSecondary }}">Test</button>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3d4047; flex-wrap: wrap">
          <span>2 rules rewrite mail for sales@northwind-consulting.test, in this order:</span>
          <span style="{{ chip }}">3 &nbsp;Rewrite consulting addresses</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
          <span style="{{ chip }}">5 &nbsp;Route support mail by directory</span>
          <span style="color: #5e6168">Result: support@support.northwind-projects.test</span>
        </div>
      </section>

    </main>

    <aside aria-label="Rule Stop customer data leaks" style="flex: 0 0 440px; width: 440px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 24px; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
      <div style="display: flex; align-items: flex-start; gap: 8px">
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Rule 4: Stop customer data leaks</h2>
          <span style="font-size: 13px; color: #3d4047">Applies to mail of northwind-projects.test</span>
        </div>
        <button type="button" aria-label="Close rule" style="flex: none; width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <label for="ml-rule-on" style="display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 500">Rule is switched on</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">Held 3 messages in the past 30 days.</span></label>
        <button id="ml-rule-on" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #e4e6ea">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
          <h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">When</h3>
          <span style="font-size: 12px; color: #5e6168">Combine conditions with and, or and not: pick the word in front of each. A group holds the ones that belong together.</span>
        </div>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
          <li style="display: flex; align-items: flex-start; gap: 8px">
            <span style="{{ joinFirst }}">When</span>
            <div style="{{ condBox }}"><span><span style="color: #5e6168">Message leaves from</span> northwind-projects.test</span><button type="button" aria-label="Remove condition 1" style="{{ iconBtnSmall }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
          </li>
          <li style="display: flex; align-items: flex-start; gap: 8px">
            <button type="button" aria-haspopup="listbox" aria-label="How the group combines with the condition above" style="{{ joinBtn }}">and<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <div role="group" aria-labelledby="ml-rule-group-any" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px; padding: 8px 8px 8px 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-left: 3px solid var(--sc-action, #3669a5); border-radius: var(--sc-radius-lg, 10px); background: #f5f6f8">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span id="ml-rule-group-any" style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #234a78">Any of these</span><span style="font-size: 12px; color: #5e6168">one match is enough</span></div>
              <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
                <sc-for list="{{ groupConds }}" as="c" hint-placeholder-count="2">
                  <li style="display: flex; align-items: flex-start; gap: 8px">
                    <span style="{{ joinIn }}">{{ c.join }}</span>
                    <div style="{{ condBox }}"><span><span style="color: #5e6168">{{ c.field }}</span> {{ c.value }}</span><button type="button" aria-label="Remove condition {{ c.n }}" style="{{ iconBtnSmall }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
                  </li>
                </sc-for>
              </ol>
              <button type="button" style="{{ btnCompact }} align-self: flex-start; height: 28px; font-size: 12px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add to this group</button>
            </div>
          </li>
          <li style="display: flex; align-items: flex-start; gap: 8px">
            <button type="button" aria-haspopup="listbox" aria-label="How condition 4 combines with the ones above" style="{{ joinBtn }}">and not<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <div style="{{ condBox }}"><span><span style="color: #5e6168">Company directory says</span> sender is a member of Finance</span><button type="button" aria-label="Remove condition 4" style="{{ iconBtnSmall }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>
          </li>
        </ol>
        <span style="font-size: 12px; color: #5e6168; line-height: 18px">Reads as: leaves our domain, and (citizen service number or bank account number), and not from Finance.</span>
        <button type="button" style="{{ btnCompact }} align-self: flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add condition</button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #e4e6ea; position: relative">
        <h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Then</h3>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{ acts }}" as="a" hint-placeholder-count="2">
            <li style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font-size: 13px; line-height: 18px">
              <span><span style="color: #5e6168">{{ a.kind }}</span> {{ a.value }}</span>
              <button type="button" aria-label="Remove action {{ a.n }}" style="{{ iconBtnSmall }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </li>
          </sc-for>
        </ol>
        <button type="button" aria-haspopup="menu" style="{{ btnCompact }} align-self: flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add action</button>
      </div>

      <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
        <button type="button" style="{{ btnPrimary }}">Save rule</button>
        <button type="button" style="{{ btnSecondary }}">Cancel</button>
        <span style="flex: 1 1 auto"></span>
        <button type="button" style="{{ btnDanger }}">Delete rule</button>
      </div>
    </aside>
  </div>
    </div>
  </figure>

  <figure style="margin: 0; width: 440px; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The Add action menu of the editor, drawn open on its own so it covers nothing</figcaption>
    <div style="height: 520px; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; gap: 8px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
      <h3 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Then</h3>
      <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{ acts }}" as="a" hint-placeholder-count="2">
          <li style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font-size: 13px; line-height: 18px">
            <span><span style="color: #5e6168">{{ a.kind }}</span> {{ a.value }}</span>
            <button type="button" aria-label="Remove action {{ a.n }}" style="{{ iconBtnSmall }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </li>
        </sc-for>
      </ol>
        <button type="button" aria-expanded="true" aria-controls="ml-rule-actions" style="{{ btnCompact }} align-self: flex-start"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add action</button>
        <div id="ml-rule-actions" role="menu" aria-label="Add action" style="position: relative; margin-top: 2px; width: 100%; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10">
          <span style="display: block; padding: 4px 10px 6px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5e6168">What should happen</span>
          <sc-for list="{{ menu }}" as="m" hint-placeholder-count="7">
            <button type="button" role="menuitem" style="{{ menuItem }}"><span>{{ m.label }}</span><span style="font-size: 12px; color: #5e6168">{{ m.hint }}</span></button>
          </sc-for>
        </div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2120}}'>
class Component extends DCLogic {
  renderVals() {
    const dot = (bg, ring) => 'display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: ' + bg + '; box-shadow: 0 0 0 2px ' + ring;
    const D = { ok: dot('#d3f9d8', '#8ff09c'), warn: dot('#ffc078', '#ff9d2e'), busy: dot('#66d9e8', '#21c8de'), bad: dot('#fcc2d7', '#f977a6'), off: dot('#dee2e6', '#adb5bd') };
    const srOnly = 'position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)';
    const th = 'text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap;';
    const btnPrimary = 'display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap;';
    const btnSecondary = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap;';
    const btnCompact = 'flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap';
    const btnDanger = 'display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap;';
    const iconBtn = 'width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center';
    const iconBtnSmall = 'flex: none; width: 24px; height: 24px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center';
    const chip = 'display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 600; white-space: nowrap';
    const switchOn = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff';
    const menuItem = 'display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 400 14px \'Fira Sans\', sans-serif; text-align: left; white-space: nowrap; cursor: pointer';
    const row = 'border-top: 1px solid #eef0f3; ';
    const rules = [
      ['Footer on outgoing mail', 'Message leaves from northwind-projects.test', 'Add the footer "Northwind Projects, Chamber of commerce 12345678"', D.ok, 'On', false],
      ['Mark mailing list mail', 'Comes from a mailing list', 'Prefix the subject with [List] and add the header X-Northwind-List', D.ok, 'On', false],
      ['Rewrite consulting addresses', 'Recipient matches *@northwind-consulting.test', 'Rewrite the recipient with the pattern $1@northwind-projects.test', D.ok, 'On', false],
      ['Stop customer data leaks', 'Leaves our domain and matches a data leak pattern, and sender is not in Finance', 'Hold the message and tell the sender why', D.ok, 'On', true],
      ['Route support mail by directory', 'Company directory says recipient department is Support', 'Redirect to support@support.northwind-projects.test', D.ok, 'On', false],
      ['Handle bounces for billing', 'Delivery error is mailbox full or address unknown', 'Forward a copy to postmaster@northwind-projects.test and add the header X-Northwind-Bounce', D.ok, 'On', false],
      ['Flag mail from outside', 'Sender domain is not one of ours', 'Prefix the subject with [External] and remove the header X-Priority', D.off, 'Off', false]
    ].map(([name, when, then, dot, state, selected], i) => ({ n: String(i + 1), name, when, then, dot, state, selected: selected ? 'true' : 'false', style: row + (selected ? 'background: #eaf0f7' : 'background: #ffffff') }));
    const cap = 'font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px';
    const joinFirst = 'flex: none; width: 64px; margin-top: 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #1b1c1d; text-align: right';
