<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: who can use a mailbox or a folder</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2480px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <sc-for list="{{ frames }}" as="fr" hint-placeholder-count="2">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">{{ fr.letter }}</span> &nbsp;{{ fr.caption }}</figcaption>
      <div style="{{ fr.frameStyle }}">
        <dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
        <div style="display: flex; flex: 1 1 auto; min-height: 0">
          <nav aria-label="Mailboxes" style="flex: 0 0 245px; width: 245px; box-sizing: border-box; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
            <div style="display: flex; align-items: center; gap: 4px">
              <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>New message</button>
              <button type="button" aria-label="Fold the folder list" aria-expanded="true" title="Fold the folder list" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
            </div>
            <button type="button" aria-haspopup="menu" aria-label="Account: Olivia Brandt, olivia@northwind-projects.test" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 8px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; color: #1b1c1d; text-align: left; font-family: 'Fira Sans', system-ui, sans-serif">
              <span style="width: 28px; height: 28px; border-radius: 14px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">OB</span>
              <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Olivia Brandt</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">olivia@northwind-projects.test</span></span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg>
            </button>
            <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
              <div style="display: flex; flex-direction: column; gap: 2px">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 4px 10px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span><sc-if value="{{ g.hasMenu }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="{{ g.menuLabel }}" title="{{ g.menuLabel }}" aria-haspopup="menu" style="flex: none; width: 26px; height: 26px; margin: -5px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button></sc-if></div>
                <sc-if value="{{ g.hasSub }}" hint-placeholder-val="{{ false }}"><div style="padding: 0 10px 6px; font-size: 12px; color: #5e6168; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ g.sub }}</div></sc-if>
                <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
                  <div style="display: flex; flex-wrap: wrap; align-items: center">
                  <a href="{{ it.href }}" aria-current="{{ it.current }}" aria-label="{{ it.aria }}" style="{{ it.style }}">
                    <sc-if value="{{ it.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg></sc-if>
                    <sc-if value="{{ it.hasSwatch }}" hint-placeholder-val="{{ false }}"><span style="{{ it.swatch }}"></span></sc-if>
                    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.label }}</span><sc-if value="{{ it.hasOwner }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.owner }}</span></sc-if></span>
                    <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ it.countStyle }}">{{ it.count }}</span></sc-if>
                    <sc-if value="{{ it.hasChevron }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></sc-if>
                    <sc-if value="{{ it.hasShared }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Shared" role="img" style="flex: none; color: #5e6168"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
                  </a>
                  <sc-if value="{{ it.nest }}" hint-placeholder-val="{{ false }}">
                    <button type="button" aria-expanded="true" aria-controls="{{ it.listId }}" aria-label="Collapse {{ it.label }}" title="Collapse {{ it.label }}" style="flex: none; width: 32px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                    <ul id="{{ it.listId }}" style="flex: 1 1 100%; list-style: none; margin: 1px 0 2px 20px; padding: 0 0 0 10px; border-left: 2px solid #e4e6ea; display: flex; flex-direction: column; gap: 1px">
                      <sc-for list="{{ it.children }}" as="c" hint-placeholder-count="3">
                        <li>
                          <sc-if value="{{ c.isItem }}" hint-placeholder-val="{{ true }}"><a href="#" aria-current="{{ c.current }}" aria-label="{{ c.aria }}" style="{{ c.style }}"><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.label }}</span><sc-if value="{{ c.hasShared }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-label="Shared" role="img" style="flex: none; color: #5e6168"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if></a></sc-if>
                          <sc-if value="{{ c.isNew }}" hint-placeholder-val="{{ false }}"><button type="button" style="display: flex; align-items: center; gap: 8px; width: 100%; min-height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg>{{ c.label }}</button></sc-if>
                        </li>
                      </sc-for>
                    </ul>
                  </sc-if>
                  </div>
                </sc-for>
              </div>
            </sc-for>
            <div style="margin-top: auto; padding: 0 10px; font-size: 12px; color: #5e6168; line-height: 1.4">2.1 GB of 10 GB used</div>
          </nav>
          <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="" hint-size="410px,1105px"></dc-import></div>
          <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px; text-align: center">
        <span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; border: 1px solid #e4e6ea; display: inline-flex; align-items: center; justify-content: center; color: #5e6168; margin-bottom: 8px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>
        </span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">Select a conversation</h2>
        <p style="margin: 0; max-width: 360px; color: #5e6168">Pick one from the list to read it here. Linked conversations show their work package on the right.</p>
      </div>
    </main>
        </div>

        <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: {{ fr.dialogTop }}px">
          <sc-if value="{{ fr.mailbox }}" hint-placeholder-val="{{ true }}">
          <div role="dialog" aria-modal="true" aria-labelledby="ml-share-mailbox-title" style="width: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: visible">
            <div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 16px 16px 24px; border-bottom: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <h3 id="ml-share-mailbox-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Who can use the mailbox Northwind support</h3>
                <span style="font-size: 13px; color: #5e6168; line-height: 18px">support@northwind-projects.test, 3 people</span>
              </div>
              <button type="button" aria-label="Close" style="flex: none; width: 40px; height: 40px; margin-top: -6px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 24px 20px">

              <div style="display: flex; flex-direction: column; gap: 6px; position: relative">
                <label for="ml-share-add" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Add a person</label>
                <div style="position: relative; display: flex; align-items: center">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: #5e6168"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.35-4.35"></path></svg>
                  <input id="ml-share-add" type="text" placeholder="Type the first letters of a name or address." title="Only people of northwind-projects.test are found." style="width: 100%; height: 40px; padding: 0 12px 0 38px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
                </div>
              </div>

              <table style="width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
                <thead><tr style="height: 44px; background: #fafbfc"><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3; white-space: nowrap">Member</th><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3; white-space: nowrap">Role</th><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3; white-space: nowrap" title="Sends from support@northwind-projects.test, on top of the role. Off for a Viewer.">May send as this mailbox</th><th scope="col" style="padding: 0 16px; border-bottom: 1px solid #eef0f3"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Withdraw</span></th></tr></thead>
                <tbody>
                  <sc-for list="{{ members }}" as="r" hint-placeholder-count="3">
                    <tr style="height: 48px; border-bottom: 1px solid #eef0f3">
                      <td style="padding: 0 16px; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 8px"><span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ r.initials }}</span><span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 15px; font-weight: 600">{{ r.name }}</span><span style="font-size: 12px; color: #5e6168">{{ r.addr }}</span></span></span></td>
                      <td style="padding: 0 16px"><button type="button" aria-haspopup="listbox" aria-label="Role of {{ r.name }}: {{ r.role }}" title="Give each member a role: Viewer, Editor or Manager. Viewer: Reads only, cannot move, label or delete; cannot send from this mailbox. Editor: also moves to folders, labels, marks and deletes. Manager: also grants and withdraws access and changes roles." style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 34px; min-width: 116px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; white-space: nowrap"><span>{{ r.role }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></td>
                      <td style="padding: 0 16px"><span style="display: inline-flex; align-items: center; gap: 8px"><button type="button" role="switch" aria-checked="{{ r.sendOn }}" aria-label="{{ r.name }} may send as this mailbox" style="{{ r.switch }}"><span style="{{ r.knob }}"></span></button><span style="font-size: 13px; color: #5e6168">{{ r.sendText }}</span></span></td>
                      <td style="padding: 0 16px; text-align: right"><button type="button" aria-label="Withdraw the access of {{ r.name }}" aria-disabled="{{ r.locked }}" title="{{ r.removeTitle }}" style="{{ r.removeStyle }}">Withdraw</button></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>

              <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 14px; line-height: 21px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px; color: #3669a5"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg><span>Olivia Brandt is the last Manager and cannot be removed. Grant another member the Manager role first if you want to step back.</span></div>


              <div style="display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid #eef0f3">
                <button type="button" aria-disabled="true" title="Not possible while you are the last Manager. Grant the role to someone else first; the others keep everything when you leave." style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; margin-left: -12px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; opacity: 0.35; cursor: not-allowed"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>Leave this mailbox</button>
                <span style="flex: 1 1 auto"></span>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Done</button>
              </div>
            </div>
          </div>
          </sc-if>

          <sc-if value="{{ fr.folder }}" hint-placeholder-val="{{ false }}">
          <div role="dialog" aria-modal="true" aria-labelledby="ml-share-folder-title" style="width: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
            <div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 16px 16px 24px; border-bottom: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <h3 id="ml-share-folder-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Who can use the folder Lyon</h3>
                <span style="font-size: 13px; color: #5e6168; line-height: 18px">Customers / Lyon in your mailbox. Shared with 2 people and 1 group.</span>
              </div>
              <button type="button" aria-label="Close" style="flex: none; width: 40px; height: 40px; margin-top: -6px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 24px 20px">

              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 14px; line-height: 21px; color: #3d4047">
                <span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">OB</span>
                <span><strong style="font-weight: 600; color: #1b1c1d">What you may do here:</strong> see the folder, read, mark, add and delete, and share it with others. You own this folder.</span>
              </div>

              <div style="display: flex; flex-direction: column; gap: 6px">
                <label for="ml-share-folder-add" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Add a person or a group</label>
                <div style="position: relative; display: flex; align-items: center">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: #5e6168"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16M21 21l-4.35-4.35"></path></svg>
                  <input id="ml-share-folder-add" type="text" placeholder="Name, address, group, or Everyone signed in" style="width: 100%; height: 40px; padding: 0 12px 0 38px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
                </div>
              </div>

              <table style="width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
