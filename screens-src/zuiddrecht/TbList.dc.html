<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: list view of a filter with rows, sorting and quick add</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1980px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The filter Due this week as a list, grouped by day, with three lines pasted into quick add and TASK #58440 being dragged onto Thursday</figcaption>
    <div style="position: relative; height: 1400px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Due this week" hint-size="264px,1345px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">7 open work packages, 12 to 16 October</span></div>
            <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
              <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
              <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
              <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>
            </div>
            <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Day. Choose status or project" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Day<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <div style="flex: 1 1 auto"></div>
            <button type="button" aria-pressed="true" aria-haspopup="dialog" aria-keyshortcuts="F" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter: Due this week</button>
            <div role="group" aria-label="Members" style="flex: none; display: flex; align-items: center">
              <span title="Olivia Brandt" aria-label="Olivia Brandt" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #eaf0f7; color: #234a78">OB</span>
              <span title="Tom Achterberg" aria-label="Tom Achterberg" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">TA</span>
              <span title="Priya Raman" aria-label="Priya Raman" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">PR</span>
              <span title="2 more members" aria-label="2 more members" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eef0f3; color: #3d4047">+2</span>
            </div>
            <button type="button" aria-pressed="false" aria-haspopup="dialog" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg>Project details</button>
          </div>
          <div role="toolbar" aria-label="List options" style="flex: none; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 24px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Grouped by day</span>
            <div style="flex: 1 1 auto"></div>
            <div role="group" aria-label="Sort" style="display: flex; align-items: center; gap: 6px">
              <button type="button" aria-haspopup="menu" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path></svg>Sort: due date<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <button type="button" aria-label="Reverse sort direction" aria-pressed="false" title="Earliest first. Click for latest first" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"></path></svg>Earliest first</button>
            </div>
            <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Show closed</button>
          </div>

          <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 72px; overflow: hidden">
            <section aria-label="Quick add" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #3669a5; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 0 0 3px #eaf0f7">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px 6px">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px; color: #3669a5"><path d="M12 5v14M5 12h14"></path></svg>
                <div role="textbox" aria-multiline="true" aria-label="Quick add. Type a title and press Enter, or paste several lines for several work packages" style="flex: 1 1 auto; min-width: 0; min-height: 63px; font-size: 14px; line-height: 21px; color: #1b1c1d; white-space: pre-wrap">Confirm the trainer for the Kassel training
Book a room for the Lyon kick-off
Send the agenda to Marc Dubois<span aria-hidden="true" style="display: inline-block; width: 1px; height: 18px; margin-left: 1px; vertical-align: -3px; background: #1b1c1d"></span></div>
              </div>
              <div style="display: flex; align-items: center; gap: 12px; padding: 8px 14px 10px; border-top: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 18px">
                <span style="flex: 1 1 auto; min-width: 0">Type a title and press Enter, or paste several lines for several work packages. 3 lines pasted: 3 new work packages take the due date of this filter, Friday 16 October, in Northwind rollout Lyon.</span>
                <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Add 3 work packages</button>
              </div>
            </section>

            <div role="group" aria-label="Drop targets while dragging" style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; box-sizing: border-box; border: 1px dashed #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 600; line-height: 18px">
              <span style="flex: none">Drop on a collection to make it important, due today or closed:</span>
              <sc-for list="{{ dropTargets }}" as="d" hint-placeholder-count="3"><span style="{{ d.style }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ d.icon }}"></path></svg>{{ d.label }}<sc-if value="{{ d.hasMark }}" hint-placeholder-val="{{ false }}"><span role="img" title="Starring and pinning are kept in Nextcloud" aria-label="Starring and pinning are kept in Nextcloud" style="display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></sc-if></span></sc-for>
              <span style="flex: 1 1 auto"></span>
              <span style="font-weight: 400">Drop it between two rows to reorder, or on a day to plan it there.</span>
            </div>

            <sc-for list="{{ groups }}" as="g" hint-placeholder-count="6">
              <section aria-label="{{ g.title }}" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); overflow: hidden">
                <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-bottom: 1px solid #e4e6ea; background: #ffffff">
                  <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{ g.color }}">{{ g.title }}</h2>
                  <span style="font-size: 12px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; color: #3d4047">{{ g.count }}</span>
                  <span style="flex: 1 1 auto"></span>
                  <span style="font-size: 12px; color: #5e6168; white-space: nowrap">{{ g.hint }}</span>
                </div>
                <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
                  <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
                    <li aria-label="{{ r.aria }}" style="{{ r.style }}">
                      <span aria-hidden="true" style="flex: none; width: 14px; color: #c4c7cb; display: inline-flex; align-items: center; justify-content: center; cursor: grab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01"></path></svg></span>
                      <button type="button" role="checkbox" aria-checked="{{ r.checked }}" aria-label="{{ r.checkLabel }}" style="{{ r.checkStyle }}"><sc-if value="{{ r.isDone }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button>
                      <button type="button" aria-label="{{ r.starLabel }}" aria-pressed="{{ r.starred }}" style="{{ r.starStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ r.starFill }}" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
                      <button type="button" aria-label="{{ r.pinLabel }}" aria-pressed="{{ r.pinned }}" style="{{ r.pinStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ r.pinFill }}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 7 3 2v2H7v-2l3-2z"></path></svg></button><sc-if value="{{ r.isPinned }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 300px; top: -24px; z-index: 4; display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; font-weight: 500; white-space: nowrap; box-shadow: 0 4px 12px rgba(27,28,29,0.12)">Pinned to the top. Unpin. Starring and pinning are kept in Nextcloud</span></sc-if>
                      <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; width: 112px"><span style="{{ r.typeStyle }}">{{ r.type }}</span><span style="color: #3d4047">{{ r.number }}</span></span>
                      <span dir="{{ r.dir }}" style="{{ r.titleStyle }}">{{ r.title }}<sc-if value="{{ r.hasLink }}" hint-placeholder-val="{{ false }}"> <a href="{{ r.link }}" style="color: var(--sc-link, #3669a5)">{{ r.linkText }}</a></sc-if></span>
                      <span role="group" aria-label="{{ r.tagsLabel }}" style="flex: none; display: inline-flex; gap: 4px"><sc-for list="{{ r.tags }}" as="t" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #3d4047; font-size: 11px; white-space: nowrap"><span style="{{ t.dot }}"></span>{{ t.name }}</span></sc-for></span>
                      <span style="flex: none; display: inline-flex; gap: 6px; width: 92px; color: #5e6168"><sc-for list="{{ r.icons }}" as="k" hint-placeholder-count="2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{ k.label }}"><title>{{ k.label }}</title><path d="{{ k.d }}"></path></svg></sc-for></span>
                      <span style="{{ r.dueStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{ r.due }}</span>
                    </li>
                  </sc-for>
                  <sc-if value="{{ g.hasDrop }}" hint-placeholder-val="{{ false }}"><li aria-live="polite" style="display: flex; align-items: center; justify-content: center; height: 52px; margin: 6px 14px 8px; box-sizing: border-box; border: 2px dashed #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 600">Drop here to plan it for Thursday 15 October</li></sc-if>
                  <sc-if value="{{ g.hasGhost }}" hint-placeholder-val="{{ false }}"><li aria-hidden="true" style="height: 48px; margin: 6px 14px 8px; box-sizing: border-box; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #f5f6f8"></li></sc-if>
                  <sc-if value="{{ g.hasFooter }}" hint-placeholder-val="{{ false }}"><li style="display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 14px; border-top: 1px solid #e4e6ea; font-size: 12px; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4l2 2"></path></svg><span style="flex: 1 1 auto">Closed work packages are loaded only when you show them. Loaded just now, 2 of 4 shown.</span><button type="button" style="flex: none; height: 28px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap">Show 2 more</button><button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>Delete all closed</button></li></sc-if>
                </ol>
              </section>
            </sc-for>

            <div aria-label="{{ drag.aria }}" style="{{ drag.style }}">
              <span aria-hidden="true" style="flex: none; width: 14px; color: #c4c7cb; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01"></path></svg></span>
              <span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid #c4c7cb; border-radius: 4px; background: #ffffff"></span>
              <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #08a5df">TASK</span><span style="color: #3d4047">#58440</span></span>
              <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Send OIDC client settings to Lyon</span>
              <span style="flex: none; display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #5e6168; white-space: nowrap">Fri 16 Oct</span>
            </div>
