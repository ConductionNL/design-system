<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>keepiq: persoonlijke instellingen, dialoog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="KqDashboard" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Keepiq" version="0.3.8" active="Sessie" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Keepiq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen in the navigation
    // (manifest entry, action user-settings). App.vue fills it: Sessie, Standaarden, Verloopregels, Andere
    // organisaties, Beveiliging and Versleuteling (GET/PUT /api/settings/user). Replaces the Keepiq section drawn
    // inside Nextcloud's personal settings (decision 11 Oct 2026); the passkeys and account recovery from that board
    // sit under Beveiliging.
    const sections = [
      { name: 'Sessie', desc: 'Hoe lang je kluis open blijft zonder activiteit.', rows: [
        { select: 'Sessie verloopt na', value: '30 minuten', hint: 'Daarna vergrendelt de kluis en is je sleutel uit het geheugen gewist. Kies je Nextcloud-sessie, dan blijft hij open zolang je bent ingelogd.' }
      ] },
      { name: 'Standaarden', desc: 'Nieuwe geheimen beginnen als deze soort, en je lijst opent in deze weergave.', rows: [
        { pair: [{ label: 'Standaardsoort', value: 'Inlog', select: true }, { label: 'Standaardweergave', value: 'Lijst', select: true }] }
      ] },
      { name: 'Verloopregels', desc: 'Hoe lang wachtwoorden van een soort of in een map mogen bestaan. Gelden er meer datums, dan telt de vroegste.', rows: [
        { items: [
          ['Map Applicatiebeheer', 'Verloopt na 90 dagen · herinneringen 30 en 7 dagen vooraf', '', 'Ingesteld door je beheerder'],
          ['Soort Certificaat', 'Herinneringen 60 en 14 dagen vooraf', 'Verwijderen']
        ] },
        { buttons: [['Regel toevoegen', '']] }
      ] },
      { name: 'Andere organisaties', rows: [
        { switch: 'Geheimen ontvangen van andere organisaties', hint: 'Mensen in partnerorganisaties kunnen je dan vinden en geheimen met je delen. Je accepteert elk geheim zelf.', on: true }
      ] },
      { name: 'Beveiliging', desc: 'Je masterwachtwoord, passkeys en accountherstel.', rows: [
        { items: [['Werkplek-laptop, vingerafdruk', 'Passkey · laatst gebruikt vandaag', 'Intrekken'], ['Beveiligingssleutel sleutelbos', 'Passkey · laatst gebruikt 30 september', 'Intrekken']] },
        { buttons: [['Passkey toevoegen', ''], ['Masterwachtwoord wijzigen', '']] },
        { buttons: [['Mijn masterwachtwoord is gecompromitteerd', 'danger']] }
      ] },
      { name: 'Versleuteling', rows: [
        { facts: [['Status', 'actief'], ['Aangemaakt', '12 maart 2026, 10.14'], ['Suite-ID', 'suite-7c41e2b0']] },
        { buttons: [['Encryptiesuite intrekken', 'danger']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
