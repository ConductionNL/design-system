<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Kop en hoofdmenu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; width: 100%">
  <a href="#inhoud" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Direct naar de inhoud</a>
  <div style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
    <a href="Home.dc.html" style="display: flex; align-items: center" aria-label="Esdoornveen, mbo college, naar de homepage">
      <img src="/_blob/66ca6c7f4986425c4586d07547bc29b1" alt="Esdoornveen, mbo college" style="height: 52px; width: auto; display: block">
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <form role="search" style="position: relative; display: flex">
        <label for="kop-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken op de website</label>
        <input id="kop-zoek" type="search" placeholder="Zoeken" style="width: 280px; max-width: 100%; height: 44px; box-sizing: border-box; padding: 0 48px 0 14px; border: 1px solid #5c6470; border-radius: 4px; background: #ffffff; font: 400 16px 'IBM Plex Sans', sans-serif; color: #1a1a1a">
        <button type="submit" aria-label="Zoeken" style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: transparent; color: #5b2e91; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </button>
      </form>
      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
        <a href="MijnOverzicht.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 6px; border: 1px solid #d3d8df; border-radius: 22px; color: #1a1a1a; font-size: 16px; font-weight: 600; text-decoration: none">
          <span style="width: 32px; height: 32px; border-radius: 16px; background: #f0eaf7; color: #43206e; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">MG</span>Milan de Groot
        </a>
        <a href="Home.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 4px; color: #5b2e91; font-size: 16px; font-weight: 600">Uitloggen</a>
      </sc-if>
      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
        <a href="Inloggen.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 4px; background: #5b2e91; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>
          Mijn Esdoornveen
        </a>
      </sc-if>
    </div>
  </div>
  <nav aria-label="Hoofdmenu" style="border-top: 1px solid #e6e9ee">
    <ul style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 0 10px; list-style: none; display: flex; flex-wrap: wrap">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="7">
        <li><a href="{{ item.href }}" aria-current="{{ item.current }}" style="{{ item.style }}">{{ item.label }}</a></li>
      </sc-for>
    </ul>
  </nav>
  <div aria-hidden="true" style="height: 6px; background: #5b2e91; overflow: hidden">
    <div style="max-width: 1280px; height: 6px; box-sizing: border-box; margin: 0 auto; padding: 0 24px; display: flex">
      <span style="flex: none; width: 168px; height: 6px; background: #c2255c; transform: skewX(-32deg)"></span>
    </div>
  </div>
  <sc-if value="{{ hasCrumbs }}" hint-placeholder-val="{{ true }}">
    <ol aria-label="Kruimelpad" style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 16px 24px 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 15px">
      <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="2">
        <li style="display: flex; gap: 8px"><sc-if value="{{ c.link }}" hint-placeholder-val="{{ true }}"><a href="{{ c.href }}" style="color: #5b2e91">{{ c.label }}</a><span aria-hidden="true" style="color: #4a4a4a">/</span></sc-if><sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><span aria-current="page" style="color: #4a4a4a">{{ c.label }}</span></sc-if></li>
      </sc-for>
    </ol>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"signedIn":{"editor":"boolean","default":false},"active":{"editor":"text","default":"Home"},"crumbs":{"editor":null,"default":[]},"$preview":{"width":1440,"height":156}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const nav = [
      ['Home', 'Home.dc.html'], ['Opleidingen', 'Zoeken.dc.html'], ['Aanmelden', 'Contentpagina.dc.html'],
      ['Voor studenten', 'Contentpagina.dc.html'], ['Voor bedrijven', 'Contentpagina.dc.html'],
      ['Nieuws', 'Contentpagina.dc.html'], ['Over Esdoornveen', 'Contentpagina.dc.html']
    ];
    const base = 'display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; ';
    const items = nav.map(([label, href]) => {
      const on = label === active;
      return { label, href, current: on ? 'page' : 'false',
        style: base + (on ? 'font-weight: 700; box-shadow: inset 0 -4px 0 #c2255c;' : 'font-weight: 500;') };
    });
    const raw = this.props.crumbs && this.props.crumbs.length ? this.props.crumbs : [];
    const crumbs = raw.map((c, i) => ({ ...c, link: i < raw.length - 1, last: i === raw.length - 1, href: c.href ?? 'Home.dc.html' }));
    const signedIn = this.props.signedIn === true;
    return { items, crumbs, hasCrumbs: crumbs.length > 1, signedIn, signedOut: !signedIn };
  }
}
</script>
</body>
</html>
