<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Kop en hoofdmenu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<header style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; width: 100%">
  <a href="#inhoud" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Direct naar de inhoud</a>
  <div style="max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
    <a href="Home.dc.html" style="display: flex; align-items: center" aria-label="Gemeente Zuiddrecht, naar de homepage">
      <img src="/_blob/fd901beaf169b6dc7e7c38a8ff489d4b" alt="Gemeente Zuiddrecht" style="height: 52px; width: auto; display: block">
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <nav aria-label="Taal" style="display: flex">
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; align-items: center; gap: 2px; font-size: 16px">
          <li><a href="Home.dc.html" hreflang="nl" lang="nl" aria-current="true" style="display: inline-flex; align-items: center; height: 44px; padding: 0 10px; color: #1a1a1a; font-weight: 700; text-decoration: none; box-shadow: inset 0 -3px 0 #3669a5">Nederlands</a></li>
          <li><a href="Home.dc.html" hreflang="en" lang="en" style="display: inline-flex; align-items: center; height: 44px; padding: 0 10px; font-weight: 500">English</a></li>
        </ul>
      </nav>
      <form role="search" style="position: relative; display: flex">
        <label for="kop-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken op de website</label>
        <input id="kop-zoek" type="search" placeholder="Zoeken" style="width: 260px; height: 44px; box-sizing: border-box; padding: 0 48px 0 14px; border: 1px solid #8a929e; border-radius: 4px; background: #ffffff; font: 400 16px 'Fira Sans', sans-serif; color: #1a1a1a">
        <button type="submit" aria-label="Zoeken" style="position: absolute; right: 0; top: 0; width: 44px; height: 44px; border: 0; background: transparent; color: #3669a5; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"></path></svg>
        </button>
      </form>
      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
        <a href="MijnOverzicht.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px 0 6px; border: 1px solid #d3d8df; border-radius: 22px; color: #1a1a1a; font-weight: 600; text-decoration: none">
          <span style="width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">SV</span>Sanne de Vries
        </a>
        <a href="Home.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 4px; font-weight: 600">Uitloggen</a>
        <sc-if value="{{ beheer }}" hint-placeholder-val="{{ false }}">
          <a href="Editor.dc.html" aria-label="Deze pagina bewerken in portaliq" title="Deze pagina bewerken in portaliq" style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 4px; background: #e2611a; color: #ffffff"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11H11V3H3M5 5H9V9H5M13 21H21V13H13M15 15H19V19H15M3 21H11V13H3M5 15H9V19H5M13 3V11H21V3M19 9H15V5H19Z"></path></svg></a>
        </sc-if>
      </sc-if>
      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
        <a href="Inloggen.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600; text-decoration: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,6A2,2 0 0,0 10,8A2,2 0 0,0 12,10A2,2 0 0,0 14,8A2,2 0 0,0 12,6M12,13C14.67,13 20,14.33 20,17V20H4V17C4,14.33 9.33,13 12,13M12,14.9C9.03,14.9 5.9,16.36 5.9,17V18.1H18.1V17C18.1,16.36 14.97,14.9 12,14.9Z"></path></svg>
          Mijn Zuiddrecht
        </a>
      </sc-if>
    </div>
  </div>
  <nav aria-label="Hoofdmenu" style="border-top: 1px solid #e6e9ee">
    <ul style="max-width: 1280px; margin: 0 auto; padding: 0 10px; list-style: none; display: flex; flex-wrap: wrap">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="7">
        <li><a href="{{ item.href }}" aria-current="{{ item.current }}" style="{{ item.style }}">{{ item.label }}</a></li>
      </sc-for>
    </ul>
  </nav>
  <div aria-hidden="true" style="display: flex; height: 5px">
    <span style="flex: 1; background: #cc0000"></span>
  </div>
  <sc-if value="{{ hasCrumbs }}" hint-placeholder-val="{{ true }}">
    <ol aria-label="Kruimelpad" style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 16px 24px 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 15px">
      <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="2">
        <li style="display: flex; align-items: center; gap: 4px"><sc-if value="{{ c.link }}" hint-placeholder-val="{{ true }}"><a href="{{ c.href }}">{{ c.label }}</a><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="#4a4a4a" style="flex: none"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path></svg></sc-if><sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><span aria-current="page" style="color: #4a4a4a">{{ c.label }}</span></sc-if></li>
      </sc-for>
    </ol>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"signedIn":{"editor":"boolean","default":false},"beheer":{"editor":"boolean","default":false},"active":{"editor":"text","default":"Home"},"crumbs":{"editor":null,"default":[]},"$preview":{"width":1440,"height":196}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const nav = [
      ['Home', 'Home.dc.html'], ['Wonen en leven', 'Contentpagina.dc.html'], ['Afval', 'Contentpagina.dc.html'],
      ['Parkeren', 'Contentpagina.dc.html'], ['Ondernemen', 'Contentpagina.dc.html'],
      ['Woo-publicaties', 'Zoeken.dc.html'], ['Bestuur en organisatie', 'Contentpagina.dc.html']
    ];
    const base = 'display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; border: 0; outline-offset: -2px; ';
    const items = nav.map(([label, href]) => {
      const on = label === active;
      return { label, href, current: on ? 'page' : 'false',
        style: base + (on ? 'color: #1a1a1a; font-weight: 700; position: relative; z-index: 1; box-shadow: 0 5px 0 #3669a5;' : 'color: #1a1a1a; font-weight: 500;') };
    });
    const raw = this.props.crumbs && this.props.crumbs.length ? this.props.crumbs : [];
    const crumbs = raw.map((c, i) => ({ ...c, link: i < raw.length - 1, last: i === raw.length - 1, href: c.href ?? 'Home.dc.html' }));
    const signedIn = this.props.signedIn === true;
    return { items, crumbs, hasCrumbs: crumbs.length > 1, signedIn, signedOut: !signedIn, beheer: !!this.props.beheer };
  }
}
</script>
</body>
</html>
