<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<sc-if value="{{ isFolded }}" hint-placeholder-val="{{ false }}">
<nav aria-label="Tasks, folded" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; width: 64px; box-sizing: border-box; min-height: 100%; padding: 8px 0 16px; display: flex; flex-direction: column; align-items: center; gap: 2px; background: #ffffff; border-right: 1px solid #e4e6ea">
  <button type="button" aria-label="Open views" aria-expanded="false" title="Open views" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
  <button type="button" aria-label="New work package" title="New work package" style="flex: none; width: 56px; height: 60px; margin: 6px 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 400 10px/12px 'Fira Sans', sans-serif"><span style="width: 42px; height: 42px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>New</button>
  <sc-for list="{{ rail }}" as="it" hint-placeholder-count="3">
    <a href="{{ it.href }}" aria-label="{{ it.label }}" title="{{ it.label }}" aria-current="{{ it.current }}" style="{{ it.style }}">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ it.icon }}"></path></svg>
      <span style="font-size: 10px; line-height: 12px; white-space: nowrap">{{ it.short }}</span>
    </a>
  </sc-for>
  <button type="button" aria-haspopup="menu" aria-label="Account: Olivia Brandt, olivia@northwind-projects.test" title="Olivia Brandt" style="flex: none; margin-top: auto; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; display: inline-flex; align-items: center; justify-content: center"><span style="width: 28px; height: 28px; border-radius: var(--sc-radius, 8px); background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; font-family: 'Fira Sans', system-ui, sans-serif">OB</span></button>
</nav>
</sc-if>
<sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}">
<nav aria-label="Tasks" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; width: {{ navWidth }}px; box-sizing: border-box; min-height: 100%; padding: 16px 12px; display: flex; flex-direction: column; gap: 18px; background: #ffffff; border-right: 1px solid #e4e6ea">
  <div style="display: flex; align-items: center; gap: 4px">
    <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New work package
    </button>
    <button type="button" aria-label="Fold views" aria-expanded="true" title="Fold views" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
  </div>
  <button type="button" aria-haspopup="menu" aria-label="Account: Olivia Brandt, olivia@northwind-projects.test" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 8px; border: 0; border-radius: var(--sc-radius, 8px); background: #f5f6f8; color: #1b1c1d; text-align: left; font-family: 'Fira Sans', system-ui, sans-serif">
    <span style="width: 28px; height: 28px; border-radius: 14px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">OB</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Olivia Brandt</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">olivia@northwind-projects.test</span></span>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg>
  </button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 1px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px 4px 10px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span><sc-if value="{{ g.hasAdd }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="{{ g.addLabel }}" title="{{ g.addLabel }}" style="flex: none; width: 26px; height: 26px; margin: -5px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></sc-if></div></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
          <sc-if value="{{ it.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg></sc-if>
          <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.label }}</span>
          <sc-if value="{{ it.hasCount }}" hint-placeholder-val="{{ false }}"><span style="{{ it.countStyle }}">{{ it.count }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; padding: 0 10px; font-size: 12px; color: #5e6168; line-height: 1.4">Synced with OpenProject 2 minutes ago</div>
</nav>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Board"},"folded":{"editor":"text","default":""},"width":{"editor":"text","default":""},"$preview":{"width":264,"height":945}}'>
class Component extends DCLogic {
  renderVals() {
    // Board, List and Gantt are views of the open project, switched in the project header. The Filters group is not per project,
    // so the project does not open a nested list here; its row takes the "contains the current page" style (canon: Navigation, nested)
    // while one of its views is open, and the active pair only when the project itself is the page.
    const given = this.props.active ?? 'Board';
    const viewOpen = ['Board', 'List', 'Gantt'].includes(given);
    const active = viewOpen ? 'Northwind rollout Lyon' : given;
    const isFolded = String(this.props.folded ?? '') === 'true';
    const isOpen = !isFolded;
    // Round 8: the open column can be dragged wider (boards-list-pane-resize); a board passes width="320" for that frame, the rest keeps 264.
    const navWidth = parseInt(this.props.width, 10) || 264;
    const I = {
      day: 'M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10',
      board: 'M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z',
      list: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      folder: 'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z',
      user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
      mail: 'M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6',
      calendar: 'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',
      flag: 'M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7',
      tag: 'M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82zM7 7h.01'
    };
    // [label, href, icon or null, count, options]
    const raw = [
      { title: '', items: [
        ['My day', 'TbMyDay.dc.html', I.day, 8, { strong: true }]
      ] },
      { title: 'Projects', items: [
        ['Northwind rollout Lyon', 'TbBoard.dc.html', I.folder, 9],
        ['Netzausbau Nord', '#', I.folder, 4],
        ['OpenProject core', '#', I.folder, 12]
      ] },
      { title: 'Filters', items: [
        ['Assigned to me', '#', I.user, 4],
        ['Created from mail', '#', I.mail, 2],
        ['Due this week', '#', I.calendar, 8],
        ['High priority', '#', I.flag, 1]
      ] },
      { title: 'Versions', items: [
        ['16.5', '#', I.tag],
        ['16.6', '#', I.tag]
      ] }
    ];
    // The 12 October column at rest: 34 px rows, 14 px text, counts as plain figures at the right.
    const base = 'display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 14px; line-height: 21px; ';
    const groups = raw.map((g) => ({
      title: g.title, hasTitle: !!g.title, hasAdd: !!g.add, addLabel: g.add ?? '',
      items: g.items.map(([label, href, icon, count, o]) => {
        o = o ?? {};
        const holds = label === active && viewOpen;
        const on = label === active && !holds;
        const soft = !on && !!o.current;
        return {
          label, href, icon: icon ?? '', hasIcon: !!icon,
          hasSwatch: false, swatch: '',
          hasCount: count !== undefined && count !== '', count: count ?? '',
          countStyle: 'flex: none; font-size: 12px; line-height: 1; min-width: 18px; text-align: right; ' + (o.strong ? 'font-weight: 700; color: ' + (on ? '#234a78' : '#1b1c1d') : 'color: #5e6168'),
          current: on ? 'page' : 'false',
          style: base + (on ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : holds ? 'color: #234a78; font-weight: 600;' : soft ? 'color: #1b1c1d; font-weight: 600;' : 'color: #1b1c1d; font-weight: 400;')
        };
      })
    }));
    // Folded rail: My day, the open project and the filters, a label each, no counts.
    const railBase = 'flex: none; width: 56px; height: 48px; box-sizing: border-box; border-radius: var(--sc-radius, 8px); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; ';
    const projectOn = raw[1].items.some(([label]) => label === active);
    const filterOn = raw[2].items.some(([label]) => label === active);
    const rail = [
      ['My day', 'My day', 'TbMyDay.dc.html', I.day, active === 'My day'],
      ['Project', 'Project: Northwind rollout Lyon', 'TbBoard.dc.html', I.folder, projectOn],
      ['Filters', 'Filters: Assigned to me, Created from mail, Due this week, High priority', '#', I.user, filterOn]
    ].map(([short, label, href, icon, on]) => ({
      label, href, icon, current: on ? 'page' : 'false',
      style: railBase + (on ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #3d4047;'),
      short
    }));
    return { groups, rail, isFolded, isOpen, navWidth };
  }
}
</script>
</body>
</html>
