<dc-import name="NcBeheerInstellingen" app="Dossiq" max-width="1240px" app-icon="M20,18H4V8H20M20,6H12L10,4H4C2.89,4 2,4.89 2,6V18A2,2 0 0,0 4,20H20A2,2 0 0,0 22,18V8C22,6.89 21.1,6 20,6Z" apps="{{ apps }}" title="Dossiq-beheer: systeem" section="Systeem" tabs="{{ tabs }}" scope="geldt voor de hele organisatie; zaaktypen, flows en afdelingen staan in de app onder Instellingen" sections="{{ sections }}" hint-size="100%,2400px"></dc-import>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2400}}'>
class Component extends DCLogic {
  renderVals() {

    const apps = ['Decidiq', 'Openregister', 'Pipelinq', 'Portaliq'];
    const tabs = [['Algemeen', ''], ['Systeem', ''], ['Integraties', '9'], ['Mail', ''], ['Kaartlagen', '4'], ['VTH', ''], ['Vervanging', ''], ['Geavanceerd', '']];
    const sections = [
      { name: 'Configuratie', help: true, desc: 'In welk register Dossiq zaken bewaart, en met welke schema\'s.', rows: [

      { name: 'Menustructuur', desc: 'Hoeveel het menu laat zien. Eenvoudig is de standaard.', rows: [

      ] },
      { name: 'Serviceaccount voor achtergrondtaken', desc: 'Het account waarmee Dossiq werkt als er niemand is ingelogd, zoals bij termijnbewaking en mail ophalen.', rows: [
        { text: 'Nextcloud-gebruikersnaam', value: 'svc-dossiq', action: 'Dit account gebruiken', hint: 'Het account wordt lid van de groep dossiq-background-service. Kies een account waarmee niemand inlogt.' }

      { name: 'Zaak-e-mail: gedeelde mailbox', desc: 'Mail aan zaken@zuiddrecht.nl komt binnen als zaak of bij een bestaande zaak.', rows: [
        { link: 'Uitleg tonen' },
        { pair: [{ label: 'Mailaccount voor intake', value: 'zaken@zuiddrecht.nl', select: true }, { label: 'Map', value: 'INBOX' }] },
        { pair: [{ label: 'Ophalen elke (seconden)', value: '300' }, { label: 'Berichten per keer', value: '50' }] },

      { name: 'AI-ondersteunde verwerking', desc: 'Samenvatten, classificeren en anonimiseren met een taalmodel dat jij kiest.', rows: [

        { buttons: [['Opslaan', 'primary']] }

    return { apps, tabs, sections };
