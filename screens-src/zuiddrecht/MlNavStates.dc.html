<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: navigation with mailboxes, folder menu and views</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.ml-views-open #mlnav-views{display:block!important}
.ml-views-open [aria-controls="mlnav-views"]>svg:last-child{transform:rotate(90deg)}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 5420px; padding: 28px 24px; display: grid; grid-template-columns: 400px 1fr 280px; grid-auto-rows: auto; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The mailbox switcher open from the account row: three accounts, one cannot connect and carries only the red marker; clicking it opens the reconnect dialog (e)</figcaption>
    <div style="position: relative; height: 945px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="264px,945px"></dc-import></div>
      <main style="flex: 1 1 0; min-width: 0; background: #f5f6f8"></main>
      <button type="button" aria-haspopup="menu" aria-expanded="true" aria-label="Switch mailbox, now Olivia Brandt, olivia@northwind-projects.test" style="position: absolute; left: 12px; top: 68px; width: 221px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 8px; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; box-shadow: 0 0 0 1px #3669a5 inset; color: #1b1c1d; text-align: left; font-family: 'Fira Sans', system-ui, sans-serif; z-index: 9">
        <span style="width: 28px; height: 28px; border-radius: 14px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none">OB</span>
        <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Olivia Brandt</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">olivia@northwind-projects.test</span></span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m18 15-6-6-6 6"></path></svg>
      </button>
      <div role="menu" aria-label="Your mailboxes" style="position: absolute; left: 12px; top: 116px; width: 360px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 10px 6px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Your mailboxes</span><span style="font-size: 12px; color: #5e6168">3 accounts</span></div>
        <a href="#" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; color: #1b1c1d; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 12h-6l-2 3h-4l-2-3H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg><span style="flex: 1 1 auto">All inboxes</span><span style="font-size: 12px; color: #5e6168; margin-right: 4px">one list across your accounts</span><span style="flex: none; font-size: 12px; line-height: 1; font-weight: 700; color: #1b1c1d">12</span></a>
        <span aria-hidden="true" style="height: 1px; margin: 4px 0; background: #e4e6ea"></span>
        <sc-for list="{{ accounts }}" as="a" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; border-radius: var(--sc-radius, 8px); {{ a.wrapStyle }}">
            <div role="menuitem" aria-current="{{ a.current }}" style="display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 6px 0 2px; box-sizing: border-box">
              <button type="button" aria-label="Drag to reorder: {{ a.name }}" title="Drag to reorder" style="flex: none; width: 22px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; cursor: grab"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01"></path></svg></button>
              <span style="width: 28px; height: 28px; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; flex: none; {{ a.avatar }}">{{ a.initials }}</span>
              <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ a.name }}</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ a.address }}</span></span>
              <sc-if value="{{ a.hasCount }}" hint-placeholder-val="{{ true }}"><span aria-label="{{ a.count }} unread" style="flex: none; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; font-size: 12px; font-weight: 700; line-height: 20px; text-align: center; background: #3669a5; color: #ffffff">{{ a.count }}</span></sc-if>
              <sc-if value="{{ a.warn }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#cc0000" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Cannot connect" title="Cannot connect. Open the reconnect dialog." style="flex: none"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg></sc-if>
            </div>
          </div>
        </sc-for>
        <span aria-hidden="true" style="height: 1px; margin: 4px 0; background: #e4e6ea"></span>
        <a href="MlSetupAccount.dc.html" role="menuitem" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; color: #1b1c1d; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 5v14M5 12h14"></path></svg>Add a mail account</a>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The menu of one folder, opened from the three dots on its row; Troubleshooting at its foot is a submenu that opens on its own (Show this folder in the list, Clear the local copy, Repair synchronisation). New folder is the plus beside FOLDERS</figcaption>
    <div style="position: relative; height: 945px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="264px,945px"></dc-import></div>
      <main style="flex: 1 1 0; min-width: 0; background: #f5f6f8"></main>
      <button type="button" aria-haspopup="menu" aria-expanded="true" aria-label="Folder actions for Customers" style="position: absolute; left: 175px; top: 412px; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: #e4e6ea; color: #1b1c1d; display: inline-flex; align-items: center; justify-content: center; z-index: 9"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
      <div role="menu" aria-label="Folder actions for Customers" style="position: absolute; left: 265px; top: 409px; width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 2px">
        <div style="padding: 4px 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Customers</div>
        <sc-for list="{{ folderMenu }}" as="m" hint-placeholder-count="10">
          <sc-if value="{{ m.divider }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="height: 1px; margin: 4px 0; background: #e4e6ea"></span></sc-if>
          <sc-if value="{{ m.item }}" hint-placeholder-val="{{ true }}">
            <button type="button" role="menuitem" aria-expanded="{{ m.expanded }}" style="{{ m.style }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ m.icon }}"></path></svg>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; text-align: left">{{ m.label }}</span>
              <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.hint }}</span>
              <sc-if value="{{ m.chevron }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ m.chev }}"></path></svg></sc-if>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The Views row opened: Starred, Mentions, Assigned to me and Unassigned, with Assigned to me open</figcaption>
    <div class="ml-views-open" style="position: relative; height: 945px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Assigned to me" hint-size="264px,945px"></dc-import></div>
      <main style="flex: 1 1 0; min-width: 0; background: #f5f6f8"></main>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; grid-column: 1 / -1">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;The outbox, opened from the sending toast: its two messages in the conversation list like any folder, the first one open with Send now, Undo and Delete</figcaption>
    <div style="height: 440px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Outbox" hint-size="264px,440px"></dc-import></div>
      <section aria-label="Messages waiting in the outbox" style="flex: 0 0 410px; width: 410px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-right: 1px solid #e4e6ea; overflow: hidden">
        <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
          <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Outbox</h2><span style="font-size: 13px; color: #5e6168; white-space: nowrap">2 messages waiting to be sent</span></div>
          <button type="button" aria-label="Sort conversations" aria-haspopup="menu" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path></svg></button>
        </div>
        <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{ pending }}" as="m" hint-placeholder-count="2">
            <li style="{{ m.style }}">
              <a href="#" aria-current="{{ m.on }}" style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 14px; color: #1b1c1d; text-decoration: none">
                <span style="flex: none; width: 32px; height: 32px; margin-top: 2px; border-radius: 16px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">OB</span>
                <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px">To {{ m.to }}</span><span style="flex: 1 1 auto"></span><span style="flex: none; font-size: 12px; color: #5e6168">{{ m.time }}</span></span>
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 600; color: #1b1c1d">{{ m.subject }}</span></span>
                  <span style="display: flex; align-items: center; gap: 6px; height: 20px"><span style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 11px; font-weight: 600; line-height: 1; color: #234a78; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2"></path></svg>Outbox</span><span style="flex: 1 1 auto; min-width: 0; font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.line }}</span></span>
                </span>
              </a>
            </li>
          </sc-for>
        </ol>
      </section>
      <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 34px">Re: Rollout plan phase 2, Lyon</h3>
          <div role="status" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14px; color: #1b1c1d">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #234a78"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2"></path></svg>
            <span>Sends in 2 minutes. Until then you can still change your mind.</span>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"></path></svg>Send now</button>
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Undo, back to drafts</button>
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Delete</button>
          </div>
        </div>
        <article aria-label="Message to Marc Dubois, waiting to be sent" style="margin: 12px 16px; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #234a78; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">OB</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">You</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">olivia@northwind-projects.test</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 09:41</span></div>
              <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Marc Dubois</span></div>
            </div>
          </div>
          <div style="padding: 12px 14px 14px 56px; display: flex; flex-direction: column; gap: 10px; color: #3d4047; font-size: 14px">
            <p style="margin: 0">Hi Marc,</p>
            <p style="margin: 0">Yes, the kick-off can move to the afternoon. I propose Monday 2 November, 14:00 to 16:00, at your office. I will update the invitation and the rollout plan.</p>
            <p style="margin: 0">Best regards,<br>Olivia</p>
          </div>
        </article>
      </main>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;The reconnect dialog, opened from the red marker on the account row in a: mail.posteo.test refused the sign-in at 06:48, and mail from that account is not shown until it connects</figcaption>
    <div style="position: relative; height: 420px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="264px,420px"></dc-import></div>
      <main style="flex: 1 1 0; min-width: 0; background: #f5f6f8"></main>
      <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.4); display: flex; align-items: flex-start; justify-content: center; padding-top: 48px">
        <form role="dialog" aria-modal="true" aria-labelledby="ml-reconnect-title" style="width: 352px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 20px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 8px 24px rgba(27,28,29,0.2)">
          <h2 id="ml-reconnect-title" style="margin: 0; font-size: 18px; font-weight: 700; line-height: 24px">Reconnect Olivia Brandt (private)</h2>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: #cc0000; font-weight: 600">Cannot connect. Enter the password again.</p>
          <label for="ml-reconnect-pw" style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #3d4047">Password for olivia.brandt@posteo.test<input id="ml-reconnect-pw" type="password" placeholder="Password" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>
          <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px">
