<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: month with work package bars and a milestone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 1000px; overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Month" hint-size="245px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
        <button type="button" style="flex: none; height: 30px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
        <div style="display: flex; gap: 2px; flex: none">
          <button type="button" aria-label="Previous month" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next month" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
        <h1 style="margin: 0 0 0 6px; font-size: 20px; font-weight: 600; line-height: 1.2; white-space: nowrap">October 2026</h1>
        <span style="flex: 1 1 auto"></span>
        <div role="group" aria-label="View" style="display: flex; gap: 6px; flex: none">
          <sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><a href="{{ v.href }}" aria-current="{{ v.current }}" style="{{ v.style }}">{{ v.label }}</a></sc-for>
        </div>
        <button type="button" aria-haspopup="menu" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; margin-left: 8px; padding: 0 8px 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>All projects<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
      <div style="flex: none; display: flex; height: 28px; border-bottom: 1px solid #e4e6ea">
        <sc-for list="{{ dow }}" as="d" hint-placeholder-count="7"><div style="flex: 1 1 0; display: flex; align-items: center; padding: 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5e6168">{{ d }}</div></sc-for>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column">
        <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="6">
          <div style="flex: 1 1 0; min-height: 0; position: relative; display: flex; border-bottom: 1px solid #e4e6ea">
            <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7">
              <div style="{{ d.style }}">
                <div style="display: flex; align-items: center; justify-content: space-between; height: 24px; padding: 0 4px 0 6px"><span style="{{ d.numStyle }}">{{ d.n }}</span><sc-if value="{{ d.hover }}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="New entry on Wednesday 28 October" aria-haspopup="menu" aria-expanded="true" style="width: 22px; height: 22px; border: 0; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></sc-if></div>
                <div style="{{ d.listStyle }}">
                  <sc-for list="{{ d.entries }}" as="e" hint-placeholder-count="2">
                    <a href="{{ e.href }}" style="{{ e.style }}">
                      <sc-if value="{{ e.milestone }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Milestone" style="flex: none; width: 9px; height: 9px; margin: 0 2px; background: #35c53f; transform: rotate(45deg)"></span></sc-if>
                      <sc-if value="{{ e.hasDot }}" hint-placeholder-val="{{ true }}"><span style="{{ e.dot }}"></span><span style="flex: none; color: #5e6168">{{ e.time }}</span></sc-if>
                      <span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; font-weight: {{ e.weight }}">{{ e.title }}</span>
                    </a>
                  </sc-for>
                  <sc-if value="{{ d.hasMore }}" hint-placeholder-val="{{ false }}"><a href="#" style="display: flex; align-items: center; height: 17px; padding: 0 4px; font-size: 11px; line-height: 17px; color: var(--sc-link, #3669a5); text-decoration: none; font-weight: 500">{{ d.more }} more</a></sc-if>
                </div>
                <sc-if value="{{ d.hover }}" hint-placeholder-val="{{ false }}">
                  <div role="menu" aria-label="New entry" style="position: absolute; top: 28px; left: 8px; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10">
                    <div style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Wednesday 28 October</div>
                    <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 500 13px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>New meeting</button>
                    <button type="button" role="menuitem" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #1b1c1d; font: 500 13px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>New work package</button>
                  </div>
                </sc-if>
              </div>
            </sc-for>
            <sc-for list="{{ w.bars }}" as="b" hint-placeholder-count="2">
              <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
                <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
                <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
                <span style="flex: none; color: #3d4047">{{ b.number }}</span>
                <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
                <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
              </a>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const CAL = { personal: '#3669a5', team: '#538b28', customers: '#ff9d2e' };
    const ROW = 144; // six rows fill the board
    const viewBase = 'display: inline-flex; align-items: center; height: 30px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font-size: 13px; font-weight: 600; text-decoration: none; white-space: nowrap; ';
    const views = [['Day', '#'], ['Week', 'ClWeek.dc.html'], ['Month', 'ClMonth.dc.html']].map(([label, href]) => ({
      label, href, current: label === 'Month' ? 'page' : 'false',
      style: viewBase + (label === 'Month' ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #3d4047;')
    }));
    const dow = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    // six rows, Monday 28 September to Sunday 8 November; [day number, month index] with 0 = Sep, 1 = Oct, 2 = Nov
    const rows = [
      [[28, 0], [29, 0], [30, 0], [1, 1], [2, 1], [3, 1], [4, 1]],
      [[5, 1], [6, 1], [7, 1], [8, 1], [9, 1], [10, 1], [11, 1]],
      [[12, 1], [13, 1], [14, 1], [15, 1], [16, 1], [17, 1], [18, 1]],
      [[19, 1], [20, 1], [21, 1], [22, 1], [23, 1], [24, 1], [25, 1]],
      [[26, 1], [27, 1], [28, 1], [29, 1], [30, 1], [31, 1], [1, 2]],
      [[2, 2], [3, 2], [4, 2], [5, 2], [6, 2], [7, 2], [8, 2]]
    ];
    // bars per row: [type, number, subject, lane, startCol, endCol, leftOpen, rightOpen]
    const EPIC = ['EPIC', '#57990', 'Release 16.5 scope'];
    const FEAT = ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout'];
    const BUG = ['BUG', '#58231', 'Gantt PDF export drops trailing columns, due'];
    const rowBars = [
      [[...EPIC, 0, 0, 6, false, true]],
      [[...EPIC, 0, 0, 6, true, true], [...FEAT, 1, 0, 6, false, true]],
      [[...EPIC, 0, 0, 6, true, true], [...FEAT, 1, 0, 6, true, true], [...BUG, 2, 2, 2, false, false]],
      [[...EPIC, 0, 0, 4, true, false], [...FEAT, 1, 0, 6, true, true]],
      [[...FEAT, 0, 0, 4, true, false]],
      []
    ];
    const lanes = rowBars.map((b) => b.reduce((m, x) => Math.max(m, x[3] + 1), 0));
    // meetings: key "month-day" -> [time, title, calendar]
    const specific = {
      '1-13': [['11:00', 'Demo preparation Malmo Energi', 'team']],
      '1-14': [['09:30', 'Release 16.5 scope review', 'team']],
      '1-15': [['14:00', 'Rollout review Lyon, phase 2', 'customers']],
      '1-16': [['17:00', 'Submit October hours', 'personal']]
    };
    const hidden = { '1-14': 2 };
    const entryBase = 'display: flex; align-items: center; gap: 5px; height: 17px; padding: 0 4px; border-radius: var(--sc-radius, 8px); font-size: 11px; line-height: 17px; color: #1b1c1d; text-decoration: none; white-space: nowrap; overflow: hidden; ';
    const dot = (c) => 'flex: none; width: 7px; height: 7px; border-radius: 4px; background: ' + c;
    const weeks = rows.map((days, ri) => {
      const top = 24 + lanes[ri] * 20 + 2;
      const room = Math.floor((ROW - top - 4) / 18);
      return {
        days: days.map(([n, m], ci) => {
          const key = m + '-' + n;
          const today = m === 1 && n === 12;
          const hover = m === 1 && n === 28;
          const weekend = ci >= 5;
          const other = m !== 1;
          let list = [];
          if (!weekend) list.push(['10:00', 'Stand-up', 'personal']);
          list = list.concat(specific[key] ?? []).sort((a, b) => a[0].localeCompare(b[0]));
          if (key === '2-2') list.unshift(['', 'Go-live Lyon phase 2', 'milestone']);
          const extra = hidden[key] ?? 0;
          const cap = extra ? room - 1 : room;
          const shown = list.slice(0, cap);
          const more = extra + (list.length - shown.length);
          return {
            n, today, hover,
            style: 'flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; border-left: 1px solid #e4e6ea; ' + (ci === 0 ? 'border-left: 0; ' : '') + (hover ? 'background: #eef0f3;' : weekend ? 'background: #f5f6f8;' : ''),
            numStyle: 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 3px; box-sizing: border-box; border-radius: 11px; font-size: 13px; ' + (today ? 'background: #3669a5; color: #ffffff; font-weight: 700;' : other ? 'color: #5e6168; opacity: 0.7;' : 'color: #1b1c1d; font-weight: 500;'),
            listStyle: 'display: flex; flex-direction: column; gap: 1px; margin-top: ' + (top - 24) + 'px; padding: 0 3px',
            entries: shown.map(([time, title, cal]) => ({
              time, title, href: title === 'Rollout review Lyon, phase 2' ? 'ClEvent.dc.html' : '#',
              milestone: cal === 'milestone', hasDot: cal !== 'milestone', dot: dot(CAL[cal] ?? '#5e6168'),
              weight: cal === 'milestone' ? 600 : 400,
              style: entryBase + (cal === 'milestone' ? 'color: #1b1c1d;' : '')
            })),
            hasMore: more > 0, more
          };
        }),
        bars: rowBars[ri].map(([type, number, subject, lane, s, e, leftOpen, rightOpen]) => {
          const c = TYPE[type];
          const left = leftOpen ? '-8px' : 'calc(100% * ' + s + ' / 7 + 3px)';
          const width = 'calc(100% * ' + (e - s + 1) + ' / 7' + (leftOpen ? ' + 8px' : ' - 3px') + (rightOpen ? ' + 8px' : ' - 4px') + ')';
          return {
            type, number, subject, color: c, leftOpen, rightOpen, aria: type + ' ' + number + ', ' + subject,
            style: 'position: absolute; top: ' + (24 + lane * 20) + 'px; left: ' + left + '; width: ' + width + '; height: 18px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border: 1px solid ' + c + '; border-radius: var(--sc-radius, 8px); background: color-mix(in srgb, ' + c + ' 14%, #ffffff); font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden; z-index: 1'
          };
        })
      };
    });
    return { views, dow, weeks };
  }
}
</script>
</body>
</html>
