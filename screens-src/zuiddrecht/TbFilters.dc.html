<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: board with the filter panel open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
input::placeholder{color:#5e6168;opacity:1}
#tb-filter::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2000px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The board with the filter panel open under the Filter button: tags are ticked here, managed in the project details</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" hint-size="245px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; position: relative; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">2 of 9 work packages shown</span></div>
        <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
          <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>
        </div>
        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Status. Choose assignee or version" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Status<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <div style="flex: 1 1 auto"></div>
        <button type="button" aria-pressed="true" aria-haspopup="dialog" aria-keyshortcuts="F" aria-expanded="true" aria-controls="tb-filter-panel" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter: 2</button>
        <div role="group" aria-label="Members" style="flex: none; display: flex; align-items: center">
          <span title="Olivia Brandt" aria-label="Olivia Brandt" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #eaf0f7; color: #234a78">OB</span>
          <span title="Tom Achterberg" aria-label="Tom Achterberg" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">TA</span>
          <span title="Priya Raman" aria-label="Priya Raman" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">PR</span>
          <span title="2 more members" aria-label="2 more members" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eef0f3; color: #3d4047">+2</span>
        </div>
        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for this project" style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      </div>
      <div role="group" aria-label="Active filters" style="flex: none; display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <span style="font-size: 13px; color: #5e6168; white-space: nowrap; margin-right: 4px">Filtered on</span>
        <sc-for list="{{ active }}" as="a" hint-placeholder-count="3"><span style="display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 8px 0 14px; border: 1px solid #1b1c1d; border-radius: 19px; background: #1b1c1d; color: #ffffff; font-size: 14px; font-weight: 600; white-space: nowrap"><sc-if value="{{ a.hasDot }}" hint-placeholder-val="{{ false }}"><span style="{{ a.dot }}"></span></sc-if>{{ a.label }}<button type="button" aria-label="{{ a.remove }}" style="width: 24px; height: 24px; border: 0; border-radius: 12px; background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span></sc-for>
        <button type="button" style="height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Clear all filters</button>
        
      </div>

      <div style="flex: 1 1 auto; min-height: 0; display: flex; gap: 10px; padding: 12px; overflow: hidden">
        <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
          <section aria-label="{{ col.name }}" style="flex: 0 0 226px; width: 226px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; align-self: flex-start; max-height: 100%">
            <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px">
              <span style="{{ col.dot }}"></span>
              <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.name }}</h2>
              <span aria-label="{{ col.countLabel }}" style="{{ col.countStyle }}">{{ col.count }}</span>
              <button type="button" aria-label="New work package with status {{ col.name }}" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
            </div>
            <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="2">
              <div aria-label="{{ c.aria }}" style="{{ c.style }}">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="{{ c.typeStyle }}">{{ c.type }}</span><span style="color: #3d4047">{{ c.number }}</span><span style="flex: 1 1 auto"></span><sc-if value="{{ c.high }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ff9d2e" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Priority high"><path d="m6 13 6-6 6 6M6 19l6-6 6 6"></path></svg></sc-if><sc-if value="{{ c.normal }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c4c7cb" stroke-width="2.25" stroke-linecap="round" role="img" aria-label="Priority normal"><path d="M6 10h12M6 14h12"></path></svg></sc-if></span>
                <a href="TbCard.dc.html" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d; text-decoration: none">{{ c.subject }}</a>
                <span role="group" aria-label="Tags. Click a tag on a card to filter on it" title="Click a tag on a card to filter on it" style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px"><sc-for list="{{ c.tags }}" as="t" hint-placeholder-count="2"><button type="button" aria-label="{{ t.aria }}" aria-pressed="{{ t.on }}" style="{{ t.style }}"><span style="{{ t.dot }}"></span>{{ t.name }}</button></sc-for></span>
                <sc-if value="{{ c.hasMail }}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 5px; font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">From mail: {{ c.mailFrom }}</span></span></sc-if>
                <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
                  <sc-if value="{{ c.hasAssignee }}" hint-placeholder-val="{{ true }}"><span title="{{ c.assignee }}" role="img" aria-label="Assignee {{ c.assignee }}" style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ c.initials }}</span></sc-if>
                  <sc-if value="{{ c.unassigned }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Unassigned" title="Unassigned" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 1.5px dashed #c4c7cb; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8"></path></svg></span></sc-if>
                  <span style="{{ c.dueStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{ c.due }}</span>
                </span>
              </div>
            </sc-for>
            <sc-if value="{{ col.isEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding: 10px 8px; font-size: 12px; color: #5e6168; line-height: 18px">{{ col.emptyText }}</div></sc-if>
          </section>
        </sc-for>
      </div>

      <div id="tb-filter-panel" role="dialog" aria-label="Filters" style="position: absolute; right: 16px; top: 60px; margin-top: 4px; width: 440px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: center; gap: 10px; padding: 4px 10px 8px; border-bottom: 1px solid #e4e6ea">
          <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Filters</h2>
          <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Press <kbd style="display: inline-block; min-width: 14px; padding: 0 5px; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: 4px; font: 600 11px 'Fira Sans', sans-serif; text-align: center; color: #3d4047">M</kbd> to show only your work packages</span>
          <span style="flex: 1 1 auto"></span>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Tags</span><span style="font-size: 12px; color: #5e6168">tick one or more, applied at once</span><span style="flex: 1 1 auto"></span><a href="#tags-tab" style="font-size: 12px; font-weight: 600; color: var(--sc-link, #3669a5); text-decoration: none; white-space: nowrap">Manage tags</a></div>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          <sc-for list="{{ tags }}" as="t" hint-placeholder-count="6">
            <li style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--sc-radius, 8px)">
              <button type="button" role="checkbox" aria-checked="{{ t.checked }}" aria-label="{{ t.filterLabel }}" style="{{ t.checkStyle }}"><sc-if value="{{ t.isOn }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button>
              <span style="{{ t.dot }}"></span>
              <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; color: #1b1c1d">{{ t.name }}</span>
              <span style="font-size: 12px; color: #5e6168; white-space: nowrap">{{ t.count }}</span>
            </li>
          </sc-for>
        </ul>
        <div style="padding: 2px 10px 8px; border-bottom: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 16px">Rename, recolour or delete a tag under Manage tags.</div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 2px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Assignee</span></div>
        <div role="radiogroup" aria-label="Assignee" style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; padding: 0 10px">
          <sc-for list="{{ assignees }}" as="a" hint-placeholder-count="6"><label style="display: flex; align-items: center; gap: 8px; height: 40px; font-size: 14px; color: #1b1c1d; white-space: nowrap"><span role="radio" aria-checked="{{ a.on }}" aria-label="{{ a.label }}" style="{{ a.style }}"></span><sc-if value="{{ a.hasAvatar }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 20px; height: 20px; border-radius: 10px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">{{ a.initials }}</span></sc-if><sc-if value="{{ a.isUnassigned }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: 1.5px dashed #c4c7cb"></span></sc-if>{{ a.label }}</label></sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 2px; border-top: 1px solid #e4e6ea; margin-top: 4px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Open or closed</span></div>
        <div role="radiogroup" aria-label="Open or closed" style="display: flex; align-items: center; gap: 6px; padding: 2px 10px 6px">
          <sc-for list="{{ states }}" as="s" hint-placeholder-count="3"><button type="button" role="radio" aria-checked="{{ s.on }}" style="{{ s.style }}">{{ s.label }}</button></sc-for>
          <span style="margin-left: 6px; font-size: 12px; color: #5e6168; line-height: 16px">Closed work packages are hidden while Open is chosen.</span>
        </div>

        <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 2px; border-top: 1px solid #e4e6ea"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Due date</span><span style="font-size: 12px; color: #5e6168">from and to, either can stay empty</span></div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 2px 10px 8px">
          <label for="tb-due-from" style="font-size: 14px; font-weight: 600">From</label>
          <input id="tb-due-from" type="text" placeholder="from" style="width: 118px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
          <label for="tb-due-to" style="font-size: 14px; font-weight: 600">to</label>
          <input id="tb-due-to" type="text" placeholder="to" style="width: 118px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
          <span style="flex: 1 1 auto"></span>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">This week</button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Overdue</button>
        </div>
      </div>
    </main>
  </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; align-self: flex-start">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Manage tags opens the Tags tab of the project details: rename, colour and delete a tag, add one, restore the six default tags. The mark Needs OpenProject means: works once OpenProject's API allows this change, drawn as we propose it</figcaption>
    <aside id="tags-tab" aria-label="Project details" style="width: 520px; height: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid #e4e6ea">
        <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Project details</span>
        <button type="button" aria-label="Close the project details" style="width: 32px; height: 32px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 12px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2000}}'>
class Component extends DCLogic {
  renderVals() {

    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'], 'closed': ['#dee2e6', '#adb5bd'] };
    const TAG = { Lyon: '#1c7ed6', Kassel: '#2f9e44', Customer: '#e67700', Internal: '#5e6168', Demo: '#862e9c', Training: '#0b7285' };
    const PEOPLE = { 'Tom Achterberg': 'TA', 'Olivia Brandt': 'OB', 'Priya Raman': 'PR' };
    const dotOf = (name, size) => 'flex: none; width: ' + size + 'px; height: ' + size + 'px; border-radius: ' + (size / 2) + 'px; background: ' + TAG[name];
    const tagBtn = 'display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--sc-radius, 8px); font: 400 11px \'Fira Sans\', sans-serif; white-space: nowrap; ';
    // [type, number, subject, status, assignee, due, tags, {from, high, overdue, week}]
    const data = [
      ['TASK', '#58441', 'Move kick-off to the afternoon', 'new', 'Olivia Brandt', '15 Oct', ['Lyon', 'Customer'], { from: 'Marc Dubois', week: true }],
      ['TASK', '#58440', 'Send OIDC client settings to Lyon', 'new', '', '16 Oct', ['Lyon'], { week: true }],
      ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout', 'in development', 'Tom Achterberg', '30 Oct', ['Lyon', 'Customer'], {}],
      ['FEATURE', '#58390', 'Single sign-on through Keycloak', 'in review', 'Tom Achterberg', '23 Oct', ['Lyon'], {}],
      ['BUG', '#58102', 'Folder link breaks on rename', 'on hold', 'Priya Raman', '9 Oct', ['Lyon', 'Customer'], { overdue: true }]
    ];
    const cardBase = 'display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; box-sizing: border-box; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; ';
    const cards = data.map(([type, number, subject, status, assignee, due, tags, o]) => ({
      type, number, subject, status, assignee, due, typeStyle: 'font-weight: 700; letter-spacing: 0.04em; color: ' + TYPE[type],
      aria: type + ' ' + number + ', ' + subject + ', ' + status, style: cardBase,
      high: !!o.high, normal: !o.high,
      hasMail: !!o.from, mailFrom: o.from ?? '',
      hasAssignee: !!assignee, unassigned: !assignee, initials: PEOPLE[assignee] ?? '',
      tags: tags.map((name) => ({ name, dot: dotOf(name, 8), on: name === 'Lyon' ? 'true' : 'false', aria: 'Filter by tag ' + name,
        style: tagBtn + (name === 'Lyon' ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #f0f1f3; background: #f0f1f3; color: #3d4047;') })),
      dueStyle: 'display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; ' + (o.overdue ? 'color: #ab0000; font-weight: 600' : o.week ? 'color: #1b1c1d; font-weight: 600' : 'color: #5e6168')
    }));
    const cols = [['new', 2, 3], ['in development', 1, 3], ['in review', 1, 2], ['on hold', 1, 1], ['closed', 0, 1]];
    const columns = cols.map(([name, count, total]) => {
      const st = STATUS[name];
      return {
        name, count: count + ' of ' + total + ' shown', countLabel: count + ' of ' + total + ' work packages shown',
        countStyle: 'flex: none; font-size: 12px; font-weight: 600; line-height: 20px; padding: 0 7px; border-radius: var(--sc-radius, 8px); white-space: nowrap; background: #ffffff; color: #5e6168; border: 1px solid #e4e6ea',
        dot: 'flex: none; width: 12px; height: 12px; box-sizing: border-box; border-radius: 6px; background: ' + st[0] + '; border: 1.5px solid ' + st[1],
        cards: cards.filter((c) => c.status === name),
        isEmpty: count === 0, emptyText: name === 'closed' ? 'Closed work packages are hidden by the state filter Open.' : 'Nothing matches here.'
      };
    });
    const chipBase = 'height: 34px; padding: 0 12px; border-radius: var(--sc-radius, 8px); font: 600 14px \'Fira Sans\', sans-serif; white-space: nowrap; ';
    const groupBy = ['Status', 'Assignee', 'Version'].map((label, i) => ({ label, on: i === 0 ? 'true' : 'false',
      style: chipBase + (i === 0 ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #3d4047;') }));
    const av = 'width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; ';
    const team = [['Olivia Brandt', 'OB'], ['Tom Achterberg', 'TA'], ['Priya Raman', 'PR'], ['2 more team members', '+2']].map(([name, initials], i) => ({
      name, initials, style: av + (i ? 'margin-left: -8px; ' : '') + (initials.startsWith('+') ? 'background: #eef0f3; color: #3d4047' : 'background: #eaf0f7; color: #234a78')
    }));
    const active = [
      { label: 'Tag: Lyon', remove: 'Remove the filter on tag Lyon', hasDot: true, dot: dotOf('Lyon', 8) },
      { label: 'Open', remove: 'Remove the filter Open, show closed too', hasDot: false, dot: '' }
    ];
    const checkBase = 'flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; padding: 0; ';
    const tags = [['Lyon', 5, true], ['Kassel', 2], ['Customer', 3, false, true], ['Internal', 2], ['Demo', 1], ['Training', 1]].map(([name, count, on, editing]) => ({
      name, count: count + (count === 1 ? ' work package' : ' work packages'), dot: dotOf(name, 10), checked: on ? 'true' : 'false', isOn: !!on, editing: !!editing,
      filterLabel: 'Filter on tag ' + name,
      checkStyle: checkBase + (on ? 'border: 1.5px solid #3669a5; background: #3669a5;' : 'border: 1.5px solid #c4c7cb; background: #ffffff;')
    }));
    const swatches = [['Orange', '#e67700', true], ['Blue', '#1c7ed6'], ['Green', '#2f9e44'], ['Teal', '#0b7285'], ['Purple', '#862e9c'], ['Pink', '#c2255c'], ['Brown', '#8f5f2a'], ['Grey', '#5e6168']].map(([name, hex, on]) => ({
      name, on: on ? 'true' : 'false',
      style: 'width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; background: ' + hex + '; border: 2px solid #ffffff; padding: 0; ' + (on ? 'box-shadow: 0 0 0 2px #3669a5;' : 'box-shadow: 0 0 0 1px #c4c7cb;')
    }));
    const radio = (on) => 'flex: none; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; ' + (on ? 'border: 5px solid #3669a5; background: #ffffff;' : 'border: 1.5px solid #c4c7cb; background: #ffffff;');
    const assignees = [['Anyone', '', true], ['Olivia Brandt, me', 'OB'], ['Tom Achterberg', 'TA'], ['Priya Raman', 'PR'], ['Unassigned', '']].map(([label, initials, on]) => ({
      label, initials, on: on ? 'true' : 'false', style: radio(!!on), hasAvatar: !!initials, isUnassigned: label === 'Unassigned'
    }));
    const states = [['Open', true], ['Closed'], ['Both']].map(([label, on]) => ({ label, on: on ? 'true' : 'false',
      style: chipBase + (on ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #3d4047;') }));
    const tabBase = 'display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 8px 12px; box-sizing: border-box; margin-bottom: -1px; border: 1px solid #c4c7cb; border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; font: 500 14px \'Fira Sans\', sans-serif; white-space: nowrap; ';
    const tabs = [['Members', 6, false], ['Tags', 6, true], ['Files and chats', 4, false], ['Deleted items', 4, false], ['Activity', '', false]].map(([label, count, on]) => ({
      label, count, hasCount: count !== '' && !!on, selected: on ? 'true' : 'false',
      style: tabBase + (on ? 'background: #ffffff; color: #1b1c1d; font-weight: 700; border-bottom: 1px solid #ffffff;' : 'background: #eef0f3; color: #3d4047;'),
      countStyle: 'font-size: 12px; font-weight: 600; line-height: 18px; padding: 0 6px; border-radius: var(--sc-radius, 8px); letter-spacing: 0; ' + (on ? 'background: #eaf0f7; color: #234a78' : 'background: #eef0f3; color: #5e6168')
    }));
    return { groupBy, team, active, columns, tags, swatches, assignees, states, tabs };
  }
