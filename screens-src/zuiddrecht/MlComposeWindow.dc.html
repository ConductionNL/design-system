<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: new message in a compose window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 5973px; padding: 0 0 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; min-width: 0">
    <div style="position: relative; height: 1013px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="264px,945px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="" hint-size="410px,945px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px; text-align: center">
            <span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; border: 1px solid #e4e6ea; display: inline-flex; align-items: center; justify-content: center; color: #5e6168; margin-bottom: 8px"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg></span>
            <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">Select a conversation</h2>
          </div>
        </main>
      </div>
      <section aria-label="Compose window: New message" style="position: absolute; right: 24px; bottom: 0; width: 680px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-bottom: 0; border-radius: var(--sc-radius-lg, 10px) var(--sc-radius-lg, 10px) 0 0; box-shadow: 0 -4px 16px rgba(27,28,29,0.16); z-index: 6">
        <div style="flex: none; display: flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 16px; background: #234a78; color: #ffffff; border-radius: var(--sc-radius-lg, 10px) var(--sc-radius-lg, 10px) 0 0">
          <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">New message</span>
          <sc-for list="{{ heads }}" as="h" hint-placeholder-count="4"><button type="button" aria-label="{{ h.label }}" title="{{ h.label }}" style="{{ headBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ h.icon }}"></path></svg></button></sc-for>
        </div>
        <div style="display: flex; flex-direction: column; font-size: 14px">
          <div style="{{ fieldRow }}">
            <label for="cw-to" style="flex: none; width: 56px; color: #5e6168">To</label>
            <span style="{{ chip }}"><span style="{{ chipAvatar }}">MD</span><button type="button" aria-expanded="false" aria-label="Contact details for Marc Dubois" style="{{ chipName }}">Marc Dubois</button><button type="button" aria-label="Remove Marc Dubois" style="{{ chipX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
            <span aria-label="Group Lyon project team, 4 members, every member receives this message" style="{{ chip }}"><span style="{{ chipAvatar }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Lyon project team<span style="font-size: 11px; color: #5e6168">4</span><button type="button" aria-label="Remove Lyon project team" style="{{ chipX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
            <input id="cw-to" type="text" aria-label="Add a recipient" aria-autocomplete="list" style="{{ fieldInput }}">
            <span style="flex: none; display: inline-flex; gap: 2px"><button type="button" aria-pressed="false" aria-label="Show the Cc row" style="{{ ccBtn }}">Cc</button><button type="button" aria-pressed="false" aria-label="Show the Bcc row" style="{{ ccBtn }}">Bcc</button></span>
          </div>
          <div style="{{ fieldRow }}"><label for="cw-subject" style="flex: none; width: 56px; color: #5e6168">Subject</label><input id="cw-subject" type="text" value="Kick-off Lyon phase 2 moves to the afternoon" style="{{ fieldInput }}"></div>
        </div>
        <div aria-label="Message body" role="textbox" aria-multiline="true" contenteditable="true" style="flex: 1 1 auto; min-height: 180px; overflow: hidden; padding: 12px 16px; font-size: 14px; line-height: 21px; color: #1b1c1d; outline: 0">
          <p style="margin: 0 0 10px">Hi Marc,</p>
          <p style="margin: 0 0 10px">Confirmed: the kick-off on Monday 2 November moves to 14:00 to 16:00 at your office. The agenda and the updated rollout plan follow this week, the OIDC settings come from Tom.</p>
          <p style="margin: 0">Best regards,<br>Olivia</p>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid #e4e6ea">
          <span style="display: inline-flex"><button type="button" style="{{ sendBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"></path></svg>Send</button><button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More ways to send" style="{{ sendMore }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button></span>
          <button type="button" aria-haspopup="menu" style="{{ attachBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ clip }}"></path></svg>Attach</button>
          <span style="flex: 1 1 auto"></span>
          <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Draft saved 09:41</span>
          <button type="button" aria-label="Discard this draft" style="{{ discardBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ trash }}"></path></svg>Discard</button>
        </div>
      </section>
    </div>
    <figcaption style="padding: 8px 24px 0; font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;A new message in a docked window, 680 px, over the inbox at the browse level. At rest it shows To, Subject, the text and the one composer foot: Send, Attach, Draft saved, Discard. A reply is the 440 px right panel, full screen takes the content column (MlComposeEditor).</figcaption>
  </figure>

  <div style="display: grid; grid-template-columns: 680px 680px; gap: 24px; padding: 0 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The recipient suggestions open while typing: from the address book first, then earlier correspondents</figcaption>
      <div style="height: 340px; box-sizing: border-box; display: flex; align-items: flex-start; padding: 12px 12px 0; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <section aria-label="Compose window: New message" style="{{ cropWin }}">
          <div style="{{ head }}"><span style="{{ headTitle }}">New message</span><sc-for list="{{ heads }}" as="h" hint-placeholder-count="4"><button type="button" aria-label="{{ h.label }}" title="{{ h.label }}" style="{{ headBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ h.icon }}"></path></svg></button></sc-for></div>
          <div style="position: relative; {{ fieldRow }}">
            <label for="cw-to-b" style="flex: none; width: 56px; color: #5e6168">To</label>
            <span style="{{ chip }}"><span style="{{ chipAvatar }}">MD</span><button type="button" aria-expanded="false" aria-label="Contact details for Marc Dubois" style="{{ chipName }}">Marc Dubois</button><button type="button" aria-label="Remove Marc Dubois" style="{{ chipX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
            <span style="display: inline-flex; align-items: center; height: 24px; color: #1b1c1d">jan<span aria-hidden="true" style="display: inline-block; width: 1px; height: 16px; margin-left: 1px; background: #1b1c1d"></span></span>
            <input id="cw-to-b" type="text" aria-label="Add a recipient" aria-expanded="true" aria-autocomplete="list" style="{{ fieldInput }}">
            <span style="flex: none; display: inline-flex; gap: 2px"><button type="button" aria-pressed="false" aria-label="Show the Cc row" style="{{ ccBtn }}">Cc</button><button type="button" aria-pressed="false" aria-label="Show the Bcc row" style="{{ ccBtn }}">Bcc</button></span>
            <div role="listbox" aria-label="Recipient suggestions for jan" style="position: absolute; left: 70px; top: 38px; margin-top: 4px; width: 420px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10">
              <sc-for list="{{ suggest }}" as="g" hint-placeholder-count="2">
                <div style="height: 26px; padding: 0 10px; display: flex; align-items: center; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: #5e6168">{{ g.label }}</div>
                <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
                  <div role="option" aria-selected="{{ r.on }}" style="{{ r.style }}">
                    <span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ r.initials }}</span>
                    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 16px"><span style="font-size: 13px; color: #1b1c1d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><mark style="background: #eaf0f7; color: inherit">Jan</mark>{{ r.rest }}</span><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.mail }}</span></span>
                    <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ r.why }}</span>
                  </div>
                </sc-for>
              </sc-for>
            </div>
          </div>
          <div style="{{ fieldRow }}"><label for="cw-subject-b" style="flex: none; width: 56px; color: #5e6168">Subject</label><input id="cw-subject-b" type="text" value="Kick-off Lyon phase 2 moves to the afternoon" style="{{ fieldInput }}"></div>
          <div aria-hidden="true" style="height: 40px; padding: 12px 16px; font-size: 14px; color: #1b1c1d">Hi Marc,</div>
        </section>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The contact card of a recipient, opened from the chip: the same head and actions as the sender card in the reading pane</figcaption>
      <div style="height: 340px; box-sizing: border-box; display: flex; align-items: flex-start; padding: 12px 12px 0; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <section aria-label="Compose window: New message" style="{{ cropWin }}">
          <div style="{{ head }}"><span style="{{ headTitle }}">New message</span><sc-for list="{{ heads }}" as="h" hint-placeholder-count="4"><button type="button" aria-label="{{ h.label }}" title="{{ h.label }}" style="{{ headBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ h.icon }}"></path></svg></button></sc-for></div>
          <div style="position: relative; {{ fieldRow }}">
            <label for="cw-to-c" style="flex: none; width: 56px; color: #5e6168">To</label>
            <span style="{{ chip }}"><span style="{{ chipAvatar }}">MD</span><button type="button" aria-expanded="true" aria-label="Contact details for Marc Dubois" style="{{ chipName }}">Marc Dubois</button><button type="button" aria-label="Remove Marc Dubois" style="{{ chipX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
            <span aria-label="Group Lyon project team, 4 members, every member receives this message" style="{{ chip }}"><span style="{{ chipAvatar }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>Lyon project team<span style="font-size: 11px; color: #5e6168">4</span><button type="button" aria-label="Remove Lyon project team" style="{{ chipX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
            <input id="cw-to-c" type="text" aria-label="Add a recipient" aria-autocomplete="list" style="{{ fieldInput }}">
            <span style="flex: none; display: inline-flex; gap: 2px"><button type="button" aria-pressed="false" aria-label="Show the Cc row" style="{{ ccBtn }}">Cc</button><button type="button" aria-pressed="false" aria-label="Show the Bcc row" style="{{ ccBtn }}">Bcc</button></span>
            <div role="dialog" aria-label="Contact details for Marc Dubois" style="position: absolute; left: 70px; top: 38px; width: 340px; box-sizing: border-box; padding: 14px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 8px; line-height: 18px">
              <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">About this recipient</div>
              <div style="display: flex; align-items: center; gap: 10px"><span style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">MD</span><span style="display: flex; flex-direction: column; min-width: 0"><strong style="font-size: 14px; color: #1b1c1d">Marc Dubois</strong><span style="font-size: 12px; color: #5e6168">Project lead, Ville de Lyon</span></span></div>
              <div style="display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: #3d4047">
                <span style="display: flex; gap: 8px"><span style="flex: none; width: 50px; color: #5e6168">Mail</span><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">marc.dubois@mairie-lyon.fr</a></span>
                <span style="display: flex; gap: 8px"><span style="flex: none; width: 50px; color: #5e6168">Phone</span><span>+33 4 72 10 30 30</span></span>
                <span style="display: flex; gap: 8px"><span style="flex: none; width: 50px; color: #5e6168">Mail</span><span>6 conversations, last one today 06:00</span></span>
                <span style="display: flex; gap: 8px"><span style="flex: none; width: 50px; color: #5e6168">Linked</span><span style="display: inline-flex; align-items: center; gap: 6px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span></span></span>
              </div>
              <div style="display: flex; gap: 8px; margin-top: 2px"><a href="#" style="{{ smallBtnA }}">Open contact</a><a href="#" style="{{ smallBtnA }}">Earlier mail</a><button type="button" style="{{ smallBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 9h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy address</button></div>
            </div>
          </div>
          <div style="{{ fieldRow }}"><label for="cw-subject-c" style="flex: none; width: 56px; color: #5e6168">Subject</label><input id="cw-subject-c" type="text" value="Kick-off Lyon phase 2 moves to the afternoon" style="{{ fieldInput }}"></div>
          <div aria-hidden="true" style="height: 40px; padding: 12px 16px; font-size: 14px; color: #1b1c1d">Hi Marc,</div>
        </section>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;The Attach menu, open from the Attach button in the foot: from this computer, or from Files</figcaption>
      <div style="height: 260px; box-sizing: border-box; display: flex; align-items: flex-end; padding: 12px 12px 0; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <section aria-label="Compose window: New message, lower part" style="{{ cropLower }}">
          <div style="height: 100px; padding: 12px 16px 0; font-size: 14px; line-height: 21px; color: #1b1c1d"><p style="margin: 0 0 10px">The agenda and the updated rollout plan follow this week, the OIDC settings come from Tom.</p><p style="margin: 0">Best regards,<br>Olivia</p></div>
          <div style="position: relative; display: flex; align-items: center; gap: 8px; padding: 10px 14px 12px; border-top: 1px solid #e4e6ea">
            <span style="display: inline-flex"><button type="button" style="{{ sendBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4ZM22 2 11 13"></path></svg>Send</button><button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More ways to send" style="{{ sendMore }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button></span>
            <span style="position: relative; display: inline-flex"><button type="button" aria-haspopup="menu" aria-expanded="true" style="{{ attachBtnOn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ clip }}"></path></svg>Attach</button>
              <div role="menu" aria-label="Attach" style="position: absolute; left: calc(100% + 8px); bottom: 0; width: 300px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 2px">
                <button type="button" role="menuitem" style="{{ menuItem }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg><span style="flex: 1 1 auto">From this computer</span></button>
                <button type="button" role="menuitem" style="{{ menuItem }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span style="flex: 1 1 auto">From Files</span></button>
              </div></span>
            <span style="flex: 1 1 auto"></span>
            <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Draft saved 09:41</span>
            <button type="button" aria-label="Discard this draft" style="{{ discardBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ trash }}"></path></svg>Discard</button>
          </div>
        </section>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;The send menu of the split Send button, open upward over the text: Send and archive (the conversation leaves the inbox), Send later (tomorrow 09:00, or a picked time). The same button in every compose frame.</figcaption>
