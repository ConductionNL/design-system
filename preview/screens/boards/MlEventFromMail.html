="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span><span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 4px; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 13px; white-space: nowrap"><span style="flex: none; width: 20px; height: 20px; border-radius: 10px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">PR</span>Priya Raman<button type="button" aria-label="Remove Priya Raman" style="flex: none; width: 20px; height: 20px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-muted, #5e6168); display: inline-flex; align-items: center; justify-content: center"><svg width="12" height="12" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>

              <input type="text" aria-label="Add a person" placeholder="Add a person by name or address" style="width: 100%; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">

              <label style="display: flex; align-items: flex-start; gap: 10px; padding: 4px 0; font-size: 14px; line-height: 20px"><input type="radio" name="ml-inv-send" checked style="flex: none; width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--sc-primary, #3669a5)"><span>Send as an invitation</span></label>

              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Create event and send</button>
