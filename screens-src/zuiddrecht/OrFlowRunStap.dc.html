<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Flow: stap in een uitvoering</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<aside data-or-flow="runstap" aria-label="Deze stap" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 12px; box-shadow: 0 4px 16px rgba(27,28,29,0.12); display: flex; flex-direction: column">
  <div role="tablist" aria-label="Logs" style="display: flex; gap: 4px; padding: 12px 14px 0; border-bottom: 1px solid #d6d9de; background: #f5f6f8; border-radius: 12px 12px 0 0">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2"><button type="button" role="tab" aria-selected="{{ t.sel }}" style="{{ t.style }}">{{ t.label }}<span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: #e4e6ea; color: #3d4047; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{ t.count }}</span></button></sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px 18px">
    <div style="display: flex; align-items: flex-start; gap: 10px">
      <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #5e6168">{{ kind }}</span>
        <h2 style="margin: 0; font-size: 17px; font-weight: 700; line-height: 1.25">{{ title }}</h2>
        <span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="{{ outcomeStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ outcomeIcon }}"></path></svg>{{ outcome }}</span><span style="font-size: 13px; color: #5e6168">{{ when }}</span></span>
      </div>
      <button type="button" aria-label="Zijpaneel sluiten" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: 17px; background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"></path></svg></button>
    </div>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{ log }}" as="l" hint-placeholder-count="4">
        <li style="display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; align-items: center; font-size: 13px"><span style="{{ l.pill }}">{{ l.level }}</span><span style="color: #5e6168; font-variant-numeric: tabular-nums">{{ l.when }}</span><span style="grid-column: 1 / -1; line-height: 1.4">{{ l.msg }}</span></li>
      </sc-for>
    </ul>
    <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ true }}"><div role="note" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #f5f6f8; color: #3d4047"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z"></path></svg><span style="font-size: 13px; line-height: 1.45">{{ note }}</span></div></sc-if>
    <sc-if value="{{ hasReached }}" hint-placeholder-val="{{ false }}">
    <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid #eef0f3">
      <h3 style="margin: 0; font-size: 14px; font-weight: 700">Wie deze stap bereikte</h3>
      <sc-for list="{{ reached }}" as="r" hint-placeholder-count="2"><span style="display: flex; justify-content: space-between; gap: 8px; font-size: 13px"><span>{{ r.who }}</span><span style="{{ r.pill }}">{{ r.state }}</span></span></sc-for>
    </div>
    </sc-if>
    <div style="margin-top: auto; display: flex; justify-content: space-between; gap: 8px; padding-top: 12px; border-top: 1px solid #eef0f3">
      <a href="{{ editHref }}" style="display: inline-flex; align-items: center; height: 36px; padding: 0 12px; border-radius: 8px; font-size: 14px; font-weight: 600; text-decoration: none; color: #3669a5">Deze stap bewerken</a>
      <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border: 1px solid #828a95; border-radius: 8px; background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8,5.14V19.14L19,12.14L8,5.14Z"></path></svg>Afspelen op het canvas</button>
    </div>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"tabs":{"editor":null,"default":[["Deze stap",4,true],["Logs van de hele uitvoering",11,false]]},"kind":{"editor":"text","default":"Bericht · E-mail sturen"},"title":{"editor":"text","default":"Melder bevestigen"},"level":{"editor":"text","default":"warning"},"when":{"editor":"text","default":"gestart 10:12:02.380 · duurde 96 ms"},"log":{"editor":null,"default":[["Info","10:12:02.380","E-mailadres opzoeken van de melder op MOR-2026-04812."],["Waarschuwing","10:12:02.441","De melder heeft geen e-mailadres opgegeven."],["Info","10:12:02.452","Niets verstuurd; de beoordeling gaat gewoon door."],["Waarschuwing","10:12:02.476","Stap klaar met een waarschuwing. Doorgaan bij fout staat aan, dus de uitvoering ging door."]]},"note":{"editor":"text","default":"Doorgaan bij fout staat aan voor deze stap, dus de uitvoering ging door naar de volgende stap."},"reached":{"editor":null,"default":[]},"editHref":{"editor":"text","default":"OrFlow.dc.html"},"$preview":{"width":372,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const J = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return d; } } return v; };
    const C = { Geslaagd: ['#e7f3ea', '#1e6b2a'], Waarschuwing: ['#fff4de', '#7a4f00'], Info: ['#eaf0f7', '#234a78'], Mislukt: ['#fcedec', '#a30000'], Wacht: ['#e3f1f3', '#1d5e66'], Bezig: ['#eaf0f7', '#234a78'], Bezorgd: ['#e7f3ea', '#1e6b2a'], Overgeslagen: ['#f0f1f3', '#3d4047'] };
    const pill = (lv) => { const c = C[lv] || ['#f0f1f3', '#3d4047']; return 'display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; font-weight: 700; background: ' + c[0] + '; color: ' + c[1]; };
    const OUT = { success: ['Geslaagd', 'M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z'], warning: ['Waarschuwing', 'M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16'], info: ['Info', 'M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z'], alert: ['Mislukt', 'M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z'], waiting: ['Wacht', 'M6,2V8H6V8L10,12L6,16V16H6V22H18V16H18V16L14,12L18,8V8H18V2H6M16,16.5V20H8V16.5L12,12.5L16,16.5M12,11.5L8,7.5V4H16V7.5L12,11.5Z'], running: ['Bezig', 'M8,5.14V19.14L19,12.14L8,5.14Z'] };
    const o = OUT[p.level] || OUT.info;
    const tbase = "display: inline-flex; align-items: center; gap: 6px; box-sizing: border-box; min-height: 34px; padding: 8px 10px; margin-bottom: -1px; border: 1px solid #d6d9de; border-bottom: none; border-radius: 8px 8px 0 0; font: 400 13px 'Fira Sans', sans-serif; color: #1b1c1d; background: #eceef1; cursor: pointer; white-space: nowrap;";
    const tabs = J(p.tabs, []).map((t) => ({ label: t[0], count: t[1], sel: t[2] ? 'true' : 'false', style: t[2] ? tbase + ' background: #ffffff; border-bottom: 1px solid #ffffff; font-weight: 700;' : tbase }));
    const log = J(p.log, []).map((l) => ({ level: l[0], when: l[1], msg: l[2], pill: pill(l[0]) }));
    const reached = J(p.reached, []).map((r) => ({ who: r[0], state: r[1], pill: pill(r[1]) }));
    return {
      tabs, kind: p.kind, title: p.title, outcome: o[0], outcomeIcon: o[1], when: p.when,
      outcomeStyle: pill(o[0]) + '; display: inline-flex; align-items: center; gap: 5px',
      log, hasNote: !!p.note, note: p.note, hasReached: reached.length > 0, reached, editHref: p.editHref || '#',
    };
  }
}
</script>
</body>
</html>
