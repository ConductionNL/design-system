<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };

    const scope = [['Northwind rollout Lyon', true], ['Open only', true], ['Assigned to me', false]].map(([label, on]) => ({ label, on: on ? 'true' : 'false', style: chipBase + (on ? 'border: 1px solid #3669a5; background: #eaf0f7; color: #234a78;' : 'border: 1px solid #c4c7cb; background: #ffffff; color: #3d4047;') }));
    const item = 'display: flex; align-items: center; gap: 10px; width: 100%; height: 44px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); font-family: \'Fira Sans\', system-ui, sans-serif; color: #1b1c1d; ';
    const results = [
      ['TASK', '#58301', 'Quote for project lead ', 'training', ' Kassel', 'needs clarification', 'Olivia Brandt, created from the mail of Jana Köhler', true],
      ['TASK', '#58470', 'Plan the ', 'training', ' day for the Lyon project leads', 'new', 'Tom Achterberg, due 29 Oct', false]
    ].map(([type, number, pre, hit, post, status, hint, selected]) => ({ type, number, pre, hit, post, status, hint, typeColor: TYPE[type], dot: dot(status), selected: selected ? 'true' : 'false', style: item + (selected ? 'background: #eaf0f7;' : 'background: transparent;') }));
    return { chat, tabsA, tabsB, selects, previews, scope, results };
  }
