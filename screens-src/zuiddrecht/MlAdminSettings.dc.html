<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: general settings, directory and account templates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2400px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Settings, tab General: defaults for new users, server configuration, storage, language model, product features and custom fields</figcaption>
    <div style="height: 830px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
      <dc-import name="MlHeader" app="Administration" placeholder="Search settings, domains or people" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Settings" hint-size="264px,774px"></dc-import></div>
        <main style="{{ main }}">
          <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 32px">Settings</h1>
            <p style="margin: 0; color: #3d4047">What holds for the whole mail server: defaults for new people, limits, who may sign in, the services mail is connected to, and the templates that create accounts per domain.</p>
          </div>
          <div role="tablist" aria-label="Settings" style="{{ tablist }}">
            <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">General</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">People and sign-in</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Connected services</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Account templates</button>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px 24px; align-items: start">
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Defaults for new users</h3>
                <p style="{{ hint }}">What a person gets until they choose otherwise in their own settings.</p>
                <div style="{{ switchRow }}">
                  <label for="ml-set-own" style="{{ switchLabel }}"><span style="font-weight: 500">People may add their own mail accounts</span><span style="{{ hint }}">Off means only accounts from a template or made by an administrator.</span></label>
                  <button id="ml-set-own" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
                <div style="{{ switchRow }}">
                  <label for="ml-set-imp" style="{{ switchLabel }}"><span style="font-weight: 500">Sort by importance for new users</span><span style="{{ hint }}">Important mail comes first in the inbox.</span></label>
                  <button id="ml-set-imp" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
                <fieldset style="{{ fieldset }}">
                  <legend style="{{ legend }}">Default conversation view</legend>
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-conv" checked style="{{ radio }}"><span>Group messages into conversations</span></label>
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-conv" style="{{ radio }}"><span>Show every message on its own</span></label>
                </fieldset>
              </section>
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Storage</h3>
                <div style="{{ fieldRow }}"><label for="ml-set-quota" style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px">Standard quota for everyone</span><span style="{{ hint }}">A domain or a person can get another limit.</span></label><input id="ml-set-quota" type="text" value="10 GB per mailbox" style="{{ inputShort }}"></div>
              </section>
            </div>
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Server configuration</h3>
                <p style="{{ hint }}">Limits and timing for every connection this server makes.</p>
                <div style="{{ fieldRow }}"><label for="ml-set-att" style="font-size: 13px">Largest attachment</label><input id="ml-set-att" type="text" value="25 MB" style="{{ inputShort }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-timeout" style="font-size: 13px">Connection timeout</label><input id="ml-set-timeout" type="text" value="30 seconds" style="{{ inputShort }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-cert" style="font-size: 13px">Check server certificates</label><button id="ml-set-cert" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button></div>
                <div style="{{ fieldRow }}"><label for="ml-set-sync" style="font-size: 13px">Sync interval</label><button id="ml-set-sync" type="button" aria-haspopup="listbox" style="{{ chooser }}"><span>Every 5 minutes</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div>
              </section>
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Language model features</h3>
                <div style="{{ switchRow }}">
                  <label for="ml-set-ai" style="{{ switchLabel }}"><span style="font-weight: 500">Language model features for the whole server</span><span style="{{ hint }}">Summaries, suggested replies and the assistant. Off hides them for everyone.</span></label>
                  <button id="ml-set-ai" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
                </div>
              </section>
            </div>
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Product features</h3>
                <p style="{{ hint }}">Switch features on or off for this installation.</p>
                <table style="width: 100%; border-collapse: collapse; font-size: 13px">
                  <tbody>
                    <sc-for list="{{ features }}" as="f" hint-placeholder-count="5">
                      <tr style="height: 36px; border-top: 1px solid #e4e6ea"><td style="padding: 0 4px">{{ f.name }}</td><td style="padding: 0 4px; color: #5e6168; font-size: 12px">{{ f.hint }}</td><td style="padding: 0 4px; text-align: right"><button type="button" role="switch" aria-checked="{{ f.checked }}" aria-label="{{ f.name }}" style="{{ f.switch }}"><span style="{{ f.knob }}"></span></button></td></tr>
                    </sc-for>
                  </tbody>
                </table>
              </section>
              <section style="{{ card }}">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="{{ h3 }}">Custom fields</h3><button type="button" style="{{ btnSmall }}">Add field</button></div>
                <p style="{{ hint }}">Extra fields on every person and every domain, shown on their pages and in exports.</p>
                <table style="width: 100%; border-collapse: collapse; font-size: 13px">
                  <thead><tr style="height: 28px"><th scope="col" style="{{ thSmall }}">Field</th><th scope="col" style="{{ thSmall }}">On</th><th scope="col" style="{{ thSmall }}">Kind</th></tr></thead>
                  <tbody>
                    <sc-for list="{{ fields }}" as="f" hint-placeholder-count="3">
                      <tr style="height: 36px; border-top: 1px solid #e4e6ea"><td style="padding: 0 4px; font-weight: 500">{{ f.name }}</td><td style="padding: 0 4px; color: #3d4047">{{ f.on }}</td><td style="padding: 0 4px; color: #3d4047">{{ f.kind }}</td></tr>
                    </sc-for>
                  </tbody>
                </table>
              </section>
            </div>
          </div>
        </main>
      </div>
    </div>
  </figure>

  <div style="display: flex; gap: 24px; align-items: flex-start">
    <figure style="margin: 0; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Tab People and sign-in: administrators, the company directory, admitted groups, Google and Microsoft sign-in</figcaption>
      <div style="height: 660px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <main style="{{ main }}">
          <div role="tablist" aria-label="Settings" style="{{ tablist }}">
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">General</button>
            <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">People and sign-in</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Connected services</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Account templates</button>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px 32px; align-items: start">
            <div style="{{ col }}">
              <section style="{{ card }}">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><h3 style="{{ h3 }}">Administrators of this server</h3><button type="button" style="{{ btnSmall }}">Add administrator</button></div>
                <table style="width: 100%; border-collapse: collapse; font-size: 13px">
                  <thead><tr style="height: 28px"><th scope="col" style="{{ thSmall }}">Person</th><th scope="col" style="{{ thSmall }}">Administers</th><th scope="col" style="width: 60px"></th></tr></thead>
                  <tbody>
                    <sc-for list="{{ admins }}" as="a" hint-placeholder-count="2">
                      <tr style="height: 40px; border-top: 1px solid #e4e6ea"><td style="padding: 0 4px"><span style="font-weight: 500">{{ a.name }}</span><span style="color: #5e6168"> · {{ a.mail }}</span></td><td style="padding: 0 4px; color: #3d4047">{{ a.scope }}</td><td style="padding: 0 4px; text-align: right"><button type="button" style="{{ btnSmall }}">Remove</button></td></tr>
                    </sc-for>
                  </tbody>
                </table>
              </section>
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Admitted groups</h3>
                <p style="{{ hint }}">Only members of these directory groups may sign in to mail. Everyone else in the directory is refused.</p>
                <div style="display: flex; flex-wrap: wrap; gap: 6px; align-items: center">
                  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3"><span style="{{ chip }}">{{ g.name }}<span style="font-weight: 400; color: #5e6168">{{ g.count }}</span></span></sc-for>
                  <button type="button" style="{{ btnSmall }}">Add group</button>
                </div>
              </section>
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Sign in with Google</h3>
                <p style="{{ hint }}">One client for all users, so a person can add a Google mailbox without a client of their own.</p>
                <div style="{{ fieldRow }}"><label for="ml-set-gid" style="font-size: 13px">Google client id</label><input id="ml-set-gid" type="text" value="483920117-nwp.apps.googleusercontent.com" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-gsec" style="font-size: 13px">Client secret</label><input id="ml-set-gsec" type="password" value="xxxxxxxxxxxxxxxxxxxxxxxx" style="{{ inputWide }}"></div>
              </section>
            </div>
            <div style="{{ col }}">
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Where people come from</h3>
                <fieldset style="{{ fieldsetPlain }}">
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-src" style="{{ radio }}"><span>A local list of people, kept here</span></label>
                  <label style="{{ radioRow }}"><input type="radio" name="ml-set-src" checked style="{{ radio }}"><span>The company directory (LDAP, the standard directory lookup)</span></label>
                </fieldset>
                <div style="{{ fieldRow }}"><label for="ml-set-ldap" style="font-size: 13px">Directory address</label><input id="ml-set-ldap" type="text" value="ldaps://directory.northwind-projects.test" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-base" style="font-size: 13px">Start looking at</label><input id="ml-set-base" type="text" value="ou=people,dc=northwind,dc=test" style="{{ inputWide }}"></div>
                <div style="display: flex; align-items: center; gap: 10px"><button type="button" style="{{ btnSecondary }}">Test lookup</button><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3d4047"><span style="{{ dotOk }}"></span>Found 61 people and 3 groups, today 07:00</span></div>
              </section>
              <section style="{{ card }}">
                <h3 style="{{ h3 }}">Sign in with Microsoft</h3>
                <div style="{{ fieldRow }}"><label for="ml-set-mid" style="font-size: 13px">Microsoft client id</label><input id="ml-set-mid" type="text" value="6f1c2a8e-4b7d-4c3a-9e21-northwind" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-msec" style="font-size: 13px">Client secret</label><input id="ml-set-msec" type="password" value="xxxxxxxxxxxxxxxxxxxxxxxx" style="{{ inputWide }}"></div>
                <div style="{{ fieldRow }}"><label for="ml-set-tenant" style="font-size: 13px">Microsoft tenant</label><input id="ml-set-tenant" type="text" value="northwindprojects.onmicrosoft.com" style="{{ inputWide }}"></div>
              </section>
            </div>
          </div>
        </main>
      </div>
    </figure>

    <figure style="margin: 0; flex: 0 0 480px; width: 480px; display: flex; flex-direction: column; gap: 8px">
      <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Tab Connected services: calendar, file storage and document chat</figcaption>
      <div style="height: 660px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <main style="{{ main }}">
          <div role="tablist" aria-label="Settings" style="{{ tablist }}">
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">General</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">People and sign-in</button>
            <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">Connected services</button>
          </div>
          <div style="{{ col }}">
            <section style="{{ card }}">
              <h3 style="{{ h3 }}">Calendar</h3>
              <div style="{{ switchRow }}">
                <label for="ml-set-cal" style="{{ switchLabel }}"><span style="font-weight: 500">Connect a CalDAV calendar to each mailbox</span><span style="{{ hint }}">CalDAV is the standard that calendars share appointments with. Invitations in mail land in the person's calendar.</span></label>
                <button id="ml-set-cal" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
              <div style="{{ fieldRow }}"><label for="ml-set-caldav" style="font-size: 13px">Calendar address</label><input id="ml-set-caldav" type="text" value="https://calendar.northwind-projects.test/caldav" style="{{ inputWide }}"></div>
            </section>
            <section style="{{ card }}">
              <h3 style="{{ h3 }}">File storage</h3>
              <div style="{{ switchRow }}">
                <label for="ml-set-files" style="{{ switchLabel }}"><span style="font-weight: 500">Use the suite file storage for attachments</span><span style="{{ hint }}">Attachments can be saved to and picked from the shared files of the workspace.</span></label>
                <button id="ml-set-files" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
            </section>
            <section style="{{ card }}">
              <h3 style="{{ h3 }}">Document chat</h3>
              <div style="{{ switchRow }}">
                <label for="ml-set-chat" style="{{ switchLabel }}"><span style="font-weight: 500">Make mail available to the document chat assistant</span><span style="{{ hint }}">A person can then ask the assistant about their own mail. Nobody else's mail is read.</span></label>
                <button id="ml-set-chat" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
            </section>
          </div>
        </main>
      </div>
    </figure>
  </div>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="{{ cap }}"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;Tab Account templates: one template per domain, the template of northwind-projects.test open on the right</figcaption>
    <div style="height: 750px; box-sizing: border-box; display: flex; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <main style="{{ main }}">
        <div role="tablist" aria-label="Settings" style="{{ tablist }}">
          <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">General</button>
          <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">People and sign-in</button>
          <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Connected services</button>
          <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">Account templates</button>
        </div>
        <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
          <p style="margin: 0; color: #3d4047">One template per domain creates a mail account for every person of that domain, from the directory. People who join later get theirs at the next run.</p>
          <button type="button" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add template</button>
        </div>
        <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); overflow: hidden">
          <table style="width: 100%; border-collapse: collapse; font-size: 14px">
            <thead><tr style="height: 40px; border-bottom: 1px solid #e4e6ea; background: #f5f6f8">
              <th scope="col" style="{{ th }}">Domain</th>
              <th scope="col" style="{{ th }}">Mail server</th>
              <th scope="col" style="{{ th }}">Accounts created</th>
              <th scope="col" style="{{ th }}">Last run</th>
              <th scope="col" style="{{ th }}">State</th>
              <th scope="col" style="width: 44px"><span style="{{ srOnly }}">Actions</span></th>
            </tr></thead>
            <tbody>
              <sc-for list="{{ templates }}" as="t" hint-placeholder-count="3">
                <tr aria-selected="{{ t.selected }}" style="{{ t.style }}">
                  <td style="padding: 0 12px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-weight: 500">{{ t.domain }}</a></td>
                  <td style="padding: 0 12px; white-space: nowrap; color: #3d4047">{{ t.server }}</td>
                  <td style="padding: 0 12px; white-space: nowrap">{{ t.accounts }}</td>
                  <td style="padding: 0 12px; white-space: nowrap; color: #3d4047">{{ t.last }}</td>
                  <td style="padding: 0 12px; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="{{ t.dot }}"></span>{{ t.state }}</span></td>
                  <td style="padding: 0 6px; text-align: right"><button type="button" aria-haspopup="menu" aria-label="Actions for {{ t.domain }}" style="{{ iconBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
        </div>
        <div style="{{ notice }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #3669a5"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span>Templates run every night at 03:00. A person who adds their own account keeps it; the template does not replace it.</span></div>
      </main>
      <aside aria-label="Template northwind-projects.test" style="{{ aside }}">
        <div style="display: flex; align-items: flex-start; gap: 8px">
          <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 600; line-height: 22px">Template northwind-projects.test</h2>
            <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #3d4047"><span style="{{ dotOk }}"></span>46 accounts created, last run today 03:00</span>
          </div>
          <button type="button" aria-label="Close template" style="{{ closeBtn }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 72px; gap: 8px">
          <div style="{{ group }}"><label for="ml-tpl-server" style="{{ label }}">Mail server</label><input id="ml-tpl-server" type="text" value="imap.northwind-projects.test" style="{{ input }}"></div>
          <div style="{{ group }}"><label for="ml-tpl-port" style="{{ label }}">Port</label><input id="ml-tpl-port" type="text" value="993" style="{{ input }}"></div>
        </div>
        <div style="{{ group }}">
          <label for="ml-tpl-alias" style="{{ label }}">Aliases from directory attribute</label>
          <button id="ml-tpl-alias" type="button" aria-haspopup="listbox" style="{{ chooserWide }}"><span>proxyAddresses</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
          <span style="{{ hint }}">Every address in that attribute becomes a sender alias of the person.</span>
        </div>
        <fieldset style="{{ fieldset }}">
          <legend style="{{ legend }}">Filter server in this template</legend>
          <span style="{{ hint }}">ManageSieve, the standard for filter rules that run on the server. Same credentials as the mailbox.</span>
          <div style="display: grid; grid-template-columns: 1fr 72px; gap: 8px">
            <div style="{{ group }}"><label for="ml-tpl-sieve" style="{{ label }}">Filter server host</label><input id="ml-tpl-sieve" type="text" value="sieve.northwind-projects.test" style="{{ input }}"></div>
            <div style="{{ group }}"><label for="ml-tpl-sport" style="{{ label }}">Port</label><input id="ml-tpl-sport" type="text" value="4190" style="{{ input }}"></div>
          </div>
        </fieldset>
        <fieldset style="{{ fieldset }}">
          <legend style="{{ legend }}">Sign the accounts in with</legend>
          <label style="{{ radioRow }}"><input type="radio" name="ml-tpl-master" checked style="{{ radio }}"><span>A master password, kept on this server</span></label>
          <label style="{{ radioRow }}"><input type="radio" name="ml-tpl-master" style="{{ radio }}"><span>A master user that may open every mailbox</span></label>
        </fieldset>
        <div style="padding: 10px 12px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; line-height: 19px">
          <strong style="font-weight: 600">Preview for Olivia Brandt</strong>
          <dl style="margin: 6px 0 0; display: grid; grid-template-columns: 70px 1fr; gap: 2px 8px">
            <dt style="color: #5e6168">Address</dt><dd style="margin: 0">olivia@northwind-projects.test</dd>
            <dt style="color: #5e6168">Aliases</dt><dd style="margin: 0">o.brandt@northwind-projects.test, delivery@northwind-projects.test</dd>
            <dt style="color: #5e6168">Signs in</dt><dd style="margin: 0">imap.northwind-projects.test:993 as olivia, master password</dd>
          </dl>
        </div>
        <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 12px; border-top: 1px solid #e4e6ea">
          <button type="button" style="{{ btnPrimary }}">Save</button>
          <button type="button" style="{{ btnSecondary }}">Create accounts now</button>
        </div>
        <div style="display: flex; align-items: center; gap: 10px">
