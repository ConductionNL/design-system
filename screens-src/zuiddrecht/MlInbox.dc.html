<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 1000px; overflow: hidden">
  <dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="245px,945px"></dc-import></div>
    <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="" hint-size="410px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px; text-align: center">
        <span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; border: 1px solid #e4e6ea; display: inline-flex; align-items: center; justify-content: center; color: #5e6168; margin-bottom: 8px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>
        </span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3">Select a conversation</h2>
        <p style="margin: 0; max-width: 360px; color: #5e6168">Pick one from the list to read it here. Linked conversations show their work package on the right.</p>
        <dl style="margin: 20px 0 0; display: grid; grid-template-columns: auto auto; gap: 8px 12px; align-items: center; font-size: 13px; color: #3d4047; text-align: left">
          <sc-for list="{{ keys }}" as="k" hint-placeholder-count="3">
            <dt style="display: flex; justify-content: flex-end"><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-bottom-width: 2px; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 12px 'Fira Sans', sans-serif">{{ k.key }}</kbd></dt>
            <dd style="margin: 0">{{ k.label }}</dd>
          </sc-for>
        </dl>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { keys: [{ key: 'L', label: 'Link to a work package' }, { key: 'C', label: 'New message' }, { key: '/', label: 'Search' }] };
  }
}
</script>
</body>
</html>
