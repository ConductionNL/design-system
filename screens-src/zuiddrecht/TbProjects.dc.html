<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: all projects in a table with a row menu open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#tb-prj-filter::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 3517px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;All projects in a table, at rest: yours, shared with you, archived, and the deleted items of the last 30 days. Sharing a project with a person is kept in Nextcloud, OpenProject does not have it</figcaption>
    <div style="position: relative; height: 913px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Projects" hint-size="264px,845px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; align-items: baseline; gap: 8px; min-width: 0"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap">Projects</h1><span style="font-size: 13px; color: #5e6168; white-space: nowrap">3 of yours, 2 shared with you, 1 archived, 1 deleted</span></div>
        <div style="flex: 1 1 auto"></div>
        <div style="position: relative; display: flex; align-items: center; width: 260px">
          <label for="tb-prj-filter" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Filter by title</label>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 10px; top: 9px; color: #5e6168"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>
          <input id="tb-prj-filter" type="search" placeholder="Filter by title" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 10px 0 32px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d">
        </div>
        <button type="button" style="{{ btnSecondary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Import a backup file</button>
        <button type="button" aria-expanded="false" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New project</button>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; padding: 16px; overflow: hidden">
        <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
          <table style="width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px">
            <colgroup><col><col style="width: 220px"><col style="width: 120px"><col style="width: 165px"><col style="width: 170px"><col style="width: 44px"></colgroup>
            <thead><tr style="height: 44px; background: #fafbfc">
              <th scope="col" style="{{ th }}">Project</th>
              <th scope="col" style="{{ th }}">Owner</th>
              <th scope="col" style="{{ th }}">Members</th>
              <th scope="col" style="{{ th }} text-align: right">Open work packages</th>
              <th scope="col" style="{{ th }}">Last change</th>
              <th scope="col" style="width: 44px"><span style="{{ srOnly }}">Actions</span></th>
            </tr></thead>
            <tbody>
              <sc-for list="{{ rows }}" as="r" hint-placeholder-count="10">
                <sc-if value="{{ r.isGroup }}" hint-placeholder-val="{{ false }}">
                  <tr style="height: 40px; border-top: 1px solid #eef0f3; background: #f5f6f8"><th scope="rowgroup" colspan="6" style="text-align: left; padding: 8px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; line-height: 18px">{{ r.name }}<span style="margin-left: 8px; font-weight: 400; letter-spacing: 0; text-transform: none">{{ r.sub }}</span><sc-if value="{{ r.hasNote }}" hint-placeholder-val="{{ false }}"><span style="display: block; max-width: 640px; font-weight: 400; letter-spacing: 0; text-transform: none; color: #3d4047; line-height: 18px">{{ r.note }}</span></sc-if></th></tr>
                </sc-if>
                <sc-if value="{{ r.isProject }}" hint-placeholder-val="{{ true }}">
                  <tr style="{{ r.style }}">
                    <td style="padding: 0 16px; white-space: nowrap"><span style="display: flex; align-items: center; gap: 10px; line-height: 20px"><span aria-hidden="true" style="{{ r.swatch }}"></span><a href="{{ r.href }}" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">{{ r.name }}</a><sc-if value="{{ r.readOnly }}" hint-placeholder-val="{{ false }}"><span style="{{ tag }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2zM7 11V7a5 5 0 0 1 10 0v4"></path></svg>Read only</span></sc-if><sc-if value="{{ r.hasTag }}" hint-placeholder-val="{{ false }}"><span style="{{ tag }}">{{ r.tag }}</span></sc-if></span></td>
                    <td style="padding: 6px 16px; white-space: nowrap"><span style="display: flex; flex-direction: column; gap: 2px; line-height: 1.2"><span>{{ r.owner }}</span><sc-if value="{{ r.hasOwnerSub }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5e6168"><sc-if value="{{ r.remote }}" hint-placeholder-val="{{ false }}"><span style="{{ tag }}">Other server</span></sc-if>{{ r.ownerSub }}</span></sc-if><sc-if value="{{ r.nco }}" hint-placeholder-val="{{ false }}"><span style="display: flex"><span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span></sc-if></span></td>
                    <td style="padding: 0 16px; white-space: nowrap"><span role="group" aria-label="{{ r.membersLabel }}" style="display: inline-flex; align-items: center"><sc-for list="{{ r.members }}" as="m" hint-placeholder-count="3"><span title="{{ m.name }}" style="{{ m.style }}">{{ m.initials }}</span></sc-for></span></td>
                    <td style="padding: 0 16px; text-align: right; white-space: nowrap">{{ r.open }}</td>
                    <td style="padding: 0 16px; white-space: nowrap; color: #3d4047">{{ r.last }}</td>
                    <td style="padding: 0 6px; text-align: right"><button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Actions for {{ r.name }}" title="{{ r.menuHint }}" style="{{ menuBtn }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
                  </tr>
                </sc-if>
              </sc-for>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;New project opens a row at the top of your projects: name it, pick a colour, create it; it is created in OpenProject too, with you as its first member</figcaption>
    <div style="background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <table style="width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px">
        <tbody>
          <tr style="height: 40px; background: #f5f6f8"><th scope="rowgroup" style="text-align: left; padding: 8px 16px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; line-height: 18px">Your projects<span style="margin-left: 8px; font-weight: 400; letter-spacing: 0; text-transform: none">3</span></th></tr>
          <tr id="tb-prj-new" style="height: 56px; border-top: 1px solid #eef0f3; background: #eaf0f7">
            <td style="padding: 0 16px"><div style="display: flex; align-items: center; gap: 10px; white-space: nowrap"><label for="tb-prj-name" style="{{ srOnly }}">Name of the new project</label><input id="tb-prj-name" type="text" value="Malmo Energi demo" style="width: 260px; height: 34px; box-sizing: border-box; padding: 0 12px; border: 1px solid #3669a5; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d"><div role="radiogroup" aria-label="Colour of the new project" style="display: inline-flex; align-items: center; gap: 6px"><sc-for list="{{ swatches }}" as="s" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ s.on }}" aria-label="{{ s.label }}" style="{{ s.style }}"></button></sc-for></div><button type="button" style="{{ btnSmallPrimary }}">Create project</button><button type="button" style="{{ btnSmall }}">Cancel</button></div></td>
          </tr>
          <tr style="height: 48px; border-top: 1px solid #eef0f3; background: #ffffff"><td style="padding: 0 16px; white-space: nowrap"><span style="display: flex; align-items: center; gap: 10px; line-height: 20px"><span aria-hidden="true" style="flex: none; width: 12px; height: 12px; border-radius: 3px; background: #3669a5"></span><a href="TbBoard.dc.html" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">Northwind rollout Lyon</a><span style="{{ tag }}">Opens on start</span></span></td></tr>
        </tbody>
      </table>
    </div>
  </figure>

  <div style="display: grid; grid-template-columns: 380px 380px 1fr; gap: 24px; align-items: start">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The row menu of OpenProject core, opened from the dots at the end of its row</figcaption>
      <div role="menu" aria-label="Actions for OpenProject core" style="width: 380px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); display: flex; flex-direction: column">
        <button type="button" role="menuitem" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>Rename and colour</button>
        <button type="button" role="menuitemcheckbox" aria-checked="false" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M3 9.5 12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg><span style="flex: 1 1 auto; text-align: left">Open on start</span><span style="font-size: 12px; color: #5e6168">Now: Northwind rollout Lyon</span></button>
        <div role="separator" style="{{ sep }}"></div>
        <button type="button" role="menuitem" aria-haspopup="dialog" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M20 9h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg><span style="flex: 1 1 auto; text-align: left">Copy project...</span></button>
        <div role="separator" style="{{ sep }}"></div>
        <button type="button" role="menuitem" aria-haspopup="menu" aria-expanded="false" style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg><span style="flex: 1 1 auto; text-align: left">Export or subscribe...</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m9 18 6-6-6-6"></path></svg></button>
        <div role="separator" style="{{ sep }}"></div>
        <button type="button" role="menuitem" title="Hidden from the list, kept in OpenProject." style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"></path></svg><span style="flex: 1 1 auto; text-align: left">Archive</span></button>
        <button type="button" role="menuitem" title="The others keep it." style="{{ item }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg><span style="flex: 1 1 auto; display: inline-flex; align-items: center; gap: 6px; text-align: left">Leave this project<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span></button>
        <button type="button" role="menuitem" title="Deleting hides it here and keeps it for 30 days under Deleted items. OpenProject still has it until then." style="{{ itemDanger }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg><span style="flex: 1 1 auto; text-align: left">Delete</span></button>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">d</span> &nbsp;Export or subscribe... replaces the row menu with this list; the top row goes back to it</figcaption>
      <div id="tb-prj-export" role="menu" aria-label="Export or subscribe" style="width: 380px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); display: flex; flex-direction: column">
        <button type="button" role="menuitem" aria-label="Back to the actions for OpenProject core" style="{{ item }}; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m15 18-6-6 6-6"></path></svg>Export or subscribe</button>
        <div role="separator" style="{{ sep }}"></div>
        <button type="button" role="menuitem" title="To import again" style="{{ item }}"><span style="flex: 1 1 auto; text-align: left">Backup file (JSON)</span></button>
        <button type="button" role="menuitem" title="One row per work package" style="{{ item }}"><span style="flex: 1 1 auto; text-align: left">Spreadsheet (CSV)</span></button>
        <button type="button" role="menuitem" title="Due dates as events" style="{{ item }}"><span style="flex: 1 1 auto; text-align: left">Calendar file</span></button>
        <button type="button" role="menuitem" title="Stays up to date" style="{{ item }}"><span style="flex: 1 1 auto; display: inline-flex; align-items: center; gap: 6px; text-align: left">Calendar link for another app<span role="img" title="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." aria-label="Kept in Nextcloud. OpenProject does not have this, so it stays in Nextcloud." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span></button>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">e</span> &nbsp;The toast after Delete, at the bottom centre of the content column</figcaption>
      <div style="position: relative; height: 110px; box-sizing: border-box; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div role="status" style="position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 6px 0 14px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 13px; white-space: nowrap; box-shadow: 0 4px 12px rgba(27,28,29,0.12)"><span>Moved to Deleted items</span><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid rgba(255,255,255,0.4); border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Undo</button></div>
      </div>
    </figure>
  </div>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; align-self: flex-start">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">f</span> &nbsp;Copy project... opens this dialog over the dimmed screen; the copy is created in OpenProject too, with you as its first member. The marked options are kept in Nextcloud, OpenProject does not have them</figcaption>
    <div style="width: 800px; box-sizing: border-box; padding: 40px; background: rgba(27,28,29,0.45); border-radius: var(--sc-radius-lg, 10px)">
      <div role="dialog" aria-labelledby="tb-copy-title" style="width: 640px; margin: 0 auto; box-sizing: border-box; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); display: flex; flex-direction: column">
        <div style="padding: 20px 24px 12px"><div style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #234a78">OpenProject core</div><h2 id="tb-copy-title" style="margin: 2px 0 0; font-size: 20px; font-weight: 700; line-height: 26px">Copy project</h2></div>
        <div style="padding: 0 24px 8px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="tb-prj-copy-name" style="font-size: 14px; font-weight: 600">Name of the copy</label><input id="tb-prj-copy-name" type="text" value="OpenProject core, copy" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></div>
          <div role="group" aria-label="Work packages in the copy" style="display: flex; flex-direction: column; gap: 10px">
            <span style="font-size: 14px; font-weight: 600">Work packages in the copy</span>
            <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="checkbox" checked style="{{ box }}; margin-top: 2px"><span>Copy the work packages</span></label>

    const swatchBase = 'flex: none; width: 20px; height: 20px; padding: 0; border-radius: 10px; box-sizing: border-box; cursor: pointer; ';
    const swatches = [['Blue', '#3669a5'], ['Green', '#538b28'], ['Teal', '#005b77'], ['Sky', '#08a5df'], ['Orange', '#ff9d2e'], ['Grey', '#5e6168']].map(([label, c], i) => ({
      label: 'Colour ' + label.toLowerCase(), on: i === 3 ? 'true' : 'false',
      style: swatchBase + 'background: ' + c + '; ' + (i === 3 ? 'border: 2px solid #ffffff; box-shadow: 0 0 0 2px #1b1c1d' : 'border: 2px solid #ffffff; box-shadow: 0 0 0 1px #c4c7cb')
    }));
    const PEOPLE = { 'Olivia Brandt': 'OB', 'Tom Achterberg': 'TA', 'Priya Raman': 'PR', 'Marc Dubois': 'MD', 'Jana Köhler': 'JK' };
    const av = 'width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; ';
    const members = (names, more) => {
      const list = names.map((n, i) => ({ name: n, initials: PEOPLE[n], style: av + (i ? 'margin-left: -4px; ' : '') + 'background: #eaf0f7; color: #234a78' }));
      if (more) list.push({ name: more + ' more members', initials: '+' + more, style: av + 'margin-left: -4px; background: #eef0f3; color: #3d4047' });
      return list;
    };
    const row = 'height: 48px; border-top: 1px solid #eef0f3; ';
    const sw = (c) => 'flex: none; width: 12px; height: 12px; border-radius: 3px; background: ' + c;
    const menuBtn = 'width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center';
    const group = (name, sub, note) => ({ isGroup: true, isProject: false, name, sub, note: note ?? '', hasNote: !!note });
    // [name, colour, owner, ownerSub, member names, more, open, last, options]
    const project = ([name, colour, owner, ownerSub, names, more, open, last, o = {}]) => ({
      isGroup: false, isProject: true,
      name, href: name === 'Northwind rollout Lyon' ? 'TbBoard.dc.html' : '#', swatch: sw(colour), owner, ownerSub, hasOwnerSub: !!ownerSub, nco: !!o.nco, remote: !!o.remote, deleted: !!o.deleted,
      members: members(names, more), membersLabel: (names.length + (more || 0)) + ' members', open, last,
      readOnly: !!o.readOnly, hasTag: !!o.tag, tag: o.tag ?? '', archived: !!o.archived,
      menuHint: o.archived ? 'Open, Unarchive' : o.deleted ? 'Restore puts it back in the list, nothing changes in OpenProject. Delete for good deletes it in OpenProject, as the end of the 30 days does.' : 'Rename and colour, Open on start, Copy project, Export or subscribe, Archive, Leave this project, Delete',
      style: row + 'background: #ffffff' + (o.archived || o.deleted ? '; color: #5e6168' : '')
    });
    const rows = [
      group('Your projects', '3'),
      project(['Northwind rollout Lyon', '#3669a5', 'You', '', ['Olivia Brandt', 'Tom Achterberg', 'Priya Raman'], 2, '9', 'Today 07:12', { tag: 'Opens on start' }]),
      project(['Netzausbau Nord', '#538b28', 'You', '', ['Olivia Brandt', 'Priya Raman'], 0, '4', '9 Oct']),
      project(['Example project', '#ff9d2e', 'You', '', ['Olivia Brandt'], 0, '6', '14 March', { tag: 'Example from first use' }]),
      group('Shared with you', '2'),
      project(['OpenProject core', '#005b77', 'Priya Raman', 'Shared by Priya Raman', ['Priya Raman', 'Tom Achterberg', 'Olivia Brandt'], 9, '12', 'Today 06:40', { nco: true }]),
      project(['Lyon department rollout', '#08a5df', 'Marc Dubois', 'ville-de-lyon.test', ['Marc Dubois', 'Olivia Brandt'], 1, '5', '10 Oct', { readOnly: true, remote: true }]),
      group('Archived projects', '1'),
      project(['Release 16.4 rollout', '#5e6168', 'You', '', ['Olivia Brandt', 'Tom Achterberg'], 2, '0', 'Archived on 2 September', { archived: true }]),
      group('Deleted items', '1, kept for 30 days'),
      project(['Keycloak pilot', '#862e9c', 'You', '', ['Olivia Brandt', 'Tom Achterberg'], 0, '3', 'Deleted just now', { deleted: true }])
    ];
    const along = [['Members', true, 'The same people, with the same rights.'], ['Tags', true, 'The tags of this project, with their colours.'], ['Due dates', true, 'Start and due dates stay as they are.'], ['Attachments', false, 'Files on the work packages are copied too.']].map(([label, on, hint]) => ({ label, on, off: !on, hint }));
    const radio = 'width: 18px; height: 18px; margin: 0; accent-color: #3669a5';
    const switchOn = 'flex: none; position: relative; width: 42px; height: 24px; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff';
    const hiddenMembers = members(['Olivia Brandt', 'Priya Raman'], 0);
    return { srOnly, th, btnPrimary, btnSecondary, btnSmall, btnSmallPrimary, tag, item, itemDanger, sep, box, swatches, rows, along, menuBtn, radio, switchOn, knobOn, hiddenMembers };
  }
}
