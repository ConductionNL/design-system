<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>stackiq: persoonlijke instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="SkApplicaties" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Stackiq" version="0.2.5" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Stackiq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen under Instellingen.
    // Stackiq fills no #user-settings slot and has no notifier yet, so this is CnAppRoot's default: Meldingen
    // (empty), Inloggegevens and Integraties.
    const sections = [
      { name: 'Meldingen', desc: 'Kies welke meldingen van Stackiq je krijgt.', rows: [
        { note: 'Stackiq stuurt nog geen eigen meldingen.', tone: 'plain' }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['TOPdesk, eigen account', 'Uitwisseling met de servicedesk · toegevoegd 30 september', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] },
      { name: 'Integraties', desc: 'Apps waar Stackiq mee samenwerkt. Een klik opent de app.', rows: [
        { items: [['OpenCatalogi', 'Componenten uit de catalogus', 'Openen'], ['Open Register', 'Waar je applicaties en contracten zijn opgeslagen', 'Openen']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
