<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: the Rules section with Edit as script</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1413px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The Rules section: the mailbox, forwarding, the rules table and the scripts table, each with a one-line heading and a help icon (its tooltip explains the section); the script warning shows only when another script is switched on; Run now sits next to New rule</figcaption>
    <div style="position: relative; height: 1313px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="264px,1245px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="" hint-size="410px,1245px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px; text-align: center">
        <span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; border: 1px solid #e4e6ea; display: inline-flex; align-items: center; justify-content: center; color: #5e6168; margin-bottom: 8px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>
        </span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">Select a conversation</h2>
        <p style="margin: 0; max-width: 360px; color: #5e6168">Pick one from the list to read it here. Linked conversations show their work package on the right.</p>
      </div>
    </main>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 40px">
      <div role="dialog" aria-modal="true" aria-label="Settings, Rules" style="position: relative; z-index: 2; width: 960px; min-height: 1220px; box-sizing: border-box; display: flex; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
        <div style="flex: 0 0 236px; width: 236px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlSettingsNav" active="Rules" hint-size="236px,1220px"></dc-import></div>
        <section aria-label="Rules" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 20px 16px 20px 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
            <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Rules</h3>
            <button type="button" aria-label="Close settings" style="flex: none; width: 40px; height: 40px; margin: -8px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 24px 24px">

            <div style="display: flex; align-items: center; gap: 12px">
              <label for="ml-rules-mailbox" style="font-weight: 600; white-space: nowrap">Settings for mailbox</label>
              <button id="ml-rules-mailbox" type="button" aria-haspopup="listbox" title="Olivia Brandt, olivia@northwind-projects.test" style="flex: none; display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 180px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>Olivia Brandt</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
              <button type="button" aria-label="Help about mailbox rules" title="Each mailbox has its own rules. They run on the mail server, also when the app is closed. Quick actions, the steps you start by hand from the toolbar, have their own section." style="flex: none; width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg></button>
              <span style="flex: 1 1 auto"></span>
              <a href="MlSettingsAutoReply.dc.html" style="font-size: 13px; font-weight: 600; color: var(--sc-link, #3669a5); text-decoration: none; white-space: nowrap">Automatic reply on until 16 Oct</a>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; padding: 16px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #ffffff">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; min-height: 32px">
                <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="margin: 0; display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; line-height: 24px">Forward all mail<button type="button" aria-label="Help about forwarding" title="Every new message goes on to another address as it arrives. Forwarding runs before the rules below, so a forwarded copy still gets sorted here. Keep a copy off means the message leaves without landing in your inbox." style="flex: none; width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg></button></h4></div>
                <button type="button" role="switch" aria-checked="true" aria-label="Forward all mail on or off" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
              <label for="ml-rules-fwd-to" style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #1b1c1d">Forward to<input id="ml-rules-fwd-to" type="text" value="o.brandt@northwind-group.test" style="{{ input }}"></label>
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; min-height: 32px">
                <label for="ml-rules-fwd-copy" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">Keep a copy in this mailbox</span></label>
                <button id="ml-rules-fwd-copy" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
              </div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 32px">
                <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="margin: 0; display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; line-height: 24px">Rules for incoming mail<button type="button" aria-label="Help about rules" title="Rules run from top to bottom on every new message. Drag a rule to change its priority; switch one off to keep it without running it. Click a rule to edit it as a form or as a script." style="flex: none; width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg></button></h4></div>
                <div style="flex: none; display: flex; align-items: center; gap: 8px">
                  <button type="button" aria-haspopup="menu" title="Run the rules over the mail already in a folder. Last run on Inbox: Friday 9 October, 38 messages moved" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Run now<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                  <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New rule</button>
                </div>
              </div>
              <div style="border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; overflow: hidden"><table style="width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px; line-height: 20px">
                <thead><tr style="background: #fafbfc"><th scope="col" style="width: 24px; padding: 12px 4px 12px 12px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Priority</span></th><th scope="col" style="{{ th }} width: 150px">Rule</th><th scope="col" style="{{ th }}">When</th><th scope="col" style="{{ th }}">Then</th><th scope="col" style="{{ th }} width: 48px; text-align: right">On</th></tr></thead>
                <tbody>
                  <sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
                    <tr style="border-top: 1px solid #eef0f3; color: {{ r.color }}">
                      <td style="padding: 10px 4px 10px 12px"><button type="button" aria-label="Drag to change the priority of {{ r.name }}" style="width: 20px; height: 28px; padding: 0; border: 0; background: transparent; color: #5e6168; cursor: grab; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button></td>
                      <td style="padding: 14px 16px"><a href="MlRulesEdit.dc.html" style="color: var(--sc-link, #3669a5); font-size: 15px; font-weight: 600; text-decoration: none">{{ r.name }}</a></td>
                      <td style="padding: 14px 16px"><span title="{{ r.whenHint }}" style="display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.when }}</span></td>
                      <td style="padding: 14px 16px">{{ r.then }}</td>
                      <td style="padding: 12px 16px; text-align: right"><button type="button" role="switch" aria-checked="{{ r.checked }}" aria-label="Switch rule {{ r.name }} on or off" style="{{ r.switch }}"><span style="{{ r.knob }}"></span></button></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table></div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="margin: 0; display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 700; line-height: 24px">Edit as script<button type="button" aria-label="Help about scripts" title="Your scripts, in Sieve, the filter language your mail server runs. The four rules above live in the script northwind-rules. One script is active at a time: making another one active switches northwind-rules off, and with it the 4 rules above." style="flex: none; width: 28px; height: 28px; border: 0; border-radius: 14px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg></button></h4></div>
              <div style="border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; overflow: hidden"><table style="width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 14px; line-height: 20px">
                <thead><tr style="background: #fafbfc"><th scope="col" style="{{ th }} width: 150px">Script</th><th scope="col" style="{{ th }}">From</th><th scope="col" style="{{ th }} width: 110px">Active</th><th scope="col" style="{{ th }} width: 186px; text-align: right">Actions</th></tr></thead>
                <tbody>
                  <sc-for list="{{ scripts }}" as="s" hint-placeholder-count="3">
                    <tr style="{{ s.style }}">
                      <td style="padding: 14px 16px; font-size: 15px; font-weight: 600; overflow-wrap: anywhere">{{ s.name }}</td>
                      <td style="padding: 14px 16px; color: #5e6168">{{ s.meta }}</td>
                      <td style="padding: 12px 16px"><span style="display: flex; align-items: center; gap: 8px"><button type="button" role="switch" aria-checked="{{ s.checked }}" aria-label="Make {{ s.name }} the active script" style="{{ s.switch }}"><span style="{{ s.knob }}"></span></button><span style="font-size: 13px; color: #5e6168">{{ s.state }}</span></span></td>
                      <td style="padding: 7px 16px; text-align: right; white-space: nowrap"><button type="button" aria-label="Edit the script {{ s.name }}" style="{{ linkBtn }}">Edit</button><button type="button" aria-label="Rename the script {{ s.name }}" style="{{ linkBtn }}">Rename</button><button type="button" aria-label="Delete the script {{ s.name }}" style="{{ linkBtn }} color: #cc0000">Delete</button></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table></div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
                <button type="button" title=".sieve or .txt. An uploaded script is checked for mistakes before it can be made active." style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Upload a script</button>
              </div>
            </div>
          </div>
        </section>
      </div>
      </div>
    </div>
  </figure>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const switchOn = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff';
    const switchOff = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid #c4c7cb; border-radius: 12px; background: #ffffff; box-sizing: border-box; cursor: pointer';
    const knobOff = 'position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #5e6168';
    const input = 'height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px \'Fira Sans\', sans-serif; width: 100%';
    const th = 'text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap;';
    const linkBtn = 'height: 34px; padding: 0 8px; border: 0; background: transparent; color: var(--sc-link, #3669a5); font: 600 14px \'Fira Sans\', sans-serif; cursor: pointer;';
    // The same four rules, in the same words, as on MlRules (Kassel is the rule MlRulesEdit opens).
    const rules = [
      ['Kassel: file and label', 'Sender contains stadtwerke-kassel, subject matches *Gantt*, sent to olivia@northwind-projects.test', 'Move to Customers / Kassel, add label Waiting for customer, mark as read, stop further rules', true],
      ['Lyon: file', 'From ends with @lyon.fr', 'Move to Customers / Lyon', true],
      ['OpenProject notifications', 'From is notifications@openproject.northwind-projects.test', 'Mark as read, keep in Inbox', true],
      ['Newsletters', 'Is a newsletter or mailing list', 'Add label Newsletter, mark as read, move to Archive', false]
    ].map(([name, when, then, on]) => ({ name, when, then, whenHint: name === 'Newsletters' ? when + '. Checked on the mail server as: header List-Unsubscribe is present' : when, checked: on ? 'true' : 'false', switch: on ? switchOn : switchOff, knob: on ? knobOn : knobOff, color: on ? '#1b1c1d' : '#5e6168' }));
    const scripts = [
      ['northwind-rules', 'The form, 4 rules, changed today', true],
      ['out-of-office-2026', 'Uploaded 2 Jul', false],
      ['test-filters', 'Uploaded 14 Sep', false]
    ].map(([name, meta, active]) => ({ name, meta, state: active ? 'Active' : 'Off', checked: active ? 'true' : 'false', switch: active ? switchOn : switchOff, knob: active ? knobOn : knobOff, style: 'border-top: 1px solid #eef0f3; ' + (active ? 'background: #eaf0f7;' : '') }));
    return { switchOn, knobOn, input, th, linkBtn, rules, scripts };
  }
}
</script>
</body>
</html>
