<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: one way to find a work package</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; min-height: 1540px; padding: 32px 36px 40px">
  <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 32px">One way to find a work package</h1>
  <p style="margin: 6px 0 0; max-width: 820px; color: #3d4047">The same picker sits in the link panel of a mail and of an event. It asks OpenProject as you, so you only see work packages you may see there. These are its seven states.</p>
  <div style="display: grid; grid-template-columns: repeat(3, 440px); gap: 24px 24px; margin-top: 24px; align-items: start">
    <sc-for list="{{ panels }}" as="p" hint-placeholder-count="7">
      <div style="display: flex; flex-direction: column; gap: 8px; min-width: 0">
        <div style="display: flex; align-items: baseline; gap: 8px; min-height: 36px; padding: 0 2px; font-size: 13px; line-height: 18px; color: #5e6168"><span style="flex: none; font-weight: 600; color: #1b1c1d">{{ p.n }}</span><span>{{ p.caption }}</span></div>
        <div style="width: 440px; box-sizing: border-box; padding: 16px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <dc-import name="WpPicker" state="{{ p.state }}" context="{{ p.context }}" hint-size="408px,300px"></dc-import>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1540}}'>
class Component extends DCLogic {
  renderVals() {
    const panels = [
      ['suggest', 'mail', 'The field is empty. Three groups suggest what you probably mean, each row with its reason.'],
      ['number', 'mail', 'You type a number. The exact work package comes first, then numbers that start with it.'],
      ['words', 'mail', 'You type words. Matches in the subject as you type, marked, grouped per project.'],
      ['deep', 'mail', 'The toggle is on. Descriptions and comments are searched too, and a line of the match is shown.'],
      ['none', 'mail', 'Nothing found in this project. Widen the search, or make the work package now.'],
      ['offline', 'mail', 'OpenProject does not answer. The picker says so and guesses nothing.'],
      ['picked', 'mail', 'A work package is picked. The picker folds to the chosen row, and the panel continues below it.']
    ].map(([state, context, caption], i) => ({ state, context, caption, n: String(i + 1) }));
    return { panels };
  }
}
</script>
</body>
</html>
