# =============================================================
# Conduction design system, local server
# -------------------------------------------------------------
# Serves the repo root with Caddy, so the kit and the screens
# gallery have the same relative paths as the live site at
# https://identity.conduction.nl (where preview/ is the root).
#
# From the repo root:
#   docker compose up kit              # http://localhost:8090/
#   KIT_PORT=8091 docker compose up kit
#   docker compose down                # stop + remove
#
# No build step: the repo is bind-mounted read-only, so a saved
# file shows on the next browser refresh.
# =============================================================

services:
  kit:
    image: caddy:2-alpine
    container_name: conduction-kit
    ports:
      - "${KIT_PORT:-8090}:80"
    volumes:
      - .:/srv:ro
      - ./.github/kit-caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped
