<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Kop en hoofdmenu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6b4a}a:hover{color:#1f4a33}
</style>
</helmet>
<header style="font-family: 'Lexend', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; width: 100%">
  <a href="#inhoud" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Direct naar de inhoud</a>
  <div style="max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px 32px">
    <a href="Home.dc.html" style="display: flex; align-items: center" aria-label="Basisschool De Wilgenboom, naar de homepage">
      <img src="/_blob/6cb2d63f23c2ed296aabd354d3b73a2d" alt="Basisschool De Wilgenboom" style="height: 56px; width: auto; display: block">
    </a>
    <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
      <form role="search" style="position: relative; display: flex">
        <label for="kop-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken op de website</label>
        <input id="kop-zoek" type="search" placeholder="Zoeken" style="width: 240px; height: 46px; box-sizing: border-box; padding: 0 48px 0 16px; border: 1px solid #8a929e; border-radius: 10px; background: #ffffff; font: 400 16px 'Lexend', sans-serif; color: #1a1a1a">
        <button type="submit" aria-label="Zoeken" style="position: absolute; right: 0; top: 0; width: 46px; height: 46px; border: 0; background: transparent; color: #2f6b4a; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        </button>
      </form>
      <sc-if value="{{ signedIn }}" hint-placeholder-val="{{ false }}">
        <a href="MijnOverzicht.dc.html" style="display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 18px 0 7px; border: 1px solid #d3d8df; border-radius: 23px; color: #1a1a1a; font-weight: 600; font-size: 16px; text-decoration: none">
          <span style="width: 32px; height: 32px; border-radius: 16px; background: #e8f1eb; color: #1f4a33; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">FH</span>Fatima Hulstkamp
        </a>
        <a href="Home.dc.html" style="display: inline-flex; align-items: center; height: 46px; padding: 0 4px; font-weight: 600; font-size: 16px">Uitloggen</a>
      </sc-if>
      <sc-if value="{{ signedOut }}" hint-placeholder-val="{{ true }}">
        <a href="Inloggen.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 46px; padding: 0 20px; border-radius: 10px; background: #2f6b4a; color: #ffffff; font-weight: 600; font-size: 16px; text-decoration: none">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.500-4 4.500-6 8-6s6.500 2 8 6"></path></svg>
          Mijn Wilgenboom
        </a>
      </sc-if>
    </div>
  </div>
  <nav aria-label="Hoofdmenu" style="border-top: 1px solid #e6e9ee">
    <ul style="max-width: 1280px; margin: 0 auto; padding: 0 10px; list-style: none; display: flex; flex-wrap: wrap">
      <sc-for list="{{ items }}" as="item" hint-placeholder-count="7">
        <li><a href="{{ item.href }}" aria-current="{{ item.current }}" style="{{ item.style }}">{{ item.label }}</a></li>
      </sc-for>
    </ul>
  </nav>
  <div aria-hidden="true" style="height: 3px; background: #2f6b4a"></div>
  <div aria-hidden="true" style="height: 14px; overflow: hidden; display: flex; align-items: flex-start; gap: 6px; padding: 0 9px">
    <sc-for list="{{ twigs }}" as="t" hint-placeholder-count="120">
      <span style="{{ t }}"></span>
    </sc-for>
  </div>
  <sc-if value="{{ hasCrumbs }}" hint-placeholder-val="{{ true }}">
    <ol aria-label="Kruimelpad" style="max-width: 1280px; box-sizing: border-box; margin: 0 auto; padding: 10px 24px 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 15px">
      <sc-for list="{{ crumbs }}" as="c" hint-placeholder-count="2">
        <li style="display: flex; gap: 8px"><sc-if value="{{ c.link }}" hint-placeholder-val="{{ true }}"><a href="{{ c.href }}">{{ c.label }}</a><span aria-hidden="true" style="color: #4a4a4a">›</span></sc-if><sc-if value="{{ c.last }}" hint-placeholder-val="{{ false }}"><span aria-current="page" style="color: #4a4a4a">{{ c.label }}</span></sc-if></li>
      </sc-for>
    </ol>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"signedIn":{"editor":"boolean","default":false},"active":{"editor":"text","default":"Home"},"crumbs":{"editor":null,"default":[]},"$preview":{"width":1440,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Home';
    const nav = [
      ['Home', 'Home.dc.html'], ['Onze school', 'Contentpagina.dc.html'], ['Groepen', 'Contentpagina.dc.html'],
      ['Praktisch', 'Contentpagina.dc.html'], ['Nieuws', 'Zoeken.dc.html'],
      ['Kalender', 'Contentpagina.dc.html'], ['Aanmelden', 'Contentpagina.dc.html']
    ];
    const base = 'display: block; padding: 15px 14px; font-size: 17px; text-decoration: none; color: #1a1a1a; ';
    const items = nav.map(([label, href]) => {
      const on = label === active;
      return { label, href, current: on ? 'page' : 'false',
        style: base + (on ? 'font-weight: 700; box-shadow: inset 0 -5px 0 #f5b82e;' : 'font-weight: 500;') };
    });
    // De twijgen: bars hanging from the green line, uneven, every seventh one yellow.
    const lengths = [14, 8, 11, 6, 12, 9, 5, 13, 7, 10];
    const twigs = Array.from({ length: 240 }, (_, i) =>
      'flex: none; width: 6px; height: ' + lengths[i % lengths.length] + 'px; border-radius: 0 0 3px 3px; background: ' + (i % 7 === 4 ? '#f5b82e' : '#2f6b4a'));
    const raw = this.props.crumbs && this.props.crumbs.length ? this.props.crumbs : [];
    const crumbs = raw.map((c, i) => ({ ...c, link: i < raw.length - 1, last: i === raw.length - 1, href: c.href ?? 'Home.dc.html' }));
    const signedIn = this.props.signedIn === true;
    return { items, twigs, crumbs, hasCrumbs: crumbs.length > 1, signedIn, signedOut: !signedIn };
  }
}
</script>
</body>
</html>
