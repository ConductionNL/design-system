          <div style="display: flex; flex-direction: column; gap: 4px"><label for="ml-per-away-text" style="font-size: 13px; color: var(--sc-work-text, #3d4047)">Reply</label><textarea id="ml-per-away-text" rows="3" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); height: auto; padding: 8px 10px; line-height: 20px; resize: none">I am away until Friday 23 October and read mail again on Monday 26 October. For the Lyon rollout, Tom Achterberg (tom@northwind-projects.test) can help you right away.</textarea></div>

          <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
              <div style="display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Filter script</h3><p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Her rules as a script (Sieve, the standard mail servers run for sorting). Put one in place from a file when a person moves in from another server, or to fix a broken one.</p></div>
              <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Put a script in place</button>
            </div>
            <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sc-work-text, #3d4047)"><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #d3f9d8; border: 1.5px solid #8ff09c"></span>Active script: customers.sieve, 6 kB of 64 kB, changed on 9 October by Olivia</div>
            <pre style="margin: 0; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px); background: var(--sc-work-ground, #f5f6f8); font: 400 12px/18px ui-monospace, monospace; color: var(--sc-work-ink, #1b1c1d); overflow: hidden; white-space: pre">require ["fileinto"];
if address :domain "from" "ville-lyon.test" { fileinto "Customers/Lyon"; }
if address :domain "from" "stadtwerke-kassel.test" { fileinto "Customers/Kassel"; }</pre>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">e</span> &nbsp;Sign-in tab: two-factor, live sessions and connection logging</figcaption>
      <div style="background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 560px; box-sizing: border-box">
        <div role="tablist" aria-label="Person sections" style="flex: none; display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
          <button type="button" role="tab" aria-selected="false" style="height: 42px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--sc-work-muted, #5e6168); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; letter-spacing: 0.04em; text-transform: uppercase">Addresses</button><button type="button" role="tab" aria-selected="false" style="height: 42px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--sc-work-muted, #5e6168); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; letter-spacing: 0.04em; text-transform: uppercase">Limits</button><button type="button" role="tab" aria-selected="false" style="height: 42px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--sc-work-muted, #5e6168); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; letter-spacing: 0.04em; text-transform: uppercase">Folders</button><button type="button" role="tab" aria-selected="false" style="height: 42px; padding: 0 14px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; color: var(--sc-work-muted, #5e6168); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; letter-spacing: 0.04em; text-transform: uppercase">Rules</button><button type="button" role="tab" aria-selected="true" style="height: 42px; padding: 0 14px; border: 0; border-bottom: 2px solid var(--sc-primary, #3669a5); margin-bottom: -1px; background: transparent; color: var(--sc-primary-deep, #234a78); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; letter-spacing: 0.04em; text-transform: uppercase">Sign-in</button>
        </div>
        <div role="tabpanel" aria-label="Sign-in" style="padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px">
            <label for="ml-per-2fa" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Require two-factor sign-in</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Olivia must confirm every new sign-in with her authenticator app, also from a mail program on a phone or laptop.</span></label>
            <button id="ml-per-2fa" type="button" role="switch" aria-checked="true" style="flex: none; position: relative; width: 36px; height: 20px; margin-top: 1px; padding: 0; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: 10px; background: var(--sc-action, var(--sc-primary, #3669a5)); box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 17px; width: 14px; height: 14px; border-radius: 7px; background: #ffffff"></span></button>
          </div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Two-factor enrolment</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Enrolled on 2 September with an authenticator app. Reset it when she lost her phone: she enrols again at the next sign-in.</span></div>
            <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Reset enrolment</button>
          </div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Live sessions</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">3 now: the web app since 07:02, a phone since 9 October, a laptop mail program since 1 October. Cutting them off signs her out everywhere at once.</span></div>
            <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border-color: var(--sc-accent, #cc0000); color: var(--sc-accent, #cc0000)">Cut off all sessions</button>
          </div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
            <label for="ml-per-log" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Connection logging for this account</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Writes every sign-in and connection of this account to the server log for 7 days. For finding out why a mail program keeps failing. Off for everyone else.</span></label>
            <button id="ml-per-log" type="button" role="switch" aria-checked="false" style="flex: none; position: relative; width: 36px; height: 20px; margin-top: 1px; padding: 0; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: 10px; background: #ffffff; box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 7px; background: var(--sc-work-muted, #5e6168)"></span></button>
          </div>
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid var(--sc-primary, #3669a5); border-radius: var(--sc-radius, 8px); background: var(--sc-primary-light, #eaf0f7); font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--sc-primary, #3669a5)"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span>Her password lives with the workspace sign-on. Reset it there, or from the row menu on the mailbox list.</span></div>
        </div>
      </div>
    </figure>
  </div>
</div>
</div>
</body>
</html>
