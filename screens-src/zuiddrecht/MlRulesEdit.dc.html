<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: edit a rule, as a form or as a script</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2160px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Edit rule opens inside the settings dialog in place of the Rules list, Form tab open; Back to rules returns to the list</figcaption>
    <div style="position: relative; height: 1200px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="245px,1145px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="" hint-size="410px,1145px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px; text-align: center">
        <span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; border: 1px solid #e4e6ea; display: inline-flex; align-items: center; justify-content: center; color: #5e6168; margin-bottom: 8px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>
        </span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">Select a conversation</h2>
        <p style="margin: 0; max-width: 360px; color: #5e6168">Pick one from the list to read it here. Linked conversations show their work package on the right.</p>
      </div>
    </main>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 40px">
        <div role="dialog" aria-modal="true" aria-label="Settings, Rules, edit rule" style="position: relative; z-index: 2; width: 960px; min-height: 1040px; box-sizing: border-box; display: flex; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
          <div style="flex: 0 0 236px; width: 236px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlSettingsNav" active="Rules" hint-size="236px,680px"></dc-import></div>
          <section aria-label="Rules, edit rule" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
            <div style="flex: none; display: flex; align-items: center; gap: 14px; padding: 16px 16px 16px 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
              <a href="MlRulesScripts.dc.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--sc-link, #3669a5); text-decoration: none; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Back to rules</a>
              <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Edit rule</h3>
              <span style="flex: 1 1 auto"></span>
              <button type="button" aria-label="Close settings" style="width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div role="tablist" aria-label="Edit as" style="flex: none; display: flex; align-items: flex-end; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid #c4c7cb">
              <button type="button" role="tab" aria-selected="true" style="min-height: 34px; padding: 8px 12px; border: 1px solid #c4c7cb; border-bottom: 1px solid #ffffff; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: #ffffff; color: #1b1c1d; font: 700 14px 'Fira Sans', sans-serif">Form</button>
              <button type="button" role="tab" aria-selected="false" style="min-height: 34px; padding: 8px 12px; border: 1px solid #c4c7cb; border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: #eef0f3; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif">Script</button>
              <span style="flex: 1 1 auto"></span>
              <span style="align-self: center; padding-bottom: 8px; font-size: 13px; color: #5e6168">Both tabs edit the same rule.</span>
            </div>
            <div role="tabpanel" aria-label="Form" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 16px; padding: 18px 24px 20px">
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: #1b1c1d; max-width: 380px"><span>Name</span><input type="text" value="Kassel: file and label" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>

              <fieldset style="margin: 0; padding: 16px 0 0; border: 0; border-top: 1px solid #e4e6ea; display: flex; flex-direction: column; gap: 8px">
                <legend style="padding: 0; margin: 0; float: left; width: 100%; font-size: 16px; font-weight: 700">When mail arrives that matches</legend>
                <div role="radiogroup" aria-label="Require all or any of the conditions" style="display: flex; align-items: center; gap: 16px; font-size: 14px; margin-bottom: 2px; flex-wrap: wrap">
                  <label style="display: flex; align-items: center; gap: 8px"><input type="radio" name="ml-rule-any" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">All of these conditions</label>
                  <label style="display: flex; align-items: center; gap: 8px"><input type="radio" name="ml-rule-any" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Any of these conditions</label>
                  <span style="font-size: 13px; color: #5e6168">Match on subject, sender or recipient: is, contains or matches wildcard.</span>
                </div>
                <sc-for list="{{ conditions }}" as="c" hint-placeholder-count="3">
                  <div style="display: grid; grid-template-columns: 160px 180px 1fr 34px; gap: 8px; align-items: center">
                    <button type="button" aria-haspopup="listbox" aria-label="Field: {{ c.field }}" style="{{ chooser }}"><span>{{ c.field }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
                    <button type="button" aria-haspopup="listbox" aria-label="How it matches: {{ c.how }}" style="{{ chooser }}"><span>{{ c.how }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
                    <input type="text" value="{{ c.value }}" aria-label="Value" style="min-width: 0; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
                    <button type="button" aria-label="Remove this condition" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
                  </div>
                </sc-for>
                <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a condition</button>
              </fieldset>

              <fieldset style="margin: 0; padding: 16px 0 0; border: 0; border-top: 1px solid #e4e6ea; display: flex; flex-direction: column; gap: 0">
                <legend style="padding: 0; margin: 0 0 6px; float: left; width: 100%; font-size: 16px; font-weight: 700">Then</legend>
                <sc-for list="{{ actions }}" as="a" hint-placeholder-count="7">
                  <sc-if value="{{ a.heading }}" hint-placeholder-val="{{ false }}"><div style="display: flex; align-items: center; gap: 8px; padding: 12px 0 4px; font-size: 14px"><span style="font-weight: 600">Stop the mail</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #cc0000"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg><span style="font-size: 13px; color: #5e6168">These two lose the mail for good; it never reaches a folder and cannot be brought back.</span></div></sc-if>
                  <div style="display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid #eef0f3">
                    <sc-if value="{{ a.on }}" hint-placeholder-val="{{ true }}"><input type="checkbox" checked aria-label="{{ a.label }}" style="width: 18px; height: 18px; margin: 11px 0 0; accent-color: #3669a5"></sc-if>
                    <sc-if value="{{ a.off }}" hint-placeholder-val="{{ false }}"><input type="checkbox" aria-label="{{ a.label }}" style="width: 18px; height: 18px; margin: 11px 0 0; accent-color: #3669a5"></sc-if>
                    <span style="flex: 0 0 230px; font-size: 14px; line-height: 20px; padding-top: 10px; {{ a.labelStyle }}">{{ a.label }}</span>
                    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
                      <sc-if value="{{ a.hasChooser }}" hint-placeholder-val="{{ false }}"><button type="button" aria-haspopup="listbox" aria-label="{{ a.label }}: {{ a.value }}" style="{{ a.chooserStyle }}"><span style="display: inline-flex; align-items: center; gap: 8px"><sc-if value="{{ a.hasSwatch }}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 5px; background: #ff9d2e"></span></sc-if>{{ a.value }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></sc-if>
                      <sc-if value="{{ a.hasInput }}" hint-placeholder-val="{{ false }}"><input type="text" value="{{ a.value }}" placeholder="{{ a.placeholder }}" aria-label="{{ a.label }}" style="width: 320px; height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></sc-if>
                      <sc-if value="{{ a.hasChoice }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="Forward or redirect" style="display: flex; align-items: center; gap: 16px; font-size: 14px; line-height: 20px"><label style="display: flex; align-items: center; gap: 6px"><input type="radio" name="ml-rule-fwd" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Forward (keep a copy here)</label><label style="display: flex; align-items: center; gap: 6px"><input type="radio" name="ml-rule-fwd" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Redirect (keep no copy)</label></div></sc-if>
                      <sc-if value="{{ a.hasNote }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #5e6168; line-height: 18px">{{ a.note }}</span></sc-if>
                    </div>
                  </div>
                </sc-for>
              </fieldset>

              <div style="display: flex; align-items: center; gap: 8px; padding-top: 4px">
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Save rule</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Cancel</button>
                <span style="flex: 1 1 auto"></span>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Test on the last 50 messages</button>
              </div>
            </div>
          </section>
        </div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Script tab of the same rule: only its own lines, the mistake underlined and named by line</figcaption>
    <div style="position: relative; height: 820px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="245px,765px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="" hint-size="410px,765px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 40px; text-align: center">
        <span style="width: 64px; height: 64px; border-radius: 32px; background: #ffffff; border: 1px solid #e4e6ea; display: inline-flex; align-items: center; justify-content: center; color: #5e6168; margin-bottom: 8px">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2zM22 6l-10 7L2 6"></path></svg>
        </span>
        <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.3">Select a conversation</h2>
        <p style="margin: 0; max-width: 360px; color: #5e6168">Pick one from the list to read it here. Linked conversations show their work package on the right.</p>
      </div>
    </main>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 40px">
        <div role="dialog" aria-modal="true" aria-label="Settings, Rules, edit rule, Script tab" style="position: relative; z-index: 2; width: 960px; min-height: 700px; box-sizing: border-box; display: flex; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
          <div style="flex: 0 0 236px; width: 236px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlSettingsNav" active="Rules" hint-size="236px,680px"></dc-import></div>
          <section aria-label="Rules, edit rule" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
            <div style="flex: none; display: flex; align-items: center; gap: 14px; padding: 16px 16px 16px 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
              <a href="MlRulesScripts.dc.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; color: var(--sc-link, #3669a5); text-decoration: none; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Back to rules</a>
              <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Edit rule</h3>
              <span style="flex: 1 1 auto"></span>
              <button type="button" aria-label="Close settings" style="width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div role="tablist" aria-label="Edit as" style="flex: none; display: flex; align-items: flex-end; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid #c4c7cb">
              <button type="button" role="tab" aria-selected="false" style="min-height: 34px; padding: 8px 12px; border: 1px solid #c4c7cb; border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: #eef0f3; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif">Form</button>
              <button type="button" role="tab" aria-selected="true" style="min-height: 34px; padding: 8px 12px; border: 1px solid #c4c7cb; border-bottom: 1px solid #ffffff; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: #ffffff; color: #1b1c1d; font: 700 14px 'Fira Sans', sans-serif">Script</button>
              <span style="flex: 1 1 auto"></span>
              <span style="align-self: center; padding-bottom: 8px; font-size: 13px; color: #5e6168">Sieve, the filter language your mail server runs. Edit the script by hand here.</span>
            </div>
            <div role="tabpanel" aria-label="Script" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 16px 24px 20px">
            <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><h4 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Kassel: file and label, as script</h4><span style="font-size: 13px; color: #5e6168">edited, not saved</span><span style="flex: 1 1 auto"></span><span style="font-size: 13px; color: #5e6168">Only the lines of this rule. All rules together: <a href="MlRulesScripts.dc.html" style="color: var(--sc-link, #3669a5); font-weight: 600; text-decoration: none">Edit as script</a> under Rules.</span></div>
            <div role="textbox" aria-multiline="true" aria-label="Script, edit by hand" style="display: flex; flex-direction: column; box-sizing: border-box; padding: 8px 0; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px ui-monospace, 'Fira Mono', monospace; line-height: 22px; color: #1b1c1d; overflow: hidden">
              <sc-for list="{{ lines }}" as="l" hint-placeholder-count="12">
                <div style="{{ l.style }}"><span aria-hidden="true" style="flex: none; width: 36px; padding-right: 10px; box-sizing: border-box; text-align: right; color: #5e6168; user-select: none">{{ l.n }}</span><span style="white-space: pre; {{ l.textStyle }}">{{ l.text }}</span></div>
              </sc-for>
            </div>
            <div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #fbeaea; font-size: 14px; line-height: 21px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #cc0000"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg><span><strong style="font-weight: 600">Line 9:</strong> the folder name is not closed, a quote is missing after Kassel. Fix it before saving.</span></div>
            <div style="display: flex; align-items: center; gap: 8px; margin-top: auto">
