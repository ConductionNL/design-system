<head>

<x-dc>
<helmet>

<style>
body{margin:0}

<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1730px; padding: 26px 0; display: flex; flex-direction: column; align-items: center; gap: 24px; overflow: hidden">
  <div style="display: flex; justify-content: center; gap: 32px; width: 1234px">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 390px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Day list; the second time under each start is UTC, named once per day</figcaption>
    <div style="position: relative; width: 390px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: 24px; overflow: hidden">

        <strong style="flex: 1 1 auto; font-size: 17px; font-weight: 600; white-space: nowrap">Mon 12 Oct</strong>
        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Change the time zone, now CEST" style="display: inline-flex; align-items: center; gap: 4px; height: 44px; padding: 0 8px 0 12px; border: 1px solid #ffffff; border-radius: var(--sc-radius, 8px); background: rgba(255,255,255,0.18); color: #ffffff; font: 600 12px 'Fira Sans', sans-serif; white-space: nowrap">CEST<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>

        <sc-for list="{{ strip }}" as="d" hint-placeholder-count="7"><a href="#" aria-current="{{ d.current }}" style="{{ d.style }}"><span style="font-size: 10px; color: #5e6168">{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></a></sc-for>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 390px">

        </sc-for>
        <div style="margin: 6px 0; border-top: 1px solid #e4e6ea"></div>
        <div style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; font-size: 14px; color: #1b1c1d"><span id="cl-ph-second" style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 18px"><span>Also show UTC</span><span style="font-size: 12px; color: #5e6168">A second time under each start</span></span><button type="button" role="switch" aria-checked="true" aria-labelledby="cl-ph-second" style="flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button></div>
      </div>
      <ol style="flex: 1 1 auto; min-height: 0; overflow: hidden; list-style: none; margin: 0; padding: 8px 0 0; display: flex; flex-direction: column">
        <sc-for list="{{ list }}" as="r" hint-placeholder-count="8">

            <a href="{{ r.href }}" style="{{ r.style }}">
              <span style="flex: none; width: 60px; display: flex; flex-direction: column; font-size: 12px; line-height: 16px; color: #1b1c1d"><span style="font-weight: 600">{{ r.start }}</span><span style="color: #5e6168; white-space: nowrap">{{ r.utc }}<sc-if value="{{ r.utcLabel }}" hint-placeholder-val="{{ false }}"> <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.04em">UTC</span></sc-if></span></span>
              <span aria-hidden="true" style="{{ r.edge }}"></span>

            </a>
          </li></sc-if>
        </sc-for>

      <button type="button" aria-label="New event" style="position: absolute; right: 16px; bottom: 72px; width: 52px; height: 52px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 26px; background: var(--sc-action, #3669a5); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(27,28,29,0.2)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
      <nav aria-label="Apps" style="flex: none; height: 56px; display: flex; border-top: 1px solid #e4e6ea; background: #ffffff">

      </nav>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 390px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Invitation open, answered from the bar at the bottom</figcaption>
    <div style="position: relative; width: 390px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: 24px; overflow: hidden">
      <header style="flex: none; height: 55px; padding: 0 8px 0 4px; display: flex; align-items: center; gap: 2px; background: #3669a5; color: #ffffff">
        <a href="#" aria-label="Back to the day list" style="width: 40px; height: 40px; border-radius: var(--sc-radius, 8px); color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
        <strong style="flex: 1 1 auto; font-size: 17px; font-weight: 600">Invitation</strong>
        
        <button type="button" aria-label="More" aria-haspopup="menu" aria-expanded="false" style="width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
      </header>

          <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
