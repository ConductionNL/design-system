# Publish @conduction/docusaurus-preset to npm.
#
# Replaces .forgejo/workflows/release-npm.yml, which ran on Codeberg. That
# forge was retired on 2026-08-04 and nothing on GitHub took over, so the
# package silently stopped being publishable: npm sat at 3.28.0 while every
# merge to main added unreleased work. The giveaway was
# docusaurus-preset/package.json still reading 0.1.1, because the release
# config bumps the version at publish time and never commits it back.
#
# The semantic-release config it runs (docusaurus-preset/.releaserc.json)
# and the whole toolchain in the workspace root were untouched by the
# migration. Only the runner was missing.
#
# Credentials: no secret needed, if trusted publishing is set up.
#
# npm supports trusted publishing over OIDC, so this job can authenticate as
# "this workflow, in this repository" without a long-lived token living in
# repository secrets. That is why the job requests `id-token: write` and why
# .releaserc.json publishes through `npx -y npm@latest`, which is new enough
# to perform the credential exchange (npm 11.5.1+). It also produces a
# provenance attestation, which a token publish does not: none of the
# versions up to 3.28.0 carry one, because they were published by the old
# Codeberg job with a classic token.
#
# The one prerequisite lives on npmjs.com rather than here. Until it is
# configured, a run with id-token: write fails with
#
#   npm error code ENEEDAUTH
#   npm error need auth This command requires you to be logged in
#
# which is what npm says when no trusted publisher matches. To fix it, on
# npmjs.com open the @conduction/docusaurus-preset package settings, add a
# Trusted Publisher, and point it at:
#
#   provider : GitHub Actions
#   owner    : ConductionNL
#   repo     : design-system
#   workflow : release-npm.yml
#
# Nothing in this repository needs to change once that exists.
#
# NPM_TOKEN is still honoured if present, as a fallback. If you use one,
# make it an **automation** token: a "publish" token demands a one-time
# password that CI cannot answer, which is exactly what blocked releasing
# 3.29.0 by hand.

name: Publish to npm

on:
  push:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run semantic-release --dry-run only (no publish)"
        type: boolean
        default: false

concurrency:
  group: release-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # semantic-release pushes the release tag
      issues: write
      pull-requests: write
      id-token: write   # OIDC, so npm trusted publishing needs no token
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semantic-release reads history to pick the version

      # Node 24: semantic-release@24 needs Node ^22.14 || >=24.10, and Node
      # 24 bundles an OIDC-capable npm 11.x. Mirrors ConductionNL/nextcloud-vue,
      # the workflow that publishes cleanly over trusted publishing today.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      # No committed root lockfile (npm workspaces), so `install` rather
      # than `ci`. Installing at the root is what makes the workspace
      # resolve for the package below it.
      - name: Install
        run: npm install

      # Say which credential this run will use, so a failure names itself
      # instead of arriving as a bare 401 from the registry.
      - name: Report the publish credential
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Publishing with NPM_TOKEN."
          else
            echo "No NPM_TOKEN set; relying on npm trusted publishing over OIDC."
            echo "That requires a trusted publisher configured for @conduction/docusaurus-preset on npmjs.com, pointing at this repository and this workflow file."
          fi

      - name: semantic-release
        working-directory: docusaurus-preset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both are empty when no secret exists, which is fine: npm then
          # falls back to the OIDC credential exchange.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Sign a provenance attestation on publish. Only meaningful over
          # OIDC; harmless with a token. Versions <=3.28.0 carry none.
          NPM_CONFIG_PROVENANCE: 'true'
        run: npx semantic-release --extends semantic-release-monorepo ${{ inputs.dry_run && '--dry-run' || '' }}

      # The published version is decided by semantic-release, not by the
      # repo, so state it plainly in the summary. Verifying the dist-tag
      # actually moved is the only proof a release happened: a run can go
      # green having decided there was nothing to release.
      - name: Report the published version
        if: always()
        run: |
          echo "### npm dist-tags for @conduction/docusaurus-preset" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm view @conduction/docusaurus-preset dist-tags 2>&1 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
