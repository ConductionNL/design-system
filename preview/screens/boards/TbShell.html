<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasks: dashboard widget and notifications</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
#tb-add::placeholder{color:var(--sc-work-muted, #5e6168)}
</style>
<style>
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
#ml-search::placeholder{color:#ffffff;opacity:0.85}
</style>
<style>
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>

<body>
<div class="sc-board" data-board="TbShell">

<div style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 14px; line-height: 21px; background: var(--sc-work-ground, #f5f6f8); box-sizing: border-box; width: 1440px; height: 3240px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">a</span> &nbsp;The dashboard with the Tasks widget: a field to add a work package to the chosen project, and the upcoming work packages assigned to you</figcaption>
    <div style="position: relative; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  

<header style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: #ffffff; width: 100%; box-sizing: border-box; height: 55px; padding: 0 16px 0 16px; display: flex; align-items: center; gap: 16px; position: relative; background: var(--sc-primary, #3669a5)">
  <a href="MlInbox.html" style="flex: 0 0 229px; width: 229px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; height: 55px; color: #ffffff; text-decoration: none; min-width: 0">
    <span style="flex: none; width: 30px; height: 30px; overflow: hidden; display: inline-flex; align-items: center"><img src="../assets/zuiddrecht/logo-wit.svg" alt="" style="height: 30px; width: auto; max-width: none" data-sc-logo="logo-wit"></span>
    <span style="display: flex; flex-direction: column; line-height: 1.15; min-width: 0"><span style="font-size: 12px; opacity: 0.85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">OpenProject</span><strong style="font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Dashboard</strong></span>
  </a>
  <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); flex: none; margin-left: -16px"></span>
  <button type="button" aria-label="All apps" aria-haspopup="menu" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: rgba(255,255,255,0.14); color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
    <svg width="20" height="20" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16,20H20V16H16M16,14H20V10H16M10,8H14V4H10M16,8H20V4H16M10,14H14V10H10M4,14H8V10H4M4,20H8V16H4M10,20H14V16H10M4,8H8V4H4V8Z"></path></svg>
  </button>
  <form role="search" style="position: absolute; left: max(calc(50% - 320px), 300px); top: 9px; width: min(640px, calc(100% - 500px)); min-width: 160px; display: flex; align-items: center">
    <label for="ml-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
    <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; top: 10px; color: #ffffff"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
    <input id="ml-search" type="search" placeholder="Search files, mail, events and work packages" style="width: 100%; height: 36px; box-sizing: border-box; padding: 0 44px 0 36px; border: 1px solid #ffffff; border-radius: var(--sc-radius-lg, 10px); background: rgba(255,255,255,0.12); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">
    <button type="button" aria-label="Search filters" aria-haspopup="menu" style="position: absolute; right: 4px; top: 4px; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg>
    </button>
  </form>
  <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 4px; min-width: max-content">
    <button type="button" aria-label="Notifications, 2 new" aria-haspopup="dialog" aria-expanded="false" style="position: relative; width: 36px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span aria-hidden="true" style="position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; box-sizing: border-box; padding: 0 4px; border-radius: 8px; background: #cf222e; color: #ffffff; font: 700 10px/16px var(--sc-font, 'Fira Sans'), sans-serif; text-align: center">2</span>
    </button>
    <button type="button" aria-label="Help" style="width: 36px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
    </button>
    <button type="button" aria-label="Settings" style="width: 36px; height: 36px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: inline-flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path></svg>
    </button>
    <button type="button" aria-label="Account menu of Olivia Brandt" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 8px; height: 36px; margin-left: 6px; padding: 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff">
      <span style="width: 30px; height: 30px; border-radius: 15px; background: #ffffff; color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center; font: 700 12px var(--sc-font, 'Fira Sans'), sans-serif">OB</span>
      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</header>

  <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 32px">
    <div style="display: flex; align-items: baseline; gap: 12px"><h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 34px">Good morning, Olivia</h1><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">Monday 12 October 2026</span></div>
    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: start">
      <section aria-label="Tasks" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
          <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--sc-primary, #3669a5)"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
          <h2 style="flex: 1 1 auto; margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Tasks</h2>
          <span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">Upcoming work packages, assigned to you</span>
          <button type="button" aria-label="Widget options for Tasks" aria-haspopup="menu" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-muted, #5e6168); display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
        </div>
        <form style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea); background: var(--sc-work-ground, #f5f6f8)">
          <label for="tb-add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add a work package</label>
          <div style="position: relative; flex: 1 1 auto; display: flex; align-items: center">
            <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: var(--sc-work-muted, #5e6168)"><path d="M12 5v14M5 12h14"></path></svg>
            <input id="tb-add" type="text" placeholder="Add a work package" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 36px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">
          </div>
          <button type="button" style="flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Add</button>
          <button type="button" aria-haspopup="menu" aria-label="Project: Northwind rollout Lyon, change" style="flex: 1 1 100%; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; height: 40px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap"><span><span style="color: var(--sc-work-muted, #5e6168)">Project: </span>Northwind rollout Lyon</span><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        </form>
        <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
          
            <li style="display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
              
              <input type="checkbox" aria-label="Mark as closed: TASK #58455, Prepare demo for Malmo Energi" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
              <a href="TbCard.html" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 18px; color: var(--sc-work-ink, #1b1c1d); text-decoration: none">
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; ">Prepare demo for Malmo Energi</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><span style="display: inline-flex; align-items: center; gap: 4px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #08a5df">TASK</span><span>#58455</span><span style="flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: #c3fae8; border: 1.5px solid #7bf4cc"></span></span><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">from the mail of Sven Lindqvist</span></span>
              </a>
              <span style="flex: none; font-size: 12px; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); font-weight: 600">Tue 13 Oct</span>
            </li>
          
            <li style="display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
              
              <input type="checkbox" aria-label="Mark as closed: BUG #58231, Gantt PDF export drops trailing columns" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
              <a href="TbCard.html" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 18px; color: var(--sc-work-ink, #1b1c1d); text-decoration: none">
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; ">Gantt PDF export drops trailing columns</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><span style="display: inline-flex; align-items: center; gap: 4px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #ab0000">BUG</span><span>#58231</span><span style="flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: #66d9e8; border: 1.5px solid #21c8de"></span></span><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">priority high, version 16.5</span></span>
              </a>
              <span style="flex: none; font-size: 12px; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); font-weight: 600">Wed 14 Oct</span>
            </li>
          
            <li style="display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
              
              <input type="checkbox" aria-label="Mark as closed: TASK #58441, Move kick-off to the afternoon" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
              <a href="TbCard.html" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 18px; color: var(--sc-work-ink, #1b1c1d); text-decoration: none">
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; ">Move kick-off to the afternoon</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><span style="display: inline-flex; align-items: center; gap: 4px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #08a5df">TASK</span><span>#58441</span><span style="flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: #c3fae8; border: 1.5px solid #7bf4cc"></span></span><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">from the mail of Marc Dubois</span></span>
              </a>
              <span style="flex: none; font-size: 12px; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); font-weight: 600">Thu 15 Oct</span>
            </li>
          
            <li style="display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
              <input type="checkbox" checked aria-label="Reopen TASK #58440, Send OIDC client settings to Lyon" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
              
              <a href="TbCard.html" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 18px; color: var(--sc-work-ink, #1b1c1d); text-decoration: none">
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: var(--sc-work-muted, #5e6168); text-decoration: line-through">Send OIDC client settings to Lyon</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><span style="display: inline-flex; align-items: center; gap: 4px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #08a5df">TASK</span><span>#58440</span><span style="flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: #dee2e6; border: 1.5px solid #adb5bd"></span></span><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Closed just now from the dashboard</span></span>
              </a>
              <span style="flex: none; font-size: 12px; white-space: nowrap; color: var(--sc-work-muted, #5e6168); text-decoration: line-through">Fri 16 Oct</span>
            </li>
          
            <li style="display: flex; align-items: center; gap: 10px; min-height: 56px; box-sizing: border-box; padding: 6px 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
              
              <input type="checkbox" aria-label="Mark as closed: EPIC #57990, Release 16.5 scope" style="flex: none; width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)">
              <a href="TbCard.html" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 18px; color: var(--sc-work-ink, #1b1c1d); text-decoration: none">
                <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; ">Release 16.5 scope</span>
                <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><span style="display: inline-flex; align-items: center; gap: 4px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #005b77">EPIC</span><span>#57990</span><span style="flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: #d3f9d8; border: 1.5px solid #8ff09c"></span></span><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">in review since 9 Oct</span></span>
              </a>
              <span style="flex: none; font-size: 12px; white-space: nowrap; color: var(--sc-work-muted, #5e6168)">Fri 23 Oct</span>
            </li>
          
        </ol>
        <a href="TbMyDay.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; font-size: 13px; font-weight: 600; color: var(--sc-link, var(--sc-primary, #3669a5)); text-decoration: none">Open Tasks<svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></a>
      </section>
      <section aria-label="Unread mail" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px); overflow: hidden">
        <div style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
