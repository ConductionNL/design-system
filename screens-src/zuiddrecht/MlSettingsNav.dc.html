<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: settings section list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<nav aria-label="Settings sections" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; width: 236px; box-sizing: border-box; min-height: 100%; padding: 20px 12px 16px; display: flex; flex-direction: column; gap: 1px; background: #f5f6f8; border-right: 1px solid #e4e6ea">
  <h2 id="ml-settings-title" style="margin: 0 0 12px; padding: 0 10px; font-size: 20px; font-weight: 700; line-height: 24px">Settings</h2>
  <sc-for list="{{ sections }}" as="s" hint-placeholder-count="14">
    <a href="{{ s.href }}" aria-current="{{ s.current }}" style="{{ s.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ s.icon }}"></path></svg><span style="flex: 1 1 auto; min-width: 0; line-height: 17px">{{ s.label }}</span></a>
  </sc-for>
  <div style="margin-top: auto; padding-top: 12px; border-top: 1px solid #e4e6ea; display: flex; align-items: center; gap: 10px; min-height: 44px; padding-left: 8px; padding-right: 8px">
    <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">OB</span>
    <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; line-height: 1.25"><strong style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Olivia Brandt</strong><span style="font-size: 12px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">olivia@northwind-projects.test</span></span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Account"},"$preview":{"width":236,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    // Older labels still select the renamed entry.
    const alias = { 'Signatures and sender names': 'Signatures and sender addresses', 'Appearance': 'Appearance and behaviour' };
    const given = this.props.active ?? 'Account';
    const active = alias[given] ?? given;
    const I = {
      user: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
      pen: 'M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z',
      reply: 'M9 17 4 12l5-5M20 18v-2a4 4 0 0 0-4-4H4',
      sun: 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42',
      funnel: 'M22 3H2l8 9.46V19l4 2v-8.54L22 3z',
      search: 'M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14',
      users: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      bell: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0',
      transfer: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
      shield: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z',
      link: 'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71',
      blocks: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
      bolt: 'M13 2 3 14h9l-1 8 10-12h-9l1-8z',
      keys: 'M4 6h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8'
    };
    // [label, icon, board that shows this section]
    const raw = [
      ['Account', I.user, 'MlSettingsAccount.dc.html'],
      ['Signatures and sender addresses', I.pen, 'MlSettingsSignatures.dc.html'],
      ['Text blocks', I.blocks, 'MlSettingsTextBlocks.dc.html'],
      ['Automatic reply', I.reply, 'MlSettingsAutoReply.dc.html'],
      ['Appearance and behaviour', I.sun, 'MlSettingsAppearance.dc.html'],
      ['Rules', I.funnel, 'MlRules.dc.html'],
      ['Quick actions', I.bolt, 'MlSettingsQuickActions.dc.html'],
      ['Search and clean-up', I.search, 'MlOrganiseSettings.dc.html'],
      ['Delegation', I.users, 'MlSharedDelegation.dc.html'],
      ['Notifications', I.bell, 'MlNotificationSettings.dc.html'],
      ['Import and export', I.transfer, 'MlImportExport.dc.html'],
      ['Privacy and security', I.shield, 'MlPrivacySettings.dc.html'],
      ['OpenProject', I.link, 'MlSettings.dc.html'],
      ['Shortcuts', I.keys, '#']
    ];
    const base = 'display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 10px; box-sizing: border-box; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 14px; line-height: 21px; ';
    const sections = raw.map(([label, icon, href]) => {
      const on = label === active;
      return { label, icon, href, current: on ? 'page' : 'false', style: base + (on ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;') };
    });
    return { sections };
  }
}
</script>
</body>
</html>
