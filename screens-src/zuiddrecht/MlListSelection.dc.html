<head>
<meta charset="utf-8">
<title>Mail: several conversations selected with the bulk bar</title>

body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>

    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Five conversations selected, a range among them: the bulk bar takes the place of the list head with Archive, Delete and Move to folder on one row and More beside the count; the reading pane says what is selected</figcaption>

      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="245px,945px"></dc-import></div>

          <div role="toolbar" aria-label="Actions for the selected conversations" style="flex: none; display: flex; flex-direction: column; background: #eaf0f7; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 8px 0 16px; box-sizing: border-box">

              <strong style="flex: 1 1 auto; font-size: 20px; font-weight: 700; line-height: 1.2; white-space: nowrap">5 selected</strong>
              <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for the selected conversations" style="{{ bulkBtn }}">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>

            </div>
          </div>
          <ol style="flex: none; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
              <li style="{{ r.style }}">
                <div style="display: flex; align-items: flex-start; gap: 8px; height: 78px; box-sizing: border-box; padding: 9px 14px 9px 14px; color: #1b1c1d">

                  <span style="{{ r.avatar }}">{{ r.initials }}</span>
