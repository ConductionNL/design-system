<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Menu Mijn Esdoornveen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Mijn Esdoornveen" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1a1a1a; width: 100%; display: flex; flex-direction: column; gap: 24px">
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div>
      <h2 style="margin: 0 0 6px; padding: 0 12px; font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #4a4a4a">{{ g.title }}</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 2px">
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <li><a href="{{ it.href }}" style="{{ it.style }}" aria-current="{{ it.current }}"><span>{{ it.label }}</span><sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 12px; background: #c2255c; color: #ffffff; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center" aria-label="{{ it.badgeLabel }}">{{ it.badge }}</span></sc-if></a></li>
        </sc-for>
      </ul>
    </div>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Overzicht"},"$preview":{"width":320,"height":666}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Overzicht';
    const raw = [
      { title: 'Mijn Esdoornveen', items: [['Overzicht', 'MijnOverzicht.dc.html'], ['Berichten', 'Berichten.dc.html', 2]] },
      { title: 'Mijn opleiding', items: [['Rooster', 'MijnOverzicht.dc.html'], ['BPV en uren', 'MijnLijst.dc.html', 1], ['Beoordelingen', 'Detail.dc.html'], ['Examens', 'MijnOverzicht.dc.html'], ['Keuzedelen', 'MijnOverzicht.dc.html']] },
      { title: 'Regelen', items: [['Ziek melden', 'Contentpagina.dc.html'], ['Gesprekken', 'MijnOverzicht.dc.html'], ['Documenten', 'Documenten.dc.html']] },
      { title: 'Account', items: [['Mijn gegevens', 'MijnOverzicht.dc.html']] }
    ];
    const base = 'display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 8px 12px; border-radius: 4px; font-size: 17px; text-decoration: none; ';
    const groups = raw.map((g) => ({
      title: g.title,
      items: g.items.map(([label, href, badge]) => {
        const on = label === active;
        return {
          label, href, badge: badge ?? '', hasBadge: !!badge,
          badgeLabel: badge ? badge + ' nieuw' : '',
          current: on ? 'page' : 'false',
          style: base + (on ? 'color: #9c1c49; font-weight: 700; background: #fbe9f0;' : 'color: #5b2e91; font-weight: 500;')
        };
      })
    }));
    return { groups };
  }
}
</script>
</body>
</html>
