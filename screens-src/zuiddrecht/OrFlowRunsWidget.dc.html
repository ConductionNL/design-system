<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Flow: runs-widget</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<section data-or-flow="runswidget" aria-labelledby="orfl-widget-title" style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; box-sizing: border-box; background: #ffffff; border: 1px solid #e4e6ea; border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="#3669a5" aria-hidden="true"><path d="M9,2V8H11V11H5C3.89,11 3,11.9 3,13V16H1V22H7V16H5V13H11V16H9V22H15V16H13V13H19V16H17V22H23V16H21V13C21,11.9 20.11,11 19,11H13V8H15V2H9Z"></path></svg><h2 id="orfl-widget-title" style="flex: 1; margin: 0; font-size: 16px; font-weight: 700">{{ title }}</h2><a href="{{ allHref }}" style="font-size: 13px; font-weight: 600">{{ allLabel }}</a></div>
  <sc-if value="{{ hasError }}" hint-placeholder-val="{{ false }}"><div role="alert" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #fcedec; color: #a30000"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M11,15H13V17H11V15M11,7H13V13H11V7M12,2C6.47,2 2,6.5 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20Z"></path></svg><span style="font-size: 13px; line-height: 1.45">{{ error }}</span></div></sc-if>
  <sc-if value="{{ hasRows }}" hint-placeholder-val="{{ true }}">
  <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
      <li style="display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid #eef0f3">
        <span aria-hidden="true" style="{{ r.dot }}"></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px"><a href="{{ r.href }}" style="font-size: 14px; font-weight: 600; color: #1b1c1d; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.flow }}</a><span style="font-size: 13px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.subject }}</span></span>
        <span style="{{ r.pill }}">{{ r.word }}</span>
        <span style="flex: none; font-size: 13px; color: #5e6168; font-variant-numeric: tabular-nums; white-space: nowrap">{{ r.when }}</span>
      </li>
    </sc-for>
  </ul>
  </sc-if>
  <sc-if value="{{ hasQuiet }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #3d4047"><svg width="18" height="18" viewBox="0 0 24 24" fill="#1e6b2a" aria-hidden="true"><path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z"></path></svg>{{ quiet }}</p></sc-if>
  <sc-if value="{{ hasHidden }}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; color: #5e6168">{{ hidden }}</span></sc-if>
  <sc-if value="{{ hasHistory }}" hint-placeholder-val="{{ true }}">
  <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 4px">
    <h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ historyTitle }}</h3>
    <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{ history }}" as="h" hint-placeholder-count="3"><li style="display: flex; align-items: center; gap: 10px; font-size: 13px"><span aria-hidden="true" style="{{ h.dot }}"></span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ h.flow }}</span><span style="color: #5e6168">{{ h.word }}</span><span style="color: #5e6168; font-variant-numeric: tabular-nums; white-space: nowrap">{{ h.when }}</span></li></sc-for>
    </ul>
  </div>
  </sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Lopende flows"},"allLabel":{"editor":"text","default":"Alle flows"},"allHref":{"editor":"text","default":"OrFlows.dc.html"},"rows":{"editor":null,"default":[["Melding afhandelen","MOR-2026-04812 · Lantaarnpaal kapot","waiting","10:12"],["Melding afhandelen","MOR-2026-04811 · Zwerfvuil Parkstraat","running","10:07"],["Nachtelijke sync","Productcatalogus","alert","02:00"]]},"quiet":{"editor":"text","default":""},"hidden":{"editor":"text","default":"Nog 4 runs van flows waar u niet bij kunt."},"error":{"editor":"text","default":""},"historyTitle":{"editor":"text","default":"Afgerond vandaag"},"history":{"editor":null,"default":[["Melding afhandelen","geslaagd","09:51"],["Melding afhandelen","geslaagd","09:40"],["Beschikking maken bij besluit","mislukt","08:30"]]},"flowHref":{"editor":"text","default":"OrFlowRun.dc.html"},"$preview":{"width":420,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const J = (v, d) => { if (v == null || v === '') return d; if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return d; } } return v; };
    const OUT = { success: ['Geslaagd', '#e7f3ea', '#1e6b2a', '#1e6b2a'], warning: ['Waarschuwing', '#fff4de', '#7a4f00', '#b27300'], alert: ['Mislukt', '#fcedec', '#a30000', '#cc0000'], waiting: ['Wacht op taak', '#e3f1f3', '#1d5e66', '#1d5e66'], running: ['Bezig', '#eaf0f7', '#234a78', '#3669a5'], geslaagd: ['Geslaagd', '#e7f3ea', '#1e6b2a', '#1e6b2a'], mislukt: ['Mislukt', '#fcedec', '#a30000', '#cc0000'] };
    const dot = (o) => 'flex: none; width: 10px; height: 10px; border-radius: 5px; background: ' + o[3];
    const rows = J(p.rows, []).map((r) => { const o = OUT[r[2]] || OUT.running; return { flow: r[0], subject: r[1] || '', word: o[0], when: r[3], href: p.flowHref || '#', dot: dot(o), pill: 'flex: none; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; background: ' + o[1] + '; color: ' + o[2] }; });
    const history = J(p.history, []).map((h) => { const o = OUT[h[1]] || OUT.success; return { flow: h[0], word: o[0].toLowerCase(), when: h[2], dot: dot(o) }; });
    return { title: p.title, allLabel: p.allLabel, allHref: p.allHref || '#', hasError: !!p.error, error: p.error, hasRows: rows.length > 0, rows, hasQuiet: !!p.quiet, quiet: p.quiet, hasHidden: !!p.hidden, hidden: p.hidden, hasHistory: history.length > 0, historyTitle: p.historyTitle, history };
  }
}
</script>
</body>
</html>
