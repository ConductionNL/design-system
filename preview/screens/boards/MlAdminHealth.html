                    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px"><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #d3f9d8; box-shadow: 0 0 0 2px #8ff09c"></span>Finished 00:05, took 6 seconds</span>
                  </div>
                  <button type="button" style="display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Open report</button>
                </div>
                <div style="display: flex; align-items: center; gap: 8px" role="progressbar" aria-label="Rewrite automatic replies: 18 people" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span style="display: inline-block; width: 120px; height: 6px; border-radius: 3px; background: var(--sc-work-soft, #eef0f3); overflow: hidden; vertical-align: middle"><span style="display: block; width: 100%; height: 100%; background: #8ff09c"></span></span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168); min-width: 32px; text-align: right">100%</span></div>
                <span style="font-size: 12px; color: var(--sc-work-text, #3d4047); line-height: 18px">2 replies changed: Priya Raman starts her leave today, Tom Achterberg is back</span>
              </div>
            
            <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--sc-work-line, #e4e6ea); border-left: 3px solid var(--sc-primary, #3669a5); border-radius: var(--sc-radius, 8px); background: var(--sc-primary-light, #eaf0f7); font-size: 13px; line-height: 19px; color: var(--sc-work-ink, #1b1c1d)"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--sc-primary, #3669a5)"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span>Tasks keep running when you leave this page. Come back here to wait for one to finish, or have a mail sent to the alert address when it does.</span></div>
            <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 14px; line-height: 20px"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 1px 0 0; accent-color: var(--sc-primary, #3669a5)">Mail me when a task finishes or fails</label>
          </section>
        </div>
      </main>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">c</span> &nbsp;Tab Operations log: what happened in mailboxes, with the switch, how long it is kept, and the save row</figcaption>
    <div style="height: 620px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">
        <div role="tablist" aria-label="Health" style="display: flex; gap: 4px; border-bottom: 1px solid var(--sc-work-field, #c4c7cb)">
          <button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 8px 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: var(--sc-work-soft, #eef0f3); color: var(--sc-work-ink, #1b1c1d); font: 500 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; cursor: pointer; ">Status</button>
          <button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 8px 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: var(--sc-work-soft, #eef0f3); color: var(--sc-work-ink, #1b1c1d); font: 500 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; cursor: pointer; ">Maintenance</button>
          <button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 8px 12px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-bottom: none; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0; margin-bottom: -1px; background: var(--sc-work-soft, #eef0f3); color: var(--sc-work-ink, #1b1c1d); font: 500 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; cursor: pointer; background: #ffffff; border-bottom: 1px solid #ffffff; font-weight: 700">Operations log</button>
        </div>
        <section aria-labelledby="ml-h-log" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px; background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <h2 id="ml-h-log" style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Mailbox operations log</h2>
              <p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Writes a line for every move, delete, flag and copy in every mailbox, with who did it and when. Handy when a person asks where a message went. 2,418 operations today, 1.1 MB.</p>
            </div>
            <div style="flex: none; display: flex; flex-direction: column; gap: 10px; align-items: flex-start">
              <div style="display: flex; align-items: center; gap: 12px"><label for="ml-h-log-switch" style="font-size: 14px; font-weight: 600">Keep a log</label><button id="ml-h-log-switch" type="button" role="switch" aria-checked="true" style="flex: none; position: relative; width: 42px; height: 24px; margin-top: 0; padding: 0; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: 12px; background: var(--sc-action, var(--sc-primary, #3669a5)); box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff"></span></button></div>
              <div style="display: flex; align-items: center; gap: 12px"><label for="ml-h-log-keep" style="font-size: 13px; color: var(--sc-work-text, #3d4047)">Kept for</label><select id="ml-h-log-keep" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); max-width: 100%"><option>7 days</option><option selected>30 days</option><option>90 days</option></select></div>
            </div>
          </div>
          <div style="background: #ffffff; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: var(--sc-radius-lg, 10px); overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px">
            <thead><tr style="background: #fafbfc"><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">When</th><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">Who</th><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">Did what</th></tr></thead>
            <tbody>
              
                <tr style="border-top: 1px solid var(--sc-work-soft, #eef0f3)"><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">07:13</td><td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600; white-space: nowrap">Olivia Brandt</td><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-text, #3d4047)">Moved "Invoice 2026-10-0193 is available" from Inbox to Archive</td></tr>
              
                <tr style="border-top: 1px solid var(--sc-work-soft, #eef0f3)"><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">07:11</td><td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600; white-space: nowrap">Tom Achterberg</td><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-text, #3d4047)">Flagged "Scope for release 16.5" as starred</td></tr>
              
                <tr style="border-top: 1px solid var(--sc-work-soft, #eef0f3)"><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">07:08</td><td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600; white-space: nowrap">Priya Raman</td><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-text, #3d4047)">Deleted "Angebot Schulung Projektleiter, 12 Personen" from Customers / Kassel</td></tr>
              
                <tr style="border-top: 1px solid var(--sc-work-soft, #eef0f3)"><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">07:02</td><td style="padding: 14px 16px; line-height: 20px; font-size: 15px; font-weight: 600; white-space: nowrap">Ines Okafor</td><td style="padding: 14px 16px; line-height: 20px; color: var(--sc-work-text, #3d4047)">Copied "Rollout plan phase 2, Lyon" to Customers / Lyon on behalf of Olivia Brandt</td></tr>
              
            </tbody>
          </table></div>
          <div><a href="#" style="font-size: 14px; color: var(--sc-link, var(--sc-primary, #3669a5)); text-decoration: none; font-weight: 600">Open the full log</a></div>
        </section>
        <div style="margin-top: auto; display: flex; align-items: center; gap: 8px; padding-top: 16px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
          <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Save changes</button>
          <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Discard</button>
          <span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">Saves the self-test schedule, the alert address and how long the log is kept. Starting a job or cutting off a connection happens at once.</span>
        </div>
      </main>
    </div>
  </figure>
</div>
</div>
