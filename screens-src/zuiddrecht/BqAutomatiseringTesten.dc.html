<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: flex; flex-direction: column; min-height: 1200px; position: relative">

<dc-import name="OrFlowKop" title="Klacht ter goedkeuring" state="actief" mode="lijst" crumbs='[["Apps", "BqApps.dc.html"], ["pipelinq", "BqApp.dc.html"], ["Automatiseringen", "BqAutomatiseringen.dc.html"]]' meta="klacht-goedkeuring · versie Ontwikkeling 1.1.1 · wanneer, wat, en dan: een trigger, een voorwaarde als u wilt, en een of meer acties" pill="Laatste run vandaag 10:42 wacht op goedkeuring" actions='["check", "test", "more"]' primary="Opslaan" canvas-href="#" list-href="BqAutomatiseringBewerken.dc.html" notice="Een automatisering wordt omgezet naar de bouwstenen van OpenRegister: een regel, een flow, een melding. Aan- en uitzetten gebeurt voor die bouwstenen samen. Kopieert u een versie, dan gaan de automatiseringen mee."></dc-import><div style="display: flex; align-items: flex-start; gap: 12px"><div style="flex: 1 1 auto; min-width: 0"><dc-import name="OrFlowStappenlijst" flow="{{ flow }}" selected="" trigger-title="Wanneer" steps-title="Wat, en dan" add-label="Actie toevoegen"></dc-import></div><div style="flex: 0 0 460px; width: 460px"><dc-import name="OrFlowTestrunKaart" title="Automatisering testen" when="" intro="Een droge run: de trigger, de voorwaarde en de acties worden doorgerekend op een voorbeeld, zonder iets op te slaan of te versturen." payload="{{ payload }}" subject-head="Onderdeel" rows='[["Trigger", "", "Bij een statusovergang", "Past: schema klacht, overgang indienen", "success"], ["Voorwaarde", "", "Alleen als", "bedrag 450 is groter dan 250, dus door", "success"], ["Actie 1", "", "Goedkeuring vragen", "Taak voor KCC-teamleiders, termijn 3 werkdagen", "info"], ["Actie 2", "", "Document maken", "Sjabloon Besluit op klacht gevonden; zou bijvoegen aan klacht 2026-0481", "success"], ["Actie 3", "", "Melding sturen", "De indiener heeft geen e-mailadres: zou overslaan", "warning"]]' footer="Er is niets opgeslagen of verstuurd."></dc-import></div></div>
      </main>
    </div>
  </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const nav = [
      { title: '', items: [['Dashboard', 'dashboard']] },
      { title: 'Bouwen', items: [['Apps', 'org'], ["Schema's", 'queue'], ["Pagina's", 'doc']] },
      { title: 'Uitrollen', items: [['Versies en exports', 'trend'], ['Marktplaats', 'products']] }

    const flow = {"nodes": [{"id": "t", "kind": "trigger", "title": "Bij een statusovergang", "sub": "schema klacht, overgang indienen", "col": 0, "row": 0}, {"id": "c", "kind": "condition", "title": "Alleen als", "sub": "bedrag groter dan 250", "col": 0, "row": 1}, {"id": "a1", "kind": "approval", "title": "Goedkeuring vragen", "sub": "aan KCC-teamleiders, 3 werkdagen", "col": 0, "row": 2}, {"id": "a2", "kind": "document", "title": "Document maken", "sub": "sjabloon Besluit op klacht, bijvoegen aan het object", "col": 0, "row": 3, "app": "filinq"}, {"id": "a3", "kind": "message", "title": "Melding sturen", "sub": "naar de indiener", "col": 0, "row": 4}, {"id": "e", "kind": "end", "title": "Einde", "sub": "", "col": 0, "row": 5}], "edges": [["t", "c"], ["c", "a1", "voldaan"], ["c", "e", "niet voldaan"], ["a1", "a2"], ["a2", "a3"], ["a3", "e"]]};

    return { nav, flow, payload };
