<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: manage labels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2560px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Manage labels, opened from New label in the folder column: the tree on the left, one label edited on the right</figcaption>
    <div style="position: relative; height: 1040px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" hint-size="264px,985px"></dc-import></div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" wide="true" selected="" hint-size="1145px,985px"></dc-import></div>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: center; justify-content: center">

            <h2 id="ml-labels-title" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Manage labels</h2>

          </div>
          <div style="flex: 1 1 auto; min-height: 0; display: flex">
            <section aria-label="Label tree" style="flex: 0 0 340px; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; border-right: 1px solid #e4e6ea; background: #ffffff">
              <div style="flex: none; display: flex; align-items: center; gap: 6px; padding: 12px 12px 8px">

                <span style="position: relative; display: inline-flex"><button type="button" aria-label="Expand all" title="Expand all" style="flex: none; width: 40px; height: 40px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #eef0f3; color: #1b1c1d; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg></button><span role="tooltip" style="position: absolute; left: 50%; top: 44px; transform: translateX(-50%); padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 5">Expand all</span></span>
                <button type="button" aria-label="Collapse all" title="Collapse all" style="flex: none; width: 40px; height: 40px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 11-5-5-5 5M17 18l-5-5-5 5"></path></svg></button>
              </div>
              <div style="flex: none; padding: 0 22px 6px; font-size: 13px; color: #5e6168; line-height: 18px">7 labels, 3 of them nested. Drag a label onto another to nest it. On a conversation a nested label reads Offer / Training.</div>
              <ul role="tree" aria-label="Labels" style="list-style: none; margin: 0; padding: 0 12px; display: flex; flex-direction: column; gap: 1px">
                <sc-for list="{{ tree }}" as="t" hint-placeholder-count="7">
                  <li role="treeitem" aria-selected="{{ t.on }}" style="{{ t.style }}">
                    <sc-if value="{{ t.hasChevron }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ t.chevron }}"></path></svg></sc-if>
                    <sc-if value="{{ t.noChevron }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 16px"></span></sc-if>
                    <span style="{{ t.swatch }}"></span>
                    <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.label }}</span>
                    <span style="flex: none; font-size: 12px; color: #5e6168">{{ t.count }}</span>
                  </li>
                </sc-for>
              </ul>
              <div style="flex: 1 1 auto"></div>
              <div style="flex: none; padding: 10px 22px 14px; border-top: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 18px">A label can sit on many conversations at once. A folder holds a conversation in one place.</div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px">
                <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: #1b1c1d"><span>Name</span><input type="text" value="Waiting for customer" style="height: 40px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d"></label>

              </div>

                <legend style="padding: 0; margin: 0 0 2px; font-size: 14px; line-height: 20px; font-weight: 600; color: #1b1c1d">Colour</legend>
                <div role="radiogroup" aria-label="Label colour" style="display: flex; align-items: center; gap: 8px">
                  <sc-for list="{{ colours }}" as="c" hint-placeholder-count="8"><button type="button" role="radio" aria-checked="{{ c.on }}" aria-label="{{ c.name }}" style="{{ c.style }}"><sc-if value="{{ c.isOn }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button></sc-for>
                  <span style="font-size: 13px; color: #5e6168; margin-left: 4px">Orange, shown as a dot in the folder column and on each row.</span>
                </div>
              </fieldset>
              <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: #1b1c1d">
                <span>When to apply this label (used for suggestions)</span>
                <textarea rows="3" style="box-sizing: border-box; padding: 9px 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; line-height: 21px; color: #1b1c1d; resize: none">A customer asked us something and we still have to answer, or a customer says they will come back to us with a decision.</textarea>
                <span style="font-weight: 400; font-size: 13px; color: #5e6168; line-height: 18px">The assistant reads this to suggest the label on new mail, marked Generated until you confirm it. Write it the way you would explain it to a colleague. Suggestions are on, <a href="MlSettingsAccount.dc.html" style="color: var(--sc-link, #3669a5); font-weight: 600; text-decoration: none">change</a></span>
              </label>
              <div style="display: flex; align-items: center; gap: 8px; padding-top: 14px; border-top: 1px solid #e4e6ea">
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Save label</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Cancel</button>
                <span style="flex: 1 1 auto"></span>
                <button type="button" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Delete label</button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </figure>

    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Delete label pressed: the confirmation takes the place of Save label and Cancel until you answer it</figcaption>

              </div>
              <div style="flex: none; padding: 0 22px 6px; font-size: 13px; color: #5e6168; line-height: 18px">7 labels, 3 of them nested. Drag a label onto another to nest it. On a conversation a nested label reads Offer / Training.</div>

                    <sc-if value="{{ t.noChevron }}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 16px"></span></sc-if>
                    <span style="{{ t.swatch }}"></span>

                    <span style="flex: none; font-size: 12px; color: #5e6168">{{ t.count }}</span>
                  </li>
                </sc-for>
              </ul>
              <div style="flex: 1 1 auto"></div>
              <div style="flex: none; padding: 10px 22px 14px; border-top: 1px solid #e4e6ea; font-size: 12px; color: #5e6168; line-height: 18px">A label can sit on many conversations at once. A folder holds a conversation in one place.</div>
            </section>

                  <span>Delete Waiting for customer? It is taken off all 14 conversations that carry it. The conversations themselves stay where they are.</span>
