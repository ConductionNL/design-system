<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: invitation card in a message and a new event from a mail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1760px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The invitation from Tom open as an event card: answer it, pick the calendar, open or download it</figcaption>
    <div style="height: 880px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" folded="true" hint-size="64px,825px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="11" hint-size="410px,825px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; align-items: flex-start; gap: 6px">
              <button type="button" aria-label="Star this conversation" aria-pressed="false" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true" style="width: 20px; height: 20px"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
              <h1 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 20px; font-weight: 700; line-height: 34px">Invitation: Rollout review Lyon, phase 2</h1>
              <button type="button" aria-label="Close conversation" title="Close conversation" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <div role="toolbar" aria-label="Conversation actions" style="display: flex; gap: 2px">
                <sc-for list="{{ tools }}" as="t" hint-placeholder-count="4"><span style="position: relative; display: inline-flex"><button type="button" aria-label="{{ t.label }}" title="{{ t.label }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><sc-if value="{{ t.hasLabel }}" hint-placeholder-val="{{ false }}">{{ t.label }}</sc-if></button><sc-if value="{{ t.tip }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 56px; bottom: 38px; padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 5">{{ t.label }}</span></sc-if></span></sc-for>
                <button type="button" aria-haspopup="menu" aria-label="More actions for this conversation" style="display: inline-flex; align-items: center; gap: 4px; height: 34px; margin-left: 4px; padding: 0 8px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              </div>
              <button type="button" aria-haspopup="menu" aria-keyshortcuts="L" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Link to work package</button>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
              <span style="white-space: nowrap">1 message · Inbox</span>
            </div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px">
            <article aria-label="Message from Tom Achterberg, 9 October" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
                <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">TA</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                  <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Tom Achterberg</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">tom@northwind-projects.test</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">9 Oct 09:40</span></div>
                  <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt, Marc Dubois, Priya Raman</span></div>
                </div>
                <button type="button" aria-label="More actions for this message" aria-haspopup="menu" style="flex: none; width: 28px; height: 28px; margin: -4px -6px 0 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
              </div>

              <section aria-label="Invitation" style="margin: 12px 14px 0 88px; display: flex; flex-direction: column; gap: 12px; padding: 12px 14px 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff">
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="flex: none; width: 28px; height: 28px; border-radius: 14px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></span>
                  <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Invitation from Tom Achterberg</span>
                  <span style="flex: 1 1 auto"></span>
                  <a href="ClEvent.dc.html" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"></path></svg>Open in Calendar</a>
                  <button type="button" aria-label="Download the invitation file, invite.ics" title="Download the invitation file, invite.ics" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Download .ics</button>
                </div>
                <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Rollout review Lyon, phase 2</h2>
                <dl style="margin: 0; display: grid; grid-template-columns: 88px 1fr; gap: 4px 12px; font-size: 14px; line-height: 20px">
                  <dt style="color: #5e6168">When</dt><dd style="margin: 0">Thursday 15 October 2026, 14:00 to 15:00, 1 h</dd>
                  <dt style="color: #5e6168">Repeats</dt><dd style="margin: 0; display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"></path></svg>Every 2 weeks on Thursday, until 10 December</dd>
                  <dt style="color: #5e6168">Where</dt><dd style="margin: 0">Video call</dd>
                  <dt style="color: #5e6168">Organiser</dt><dd style="margin: 0; display: flex; align-items: center; gap: 6px"><span style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">TA</span>Tom Achterberg</dd>
                  <dt style="color: #5e6168; line-height: 26px">People</dt>
                  <dd style="margin: 0; display: flex; flex-direction: column">
                    <sc-for list="{{ attendees }}" as="a" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 8px; font-size: 14px; line-height: 26px"><span style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ a.initials }}</span><span style="flex: none; white-space: nowrap">{{ a.name }}</span><span style="{{ a.dot }}"></span><span style="flex: none; font-size: 12px; color: #5e6168">{{ a.answer }}</span></span></sc-for>
                  </dd>
                </dl>
                <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #ff9d2e; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 14px; line-height: 21px; color: #1b1c1d">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #ff9d2e"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2"></path></svg>
                  <span><strong style="font-weight: 600">Clashes with 1 event:</strong> 1:1 with Priya Raman, Thursday 14:30 to 15:00. <a href="#" style="color: var(--sc-link, #3669a5)">Open it</a></span>
                </div>
                <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                  <label for="ml-inv-cal" style="font-size: 14px; font-weight: 600; color: #1b1c1d; white-space: nowrap">Calendar</label>
                  <button id="ml-inv-cal" type="button" aria-haspopup="listbox" aria-label="Calendar to save the event in: Customers" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 160px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 8px"><span style="flex: none; width: 10px; height: 10px; border-radius: 3px; background: #ff9d2e"></span>Customers</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
                  <span style="flex: 1 1 auto"></span>
                  <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Accept</button>
                  <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Maybe</button>
                  <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Decline</button>
                </div>
              </section>

              <div style="padding: 12px 14px 0 88px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
                <p style="margin: 0">Hi all,</p>
                <p style="margin: 0">Let's go through the phase 2 rollout with Marc's team before the kick-off: folder structure, the OIDC client settings and the open questions from the department head. I will send the agenda on Wednesday.</p>
                <p style="margin: 0">Tom</p>
              </div>
              <div style="display: flex; gap: 8px; padding: 12px 14px 14px; flex-wrap: wrap">
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17l-5-5 5-5M12 17l-5-5 5-5M22 18v-2a4 4 0 0 0-4-4H7"></path></svg>Reply all</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 17l-5-5 5-5M20 18v-2a4 4 0 0 0-4-4H4"></path></svg>Reply</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 17l5-5-5-5M4 18v-2a4 4 0 0 1 4-4h12"></path></svg>Forward</button>
              </div>
            </article>
          </div>
        </main>

      </div>
    </div>
  </figure>

  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px">
    <sc-for list="{{ variants }}" as="v" hint-placeholder-count="4">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
        <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">{{ v.letter }}</span> &nbsp;{{ v.caption }}</figcaption>
        <div style="height: 350px; box-sizing: border-box; padding: 12px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
          <article aria-label="{{ v.aria }}" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
            <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
              <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{ v.initials }}</span>
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">{{ v.from }}</strong><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">{{ v.date }}</span></div>
                <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ v.subject }}</div>
              </div>
            </div>
            <section aria-label="Invitation" style="margin: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff">
              <div role="status" style="{{ v.noticeStyle }}">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: {{ v.noticeColor }}"><path d="{{ v.noticeIcon }}"></path></svg>
                <span>{{ v.notice }}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px"><strong style="flex: 1 1 auto; min-width: 0; font-size: 15px; font-weight: 600; line-height: 20px; {{ v.titleStyle }}">{{ v.title }}</strong><a href="ClEvent.dc.html" style="flex: none; font-size: 14px; font-weight: 600; color: var(--sc-link, #3669a5); text-decoration: none">Open in Calendar</a></div>
              <div style="font-size: 14px; line-height: 20px; color: #3d4047">{{ v.when }}</div>
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                <sc-for list="{{ v.buttons }}" as="b" hint-placeholder-count="3"><button type="button" style="{{ b.style }}">{{ b.label }}</button></sc-for>
              </div>
            </section>
          </article>
        </div>
      </figure>
    </sc-for>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">f</span> &nbsp;An attached calendar file is imported into a calendar of your choice</figcaption>
      <div style="height: 380px; box-sizing: border-box; padding: 12px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <article aria-label="Message from Priya Raman, 8 October" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">PR</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Priya Raman</strong><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">8 Oct 16:05</span></div>
              <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Team days 2027, dates as a calendar file</div>
            </div>
          </div>
