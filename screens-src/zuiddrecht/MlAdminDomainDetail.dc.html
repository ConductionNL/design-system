<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail administration: one domain with DNS records, administrators and signatures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1720px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The page of one domain, DNS tab open, with the danger block at the bottom</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Administration" placeholder="Search domains, mailboxes or settings" user="Ines Okafor" initials="IO" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlAdminNav" active="Domains" hint-size="264px,945px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 20px 32px 24px; overflow: hidden">
          <nav aria-label="Breadcrumb" style="font-size: 13px; color: #5e6168; display: flex; align-items: center; gap: 6px"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none">Domains</a><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><span aria-current="page">northwind-consulting.test</span></nav>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px">
            <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <h1 style="margin: 0; font-size: 24px; font-weight: 600; line-height: 32px">northwind-consulting.test</h1>
              <p style="margin: 0; color: #3d4047">12 mailboxes, 8.9 GB of 100 GB in use, added on 14 March 2026 by Olivia Brandt. One DNS record is missing, so mail from this domain may land in spam.</p>
            </div>
            <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; font-size: 13px; color: #3d4047"><span style="{{ D.warn }}"></span>1 record missing</span>
          </div>

          <div style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); overflow: hidden; display: flex; flex-direction: column">
            <div role="tablist" aria-label="Domain sections" style="flex: none; display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid #e4e6ea">
              <sc-for list="{{ tabsA }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
            </div>
            <div role="tabpanel" aria-label="DNS" style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
              <div style="display: flex; align-items: center; gap: 8px">
                <p style="margin: 0; flex: 1 1 auto; font-size: 13px; color: #3d4047">The 4 records this domain needs, checked today at 07:00. Add them at your DNS provider, or let us create them there.</p>
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 9h-9a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2zM5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>Copy all records</button>
                <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Create at DNS provider</button>
              </div>
              <p style="margin: -4px 0 0; font-size: 12px; color: #5e6168; line-height: 18px; text-align: right">This domain is hosted at Cloudflare, a provider we can write to. Creating takes one sign-in there and changes only these 4 records.</p>
              <table style="width: 100%; border-collapse: collapse; font-size: 13px">
                <thead><tr style="height: 40px; border-bottom: 1px solid #e4e6ea; background: #f5f6f8">
                  <th scope="col" style="text-align: left; padding: 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; white-space: nowrap">Record</th>
                  <th scope="col" style="text-align: left; padding: 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; white-space: nowrap">What it does</th>
                  <th scope="col" style="text-align: left; padding: 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; white-space: nowrap">Name</th>
                  <th scope="col" style="text-align: left; padding: 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; white-space: nowrap">Value</th>
                  <th scope="col" style="text-align: left; padding: 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; white-space: nowrap">State</th>
                </tr></thead>
                <tbody>
                  <sc-for list="{{ records }}" as="r" hint-placeholder-count="4">
                    <tr style="height: 40px; border-bottom: 1px solid #e4e6ea">
                      <td style="padding: 0 12px; font-weight: 500; white-space: nowrap">{{ r.name }}</td>
                      <td style="padding: 0 12px; color: #3d4047; white-space: nowrap">{{ r.purpose }}</td>
                      <td style="padding: 0 12px; white-space: nowrap"><code style="font-family: ui-monospace, monospace; font-size: 12px">{{ r.host }}</code></td>
                      <td style="padding: 0 12px; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><code style="font-family: ui-monospace, monospace; font-size: 12px">{{ r.value }}</code></td>
                      <td style="padding: 0 12px; white-space: nowrap"><span style="display: inline-flex; align-items: center; gap: 6px"><span style="{{ r.dot }}"></span>{{ r.state }}</span></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #ff9d2e; border-radius: var(--sc-radius, 8px); background: #fff4e6; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #ff9d2e"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"></path></svg><span>The sender record (SPF) is missing. Until it exists, receivers cannot tell that mail from this domain really comes from this server.</span></div>
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; font-size: 13px; line-height: 19px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #3669a5"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg><span>A changed DNS record can take up to 48 hours to show here. We check every hour.</span></div>
              <div><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Check DNS records now</button></div>
            </div>
          </div>

          <section aria-labelledby="ml-dom-danger" style="margin-top: auto; background: #ffffff; border: 1px solid #e4e6ea; border-left: 3px solid #cc0000; border-radius: var(--sc-radius, 8px); padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 24px">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <h2 id="ml-dom-danger" style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Delete everything the server holds about the people of this domain</h2>
              <p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">All mail, folders, filters, signatures and sign-in data of all 12 people of northwind-consulting.test. The domain and its DNS records stay. This cannot be undone and asks you to type the domain name first.</p>
            </div>
            <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #cc0000; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #cc0000; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Delete all data of this domain</button>
          </section>
        </main>
      </div>
    </div>
  </figure>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; min-width: 0">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;General tab: alias, catch-all, storage quota and administrators of the domain</figcaption>
      <div style="background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 560px; box-sizing: border-box">
        <div role="tablist" aria-label="Domain sections" style="flex: none; display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid #e4e6ea">
          <sc-for list="{{ tabsB }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
        </div>
        <div role="tabpanel" aria-label="General" style="padding: 8px 20px 20px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px">
            <label for="ml-dom-alias" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Alias of another domain</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">Mail to any address at this domain goes to the same address at the other domain. An alias domain has no mailboxes of its own.</span></label>
            <button id="ml-dom-alias" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <span style="font-size: 13px; color: #5e6168">Alias of</span>
            <button type="button" aria-haspopup="listbox" aria-disabled="true" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 32px; min-width: 240px; padding: 0 8px 0 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #f5f6f8; color: #5e6168; font: 400 13px 'Fira Sans', sans-serif; white-space: nowrap"><span>Choose a domain</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          </div>

          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <label for="ml-dom-catchall" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Catch all mail for this domain</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">Mail to an address that does not exist is delivered to one mailbox instead of being refused.</span></label>
            <button id="ml-dom-catchall" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <label for="ml-dom-catchto" style="font-size: 13px; color: #3d4047">Deliver to</label>
            <input id="ml-dom-catchto" type="text" value="office@northwind-consulting.test" style="width: 300px; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 13px 'Fira Sans', sans-serif; color: #1b1c1d">
          </div>

          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <label for="ml-dom-quota" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Storage quota for the domain</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">8.9 GB in use by 12 mailboxes. Each new mailbox gets 10 GB unless set otherwise on the person.</span></label>
            <span style="flex: none; display: inline-flex; align-items: center; gap: 8px"><input id="ml-dom-quota" type="number" value="100" style="{{ num }}"><span style="font-size: 13px; color: #3d4047; width: 24px">GB</span></span>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
              <div style="display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Administrators of this domain</h3><p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">A domain administrator manages the mailboxes and signatures of this domain and nothing else.</p></div>
              <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add administrator</button>
            </div>
            <table style="width: 100%; border-collapse: collapse; font-size: 13px">
              <thead><tr style="height: 32px; border-bottom: 1px solid #e4e6ea"><th scope="col" style="text-align: left; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Person</th><th scope="col" style="text-align: left; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Role</th><th scope="col" style="text-align: left; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Since</th><th scope="col" style="width: 36px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
              <tbody>
                <sc-for list="{{ admins }}" as="a" hint-placeholder-count="2">
                  <tr style="height: 40px; border-bottom: 1px solid #e4e6ea">
                    <td style="padding: 0 8px; font-weight: 500; white-space: nowrap">{{ a.name }}</td>
                    <td style="padding: 0 8px; color: #3d4047; white-space: nowrap">{{ a.role }}</td>
                    <td style="padding: 0 8px; color: #5e6168; white-space: nowrap">{{ a.since }}</td>
                    <td style="padding: 0 4px; text-align: right"><button type="button" aria-label="Remove {{ a.name }} as administrator" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></td>
                  </tr>
                </sc-for>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Signatures tab: signatures for the whole domain and the forced one</figcaption>
      <div style="background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; display: flex; flex-direction: column; height: 560px; box-sizing: border-box">
        <div role="tablist" aria-label="Domain sections" style="flex: none; display: flex; gap: 0; padding: 0 20px; border-bottom: 1px solid #e4e6ea">
          <sc-for list="{{ tabsC }}" as="t" hint-placeholder-count="3"><button type="button" role="tab" aria-selected="{{ t.on }}" style="{{ t.style }}">{{ t.label }}</button></sc-for>
        </div>
        <div role="tabpanel" aria-label="Signatures" style="padding: 20px; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 2px"><h3 style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Signatures for the whole domain</h3><p style="margin: 0; font-size: 12px; color: #5e6168; line-height: 18px">Every person of the domain can pick one of these in their own settings. Name, title and phone are filled in per person.</p></div>
            <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add signature</button>
          </div>
          <table style="width: 100%; border-collapse: collapse; font-size: 13px">
            <thead><tr style="height: 32px; border-bottom: 1px solid #e4e6ea"><th scope="col" style="text-align: left; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Signature</th><th scope="col" style="text-align: left; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Used by</th><th scope="col" style="text-align: left; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Last changed</th><th scope="col" style="width: 36px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead>
            <tbody>
              <sc-for list="{{ sigs }}" as="s" hint-placeholder-count="3">
                <tr style="height: 40px; border-bottom: 1px solid #e4e6ea">
                  <td style="padding: 0 8px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-weight: 500">{{ s.name }}</a></td>
                  <td style="padding: 0 8px; color: #3d4047; white-space: nowrap">{{ s.used }}</td>
                  <td style="padding: 0 8px; color: #5e6168; white-space: nowrap">{{ s.changed }}</td>
                  <td style="padding: 0 4px; text-align: right"><button type="button" aria-haspopup="menu" aria-label="Actions for {{ s.name }}" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td>
                </tr>
              </sc-for>
            </tbody>
          </table>
          <div style="padding: 12px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 13px; line-height: 19px; color: #3d4047">
            <span style="display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; margin-bottom: 6px">Preview, Northwind consulting footer</span>
            <span style="display: block"><strong style="font-weight: 600; color: #1b1c1d">{Name}</strong>, {Title}<br>Northwind Consulting, Keizersgracht 120, Amsterdam<br>{Phone}, northwind-consulting.test</span>
          </div>
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 12px; border-top: 1px solid #e4e6ea">
            <label for="ml-dom-force" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 500">Force one signature on every message</span><span style="font-size: 12px; color: #5e6168; line-height: 18px">Added below the person's own signature on every message sent from this domain. A person cannot remove or change it.</span></label>
            <button id="ml-dom-force" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
