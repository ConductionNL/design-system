<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: the Rules section with Edit as script</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1100px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The Rules section: the rules of this mailbox, and below them Edit as script with your own scripts, one active at a time</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 40px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(27,28,29,0.45)"></div>
      <div role="dialog" aria-modal="true" aria-label="Settings, Rules" style="position: relative; z-index: 2; width: 960px; min-height: 800px; box-sizing: border-box; display: flex; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
        <div style="flex: 0 0 236px; width: 236px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlSettingsNav" active="Rules" hint-size="236px,800px"></dc-import></div>
        <section aria-label="Rules" style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 16px 24px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea">
            <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Rules</h3>
            <button type="button" aria-label="Close settings" style="width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 18px 24px 24px">
            <div style="display: flex; align-items: center; gap: 12px">
              <label for="ml-rules-mailbox" style="font-weight: 600; white-space: nowrap">Settings for mailbox</label>
              <button id="ml-rules-mailbox" type="button" aria-haspopup="listbox" style="flex: none; display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 180px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>Olivia Brandt, olivia@northwind-projects.test</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
              <span style="font-size: 13px; color: #5e6168; line-height: 18px">Each mailbox has its own rules.</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Rules</h4><p style="margin: 0; font-size: 13px; color: #5e6168; line-height: 18px">Rules run on the server when mail arrives, in this order, also while the app is closed. Click a rule to edit it as a form or as a script.</p></div>
              <table style="width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
                <thead><tr style="height: 44px; background: #fafbfc"><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3">Rule</th><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3">Does</th><th scope="col" style="text-align: right; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3">On</th></tr></thead>
                <tbody>
                  <sc-for list="{{ rules }}" as="r" hint-placeholder-count="3">
                    <tr style="{{ r.style }}"><td style="padding: 0 16px; font-size: 15px; font-weight: 600"><a href="MlRulesEdit.dc.html" style="color: var(--sc-link, #3669a5); text-decoration: none">{{ r.name }}</a></td><td style="padding: 0 16px; color: #5e6168">{{ r.does }}</td><td style="padding: 0 16px; text-align: right"><button type="button" role="switch" aria-checked="true" aria-label="Rule {{ r.name }} is on" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button></td></tr>
                  </sc-for>
                </tbody>
              </table>
              <div style="display: flex; align-items: center; gap: 8px"><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add rule</button><span style="font-size: 13px; color: #5e6168">Switches save at once.</span></div>
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Edit as script</h4><p style="margin: 0; font-size: 13px; color: #5e6168; line-height: 18px">Your scripts, in Sieve, the filter language your mail server runs. The three rules above live in the script northwind-rules. One script is active at a time.</p></div>
              <table style="width: 100%; border-collapse: separate; border-spacing: 0; font-size: 14px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
                <thead><tr style="height: 44px; background: #fafbfc"><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3">Script</th><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3">From</th><th scope="col" style="text-align: left; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3">Active</th><th scope="col" style="text-align: right; padding: 0 16px; font-size: 14px; font-weight: 600; color: #5e6168; border-bottom: 1px solid #eef0f3">Actions</th></tr></thead>
                <tbody>
                  <sc-for list="{{ scripts }}" as="s" hint-placeholder-count="3">
                    <tr style="{{ s.style }}">
                      <td style="padding: 0 16px; font-size: 15px; font-weight: 600; white-space: nowrap">{{ s.name }}</td>
                      <td style="padding: 0 16px; color: #5e6168; white-space: nowrap">{{ s.meta }}</td>
                      <td style="padding: 0 16px"><span style="display: inline-flex; align-items: center; gap: 8px"><button type="button" role="switch" aria-checked="{{ s.checked }}" aria-label="Make {{ s.name }} the active script" style="{{ s.switch }}"><span style="{{ s.knob }}"></span></button><span style="font-size: 13px; color: #5e6168">{{ s.state }}</span></span></td>
                      <td style="padding: 0 16px; text-align: right; white-space: nowrap"><button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif">Edit</button> <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif">Rename</button> <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif">Delete</button></td>
                    </tr>
                  </sc-for>
                </tbody>
              </table>
              <div role="note" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid #e4e6ea; border-left: 3px solid #ff9d2e; border-radius: var(--sc-radius, 8px); background: #f5f6f8; font-size: 14px; line-height: 21px; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: #ff9d2e"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 8v4M12 16h.01"></path></svg><span>Making another script active switches northwind-rules off, and with it the 3 rules above. They come back when northwind-rules is active again.</span></div>
              <div style="display: flex; align-items: center; gap: 8px; margin-top: 2px">
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"></path></svg>Upload a script</button>
                <span style="font-size: 13px; color: #5e6168">.sieve or .txt. An uploaded script is checked for mistakes before it can be made active.</span>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </figure>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const switchOn = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 1px; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 12px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 20px; width: 18px; height: 18px; border-radius: 9px; background: #ffffff';
    const switchOff = 'flex: none; position: relative; width: 42px; height: 24px; margin-top: 1px; padding: 0; border: 1px solid #c4c7cb; border-radius: 12px; background: #ffffff; box-sizing: border-box; cursor: pointer';
    const knobOff = 'position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #5e6168';
    const rules = [
      ['Kassel: file and label', 'Move to Customers / Kassel, add Waiting for customer, stop', false],
      ['Lyon: file', 'Move to Customers / Lyon', false],
      ['Newsletters', 'Add Newsletter, mark as read', false]
    ].map(([name, does, on]) => ({ name, does, style: 'height: 48px; border-top: 1px solid #eef0f3; ' + (on ? 'background: #eaf0f7;' : '') }));
    const scripts = [
      ['northwind-rules', 'The form, 3 rules, changed today', true],
      ['out-of-office-2026', 'Uploaded 2 Jul', false],
      ['test-filters', 'Uploaded 14 Sep', false]
    ].map(([name, meta, active]) => ({ name, meta, state: active ? 'Active' : 'Off', checked: active ? 'true' : 'false', switch: active ? switchOn : switchOff, knob: active ? knobOn : knobOff, style: 'height: 48px; border-top: 1px solid #eef0f3; ' + (active ? 'background: #eaf0f7;' : '') }));
    return { switchOn, knobOn, rules, scripts };
  }
}
</script>
</body>
</html>
