      ['Archive all cards in this column', 'M21 8v13H3V8M1 3h22v5H1zM10 12h4', 'Only on this board. Nothing changes in OpenProject.', true],
      ['Unarchive all cards in this column', 'M21 8v13H3V8M1 3h22v5H1zM12 17v-5M9 14l3-3 3 3', 'Only on this board. Nothing changes in OpenProject.', true],
      null,
      ['Remove column from this board', 'M18 6 6 18M6 6l12 12', 'The status stays in OpenProject. Its work packages keep it and show under Other statuses.']
    ].map((m) => m ? ({ isRule: false, isItem: true, nco: !!m[3], nop: !!m[4], label: m[0], icon: m[1], sub: m[2], style: item + (m[0] === 'Remove column from this board' ? 'color: #ab0000' : '') }) : ({ isRule: true, isItem: false, nco: false, nop: false, label: '', icon: '', sub: '', style: '' }));
    const lifted = { dot: dot('on hold'), countStyle, cardStyle: cardBase('BUG') };
    const track = (on) => 'flex: none; position: relative; display: inline-block; width: 42px; height: 24px; box-sizing: border-box; border-radius: 12px; ' + (on ? 'background: var(--sc-action, #3669a5); border: 1px solid var(--sc-action-deep, #234a78)' : 'background: #ffffff; border: 1px solid #c4c7cb');
    const knob = (on) => 'position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 9px; ' + (on ? 'left: 20px; background: #ffffff' : 'left: 2px; background: #5e6168');
    const switches = [['Compact cards', true, false, 'Title only, 44 px rows'], ['Archived cards only', false, true, 'Shows the archived cards instead of the open ones']].map(([label, on, nco, sub]) => ({ label, sub, nco: !!nco, on: on ? 'true' : 'false', track: track(on), knob: knob(on) }));
    const av = 'position: relative; width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #eaf0f7; color: #234a78; ';
    const present = [['Tom Achterberg', 'TA'], ['Priya Raman', 'PR']].map(([name, initials], i) => ({ name, initials, style: av + (i ? 'margin-left: -8px;' : '') }));
    const sep = 'height: 1px; margin: 6px 0; background: #e4e6ea';
    return { columnsA, columnsB, columnsC, menu, lifted, switches, present, item, itemDanger, sep };
