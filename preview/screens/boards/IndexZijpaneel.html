<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onderdeel: zijpaneel van een overzicht (zoeken, kolommen, filters)</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:360px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="IndexZijpaneel">

<aside aria-label="Zoeken, kolommen en filters van alle zaken" style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); width: 100%; min-height: 100%; box-sizing: border-box; background: #ffffff; border-left: 1px solid var(--sc-work-line, #e4e6ea); display: flex; flex-direction: column">
  <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 20px 0">
    <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 1.2">Alle zaken</h2>
      <span style="font-size: 14px; color: var(--sc-work-muted, #5e6168)">48 zaken, 8 op deze pagina</span>
    </div>
    <button type="button" aria-label="Zijpaneel sluiten" style="flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 18px; background: transparent; color: var(--sc-work-text, #3d4047)"><svg width="20" height="20" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"></path></svg></button>
  </div>
  <div role="tablist" aria-label="Zijpaneel" style="display: flex; gap: 4px; padding: 14px 12px 0; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
    
      <button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-bottom: 2px solid var(--sc-primary, #3669a5); margin-bottom: -1px; background: transparent; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-primary-deep, #234a78); cursor: pointer"><svg width="18" height="18" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"></path></svg>Zoeken</button>
    
      <button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-text, #3d4047); cursor: pointer"><svg width="18" height="18" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4,5V19H9V5H4M10,5V19H15V5H10M16,5V19H21V5H16Z"></path></svg>Kolommen</button>
    
      <button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px; background: transparent; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-text, #3d4047); cursor: pointer"><svg width="18" height="18" viewbox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6,13H18V11H6M3,6V8H21V6M10,18H14V16H10V18Z"></path></svg>Filters</button>
    
  </div>

  
  <div role="tabpanel" aria-label="Zoeken" style="display: flex; flex-direction: column; gap: 22px; padding: 20px">
    <form role="search" style="position: relative">
      <label for="zp-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken in deze lijst</label>
      <svg width="18" height="18" viewbox="0 0 24 24" fill="#5e6168" aria-hidden="true" style="position: absolute; left: 12px; top: 11px;fill:var(--sc-work-muted, #5e6168)"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"></path></svg>
      <input id="zp-zoek" type="search" placeholder="Zoek op zaak, nummer of verzoeker" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: 8px; background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">
    </form>

    
    
    <section aria-labelledby="zp-sort-kop" style="display: flex; flex-direction: column; gap: 6px">
      <h3 id="zp-sort-kop" style="margin: 0; font-size: 15px; font-weight: 700">Sorteren</h3>
      <p style="margin: 0; font-size: 13px; color: var(--sc-work-muted, #5e6168)">In de tabel sorteert u met de kolomkoppen. Nu: op termijn, oplopend. De sortering bewaart u mee in een filter.</p>
    </section>
    

    <section aria-labelledby="zp-filter-kop" style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
        <h3 id="zp-filter-kop" style="margin: 0; font-size: 15px; font-weight: 700">Filters</h3>
        <a href="#" style="font-size: 14px; font-weight: 600">Alles wissen</a>
      </div>
      
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
          <legend style="padding: 0 0 6px; font-size: 14px; font-weight: 600">Team</legend>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Woo en informatie</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">19</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Vergunningen</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">12</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Sociaal domein</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">9</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Handhaving</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">8</span></label>
          
        </fieldset>
      
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
          <legend style="padding: 0 0 6px; font-size: 14px; font-weight: 600">Status</legend>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Ontvangen</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">11</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">In behandeling</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">20</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Wacht op inwoner</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">4</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Besluit</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">6</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Afgehandeld</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">7</span></label>
          
        </fieldset>
      
        <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
          <legend style="padding: 0 0 6px; font-size: 14px; font-weight: 600">Zaaktype</legend>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Woo-verzoek</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">19</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Bezwaar</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">8</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Omgevingsvergunning</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">10</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Melding</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">6</span></label>
          
            <label style="display: flex; align-items: center; gap: 10px; min-height: 32px; font-size: 14px"><input type="checkbox" style="width: 18px; height: 18px; margin: 0; accent-color: var(--sc-primary, #3669a5)"><span style="flex: 1">Subsidie</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">5</span></label>
          
        </fieldset>
      
    </section>
  </div>
  

  

  
</aside>
</div>
</body>
</html>
