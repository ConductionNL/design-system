<div style="position: relative; overflow: hidden; font-family: 'Lexend', system-ui, sans-serif; color: #1b1c1d; min-height: 900px; background: #f5f6f8; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px 16px; box-sizing: border-box">

      <sc-for list="{{ twigs }}" as="t" hint-placeholder-count="34"><span style="{{ t }}"></span></sc-for>
    </div>
    <div style="padding: 22px 32px 32px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">

      </div>
      <a href="LpStart.dc.html" style="display: flex; align-items: center; justify-content: center; height: 46px; border-radius: 8px; background: #2f6b4a; color: #ffffff; font-weight: 600; font-size: 15px; text-decoration: none">Inloggen met uw schoolaccount</a>
      <div style="display: flex; align-items: center; gap: 12px; color: #5e6168; font-size: 14px"><span style="flex: 1; height: 1px; background: #e4e6ea"></span>of<span style="flex: 1; height: 1px; background: #e4e6ea"></span></div>

  <p style="position: relative; margin: 0; font-size: 13px; color: #5e6168">Bent u ouder of verzorger? <a href="Inloggen.dc.html" style="font-weight: 600">Ga naar Mijn Wilgenboom</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const lengths = [14, 8, 11, 6, 12, 9, 5, 13, 7, 10];
    const twigs = Array.from({ length: 40 }, (_, i) =>
      'flex: none; width: 6px; height: ' + lengths[i % lengths.length] + 'px; border-radius: 0 0 3px 3px; background: ' + (i % 7 === 4 ? '#f5b82e' : '#2f6b4a'));
    return { twigs };
  }
}
</script>
