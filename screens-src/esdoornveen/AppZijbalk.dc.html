<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>App-zijbalk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="{{ app }}" style="font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1b1c1d; width: 100%; min-height: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e4e6ea; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
    <img src="/_blob/f0783c5e87f09c76b33eaf611359f202" alt="" style="height: 36px; width: auto">
    <span style="display: flex; flex-direction: column; line-height: 1.15"><strong style="font-size: 19px; font-weight: 700">{{ app }}</strong><span style="font-size: 13px; color: #5e6168">{{ sub }}</span></span>
  </div>
  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border: 0; border-radius: 8px; background: #5b2e91; color: #ffffff; font: 600 15px 'IBM Plex Sans', sans-serif">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{ primary }}
  </button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}"><span style="padding: 0 10px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="{{ it.icon }}"></path></svg>
          <span style="flex: 1">{{ it.label }}</span>
          <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #c2255c; color: #ffffff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ it.badge }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: 8px; color: #1b1c1d; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Instellingen</a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: 8px; color: #1b1c1d; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17v.5"></path></svg>Hulp en uitleg</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":"text","default":"learniq"},"sub":{"editor":"text","default":"Team Mechatronica"},"primary":{"editor":"text","default":"Aanwezigheid invullen"},"active":{"editor":"text","default":"Vandaag"},"groups":{"editor":null,"default":[]},"$preview":{"width":264,"height":822}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      home: 'M3 11l9-7 9 7M5 10v10h14V10',
      inbox: 'M4 13h4l2 3h4l2-3h4M4 13l2-8h12l2 8v6H4z',
      queue: 'M4 6h16M4 12h16M4 18h10',
      chat: 'M4 5h16v11H8l-4 4z',
      cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      people: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c1-4 4-6 7-6s6 2 7 6M17 11a3 3 0 1 0 0-6M22 19c-.5-2.5-2-4-4-4.6',
      org: 'M4 21V7l8-4 8 4v14M9 21v-6h6v6M8 10h.01M12 10h.01M16 10h.01',
      chart: 'M4 20V10M10 20V4M16 20v-8M22 20H2',
      doc: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
      check: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2',
      book: 'M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5M9 7h7',
      trend: 'M3 17l6-6 4 4 8-8M15 7h6v6',
      board: 'M4 4h5v16H4zM10.5 4h4v10h-4zM16 4h4v13h-4z',
      clock: 'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2',
      pin: 'M12 21s-6-6.5-6-11a6 6 0 0 1 12 0c0 4.5-6 11-6 11zM12 12a2 2 0 1 0 0-4 2 2 0 0 0 0 4z',
      seal: 'M12 3l2.4 1.8 3-.2.9 2.9 2.4 1.7-1 2.8 1 2.8-2.4 1.700-.9 2.900-3-.2L12 21l-2.4-1.800-3 .2-.9-2.900-2.4-1.700 1-2.800-1-2.800 2.400-1.700.900-2.900 3 .2zM9 12l2 2 4-4',
      scale: 'M12 4v16M6 20h12M5 8h14M5 8l-3 6a3 3 0 0 0 6 0zM19 8l-3 6a3 3 0 0 0 6 0z',
      more: 'M5 12h.01M12 12h.01M19 12h.01'
    };
    const active = this.props.active ?? 'Vandaag';
    const fallback = [
      { title: '', items: [['Vandaag', 'home', 0, 'LqVandaag.dc.html'], ['Berichten', 'chat', 3, '#']] },
      { title: 'Onderwijs', items: [['Rooster', 'cal', 0, '#'], ['Aanwezigheid', 'queue', 1, '#'], ['Beoordelen', 'check', 3, '#']] },
      { title: 'Studenten', items: [['Studenten', 'people', 0, 'LqLijst.dc.html'], ['Voortgang', 'trend', 0, '#']] },
      { title: 'BPV', items: [['BPV-overzicht', 'pin', 0, 'LqRolB.dc.html'], ['BPV-plekken', 'board', 0, 'LqBord.dc.html'], ['Leerbedrijven', 'org', 0, '#']] }
    ];
    const raw = this.props.groups && this.props.groups.length ? this.props.groups : fallback;
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 15px; ';
    const groups = raw.map((g) => ({
      title: g.title, hasTitle: !!g.title,
      items: g.items.map(([label, icon, badge, href]) => {
        const on = label === active;
        return { label, icon: I[icon] || I.more, badge: badge || '', hasBadge: !!badge, href: href || '#', current: on ? 'page' : 'false',
          style: base + (on ? 'background: #fbe9f0; color: #9c1c49; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;') };
      })
    }));
    return { app: this.props.app ?? 'learniq', sub: this.props.sub ?? 'Team Mechatronica', primary: this.props.primary ?? 'Aanwezigheid invullen', groups };
  }
}
</script>
</body>
</html>
