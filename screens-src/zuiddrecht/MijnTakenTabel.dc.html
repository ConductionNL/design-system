<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Mijn taken als tabel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1a1a1a; background: #ffffff; min-height: 1830px">
  <dc-import name="Kop" active="" signed-in="{{ true }}" crumbs="{{ crumbs }}" hint-size="100%,232px"></dc-import>
  <div style="max-width: 1280px; margin: 0 auto; padding: 40px 24px 72px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
    <div style="flex: 1 1 260px; max-width: 300px">
      <dc-import name="MijnMenu" active="Mijn taken" hint-size="100%,760px"></dc-import>
    </div>
    <main id="inhoud" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <h1 style="margin: 0; font-size: 44px; font-weight: 700; line-height: 1.15">Mijn taken</h1>
        <p style="margin: 0; font-size: 19px; line-height: 1.5; color: #4a4a4a; max-width: 760px">Hier staat wat de gemeente nog van u nodig heeft voor uw zaken. Open een taak om hem af te ronden.</p>
        <p style="margin: 0; font-size: 19px; color: #4a4a4a">14 open taken</p>
      </div>
      <form role="search" aria-label="Taken zoeken" style="display: flex; flex-direction: column; gap: 6px; max-width: 640px">
        <label for="zoek" style="font-size: 17px; font-weight: 600">Zoek op taak of zaaknummer</label>
        <div style="display: flex">
          <input id="zoek" type="search" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; height: 48px; padding: 0 14px; border: 2px solid #5c6470; border-right: 0; border-radius: 4px 0 0 4px; font: 400 17px 'Fira Sans', sans-serif">
          <button type="submit" style="display: inline-flex; align-items: center; gap: 6px; height: 48px; padding: 0 18px; border: 0; border-radius: 0 4px 4px 0; background: #3669a5; color: #ffffff; font: 600 17px 'Fira Sans', sans-serif"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"></path></svg>Zoeken</button>
        </div>
      </form>
      <div style="overflow-x: auto">
        <table style="width: 100%; border-collapse: collapse; font-size: 17px">
          <caption style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Open taken, 1 tot en met 10 van 14, de eerste deadline bovenaan</caption>
          <thead>
            <tr style="border-bottom: 2px solid #1a1a1a; text-align: left">
              <th scope="col" style="padding: 12px 16px 12px 0; font-weight: 700"><span style="display: inline-flex; align-items: center; gap: 4px"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; text-align: left">Taak <svg width="14" height="14" viewBox="0 0 24 24" fill="#c4c7cb" aria-hidden="true"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"></path></svg></button><button type="button" aria-haspopup="dialog" aria-label="Filteren op Taak" title="Filteren op Taak" style="width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15,19.88C15.04,20.18 14.94,20.5 14.71,20.71C14.32,21.1 13.69,21.1 13.3,20.71L9.29,16.7C9.06,16.47 8.96,16.16 9,15.87V10.75L4.21,4.62C3.87,4.19 3.95,3.56 4.38,3.22C4.57,3.08 4.78,3 5,3V3H19V3C19.22,3 19.43,3.08 19.62,3.22C20.05,3.56 20.13,4.19 19.79,4.62L15,10.75V19.88M7.04,5L11,10.06V15.58L13,17.58V10.05L16.96,5H7.04Z"></path></svg></button></span></th>
              <th scope="col" style="padding: 12px 16px; font-weight: 700"><span style="display: inline-flex; align-items: center; gap: 4px"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; text-align: left">Zaak <svg width="14" height="14" viewBox="0 0 24 24" fill="#c4c7cb" aria-hidden="true"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"></path></svg></button><button type="button" aria-haspopup="dialog" aria-label="Filteren op Zaak" title="Filteren op Zaak" style="width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15,19.88C15.04,20.18 14.94,20.5 14.71,20.71C14.32,21.1 13.69,21.1 13.3,20.71L9.29,16.7C9.06,16.47 8.96,16.16 9,15.87V10.75L4.21,4.62C3.87,4.19 3.95,3.56 4.38,3.22C4.57,3.08 4.78,3 5,3V3H19V3C19.22,3 19.43,3.08 19.62,3.22C20.05,3.56 20.13,4.19 19.79,4.62L15,10.75V19.88M7.04,5L11,10.06V15.58L13,17.58V10.05L16.96,5H7.04Z"></path></svg></button></span></th>
              <th scope="col" style="padding: 12px 0 12px 16px; font-weight: 700; white-space: nowrap" aria-sort="ascending"><span style="display: inline-flex; align-items: center; gap: 4px"><button type="button" style="border: 0; background: transparent; padding: 0; font: inherit; color: inherit; display: inline-flex; gap: 4px; align-items: center; text-align: left">Uiterlijk <svg width="14" height="14" viewBox="0 0 24 24" fill="#c4c7cb" aria-hidden="true"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"></path></svg></button><button type="button" aria-haspopup="dialog" aria-label="Filteren op Uiterlijk" title="Filteren op Uiterlijk" style="width: 22px; height: 22px; padding: 0; border: 0; border-radius: 4px; background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15,19.88C15.04,20.18 14.94,20.5 14.71,20.71C14.32,21.1 13.69,21.1 13.3,20.71L9.29,16.7C9.06,16.47 8.96,16.16 9,15.87V10.75L4.21,4.62C3.87,4.19 3.95,3.56 4.38,3.22C4.57,3.08 4.78,3 5,3V3H19V3C19.22,3 19.43,3.08 19.62,3.22C20.05,3.56 20.13,4.19 19.79,4.62L15,10.75V19.88M7.04,5L11,10.06V15.58L13,17.58V10.05L16.96,5H7.04Z"></path></svg></button></span></th>
            </tr>
          </thead>
          <tbody>
            <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="10">
              <tr style="border-bottom: 1px solid #d3d8df">
                <td style="padding: 14px 16px 14px 0"><a href="{{ t.href }}" style="font-weight: 600">{{ t.title }}</a></td>
                <td style="padding: 14px 16px; color: #4a4a4a"><span style="display: flex; flex-direction: column; gap: 2px"><span>{{ t.subject }}</span><span style="font-size: 15px">{{ t.number }}</span></span></td>
                <td style="padding: 14px 0 14px 16px; white-space: nowrap"><time datetime="{{ t.iso }}" style="{{ t.badge }}">{{ t.due }}</time></td>
              </tr>
            </sc-for>
          </tbody>
        </table>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px">
        <span style="font-size: 17px; color: #4a4a4a">1 tot en met 10 van 14 taken</span>
        <nav aria-label="Paginanummers">
          <ul style="margin: 0; padding: 0; list-style: none; display: flex; gap: 6px">
            <li><a href="#" aria-current="page" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 700; text-decoration: none">1</a></li>
            <li><a href="#" aria-label="Pagina 2" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #d3d8df; border-radius: 4px; font-weight: 600">2</a></li>
            <li><a href="#" aria-label="Volgende pagina" style="display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; box-sizing: border-box; border: 1px solid #d3d8df; border-radius: 4px"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path></svg></a></li>
          </ul>
        </nav>
      </div>
    </main>
  </div>
  <dc-import name="Voet" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1830}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = 'display: inline-flex; align-items: center; height: 28px; padding: 0 12px; border-radius: 14px; font-size: 15px; font-weight: 600; white-space: nowrap; ';
    const soon = pill + 'background: #fff4de; color: #7a4f00; border: 1px solid #e8c77d';
    const late = pill + 'background: #fcedec; color: #a30000; border: 1px solid #e3a5a1';
    const calm = pill + 'background: #f4f6f9; color: #1a1a1a; border: 1px solid #d3d8df';
    const rows = [
      ['Geef door hoeveel containers u nodig heeft', 'Inzameling bedrijfsafval, Bakkerij Lindelaan B.V.', '2026-0088', 'Verlopen', '2026-10-06', late, 'MijnTaken.dc.html'],
      ['Kies of u het besluit per post wilt ontvangen', 'Verlichting fietspad Lindelaan', '2026-0082', 'Nog 3 dagen', '2026-10-10', soon, 'MijnTaken.dc.html'],
      ['Stuur een tekening van de plek van de boom', 'Kapvergunning esdoorn achtertuin, Henk de Vries', '2026-0069', 'Nog 5 dagen', '2026-10-13', soon, 'MijnTaken.dc.html'],
      ['Stuur een kopie van uw ID-bewijs', 'Parkeervergunning binnenstad', '2026-0061', 'Voor 18 oktober', '2026-10-18', calm, 'TaakAfronden.dc.html'],
      ['Lees en onderteken de verklaring bij uw bewonersvergunning', 'Parkeervergunning binnenstad', '2026-0061', 'Voor 20 oktober', '2026-10-20', calm, 'DocumentOndertekenen.dc.html'],

      ['Bevestig de openingstijden van het terras', 'Terrasvergunning Lindelaan 4, Bakkerij Lindelaan B.V.', '2026-0074', 'Voor 22 oktober', '2026-10-22', calm, 'MijnTaken.dc.html'],
      ['Stuur een foto van de boom', 'Kapvergunning esdoorn achtertuin, Henk de Vries', '2026-0069', 'Voor 24 oktober', '2026-10-24', calm, 'MijnTaken.dc.html'],
      ['Geef het kenteken van uw tweede auto door', 'Parkeervergunning binnenstad', '2026-0061', 'Voor 25 oktober', '2026-10-25', calm, 'MijnTaken.dc.html'],
      ['Kies een datum voor het gesprek over uw bezwaar', 'Bezwaar WOZ-waarde Lindelaan 12', '2026-0090', 'Voor 30 oktober', '2026-10-30', calm, 'MijnTaken.dc.html']

    return { tasks, crumbs: [{ label: 'Home' }, { label: 'Mijn Zuiddrecht', href: 'MijnOverzicht.dc.html' }, { label: 'Mijn taken' }] };
  }
}
</script>
</body>
</html>
