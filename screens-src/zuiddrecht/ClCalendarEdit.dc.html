<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: edit and share one calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2804px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Details of the calendar Northwind team, opened from its menu in the list; the row behind the dialog carries a drag handle and the account group a collapse chevron; Delete this calendar sits at the bottom left</figcaption>
    <div style="position: relative; height: 1010px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <nav aria-label="Calendars" style="flex: 0 0 264px; width: 264px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; background: #f5f6f8; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 6px">
            <button type="button" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New event</button>
            <button type="button" aria-label="Fold calendars" aria-expanded="true" title="Fold calendars" style="flex: none; width: 42px; height: 42px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 4v16"></path></svg></button>
          </div>
          <div role="group" aria-label="October 2026" style="display: flex; flex-direction: column; gap: 4px; padding: 0 2px">
            <div style="display: flex; align-items: center; justify-content: space-between; height: 26px; padding-left: 6px">
              <span style="font-size: 15px; font-weight: 600">October <span style="font-weight: 400; color: #5e6168">2026</span></span>
              <span style="display: flex; gap: 0">
                <button type="button" aria-label="Previous month" style="width: 26px; height: 26px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button>
                <button type="button" aria-label="Next month" style="width: 26px; height: 26px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              </span>
            </div>
            <div style="display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px; color: #5e6168; text-align: center; line-height: 18px">
              <sc-for list="{{ dow }}" as="d" hint-placeholder-count="7"><span>{{ d }}</span></sc-for>
            </div>
            <div style="display: flex; flex-direction: column; gap: 1px">
              <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="5">
                <div style="{{ w.style }}">
                  <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7"><a href="#" aria-current="{{ d.current }}" style="{{ d.style }}">{{ d.n }}</a></sc-for>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{ entries }}" as="e" hint-placeholder-count="2">
              <a href="#" style="{{ e.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ e.icon }}"></path></svg><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ e.label }}</span></a>
            </sc-for>
          </div>
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 2px">
              <div style="display: flex; align-items: center; gap: 2px; padding: 0 2px 6px 10px">
                <span style="{{ g.titleStyle }}">{{ g.title }}</span>
                <button type="button" aria-label="{{ g.toggleLabel }}" aria-expanded="{{ g.open }}" title="{{ g.toggleLabel }}" style="flex: none; width: 24px; height: 24px; margin: -4px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ g.chevron }}"></path></svg></button>
              </div>
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
                <div style="{{ it.rowStyle }}">
                  <button type="button" aria-label="Drag to reorder {{ it.label }}" title="Drag to reorder" style="{{ it.gripStyle }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M15 6a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M9 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M15 13.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M9 21a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3M15 21a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3"></path></svg></button>
                  <label style="flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 42px; cursor: pointer">
                    <span style="{{ it.box }}"></span>
                    <input type="checkbox" checked aria-label="{{ it.label }}" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">
                    <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.2"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.label }}</span><sc-if value="{{ it.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ it.sub }}</span></sc-if></span>
                  </label>
                  <button type="button" aria-label="Menu of {{ it.label }}" aria-haspopup="dialog" aria-expanded="{{ it.menuOpen }}" style="{{ it.menuStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
                </div>
              </sc-for>
            </div>
          </sc-for>
          <button type="button" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 500 15px 'Fira Sans', sans-serif; text-align: left; white-space: nowrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add calendar</button>
        </nav>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
          <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
            <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
            <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
          </div>
          <div style="flex: none; display: flex; height: 34px">
            <div style="flex: none; width: 84px"></div>
            <sc-for list="{{ days }}" as="d" hint-placeholder-count="7"><div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div></sc-for>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden; border-top: 1px solid #e4e6ea">
            <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div></sc-for>
            <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
              <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
                <div style="{{ d.colStyle }}"><sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2"><span style="{{ e.style }}"><span style="font-weight: 600">{{ e.title }}</span><span style="font-size: 11px; color: #5e6168">{{ e.time }}</span></span></sc-for></div>
              </sc-for>
            </div>
          </div>
        </main>
      </div>

      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 44px">
        <div role="dialog" aria-modal="true" aria-labelledby="cl-cal-title" style="width: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); overflow: hidden">
          <div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 16px 0 24px">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <h3 id="cl-cal-title" style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; line-height: 24px"><span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 3px; background: #538b28"></span>Northwind team</h3>
              <span style="font-size: 13px; color: #5e6168; line-height: 19px">Your calendar, 46 events. Shared with 3 people and 1 group; what you change here, they see too.</span>
            </div>
            <button type="button" aria-label="Close" style="flex: none; width: 40px; height: 40px; margin: -8px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div role="tablist" aria-label="Parts of the calendar settings" style="flex: none; display: flex; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid #c4c7cb">
            <button type="button" role="tab" aria-selected="true" style="{{ tabOn }}">Details</button>
            <button type="button" role="tab" aria-selected="false" style="{{ tabOff }}">Sharing</button>
          </div>
          <div role="tabpanel" aria-label="Details" style="display: flex; flex-direction: column; gap: 16px; padding: 16px 24px 8px">

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px">
              <div style="display: flex; flex-direction: column; gap: 4px">
                <label for="cl-cal-name" style="font-size: 14px; font-weight: 600; color: #1b1c1d">Name of the calendar</label>
                <input id="cl-cal-name" type="text" value="Northwind team" style="width: 100%; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
              </div>
              <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px">
                <legend style="padding: 0; margin: 0 0 4px; float: left; width: 100%; font-size: 12px; font-weight: 600; color: #5e6168">Colour of the calendar</legend>
                <div style="display: flex; align-items: center; gap: 6px; height: 40px">
                  <sc-for list="{{ swatches }}" as="s" hint-placeholder-count="8"><button type="button" role="radio" aria-checked="{{ s.on }}" aria-label="{{ s.name }}" style="{{ s.style }}"></button></sc-for>
                  <input type="text" value="#538b28" aria-label="Own colour" style="width: 96px; height: 40px; margin-left: 4px; padding: 0 10px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d">
                </div>
              </fieldset>
            </div>

            <div style="display: flex; align-items: flex-start; gap: 24px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <div style="flex: 1 1 0; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">This calendar holds</span><span style="font-size: 13px; color: #5e6168; line-height: 19px">Events show in the grid. Tasks also appear as a list under the same name in the Tasks app.</span></div>
              <div style="flex: none; display: flex; gap: 18px; padding-top: 2px">
                <label style="display: inline-flex; align-items: center; gap: 8px; height: 32px; font-size: 14px; white-space: nowrap"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Events</label>
                <label style="display: inline-flex; align-items: center; gap: 8px; height: 32px; font-size: 14px; white-space: nowrap"><input type="checkbox" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Tasks</label>
              </div>
            </div>

            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <label for="cl-cal-busy" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">Never counts as busy</span><span style="font-size: 13px; color: #5e6168; line-height: 19px">When someone looks for a free time with you, events here do not block you. Use it for deadlines and public holidays.</span></label>
              <button id="cl-cal-busy" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button>
            </div>

            <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
                <label for="cl-cal-block" style="font-weight: 600">Also keep busy in</label>
                <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5e6168; line-height: 19px; flex-wrap: wrap">Every event here also keeps you busy in <button type="button" aria-haspopup="listbox" aria-label="Also keep busy in: Personal" style="{{ chooser }}"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 2px; background: #3669a5"></span>Personal</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>, as a block without the details.</div>
              </div>
              <button id="cl-cal-block" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; flex-direction: column; gap: 2px"><h4 style="margin: 0; font-size: 14px; font-weight: 600; line-height: 21px">Default reminders</h4><span style="font-size: 13px; color: #5e6168; line-height: 19px">New events in this calendar start with these.</span></div>
                <div style="border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; overflow: hidden"><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px">
                  <tbody>
                    <sc-for list="{{ reminders }}" as="r" hint-placeholder-count="2">
                      <tr style="border-top: 1px solid #eef0f3"><td style="padding: 12px 12px; line-height: 24px">{{ r.when }}</td><td style="padding: 12px 8px; line-height: 24px; color: #5e6168">{{ r.how }}</td><td style="padding: 10px 8px; text-align: right"><button type="button" aria-label="Remove the reminder {{ r.when }}" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></td></tr>
                    </sc-for>
                  </tbody>
                </table></div>
                <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 8px; margin-left: -8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-link, #3669a5); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add reminder</button>
              </div>
              <div style="display: flex; flex-direction: column; gap: 6px">
                <div style="display: flex; flex-direction: column; gap: 2px"><label for="cl-cal-conf" style="font-weight: 500">Default video call</label><span style="font-size: 13px; color: #5e6168; line-height: 19px">Added to an event in this calendar as soon as it has invited people.</span></div>
                <button id="cl-cal-conf" type="button" aria-haspopup="listbox" style="{{ chooserWide }}"><span>Talk, the video call of this workspace</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button>
                <span style="font-size: 13px; color: #5e6168; line-height: 19px">Also Google Meet, Microsoft Teams, Zoom or none.</span>
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 12px; padding-top: 14px; border-top: 1px solid #e4e6ea">
              <button type="button" style="{{ secondary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"></path></svg>Export as a file</button>
              <span style="font-size: 13px; color: #5e6168; line-height: 19px">One .ics file with all 46 events, for a backup or another calendar.</span>
            </div>

          </div>
          <div style="display: flex; align-items: center; gap: 8px; margin: 16px 0 0; padding: 16px 24px; border-top: 1px solid #eef0f3">
            <button type="button" style="{{ danger }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Delete this calendar</button>
            <span style="font-size: 13px; color: #5e6168">Changes apply to everyone who sees this calendar.</span>
            <span style="flex: 1 1 auto"></span>
            <button type="button" style="{{ secondary }}">Cancel</button>
            <button type="button" style="{{ primary }}">Save</button>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;After Delete this calendar: the footer makes way for the countdown with one action, Cancel the deletion; when it runs out the dialog closes</figcaption>
    <div style="position: relative; height: 330px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="position: absolute; inset: 0">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div></sc-for>
      </div>
      <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 32px">
        <div role="dialog" aria-modal="true" aria-labelledby="cl-cal-del-title" style="width: 720px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 16px 48px rgba(27,28,29,0.28); overflow: hidden">
          <div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 16px 0 24px">
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <h3 id="cl-cal-del-title" style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; line-height: 24px"><span aria-hidden="true" style="flex: none; width: 14px; height: 14px; border-radius: 3px; background: #538b28"></span>Northwind team</h3>
              <span style="font-size: 13px; color: #5e6168; line-height: 19px">Your calendar, 46 events. Shared with 3 people and 1 group; what you change here, they see too.</span>
