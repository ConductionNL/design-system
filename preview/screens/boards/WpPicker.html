<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail: work package picker</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:408px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="WpPicker">

<div style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 14px; line-height: 21px; width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
  <div style="display: flex; align-items: center; gap: 8px; min-height: 34px; margin: -7px 0 -4px">
    <label for="wp-picker-suggest-mail" style="font-size: 14px; font-weight: 600; line-height: 20px">Work package</label>
    <span style="flex: 1 1 auto"></span>
    <button type="button" aria-expanded="false" aria-controls="wp-picker-suggest-mail-filters" title="Filters: Northwind rollout Lyon, open only" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; background: transparent; color: var(--sc-work-muted, #5e6168)"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filters<svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></button>
  </div>
  
  
    <div style="position: relative; display: flex; align-items: center">
      <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: var(--sc-work-muted, #5e6168)"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
      <input id="wp-picker-suggest-mail" type="search" value="" placeholder="Number or words" aria-describedby="wp-picker-suggest-mail-hint" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 38px; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); border: 1px solid var(--sc-work-field, #828a95); outline: 0">
      
    </div>
    <div id="wp-picker-suggest-mail-filters" style="flex-direction: column; gap: 8px; display: none">
    <button type="button" role="switch" aria-checked="false" style="display: flex; align-items: center; gap: 10px; height: 28px; margin: -2px 0 0; padding: 0; border: 0; background: transparent; color: var(--sc-work-muted, #5e6168); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; text-align: left; white-space: nowrap">
      <span aria-hidden="true" style="flex: none; position: relative; width: 42px; height: 24px; box-sizing: border-box; border-radius: 12px; background: #ffffff; border: 1px solid var(--sc-work-field, #828a95)"><span style="position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 9px; left: 2px; background: var(--sc-work-muted, #5e6168)"></span></span>
      <span>Also search in descriptions and comments</span>
      
    </button>
    <div role="group" aria-label="Search scope" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
      <button type="button" aria-haspopup="menu" aria-label="Project: Northwind rollout Lyon, change" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; max-width: 100%; padding: 0 14px; box-sizing: border-box; border-radius: 19px; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-work-ink, #1b1c1d); background: var(--sc-work-ink, #1b1c1d); color: #ffffff; max-width: 220px"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</span><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; max-width: 100%; padding: 0 14px; box-sizing: border-box; border-radius: 19px; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-work-ink, #1b1c1d); background: var(--sc-work-ink, #1b1c1d); color: #ffffff"><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 6 9 17l-5-5"></path></svg>Open only</button>
      <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; max-width: 100%; padding: 0 14px; box-sizing: border-box; border-radius: 19px; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-work-field, #828a95); background: #ffffff; color: var(--sc-work-ink, #1b1c1d)">Type<svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 38px; max-width: 100%; padding: 0 14px; box-sizing: border-box; border-radius: 19px; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; border: 1px solid var(--sc-work-field, #828a95); background: #ffffff; color: var(--sc-work-ink, #1b1c1d)">Assigned to me</button>
    </div>
    <div id="wp-picker-suggest-mail-hint" style="display: flex; align-items: center; gap: 6px; height: 24px; padding: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">
      <kbd style="display: inline-block; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #828a95); border-bottom-width: 2px; border-radius: 3px; background: var(--sc-work-ground, #f5f6f8); font: 500 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 14px; text-align: center; color: var(--sc-work-text, #3d4047)">&#8593;</kbd><kbd style="display: inline-block; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #828a95); border-bottom-width: 2px; border-radius: 3px; background: var(--sc-work-ground, #f5f6f8); font: 500 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 14px; text-align: center; color: var(--sc-work-text, #3d4047)">&#8595;</kbd><span>to move</span><span aria-hidden="true" style="margin: 0 2px">·</span><kbd style="display: inline-block; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #828a95); border-bottom-width: 2px; border-radius: 3px; background: var(--sc-work-ground, #f5f6f8); font: 500 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 14px; text-align: center; color: var(--sc-work-text, #3d4047)">Enter</kbd><span>to pick</span><span aria-hidden="true" style="margin: 0 2px">·</span><kbd style="display: inline-block; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #828a95); border-bottom-width: 2px; border-radius: 3px; background: var(--sc-work-ground, #f5f6f8); font: 500 11px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 14px; text-align: center; color: var(--sc-work-text, #3d4047)">Esc</kbd><span>to close</span>
    </div>
    </div>
    
      <div role="listbox" aria-label="Suggested work packages" style="display: flex; flex-direction: column; gap: 2px; margin: 2px 0 0">
        
          <div role="presentation" style="height: 28px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Mentioned in this conversation</div>
          
            <button type="button" role="option" aria-selected="true" style="display: flex; flex-direction: column; gap: 0; width: 100%; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); text-align: left; background: var(--sc-primary-light, #eaf0f7);">
              <span style="display: flex; align-items: center; gap: 8px; min-width: 0; line-height: 20px">
                <span style="flex: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #ab0000">BUG</span>
                <span style="flex: none; font-weight: 600; color: var(--sc-link, var(--sc-primary, #3669a5))">#58231</span>
                <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Gantt PDF export drops trailing columns</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">
                <span style="flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis">in development · Northwind rollout Lyon · Priya Raman</span>
                <span style="flex: none; color: var(--sc-work-muted, #5e6168)">#58231 in Jana’s message</span>
              </span>
              
            </button>
          
        
          <div role="presentation" style="height: 28px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Same people</div>
          
            <button type="button" role="option" aria-selected="false" style="display: flex; flex-direction: column; gap: 0; width: 100%; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); text-align: left; background: transparent;">
              <span style="display: flex; align-items: center; gap: 8px; min-width: 0; line-height: 20px">
                <span style="flex: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #08a5df">TASK</span>
                <span style="flex: none; font-weight: 600; color: var(--sc-link, var(--sc-primary, #3669a5))">#58301</span>
                <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Quote for project lead training Kassel</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">
                <span style="flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #fcc2d7; border: 1.5px solid #f977a6"></span><span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis">needs clarification · Northwind rollout Lyon · Olivia Brandt</span>
                <span style="flex: none; color: var(--sc-work-muted, #5e6168)">mail from Jana Köhler</span>
              </span>
              
            </button>
          
            <button type="button" role="option" aria-selected="false" style="display: flex; flex-direction: column; gap: 0; width: 100%; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); text-align: left; background: transparent;">
              <span style="display: flex; align-items: center; gap: 8px; min-width: 0; line-height: 20px">
                <span style="flex: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #ab0000">BUG</span>
                <span style="flex: none; font-weight: 600; color: var(--sc-link, var(--sc-primary, #3669a5))">#58102</span>
                <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Folder link breaks on rename</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">
                <span style="flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #ffc078; border: 1.5px solid #ff9d2e"></span><span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis">on hold · Northwind rollout Lyon · Priya Raman</span>
                <span style="flex: none; color: var(--sc-work-muted, #5e6168)">mail from Jana Köhler</span>
              </span>
              
            </button>
          
        
          <div role="presentation" style="height: 28px; display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--sc-work-muted, #5e6168); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Recent</div>
          
            <button type="button" role="option" aria-selected="false" style="display: flex; flex-direction: column; gap: 0; width: 100%; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); text-align: left; background: transparent;">
              <span style="display: flex; align-items: center; gap: 8px; min-width: 0; line-height: 20px">
                <span style="flex: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #08a5df">TASK</span>
                <span style="flex: none; font-weight: 600; color: var(--sc-link, var(--sc-primary, #3669a5))">#58441</span>
                <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Move kick-off to the afternoon</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">
                <span style="flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #c3fae8; border: 1.5px solid #7bf4cc"></span><span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis">new · Northwind rollout Lyon · Olivia Brandt</span>
                <span style="flex: none; color: var(--sc-work-muted, #5e6168)">created today</span>
              </span>
              
            </button>
          
            <button type="button" role="option" aria-selected="false" style="display: flex; flex-direction: column; gap: 0; width: 100%; min-height: 40px; padding: 6px 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d); text-align: left; background: transparent;">
              <span style="display: flex; align-items: center; gap: 8px; min-width: 0; line-height: 20px">
                <span style="flex: none; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #005b77">EPIC</span>
                <span style="flex: none; font-weight: 600; color: var(--sc-link, var(--sc-primary, #3669a5))">#57990</span>
                <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Release 16.5 scope</span>
              </span>
              <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 18px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">
                <span style="flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #d3f9d8; border: 1.5px solid #8ff09c"></span><span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis">in review · Northwind rollout Lyon · Olivia Brandt</span>
                <span style="flex: none; color: var(--sc-work-muted, #5e6168)">opened 9 Oct</span>
              </span>
              
            </button>
          
        
      </div>
    
    
    
  
</div>
</div>
</body>
</html>
