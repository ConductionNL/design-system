<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>shillinq: persoonlijke instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="ShVerkoopfacturen" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Shillinq" version="0.5.6" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Shillinq's own settings dialog (NcAppSettingsDialog), opened from Persoonlijke instellingen under Geavanceerd.
    // Shillinq fills no #user-settings slot, so this is CnAppRoot's default: Meldingen (one switch per notifier in
    // lib/Notification), Inloggegevens and Integraties.
    const sections = [
      { name: 'Meldingen', desc: 'Kies welke meldingen van Shillinq je krijgt.', rows: [
        { switch: 'Een deadline komt eraan', hint: 'Btw-aangifte, jaarrekening of een andere termijn uit de deadlinekalender.', on: true },
        { switch: 'Een e-factuur is geweigerd', hint: 'Het Peppol-netwerk nam een verstuurde factuur niet aan.', on: true },
        { switch: 'Een kassaregel past niet bij de voorraad', hint: 'De voorraad is voor die regel niet afgeboekt.', on: false }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { items: [['Mijn ING-zakelijk', 'Bankkoppeling PSD2 · toegevoegd 1 oktober', 'Verwijderen']] },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] },
      { name: 'Integraties', desc: 'Apps waar Shillinq mee samenwerkt. Een klik opent de app.', rows: [
        { items: [['Pipelinq', 'Goedgekeurde uren worden conceptfacturen', 'Openen']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
