<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>humaniq: mijn instellingen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
.nai-achter>div{flex:1 1 auto}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; background: #f5f6f8; display: grid; height: 900px; overflow: hidden">
  <div class="nai-achter" aria-hidden="true" inert style="grid-area: 1 / 1; display: flex; flex-direction: column"><dc-import name="HuDashboard" hint-size="100%,1220px"></dc-import></div>
  <div style="grid-area: 1 / 1; position: relative; z-index: 20; background: rgba(27,28,29,0.45); display: flex; justify-content: center; align-items: flex-start; padding: 88px 16px 24px; box-sizing: border-box">
    <dc-import name="NcAppInstellingen" app="Humaniq" version="0.2.13" title="Mijn instellingen" active="Meldingen" height="760" sections="{{ sections }}" hint-size="900px,760px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Humaniq's own settings dialog (NcAppSettingsDialog), opened from Mijn instellingen in the navigation (manifest
    // 05-menu.json, action user-settings). Humaniq fills no #user-settings slot, so this is CnAppRoot's default
    // (Meldingen, Inloggegevens) plus Administratie: the active administration Humaniq keeps per user.
    const sections = [
      { name: 'Meldingen', desc: 'Kies welke meldingen van Humaniq je krijgt.', rows: [
        { switch: 'Er wacht iets op jou als leidinggevende', hint: 'Ook als je de vervanger bent van een leidinggevende.', on: true },
        { switch: 'Een personeelszaak is aan jou gegeven', on: true }
      ] },
      { name: 'Administratie', desc: 'Werk je voor meer dan een werkgever, kies dan waar Humaniq mee opent.', rows: [
        { select: 'Actieve administratie', value: 'Gemeente Zuiddrecht' }
      ] },
      { name: 'Inloggegevens', desc: 'Je eigen accounts bij andere diensten. Ze staan versleuteld opgeslagen.', rows: [
        { note: 'Je hebt nog geen inloggegevens toegevoegd.', tone: 'plain' },
        { buttons: [['Inloggegevens toevoegen', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
