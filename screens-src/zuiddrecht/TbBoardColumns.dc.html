<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: board on a touch screen with a column menu open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1380px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; width: 1194px">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Tablet, 1194 px wide: touch targets 44 px, the navigation folded to its rail, a column lifted by a long press, the menu of the column new open and the members hovered</figcaption>
    <div style="position: relative; height: 944px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,68px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" folded="true" hint-size="64px,889px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
<div style="flex: none; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
  <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">9 open work packages</span></div>
  <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
    <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
    <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
    <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>
  </div>
  <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Status. Choose assignee or version" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Status<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
  <div style="flex: 1 1 auto"></div>
  <button type="button" aria-pressed="false" aria-haspopup="dialog" aria-keyshortcuts="F" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter</button>
  <button type="button" aria-haspopup="menu" aria-expanded="false" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>View<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
  <div role="group" aria-label="Members" title="Tom Achterberg and Priya Raman have this board open" style="flex: none; position: relative; display: flex; align-items: center">
    <span title="Olivia Brandt" aria-label="Olivia Brandt" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #eaf0f7; color: #234a78">OB</span>
    <span aria-label="Tom Achterberg, has this board open" role="img" style="position: relative; width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">TA<span aria-hidden="true" style="position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #538b28; border: 2px solid #ffffff"></span></span>
    <span aria-label="Priya Raman, has this board open" role="img" style="position: relative; width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">PR<span aria-hidden="true" style="position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #538b28; border: 2px solid #ffffff"></span></span>
    <span title="2 more members" aria-label="2 more members" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eef0f3; color: #3d4047">+2</span>
    <span role="tooltip" style="position: absolute; top: 44px; right: 0; z-index: 12; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; white-space: nowrap; box-shadow: 0 4px 12px rgba(27,28,29,0.12)">Tom Achterberg and Priya Raman have this board open<span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span>
  </div>
  <button type="button" aria-pressed="false" aria-haspopup="dialog" aria-label="Project details" title="Project details" style="flex: none; width: 44px; height: 44px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg></button>
</div>
          <div role="status" aria-live="polite" style="flex: none; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 16px; box-sizing: border-box; background: #eaf0f7; border-bottom: 1px solid #e4e6ea; font-size: 13px; color: #234a78">
            <span aria-hidden="true" style="flex: none; width: 8px; height: 8px; border-radius: 4px; background: #538b28"></span>
            <span style="flex: none; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 11px">Live</span>
            <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Tom Achterberg moved BUG #58231 to in review just now. The board updated without a reload.</span>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; gap: 8px; padding: 12px; overflow: hidden">
            <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
              <sc-if value="{{ col.isGhost }}" hint-placeholder-val="{{ false }}">
                <div aria-hidden="true" style="flex: 0 0 24px; width: 24px; height: 150px; align-self: flex-start; box-sizing: border-box; display: flex; align-items: stretch; justify-content: center; padding: 6px 0"><span style="width: 4px; border-radius: 2px; background: #3669a5"></span></div>
              </sc-if>
              <sc-if value="{{ col.isColumn }}" hint-placeholder-val="{{ true }}">
                <section aria-label="{{ col.name }}" style="{{ col.sectionStyle }}">
                  <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 0 0 6px">
                    <span style="{{ col.dot }}"></span>
                    <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; line-height: 14px; text-transform: uppercase">{{ col.name }}</h2>
                    <button type="button" aria-label="Column menu for {{ col.name }}" aria-haspopup="menu" aria-expanded="{{ col.menuOpen }}" style="{{ col.menuStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
                  </div>
                  <div style="display: flex; align-items: center; gap: 6px; min-height: 22px; margin-top: -6px; padding: 0 0 2px 6px">
                    <sc-if value="{{ col.isDone }}" hint-placeholder-val="{{ false }}"><span title="Closed column: cards dropped here are closed" style="flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; line-height: 20px; padding: 0 6px; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #234a78; border: 1px solid #3669a5; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Closed column</span></sc-if>
                    <sc-if value="{{ col.hasCount }}" hint-placeholder-val="{{ true }}"><span aria-label="{{ col.countLabel }}" style="{{ col.countStyle }}">{{ col.count }}</span></sc-if>
                  </div>
                  <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
                    <a href="TbCard.dc.html" aria-label="{{ c.aria }}" style="{{ c.style }}">
                      <span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">{{ c.subject }}</span>
                      <sc-if value="{{ c.hasNote }}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 4px; font-size: 11px; line-height: 14px; {{ c.noteStyle }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ c.note }}</span></sc-if>
                    </a>
                  </sc-for>
                  <sc-if value="{{ col.hasMenu }}" hint-placeholder-val="{{ false }}">
                    <div role="menu" aria-label="Column new" style="position: absolute; left: 124px; top: 44px; margin-top: 4px; min-width: 340px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10">
                      <sc-for list="{{ menu }}" as="m" hint-placeholder-count="5">
                        <sc-if value="{{ m.isRule }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div></sc-if>
                        <sc-if value="{{ m.isItem }}" hint-placeholder-val="{{ true }}">
                          <button type="button" role="menuitem" style="{{ m.style }}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ m.icon }}"></path></svg>
                            <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; text-align: left; line-height: 17px"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px">{{ m.label }}<sc-if value="{{ m.nco }}" hint-placeholder-val="{{ false }}"><span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></sc-if><sc-if value="{{ m.nop }}" hint-placeholder-val="{{ false }}"><span role="img" title="OpenProject has this, but its API cannot change it yet. We ask OpenProject to open it." aria-label="OpenProject has this, but its API cannot change it yet. We ask OpenProject to open it." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"></path></svg>Needs OpenProject</span></sc-if></span><sc-if value="{{ m.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5e6168; white-space: normal; line-height: 16px">{{ m.sub }}</span></sc-if></span>
                          </button>
                        </sc-if>
                      </sc-for>
                    </div>
                  </sc-if>
                </section>
              </sc-if>
            </sc-for>
            <div style="flex: 0 0 164px; width: 164px; align-self: flex-start; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px"><button type="button" style="width: 100%; height: 44px; padding: 0 10px; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a column</button><span style="display: flex; justify-content: center"><span role="img" title="OpenProject has this, but its API cannot change it yet. We ask OpenProject to open it." aria-label="OpenProject has this, but its API cannot change it yet. We ask OpenProject to open it." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"></path></svg>Needs OpenProject</span></span></div>

            <section aria-label="on hold, lifted to move it" style="position: absolute; left: 500px; top: 22px; width: 164px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; border: 1px solid #3669a5; box-shadow: 0 10px 24px rgba(27,28,29,0.22); transform: rotate(1.5deg); z-index: 5; cursor: grabbing">
              <div style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 0 0 6px">
                <span style="{{ lifted.dot }}"></span>
                <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap">on hold</h2>
                <span aria-hidden="true" style="flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></span>
              </div>
              <div style="display: flex; align-items: center; gap: 6px; min-height: 22px; margin-top: -6px; padding: 0 0 2px 6px"><span style="{{ lifted.countStyle }}">1</span></div>
              <span style="{{ lifted.cardStyle }}"><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">Folder link breaks on rename</span></span>
              <div style="display: flex; align-items: flex-start; gap: 6px; padding: 2px 4px 2px; font-size: 12px; line-height: 16px; color: #234a78"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M3 12h18"></path></svg><span>Lifted by a long press. Drop it between two columns to change the order.</span></div>
            </section>
