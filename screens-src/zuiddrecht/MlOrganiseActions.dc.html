<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: more actions, move to folder and snooze</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2380px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;More on the Lyon conversation, drawn open: after Add a label, Share, Copy link and Print it holds the organise actions, New event and New task from the last message, and the layout choice at its foot</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlNav" active="Inbox" folded="true" hint-size="64px,945px"></dc-import></div>
        <div style="flex: 0 0 410px; width: 410px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="MlThreadList" selected="2" hint-size="410px,945px"></dc-import></div>
        <main style="position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: visible">
          <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; align-items: flex-start; gap: 6px">
              <button type="button" aria-label="Star this conversation" aria-pressed="false" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true" style="width: 20px; height: 20px"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
              <h2 style="flex: 1 1 auto; min-width: 0; margin: 0; font-size: 20px; font-weight: 700; line-height: 34px">Rollout plan phase 2, Lyon</h2>
              <button type="button" aria-label="Close conversation" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
            </div>
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
              <div role="toolbar" aria-label="Conversation actions" style="display: flex; gap: 2px">
                <sc-for list="{{ tools }}" as="t" hint-placeholder-count="4"><span style="position: relative; display: inline-flex"><button type="button" aria-label="{{ t.label }}" title="{{ t.label }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg><sc-if value="{{ t.hasLabel }}" hint-placeholder-val="{{ false }}">{{ t.label }}</sc-if></button><sc-if value="{{ t.tip }}" hint-placeholder-val="{{ false }}"><span role="tooltip" style="position: absolute; left: 56px; bottom: 38px; padding: 4px 8px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 12px; line-height: 16px; white-space: nowrap; z-index: 5">{{ t.label }}</span></sc-if></span></sc-for>
                <span style="position: relative; display: inline-flex"><button type="button" aria-haspopup="menu" aria-expanded="true" aria-label="More actions for this conversation" style="display: inline-flex; align-items: center; gap: 4px; height: 34px; margin-left: 4px; padding: 0 8px 0 12px; border: 1px solid #1b1c1d; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div role="menu" aria-label="More actions for this conversation" style="position: absolute; left: 0; top: 38px; width: 420px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{ more }}" as="i" hint-placeholder-count="4">
<sc-if value="{{ i.sep }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 4px 0; background: #e4e6ea"></div><div style="padding: 4px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Layout</div></sc-if>
<button type="button" role="{{ i.role }}" aria-checked="{{ i.checked }}" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: {{ i.bg }}; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><sc-if value="{{ i.isRadio }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ i.dot }}"></span></sc-if><sc-if value="{{ i.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ i.icon }}"></path></svg></sc-if><span style="flex: 1 1 auto; white-space: nowrap">{{ i.label }}</span><span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ i.hint }}</span></button>
</sc-for>
<div role="separator" style="height: 1px; margin: 4px 0; background: #e4e6ea"></div>
<sc-for list="{{ menu }}" as="i" hint-placeholder-count="11">
              <sc-if value="{{ i.sep }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div></sc-if>
              <button type="button" role="menuitem" aria-haspopup="{{ i.haspopup }}" style="{{ i.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ i.icon }}"></path></svg><span style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 18px">{{ i.label }}<sc-if value="{{ i.hasLine2 }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #5e6168; line-height: 16px; white-space: normal">{{ i.line2 }}</span></sc-if></span><sc-if value="{{ i.hint }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 12px; color: #5e6168">{{ i.hintText }}</span></sc-if><sc-if value="{{ i.sub }}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m9 18 6-6-6-6"></path></svg></sc-if></button>
            </sc-for>
<sc-for list="{{ moreLayout }}" as="i" hint-placeholder-count="2">
<sc-if value="{{ i.sep }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 4px 0; background: #e4e6ea"></div><div style="padding: 4px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Layout</div></sc-if>
<button type="button" role="{{ i.role }}" aria-checked="{{ i.checked }}" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: {{ i.bg }}; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><sc-if value="{{ i.isRadio }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ i.dot }}"></span></sc-if><sc-if value="{{ i.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ i.icon }}"></path></svg></sc-if><span style="flex: 1 1 auto; white-space: nowrap">{{ i.label }}</span><span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ i.hint }}</span></button>
</sc-for>
</div></span>
              </div>
              <div style="flex: none; margin-left: auto; display: flex; align-items: center; gap: 6px">
                <button type="button" aria-label="Expand all messages" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 13 5 5 5-5M7 6l5 5 5-5"></path></svg>Expand all</button>
                <button type="button" aria-haspopup="menu" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>Link another</button>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: #5e6168">
              <span style="white-space: nowrap">1 work package</span>
              <button type="button" aria-expanded="false" aria-label="Open work package FEATURE #58412, in development" style="display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px 0 8px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; font: 400 12px 'Fira Sans', sans-serif; line-height: 1; white-space: nowrap; color: #3d4047; cursor: pointer"><span style="font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><span>#58412</span><span style="display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #66d9e8; border: 1.5px solid #21c8de"></span><span>in development</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
              <span style="white-space: nowrap">6 messages · Customers / Lyon</span>
            </div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px 16px">
            <sc-for list="{{ collapsed }}" as="m" hint-placeholder-count="4">
              <button type="button" aria-expanded="false" aria-label="Show the whole message from {{ m.from }}, {{ m.date }}" style="{{ m.style }}">
                <span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-left: -6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></span>
                <span style="{{ m.avatar }}">{{ m.initials }}</span>
                <span style="flex: none; font-weight: 600; white-space: nowrap">{{ m.from }}</span>
                <span style="flex: 1 1 auto; min-width: 0; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left">{{ m.snippet }}</span>
                <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ m.date }}</span>
              </button>
            </sc-for>
            <article aria-label="Message from Marc Dubois, today 06:00" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
              <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0 8px">
                <button type="button" aria-expanded="true" aria-label="Collapse the message" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">MD</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                  <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Marc Dubois</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">marc.dubois@mairie-lyon.fr</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 06:00</span></div>
                  <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
                </div>
              </div>
              <div style="padding: 12px 14px 14px 88px; display: flex; flex-direction: column; gap: 10px; color: #3d4047">
                <p style="margin: 0">Hi Olivia,</p>
                <p style="margin: 0">Good. Then we are go for 2 November. One more request from the department head: can the kick-off move to the afternoon?</p>
                <p style="margin: 0">Best regards,<br>Marc</p>
              </div>
            </article>
          </div>
        </main>
        <div style="flex: 0 0 400px; width: 400px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="WpPanel" title="Link Nextcloud project folders on rollout" type="FEATURE" number="#58412" project="Northwind rollout Lyon" status="in development" scope="Linked to the whole conversation" hint-size="400px,945px"></dc-import></div>
      </div>
    </div>
  </figure>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;Move to: type to search folder names, or copy instead of move</figcaption>
      <div style="position: relative; height: 480px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 24px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div role="dialog" aria-label="Move to a folder" style="width: 360px; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 8px; padding: 2px 2px 8px">
            <button type="button" aria-label="Back to more actions" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
            <span style="font-size: 16px; font-weight: 700">Move to</span>
          </div>
          <div style="position: relative; display: flex; align-items: center; margin: 0 2px 8px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: #5e6168"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
            <input type="text" value="ly" aria-label="Search folder names" placeholder="Search folder names" style="width: 100%; height: 40px; box-sizing: border-box; padding: 0 12px 0 38px; border: 1px solid #3669a5; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: 0; box-shadow: 0 0 0 2px #eaf0f7">
          </div>
          <div style="padding: 2px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Folders matching ly</div>
          <sc-for list="{{ folders }}" as="f" hint-placeholder-count="3">
            <button type="button" role="option" aria-selected="{{ f.on }}" style="{{ f.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg><span style="flex: 1 1 auto; text-align: left">{{ f.path }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ f.hint }}</span></button>
          </sc-for>
          <div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 10px 6px">
            <label for="ml-org-copy" style="display: flex; flex-direction: column; gap: 1px; min-width: 0"><span style="font-size: 14px; font-weight: 600">Copy instead of move</span><span style="font-size: 13px; color: #5e6168; line-height: 18px">The conversation stays in the inbox too. The button then reads Copy to Customers / Lyon.</span></label>
            <button id="ml-org-copy" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button>
          </div>
          <div style="display: flex; align-items: center; gap: 8px; padding: 8px 2px 2px">
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Move to Customers / Lyon</button>
            <span style="flex: 1 1 auto"></span>
            <span style="font-size: 13px; color: #5e6168">Enter moves</span>
          </div>
        </div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Snooze: presets or a date and time of your own</figcaption>
      <div style="position: relative; height: 480px; box-sizing: border-box; display: flex; align-items: flex-start; justify-content: center; padding-top: 24px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div role="dialog" aria-label="Snooze until" style="width: 360px; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); display: flex; flex-direction: column">
          <div style="display: flex; align-items: center; gap: 8px; padding: 2px 2px 8px">
            <button type="button" aria-label="Back to more actions" style="flex: none; width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
            <span style="font-size: 16px; font-weight: 700">Snooze until</span>
            <span style="flex: 1 1 auto"></span>
            <span style="font-size: 13px; color: #5e6168">Comes back unread</span>
          </div>
          <sc-for list="{{ presets }}" as="p" hint-placeholder-count="4">
            <button type="button" role="option" aria-selected="{{ p.on }}" style="{{ p.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 6v6l4 2"></path></svg><span style="flex: 1 1 auto; text-align: left">{{ p.label }}</span><span style="flex: none; font-size: 12px; color: #5e6168">{{ p.when }}</span></button>
          </sc-for>
          <div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div>
