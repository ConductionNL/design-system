</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 3181px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The settings page at rest: defaults, suggested calendars, access and limits, rooms and resources, invitations and changes, each a card with one subtitle; what a setting does is its tooltip, and Save changes at the end is the one commit</figcaption>
    <div style="position: relative; height: 2493px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 100%; overflow: hidden; position: relative">
  <dc-import name="MlHeader" app="Administration" placeholder="Search calendars or settings" user="Ines Okafor" initials="IO" role="Workspace administrator" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClAdminNav" active="Settings" hint-size="264px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 20px; padding: 24px 28px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Calendar settings</h1>
        <p style="margin: 0; color: #3d4047">Defaults and limits for everyone's calendar. A default is what a new user starts with and may change; a limit applies to all and cannot be changed by a user.</p>
      </div>
      <section aria-labelledby="cl-adm-defaults" style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); padding: 20px 24px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 id="cl-adm-defaults" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Defaults for everyone</h2><p style="margin: 0; font-size: 14px; color: #5e6168; line-height: 21px">What a new user gets. A user can change each of these in their own settings under View and Reminders.</p></div><div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px 40px"><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-view" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">Default view</span></label><button id="cl-adm-view" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 200px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>Week</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-weekends" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600">Show weekends</span></label><button id="cl-adm-weekends" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-reminder" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="For new timed events.">Default reminder</span></label><button id="cl-adm-reminder" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 200px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>10 minutes before</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-tz" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="Until the user sets one or the browser reports one.">Time zone</span></label><button id="cl-adm-tz" type="button" aria-haspopup="listbox" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; min-width: 200px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span>Europe/Amsterdam</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168"><path d="m6 9 6 6 6-6"></path></svg></button></div></div><fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0; float: left; width: 100%; font-weight: 600">A click on an event opens</legend><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-adm-editor" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">The quick popover</label><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-adm-editor" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">The full editor</label></fieldset></section>
      <section aria-labelledby="cl-adm-public" style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; padding: 0; gap: 0; overflow: hidden"><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 24px 16px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 id="cl-adm-public" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Suggested by your administrator</h2><p style="margin: 0; font-size: 14px; color: #5e6168; line-height: 21px">Shown to users under Add calendar with this same name. One click subscribes, and the calendar stays up to date from its address.</p></div><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add public calendar</button></div><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px"><thead><tr style="background: #fafbfc; border-top: 1px solid #eef0f3"><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Calendar</th><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Address</th><th scope="col" style="text-align: left; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Updated</th><th scope="col" style="text-align: right; padding: 12px 16px; font-size: 14px; font-weight: 600; line-height: 20px; color: #5e6168; white-space: nowrap">Subscribed</th><th scope="col" style="width: 52px; padding: 12px 16px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead><tbody><tr style="border-top: 1px solid #eef0f3; background: #ffffff"><td style="padding: 14px 16px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">Dutch public holidays</a></td><td style="padding: 14px 16px; color: #3d4047"><span style="display: block; font-family: ui-monospace, monospace; font-size: 13px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 440px">webcal://holidays.northwind-projects.test/nl.ics</span></td><td style="padding: 14px 16px; white-space: nowrap">Yearly</td><td style="padding: 14px 16px; text-align: right; white-space: nowrap">61 users</td><td style="padding: 10px 12px; text-align: right"><button type="button" aria-haspopup="menu" aria-label="Actions for Dutch public holidays" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td></tr><tr style="border-top: 1px solid #eef0f3; background: #ffffff"><td style="padding: 14px 16px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">Northwind release dates</a></td><td style="padding: 14px 16px; color: #3d4047"><span style="display: block; font-family: ui-monospace, monospace; font-size: 13px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 440px">https://app.northwind-projects.test/remote.php/dav/public-calendars/releases</span></td><td style="padding: 14px 16px; white-space: nowrap">Every hour</td><td style="padding: 14px 16px; text-align: right; white-space: nowrap">48 users</td><td style="padding: 10px 12px; text-align: right"><button type="button" aria-haspopup="menu" aria-label="Actions for Northwind release dates" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td></tr><tr style="border-top: 1px solid #eef0f3; background: #ffffff"><td style="padding: 14px 16px; white-space: nowrap"><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-size: 15px; font-weight: 600">OpenProject community events</a></td><td style="padding: 14px 16px; color: #3d4047"><span style="display: block; font-family: ui-monospace, monospace; font-size: 13px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 440px">webcal://community.openproject.test/events.ics</span></td><td style="padding: 14px 16px; white-space: nowrap">Daily</td><td style="padding: 14px 16px; text-align: right; white-space: nowrap">12 users</td><td style="padding: 10px 12px; text-align: right"><button type="button" aria-haspopup="menu" aria-label="Actions for OpenProject community events" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.75"></circle><circle cx="12" cy="12" r="1.75"></circle><circle cx="19" cy="12" r="1.75"></circle></svg></button></td></tr></tbody></table></section>
      <section aria-labelledby="cl-adm-limits" style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); padding: 20px 24px; display: flex; flex-direction: column; gap: 16px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 id="cl-adm-limits" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Access and limits</h2><p style="margin: 0; font-size: 14px; color: #5e6168; line-height: 21px">A limit applies to everyone and cannot be changed by a user.</p></div><fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0; float: left; width: 100%; font-weight: 600" title="Switch the calendar on for everyone, or for a few groups first. Nobody outside those groups sees the app, and no outside account can be connected until the calendar is on for everyone.">Who may use the calendar</legend><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-adm-who" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Everyone in the organisation</label><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-adm-who" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"><span style="display: inline-flex; align-items: center; gap: 10px">Only these groups: Delivery, Management<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Change groups</button></span></label></fieldset><div style="display: flex; flex-direction: column; gap: 16px; padding-top: 16px; border-top: 1px solid #e4e6ea"><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-outside" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="Google, iCloud and Microsoft. Off disconnects nothing, but no new account can be added.">Users may connect outside accounts</span></label><button id="cl-adm-outside" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-external" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="An event can only invite addresses on northwind-projects.test. Invitations that arrive from outside are still shown.">Block invitations to people outside the organisation</span></label><button id="cl-adm-external" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button></div></div><div style="padding-top: 16px; border-top: 1px solid #e4e6ea"><fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px"><legend style="padding: 0; margin: 0; float: left; width: 100%; font-weight: 600" title="With one kind only, every new reminder a user adds is that kind. Existing reminders stay as they are.">Kind of reminder users may add</legend><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-adm-alarm" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Any</label><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-adm-alarm" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Email only</label><label style="display: flex; align-items: center; gap: 10px; min-height: 32px"><input type="radio" name="cl-adm-alarm" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5">Notification only</label></fieldset></div><div style="display: flex; flex-direction: column; gap: 16px; padding-top: 16px; border-top: 1px solid #e4e6ea"><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-booking" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="Users can make an appointment schedule and publish its booking page, where others book a slot in their free time. Off takes every booking page offline for everyone.">Appointment schedules</span></label><button id="cl-adm-booking" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-subscribe" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="Users can add a calendar from a web address. Off hides Add calendar from a link for everyone; the suggested calendars above stay available.">Subscriptions from a link</span></label><button id="cl-adm-subscribe" type="button" role="switch" aria-checked="true" style="{{ switchOn }}"><span style="{{ knobOn }}"></span></button></div><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; min-height: 40px"><label for="cl-adm-export" style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-weight: 600" title="The Export option on an event, which saves it as a file. Off hides it for everyone; exporting a whole calendar stays possible.">Export of single events</span></label><button id="cl-adm-export" type="button" role="switch" aria-checked="false" style="{{ switchOff }}"><span style="{{ knobOff }}"></span></button></div></div></section>
      <section aria-labelledby="cl-adm-res" style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); padding: 0; display: flex; flex-direction: column; gap: 0; overflow: hidden"><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 24px 16px"><div style="display: flex; flex-direction: column; gap: 2px"><h2 id="cl-adm-res" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">Rooms and resources</h2><p style="margin: 0; font-size: 14px; color: #5e6168; line-height: 21px">Rooms, equipment and vehicles people book from an event. A group lets people book any free one of its kind; each resource and group has its own calendar that users can add to their list.</p></div><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a room or resource</button></div><table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px"><thead><tr style="background: #fafbfc; border-top: 1px solid #eef0f3"><th scope="col" style="{{ th }}">Name</th><th scope="col" style="{{ th }}">Kind</th><th scope="col" style="{{ th }}">Group</th><th scope="col" style="{{ th }}">Bookings</th><th scope="col" style="{{ th }}">Delegates</th><th scope="col" style="width: 52px; padding: 12px 16px"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Actions</span></th></tr></thead><tbody><sc-for list="{{ resources }}" as="r" hint-placeholder-count="4"><tr style="{{ r.rowStyle }}"><td style="padding: 12px 16px
