    <figcaption style="font-size: 13px; font-weight: 600; color: var(--sc-work-text, #3d4047); line-height: 16px"><span style="color: var(--sc-work-muted, #5e6168); font-weight: 400">d</span> &nbsp;After Save when the new time overlaps another event of yours: the warning takes the place of the Save row, with Ignore and save or a way back to the time</figcaption>
    <div style="position: relative; height: 300px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-end; background: #ffffff; border: 1px solid var(--sc-work-field, #828a95); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <div aria-hidden="true" style="padding: 14px 16px 16px; opacity: 0.5; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 14px; font-weight: 600; color: var(--sc-work-ink, #1b1c1d); line-height: 20px">Who can see this event</span><span style="font-size: 14px; line-height: 20px">Private</span><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Only you see the details. Everyone else sees only that you are busy.</span></div>
      <div role="alertdialog" aria-label="Overlapping event" style="display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 16px; border-top: 1px solid var(--sc-work-line, #e4e6ea); background: var(--sc-work-ground, #f5f6f8)">
        <div style="display: flex; align-items: flex-start; gap: 10px"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px; color: var(--sc-work-muted, #5e6168)"><path d="M12 9v4M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path></svg><span style="flex: 1 1 auto; font-size: 14px; line-height: 20px">This overlaps with Stand-up, Monday 2 November, 10:00 to 10:15. Save it anyway?</span></div>
        <div style="display: flex; align-items: center; gap: 8px"><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Ignore and save</button><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-work-field, #828a95); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap">Change the time</button></div>
      </div>
    </div>
  </figure>
  </div>
</div>
</div>
