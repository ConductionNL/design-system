<body>
<div class="sc-board" data-board="TbNewDialog">

<div style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); font-size: 14px; line-height: 21px; background: var(--sc-work-ground, #f5f6f8); box-sizing: border-box; width: 1440px; height: 1000px; padding: 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">

    <div style="position: relative; height: 920px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--sc-work-ground, #f5f6f8); border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      


<div style="position: relative; width: 100%">
<header style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: #ffffff; width: 100%; box-sizing: border-box; height: 68px; padding: 0 20px 0 14px; display: flex; align-items: center; gap: 12px 16px; background: var(--sc-primary, #3669a5)">

      <img src="../assets/zuiddrecht/logo-wit.svg" alt="" style="height: 26px; width: auto; max-width: 120px; flex: none" data-sc-logo="logo-wit">
      <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); flex: none"></span>
      <strong style="font-size: 18px; font-weight: 700; white-space: nowrap">Talk</strong>
    </a>
    <button type="button" aria-label="All apps" aria-haspopup="menu" aria-expanded="false" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h5v5H3zM9.5 3h5v5h-5zM16 3h5v5h-5zM3 9.5h5v5H3zM9.5 9.5h5v5h-5zM16 9.5h5v5h-5zM3 16h5v5H3zM9.5 16h5v5h-5zM16 16h5v5h-5z"></path></svg>
    </button>
  </div>
  <form role="search" style="flex: 0 1 560px; min-width: 240px; position: relative; display: flex; align-items: center">
    <label for="op-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
    <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px; color: #ffffff"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
    <input id="op-search" type="search" placeholder="Search conversations and messages" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border: 1px solid #ffffff; border-radius: var(--sc-radius-lg, 10px); background: rgba(255,255,255,0.12); font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">
  </form>
  <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: max-content">
    <button type="button" aria-label="Notifications, 2 new" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 5px; background: var(--sc-accent, #cc0000); border: 2px solid #ffffff"></span>
    </button>
    <button type="button" aria-label="Help" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
    </button>
    <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); margin: 0 6px"></span>
    <button type="button" aria-label="Account menu of Olivia Brandt" aria-haspopup="menu" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">

      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</header>

</div>


      <div style="flex: 1 1 auto; min-height: 0; display: flex">
        <div aria-hidden="true" style="flex: 0 0 64px; background: #ffffff; border-right: 1px solid var(--sc-work-line, #e4e6ea)"></div>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; background: #ffffff">
          <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 16px; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)"><span style="flex: none; width: 28px; height: 28px; border-radius: var(--sc-radius, 8px); background: var(--sc-work-ink, #1b1c1d); color: #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">LR</span><span style="font-size: 16px; font-weight: 600">Lyon rollout</span><span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">Marc Dubois, Tom Achterberg, you</span></div>

              <div style="display: flex; align-items: flex-start; gap: 10px">

                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <div style="display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><strong style="font-size: 13px; color: var(--sc-work-ink, #1b1c1d)">Marc Dubois</strong><span>09:05</span></div>
                  <div style="display: inline-block; max-width: 440px; padding: 8px 12px; border-radius: var(--sc-radius, 8px); font-size: 14px; line-height: 20px; background: var(--sc-work-ground, #f5f6f8); color: var(--sc-work-ink, #1b1c1d)">Bonjour. The department head signed the plan this morning.</div>
                </div>
              </div>
            
              <div style="display: flex; align-items: flex-start; gap: 10px">
                <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78)">MD</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <div style="display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><strong style="font-size: 13px; color: var(--sc-work-ink, #1b1c1d)">Marc Dubois</strong><span>09:12</span></div>
                  <div style="display: inline-block; max-width: 440px; padding: 8px 12px; border-radius: var(--sc-radius, 8px); font-size: 14px; line-height: 20px; background: var(--sc-primary-light, #eaf0f7); border: 1px solid var(--sc-primary, #3669a5); color: var(--sc-work-ink, #1b1c1d)">Good. Then we are go for 2 November. One more request from the department head: can the kick-off move to the afternoon?</div>
                </div>
              </div>
            
              <div style="display: flex; align-items: flex-start; gap: 10px">
                <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78)">TA</span>
                <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                  <div style="display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--sc-work-muted, #5e6168)"><strong style="font-size: 13px; color: var(--sc-work-ink, #1b1c1d)">Tom Achterberg</strong><span>09:14</span></div>
                  <div style="display: inline-block; max-width: 440px; padding: 8px 12px; border-radius: var(--sc-radius, 8px); font-size: 14px; line-height: 20px; background: var(--sc-work-ground, #f5f6f8); color: var(--sc-work-ink, #1b1c1d)">Afternoon works for me. Olivia, can you make it a work package so it lands on the board?</div>
                </div>
              </div>
            
          </div>
        </div>
      </div>
      <div style="position: absolute; inset: 0; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 80px">
        <div role="dialog" aria-modal="true" aria-labelledby="tb-nd-a" style="width: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); overflow: hidden">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px 20px 0">
            <h2 id="tb-nd-a" style="margin: 0; font-size: 18px; font-weight: 600; line-height: 24px">Work package</h2>
            <button type="button" aria-label="Close" style="flex: none; width: 28px; height: 28px; margin-right: -6px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: var(--sc-work-muted, #5e6168); display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
          </div>
          <div role="tablist" style="display: flex; gap: 20px; padding: 4px 20px 0; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
            <button type="button" role="tab" aria-selected="true" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; font: 600 12px var(--sc-font, 'Fira Sans'), sans-serif; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; color: var(--sc-work-ink, #1b1c1d); font-weight: 700; border-bottom-color: var(--sc-primary, #3669a5);">New work package</button><button type="button" role="tab" aria-selected="false" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 2px; border: 0; border-bottom: 2px solid transparent; background: transparent; font: 600 12px var(--sc-font, 'Fira Sans'), sans-serif; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; color: var(--sc-work-muted, #5e6168);">Find a work package</button>
          </div>
          <div role="tabpanel" aria-label="New work package" style="display: flex; flex-direction: column; gap: 12px; padding: 16px 20px">
            <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--sc-radius, 8px); background: var(--sc-work-ground, #f5f6f8); font-size: 12px; line-height: 18px; color: var(--sc-work-text, #3d4047)">
              <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px; color: var(--sc-work-muted, #5e6168)"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
              <span><strong style="font-weight: 600; color: var(--sc-work-ink, #1b1c1d)">From the chat message of Marc Dubois, 09:12 in Lyon rollout.</strong> The message is linked to the work package and gets a reply with its number.</span>
            </div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sc-work-muted, #5e6168)">Title
              <input type="text" value="Move kick-off to the afternoon" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">
            </label>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px">
              
                <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sc-work-muted, #5e6168); min-width: 0">Project
                  <button type="button" aria-haspopup="listbox" aria-label="" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 34px; padding: 0 8px 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; min-width: 0"><span style="display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</span></span><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--sc-work-muted, #5e6168)"><path d="m6 9 6 6 6-6"></path></svg></button>
                </div>
              
                <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sc-work-muted, #5e6168); min-width: 0">Status column
                  <button type="button" aria-haspopup="listbox" aria-label="" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 34px; padding: 0 8px 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; min-width: 0"><span style="display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis"><span style="flex: none; display: inline-block; width: 10px; height: 10px; box-sizing: border-box; border-radius: 5px; background: #c3fae8; border: 1.5px solid #7bf4cc"></span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">new</span></span><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--sc-work-muted, #5e6168)"><path d="m6 9 6 6 6-6"></path></svg></button>
                </div>
              
                <div style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sc-work-muted, #5e6168); min-width: 0">Type
                  <button type="button" aria-haspopup="listbox" aria-label="" style="display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 34px; padding: 0 8px 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 400 13px var(--sc-font, 'Fira Sans'), sans-serif; white-space: nowrap; min-width: 0"><span style="display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 700; letter-spacing: 0.04em; color: #08a5df; font-size: 11px">TASK</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">Task</span></span><svg width="14" height="14" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: var(--sc-work-muted, #5e6168)"><path d="m6 9 6 6 6-6"></path></svg></button>
                </div>
              
            </div>
            <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sc-work-muted, #5e6168)">Description
              <textarea rows="4" style="width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 13px var(--sc-font, 'Fira Sans'), sans-serif; line-height: 19px; color: var(--sc-work-ink, #1b1c1d); resize: vertical">Marc Dubois in Lyon rollout, 12 Oct 09:12:
> Good. Then we are go for 2 November. One more request from the department head: can the kick-off move to the afternoon?</textarea>
            </label>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sc-work-muted, #5e6168)">Assignee
                <span style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 13px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)"><span style="flex: none; width: 20px; height: 20px; border-radius: 10px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: inline-flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700">OB</span>Olivia Brandt (you)</span>
              </label>
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: var(--sc-work-muted, #5e6168)">Due date
                <input type="text" value="Thu 15 Oct 2026" style="width: 100%; height: 34px; box-sizing: border-box; padding: 0 10px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 13px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">

            <div style="display: flex; align-items: center; gap: 8px; padding-top: 4px; border-top: 1px solid var(--sc-work-line, #e4e6ea)">
              <span style="font-size: 12px; color: var(--sc-work-muted, #5e6168)">Created in OpenProject, shown on the board in the column new.</span>
              <span style="flex: 1 1 auto"></span>
              <button type="button" style="display: inline-flex; align-items: center; height: 34px; padding: 0 14px; border: 1px solid var(--sc-work-field, #c4c7cb); border-radius: var(--sc-radius, 8px); background: #ffffff; color: var(--sc-work-ink, #1b1c1d); font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif">Cancel</button>
              <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border: 1px solid var(--sc-action-deep, var(--sc-primary-deep, #234a78)); border-radius: var(--sc-radius, 8px); background: var(--sc-action, var(--sc-primary, #3669a5)); color: #ffffff; font: 600 14px var(--sc-font, 'Fira Sans'), sans-serif"><svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create and link</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </figure>
