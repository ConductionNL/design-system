<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onderdeel: bovenbalk over de volle breedte</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="DqKop">

<header style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: var(--sc-work-ink, #1b1c1d); width: 100%; box-sizing: border-box; min-height: 68px; padding: 0 20px 0 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; background: #ffffff; border-bottom: 1px solid var(--sc-work-line, #e4e6ea)">
  <div style="flex: 1 1 0; display: flex; align-items: center; gap: 12px; min-width: max-content">
    <a href="#" style="flex: none; width: 237px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 6px; border-radius: 8px; color: var(--sc-work-ink, #1b1c1d); text-decoration: none; min-width: 0">
      <img src="../assets/zuiddrecht/emblem.svg" alt="" style="height: 34px; width: auto; flex: none" data-sc-logo="emblem">
      <span style="display: flex; flex-direction: column; line-height: 1.15; min-width: 0"><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168); white-space: nowrap">Gemeente Zuiddrecht</span><strong style="font-size: 18px; font-weight: 700; white-space: nowrap">Dossiq</strong></span>
    </a>
    <span style="width: 1px; height: 28px; background: var(--sc-work-line, #e4e6ea); flex: none"></span>
    <button type="button" aria-label="Alle apps" aria-haspopup="menu" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: 8px; background: var(--sc-work-ground, #f5f6f8); color: var(--sc-work-ink, #1b1c1d); display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="currentColor"><path d="M16,20H20V16H16M16,14H20V10H16M10,8H14V4H10M16,8H20V4H16M10,14H14V10H10M4,14H8V10H4M4,20H8V16H4M10,20H14V16H10M4,8H8V4H4V8Z"></path></svg>
    </button>
  </div>
  <form role="search" style="flex: 0 1 560px; min-width: 240px; position: relative">
    <label for="dq-zoek" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Zoeken</label>
    <svg width="18" height="18" viewbox="0 0 24 24" fill="#5e6168" style="position: absolute; left: 14px; top: 13px;fill:var(--sc-work-muted, #5e6168)"><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z"></path></svg>
    <input id="dq-zoek" type="search" placeholder="Zoek zaken, documenten of contacten" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border: 1px solid var(--sc-work-line, #e4e6ea); border-radius: 22px; background: var(--sc-work-ground, #f5f6f8); font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">
  </form>
  <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: max-content">
    <button type="button" aria-label="Meldingen, 2 nieuw" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--sc-work-ink, #1b1c1d); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="currentColor"><path d="M10 21H14C14 22.1 13.1 23 12 23S10 22.1 10 21M21 19V20H3V19L5 17V11C5 7.9 7 5.2 10 4.3V4C10 2.9 10.9 2 12 2S14 2.9 14 4V4.3C17 5.2 19 7.9 19 11V17L21 19M17 11C17 8.2 14.8 6 12 6S7 8.2 7 11V18H17V11Z"></path></svg>
      <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 5px; background: var(--sc-accent, #cc0000); border: 2px solid #ffffff"></span>
    </button>
    <button type="button" aria-label="Contacten" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: transparent; color: var(--sc-work-ink, #1b1c1d); display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="currentColor"><path d="M20 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V6C22 4.9 21.1 4 20 4M20 18H4V6H20V18M4 0H20V2H4M4 22H20V24H4M12 12C13.38 12 14.5 10.88 14.5 9.5S13.38 7 12 7 9.5 8.12 9.5 9.5 10.62 12 12 12M12 8.5C12.55 8.5 13 8.95 13 9.5S12.55 10.5 12 10.5 11 10.05 11 9.5 11.45 8.5 12 8.5M17 16C17 13.9 13.69 13 12 13S7 13.9 7 16V17H17V16M8.81 15.5C9.42 15 10.84 14.5 12 14.5C13.17 14.5 14.59 15 15.2 15.5H8.81Z"></path></svg>
    </button>
    <span style="width: 1px; height: 28px; background: var(--sc-work-line, #e4e6ea); margin: 0 6px"></span>
    <button type="button" aria-label="Menu van Pieter Jansen" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 4px; border: 0; border-radius: 24px; background: transparent; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: var(--sc-work-ink, #1b1c1d)">
      <span style="width: 38px; height: 38px; border-radius: 19px; background: var(--sc-primary-light, #eaf0f7); color: var(--sc-primary-deep, #234a78); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">PJ</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><strong style="font-size: 15px">Pieter Jansen</strong><span style="font-size: 13px; color: var(--sc-work-muted, #5e6168)">Woo-coördinator</span></span>
      <svg width="16" height="16" viewbox="0 0 24 24" fill="currentColor"><path d="M7.41,8.58L12,13.17L16.59,8.58L18,10L12,16L6,10L7.41,8.58Z"></path></svg>
    </button>
  </div>
</header>
</div>
</body>
</html>
