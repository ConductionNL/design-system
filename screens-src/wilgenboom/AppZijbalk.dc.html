<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>App-zijbalk</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="{{ app }}" style="font-family: 'Lexend', system-ui, sans-serif; color: #1b1c1d; width: 100%; min-height: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e4e6ea; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
    <img src="/_blob/ff5189f395484ae4c853aeb2b83e6513" alt="" style="height: 36px; width: auto">
    <span style="display: flex; flex-direction: column; line-height: 1.15"><strong style="font-size: 19px; font-weight: 700">{{ app }}</strong><span style="font-size: 13px; color: #5e6168">{{ sub }}</span></span>
  </div>
  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border: 0; border-radius: 8px; background: #2f6b4a; color: #ffffff; font: 600 15px 'Lexend', sans-serif">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>{{ primary }}
  </button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}"><span style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="{{ it.icon }}"></path></svg>
          <span style="flex: 1">{{ it.label }}</span>
          <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #f5b82e; color: #1b1c1d; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ it.badge }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: 8px; color: #1b1c1d; text-decoration: none; font-size: 15px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.900 4.900l2.100 2.100M17 17l2.100 2.100M4.900 19.100L7 17M17 7l2.100-2.100"></path></svg>Instellingen</a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: 8px; color: #1b1c1d; text-decoration: none; font-size: 15px; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.500 9.500a2.500 2.500 0 1 1 3.500 2.300c-.700.300-1 .900-1 1.700M12 17v.500"></path></svg>Hulp en uitleg</a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"app":{"editor":"text","default":"learniq"},"sub":{"editor":"text","default":"De Wilgenboom"},"primary":{"editor":"text","default":"Register invullen"},"active":{"editor":"text","default":"Vandaag"},"groups":{"editor":null,"default":[]},"$preview":{"width":264,"height":741}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      home: 'M3 11l9-7 9 7M5 10v10h14V10',
      inbox: 'M4 13h4l2 3h4l2-3h4M4 13l2-8h12l2 8v6H4z',
      queue: 'M4 6h16M4 12h16M4 18h10',
      chat: 'M4 5h16v11H8l-4 4z',
      cal: 'M4 6h16v14H4zM4 10h16M8 3v4M16 3v4',
      people: 'M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM2 21c1-4 4-6 7-6s6 2 7 6M17 11a3 3 0 1 0 0-6M22 19c-.500-2.500-2-4-4-4.600',
      chart: 'M4 20V10M10 20V4M16 20v-8M22 20H2',
      doc: 'M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h5',
      check: 'M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2',
      book: 'M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2zM4 21V5M9 7h7',
      trend: 'M3 17l6-6 4 4 8-8M15 7h6v6',
      heart: 'M12 20s-7-4.500-7-10a4 4 0 0 1 7-2.500A4 4 0 0 1 19 10c0 5.500-7 10-7 10z',
      news: 'M4 5h13v14H6a2 2 0 0 1-2-2zM17 9h3v8a2 2 0 0 1-2 2M8 9h5M8 13h5',
      more: 'M5 12h.010M12 12h.010M19 12h.010'
    };
    const active = this.props.active ?? 'Vandaag';
    const fallback = [
      { title: '', items: [['Vandaag', 'home', 0, 'LqVandaag.dc.html'], ['Berichten', 'chat', 2, 'LqVandaag.dc.html']] },
      { title: 'Elke dag', items: [['Register', 'check', 0, 'LqBord.dc.html'], ['Afwezigheid', 'queue', 3, 'LqVandaag.dc.html'], ['Nieuws voor ouders', 'news', 0, 'LqVandaag.dc.html']] },

    ];
    const raw = this.props.groups && this.props.groups.length ? this.props.groups : fallback;
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 15px; ';
    const groups = raw.map((g) => ({
      title: g.title, hasTitle: !!g.title,
      items: g.items.map(([label, icon, badge, href]) => {
        const on = label === active;
        return { label, icon: I[icon] || I.more, badge: badge || '', hasBadge: !!badge, href: href || '#', current: on ? 'page' : 'false',
          style: base + (on ? 'background: #fdf3d7; color: #6b4a00; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;') };
      })
    }));
    return { app: this.props.app ?? 'learniq', sub: this.props.sub ?? 'De Wilgenboom', primary: this.props.primary ?? 'Register invullen', groups };
  }
}
</script>
</body>
</html>
