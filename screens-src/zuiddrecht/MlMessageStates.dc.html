<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mail: states of a message in the reading pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2620px; padding: 28px 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden">

  <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; line-height: 16px">Notices above a message</h2>
  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px">
    <sc-for list="{{ notices }}" as="n" hint-placeholder-count="6">
      <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
        <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">{{ n.letter }}</span> &nbsp;{{ n.caption }}</figcaption>
        <div style="height: 250px; box-sizing: border-box; padding: 12px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
          <article aria-label="Message from {{ n.from }}" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
            <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
              <span style="{{ n.avatar }}">{{ n.initials }}</span>
              <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
                <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">{{ n.from }}</strong><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">{{ n.date }}</span></div>
                <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ n.subject }}</div>
              </div>
            </div>
            <div role="{{ n.role }}" style="display: flex; flex-direction: column; gap: 8px; margin: 12px 14px 0 14px; padding: 10px 12px; border-radius: var(--sc-radius, 8px); background: #eef0f3; font-size: 13px; line-height: 19px; color: #3d4047">
              <div style="display: flex; align-items: flex-start; gap: 8px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px; color: {{ n.iconColor }}"><path d="{{ n.icon }}"></path></svg><span>{{ n.text }}</span></div>
              <div style="display: flex; gap: 6px; flex-wrap: wrap; padding-left: 24px">
                <sc-for list="{{ n.actions }}" as="a" hint-placeholder-count="2"><button type="button" style="{{ a.style }}">{{ a.label }}</button></sc-for>
              </div>
            </div>
            <div style="padding: 10px 14px 12px; font-size: 13px; line-height: 19px; color: {{ n.bodyColor }}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ n.body }}</div>
          </article>
        </div>
      </figure>
    </sc-for>
  </div>

  <h2 style="margin: 4px 0 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168; line-height: 16px">How a message is shown</h2>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px">

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">g</span> &nbsp;HTML mail with its inline images placed in the text; images from the web are not loaded until asked</figcaption>
      <div style="height: 420px; box-sizing: border-box; padding: 12px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <article aria-label="Message from Jana Köhler, today 04:00" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">JK</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Jana Köhler</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">jana.koehler@stadtwerke-kassel.de</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Today 04:00</span></div>
              <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Olivia Brandt</span></div>
            </div>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 14px 0 56px; font-size: 12px; color: #5e6168">
            <span style="display: inline-flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"></path></svg>Some images in this message were not loaded, to protect your privacy</span>
            <button type="button" style="height: 28px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #3d4047; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap">Load images</button>
          </div>
          <div style="margin: 10px 14px 14px 56px; padding: 14px 16px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); display: flex; flex-direction: column; gap: 10px; color: #3d4047; font-size: 13px; line-height: 19px">
            <p style="margin: 0">Hello Olivia, the last week of the plan is missing in the PDF. The screen shows it, the export does not:</p>
            <figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
              <div aria-label="Screenshot of the Gantt view with the week of 26 October visible" role="img" style="height: 72px; display: flex; flex-direction: column; justify-content: space-around; padding: 8px 10px; box-sizing: border-box; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8">
                <span style="height: 8px; width: 55%; border-radius: 4px; background: #3669a5"></span><span style="height: 8px; width: 78%; margin-left: 10%; border-radius: 4px; background: #538b28"></span><span style="height: 8px; width: 40%; margin-left: 58%; border-radius: 4px; background: #ff9d2e"></span>
              </div>
              <figcaption style="font-size: 12px; color: #5e6168">gantt-week-44.png, inline</figcaption>
            </figure>
            <figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
              <div aria-label="Screenshot of the exported PDF, cut off after week 43" role="img" style="height: 72px; display: flex; flex-direction: column; justify-content: space-around; padding: 8px 10px; box-sizing: border-box; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #f5f6f8; position: relative; overflow: hidden">
                <span style="height: 8px; width: 55%; border-radius: 4px; background: #3669a5"></span><span style="height: 8px; width: 62%; margin-left: 10%; border-radius: 4px; background: #538b28"></span><span style="height: 8px; width: 14%; margin-left: 58%; border-radius: 4px; background: #ff9d2e"></span><span style="position: absolute; top: 0; bottom: 0; right: 0; width: 28%; background: #ffffff; border-left: 1px dashed #c4c7cb"></span>
              </div>
              <figcaption style="font-size: 12px; color: #5e6168">gantt-export-cut.png, inline</figcaption>
            </figure>
          </div>
        </article>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">h</span> &nbsp;Plain text mail: the text as sent, links made clickable</figcaption>
      <div style="height: 420px; box-sizing: border-box; padding: 12px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <article aria-label="Message from People Team, yesterday" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">PT</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">People Team</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">people@northwind-projects.test</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">Yesterday 09:00</span></div>
              <div style="display: flex; gap: 6px"><span style="flex: none; width: 34px">To</span><span style="color: #1b1c1d">Everyone at Northwind</span></div>
            </div>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; margin: 10px 14px 0 56px; font-size: 12px; color: #5e6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7V4h16v3M9 20h6M12 4v16"></path></svg>Plain text message</div>
          <div style="margin: 10px 14px 14px 56px; display: flex; flex-direction: column; gap: 10px; color: #3d4047; font-size: 14px; line-height: 21px">
            <p style="margin: 0">Hi all,</p>
            <p style="margin: 0">Please submit your October hours in the time sheet by Friday 16 October, 17:00. Project hours go on the project, everything else on Internal.</p>
            <p style="margin: 0">Time sheet: <a href="#" style="color: var(--sc-link, #3669a5)">https://hours.northwind-projects.test/october</a></p>
            <p style="margin: 0">Questions: <a href="#" style="color: var(--sc-link, #3669a5)">people@northwind-projects.test</a> or come by the People desk on the second floor.</p>
            <p style="margin: 0">Thanks,<br>People Team</p>
            <p style="margin: 0; color: #5e6168">--<br>Northwind Projects, Keizersgracht 120, Amsterdam</p>
          </div>
        </article>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">i</span> &nbsp;A booking pulled out of the message as a card</figcaption>
      <div style="height: 340px; box-sizing: border-box; padding: 12px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <article aria-label="Message from Travel desk, 9 October" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px 0">
            <span style="flex: none; width: 32px; height: 32px; border-radius: 16px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">TD</span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; font-size: 12px; color: #5e6168; line-height: 18px">
              <div style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 14px; color: #1b1c1d; white-space: nowrap">Travel desk</strong><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">travel@northwind-projects.test</span><span style="flex: 1 1 auto"></span><span style="flex: none; color: #1b1c1d">9 Oct 16:20</span></div>
              <div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Your train to Lyon on 2 November, booking NWP7Q2</div>
            </div>
          </div>
          <section aria-label="Booking" style="margin: 12px 14px 0 56px; display: flex; gap: 14px; padding: 12px 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff">
            <span style="flex: none; width: 40px; height: 40px; border-radius: 20px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11V7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v4M4 11v5a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5M4 11h16M8 18l-2 3M16 18l2 3M9 14h.01M15 14h.01"></path></svg></span>
            <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 6px">
              <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px"><strong style="font-size: 16px; font-weight: 600; line-height: 22px">Train to Lyon</strong><span style="font-size: 12px; color: #5e6168">Booking NWP7Q2</span></div>
              <div style="display: flex; align-items: center; gap: 12px; font-size: 13px; line-height: 19px; color: #3d4047">
                <div style="display: flex; flex-direction: column"><strong style="font-size: 18px; line-height: 24px; color: #1b1c1d">08:25</strong><span>Amsterdam Centraal</span></div>
                <span style="flex: 1 1 auto; height: 1px; background: #c4c7cb; position: relative"><span style="position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #5e6168; background: #ffffff; padding: 0 6px">5 h 38 min, 1 change</span></span>
                <div style="display: flex; flex-direction: column; text-align: right"><strong style="font-size: 18px; line-height: 24px; color: #1b1c1d">14:03</strong><span>Lyon Part-Dieu</span></div>
              </div>
              <div style="display: flex; gap: 16px; font-size: 12px; color: #5e6168"><span>Mon 2 Nov 2026</span><span>Coach 12, seat 46</span><span>Olivia Brandt</span></div>
              <div style="display: flex; gap: 8px; margin-top: 2px">
                <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h18v18H3zM16 2v4M8 2v4M3 10h18"></path></svg>Add to calendar</button>
                <a href="#" style="display: inline-flex; align-items: center; height: 34px; padding: 0 8px; font: 600 14px 'Fira Sans', sans-serif; color: var(--sc-link, #3669a5); text-decoration: none">Show the ticket</a>
              </div>
            </div>
          </section>
          <div style="padding: 10px 14px 12px 56px; font-size: 13px; line-height: 19px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Dear Olivia, your ticket for the kick-off in Lyon is confirmed. The return on 3 November is booked separately.</div>
        </article>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">j</span> &nbsp;Chat layout: sent and received messages as a conversation, switched in the More menu of the subject bar, drawn open</figcaption>
      <div style="height: 420px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden; position: relative">
        <div style="display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
          <h3 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 28px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Scope for release 16.5</h3>
          <div role="toolbar" aria-label="Conversation actions" style="display: flex; gap: 2px">
            <sc-for list="{{ tools }}" as="t" hint-placeholder-count="4"><button type="button" aria-label="{{ t.label }}" title="{{ t.label }}" style="{{ t.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ t.icon }}"></path></svg>{{ t.label }}</button></sc-for>
            <span style="position: relative; display: inline-flex"><button type="button" aria-haspopup="menu" aria-expanded="true" aria-label="More actions for this conversation" style="display: inline-flex; align-items: center; gap: 4px; height: 34px; margin-left: 4px; padding: 0 8px 0 12px; border: 1px solid #1b1c1d; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <div role="menu" aria-label="More actions for this conversation" style="position: absolute; right: 0; top: 38px; width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 2px">
                <sc-for list="{{ more }}" as="i" hint-placeholder-count="5">
                  <sc-if value="{{ i.sep }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 4px 0; background: #e4e6ea"></div><div style="padding: 4px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Layout</div></sc-if>
                  <button type="button" role="{{ i.role }}" aria-checked="{{ i.checked }}" style="display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 10px; box-sizing: border-box; border: 0; border-radius: var(--sc-radius, 8px); background: {{ i.bg }}; color: #1b1c1d; font: 400 14px 'Fira Sans', sans-serif; text-align: left"><sc-if value="{{ i.isRadio }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{ i.dot }}"></span></sc-if><sc-if value="{{ i.hasIcon }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ i.icon }}"></path></svg></sc-if><span style="flex: 1 1 auto; white-space: nowrap">{{ i.label }}</span><span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">{{ i.hint }}</span></button>
                </sc-for>
              </div></span>
          </div>
        </div>
        <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px; overflow: hidden">
          <sc-for list="{{ chat }}" as="c" hint-placeholder-count="4">
            <div style="{{ c.row }}">
              <sc-if value="{{ c.showAvatar }}" hint-placeholder-val="{{ true }}"><span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ c.initials }}</span></sc-if>
              <div style="{{ c.bubble }}">
                <div style="display: flex; gap: 8px; font-size: 12px; color: #5e6168; line-height: 16px"><strong style="color: #1b1c1d">{{ c.from }}</strong><span>{{ c.date }}</span></div>
                <p style="margin: 0; font-size: 13px; line-height: 19px; color: #3d4047">{{ c.text }}</p>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </figure>

    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">k</span> &nbsp;The labels of the open conversation sit above its subject; the first chip hovered shows its remove x, the Label button adds one and shows its tooltip</figcaption>
      <div style="height: 230px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e4e6ea">
          <div role="list" aria-label="Labels" style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-left: 34px">
            <sc-for list="{{ labels }}" as="l" hint-placeholder-count="2"><span role="listitem" style="{{ l.style }}"><span style="display: inline-block; width: 8px; height: 8px; border-radius: 4px; background: {{ l.swatch }}"></span>{{ l.name }}<button type="button" aria-label="Remove the label {{ l.name }}" title="Remove the label {{ l.name }}" style="{{ l.x }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span></sc-for>
