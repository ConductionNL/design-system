<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Onderdeel: kaart van de rondleiding door het appmenu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div role="dialog" aria-modal="false" aria-labelledby="{{ titleId }}" style="{{ cardStyle }}">
  <span aria-hidden="true" style="{{ arrowStyle }}"></span>
  <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 14px 16px 4px">
    <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 13px; font-weight: 600; color: #5e6168">Stap {{ n }} van {{ total }}</span><h2 id="{{ titleId }}" style="margin: 0; font-size: 18px; font-weight: 700; line-height: 1.25">{{ title }}</h2></div>
    <button type="button" aria-label="Rondleiding sluiten" style="flex: none; width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 18px; background: transparent; color: #3d4047"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19,6.41L17.59,5L12,10.59L6.41,5L5,6.41L10.59,12L5,17.59L6.41,19L12,13.41L17.59,19L19,17.59L13.41,12L19,6.41Z"></path></svg></button>
  </div>
  <div style="padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #3d4047">{{ text }}</p>
    <sc-if value="{{ hasHint }}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; background: #eaf0f7; color: #234a78; font-size: 14px; font-weight: 600; line-height: 1.4"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path></svg><span>{{ hint }}</span></p>
    </sc-if>
    <sc-if value="{{ hasKeys }}" hint-placeholder-val="{{ true }}">
      <p style="margin: 0; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; font-size: 13px; color: #3d4047; line-height: 1.5">
        <sc-for list="{{ keyList }}" as="k" hint-placeholder-count="3">
          <sc-if value="{{ k.isKey }}" hint-placeholder-val="{{ true }}"><kbd style="display: inline-block; min-width: 14px; padding: 1px 7px; border: 1px solid #828a95; border-bottom-width: 2px; border-radius: 6px; background: #ffffff; font: 600 12px 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; text-align: center">{{ k.text }}</kbd></sc-if>
          <sc-if value="{{ k.isText }}" hint-placeholder-val="{{ false }}"><span>{{ k.text }}</span></sc-if>
        </sc-for>
      </p>
    </sc-if>
  </div>
  <div style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 16px 14px; border-top: 1px solid #eef0f3">
    <div aria-hidden="true" style="display: flex; gap: 6px">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="7"><span style="{{ d.style }}"></span></sc-for>
    </div>
    <div style="display: flex; gap: 8px">
      <sc-if value="{{ hasBack }}" hint-placeholder-val="{{ true }}"><button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; box-sizing: border-box; padding: 0 12px; border: 1px solid #828a95; border-radius: 8px; background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d; white-space: nowrap">Terug</button></sc-if>
      <button type="button" style="display: flex; align-items: center; gap: 6px; height: 36px; box-sizing: border-box; padding: 0 14px; border: 0; border-radius: 8px; background: #3669a5; color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">{{ nextLabel }}<sc-if value="{{ hasNextIcon }}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8.59,16.58L13.17,12L8.59,7.41L10,6L16,12L10,18L8.59,16.58Z"></path></svg></sc-if></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":260},"n":"1","total":"7","title":"Open het appmenu","text":"Klik op de knop met de negen stipjes, of druk op Enter als de knop focus heeft.","hint":"","keys":"","left":"0","top":"0","w":"320","arrow":"none","arrowAt":"22"}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const n = Number(p.n || 1), total = Number(p.total || 7);
    const last = n >= total;
    const dots = Array.from({ length: total }, (_, i) => ({
      style: 'width: ' + (i + 1 === n ? 18 : 8) + 'px; height: 8px; border-radius: 4px; background: ' + (i + 1 === n ? '#3669a5' : '#828a95')
    }));
    const w = Number(p.w || 320);
    const cardStyle = 'position: absolute; z-index: 60; left: ' + Number(p.left || 0) + 'px; top: ' + Number(p.top || 0) + 'px; width: ' + w + 'px; box-sizing: border-box; background: #ffffff; border-radius: 12px; box-shadow: 0 16px 48px rgba(27,28,29,0.32); display: flex; flex-direction: column; font-family: \'Fira Sans\', system-ui, sans-serif; color: #1b1c1d';
    const at = Number(p.arrowAt || 22);
    const arrows = {
      left: 'left: -8px; top: ' + at + 'px',
      right: 'right: -8px; top: ' + at + 'px',
      top: 'top: -8px; left: ' + at + 'px',
      bottom: 'bottom: -8px; left: ' + at + 'px'
    };
    const arrow = arrows[p.arrow || 'none'];
    const arrowStyle = arrow ? 'position: absolute; ' + arrow + '; width: 16px; height: 16px; background: #ffffff; transform: rotate(45deg)' : 'display: none';
    // keys: "Alt|+|Pijl omhoog|of|Alt|+|P": a token of one word in upper case or a key name is drawn as a key cap, the rest as text
    const keyList = String(p.keys || '').split('|').map((t) => t.trim()).filter(Boolean).map((t) => {
      const isKey = /^(Alt|Enter|Escape|Esc|Tab|P|Shift|Ctrl|Pijl [a-z]+|Pijltje)$/.test(t);
      return { text: t, isKey, isText: !isKey };
    });
    return {
      n: String(n), total: String(total), title: p.title, text: p.text, hint: p.hint, hasHint: Boolean(p.hint),
      keyList, hasKeys: keyList.length > 0,
      titleId: 'rl-stap-' + n, cardStyle, arrowStyle, dots,
      hasBack: n > 1, nextLabel: last ? 'Klaar' : 'Volgende', hasNextIcon: !last
    };
  }
}
</script>
</body>
</html>
