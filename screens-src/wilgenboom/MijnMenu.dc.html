<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Menu Mijn Wilgenboom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6b4a}a:hover{color:#1f4a33}
</style>
</helmet>
<nav aria-label="Mijn Wilgenboom" style="font-family: 'Lexend', system-ui, sans-serif; color: #1a1a1a; width: 100%; display: flex; flex-direction: column; gap: 22px">
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
    <div>
      <h2 style="margin: 0 0 6px; padding: 0 12px; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #4a4a4a">{{ g.title }}</h2>
      <ul style="margin: 0; padding: 0; list-style: none; display: grid; gap: 2px">
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <li><a href="{{ it.href }}" style="{{ it.style }}" aria-current="{{ it.current }}">
            <span style="display: flex; flex-direction: column; gap: 1px"><span>{{ it.label }}</span><sc-if value="{{ it.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size: 14px; font-weight: 400; color: #4a4a4a">{{ it.sub }}</span></sc-if></span>
            <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width: 24px; height: 24px; padding: 0 7px; box-sizing: border-box; border-radius: 12px; background: #f5b82e; color: #1a1a1a; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center" aria-label="{{ it.badgeLabel }}">{{ it.badge }}</span></sc-if>
          </a></li>
        </sc-for>
      </ul>
    </div>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"text","default":"Overzicht"},"$preview":{"width":320,"height":848}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'Overzicht';
    const raw = [
      { title: 'Mijn Wilgenboom', items: [['Overzicht', 'MijnOverzicht.dc.html'], ['Berichten', 'Berichten.dc.html', 2]] },
      { title: 'Mijn kinderen', items: [['Vera', 'Detail.dc.html', 0, 'Groep 7 · Meester Daan'], ['Sami', 'Detail.dc.html', 0, 'Groep 4 · Juf Esra']] },
      { title: 'Regelen', items: [['Afwezigheid', 'MijnLijst.dc.html'], ['Oudergesprekken', 'MijnOverzicht.dc.html', 1], ['Kalender', 'MijnOverzicht.dc.html']] },
      { title: 'Van school', items: [['Nieuws', 'Zoeken.dc.html'], ['Rapporten en documenten', 'Documenten.dc.html']] },
      { title: 'Uw gegevens', items: [['Mijn gegevens', 'MijnOverzicht.dc.html'], ['Mijn account', 'MijnOverzicht.dc.html']] }
    ];
    const base = 'display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 46px; padding: 6px 12px; border-radius: 10px; font-size: 17px; text-decoration: none; ';
    const groups = raw.map((g) => ({
      title: g.title,
      items: g.items.map(([label, href, badge, sub]) => {
        const on = label === active;
        return {
          label, href, badge: badge || '', hasBadge: !!badge, sub: sub ?? '', hasSub: !!sub,
          badgeLabel: badge ? badge + ' nieuw' : '',
          current: on ? 'page' : 'false',
          style: base + (on ? 'color: #1a1a1a; font-weight: 700; background: #fdf3d7;' : 'color: #2f6b4a; font-weight: 500;')
        };
      })
    }));
    return { groups };
  }
}
</script>
</body>
</html>
