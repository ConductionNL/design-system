<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, rollen en rechten</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Rollen en rechten" title="Launchpad-beheer: rollen en rechten" scope="4 rollen" sections="{{ sections }}" hint-size="100%,1500px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Rollen en rechten: the action grid per role, start layouts per role, allowed
    // widgets per group and dashboard administrators without Nextcloud admin rights (delegated admin settings).
    const roles = ['Medewerker', 'Teamleider', 'Communicatie', 'Beheerder'];
    const sections = [
      { name: 'Wie mag wat', help: true, desc: 'Eén raster voor alle acties op dashboards. Nextcloud-beheerders mogen altijd alles.', rows: [
        { matrix: 'Actie', cols: roles, lines: [
          ['Dashboard maken', [1, 1, 1, 1]], ['Dashboard delen', [1, 1, 1, 1]], ['Openbare link maken', [0, 1, 1, 1]],
          ['Widgets toevoegen', [1, 1, 1, 1]], ['Indeling aanpassen', [1, 1, 1, 1]], ['Sjablonen beheren', [0, 0, 1, 1]], ['Aankondigingen beheren', [0, 0, 1, 1]]
        ] },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Startindeling per rol', desc: 'Nieuwe dashboards van iemand met deze rol beginnen met deze indeling.', rows: [
        { items: [['Medewerker', 'Sjabloon Intranet medewerkers · 9 widgets', 'Bewerken'], ['KCC', 'Sjabloon KCC-wachtrij · 6 widgets', 'Bewerken'], ['Teamleider', 'Eigen indeling · 8 widgets', 'Bewerken']] },
        { buttons: [['Startindeling toevoegen', '']] }
      ] },
      { name: 'Toegestane widgets per groep', rows: [
        { pair: [{ label: 'Groep', value: 'Medewerker', select: true }, { label: 'Zoek een widget', value: '' }] },
        { para: 'Toegestaan: Tekst, Afbeelding, Nieuws, Weer, App- of linktegel, Container, Tabbladen, Agenda, Bestanden, Collega\'s.' },
        { note: 'Niet toegestaan voor Medewerker: Ingesloten pagina, Power BI-rapport, Live gegevens.', tone: 'plain' },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Dashboardbeheerders', help: true, desc: 'Mensen die Launchpad beheren zonder Nextcloud-beheerder te zijn. Zij zien deze pagina als gedelegeerde beheerinstelling, met alleen de tabbladen die bij hun rol horen.', rows: [
        { items: [['Femke de Wit', 'Communicatie · geen Nextcloud-beheerder · Sjablonen, Aankondigingen, Organisatiemenu', 'Intrekken'], ['Jeroen Brouwer', 'Informatievoorziening · geen Nextcloud-beheerder · alle tabbladen', 'Intrekken']] },
        { buttons: [['Beheerder toevoegen', '']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
