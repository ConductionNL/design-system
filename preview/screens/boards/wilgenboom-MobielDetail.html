<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telefoon: afwezig melden</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:390px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#2f6b4a}a:hover{color:#1f4a33}
</style>
</head>
<body>
<div class="sc-board" data-board="MobielDetail">

<div style="width: 390px; box-sizing: border-box; font-family: 'Lexend', system-ui, sans-serif; color: #1a1a1a; background: #ffffff">
  <header>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px">
      <img src="../assets/wilgenboom/logo.svg" alt="Basisschool De Wilgenboom" style="height: 40px; width: auto">
      <a href="wilgenboom-Home.html" style="height: 44px; display: flex; align-items: center; font-weight: 600; font-size: 16px">Uitloggen</a>
    </div>
    <button type="button" aria-expanded="false" style="width: 100%; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border: 0; border-top: 1px solid #e6e9ee; background: #ffffff; color: #1a1a1a; font: 600 18px 'Lexend', sans-serif">
      <span style="display: flex; align-items: center; gap: 10px"><svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>Mijn Wilgenboom</span>
    </button>
    <div aria-hidden="true" style="height: 3px; background: #2f6b4a"></div>
    <div aria-hidden="true" style="height: 14px; overflow: hidden; display: flex; align-items: flex-start; gap: 6px; padding: 0 9px">
      <span style="flex: none; width: 6px; height: 14px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 8px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 11px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 6px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 12px; border-radius: 0 0 3px 3px; background: #f5b82e"></span><span style="flex: none; width: 6px; height: 9px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 5px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 13px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 7px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 10px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 14px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 8px; border-radius: 0 0 3px 3px; background: #f5b82e"></span><span style="flex: none; width: 6px; height: 11px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 6px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 12px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 9px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 5px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 13px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 7px; border-radius: 0 0 3px 3px; background: #f5b82e"></span><span style="flex: none; width: 6px; height: 10px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 14px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 8px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 11px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 6px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 12px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 9px; border-radius: 0 0 3px 3px; background: #f5b82e"></span><span style="flex: none; width: 6px; height: 5px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 13px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 7px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 10px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 14px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span><span style="flex: none; width: 6px; height: 8px; border-radius: 0 0 3px 3px; background: #2f6b4a"></span>
    </div>
  </header>
  <main style="padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 26px">
    <a href="wilgenboom-MobielHome.html" style="display: flex; align-items: center; gap: 6px; min-height: 44px; font-size: 17px; font-weight: 600"><svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"></path></svg>Overzicht</a>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-size: 32px; font-weight: 700; line-height: 1.15; letter-spacing: -0.015em">Afwezig melden</h1>
      <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #4a4a4a">Drie vragen. De leerkracht ziet uw melding meteen.</p>
    </div>

    <form style="display: flex; flex-direction: column; gap: 28px">
      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-size: 19px; font-weight: 700; margin-bottom: 10px">Wie is er afwezig?</legend>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5c6470; background: #ffffff"><input type="radio" name="wie" style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 600">Vera</span><span style="font-size: 15px; color: #4a4a4a">Groep 7 · Meester Daan</span></span></label>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #2f6b4a; background: #e8f1eb"><input type="radio" name="wie" checked style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 600">Sami</span><span style="font-size: 15px; color: #4a4a4a">Groep 4 · Juf Esra</span></span></label>
        
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-size: 19px; font-weight: 700; margin-bottom: 10px">Wanneer?</legend>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #2f6b4a; background: #e8f1eb"><input type="radio" name="wanneer" checked style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 600">Vandaag</span><span style="font-size: 15px; color: #4a4a4a">Maandag 5 oktober, de hele dag</span></span></label>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5c6470; background: #ffffff"><input type="radio" name="wanneer" style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 600">Morgen</span><span style="font-size: 15px; color: #4a4a4a">Dinsdag 6 oktober</span></span></label>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5c6470; background: #ffffff"><input type="radio" name="wanneer" style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 600">Een andere dag of een deel van de dag</span><span style="font-size: 15px; color: #4a4a4a">Kies zelf datum en tijd</span></span></label>
        
      </fieldset>

      <fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
        <legend style="font-size: 19px; font-weight: 700; margin-bottom: 10px">Waarom?</legend>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #2f6b4a; background: #e8f1eb"><input type="radio" name="waarom" checked style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="font-size: 18px; font-weight: 600">Ziek</span></label>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5c6470; background: #ffffff"><input type="radio" name="waarom" style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="font-size: 18px; font-weight: 600">Dokter of tandarts</span></label>
        
          <label style="display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 8px 16px; box-sizing: border-box; border-radius: 10px; border: 2px solid #5c6470; background: #ffffff"><input type="radio" name="waarom" style="flex: none; width: 24px; height: 24px; accent-color: #2f6b4a"><span style="font-size: 18px; font-weight: 600">Iets anders</span></label>
        
      </fieldset>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="m-toelichting" style="font-size: 19px; font-weight: 700">Wilt u er iets bij zeggen? <span style="font-weight: 400; font-size: 16px; color: #4a4a4a">(hoeft niet)</span></label>
        <textarea id="m-toelichting" rows="3" style="box-sizing: border-box; padding: 12px 14px; border: 2px solid #5c6470; border-radius: 10px; font: 400 17px/1.5 'Lexend', sans-serif; resize: vertical">Sami heeft buikgriep</textarea>
      </div>

      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="padding: 16px 18px; border-radius: 10px; background: #e8f1eb; border: 1px solid #b9d4c3; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #1f4a33">U meldt</span>
          <span style="font-size: 17px; line-height: 1.5">Sami is vandaag de hele dag ziek. De melding gaat naar juf Esra.</span>
        </div>
        <button type="submit" style="height: 60px; border: 0; border-radius: 10px; background: #2f6b4a; color: #ffffff; font: 600 19px 'Lexend', sans-serif">Melding versturen</button>
        <a href="wilgenboom-MobielHome.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 17px; font-weight: 600">Annuleren</a>
      </div>
    </form>
  </main>
</div>
</div>
</body>
</html>
