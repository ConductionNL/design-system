<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>launchpad: beheer, delen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<dc-import name="LpBeheer" section="Delen" title="Launchpad-beheer: delen" scope="regels voor delen en groepsdashboards" sections="{{ sections }}" hint-size="100%,1300px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    // /settings/admin/launchpad, tab Delen: who may share and with whom, public links, the order of groups for
    // group dashboards and the dashboard register behind the marketplace.
    const sections = [
      { name: 'Wie mag delen, en met wie', help: true, rows: [
        { radios: 'Delen toegestaan voor', options: [['Iedereen', ''], ['Alleen deze groepen', 'Teamleiders, Communicatie, Projectleiders', true], ['Niemand', '']] },
        { radios: 'Delen met', options: [['Iedereen in de organisatie', '', true], ['Alleen eigen groepen', '']] },
        { switch: 'Openbare links toestaan', on: true, hint: 'Alleen voor wie dashboards mag delen. Een link heeft altijd een vervaldatum.' },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Volgorde van groepen', desc: 'Zit iemand in meer groepen, dan krijgt die het groepsdashboard van de bovenste groep. Sleep om te ordenen.', rows: [
        { items: [['1 · KCC', 'KCC-wachtrij', 'Omhoog'], ['2 · Teamleiders', 'Teamoverzicht', 'Omhoog'], ['3 · Communicatie', 'Intranet redactie', 'Omhoog'], ['4 · Alle medewerkers', 'Intranet medewerkers', 'Omhoog']] },
        { buttons: [['Opslaan', 'primary']] }
      ] },
      { name: 'Dashboardregister', desc: 'Een ander register waaruit medewerkers kant-en-klare dashboards installeren via de marktplaats.', rows: [
        { pair: [{ label: 'Adres van het register', value: 'https://register.vng.nl/dashboards' }, { label: 'Toegangssleutel (niet verplicht)', value: '••••••••••••' }] },
        { buttons: [['Verbinding testen', '']] },
        { note: 'Verbonden, 23 dashboards beschikbaar op de marktplaats.', tone: 'plain' },
        { buttons: [['Opslaan', 'primary']] }
      ] }
    ];
    return { sections };
  }
}
</script>
</body>
</html>
