<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: event menu, several events selected and dragging</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 3440px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;Two events selected and dragged together, 3 h later: the pale ghosts stay where they were, the lifted blocks show their new time, the lower edge of a block is a resize handle</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" folded="true" hint-size="64px,945px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
          <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
            <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
            <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
            <span style="flex: 1 1 auto"></span>
            <div style="display: flex; align-items: center; gap: 4px; align-self: center">
              <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
              <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
              <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
              <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
          <button type="button" aria-label="Fold the overview" aria-expanded="true" title="Fold the overview" style="width: 34px; height: 34px; margin-left: 8px; border: 0; border-radius: var(--sc-radius, 8px); background: #eef0f3; color: #1b1c1d; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
            </div>
          </div>
          <div style="flex: none; display: flex; height: 34px">
            <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
            <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
              <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
            </sc-for>
          </div>
          <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
            <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
            <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
              <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
                <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
                  <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
                  <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
                  <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
                  <span style="flex: none; color: #3d4047">{{ b.number }}</span>
                  <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
                  <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
                  <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
                </a>
              </sc-for>
            </div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
            <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
              <div style="{{ h.lineStyle }}"></div>
              <div style="{{ h.localStyle }}">{{ h.local }}</div>
              <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
            </sc-for>
            <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
              <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
                <div style="{{ d.colStyle }}">
                  <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                    <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                      <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                        <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                        <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                        <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                        <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                      </span>
                      <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                      <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                      <sc-if value="{{ e.handle }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Drag to change the end time" style="position: absolute; left: 50%; bottom: 2px; width: 28px; height: 4px; margin-left: -14px; border-radius: 2px; background: #3669a5; cursor: ns-resize"></span></sc-if>
                    </a>
                  </sc-for>
                  <sc-if value="{{ d.hint }}" hint-placeholder-val="{{ false }}">
                    <div role="status" style="position: absolute; left: 8px; top: {{ d.hintTop }}px; z-index: 5; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 11px; line-height: 15px; white-space: nowrap; box-shadow: 0 4px 12px rgba(27,28,29,0.12)"><span style="font-weight: 600">Drop to move to Tuesday 14:00</span><span style="opacity: 0.8">2 events move together, 3 h later</span></div>
                  </sc-if>
                  <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
                </div>
              </sc-for>
            </div>
            <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
          </div>
        </main>
        <aside aria-label="Selection" style="flex: 0 0 300px; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 16px; background: #f5f6f8; overflow: hidden">
          <section aria-labelledby="sel-title" style="display: flex; flex-direction: column; gap: 8px">
            <h2 id="sel-title" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">2 events selected</h2>
            <sc-for list="{{ selected }}" as="s" hint-placeholder-count="2">
              <div style="display: flex; align-items: flex-start; gap: 8px; font-size: 14px; line-height: 20px"><span style="flex: none; width: 10px; height: 10px; margin-top: 5px; border-radius: 3px; background: {{ s.color }}"></span><span style="min-width: 0"><span style="font-weight: 600">{{ s.title }}</span><br><span style="font-size: 13px; color: #5e6168">{{ s.when }}</span></span></div>
            </sc-for>
          </section>
          <section aria-labelledby="sel-block" style="display: flex; flex-direction: column; gap: 8px">
            <h2 id="sel-block" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Also kept busy in</h2>
            <div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 20px">
              <span style="font-weight: 600">Demo preparation Malmo Energi</span>
              <span style="display: flex; align-items: center; gap: 8px"><span style="flex: none; width: 10px; height: 10px; border-radius: 3px; background: #3669a5"></span><span style="color: #3d4047">Personal, with the details</span></span>
              <span style="display: flex; align-items: center; gap: 8px"><span style="flex: none; width: 10px; height: 10px; border-radius: 3px; background: #538b28"></span><span style="color: #3d4047">Northwind team, busy only</span></span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 20px; margin-top: 4px">
              <span style="font-weight: 600">Release 16.5 scope review</span>
              <span style="color: #5e6168">Only in Northwind team, not kept busy anywhere else</span>
              <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; margin-top: 4px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>Also keep busy in another calendar</button>
            </div>
          </section>
        </aside>
      </div>
    </div>
  </figure>
  <div style="display: grid; grid-template-columns: 840px 1fr; gap: 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The menu of the two selected events, Also keep busy in has its own frame</figcaption>
      <div style="position: relative; height: 740px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div style="flex: none; display: flex; height: 34px; border-bottom: 1px solid #eef0f3">
          <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
          <sc-for list="{{ daysB }}" as="d" hint-placeholder-count="2"><div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div></sc-for>
        </div>
        <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
          <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div><div style="{{ h.utcStyle }}">{{ h.utc }}</div></sc-for>
          <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
            <sc-for list="{{ daysB }}" as="d" hint-placeholder-count="2">
              <div style="{{ d.colStyle }}">
                <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                  <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                    <span style="display: flex; align-items: center; gap: 4px; min-width: 0"><span style="{{ e.titleStyle }}">{{ e.title }}</span><sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if></span>
                    <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                    <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                  </a>
                </sc-for>
              </div>
            </sc-for>
          </div>
          <div role="menu" aria-label="Actions for 2 selected events" style="position: absolute; top: 226px; left: 380px; min-width: 340px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column">
            <span style="height: 32px; padding: 0 10px; display: flex; align-items: center; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">2 events selected</span>
            <sc-for list="{{ menu }}" as="i" hint-placeholder-count="9">
              <sc-if value="{{ i.sep }}" hint-placeholder-val="{{ false }}"><div role="separator" style="height: 1px; margin: 6px 0; background: #e4e6ea"></div></sc-if>
              <button type="button" role="menuitem" aria-haspopup="{{ i.sub }}" style="{{ i.style }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ i.iconColor }}"><path d="{{ i.icon }}"></path></svg><span style="flex: 1 1 auto">{{ i.label }}</span><sc-if value="{{ i.hint }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 13px; color: #5e6168">{{ i.hintText }}</span></sc-if><sc-if value="{{ i.swatches }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; display: inline-flex; gap: 3px"><sc-for list="{{ swatches }}" as="c" hint-placeholder-count="5"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{ c }}"></span></sc-for></span></sc-if><sc-if value="{{ i.isSub }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m9 18 6-6-6-6"></path></svg></sc-if></button>
            </sc-for>
          </div>
        </div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;Deleting an event you were invited to: room for a note to the organiser</figcaption>
      <div style="position: relative; height: 740px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div aria-hidden="true" style="flex: none; display: flex; height: 34px; border-bottom: 1px solid #eef0f3">
          <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
          <sc-for list="{{ daysC }}" as="d" hint-placeholder-count="2"><div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div></sc-for>
        </div>
        <div aria-hidden="true" style="flex: 1 1 auto; min-height: 0; position: relative; z-index: 0; overflow: hidden">
          <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div><div style="{{ h.utcStyle }}">{{ h.utc }}</div></sc-for>
          <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
            <sc-for list="{{ daysC }}" as="d" hint-placeholder-count="2">
              <div style="{{ d.colStyle }}">
                <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                  <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                    <span style="display: flex; align-items: center; gap: 4px; min-width: 0"><span style="{{ e.titleStyle }}">{{ e.title }}</span><sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if></span>
                    <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                    <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                  </a>
                </sc-for>
              </div>
            </sc-for>
          </div>
