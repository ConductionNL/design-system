          <p style="margin: 0; color: var(--sc-work-text, #3d4047)">Every message that arrives or leaves passes the rules below in this order, top to bottom. These run for everyone, before a person's own rules and before the filter script on their page. Each rule reads in plain words: when this, then that.</p>
          <p style="margin: 0; font-size: 12px; color: var(--sc-work-muted, #5e6168); line-height: 18px">Rules of Northwind Projects. A rule that is switched off stays in the chain but does nothing.</p>
