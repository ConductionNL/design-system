<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: list view of a filter at rest, a drag onto a day and onto a collection, quick add and sorting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}

<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 5565px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The filter Due this week as a list, grouped by day, at rest: quick add on top, one row hovered so its handle, star and pin show. The star and the pin are kept in Nextcloud, OpenProject has neither; the small marks on a row (notes, repeats, reminder, start date) read on hover. Closed work packages load only when you show them; the group menu of Closed holds Show 2 more and Delete all closed</figcaption>
    <div style="position: relative; height: 1073px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Due this week" hint-size="264px,1005px"></dc-import></div>

            <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Due this week</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Saved filter across your projects. 8 open work packages due Monday 12 to Friday 16 October, plus 1 overdue</span></div>
            <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
              <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
              <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
              <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>

            <div style="flex: 1 1 auto"></div>

            <div role="group" aria-label="Sort" style="display: flex; align-items: center; gap: 6px">

            </div>

            <sc-for list="{{ groupsA }}" as="g" hint-placeholder-count="7">
              <section aria-label="{{ g.title }}" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); overflow: hidden">
                <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-bottom: 1px solid #e4e6ea; background: #ffffff">
                  <h2 style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: {{ g.color }}">{{ g.title }}</h2>

                </div>
                <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
                  <sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3">
                    <li aria-label="{{ r.aria }}" style="{{ r.style }}">
                      <span aria-hidden="true" style="{{ r.handleStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01"></path></svg></span>
                      <button type="button" role="checkbox" aria-checked="{{ r.checked }}" aria-label="{{ r.checkLabel }}" title="{{ r.checkLabel }}" style="{{ r.checkStyle }}"><sc-if value="{{ r.isDone }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button>
                      <button type="button" aria-label="{{ r.starLabel }}" aria-pressed="{{ r.starred }}" style="{{ r.starStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ r.starFill }}" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg></button>
                      <button type="button" aria-label="{{ r.pinLabel }}" aria-pressed="{{ r.pinned }}" style="{{ r.pinStyle }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="{{ r.pinFill }}" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 7 3 2v2H7v-2l3-2z"></path></svg></button>
                      <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; width: 112px"><span style="{{ r.typeStyle }}">{{ r.type }}</span><span style="color: #3d4047">{{ r.number }}</span></span>
                      <span dir="{{ r.dir }}" style="{{ r.titleStyle }}" title="{{ r.title }}">{{ r.title }}<sc-if value="{{ r.hasLink }}" hint-placeholder-val="{{ false }}"> <a href="{{ r.link }}" style="color: var(--sc-link, #3669a5)">{{ r.linkText }}</a></sc-if></span>
                      <span title="Project: {{ r.project }}" style="flex: none; width: 150px; font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.project }}</span>
                      <span role="group" aria-label="{{ r.tagsLabel }}" style="flex: none; display: inline-flex; gap: 4px"><sc-for list="{{ r.tags }}" as="t" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--sc-radius, 8px); background: #f0f1f3; color: #3d4047; font-size: 11px; white-space: nowrap"><span style="{{ t.dot }}"></span>{{ t.name }}</span></sc-for></span>
                      <span style="flex: none; display: inline-flex; gap: 6px; width: 92px; color: #5e6168"><sc-for list="{{ r.icons }}" as="k" hint-placeholder-count="2"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{ k.label }}"><title>{{ k.label }}</title><path d="{{ k.d }}"></path></svg></sc-for></span>
                      <span style="{{ r.dueStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{ r.due }}</span>
                    </li>
                  </sc-for>
                  <sc-if value="{{ g.hasDrop }}" hint-placeholder-val="{{ false }}"><li aria-live="polite" style="display: flex; align-items: center; justify-content: flex-end; height: 52px; margin: 6px 14px 8px; padding: 0 24px; box-sizing: border-box; border: 2px dashed #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 600">Drop here to plan it for Thursday 15 October</li></sc-if>

                </ol>
              </section>
            </sc-for>
          </div>
        </main>
      </div>
    </div>
  </figure>

    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;TASK #58440 dragged from Friday onto Thursday: the slot it came from stays empty, Thursday opens a drop zone. Drop it between two rows to reorder, or on a day to plan it there</figcaption>

            <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">

              <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>

    ].map(([type, number, title, due]) => ({ type, number, title, due, typeStyle: 'font-weight: 700; letter-spacing: 0.04em; font-size: 12px; color: ' + TYPE[type] }));
    // Frame h: selection mode, three rows selected.
    const selRow = (r, selected) => ({ ...mk(r), title: r.link ? r.title + ' ' + r.link : r.title, selected: selected ? 'true' : 'false', isSelected: !!selected, notSelected: !selected, selLabel: (selected ? 'Selected: ' : 'Select ') + r.type + ' ' + r.number,
      style: rowBase + (r.last ? 'border-bottom: 0; ' : '') + (selected ? 'background: #eaf0f7; ' : '') });
    const groupsH = [
      { title: 'Today, Monday 12 October', color: '#5e6168', rows: [[ROWS.today, true]] },
      { title: 'Tuesday 13 October', color: '#5e6168', rows: [[ROWS.tue, false]] },
      { title: 'Wednesday 14 October', color: '#5e6168', rows: [[ROWS.wed1, true], [ROWS.wed2, true], [ROWS.wed3, false]] }
    ].map((g) => ({ title: g.title, color: g.color, count: g.rows.length, rows: g.rows.map(([r, on]) => selRow(r, on)) }));
    // Frame i: % complete bars.
    const rowsI = [[ROWS.today, 80], [ROWS.tue, 25], [ROWS.wed1, 60], [ROWS.wed2, 0], [{ ...ROWS.thu, last: true }, 100]].map(([r, pct], i, a) => ({ ...mk({ ...r, last: i === a.length - 1 }), title: r.link ? r.title + ' ' + r.link : r.title, pct, pctLabel: '% complete: ' + pct,
      barStyle: 'position: absolute; left: 0; top: 0; bottom: 0; width: ' + pct + '%; border-radius: 2px; background: ' + (pct === 100 ? '#538b28' : '#3669a5') }));
    // Frame k: private work packages carry a lock.
    const rowsK = [[ROWS.today, false], [ROWS.tue, true, true], [ROWS.wed1, false], [ROWS.wed2, true], [{ ...ROWS.thu, last: true }, false]].map(([r, priv, mark], i, a) => ({ ...mk({ ...r, last: i === a.length - 1 }), title: r.link ? r.title + ' ' + r.link : r.title, isPrivate: !!priv, hasMark: !!mark,
      aria: r.type + ' ' + r.number + ', ' + r.title + (priv ? ', private' : '') }));
    return { dropTargets, groupsA, groupsB, groupsC, groupsD, drag, dragC, sortItems, sortedPreview, groupsH, rowsI, rowsK };
  }
}
