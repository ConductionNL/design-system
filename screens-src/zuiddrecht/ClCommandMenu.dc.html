<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: command menu with the shortcut overview and the legend</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 4579px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The command menu opened with Ctrl K over a normal week: actions, go to and settings, each with its key; what an action does is its tooltip</figcaption>
    <div style="position: relative; height: 1013px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 100%; overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="264px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; position: relative">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #828a95; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
          <button type="button" aria-label="Open the overview" aria-expanded="false" title="Open the overview" style="width: 34px; height: 34px; margin-left: 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
        </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.done }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Completed" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: {{ b.color }}"><circle cx="12" cy="12" r="9"></circle><path d="m8 12 3 3 5-6"></path></svg></sc-if>
              <sc-if value="{{ b.open }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Open task" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex: none; color: {{ b.color }}"><circle cx="12" cy="12" r="9"></circle></svg></sc-if>
              <sc-if value="{{ b.card }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Board card" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; color: {{ b.color }}"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M7 9h10M7 13h6"></path></svg></sc-if>
              <sc-if value="{{ b.hasType }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span><span style="flex: none; color: #3d4047">{{ b.number }}</span></sc-if>
              <span style="{{ b.subjectStyle }}">{{ b.subject }}</span>
              <sc-if value="{{ b.hasTail }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-weight: 600; color: {{ b.tailColor }}">{{ b.tail }}</span></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <sc-if value="{{ e.bell }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="Reminder set" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasLabel }}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #5e6168; white-space: nowrap">{{ e.label }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
      </div>
      <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(27,28,29,0.28); z-index: 20"></div>
      <div role="dialog" aria-modal="true" aria-label="Command menu" style="position: absolute; top: 10px; right: 16px; width: 520px; box-sizing: border-box; background: #ffffff; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.22); z-index: 21; display: flex; flex-direction: column; overflow: hidden">
        <label style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea; color: #5e6168; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Find an action or a setting</span><input type="search" placeholder="Find any action or setting" style="flex: 1 1 auto; min-width: 0; border: 0; background: transparent; font: 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none"><kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #828a95; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">Esc</kbd></label>
        <div style="display: flex; flex-direction: column; gap: 6px; padding: 8px">
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
            <div role="group" aria-label="{{ g.label }}" style="display: flex; flex-direction: column">
              <div style="padding: 6px 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.label }}</div>
              <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
                <button type="button" aria-current="{{ it.current }}" title="{{ it.hint }}" style="{{ it.style }}">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="{{ it.icon }}"></path></svg>
                  <span style="flex: 1 1 auto; min-width: 0; font-weight: 500; text-align: left">{{ it.label }}</span>
                  <sc-if value="{{ it.hasSwitch }}" hint-placeholder-val="{{ false }}"><span role="switch" aria-checked="{{ it.on }}" aria-label="{{ it.label }}" style="{{ it.switch }}"><span style="{{ it.knob }}"></span></span></sc-if>
                  <sc-if value="{{ it.hasKey }}" hint-placeholder-val="{{ true }}"><kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #828a95; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">{{ it.key }}</kbd></sc-if>
                </button>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </div>
    </main>
  </div>
</div>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The shortcut overview, opened with the key ?: the Shortcuts tab with the profile choice (Standard, or the keys of Gmail or Outlook) and every shortcut in six groups</figcaption>
    <div style="position: relative; height: 780px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: #ffffff">
      <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div></sc-for>
    </div>
    <div style="position: absolute; inset: 0; z-index: 20; background: rgba(27,28,29,0.45); display: flex; align-items: flex-start; justify-content: center; padding-top: 24px">
      <div role="dialog" aria-modal="true" aria-labelledby="cl-keys-title-2" style="width: 860px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 12px 32px rgba(27,28,29,0.24); overflow: hidden">
        <div style="flex: none; display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 16px 12px 12px 24px; border-bottom: 1px solid #e4e6ea">
          <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <h3 id="cl-keys-title-2" style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px">All keyboard shortcuts</h3>
            <span style="font-size: 12px; color: #5e6168; line-height: 18px; display: inline-flex; align-items: center; gap: 6px">Opened with <kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #828a95; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">?</kbd> from anywhere in the calendar. Esc closes it.</span>
          </div>
          <button type="button" aria-label="Close" style="flex: none; width: 40px; height: 40px; margin: -8px 0; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
        </div>
        <div role="tablist" aria-label="Overview" style="flex: none; display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid #e4e6ea"><button type="button" role="tab" aria-selected="true" style="height: 44px; padding: 0 12px; border: 0; border-bottom: 2px solid var(--sc-action, #3669a5); background: transparent; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d; white-space: nowrap">Shortcuts</button><button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0 12px; border: 0; border-bottom: 2px solid transparent; background: transparent; font: 500 14px 'Fira Sans', sans-serif; color: #5e6168; white-space: nowrap">Legend</button></div>
        <fieldset style="margin: 0; padding: 8px 24px; border: 0; border-bottom: 1px solid #e4e6ea; display: flex; align-items: center; gap: 24px; flex-wrap: wrap"><legend style="float: left; padding: 0; margin: 0 8px 0 0; height: 40px; line-height: 40px; font-size: 14px; font-weight: 600">Shortcut profile</legend><label style="display: inline-flex; align-items: center; gap: 8px; height: 40px; font-size: 14px; white-space: nowrap"><input type="radio" name="key-profile" checked style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 9px; background: #ffffff; display: inline-flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: var(--sc-action, #3669a5)"></span></span>Standard</label><label style="display: inline-flex; align-items: center; gap: 8px; height: 40px; font-size: 14px; white-space: nowrap"><input type="radio" name="key-profile" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1px solid #828a95; border-radius: 9px; background: #ffffff"></span>Like Gmail</label><label style="display: inline-flex; align-items: center; gap: 8px; height: 40px; font-size: 14px; white-space: nowrap"><input type="radio" name="key-profile" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)"><span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1px solid #828a95; border-radius: 9px; background: #ffffff"></span>Like Outlook</label></fieldset>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; padding: 8px 24px 20px">
          <section aria-label="Shortcuts, moving and views" style="display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{ keyGroupsLeft }}" as="kg" hint-placeholder-count="3">
              <div style="margin-top: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ kg.label }}</div>
              <sc-for list="{{ kg.keys }}" as="k" hint-placeholder-count="3">
                <div style="display: flex; align-items: center; gap: 8px; height: 26px; font-size: 13px; color: #3d4047"><span style="flex: none; display: inline-flex; gap: 3px; min-width: 70px"><sc-for list="{{ k.keys }}" as="kk" hint-placeholder-count="1"><kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #828a95; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">{{ kk }}</kbd></sc-for></span><span>{{ k.label }}</span></div>
              </sc-for>
            </sc-for>
          </section>
          <section aria-label="Shortcuts, events and the date picker" style="display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{ keyGroupsRight }}" as="kg" hint-placeholder-count="3">
              <div style="margin-top: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ kg.label }}</div>
              <sc-for list="{{ kg.keys }}" as="k" hint-placeholder-count="3">
                <div style="display: flex; align-items: center; gap: 8px; height: 26px; font-size: 13px; color: #3d4047"><span style="flex: none; display: inline-flex; gap: 3px; min-width: 70px"><sc-for list="{{ k.keys }}" as="kk" hint-placeholder-count="1"><kbd style="flex: none; display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border: 1px solid #828a95; border-bottom-width: 2px; border-radius: 4px; background: #ffffff; font: 600 11px 'Fira Sans', sans-serif; color: #1b1c1d">{{ kk }}</kbd></sc-for></span><span>{{ k.label }}</span></div>
              </sc-for>
            </sc-for>
          </section>
        </div>
      </div>
    </div>
    </div>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The Legend tab of the same overview: how events are styled in the grid and what the icons on an event mean</figcaption>
    <div style="position: relative; height: 540px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: #ffffff">
      <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11"><div style="{{ h.lineStyle }}"></div><div style="{{ h.localStyle }}">{{ h.local }}</div></sc-for>
