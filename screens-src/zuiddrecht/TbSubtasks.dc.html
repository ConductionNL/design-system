<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: list view with child work packages</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#tb-child::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 1868px; padding: 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The Lyon project as a tree under the List view: quick add with a pasted list, an add child field, a folded epic, closed children shown, and TASK #58441 dragged onto a parent</figcaption>
<div style="position: relative; height: 1140px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="List" hint-size="264px,1070px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
      <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">9 open work packages, 6 of them child work packages</span></div>
        <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg>Board</button>
          <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>List</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg>Gantt</button>
        </div>
        <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Status. Choose assignee or version" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Status<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <div style="flex: 1 1 auto"></div>
        <button type="button" aria-pressed="false" aria-haspopup="dialog" aria-keyshortcuts="F" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter</button>
        <div role="group" aria-label="Members" style="flex: none; display: flex; align-items: center">
          <span title="Olivia Brandt" aria-label="Olivia Brandt" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: #eaf0f7; color: #234a78">OB</span>
          <span title="Tom Achterberg" aria-label="Tom Achterberg" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">TA</span>
          <span title="Priya Raman" aria-label="Priya Raman" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eaf0f7; color: #234a78">PR</span>
          <span title="2 more members" aria-label="2 more members" role="img" style="width: 30px; height: 30px; box-sizing: border-box; border-radius: 15px; border: 2px solid #ffffff; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-left: -8px; background: #eef0f3; color: #3d4047">+2</span>
        </div>
        <button type="button" aria-pressed="false" aria-haspopup="dialog" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 16v-4M12 8h.01"></path></svg>Project details</button>
      </div>
      <div role="toolbar" aria-label="List options" style="flex: none; display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 24px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
        <div role="group" aria-label="Show as a tree or as a flat list" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
          <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7M3 12h7M3 18h7M14 6h7M17 12h4M17 18h4"></path></svg>Tree</button>
          <button type="button" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Flat list</button>
        </div>
        <span style="font-size: 13px; color: #5e6168; white-space: nowrap">Parents with their child work packages, children indented</span>
        <div style="flex: 1 1 auto"></div>
        <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5h10M11 9h7M11 13h4M3 17l3 3 3-3M6 18V4"></path></svg>Sort: manual<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
        <button type="button" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Show closed children</button>
      </div>

      <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 24px 64px; overflow: hidden">
        <section aria-label="Quick add" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #3669a5; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 0 0 3px #eaf0f7">
          <div style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px 6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 3px; color: #3669a5"><path d="M12 5v14M5 12h14"></path></svg>
            <div role="textbox" aria-multiline="true" aria-label="Quick add. Paste an indented list to create a work package with child work packages" style="flex: 1 1 auto; min-width: 0; font-size: 14px; line-height: 21px; color: #1b1c1d; white-space: pre-wrap">Prepare the Lyon training day
    Book the training room in Lyon
    Send the agenda to Marc Dubois
    Prepare the exercise project<span aria-hidden="true" style="display: inline-block; width: 1px; height: 18px; margin-left: 1px; vertical-align: -3px; background: #1b1c1d"></span></div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; padding: 10px 14px 12px; border-top: 1px solid #e4e6ea; font-size: 13px; color: #5e6168; line-height: 18px">
            <span style="flex: 1 1 auto; min-width: 0">Paste an indented list to create a work package with child work packages: the first line becomes the parent, the 3 indented lines its children.</span>
            <button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Add 1 parent and 3 children</button>
          </div>
        </section>


        <section aria-label="Work packages" style="display: flex; flex-direction: column; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); overflow: hidden">
          <ol role="tree" aria-label="Work packages of Northwind rollout Lyon" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="12">
              <li role="treeitem" aria-level="{{ r.level }}" aria-expanded="{{ r.expanded }}" aria-label="{{ r.aria }}" style="{{ r.style }}">
                <span aria-hidden="true" style="flex: none; width: 14px; color: #c4c7cb; display: inline-flex; align-items: center; justify-content: center; cursor: grab"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01"></path></svg></span>
                <span aria-hidden="true" style="{{ r.indent }}"></span>
                <sc-if value="{{ r.hasToggle }}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="{{ r.toggleLabel }}" aria-expanded="{{ r.expanded }}" style="flex: none; width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ r.toggleIcon }}"></path></svg></button></sc-if>
                <sc-if value="{{ r.noToggle }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 28px"></span></sc-if>
                <button type="button" role="checkbox" aria-checked="{{ r.checked }}" aria-label="{{ r.checkLabel }}" style="{{ r.checkStyle }}"><sc-if value="{{ r.isDone }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></button>
                <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; width: 112px"><span style="{{ r.typeStyle }}">{{ r.type }}</span><span style="color: #3d4047">{{ r.number }}</span></span>
                <span style="{{ r.titleStyle }}">{{ r.title }}</span>
                <sc-if value="{{ r.hasCount }}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 7px; border-radius: var(--sc-radius, 8px); background: #eef0f3; color: #3d4047; font-size: 11px; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h7M3 12h7M3 18h7M14 6h7M17 12h4M17 18h4"></path></svg>{{ r.count }}</span></sc-if>
                <span style="{{ r.statusStyle }}"><span style="{{ r.dot }}"></span>{{ r.status }}</span>
                <span title="{{ r.assignee }}" role="img" aria-label="Assignee {{ r.assignee }}" style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ r.initials }}</span>
                <span style="{{ r.dueStyle }}">{{ r.due }}</span>
              </li>
              <sc-if value="{{ r.hasAddChild }}" hint-placeholder-val="{{ false }}"><li style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px 0 82px; box-sizing: border-box; border-bottom: 1px solid #e4e6ea; background: #f5f6f8">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #3669a5"><path d="M12 5v14M5 12h14"></path></svg>
                <label for="tb-child" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add a child work package under FEATURE #58412</label>
                <input id="tb-child" type="text" placeholder="Add a child work package under FEATURE #58412" style="flex: 1 1 auto; min-width: 0; height: 34px; box-sizing: border-box; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 14px 'Fira Sans', sans-serif; color: #1b1c1d">
                <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">Enter adds it, Tab indents it one level deeper</span>
              </li></sc-if>
              <sc-if value="{{ r.hasDropHint }}" hint-placeholder-val="{{ false }}"><li aria-live="polite" style="display: flex; align-items: center; gap: 10px; height: 36px; margin: 0 14px 0 106px; box-sizing: border-box; border: 2px dashed #3669a5; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; font-size: 12px; font-weight: 600; padding: 0 12px">{{ r.dropHint }}</li></sc-if>
            </sc-for>
          </ol>
        </section>


        <div aria-label="{{ drag.aria }}" style="{{ drag.style }}">
          <span aria-hidden="true" style="flex: none; width: 14px; color: #c4c7cb; display: inline-flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M9 5h.01M9 12h.01M9 19h.01M15 5h.01M15 12h.01M15 19h.01"></path></svg></span>
          <span aria-hidden="true" style="flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1.5px solid #c4c7cb; border-radius: 4px; background: #ffffff"></span>
          <span style="flex: none; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="font-weight: 700; letter-spacing: 0.04em; color: #08a5df">TASK</span><span style="color: #3d4047">#58441</span></span>
          <span style="flex: 1 1 auto; min-width: 0; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Move kick-off to the afternoon</span>
          <span style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">Thu 15 Oct</span>
        </div>
        <div role="status" style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: var(--sc-radius, 8px); background: #1b1c1d; color: #ffffff; font-size: 13px; white-space: nowrap; box-shadow: 0 4px 12px rgba(27,28,29,0.12)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"></path></svg>Moving TASK #58441. Drop it on a row to make it a child of that work package, at any depth.</div>
      </div>
    </main>
  </div>
</div>
</figure>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The question asked the moment FEATURE #58215 is marked closed while 3 of its children are still open</figcaption>
    <div style="height: 280px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div role="dialog" aria-modal="true" aria-label="Close the child work packages too?" style="display: flex; flex-direction: column; gap: 0; padding: 0; max-width: 480px; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; box-shadow: 0 16px 48px rgba(27,28,29,0.28)">
          <h2 style="margin: 0; padding: 20px 24px 8px; font-size: 20px; font-weight: 700; line-height: 26px">Close the 3 open child work packages too?</h2>
          <p style="margin: 0; padding: 0 24px 16px; font-size: 14px; color: #3d4047; line-height: 21px">You marked FEATURE #58215 closed.</p>
          <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; padding: 16px 24px; border-top: 1px solid #eef0f3">
            <button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Only this one</button>
            <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Close them too</button>
          </div>
        </div>
        <span style="font-size: 12px; color: #5e6168; line-height: 18px">Nothing changes in OpenProject until you choose. Only this one leaves the others as they are, as OpenProject does.</span>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">c</span> &nbsp;The same question when TASK #58301 is cancelled</figcaption>
    <div style="height: 280px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
