body{margin:0}

<nav aria-label="{{ app }}" style="font-family: 'Barlow', system-ui, sans-serif; color: #1b1c1d; width: 100%; min-height: 100%; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e4e6ea; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px">

    <span style="display: flex; flex-direction: column; line-height: 1.15"><strong style="font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; font-size: 21px; font-weight: 700">{{ app }}</strong><span style="font-size: 13px; color: #5e6168">{{ sub }}</span></span>
  </div>
  <button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 42px; border: 0; border-radius: 8px; background: #0b6e7a; color: #ffffff; font: 600 15px 'Barlow', sans-serif">

  </button>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-if value="{{ g.hasTitle }}" hint-placeholder-val="{{ true }}"><span style="padding: 0 10px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span></sc-if>
      <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
        <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="{{ it.icon }}"></path></svg>
          <span style="flex: 1">{{ it.label }}</span>
          <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #c2410c; color: #ffffff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ it.badge }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </sc-for>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 2px">
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: 8px; color: #1b1c1d; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>Instellingen</a>
    <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 10px; border-radius: 8px; color: #1b1c1d; text-decoration: none; font-size: 15px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17v.5"></path></svg>Hulp en uitleg</a>
  </div>
</nav>
</x-dc>
