<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tasks: work package panel with its fields being edited</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
#tb-filter::placeholder,#wf-assign::placeholder,#wf-tags::placeholder,#wf-assign-b::placeholder,#wf-tags-b::placeholder{color:#5e6168}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2090px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The panel of FEATURE #58412 with every field in edit state: assignees, tags, priority, done, dates, place, web address, what shared people see, and the work packages it depends on. The mark Nextcloud only means: kept in Nextcloud, OpenProject does not have this</figcaption>
    <div style="position: relative; height: 1470px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
      <dc-import name="MlHeader" app="Tasks" placeholder="Search tasks, people or #work package" hint-size="100%,55px"></dc-import>
      <div style="display: flex; flex: 1 1 auto; min-height: 0">
        <div style="flex: 0 0 64px; width: 64px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="TbNav" active="Board" folded="true" hint-size="64px,1402px"></dc-import></div>
        <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #f5f6f8; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px; box-sizing: border-box; background: #ffffff; border-bottom: 1px solid #e4e6ea">
            <div style="display: flex; flex-direction: column; min-width: 0; line-height: 1.2"><h1 style="margin: 0; font-size: 20px; font-weight: 700; line-height: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwind rollout Lyon</h1><span style="font-size: 12px; line-height: 16px; color: #5e6168; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">9 open work packages</span></div>
            <div role="group" aria-label="View: Board, List or Gantt" style="flex: none; display: inline-flex; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; overflow: hidden">
              <button type="button" aria-label="Board" title="Board" aria-pressed="true" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 9px; border: 0; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #eaf0f7; color: #234a78"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h4a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zM15 3h4a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"></path></svg></button>
              <button type="button" aria-label="List" title="List" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 9px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg></button>
              <button type="button" aria-label="Gantt" title="Gantt" aria-pressed="false" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 9px; border: 0; border-left: 1px solid #c4c7cb; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; background: #ffffff; color: #3d4047"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h8M7 12h10M11 18h10"></path></svg></button>
            </div>
            <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Group by: Status. Choose assignee or version" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><span style="font-weight: 400; color: #5e6168">Group by</span>Status<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
            <div style="flex: 1 1 auto"></div>
            <button type="button" aria-pressed="false" aria-haspopup="dialog" aria-keyshortcuts="F" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"></path></svg>Filter</button>
            <button type="button" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for this project" style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 34px; padding: 0 8px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">More<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; position: relative; display: flex; gap: 10px; padding: 12px; overflow: hidden">
            <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
              <section aria-label="{{ col.name }}" style="flex: 0 0 226px; width: 226px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 6px; border-radius: var(--sc-radius, 8px); background: #eef0f3; align-self: flex-start; max-height: 100%">
                <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 6px">
                  <span style="{{ col.dot }}"></span>
                  <h2 style="margin: 0; flex: 1 1 auto; min-width: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.name }}</h2>
                  <span aria-label="{{ col.countLabel }}" style="{{ col.countStyle }}">{{ col.count }}</span>
                </div>
                <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
                  <a href="{{ c.href }}" aria-label="{{ c.aria }}" aria-current="{{ c.current }}" style="{{ c.style }}">
                    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px"><span style="{{ c.typeStyle }}">{{ c.type }}</span><span style="color: #3d4047">{{ c.number }}</span></span>
                    <span style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14px; font-weight: 500; line-height: 20px; color: #1b1c1d">{{ c.subject }}</span>
                    <span style="display: flex; align-items: center; gap: 6px; margin-top: 2px">
                      <sc-if value="{{ c.hasAssignee }}" hint-placeholder-val="{{ true }}"><span title="{{ c.assignee }}" role="img" aria-label="Assignee {{ c.assignee }}" style="flex: none; width: 22px; height: 22px; border-radius: 11px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700">{{ c.initials }}</span></sc-if>
                      <sc-if value="{{ c.hasDue }}" hint-placeholder-val="{{ true }}"><span style="{{ c.dueStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg>{{ c.due }}</span></sc-if>
                    </span>
                  </a>
                </sc-for>
              </section>
            </sc-for>
          </div>
        </main>
        <aside aria-label="Work package FEATURE #58412, editing the fields" style="flex: 0 0 480px; width: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #ffffff; border-left: 1px solid #e4e6ea; overflow: hidden">
          <div style="flex: none; display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 16px; border-bottom: 1px solid #e4e6ea">
            <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Work package</span>
            <div style="display: flex; align-items: center; gap: 2px">
              <button type="button" aria-label="Mark this work package closed. Applies at once in OpenProject" title="Applies at once in OpenProject" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px; margin-right: 4px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Mark closed</button>
              <a href="TbCardDetails.dc.html" aria-label="Open in full width" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"></path></svg></a>
              <a href="TbCard.dc.html" aria-label="Close the work package panel" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></a>
            </div>
          </div>
          <div style="flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 12px; padding: 14px 16px 12px">
            <div style="display: flex; align-items: center; gap: 8px; font-size: 14px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; color: #538b28">FEATURE</span><a href="#" style="color: var(--sc-link, #3669a5); text-decoration: none; font-weight: 600">#58412</a><span style="flex: 1 1 auto"></span><span style="font-size: 12px; color: #5e6168">Northwind rollout Lyon</span></div>
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; line-height: 22px">Link Nextcloud project folders on rollout</h2>

            <div style="display: grid; grid-template-columns: 128px 1fr; gap: 12px 12px; align-items: start; font-size: 14px; padding-top: 12px; border-top: 1px solid #e4e6ea">
              <span style="{{ lab }}">Status</span>
              <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
                <button type="button" aria-label="Status: in development, change" aria-haspopup="menu" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid #21c8de; border-radius: var(--sc-radius, 8px); background: #66d9e8; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">in development<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
                <span style="font-size: 12px; color: #5e6168">Another status moves the card to that column when you save.</span>
              </div>

              <label for="wf-assign" style="{{ lab }}">Assignees</label>
              <div style="{{ tokenField }}">
                <sc-for list="{{ assignees }}" as="a" hint-placeholder-count="3">
                  <span style="{{ token }}"><sc-if value="{{ a.person }}" hint-placeholder-val="{{ true }}"><span style="{{ tokenAv }}">{{ a.initials }}</span></sc-if><sc-if value="{{ a.group }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if><sc-if value="{{ a.remote }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></sc-if><span>{{ a.name }}</span><sc-if value="{{ a.hasNote }}" hint-placeholder-val="{{ false }}"><span style="color: #5e6168">{{ a.note }}</span></sc-if><button type="button" aria-label="Remove {{ a.name }} as assignee" style="{{ tokenX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span>
                </sc-for>
                <input id="wf-assign" type="text" placeholder="Add a person or group" style="{{ tokenInputWide }}">
              </div>
              <span aria-hidden="true"></span><span style="font-size: 12px; color: #5e6168; line-height: 16px; margin-top: -4px">Kept in OpenProject as a custom field.</span>

              <label for="wf-tags" style="{{ lab }}">Tags</label>
              <div style="{{ tokenField }}">
                <sc-for list="{{ tags }}" as="t" hint-placeholder-count="2"><span style="{{ token }}"><span style="{{ t.dot }}"></span><span>{{ t.name }}</span><button type="button" aria-label="Remove the tag {{ t.name }}" style="{{ tokenX }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></span></sc-for>
                <input id="wf-tags" type="text" value="Folders" aria-describedby="wf-tags-hint" style="{{ tokenInput }}">
                <span id="wf-tags-hint" style="flex: none; font-size: 12px; color: #5e6168; white-space: nowrap">Enter creates it</span>
              </div>

              <span id="wf-prio" style="{{ lab }}">Priority</span>
              <div style="display: flex; flex-direction: column; gap: 4px">
                <div role="radiogroup" aria-labelledby="wf-prio" aria-label="Priority: Low, Normal, High or Immediate" style="display: flex; gap: 8px; flex-wrap: wrap">
                  <sc-for list="{{ prio }}" as="p" hint-placeholder-count="4"><label style="{{ p.style }}"><sc-if value="{{ p.on }}" hint-placeholder-val="{{ false }}"><input type="radio" name="wf-prio" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"></sc-if><sc-if value="{{ p.off }}" hint-placeholder-val="{{ true }}"><input type="radio" name="wf-prio" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"></sc-if>{{ p.label }}</label></sc-for>
                </div>
                <span style="font-size: 12px; color: #5e6168">As OpenProject names them. The card shows the word.</span>
              </div>

              <label for="wf-done" style="{{ lab }}">% complete</label>
              <div style="display: flex; align-items: center; gap: 10px">
                <span aria-hidden="true" style="flex: 1 1 auto; position: relative; height: 6px; border-radius: 3px; background: #eef0f3"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 60%; border-radius: 3px; background: #3669a5"></span><span style="position: absolute; left: calc(60% - 9px); top: -6px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 9px; background: #ffffff; border: 2px solid #3669a5"></span></span>
                <input id="wf-done" type="text" value="60" inputmode="numeric" aria-label="% complete" style="{{ num }}"><span>%</span>
              </div>

              <span style="{{ lab }}; grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding-top: 4px">Completion date<span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span>
              <div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 8px">
                <button type="button" aria-haspopup="dialog" aria-label="Completion date, not set" style="{{ chooser }}">Not closed yet<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></button>
                <span style="font-size: 12px; color: #5e6168">Filled in when it closes. Change it here if it closed earlier.</span>
              </div>

              <label for="wf-place" style="{{ lab }}">Location</label>
              <div style="position: relative; display: flex; align-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: #5e6168"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"></path></svg><input id="wf-place" type="text" value="Lyon, Hotel de Ville, room 2.14" style="{{ input }}"></div>

              <label for="wf-url" style="{{ lab }}">Web address</label>
              <div style="position: relative; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 12px; color: #5e6168"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg><input id="wf-url" type="url" value="https://cloud.ville-de-lyon.fr/f/rollout-phase-2" style="{{ input }}"><a href="#" aria-label="Open the web address in a new tab" style="flex: none; width: 34px; height: 34px; border-radius: var(--sc-radius, 8px); color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6M15 3h6v6M10 14 21 3"></path></svg></a></div>
              <span aria-hidden="true"></span><span style="font-size: 12px; color: #5e6168; line-height: 16px; margin-top: -4px">Both kept in OpenProject as a custom field.</span>

              <span style="{{ lab }}; grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding-top: 4px"><span id="wf-vis">Visible to people the board is shared with</span><span role="img" title="Kept in Nextcloud. OpenProject does not have this." aria-label="Kept in Nextcloud. OpenProject does not have this." style="flex: none; display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #5e6168; font: 600 11px 'Fira Sans', sans-serif; line-height: 16px; letter-spacing: 0; text-transform: none; white-space: nowrap; vertical-align: middle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg>Nextcloud only</span></span>
              <div style="grid-column: 1 / -1; display: flex; flex-direction: column; gap: 6px">
                <div role="radiogroup" aria-labelledby="wf-vis" style="display: flex; gap: 8px; flex-wrap: wrap">
                  <sc-for list="{{ visibility }}" as="v" hint-placeholder-count="3"><label style="{{ v.style }}"><sc-if value="{{ v.on }}" hint-placeholder-val="{{ false }}"><input type="radio" name="wf-vis" checked style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"></sc-if><sc-if value="{{ v.off }}" hint-placeholder-val="{{ true }}"><input type="radio" name="wf-vis" style="width: 18px; height: 18px; margin: 0; accent-color: #3669a5"></sc-if>{{ v.label }}</label></sc-for>
                </div>
                <span style="font-size: 12px; color: #5e6168; line-height: 18px">Dates and type only shows the dates and the type, not the title. Not at all: only members of Northwind rollout Lyon open it.</span>
              </div>
            </div>

            <section aria-labelledby="wf-rel" style="flex: none; display: flex; flex-direction: column; gap: 8px; padding: 12px 0 6px; margin-top: 4px; border-top: 1px solid #e4e6ea; background: #ffffff">
