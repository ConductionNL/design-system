<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenProject twin: administration</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 15px; line-height: 22px; background: #f5f6f8; display: flex; flex-direction: column; min-height: 1000px">
  <dc-import name="OpHeader" current="Administration" placeholder="Search settings, users or projects" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
    <nav aria-label="Administration menu" style="flex: 0 0 264px; width: 264px; box-sizing: border-box; background: #ffffff; border-right: 1px solid #e4e6ea; padding: 20px 14px; display: flex; flex-direction: column; gap: 20px; font-size: 15px">
      <a href="OpHome.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 4px 10px; border-radius: var(--sc-radius, 8px); background: #f5f6f8; color: #1b1c1d; text-decoration: none">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #5e6168"><path d="m15 18-6-6 6-6"></path></svg>
        <span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 12px; color: #5e6168">Back to</span><strong style="font-size: 14px; font-weight: 600">Projects</strong></span>
      </a>
      <sc-for list="{{ menu }}" as="g" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="padding: 0 10px 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">{{ g.title }}</span>
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
            <a href="{{ it.href }}" aria-current="{{ it.current }}" style="{{ it.style }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ it.icon }}"></path></svg><span style="flex: 1">{{ it.label }}</span></a>
          </sc-for>
        </div>
      </sc-for>
    </nav>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <main style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; max-width: 1240px; box-sizing: border-box; width: 100%">
        <section style="display: flex; flex-direction: column; gap: 6px; padding: 4px 0 8px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px">
            <h1 style="flex: 1 1 320px; min-width: 0; margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Administration</h1>
            <button type="button" style="{{ btnPrimary }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a user</button>
          </div>
          <span style="color: #5e6168">Northwind Projects · OpenProject 16.5 · 3 projects, 14 users</span>
        </section>

        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
          <sc-for list="{{ cards }}" as="c" hint-placeholder-count="6">
            <section aria-labelledby="h-{{ c.id }}" style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); padding: 16px 20px; display: flex; flex-direction: column; gap: 10px">
              <div style="display: flex; align-items: center; gap: 12px">
                <span style="flex: none; width: 36px; height: 36px; border-radius: var(--sc-radius, 8px); background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ c.icon }}"></path></svg></span>
                <span style="display: flex; flex-direction: column; line-height: 1.25; min-width: 0"><h2 id="h-{{ c.id }}" style="margin: 0; font-size: 16px; font-weight: 700">{{ c.title }}</h2><span style="font-size: 13px; color: #5e6168">{{ c.sub }}</span></span>
              </div>
              <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
                <sc-for list="{{ c.lines }}" as="l" hint-placeholder-count="3">
                  <li style="display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 34px; border-top: 1px solid #eef0f3"><a href="{{ l.href }}" style="color: #1b1c1d; text-decoration: none; font-weight: 500">{{ l.label }}</a><span style="{{ l.valueStyle }}">{{ l.value }}</span></li>
                </sc-for>
              </ul>
            </section>
          </sc-for>
        </div>

        <section aria-labelledby="h-recent" style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px"><h2 id="h-recent" style="margin: 0; font-size: 16px; font-weight: 700">Recent changes by administrators</h2><a href="#" style="font-weight: 600; color: var(--sc-link, #3669a5); text-decoration: none">Full log</a></div>
          <table style="border-collapse: collapse; width: 100%; font-size: 15px; line-height: 20px">
            <thead><tr style="text-align: left; color: #5e6168; background: #fafbfc"><th scope="col" style="padding: 12px 16px; font-weight: 600">When</th><th scope="col" style="padding: 12px 16px; font-weight: 600">Who</th><th scope="col" style="padding: 12px 16px; font-weight: 600">What</th><th scope="col" style="padding: 12px 16px; font-weight: 600">Where</th></tr></thead>
            <tbody>
              <sc-for list="{{ log }}" as="r" hint-placeholder-count="3">
                <tr style="border-top: 1px solid #eef0f3"><td style="padding: 12px 16px; white-space: nowrap; color: #5e6168">{{ r.when }}</td><td style="padding: 12px 16px; white-space: nowrap">{{ r.who }}</td><td style="padding: 12px 16px">{{ r.what }}</td><td style="padding: 12px 16px; white-space: nowrap"><span style="display: inline-block; vertical-align: top; padding: 3px 10px; border-radius: var(--sc-radius, 8px); font-size: 13px; line-height: 14px; font-weight: 600; background: #f0f1f3; color: #3d4047">{{ r.where }}</span></td></tr>
              </sc-for>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const btn = "display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: var(--sc-radius, 8px); font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap; ";
    const btnPrimary = btn + 'border: 1px solid var(--sc-action-deep, #234a78); background: var(--sc-action, #3669a5); color: #ffffff';
    const I = {
      overview: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      groups: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87',
      roles: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10',
      types: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',
      statuses: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9 12l2 2 4-4',
      workflows: 'M4 6h6v6H4zM14 12h6v6h-6zM10 9h4M14 15h-2a2 2 0 0 1-2-2V9',
      auth: 'M19 11H5a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2M7 11V7a5 5 0 0 1 10 0v4',
      storages: 'M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z',
      design: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M12 2a4 4 0 0 1 0 8 2 2 0 0 0 0 4 4 4 0 0 1 0 8M8 8h.01M7 13h.01M16 7h.01',
      plugins: 'M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83'
    };
    const base = 'display: flex; align-items: center; gap: 12px; min-height: 42px; padding: 0 10px; border-radius: var(--sc-radius, 8px); text-decoration: none; font-size: 15px; ';
    const active = 'Overview';
    const HREF = { Overview: 'OpAdmin.dc.html', Design: 'OpThemePicker.dc.html' };
    const item = ([label, icon]) => ({ label, icon: I[icon], href: HREF[label] || '#', current: label === active ? 'page' : 'false', style: base + (label === active ? 'background: #eaf0f7; color: #234a78; font-weight: 600;' : 'color: #1b1c1d; font-weight: 500;') });
    const menu = [
      { title: 'Administration', items: [['Overview', 'overview']] },
      { title: 'People', items: [['Users', 'users'], ['Groups', 'groups'], ['Roles and permissions', 'roles']] },
      { title: 'Work packages', items: [['Types', 'types'], ['Statuses', 'statuses'], ['Workflows', 'workflows']] },
      { title: 'System', items: [['Authentication', 'auth'], ['File storages', 'storages'], ['Design', 'design'], ['Plugins', 'plugins']] }
    ].map((g) => ({ title: g.title, items: g.items.map(item) }));
    const val = (kind) => kind === 'on' ? 'padding: 3px 10px; border-radius: var(--sc-radius, 8px); font-size: 13px; font-weight: 600; background: #eaf0f7; color: #234a78; white-space: nowrap' : 'color: #5e6168; white-space: nowrap';
    const line = (label, value, kind, href) => ({ label, value, valueStyle: val(kind), href: href || '#' });
    const cards = [
      { id: 'users', title: 'Users and groups', sub: 'Accounts come from Keycloak', icon: I.users, lines: [line('Users', '14 active, 1 invited'), line('Groups', '3'), line('Roles', '5')] },
      { id: 'wp', title: 'Work packages', sub: 'What a work package can be', icon: I.types, lines: [line('Types', 'Epic, feature, bug, task, milestone'), line('Statuses', '6'), line('Workflows', 'per type and role')] },
      { id: 'auth', title: 'Authentication', sub: 'Single sign-on for both products', icon: I.auth, lines: [line('Sign-in', 'Keycloak, OpenID Connect', 'on'), line('Two-factor', 'required for admins'), line('Sessions', '12 h, 2 open')] },
      { id: 'storages', title: 'File storages', sub: 'Where project files live', icon: I.storages, lines: [line('Nextcloud', 'cloud.northwind-projects.test', 'on'), line('Project folders', '3 managed'), line('Health', 'checked 09:12 today')] },
      { id: 'design', title: 'Design', sub: 'Look of both products', icon: I.design, lines: [line('Design system', 'Northwind house style', 'on', 'OpThemePicker.dc.html'), line('Applies to', 'OpenProject and Nextcloud'), line('Token set', 'edited 3 Oct by Olivia Brandt', '', 'OpThemeEditor.dc.html')] },
      { id: 'plugins', title: 'Plugins', sub: 'Installed extensions', icon: I.plugins, lines: [line('Nextcloud integration', 'on', 'on'), line('Design system adapter', 'proposal', ''), line('Backlogs', 'on', 'on')] }
    ];
    const log = [
      { when: 'Today 09:12', who: 'Olivia Brandt', what: 'Invited Jana Köhler to Northwind rollout Lyon as reader', where: 'Users' },
      { when: '9 Oct', who: 'Tom Achterberg', what: 'Imported the Keycloak realm for Lyon and set OpenID Connect as the sign-in', where: 'Authentication' },
      { when: '3 Oct', who: 'Olivia Brandt', what: 'Changed the primary colour of Northwind house style, applied to both products', where: 'Design' }
    ];
    return { btnPrimary, menu, cards, log };
  }
}
</script>
</body>
</html>
