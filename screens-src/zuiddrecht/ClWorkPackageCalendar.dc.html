<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: an OpenProject calendar and one work package opened from the grid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 2080px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The OpenProject panel: one row per linked project with its selections under it, the same list the navigation shows, and the selected selection Work package dates with the date it uses, its filter, Add another selection and Remove this selection</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 100%; overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="264px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; position: relative">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 13px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 30px; padding: 0 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 13px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: visible">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" aria-current="{{ b.current }}" style="{{ b.style }}">
              <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.milestone }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Milestone" style="flex: none; width: 8px; height: 8px; margin: 0 3px 0 1px; background: #35c53f; transform: rotate(45deg)"></span></sc-if>
              <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
              <span style="flex: none; color: #3d4047">{{ b.number }}</span>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
            </a>
          </sc-for>
          <div style="position: absolute; top: 6px; left: calc(100% * 3 / 7 + 24px); height: 20px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5e6168; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M3 12h18"></path></svg>Drag an end to change the dates in OpenProject</div>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
      </div>
    </main>
    <aside aria-labelledby="ctx-op" style="flex: 0 0 340px; width: 340px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 16px; background: #f5f6f8; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 8px">
        <h2 id="ctx-op" style="margin: 0; flex: 1 1 auto; font-size: 16px; font-weight: 600; line-height: 22px">OpenProject in this calendar</h2>
        <button type="button" aria-label="Close the settings" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <section aria-labelledby="ctx-projects" style="display: flex; flex-direction: column; gap: 2px">
        <h3 id="ctx-projects" style="margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Linked projects</h3>
        <p style="margin: 0 0 6px; font-size: 12px; color: #5e6168; line-height: 16px">One row per linked project, its selections under it, the same list as in the navigation. Dates come from OpenProject and stay in sync.</p>
        <sc-for list="{{ projects }}" as="p" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 10px; height: 32px; font-size: 13px; font-weight: 600; color: #1b1c1d"><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ p.name }}</span><button type="button" role="switch" aria-checked="{{ p.on }}" aria-label="{{ p.aria }}" style="{{ p.switch }}"><span style="{{ p.knob }}"></span></button></div>
          <sc-for list="{{ p.sels }}" as="s" hint-placeholder-count="2">
            <div style="{{ s.rowStyle }}"><span style="{{ s.box }}"></span><span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ s.name }}</span><button type="button" role="switch" aria-checked="{{ s.on }}" aria-label="{{ s.aria }}" style="{{ s.switch }}"><span style="{{ s.knob }}"></span></button></div>
          </sc-for>
        </sc-for>
        <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 30px; margin-top: 4px; padding: 0 10px 0 6px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Link another project</button>
      </section>
      <section aria-labelledby="ctx-view" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px)">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="flex: none; width: 12px; height: 12px; border-radius: 3px; background: #5e6168"></span>
          <h3 id="ctx-view" style="margin: 0; flex: 1 1 auto; font-size: 14px; font-weight: 600; line-height: 20px">Work package dates</h3>
          <span style="font-size: 11px; color: #5e6168; white-space: nowrap">Northwind rollout Lyon</span>
        </div>
        <div role="radiogroup" aria-labelledby="ctx-date" style="display: flex; flex-direction: column; gap: 2px">
          <span id="ctx-date" style="font-size: 12px; font-weight: 600; color: #3d4047; line-height: 20px">Date the calendar uses</span>
          <label style="display: flex; align-items: center; gap: 10px; height: 26px; font-size: 13px"><input type="radio" name="cl-op-date" style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Start date only</label>
          <label style="display: flex; align-items: center; gap: 10px; height: 26px; font-size: 13px"><input type="radio" name="cl-op-date" style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Finish date only</label>
          <label style="display: flex; align-items: center; gap: 10px; height: 26px; font-size: 13px"><input type="radio" name="cl-op-date" checked style="width: 16px; height: 16px; margin: 0; accent-color: #3669a5">Start to finish, as a bar</label>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 600; color: #3d4047; line-height: 20px">Filter this selection</span>
          <div style="display: flex; flex-wrap: wrap; gap: 6px">
            <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3"><button type="button" aria-haspopup="menu" aria-label="{{ f.aria }}" style="{{ f.style }}"><span style="color: #5e6168">{{ f.label }}</span>{{ f.value }}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></sc-for>
          </div>
          <span style="font-size: 12px; color: #5e6168; line-height: 16px">3 work packages this month: FEATURE #58412, EPIC #57990 and BUG #58231.</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid #e4e6ea">
          <button type="button" style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 13px 'Fira Sans', sans-serif; text-align: left; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span style="flex: 1 1 auto">Add another selection from this project</span></button>
          <span style="font-size: 12px; color: #5e6168; line-height: 16px">For example just the work packages assigned to you. Each selection gets its own row and switch above, and in the navigation.</span>
          <button type="button" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #cc0000; font: 600 13px 'Fira Sans', sans-serif; white-space: nowrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"></path></svg>Remove this selection</button>
          <span style="font-size: 12px; color: #5e6168; line-height: 16px">Removing a selection only takes it out of the calendar. Nothing changes in OpenProject.</span>
        </div>
      </section>
    </aside>
  </div>
</div>
    </div>
  </figure>
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;FEATURE #58412 opened from its bar in the all-day strip into a popover that edits subject, dates, status, assignee and project, with Open in OpenProject; the side panel is the one of every screen</figcaption>
    <div style="position: relative; height: 950px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 100%; overflow: hidden">

  <div style="display: flex; flex: 1 1 auto; min-height: 0">

    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden; position: relative">

        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 8px 0 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 13px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 30px; padding: 0 10px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 13px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 30px; height: 30px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
        </div>
      </div>

        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: visible">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2080}}'>

  renderVals() {
    const H = 72; // one hour in px, 08:00 to 18:00
    const OFF = 14; // top offset so the 08:00 label is not clipped
    const NOW = 9; // Monday 12 October, 09:00
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };

    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';
    const dark = (c) => 'color-mix(in srgb, ' + c + ' 60%, #1b1c1d)';
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (t) => pad(Math.floor(t)) + ':' + pad(Math.round((t % 1) * 60));
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(6 + i),
        lineStyle: 'position: absolute; left: 84px; right: 0; top: ' + top + 'px; border-top: 1px solid #eef0f3',
        localStyle: 'position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right',
        utcStyle: 'position: absolute; left: 42px; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; opacity: 0.6; text-align: right'
      });
    }
    const nowTop = (NOW - 8) * H + OFF;
    const nowLabelTop = nowTop - 8;
    const ev = (title, start, dur, o = {}) => {
      const c = CAL[o.cal ?? 'personal'];
      const short = dur <= 0.5;
      const end = start + dur;
      const pending = !!o.pending;
      return {
        title, href: '#',
        aria: title + ', ' + fmt(start) + ' to ' + fmt(end) + (pending ? ', not answered yet' : '') + (o.past ? ', over' : ''), current: 'false',
        titleStyle: 'flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; ' + (short ? 'white-space: nowrap; text-overflow: ellipsis;' : 'display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;'),

        flag: !!o.flag, video: !!o.video,
        hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '',
        style: 'position: absolute; left: 2px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; justify-content: ' + (short ? 'center' : 'flex-start') + '; padding: ' + (short ? '0 6px' : '4px 7px') + '; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; text-decoration: none; z-index: 1; color: ' + dark(c) + '; ' +
          (pending ? 'background: #ffffff; border: 1px dashed ' + c + '; border-left: 3px solid ' + c + ';' : 'background: ' + pale(c) + '; border-left: 3px solid ' + c + ';') +

    const standup = (past) => ev('Stand-up', 10, 0.25, { cal: 'personal', past });
    const perDay = [
      [ev('Week planning', 8, 0.75, { cal: 'personal', past: true }), standup(false)],
      [standup(false), ev('Demo preparation Malmo Energi', 11, 1, { cal: 'customers' })],

    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = i === 0;
      const weekend = i >= 5;
      return {
        name, n: 12 + i, today, events: perDay[i],
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : 'color: #1b1c1d; font-weight: 500',
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    // all-day bars: [type, number, subject, lane, startCol, endCol (inclusive), leftOpen, rightOpen, handles, selected, milestone]
    const bars = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns, due', 0, 2, 2, false, false, false, false, false],
      ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout, 5 to 30 Oct', 1, 0, 6, true, true, true, true, false],

      return {
        type, number, subject, color: c, leftOpen, rightOpen, handles, milestone, current: selected ? 'true' : 'false',
        aria: type + ' ' + number + ', ' + subject + (selected ? ', open' : ''),
        style: 'position: absolute; top: ' + (6 + lane * 24) + 'px; left: ' + left + '; width: ' + width + '; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-left: 3px solid ' + c + '; border-radius: 4px; background: ' + pale(c) + '; font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden' + (selected ? '; box-shadow: 0 0 0 2px #3669a5; z-index: 2' : '')
      };
    });
    const swOn = 'flex: none; position: relative; width: 36px; height: 20px; margin-top: 1px; padding: 0; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 10px; background: var(--sc-action, #3669a5); box-sizing: border-box; cursor: pointer';
    const knobOn = 'position: absolute; top: 2px; left: 17px; width: 14px; height: 14px; border-radius: 7px; background: #ffffff';
    const swOff = 'flex: none; position: relative; width: 36px; height: 20px; margin-top: 1px; padding: 0; border: 1px solid #c4c7cb; border-radius: 10px; background: #ffffff; box-sizing: border-box; cursor: pointer';
    const knobOff = 'position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 7px; background: #5e6168';
    const box = (c) => 'flex: none; width: 12px; height: 12px; border-radius: 3px; background: ' + c;
    const swf = (on) => ({ on: on ? 'true' : 'false', switch: on ? swOn : swOff, knob: on ? knobOn : knobOff });
    const selRow = (active) => 'display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 8px 0 10px; margin-left: -10px; border-radius: var(--sc-radius, 8px); font-size: 13px; color: #1b1c1d; ' + (active ? 'background: #eaf0f7; color: #234a78;' : '');
    const projects = [
      ['Northwind rollout Lyon', true, [['Work package dates', '#5e6168', true, true], ['Milestones', '#35c53f', true, false]]],
      ['Netzausbau Nord', true, [['Work package dates', '#08a5df', true, false]]],
      ['OpenProject core', false, [['Milestones', '#005b77', false, false]]]
    ].map(([name, on, sels]) => ({ name, aria: 'Show ' + name, ...swf(on), sels: sels.map(([sname, c, son, active]) => ({ name: sname, box: box(c), aria: sname + ' of ' + name, rowStyle: selRow(active), ...swf(son) })) }));
    const chip = 'display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 8px 0 10px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 500 12px \'Fira Sans\', sans-serif; white-space: nowrap';
    const filters = [
      ['Status', 'Open', 'Filter by status, now open'],
      ['Type', 'All types', 'Filter by type, now all types'],
      ['Date', 'This month', 'Filter by date, now this month']
    ].map(([label, value, aria]) => ({ label, value, aria, style: chip }));
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'] };
    const dot = (st) => 'flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: ' + st[0] + '; border: 1.5px solid ' + st[1];
    const due = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns', 'in development', 'Wed 14'],
      ['TASK', '#58455', 'Prepare demo for Malmo Energi', 'new', 'Thu 15'],
      ['TASK', '#58441', 'Move kick-off to the afternoon', 'new', 'Fri 16']
    ].map(([type, number, subject, status, d]) => ({ type, number, subject, due: d, color: TYPE[type], dot: dot(STATUS[status]) }));
    const keys = [['T', 'Go to today'], ['W', 'Week view'], ['M', 'Month view'], ['C', 'New event']].map(([key, label]) => ({ key, label }));
    return { hours, days, bars, nowTop, nowLabelTop, projects, filters, due, keys };
  }
}
