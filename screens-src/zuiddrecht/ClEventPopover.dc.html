<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: quick event popover after dragging a time range</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 3650px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">
  <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
    <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">a</span> &nbsp;The quick popover after dragging Monday 13:00 to 14:00: title, time, calendar and Save; More options opens the full editor</figcaption>
    <div style="position: relative; height: 1000px; box-sizing: border-box; display: flex; flex-direction: column; background: #f5f6f8; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
  <dc-import name="MlHeader" app="Calendar" placeholder="Search events, people or #work package" hint-size="100%,55px"></dc-import>
  <div style="display: flex; flex: 1 1 auto; min-height: 0">
    <div style="flex: 0 0 245px; width: 245px; display: flex; align-items: stretch; overflow: hidden"><dc-import name="ClNav" active="Week" hint-size="245px,945px"></dc-import></div>
    <main style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; background: #ffffff; overflow: hidden">
      <div style="flex: none; display: flex; align-items: baseline; gap: 10px; height: 56px; padding: 0 16px 0 20px; box-sizing: border-box">
        <h1 style="margin: 0; font-size: 22px; font-weight: 600; line-height: 56px; white-space: nowrap">October <span style="font-weight: 400; color: #5e6168">2026</span></h1>
        <span style="font-size: 12px; color: #5e6168; white-space: nowrap">Week 42</span>
        <span style="flex: 1 1 auto"></span>
        <div style="display: flex; align-items: center; gap: 4px; align-self: center">
          <button type="button" aria-haspopup="menu" style="display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 10px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Week<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
          <button type="button" style="height: 34px; padding: 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius, 8px); background: #ffffff; color: #1b1c1d; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Today</button>
          <button type="button" aria-label="Previous week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
          <button type="button" aria-label="Next week" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
          <button type="button" aria-label="Open the overview" aria-expanded="false" title="Open the overview" style="width: 34px; height: 34px; margin-left: 8px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM15 4v16"></path></svg></button>
        </div>
      </div>
      <div style="flex: none; display: flex; height: 34px">
        <div style="flex: none; width: 84px; position: relative; display: flex; align-items: flex-end; padding-bottom: 6px; box-sizing: border-box; font-size: 10px; line-height: 12px; letter-spacing: 0.04em; color: #5e6168"><span style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right">CEST</span><span title="Second time zone, UTC. You added it under Settings, View." aria-label="UTC, second time zone" style="width: 42px; box-sizing: border-box; padding-right: 8px; text-align: right; opacity: 0.6; text-decoration: underline dotted; text-underline-offset: 2px">UTC</span></div>
        <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
          <div style="{{ d.headStyle }}"><span>{{ d.name }}</span><span style="{{ d.numStyle }}">{{ d.n }}</span></div>
        </sc-for>
      </div>
      <div style="flex: none; display: flex; border-top: 1px solid #eef0f3; border-bottom: 1px solid #e4e6ea">
        <div style="flex: none; width: 84px; box-sizing: border-box; padding: 6px 8px 0 0; font-size: 10px; letter-spacing: 0.04em; color: #5e6168; text-align: right; line-height: 1.2">All day</div>
        <div style="flex: 1 1 auto; min-width: 0; position: relative; height: 80px; overflow: hidden">
          <sc-for list="{{ bars }}" as="b" hint-placeholder-count="3">
            <a href="#" aria-label="{{ b.aria }}" style="{{ b.style }}">
              <sc-if value="{{ b.leftOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m11 17-5-5 5-5M18 17l-5-5 5-5"></path></svg></sc-if>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <span style="flex: none; font-weight: 700; letter-spacing: 0.04em; color: {{ b.color }}">{{ b.type }}</span>
              <span style="flex: none; color: #3d4047">{{ b.number }}</span>
              <span style="flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #1b1c1d">{{ b.subject }}</span>
              <sc-if value="{{ b.handles }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" title="Drag an end to change the dates in OpenProject" style="flex: none; width: 7px; height: 12px; box-sizing: border-box; border-left: 2px solid {{ b.color }}; border-right: 2px solid {{ b.color }}; cursor: ew-resize"></span></sc-if>
              <sc-if value="{{ b.rightOpen }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{ b.color }}; opacity: 0.7"><path d="m13 17 5-5-5-5M6 17l5-5-5-5"></path></svg></sc-if>
            </a>
          </sc-for>
        </div>
      </div>
      <div style="flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden">
        <sc-for list="{{ hours }}" as="h" hint-placeholder-count="11">
          <div style="{{ h.lineStyle }}"></div>
          <div style="{{ h.localStyle }}">{{ h.local }}</div>
          <div style="{{ h.utcStyle }}">{{ h.utc }}</div>
        </sc-for>
        <div style="position: absolute; top: 0; bottom: 0; left: 84px; right: 0; display: flex">
          <sc-for list="{{ days }}" as="d" hint-placeholder-count="7">
            <div style="{{ d.colStyle }}">
              <sc-for list="{{ d.events }}" as="e" hint-placeholder-count="2">
                <a href="{{ e.href }}" aria-label="{{ e.aria }}" aria-current="{{ e.current }}" style="{{ e.style }}">
                  <span style="display: flex; align-items: center; gap: 4px; min-width: 0">
                    <sc-if value="{{ e.flag }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 22V4a1 1 0 0 1 1-1h12l-2 4 2 4H5"></path></svg></sc-if>
                    <sc-if value="{{ e.video }}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m22 8-6 4 6 4V8zM2 6h14v12H2z"></path></svg></sc-if>
                    <span style="{{ e.titleStyle }}">{{ e.title }}</span>
                    <sc-if value="{{ e.inlineTime }}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-size: 11px; font-weight: 400; color: #5e6168">{{ e.time }}</span></sc-if>
                  </span>
                  <sc-if value="{{ e.blockTime }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #5e6168; white-space: nowrap">{{ e.time }}</span></sc-if>
                  <sc-if value="{{ e.hasChip }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 4px; height: 16px; margin-top: 3px; padding: 0 5px; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); background: #ffffff; font-size: 10px; line-height: 1; white-space: nowrap; align-self: flex-start"><span style="font-weight: 700; letter-spacing: 0.04em; color: {{ e.wpColor }}">{{ e.wpType }}</span><span style="color: #3d4047">{{ e.wpNumber }}</span></span></sc-if>
                </a>
              </sc-for>
              <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}"><div aria-label="Now, 09:00" role="img" style="position: absolute; left: 0; right: 0; top: {{ nowTop }}px; height: 1px; background: #1b1c1d; z-index: 2"></div></sc-if>
            </div>
          </sc-for>
          <div role="img" aria-label="Dragged time range, Monday 12 October, 13:00 to 14:00" style="position: absolute; left: 2px; width: calc(100% / 7 - 6px); top: 375px; height: 70px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; padding: 4px 7px; border: 1px dashed #3669a5; border-left: 3px solid #3669a5; border-radius: 4px; background: #eaf0f7; font-size: 12px; line-height: 15px; color: #234a78; z-index: 4"><span style="font-weight: 600">New event</span><span style="font-size: 11px; color: #5e6168">13:00 to 14:00</span></div>
          <div role="dialog" aria-label="Quick event" style="position: absolute; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; left: calc(100% / 7 + 6px); top: 310px; margin: 0; width: 340px; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 700">New event</span><div style="display: flex; gap: 2px"><button type="button" aria-label="Close" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div></div><label style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Title</span><input id="cl-qe-title" type="text" value="Kick-off Lyon, afternoon slot" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label><div style="display: flex; gap: 8px"><label style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Start</span><input id="cl-qe-start" type="text" value="Mon 12 Oct, 13:00" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label><label style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">End</span><input id="cl-qe-end" type="text" value="14:00" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label></div><label style="display: flex; align-items: center; gap: 10px; cursor: pointer"><button type="button" role="switch" aria-checked="false" aria-label="All day" style="flex: none; position: relative; width: 42px; height: 24px; padding: 0; border: 1px solid #c4c7cb; border-radius: 12px; background: #ffffff; box-sizing: border-box; cursor: pointer"><span style="position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 9px; background: #5e6168"></span></button><span style="font-size: 14px">All day</span></label><div style="position: relative"><div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto; min-width: 0"><label for="cl-qe-cal" style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Calendar</label><button id="cl-qe-cal" type="button" aria-haspopup="listbox" aria-label="Calendar, Customers, change" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span style="overflow: hidden; text-overflow: ellipsis"><span style='display: inline-flex; align-items: center; gap: 8px'><span style='flex: none; width: 10px; height: 10px; border-radius: 3px; background: #ff9d2e'></span>Customers</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168; flex: none"><path d="m6 9 6 6 6-6"></path></svg></button></div></div><div style="display: flex; align-items: center; gap: 8px"><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Save</button><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap" title="More options opens the full editor and keeps what you typed.">More options<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></div></div>
          
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: {{ nowLabelTop }}px; font-size: 11px; line-height: 16px; font-weight: 600; color: #1b1c1d; background: #ffffff; text-align: right; z-index: 3">09:00</div>
      </div>
    </main>
  </div>
    </div>
  </figure>
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0">
      <figcaption style="font-size: 13px; font-weight: 600; color: #3d4047; line-height: 16px"><span style="color: #5e6168; font-weight: 400">b</span> &nbsp;The calendar list of the popover open: your own calendars, and under them the calendar Tom delegated to you</figcaption>
      <div style="position: relative; height: 380px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
        <div aria-hidden="true" style="position: absolute; inset: 0; display: flex"><sc-for list="{{ ghostCols }}" as="g" hint-placeholder-count="3"><div style="flex: 1 1 0; border-left: 1px solid #eef0f3; {{ g.bg }}"></div></sc-for></div>
        <div role="dialog" aria-label="Quick event, calendar list open" style="position: absolute; left: 40px; top: 24px; width: 340px; box-sizing: border-box; padding: 12px 16px 16px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 700">New event</span></div>
          <label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Title</span><input type="text" value="Kick-off Lyon, afternoon slot" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label>
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Calendar</span><button type="button" aria-haspopup="listbox" aria-expanded="true" aria-label="Calendar, Customers, change" style="display: inline-flex; align-items: center; justify-content: space-between; gap: 8px; height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #3669a5; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; color: #1b1c1d; font: 400 15px 'Fira Sans', sans-serif; white-space: nowrap"><span style='display: inline-flex; align-items: center; gap: 8px'><span style='flex: none; width: 10px; height: 10px; border-radius: 3px; background: #ff9d2e'></span>Customers</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #5e6168; flex: none"><path d="m18 15-6-6-6 6"></path></svg></button></div>
          <div style="display: flex; align-items: center; gap: 8px"><button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border: 1px solid var(--sc-action-deep, #234a78); border-radius: var(--sc-radius, 8px); background: var(--sc-action, #3669a5); color: #ffffff; font: 600 14px 'Fira Sans', sans-serif; white-space: nowrap">Save</button></div>
        </div>
        <div role="listbox" aria-label="Choose the calendar" style="position: absolute; margin-top: 4px; min-width: 320px; padding: 8px; box-sizing: border-box; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; left: 392px; top: 24px; margin: 0; min-width: 260px; width: 260px"><span style="display: block; padding: 6px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Your calendars</span><a href="#" role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--sc-radius, 8px); font-size: 14px; color: #1b1c1d; text-decoration: none; white-space: nowrap"><span style="flex: none; width: 12px; height: 12px; border-radius: 3px; background: #3669a5"></span><span style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 18px"><span>Personal</span></span></a><a href="#" role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--sc-radius, 8px); font-size: 14px; color: #1b1c1d; text-decoration: none; white-space: nowrap"><span style="flex: none; width: 12px; height: 12px; border-radius: 3px; background: #538b28"></span><span style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 18px"><span>Northwind team</span></span></a><a href="#" role="option" aria-selected="true" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--sc-radius, 8px); font-size: 14px; color: #1b1c1d; text-decoration: none; white-space: nowrap; background: #eaf0f7; color: #234a78; font-weight: 600"><span style="flex: none; width: 12px; height: 12px; border-radius: 3px; background: #ff9d2e"></span><span style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 18px"><span>Customers</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #234a78"><path d="M20 6 9 17l-5-5"></path></svg></a><span style="display: block; padding: 6px 10px 2px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5e6168">Delegated to you</span><a href="#" role="option" aria-selected="false" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: var(--sc-radius, 8px); font-size: 14px; color: #1b1c1d; text-decoration: none; white-space: nowrap; height: auto; padding: 8px 10px"><span style="flex: none; width: 12px; height: 12px; border-radius: 3px; background: #005b77"></span><span style="flex: 1 1 auto; display: flex; flex-direction: column; line-height: 18px"><span>Tom Achterberg</span><span style="display: block; font-size: 12px; line-height: 16px; color: #5e6168; white-space: normal">On behalf of Tom Achterberg: the event is made in his name</span></span></a></div>
      </div>

        <p style="margin: 12px 16px 0; max-width: 560px; font-size: 14px; line-height: 22px">Hi Olivia, can we meet on <button type="button" aria-label="Date recognised in the mail, Thursday 15 October 11:00. Add it to the calendar" title="Date recognised in the mail. Add it to the calendar" style="padding: 0; border: 0; border-bottom: 1px dotted #3669a5; background: #eaf0f7; color: #234a78; font: inherit; cursor: pointer">Thursday 15 October at 11:00</button> to walk through the Lyon folders before the kick-off? Marc</p>
        <div role="dialog" aria-label="Quick event from a date in the mail" style="position: absolute; left: 180px; top: 120px; width: 340px; box-sizing: border-box; padding: 12px 16px 16px; background: #ffffff; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); box-shadow: 0 4px 12px rgba(27,28,29,0.12); z-index: 10; display: flex; flex-direction: column; gap: 12px"><div style="display: flex; align-items: center; justify-content: space-between; gap: 8px"><span style="font-size: 16px; font-weight: 700">New event</span><button type="button" aria-label="Close" style="width: 34px; height: 34px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div><label style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">Title</span><input type="text" value="Walk through the Lyon folders" style="height: 40px; padding: 0 12px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 400 15px 'Fira Sans', sans-serif; color: #1b1c1d; outline: none; min-width: 0"></label><div style="display: flex; flex-direction: column; gap: 6px; min-width: 0"><span style="font-size: 14px; font-weight: 600; color: #1b1c1d; line-height: 20px">People</span><div style="min-height: 40px; padding: 5px 8px; box-sizing: border-box; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; display: flex; flex-wrap: wrap; align-items: center; gap: 6px"><span style="display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px 0 4px; border: 1px solid #c4c7cb ll="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button></div></div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":3650}}'>
class Component extends DCLogic {
  renderVals() {
    const H = 72; // one hour in px, 08:00 to 18:00
    const OFF = 14; // top offset so the 08:00 label is not clipped
    const NOW = 9; // Monday 12 October, 09:00
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'] };
    const CAL = { personal: '#3669a5', team: '#538b28', customers: '#ff9d2e' };
    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';
    const dark = (c) => 'color-mix(in srgb, ' + c + ' 60%, #1b1c1d)';
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (t) => pad(Math.floor(t)) + ':' + pad(Math.round((t % 1) * 60));
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(6 + i),
        lineStyle: 'position: absolute; left: 84px; right: 0; top: ' + top + 'px; border-top: 1px solid #eef0f3',
        localStyle: 'position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right',
        utcStyle: 'position: absolute; left: 42px; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; opacity: 0.6; text-align: right'
      });
    }
    const nowTop = (NOW - 8) * H + OFF;
    const nowLabelTop = nowTop - 8;
    // meeting block: [title, start, duration in hours, options {cal, chip:[type, number, status], video, flag, selected, past, pending}]
    const ev = (title, start, dur, o = {}) => {
      const c = CAL[o.cal ?? 'personal'];
      const short = dur <= 0.5;
      const end = start + dur;
      const pending = !!o.pending;
      return {
        title, href: o.chip && o.chip[1] === '#58412' ? 'ClEvent.dc.html' : '#',
        aria: title + ', ' + fmt(start) + ' to ' + fmt(end) + (pending ? ', not answered yet' : '') + (o.past ? ', over' : ''), current: o.selected ? 'true' : 'false',
        titleStyle: 'flex: 1 1 auto; min-width: 0; font-weight: 600; overflow: hidden; ' + (short ? 'white-space: nowrap; text-overflow: ellipsis;' : 'display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;'),
        time: short ? fmt(start) : fmt(start) + ' to ' + fmt(end), inlineTime: short, blockTime: !short,
        flag: !!o.flag, video: !!o.video,
        hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '',
        style: 'position: absolute; left: 2px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; gap: 0; justify-content: ' + (short ? 'center' : 'flex-start') + '; padding: ' + (short ? '0 6px' : '4px 7px') + '; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; text-decoration: none; z-index: 1; color: ' + dark(c) + '; ' +
          (pending ? 'background: #ffffff; border: 1px solid color-mix(in srgb, ' + c + ' 40%, #ffffff); border-left: 3px solid ' + c + '; opacity: 0.6;' : 'background: ' + pale(c) + '; border-left: 3px solid ' + c + ';') +
          (o.past ? ' opacity: 0.55;' : '') + (o.selected ? ' box-shadow: 0 0 0 2px #3669a5;' : '')
      };
    };
    const standup = (past) => ev('Stand-up', 10, 0.25, { cal: 'personal', past });
    const perDay = [
      [ev('Week planning', 8, 0.75, { cal: 'personal', past: true }), standup(false)],
      [standup(false), ev('Demo preparation Malmo Energi', 11, 1, { cal: 'customers' })],
      [standup(false), ev('Release 16.5 scope review', 9.5, 1.5, { cal: 'team', chip: ['EPIC', '#57990', 'in review'] })],
      [standup(false), ev('Rollout review Lyon, phase 2', 14, 1, { cal: 'customers', chip: ['FEATURE', '#58412', 'in development'], video: true, pending: true })],
      [standup(false), ev('Submit October hours', 17, 0.5, { cal: 'personal', flag: true })],
      [], []
    ];
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, i) => {
      const today = i === 0;
      const weekend = i >= 5;
      return {
        name, n: 12 + i, today, events: perDay[i],
        headStyle: 'flex: 1 1 0; min-width: 0; display: flex; align-items: flex-end; gap: 5px; padding: 0 0 6px 8px; box-sizing: border-box; font-size: 13px; line-height: 20px; color: #5e6168; ' + (weekend ? 'background: #f5f6f8;' : ''),
        numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : 'color: #1b1c1d; font-weight: 500',
        colStyle: 'flex: 1 1 0; min-width: 0; position: relative; border-left: 1px solid #eef0f3; ' + (weekend ? 'background: #f5f6f8;' : '')
      };
    });
    // all-day bars: [type, number, subject, lane, startCol, endCol (inclusive), leftOpen, rightOpen, handles]
    const bars = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns', 0, 0, 2, false, false, true],
      ['FEATURE', '#58412', 'Link Nextcloud project folders on rollout, 5 to 30 Oct', 1, 0, 6, true, true, false],
      ['EPIC', '#57990', 'Release 16.5 scope, 28 Sep to 23 Oct', 2, 0, 6, true, true, false]
    ].map(([type, number, subject, lane, s, e, leftOpen, rightOpen, handles]) => {
      const c = TYPE[type];
      const left = leftOpen ? '0px' : 'calc(100% * ' + s + ' / 7 + 2px)';
      const width = 'calc(100% * ' + (e - s + 1) + ' / 7' + (leftOpen ? '' : ' - 2px') + (rightOpen ? '' : ' - 4px') + ')';
      return {
        type, number, subject, color: c, leftOpen, rightOpen, handles,
        aria: type + ' ' + number + ', ' + subject,
        style: 'position: absolute; top: ' + (6 + lane * 24) + 'px; left: ' + left + '; width: ' + width + '; height: 20px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 6px; border-left: 3px solid ' + c + '; border-radius: 4px; background: ' + pale(c) + '; font-size: 11px; line-height: 1; white-space: nowrap; text-decoration: none; color: #1b1c1d; overflow: hidden'
      };
    });
    const dot = (st) => 'flex: none; display: inline-block; width: 8px; height: 8px; box-sizing: border-box; border-radius: 4px; background: ' + st[0] + '; border: 1.5px solid ' + st[1];
    const due = [
      ['BUG', '#58231', 'Gantt PDF export drops trailing columns', 'in development', 'Wed 14'],
      ['TASK', '#58455', 'Prepare demo for Malmo Energi', 'new', 'Thu 15'],
      ['TASK', '#58441', 'Move kick-off to the afternoon', 'new', 'Fri 16']
    ].map(([type, number, subject, status, d]) => ({ type, number, subject, due: d, color: TYPE[type], dot: dot(STATUS[status]) }));
    // frame d: the day label Thu 15 pressed, the all-day event starts from it
    const dayNames = ['Monday 12', 'Tuesday 13', 'Wednesday 14', 'Thursday 15', 'Friday 16', 'Saturday 17', 'Sunday 18'];
    const daysD = days.map((d, i) => ({ ...d, pressed: i === 3 ? 'true' : 'false', aria: dayNames[i] + ' October' + (i === 3 ? ', new all-day event' : ', new all-day event on this day'), headStyle: d.headStyle + (i === 3 ? ' background: #eaf0f7; color: #234a78; border-radius: var(--sc-radius, 8px) var(--sc-radius, 8px) 0 0;' : '') }));
    const keys = [['T', 'Go to today'], ['W', 'Week view'], ['M', 'Month view'], ['C', 'New event']].map(([key, label]) => ({ key, label }));
    const ghostCols = ['Wed', 'Thu', 'Fri'].map(() => ({ bg: '' }));
    const ghostDays = [['Wed', 14], ['Thu', 15], ['Fri', 16]].map(([name, n]) => ({ name, n }));
    const people = [['PR', 'Priya Raman'], ['TA', 'Tom Achterberg'], ['LF', 'Lea Fontaine']].map(([initials, name]) => ({ initials, name }));
    return { hours, days, daysD, bars, nowTop, nowLabelTop, due, keys, ghostCols, ghostDays, people };
  }
}
</script>
