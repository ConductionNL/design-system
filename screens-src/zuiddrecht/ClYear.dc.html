<html lang="en">
<head>
<meta charset="utf-8">
<title>Calendar: year view with the view menu open and the agenda beside it</title>

</head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>

<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; box-sizing: border-box; width: 1440px; height: 5058px; padding: 28px 24px; display: flex; flex-direction: column; gap: 24px; overflow: hidden">

    <div style="position: relative; height: 1013px; box-sizing: border-box; border: 1px solid #828a95; border-radius: var(--sc-radius-lg, 10px); overflow: hidden">
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 14px; line-height: 21px; background: #f5f6f8; display: flex; flex-direction: column; height: 100%; overflow: hidden">

        </div>
      </div>
      <div role="group" aria-label="Year 2026, twelve months" style="flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px 16px; padding: 4px 20px 16px; box-sizing: border-box">
        <sc-for list="{{ months }}" as="m" hint-placeholder-count="12">
          <section aria-label="{{ m.name }} 2026" style="{{ m.style }}">
            <a href="#" style="display: block; height: 24px; margin-bottom: 2px; padding-left: 26px; font-size: 13px; font-weight: 600; line-height: 24px; color: #1b1c1d; text-decoration: none">{{ m.name }}</a>
            <div style="display: grid; grid-template-columns: 26px repeat(7, 1fr); font-size: 10px; line-height: 16px; color: #5e6168; text-align: center">
              <span aria-hidden="true" style="text-align: left; padding-left: 2px; letter-spacing: 0.04em">Wk</span>
              <sc-for list="{{ dow }}" as="d" hint-placeholder-count="7"><span style="{{ d.style }}">{{ d.label }}</span></sc-for>
            </div>
            <sc-for list="{{ m.weeks }}" as="w" hint-placeholder-count="6">
              <div style="display: grid; grid-template-columns: 26px repeat(7, 1fr); align-items: center">
                <a href="#" aria-label="Open week {{ w.wk }}" style="display: flex; align-items: center; height: 22px; padding-left: 2px; font-size: 10px; color: #5e6168; text-decoration: none; white-space: nowrap">{{ w.wk }}</a>

                    <span style="{{ d.numStyle }}">{{ d.n }}</span>
                    <sc-if value="{{ d.hasDot }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 50%; bottom: 1px; width: 4px; height: 4px; margin-left: -2px; border-radius: 2px; background: {{ d.dotColor }}"></span></sc-if>

                  </a>
                </sc-for>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </main>
  </div>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":4980}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df', MILESTONE: '#35c53f' };
    const CAL = { personal: '#3669a5', team: '#538b28', customers: '#ff9d2e' };
    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';
    const dark = (c) => 'color-mix(in srgb, ' + c + ' 60%, #1b1c1d)';
    const item = 'display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; height: 40px; padding: 0 12px; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px \'Fira Sans\', sans-serif; text-align: left; ';
    const views = [
      ['Day', 'One day on a time grid', 'D', false],
      ['4 days', 'The number of days you choose', 'X', false],
      ['Week', 'Seven days on a time grid', 'W', false],
      ['Month', 'Weeks as rows', 'M', false],
      ['Year', 'Twelve small months', 'Y', true],
      ['Agenda', 'Events as a chronological list, replaces the panel', 'A', false]
    ].map(([label, hint, key, on]) => ({ label, hint, key, on, hasStepper: label === '4 days', checked: on ? 'true' : 'false', style: item + (on ? 'background: #eaf0f7; color: #234a78;' : 'background: transparent; color: #1b1c1d;') }));
    const dow = ['M', 'T', 'W', 'T', 'F', 'S', 'S'].map((label, i) => ({ label, style: i >= 5 ? 'color: #5e6168; opacity: 0.7' : '' }));
    // 2026: 1 January is a Thursday. Week numbering per ISO: week 1 starts Monday 29 December 2025.
    const NAMES = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const LEN = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    const SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const startDow = []; // 0 = Monday
    let d0 = 3; // Thursday
    for (let m = 0; m < 12; m++) { startDow.push(d0); d0 = (d0 + LEN[m]) % 7; }
    const dayOfYear = (m, n) => LEN.slice(0, m).reduce((a, b) => a + b, 0) + n; // 1-based
    const isoWeek = (m, n) => Math.floor((dayOfYear(m, n) + 2) / 7) + 1; // 29 Dec 2025 is day -2, start of week 1
    // days with entries: 'm-n' -> colour; test data for October, stand-ups on working days of the current month
    const marks = {};
    for (let n = 1; n <= 31; n++) { const dw = (startDow[9] + n - 1) % 7; if (dw < 5) marks['9-' + n] = CAL.personal; }
    marks['9-13'] = CAL.customers; marks['9-14'] = CAL.team; marks['9-15'] = CAL.customers;
    const milestones = { '10-2': true };
    const months = NAMES.map((name, m) => {
      const first = startDow[m];
      const cells = [];
      for (let i = 0; i < first; i++) cells.push(null);
      for (let n = 1; n <= LEN[m]; n++) cells.push(n);
      while (cells.length % 7) cells.push(null);
      const weeks = [];
      for (let r = 0; r < cells.length / 7; r++) {
        const days = cells.slice(r * 7, r * 7 + 7);
        const firstReal = days.find((x) => x !== null);
        weeks.push({
          wk: String(isoWeek(m, firstReal)),
          days: days.map((n, ci) => {
            if (n === null) return { n: '', aria: 'Empty', current: 'false', style: 'display: block; height: 22px', numStyle: '', hasDot: false, dotColor: '', milestone: false };
            const today = m === 9 && n === 12;
            const past = m < 9 || (m === 9 && n < 12);
            const key = m + '-' + n;
            return {
              n: String(n), aria: 'Open ' + n + ' ' + SHORT[m], current: today ? 'date' : 'false',
              style: 'position: relative; display: flex; align-items: center; justify-content: center; height: 22px; text-decoration: none; font-size: 11px; ' + (ci >= 5 ? 'background: #f5f6f8; ' : '') + (today ? '' : past ? 'color: #5e6168;' : 'color: #1b1c1d;'),
              numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 18px; border-radius: 4px; background: #3669a5; color: #ffffff; font-weight: 600' : '',
              hasDot: !!marks[key] && !today, dotColor: marks[key] || '', milestone: !!milestones[key]
            };
          })
        });
      }
      return { name, weeks, style: 'min-height: 0; align-self: start; display: flex; flex-direction: column; ' + (m === 9 ? 'border-radius: var(--sc-radius, 8px); box-shadow: inset 0 0 0 1px #e4e6ea; margin: -4px -6px; padding: 4px 6px;' : '') };
    });
    const row = 'display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 4px 6px; border-radius: var(--sc-radius, 8px); text-decoration: none; color: #1b1c1d; ';
    const edge = (c) => 'flex: none; align-self: stretch; width: 3px; border-radius: 2px; background: ' + c;
    const mk = (time, title, cal, o = {}) => {
      const c = cal === 'milestone' ? '#35c53f' : CAL[cal];
      return {
        time, title, href: title === 'Rollout review Lyon, phase 2' ? 'ClEvent.dc.html' : '#', current: o.next ? 'true' : 'false', isNext: !!o.next,
        style: row + (o.next ? 'background: #eaf0f7;' : ''),
        edge: edge(c), titleStyle: 'font-size: 13px; font-weight: 600; color: ' + dark(c) + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis',
        hasMeta: !!(o.chip || o.meta), hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '', meta: o.meta || ''
      };
    };
    const agenda = [
      { day: 'Today', date: 'Monday 12 October', today: true, items: [mk('10:00', 'Stand-up', 'personal', { next: true, meta: 'in 1 h, daily' })] },
      { day: 'Tue', date: '13 October', items: [mk('10:00', 'Stand-up', 'personal'), mk('11:00', 'Demo preparation Malmo Energi', 'customers')] },
      { day: 'Wed', date: '14 October', items: [mk('09:30', 'Release 16.5 scope review', 'team', { chip: ['EPIC', '#57990'] }), mk('10:00', 'Stand-up', 'personal')] },
      { day: 'Thu', date: '15 October', items: [mk('10:00', 'Stand-up', 'personal'), mk('14:00', 'Rollout review Lyon, phase 2', 'customers', { chip: ['FEATURE', '#58412'], meta: 'not answered yet' })] },
      { day: 'Fri', date: '16 October', items: [mk('10:00', 'Stand-up', 'personal'), mk('17:00', 'Submit October hours', 'personal', { meta: 'deadline' })] },
      { day: 'Mon', date: '2 November', items: [mk('', 'Go-live Lyon phase 2', 'milestone', { meta: 'milestone' })] }
    ].map((g) => ({ ...g, dayStyle: 'font-weight: 600; ' + (g.today ? 'color: #234a78;' : 'color: #1b1c1d;') }));
    // frame d: the view menu with Working week and Print this view
    const viewsD = [
      ['Day', 'One day on a time grid', 'D', false],
      ['4 days', 'The number of days you choose', 'X', false],
      ['Working week', 'Monday to Friday; the stepper sets how many days a working week shows', 'K', false, 5],
      ['Week', 'Seven days on a time grid', 'W', false],
      ['Month', 'Weeks as rows', 'M', false],
      ['Year', 'Twelve small months', 'Y', true],
      ['Agenda', 'Events as a chronological list, replaces the panel', 'A', false]
    ].map(([label, hint, key, on, count]) => ({ label, hint, key, on, hasStepper: label === '4 days' || label === 'Working week', count: String(count || 4), countAria: label === 'Working week' ? 'Days in a working week' : 'Days shown', fewer: label === 'Working week' ? 'One working day fewer' : 'One day fewer', more: label === 'Working week' ? 'One working day more' : 'One day more', checked: on ? 'true' : 'false', style: item + (on ? 'background: #eaf0f7; color: #234a78;' : 'background: transparent; color: #1b1c1d;') }));
    // frame e: Thursday 15 October, one column per calendar
    const H = 72, OFF = 14;
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (t) => pad(Math.floor(t)) + ':' + pad(Math.round((t % 1) * 60));
    const hours = [];
    for (let i = 0; i <= 10; i++) {
      const top = i * H + OFF;
      hours.push({
        local: fmt(8 + i), utc: fmt(6 + i),
        lineStyle: 'position: absolute; left: 84px; right: 0; top: ' + top + 'px; border-top: 1px solid #eef0f3',
        localStyle: 'position: absolute; left: 0; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; text-align: right',
        utcStyle: 'position: absolute; left: 42px; width: 42px; box-sizing: border-box; padding-right: 8px; top: ' + (top - 8) + 'px; font-size: 11px; line-height: 16px; color: #5e6168; opacity: 0.6; text-align: right'
      });
    }
    const block = (title, start, dur, c, o = {}) => ({
      title, time: fmt(start) + ' to ' + fmt(start + dur), aria: title + ', ' + fmt(start) + ' to ' + fmt(start + dur) + (o.pending ? ', not answered yet' : ''),
      style: 'position: absolute; left: 2px; right: 4px; top: ' + ((start - 8) * H + OFF + 1) + 'px; height: ' + (dur * H - 2) + 'px; box-sizing: border-box; display: flex; flex-direction: column; padding: 4px 7px; border-radius: 4px; overflow: hidden; font-size: 12px; line-height: 15px; text-decoration: none; color: ' + dark(c) + '; ' + (o.pending ? 'background: #ffffff; border: 1px dashed ' + c + '; border-left: 3px solid ' + c + ';' : 'background: ' + pale(c) + '; border-left: 3px solid ' + c + ';')
    });
    const calCols = [
      ['Personal', CAL.personal, [block('Stand-up', 10, 0.5, CAL.personal)]],
      ['Northwind team', CAL.team, [block('Kassel call', 14, 0.5, CAL.team)]],
      ['Customers', CAL.customers, [block('Rollout review Lyon, phase 2', 14, 1, CAL.customers, { pending: true })]]
    ].map(([name, color, events]) => ({ name, color, events, count: events.length === 1 ? '1 event' : events.length + ' events' }));
    // frame f: the agenda as a list with checkboxes
    const boxOn = 'flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1px solid var(--sc-action-deep, #234a78); border-radius: 3px; background: var(--sc-action, #3669a5); color: #ffffff; display: inline-flex; align-items: center; justify-content: center';
    const boxOff = 'flex: none; width: 18px; height: 18px; box-sizing: border-box; border: 1px solid #828a95; border-radius: 3px; background: #ffffff';
    const rowF = (time, title, cal, o = {}) => {
      const c = cal === 'milestone' ? '#35c53f' : CAL[cal];
      return {
        time, title, on: !!o.on, checkAria: (o.on ? 'Selected, ' : 'Select ') + title, box: o.on ? boxOn : boxOff,
        style: 'display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 6px 0 0; border-radius: var(--sc-radius, 8px); position: relative; ' + (o.on ? 'background: #eaf0f7;' : ''),
        edge: edge(c), titleStyle: 'font-size: 14px; font-weight: 600; color: ' + dark(c) + '; white-space: nowrap; overflow: hidden; text-overflow: ellipsis',
        hasChip: !!o.chip, wpType: o.chip ? o.chip[0] : '', wpNumber: o.chip ? o.chip[1] : '', wpColor: o.chip ? TYPE[o.chip[0]] : '', meta: o.meta || ''
      };
    };
    const agendaF = [
      { day: 'Today', date: 'Monday 12 October', today: true, items: [rowF('10:00 to 10:15', 'Stand-up', 'personal', { meta: 'daily' })] },
      { day: 'Tue', date: '13 October', items: [rowF('10:00 to 10:15', 'Stand-up', 'personal'), rowF('11:00 to 12:00', 'Demo preparation Malmo Energi', 'customers', { on: true, meta: 'Customers' })] },
      { day: 'Wed', date: '14 October', items: [rowF('09:30 to 11:00', 'Release 16.5 scope review', 'team', { on: true, chip: ['EPIC', '#57990'], meta: 'Northwind team' }), rowF('10:00 to 10:15', 'Stand-up', 'personal')] },
      { day: 'Thu', date: '15 October', items: [rowF('10:00 to 10:15', 'Stand-up', 'personal'), rowF('14:00 to 15:00', 'Rollout review Lyon, phase 2', 'customers', { chip: ['FEATURE', '#58412'], meta: 'not answered yet' })] },
      { day: 'Fri', date: '16 October', items: [rowF('10:00 to 10:15', 'Stand-up', 'personal'), rowF('17:00 to 17:30', 'Submit October hours', 'personal', { meta: 'deadline' })] },
      { day: 'Mon', date: '2 November', items: [rowF('All day', 'Go-live Lyon phase 2', 'milestone', { meta: 'milestone' })] }
    ].map((g) => ({ ...g, dayStyle: 'font-weight: 600; ' + (g.today ? 'color: #234a78;' : 'color: #1b1c1d;') }));
    return { views, dow, months, agenda, viewsD, hours, calCols, agendaF };
  }
