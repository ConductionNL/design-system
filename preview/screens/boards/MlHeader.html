<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail: top bar</title>
<style>html,body{margin:0;padding:0}body{background:#ffffff}.sc-board{width:1440px;position:relative}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:var(--sc-primary, #3669a5)}a:hover{color:var(--sc-primary-deep, #234a78)}
#op-search::placeholder{color:#ffffff;opacity:0.85}
</style>
<link rel="stylesheet" href="../screens.css">
<script src="../theme.js" defer></script>
</head>
<body>
<div class="sc-board" data-board="MlHeader">


<div style="position: relative; width: 100%">
<header style="font-family: var(--sc-font, 'Fira Sans'), system-ui, sans-serif; color: #ffffff; width: 100%; box-sizing: border-box; height: 68px; padding: 0 20px 0 14px; display: flex; align-items: center; gap: 12px 16px; background: var(--sc-primary, #3669a5)">
  <div style="flex: 1 1 0; display: flex; align-items: center; gap: 12px; min-width: max-content">
    <a href="OpHome.html" style="flex: none; min-width: 237px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px 0 6px; color: #ffffff; text-decoration: none">
      <img src="../assets/zuiddrecht/logo-wit.svg" alt="" style="height: 26px; width: auto; max-width: 120px; flex: none" data-sc-logo="logo-wit">
      <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); flex: none"></span>
      <strong style="font-size: 18px; font-weight: 700; white-space: nowrap">Mail</strong>
    </a>
    <button type="button" aria-label="All apps" aria-haspopup="menu" aria-expanded="false" style="flex: none; width: 40px; height: 40px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h5v5H3zM9.5 3h5v5h-5zM16 3h5v5h-5zM3 9.5h5v5H3zM9.5 9.5h5v5h-5zM16 9.5h5v5h-5zM3 16h5v5H3zM9.5 16h5v5h-5zM16 16h5v5h-5z"></path></svg>
    </button>
  </div>
  <form role="search" style="flex: 0 1 560px; min-width: 240px; position: relative; display: flex; align-items: center">
    <label for="op-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search</label>
    <svg width="18" height="18" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px; color: #ffffff"><path d="M21 21l-4.35-4.35M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14"></path></svg>
    <input id="op-search" type="search" placeholder="Search mail, people or #work package" style="width: 100%; height: 44px; box-sizing: border-box; padding: 0 14px 0 42px; border: 1px solid #ffffff; border-radius: var(--sc-radius-lg, 10px); background: rgba(255,255,255,0.12); font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">
  </form>
  <div style="flex: 1 1 0; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: max-content">
    <button type="button" aria-label="Notifications, 2 new" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
      <span style="position: absolute; top: 9px; right: 10px; width: 9px; height: 9px; border-radius: 5px; background: var(--sc-accent, #cc0000); border: 2px solid #ffffff"></span>
    </button>
    <button type="button" aria-label="Help" style="width: 44px; height: 44px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #ffffff; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"></path></svg>
    </button>
    <span style="width: 1px; height: 28px; background: rgba(255,255,255,0.35); margin: 0 6px"></span>
    <button type="button" aria-label="Account menu of Olivia Brandt" aria-haspopup="menu" style="display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 4px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; font: 400 15px var(--sc-font, 'Fira Sans'), sans-serif; color: #ffffff">
      <span style="width: 38px; height: 38px; border-radius: 19px; background: #ffffff; color: var(--sc-primary-deep, #234a78); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">OB</span>
      <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><strong style="font-size: 15px">Olivia Brandt</strong><span style="font-size: 13px; opacity: 0.85">Delivery lead</span></span>
      <svg width="16" height="16" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
  </div>
</header>

</div>

</div>
</body>
</html>
