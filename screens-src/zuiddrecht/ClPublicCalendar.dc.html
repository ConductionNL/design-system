          <div style="display: flex; align-items: center; justify-content: space-between; height: 32px; padding: 0 10px; background: #f5f6f8; border-bottom: 1px solid #e4e6ea; font-size: 12px; color: #5e6168"><span><strong style="color: #1b1c1d; font-weight: 600">Embedded live from the calendar</strong>, updates on its own</span><span style="display: inline-flex; align-items: center; gap: 8px"><span style="display: inline-flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: #538b28"></span>Northwind team</span><span style="display: inline-flex; align-items: center; gap: 4px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 2px; background: #ff9d2e"></span>Customers</span></span></div>
          <sc-for list="{{ embedRows }}" as="r" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; border-bottom: 1px solid #eef0f3; font-size: 12px"><span style="flex: none; width: 72px; color: #5e6168">{{ r.day }}</span><span style="flex: none; width: 90px; color: #5e6168">{{ r.time }}</span><span aria-hidden="true" style="flex: none; width: 3px; height: 16px; border-radius: 2px; background: {{ r.color }}"></span><span style="flex: 1 1 auto; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.title }}</span></div>
          </sc-for>
          <div style="display: flex; align-items: center; justify-content: space-between; height: 30px; padding: 0 10px; font-size: 11px; color: #5e6168"><span>Click an event to read it; nothing here can be changed.</span><a href="#" style="color: var(--sc-link, #3669a5)">Open the full calendar</a></div>
        </div>
      </div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2540}}'>
class Component extends DCLogic {
  renderVals() {
    const CAL = { team: '#538b28', customers: '#ff9d2e' };
    const pale = (c) => 'color-mix(in srgb, ' + c + ' 14%, #ffffff)';
    const dark = (c) => 'color-mix(in srgb, ' + c + ' 60%, #1b1c1d)';
    const box = (c) => 'flex: none; width: 10px; height: 10px; border-radius: 2px; background: ' + c;
    const legend = [{ name: 'Northwind team', box: box(CAL.team) }, { name: 'Customers', box: box(CAL.customers) }];
    const views = [['Day', 'D', false], ['Week', 'W', false], ['Month', 'M', true], ['Agenda', 'A', false]].map(([label, key, on]) => ({ label, key, on: on ? 'true' : 'false', style: 'display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; padding: 0 12px; border: 0; border-radius: var(--sc-radius, 8px); font: 400 14px \'Fira Sans\', sans-serif; text-align: left; ' + (on ? 'background: #eaf0f7; color: #234a78;' : 'background: transparent; color: #1b1c1d;') }));
    const dow = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((label, i) => ({ label, style: 'flex: 1 1 0; display: flex; align-items: center; padding: 0 8px; font-size: 13px; color: #5e6168; ' + (i >= 5 ? 'background: #f5f6f8;' : '') }));
    const rows = [
      [[28, 0], [29, 0], [30, 0], [1, 1], [2, 1], [3, 1], [4, 1]],
      [[5, 1], [6, 1], [7, 1], [8, 1], [9, 1], [10, 1], [11, 1]],
      [[12, 1], [13, 1], [14, 1], [15, 1], [16, 1], [17, 1], [18, 1]],
      [[19, 1], [20, 1], [21, 1], [22, 1], [23, 1], [24, 1], [25, 1]],
      [[26, 1], [27, 1], [28, 1], [29, 1], [30, 1], [31, 1], [1, 2]],
      [[2, 2], [3, 2], [4, 2], [5, 2], [6, 2], [7, 2], [8, 2]]
    ];
    // the two published calendars: Northwind team and Customers; key "month-day" -> [time, title, calendar]
    const specific = {
      '1-1': [['09:00', 'Office day, Utrecht', 'team']],
      '1-6': [['13:00', 'Town hall Q4', 'team']],
      '1-8': [['10:00', 'Workshop Ville de Lyon', 'customers']],
      '1-13': [['11:00', 'Demo preparation Malmo Energi', 'customers']],
      '1-14': [['09:30', 'Release 16.5 scope review', 'team']],
      '1-15': [['14:00', 'Rollout review Lyon, phase 2', 'customers']],
      '1-20': [['09:00', 'Office day, Utrecht', 'team']],
      '1-22': [['15:00', 'Training Stadtwerke Kassel', 'customers']],
      '1-27': [['13:00', 'Sprint review 16.5', 'team']],
      '1-29': [['10:00', 'Site visit Malmo Energi', 'customers']],
      '2-2': [['09:00', 'Go-live Lyon phase 2', 'customers']],
      '2-3': [['09:00', 'Office day, Utrecht', 'team']],
      '2-5': [['14:00', 'Release 16.5 review', 'team']]
    };
    const filter = '';
    const entryBase = 'display: flex; align-items: center; gap: 4px; height: 18px; padding: 0 5px; border-radius: 4px; font-size: 11px; line-height: 18px; text-decoration: none; white-space: nowrap; overflow: hidden; ';
    const weeksOf = (selectedTitle) => rows.map((days) => ({
      days: days.map(([n, m], ci) => {
        const key = m + '-' + n;
        const today = m === 1 && n === 12;
        const weekend = ci >= 5;
        const other = m !== 1;
        return {
          n,
          style: 'flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; border-left: 1px solid #eef0f3; ' + (ci === 0 ? 'border-left: 0; ' : '') + (weekend ? 'background: #f5f6f8;' : ''),
          numStyle: today ? 'display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 4px; background: #3669a5; color: #ffffff; font-size: 13px; font-weight: 600' : 'font-size: 13px; ' + (other ? 'color: #5e6168; opacity: 0.55;' : 'color: #1b1c1d;'),
          entries: (specific[key] ?? []).map(([time, title, cal]) => {
            const c = CAL[cal];
            const hit = title.toLowerCase().includes(filter);
            const selected = title === selectedTitle;
            return { time, title, current: selected ? 'true' : 'false', style: entryBase + 'color: ' + dark(c) + '; background: ' + pale(c) + '; border-left: 3px solid ' + c + ';' + (hit ? '' : ' opacity: 0.3;') + (selected ? ' box-shadow: 0 0 0 2px #3669a5;' : '') };
          })
        };
      })
    }));
    const weeks = weeksOf('Rollout review Lyon, phase 2');
    const weeksRest = weeksOf('');
    const embedRows = [
      ['Tue 13 Oct', '11:00 to 12:00', 'Demo preparation Malmo Energi', CAL.customers],
      ['Wed 14 Oct', '09:30 to 11:00', 'Release 16.5 scope review', CAL.team],
      ['Thu 15 Oct', '14:00 to 15:00', 'Rollout review Lyon, phase 2', CAL.customers],
      ['Tue 20 Oct', '09:00 to 17:00', 'Office day, Utrecht', CAL.team]
    ].map(([day, time, title, color]) => ({ day, time, title, color }));
    return { legend, views, dow, weeks, weeksRest, embedRows };
  }
}
</script>
