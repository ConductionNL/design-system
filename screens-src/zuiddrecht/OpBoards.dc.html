<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenProject twin: boards</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3669a5}a:hover{color:#234a78}
</style>
</helmet>
<div style="font-family: 'Fira Sans', system-ui, sans-serif; color: #1b1c1d; font-size: 15px; line-height: 22px; background: #f5f6f8; display: flex; flex-direction: column; min-height: 1040px">
  <dc-import name="OpHeader" current="Boards" hint-size="100%,68px"></dc-import>
  <div style="display: flex; flex-wrap: wrap; flex: 1 1 auto">
    <div style="flex: 0 0 264px; width: 264px; display: flex; align-items: stretch"><dc-import name="OpNav" active="Boards" open="Boards" current="Status board" style="display: block; width: 100%; min-height: 100%; flex: 1 1 auto" hint-size="264px,932px"></dc-import></div>
    <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
      <main style="padding: 24px 28px; display: flex; flex-direction: column; gap: 20px; max-width: 1240px; box-sizing: border-box; width: 100%; flex: 1 1 auto">
        <section style="display: flex; flex-direction: column; gap: 6px; padding: 4px 0 8px">
          <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px 24px">
            <h1 style="flex: 1 1 320px; min-width: 0; margin: 0; font-size: 28px; font-weight: 700; line-height: 1.2">Status board</h1>
            <div style="flex: none; display: flex; flex-wrap: wrap; gap: 10px">
              <button type="button" aria-expanded="false" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: var(--sc-radius, 8px); font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap; border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"></path></svg>Filter</button>
              <button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 16px; border-radius: var(--sc-radius, 8px); font: 600 15px 'Fira Sans', sans-serif; white-space: nowrap; border: 1px solid var(--sc-action-deep, #234a78); background: var(--sc-action, #3669a5); color: #ffffff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Create</button>
            </div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: #5e6168"><nav aria-label="Breadcrumb" style="font-size: 14px; color: #5e6168; display: flex; gap: 8px"><a href="OpHome.dc.html" style="color: #5e6168; text-decoration: none">Northwind rollout Lyon</a><span aria-hidden="true">/</span><a href="#" style="color: #5e6168; text-decoration: none">Boards</a><span aria-hidden="true">/</span><span aria-current="page">Status board</span></nav><span aria-hidden="true">·</span><span>9 open work packages, drag a card to change its status</span></div>
        </section>
        <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
          <button type="button" aria-pressed="true" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; border: 0; background: #1b1c1d; color: #ffffff">Status</button>
          <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d">Assignee</button>
          <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d">Version</button>
          <button type="button" aria-pressed="false" style="display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 19px; font: 600 14px 'Fira Sans', sans-serif; border: 1px solid #c4c7cb; background: #ffffff; color: #1b1c1d">Phase 2 rollout<span style="padding: 1px 7px; border-radius: 10px; font-size: 12px; background: #e4e6ea; color: #3d4047">manual</span></button>
          <span style="flex: 1"></span>
          <label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #5e6168">Show<span style="position: relative; display: inline-flex; align-items: center"><select aria-label="Show" style="appearance: none; height: 36px; box-sizing: border-box; padding: 0 36px 0 12px; border: 1px solid #c4c7cb; border-radius: var(--sc-radius-lg, 10px); background: #ffffff; font: 600 14px 'Fira Sans', sans-serif; color: #1b1c1d"><option>All open</option><option>Mine</option></select><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; right: 12px; color: #5e6168; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg></span></label>
        </div>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; align-items: stretch; flex: 1 1 auto">
          <sc-for list="{{ columns }}" as="col" hint-placeholder-count="5">
            <section aria-label="{{ col.title }}" style="display: flex; flex-direction: column; gap: 10px; min-width: 0; background: #eef0f3; border-radius: var(--sc-radius-lg, 10px); padding: 12px">
              <div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px 4px">
                <span style="flex: none; width: 10px; height: 10px; border-radius: 5px; background: {{ col.fill }}; box-shadow: 0 0 0 2px {{ col.ring }}"></span>
                <h2 style="flex: 1; margin: 0; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ col.title }}</h2>
                <span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: #ffffff; color: #3d4047; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{ col.count }}</span>
                <button type="button" aria-label="Column actions for {{ col.title }}" style="width: 28px; height: 28px; border: 0; border-radius: var(--sc-radius, 8px); background: transparent; color: #5e6168; display: inline-flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M19 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2M5 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2"></path></svg></button>
              </div>
              <sc-for list="{{ col.cards }}" as="c" hint-placeholder-count="3">
                <article style="background: #ffffff; border: 1px solid #e4e6ea; border-radius: var(--sc-radius, 8px); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(27,28,29,0.06)">
                  <span style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: {{ c.typeColor }}">{{ c.type }}</span><a href="{{ c.href }}" style="font-size: 13px; font-weight: 600; color: var(--sc-link, #3669a5); text-decoration: none">#{{ c.id }}</a></span>
                  <a href="{{ c.href }}" style="font-size: 15px; font-weight: 600; color: #1b1c1d; text-decoration: none; line-height: 1.3">{{ c.subject }}</a>
                  <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 2px">
                    <span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #5e6168"><span style="width: 24px; height: 24px; border-radius: 12px; background: #eaf0f7; color: #234a78; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700" title="{{ c.assignee }}">{{ c.initials }}</span>{{ c.first }}</span>
                    <span style="font-size: 13px; font-weight: {{ c.dueWeight }}; color: {{ c.dueColor }}; white-space: nowrap">{{ c.due }}</span>
                  </span>
                </article>
              </sc-for>
              <button type="button" style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border: 1px dashed #c4c7cb; border-radius: var(--sc-radius, 8px); background: transparent; color: #3d4047; font: 600 14px 'Fira Sans', sans-serif; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add card</button>
            </section>
          </sc-for>
        </div>
      </main>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    const TYPE = { EPIC: '#005b77', FEATURE: '#538b28', BUG: '#ab0000', TASK: '#08a5df' };
    const STATUS = { 'new': ['#c3fae8', '#7bf4cc'], 'in development': ['#66d9e8', '#21c8de'], 'in review': ['#d3f9d8', '#8ff09c'], 'on hold': ['#ffc078', '#ff9d2e'], 'needs clarification': ['#fcc2d7', '#f977a6'] };
    const wps = [
      [58440, 'TASK', 'Send OIDC client settings to Lyon', 'new', 'Tom Achterberg', '16 Oct', false],
      [58441, 'TASK', 'Move kick-off to the afternoon', 'new', 'Olivia Brandt', 'no date', false],
      [58455, 'TASK', 'Prepare demo for Malmo Energi', 'new', 'Olivia Brandt', '13 Oct', true],
      [58412, 'FEATURE', 'Link Nextcloud project folders on rollout', 'in development', 'Tom Achterberg', '30 Oct', false],
      [58231, 'BUG', 'Gantt PDF export drops trailing columns', 'in development', 'Priya Raman', '14 Oct', true],
      [57990, 'EPIC', 'Release 16.5 scope', 'in review', 'Olivia Brandt', '23 Oct', false],
      [58390, 'FEATURE', 'Single sign-on through Keycloak', 'in review', 'Tom Achterberg', '23 Oct', false],
      [58102, 'BUG', 'Folder link breaks on rename', 'on hold', 'Priya Raman', 'no date', false],
      [58301, 'TASK', 'Quote for project lead training Kassel', 'needs clarification', 'Olivia Brandt', '16 Oct', false]
    ];
    const order = ['new', 'in development', 'in review', 'on hold', 'needs clarification'];
    const columns = order.map((s) => {
      const cards = wps.filter((w) => w[3] === s).map(([id, type, subject, status, assignee, due, soon]) => ({
        id, type, subject, assignee, due, typeColor: TYPE[type], href: id === 58412 ? 'OpWorkPackage.dc.html' : '#',
        initials: assignee.split(' ').map((w) => w[0]).join(''), first: assignee.split(' ')[0],
        dueColor: soon ? '#ab0000' : '#5e6168', dueWeight: soon ? 600 : 400
      }));
      return { title: s.charAt(0).toUpperCase() + s.slice(1), count: cards.length, fill: STATUS[s][0], ring: STATUS[s][1], cards };
    });
    return { columns };
  }
}
</script>
</body>
</html>
